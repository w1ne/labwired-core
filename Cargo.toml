# firmware-hal-test is a standalone reference example pinned to stm32f1xx-hal.
# It carries its own [profile.release] (opt-level = "z", lto = true) that is
# incompatible with the workspace profile, so it must build out-of-workspace.
#
# examples/esp32s3-* and examples/esp32c3-* require the +esp toolchain and live
# entirely outside the standard workspace toolchain.
exclude = [
    "crates/firmware-hal-test",
    "examples/esp32s3-blinky",
    "examples/esp32s3-hello-world",
    "examples/esp32s3-i2c-tmp102",
    "examples/esp32s3-doomlike-lab",
    "examples/openai-deck-s3",
    "examples/esp32c3-hello-world",
    "examples/esp32-epaper-lab",
    "examples/tier1-fixture/esp32s3",
    "examples/tier1-fixture/esp32",
    "crates/firmware-perf-spin-xtensa",
]
default-members = ["crates/cli", "crates/core", "crates/dap", "crates/loader", "crates/labwired-fuzz"]

[workspace.package]
version = "0.22.1"
edition = "2021"
authors = ["Andrii Shylenko"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
goblin = "0.7"
libc = "0.2"
serialport = "4.9"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
bitflags = "2.4"
human-size = "0.4"
serde_json = "1.0"
sha2 = "0.10"
# Pure-Rust P-256 ECDSA for the ATECC608A secure-element model (digest
# verify/sign). Pure Rust + no_std-friendly, so the wasm browser build is
# unaffected — unlike `ring`, which would drag cc/getrandom into it.
# default-features=false keeps `getrandom` (rand keygen) out of the tree:
# wasm32-unknown-unknown cannot build getrandom without its "js" feature.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
memmap2 = "0.9"
pio = "0.2"
pio-parser = "0.2"
ureq = { version = "2.12", features = ["json"] }

[profile.dev]
panic = "abort"
# The simulator is an interpreter: its hot loop is thousands of tiny generic
# calls (HashMap<u64,u32> register lookups, `Option`/iterator adapters, `Any`
# downcasts) that cost nothing once inlined and cost a call each when not.
# At opt-level 0 that makes debug ~13x slower than release, which is what
# pushes `cargo test --workspace` past the CI timeout. opt-level = 1 turns on
# inlining + mem2reg WITHOUT touching `debug-assertions` or `overflow-checks`,
# so every `debug_assert!` and every std UB precondition check still runs.
opt-level = 1

[profile.release]
panic = "abort"
lto = "thin"
debug = true
# A silent wrap in the simulator's OWN arithmetic is a wrong register value that
# still reports PASS — the exact false-green class this repo exists to close.
# `overflow-checks` defaults to `debug-assertions`, which is false in release, so
# until now everything that ships (the CLI, the wasm engine, the Docker image)
# and four `cargo test --release` CI lanes were blind to it. `profile.bench`
# inherits from here, which is the profile `cargo test --release` actually uses,
# so those lanes are covered by this one key.
#
# Measured cost on this tree (macOS, aarch64, rustc 1.97.1), same work either
# side: the 18-chip Tier-1 matrix ratchet run went 72.53 s -> 73.42 s (+1.2%),
# and an 8M-step nRF52840 Tier-1 run through the CLI went 2.62 s -> 2.60 s of
# user CPU at the minimum of 10 reps. The check is a compare-and-branch on a
# path already dominated by memory traffic, so it disappears into the noise.
#
# This also reaches the firmware crates below, which cross-compile to
# thumbv*/riscv32 — three Tier-1 fixtures (nrf52832, nrf52840, rp2040) are
# workspace members rather than standalone crates, so their ELF bytes move.
# tests/fixtures/tier1/MANIFEST.json therefore needs regenerating; that gate is
# already red on main for all eighteen blobs (nightly run 31292884206), so this
# does not newly break it, but whoever regenerates must do it after this lands.
overflow-checks = true

# Per-package release overrides for embedded firmware crates and CI fixtures.
# These build for thumbv*/riscv32 targets and want size-optimized binaries
# (opt-level = "s") with single-codegen-unit for cleaner inlining. Cargo does
# not support globs or inheritance in profile sections, so each crate gets
# its own block. Keep alphabetical.
[profile.release.package.firmware-ci-fixture]
codegen-units = 1
opt-level = "s"

[profile.release.package.firmware-uart-echo-fixture]
codegen-units = 1
opt-level = "s"

