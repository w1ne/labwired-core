# Cortex-M0+ smoke against the imported EFM32ZG222 platform. Renode's
# efm32zg222.repl maps the Series-0 GPIO block and two TIMERs (IRQ 2/7);
# the firmware (firmware-efm32zg222-smoke) runs the checks shared with the
# EFM32GG995 smoke (s0.rs) over USART1 as the console: GPIO push-pull on the
# STK LED0/LED1 pins, DISABLED/INPUTPULL/WIREDAND/WIREDOR/PINLOCKN, TIMER0 UP
# overflow + NVIC line 2, TIMER1 DOWN one-shot. LED0 (pc10) toggles in
# the idle loop on TIMER0 overflows. Summary word at 0x20000F00.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-efm32zg222-smoke"
  system: "(temporary system: chip ./efm32zg222-negctl.yaml)"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EFM32ZG222 RENODE SMOKE"
  - uart_ordered:
      - "gpio pc10/pc11 pushpull set=1 tgl=1 clr=1 wo=1 ok"
      - "gpio pa0 disabled_din0=1 pullup=1 pulldown=1 ok"
      - "gpio pa1 wiredand pa2 wiredor hi=3 lo=0 ok"
      - "gpio pa pinlockn reset=ffff after=fffe ok"
      - "tim0 up of=1 pend=1 released=1 running=1 ok"
      - "tim1 down oneshot dir=1 stopped=1 if=2 cnt=00c8 ok"
      - "EFM32ZG PASS"
  - gpio_edges:
      pin: "gpioc:10"
      min_edges: 4
  - memory_value:
      address: 0x20000F00
      expected_value: 0xEF32003F
      size: 4
  - expected_stop_reason: max_steps
