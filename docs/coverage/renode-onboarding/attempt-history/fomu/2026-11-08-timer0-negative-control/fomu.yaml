name: fomu
arch: riscv
core: rv32im
flash:
  # The 8 KiB ROM at zero is the only executable window in this profile.
  # The board's SPI flash and controller are outside the bounded smoke.
  base: 0x00000000
  size: "8KB"
flash_boot_alias: false
ram:
  base: 0x10000000
  size: "128KB"
# Renode `cpus/fomu.repl` timer0: LiteX_Timer @ 0x60002800 (shadow
# 0xE0002800 not mapped). Foboot's generated csr.h uses csr_data_width = 8.
# Its IRQ (cpu@0) is not wired into the core here; the smoke polls the event
# CSRs. ValentyUSB, PicoRV_SPI + MT25Q flash, and the tagged CTRL/TOUCH/
# REBOOT/RGB/VERSION pages are not modelled and stay unmapped.
peripherals: []
