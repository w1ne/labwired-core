# Cortex-M3 smoke against the imported EFM32GG995 (Giant Gecko) platform.
# Bare-register firmware (firmware-efm32gg995-smoke) checks what Renode's
# efm32gg995.repl (+ efm32gg942.repl) maps and the chip descriptor claims:
# UART0/UART1/USART1/USART2 each send one line with STATUS.TXBL set, then
# USART0 is the console for the Series-0 GPIO ports (`efm32s0_gpioport`:
# DOUTSET/CLR/TGL, DIN reading push-pull outputs, DISABLED reading 0,
# INPUTPULL rails, open-drain WIREDANDPULLUP and open-source WIREDOR,
# clear-only PINLOCKN) and TIMER0..TIMER3 (`efm32s0_timer`: UP overflow
# pending NVIC line 2 and IFC releasing it, DOWN one-shot underflow, CC0
# output compare + TOPB buffer load, UP/DOWN turning at TOP and 0). PE2
# (STK3700 LED0) toggles in the idle loop on TIMER0 overflows. Summary word
# at 0x2001FF00.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-efm32gg995-smoke"
  system: "../../configs/systems/onboarding/efm32gg995.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EFM32GG995 RENODE SMOKE"
  - uart_ordered:
      - "uart0 status=40 ok"
      - "uart1 status=40 ok"
      - "usart1 status=40 ok"
      - "usart2 status=40 ok"
      - "EFM32GG995 RENODE SMOKE"
      - "gpio pe2/pe3 pushpull set=1 tgl=1 clr=1 wo=1 ok"
      - "gpio pa0 disabled_din0=1 pullup=1 pulldown=1 ok"
      - "gpio pa1 wiredand pa2 wiredor hi=3 lo=0 ok"
      - "gpio pa pinlockn reset=ffff after=fffe ok"
      - "tim0 up of=1 pend=1 released=1 running=1 ok"
      - "tim1 down oneshot dir=1 stopped=1 if=2 cnt=00c8 ok"
      - "tim2 cc0 hit=1 topbv=1 of=1 top=03e8->01f4 ok"
      - "tim3 updown of=1 dir_down=1 uf=1 up_again=1 ok"
      - "EFM32GG PASS"
  - gpio_edges:
      pin: "gpioe:2"
      min_edges: 4
  - memory_value:
      address: 0x2001FF00
      expected_value: 0xEF3200FF
      size: 4
  - expected_stop_reason: max_steps
  - memory_value: { address: 0x4000CC00, expected_value: 0 }
  - memory_value: { address: 0x4000CE00, expected_value: 0 }
