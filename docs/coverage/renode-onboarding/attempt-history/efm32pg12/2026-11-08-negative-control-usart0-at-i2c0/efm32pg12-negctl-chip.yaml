name: efm32pg12-negctl
arch: arm
# The imported memory map and model-backed USART0 are the only advertised
# execution surfaces exercised by the exact-system smoke.
flash:
  base: 134217728
  size: 1048576B
ram:
  base: 536870912
  size: 262144B
peripherals:
- id: usart0
  type: efm32_uart
  bus: sysbus
  base_address: 0x4000C000
