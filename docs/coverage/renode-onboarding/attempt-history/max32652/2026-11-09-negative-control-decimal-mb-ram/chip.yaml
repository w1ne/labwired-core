# Analog Devices (Maxim) MAX32652, Cortex-M4F. Sources: Renode
# platforms/cpus/max32652.repl (memory map, instance bases) and the MSDK
# MAX32650 headers (Libraries/CMSIS/Device/Maxim/MAX32650/Include:
# uart_regs.h, gpio_regs.h).
# - flash: 3 MiB at 0x10000000; SRAM: 1 MiB at 0x20000000.
# - uart0..uart2: MAX32650 UART (STAT 0x08, FIFO 0x1C). Polled only: the
#   max32650 UART profile has no interrupt lines, so Renode's NVIC 14/15/34
#   are not declared.
# - port0..port3: MAX32650 GPIO (EN/OUT_EN/OUT, IN, IN_EN, PDPU_SEL pulls).
#   Named port* (not gpio*) so the Nordic GPIOTE pass stays off. Port 3 has
#   10 pins on silicon; the model answers for 32. GPIO interrupts are not
#   modelled, so Renode's NVIC 24-27/54 are not declared.
# Not declared (no model in this engine): GCR, WDT0/1, TMR0-5, TPU, I2C0/1,
# ADC, SPI0-3, RTC, PWRSEQ, DMA, flash controller, caches, USB, TRNG, SDHC,
# SPIXF/SPIXR/HyperBus and the external memory windows.
name: max32652
arch: arm
core: cortex-m4
flash:
  base: 0x10000000
  size: 3MB
ram:
  base: 0x20000000
  size: 1MB
peripherals:
- id: uart0
  type: max32650_uart
  base_address: 0x40042000
  size: 4KB
- id: uart1
  type: max32650_uart
  base_address: 0x40043000
  size: 4KB
- id: uart2
  type: max32650_uart
  base_address: 0x40044000
  size: 4KB
- id: port0
  type: gpio
  base_address: 0x40008000
  size: 4KB
  config:
    profile: max32650
- id: port1
  type: gpio
  base_address: 0x40009000
  size: 4KB
  config:
    profile: max32650
- id: port2
  type: gpio
  base_address: 0x4000A000
  size: 4KB
  config:
    profile: max32650
- id: port3
  type: gpio
  base_address: 0x4000B000
  size: 4KB
  config:
    profile: max32650
