name: renesas-da14592
arch: arm
# DA14592's primary application core and memory map follow Renode's
# platforms/cpus/renesas-da14592.repl. The auxiliary Cortex-M0+ CMAC core and
# all other peripherals are outside this single-core profile. Keep only the
# model-backed DA UART0 window used by the onboarding smoke.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/renesas-da14592.repl
core: cortex-m33
flash:
  base: 0x00000000
  size: 288KB
ram:
  base: 0x20000000
  size: 96KB
peripherals:
- id: uart0
  type: renesasda14_uart
  bus: sysbus
  base_address: 0x50020000
