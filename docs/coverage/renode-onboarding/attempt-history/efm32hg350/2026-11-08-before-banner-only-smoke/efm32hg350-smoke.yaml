# Cortex-M0+ compatible USART0 smoke against the imported EFM32HG350 system.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-efm32hg350-smoke"
  system: "../../configs/systems/onboarding/efm32hg350.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "EFM32HG350 USART0 smoke"
  - expected_stop_reason: max_steps
