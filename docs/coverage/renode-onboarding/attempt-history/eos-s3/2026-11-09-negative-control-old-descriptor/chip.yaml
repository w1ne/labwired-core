# Bounded Cortex-M4F + memory + PL011 execution profile based on Renode's
# platforms/cpus/eos-s3.repl. Its 512 KiB M4 memory is mapped at 0 and mirrored
# at 0x20000000; this descriptor exposes the tested code and SRAM windows.
name: eos-s3
arch: arm
flash:
  base: 0
  size: 524288B
ram:
  base: 536870912
  size: 524288B
peripherals:
- id: uart
  type: pl011
  bus: sysbus
  base_address: 1073807360
