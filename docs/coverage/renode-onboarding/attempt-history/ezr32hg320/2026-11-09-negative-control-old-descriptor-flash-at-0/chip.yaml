name: ezr32hg320
arch: arm
# Keep only the imported Cortex-M0+ memory map and modeled USART0 used by the
# onboarding smoke. Other generated peripheral windows are not claimed.
core: cortex-m0+
flash:
  base: 0
  size: 65536B
ram:
  base: 536870912
  size: 8192B
peripherals:
- id: usart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073790976
