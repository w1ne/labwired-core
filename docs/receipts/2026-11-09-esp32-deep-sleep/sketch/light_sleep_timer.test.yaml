schema_version: "1.0"
inputs:
  firmware: .pio/build/light/firmware.elf
  system: ../../../../configs/systems/esp32-devkitc-32e-gpio-smoke.yaml
limits:
  max_steps: 200000000
  wall_time_ms: 300000
  max_uart_bytes: 65536
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
assertions:
  - uart_contains: "LW_LS_OK"
