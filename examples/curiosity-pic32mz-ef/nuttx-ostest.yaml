# LabWired - Curiosity PIC32MZ EF 2.0: stock upstream NuttX ostest
#
# Unmodified apache/nuttx 7956039dfd + nuttx-apps 1f8cac8b87 (2026-10-08)
# `testing/ostest` as the init task, for the out-of-tree board in
# crates/firmware-curiosity-pic32mz-nuttx (rebuild: build.sh ostest).
#
# 34 test groups: vfork, task_restart, waitpid, mutexes (timed, recursive,
# robust), cancellation, semaphores (timed, named), condition variables,
# pthread_exit/rwlock/cleanup, message queues, signals (nested handlers),
# POSIX timers, spinlocks, watchdogs, round-robin scheduling, barriers,
# priority inheritance and the scheduler lock.
#
# MANUAL, not in CI: about 10 minutes of wall time here (measured
# 2026-11-01). ostest's priority inheritance and round-robin tests spin the
# CPU by design (`hog_cpu()` counts a volatile int to INT_MAX), so most of
# the run is billions of real instructions, not idle time.
schema_version: "1.2"
inputs:
  firmware: "../../tests/fixtures/curiosity-pic32mz-ef-nuttx-ostest.elf"
  system: "system.yaml"
limits:
  max_steps: 40000000000
  wall_time_ms: 1500000
assertions:
  - uart_contains: "ostest_main: Exiting with status 0"
