# Arduino matrix system — Arduino UNO R4 WiFi (R7FA4M1AB @ 48 MHz HOCO).
# Serial = SCI9 on P109/P110 (the ESP32-S3 USB bridge; the variant builds
# with NO_USB); LED_BUILTIN = D13 = P102.
# L5: A0 (P014 = AN009) wired to the 3V3 header pin. ADC140 converts at 14
# bits against the 5 V AVCC0, so stock analogRead(A0) must return exactly
# 675 (10-bit).
# L3: INA219 at 0x40 on Wire = IIC1 (A4/A5 = P101 SDA1 / P100 SCL1).
# L4: MAX31855 on SPI = SPI0 (D11/D12/D13 = P411 MOSIA / P410 MISOA / P102
# RSPCKA); CS = SS = D10 = P103. SPI0 does not drive SSL, so the kit frames
# on its soft-CS path.
name: "arduino-matrix-arduino-uno-r4-wifi-can-stub"
chip: "r7fa4m1ab-uno-r4-wifi-can-stub.yaml"
external_devices:
  - id: "ina219"
    type: "ina219"
    connection: "iic1"
    config:
      i2c_address: 0x40
  - id: "max31855"
    type: "max31855"
    connection: "spi0"
    config:
      cs_pin: "P103"
peripherals:
  - id: "adc0"
    type: "ra_adc12"
    base_address: 0x4005C000
    size: "512B"
    config:
      clock_hz: 48000000
      elc_event: 41
      vref_mv: 5000
      adc14: true
      input_mv: { 9: 3300 }
board_io: []
