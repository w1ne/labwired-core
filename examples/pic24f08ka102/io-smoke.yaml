#
# Boot the real XC16 UART firmware and receive "HI" from U1TXREG (0x0224).
# The program then toggles RA0 forever, so the run ends at max_steps.
schema_version: "1.0"
inputs:
  firmware: "./firmware/pic24f08ka102-xc16-uart-smoke.elf"
  system: "./system.yaml"
limits:
  max_steps: 400
assertions:
  - uart_contains: "HI"
  - expected_stop_reason: max_steps
