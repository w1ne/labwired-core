# LabWired - LiteX VexRiscv IO smoke
#
# Build: cargo build -p firmware-litex-vexriscv-smoke --release --target riscv32im-unknown-none-elf
#
# The firmware boots from the SoC's SRAM and prints over the LiteX UART. It
# runs the modelled LiteX timer as a one-shot (`timer=running` → `timer=zero`,
# which only appears if the countdown reached zero), reads back a declared-stub
# window (`spi=00000000`), and its heartbeat's `txfull=` field is READ BACK
# from the UART CSR after the TX-ready poll.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32im-unknown-none-elf/release/firmware-litex-vexriscv-smoke"
  system: "./system.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "LITEX VEXRISCV SMOKE"
  - uart_ordered:
      - "cpu=rv32im uart=litex"
      - "spi=00000000"
      - "timer=running"
      - "timer=zero"
      - "hb=0 txfull=00000000"
      - "hb=1 txfull=00000000"
      - "hb=2 txfull=00000000"
      - "hb=3 txfull=00000000"
  - expected_stop_reason: max_steps
