# Generic MNA devices on the LiteX GPIOIn pins of the Zephyr enjoydigital
# litex_vexriscv board (gpio_in @ 0xE0006000): a Beta NTC divider on pin 0 and
# a Shockley diode load line on pin 1, through the descriptor's assumed 3.3 V
# Schmitt thresholds. This is a digital-input route, not an ADC claim: the SoC
# has no ADC. The firmware (crates/firmware-litex-vexriscv-smoke, bin
# `litex-vexriscv-gpio-in`) prints the `in` CSR on the LiteX UART.
name: "litex-vexriscv-analog"
chip: "../../configs/chips/litex-vexriscv.yaml"
debug_uart: "uart"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.gpio_in.gpio_in.0"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.gpio_in.gpio_in.1"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
