# LabWired - Pico 2 (RP2350) UART smoke test.
# UART0 output is captured from its RP2350 PL011 data register.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-pico2-demo"
  system: "../../configs/systems/pico2.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "PICO2_SMOKE_OK"
  - expected_stop_reason: max_steps
