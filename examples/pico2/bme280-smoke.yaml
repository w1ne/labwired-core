# RP2350 I2C0 transaction to the BME280 component on the Pico 2 board profile.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-rp2350-pico2-bme280-smoke"
  system: "../../configs/systems/rp2350-pico2-bme280.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "PICO2_BME280_OK ID=0x60 TEMP_RAW=0x082DC0 I2C0=GP4/GP5"
  - gpio_edges:
      pin: "sio:25"
      min_edges: 4
  - expected_stop_reason: max_steps
