# LabWired - Pico 2 (RP2350) UART and onboard LED smoke test.
# Firmware: firmware-pico2-demo (UART0 register output + SIO GPIO25 edges).
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-pico2-demo"
  system: "../../configs/systems/pico2.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "PICO2_SMOKE_OK"
  - gpio_edges:
      pin: "sio:25"
      min_edges: 8
  - expected_stop_reason: max_steps
