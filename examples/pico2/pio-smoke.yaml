# Pico 2 (RP2350) PIO0 state-machine smoke on the onboard GP25 LED.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-pico2-demo"
  system: "../../configs/systems/pico2.yaml"
limits:
  max_steps: 50500
assertions:
  - uart_contains: "PICO2_PIO_OK"
  - gpio_edges:
      pin: "sio:25"
      min_edges: 16
  - expected_stop_reason: max_steps
