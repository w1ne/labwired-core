# Arduino Nano ESP32 plus BME280: assert I2C0 sensor ID and temperature reads.
schema_version: "1.0"
inputs:
  firmware: "../../target/xtensa-esp32s3-none-elf/release/firmware-arduino-nano-esp32-bme280-smoke"
  system: "../../configs/systems/arduino-nano-esp32-bme280.yaml"
limits:
  max_steps: 1500000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "BME280_TEMP_RAW=0x082DC0"
  - expected_stop_reason: max_steps
