[platformio]
default_envs = nano_esp32

[env:nano_esp32]
platform = espressif32@8.0.0
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Use the Nano board definition (flash, clocks, USB IDs), but the generic S3
; Arduino variant. The Nano's variant constructor runs a boot-button/RGB
; recovery sequence outside this smoke's modeled system. The sketch uses raw
; ESP32 GPIO numbers, not Nano Arduino pin aliases.
board_build.variant = esp32s3
board_build.arduino.memory_type = qio_qspi
; This profile does not exercise the Nano's OPI PSRAM, USB CDC/DFU, or pin
; remapping. Disable CDC so `Serial` uses the modeled UART0 console.
build_unflags = -DBOARD_HAS_PSRAM -DARDUINO_USB_DFU_ON_BOOT=1 -DBOARD_HAS_PIN_REMAP -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_NANO_ESP32
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
