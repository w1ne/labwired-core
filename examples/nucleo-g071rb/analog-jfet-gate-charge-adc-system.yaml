# Generic level-1 JFET gate-junction depletion charge on ADC1 IN6, with an
# uncharged reference on IN7. The NTC and Shockley diode occupy IN4/IN5.
name: nucleo-g071rb-jfet-gate-charge-adc
chip: ../../configs/chips/stm32g071.yaml
external_devices: []
board_io: []
cosim_models:
  - id: jfet_gate_charge_adc
    adapter: analog
    step_ns: 1000
    inputs:
      drive_voltage: ui.jfet_gate.drive_v
    outputs:
      gate_voltage: adc.adc1.6_volts
    config:
      netlist_text: |
        Vdrive drive 0 dc 3.3
        Vdrain drain 0 dc 3.3
        Vsource source 0 dc 3.3
        Rgate drive gate 1k
        J1 drain gate source NJF_CAP
        .model NJF_CAP NJF(VTO=-2 BETA=500u IS=1e-30 CGS=1n CGD=1n PB=1 FC=0.5)
      probes:
        gate_voltage: v(gate)
      sources:
        drive_voltage: Vdrive
      vdd: 3.3
  - id: jfet_gate_no_charge_control_adc
    adapter: analog
    step_ns: 1000
    inputs:
      drive_voltage: ui.jfet_gate.drive_v
    outputs:
      gate_voltage: adc.adc1.7_volts
    config:
      netlist_text: |
        Vdrive drive 0 dc 3.3
        Vdrain drain 0 dc 3.3
        Vsource source 0 dc 3.3
        Rgate drive gate 1k
        J1 drain gate source NJF_REF
        .model NJF_REF NJF(VTO=-2 BETA=500u IS=1e-30 PB=1 FC=0.5)
      probes:
        gate_voltage: v(gate)
      sources:
        drive_voltage: Vdrive
      vdd: 3.3
