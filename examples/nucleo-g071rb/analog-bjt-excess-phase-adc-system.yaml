# Matched generic Gummel–Poon NPN stages route Weil excess-phase response to
# ADC1 IN6/IN7, beside the unrelated Beta NTC and Shockley diode on IN4/IN5.
name: nucleo-g071rb-bjt-excess-phase-adc
chip: ../../configs/chips/stm32g071.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_excess_phase_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_ptf.base_v
    outputs:
      collector_voltage: adc.adc1.6_volts
    config:
      substeps: 20
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase base 0 dc 0
        Q1 collector base 0 NPN_PTF temp=27
        .model NPN_PTF NPN(IS=1e-15 BF=100 TF=1u PTF=90)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_excess_phase_control_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_ptf.base_v
    outputs:
      collector_voltage: adc.adc1.7_volts
    config:
      substeps: 20
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase base 0 dc 0
        Q1 collector base 0 NPN_CONTROL temp=27
        .model NPN_CONTROL NPN(IS=1e-15 BF=100 TF=1u)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
