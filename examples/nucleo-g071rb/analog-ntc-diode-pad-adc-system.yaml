# Generic Beta NTC and Shockley diode routed through STM32G071RB LQFP64 pads
# PA4/ADC1_IN4 and PA5/ADC1_IN5. The pad aliases follow DS12232 Table 12.
name: nucleo-g071rb-analog-pad-adc
chip: ../../configs/chips/stm32g071.yaml
external_devices: []
board_io: []
cosim_models:
  - id: ntc_divider_pa4
    adapter: analog
    step_ns: 1000
    inputs:
      temperature: ui.ntc.temperature_c
    outputs:
      v_sense: board.analog.pa4_volts
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: v(sense)
      sources:
        temperature: Rntc
      vdd: 3.3
  - id: diode_load_line_pa5
    adapter: analog
    step_ns: 1000
    outputs:
      v_diode: board.analog.pa5_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: v(sense)
      vdd: 3.3
