# Matched generic level-1 NJF branches routed to explicit STM32G071 ADC1
# channels. The model-card RD/RS branches exercise intrinsic terminal drops;
# no PAx-to-channel alias or silicon capture is claimed.
name: nucleo-g071rb-analog-jfet-terminal-resistance-adc
chip: ../../configs/chips/stm32g071.yaml
external_devices: []
board_io: []
cosim_models:
  - id: jfet_terminal_resistance_adc
    adapter: analog
    step_ns: 1000
    inputs:
      gate_voltage: ui.jfet.gate_v
    outputs:
      control_drain: adc.adc1.6_volts
      drain_resistance_drain: adc.adc1.7_volts
      source_resistance_drain: adc.adc1.8_volts
      both_resistances_drain: adc.adc1.9_volts
    config:
      netlist_text: |
        Vdd supply 0 dc 3.3
        Vgate gate 0 dc 0
        Rload_control supply drain_control 1k
        Jcontrol drain_control gate 0 NJF_CONTROL
        .model NJF_CONTROL NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30)
        Rload_drain supply drain_rd 1k
        Jdrain drain_rd gate 0 NJF_DRAIN
        .model NJF_DRAIN NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RD=200)
        Rload_source supply drain_rs 1k
        Jsource drain_rs gate 0 NJF_SOURCE
        .model NJF_SOURCE NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RS=200)
        Rload_both supply drain_both 1k
        Jboth drain_both gate 0 NJF_BOTH
        .model NJF_BOTH NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RD=200 RS=200)
      probes:
        control_drain: v(drain_control)
        drain_resistance_drain: v(drain_rd)
        source_resistance_drain: v(drain_rs)
        both_resistances_drain: v(drain_both)
      sources:
        gate_voltage: Vgate
      vdd: 3.3
