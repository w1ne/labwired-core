# Generic Gummel–Poon NPN branches isolate base-emitter depletion,
# base-collector depletion and forward transit charge through STM32G071 ADC1.
# The 10 nF junction capacitances make charge behavior visible at the 1 us
# fixture step; this is a physics stress case, not a typical small-signal card.
name: nucleo-g071rb-bjt-charge-adc
chip: ../../configs/chips/stm32g071.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_charge_reference_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_charge.base_v
    outputs:
      collector_voltage: adc.adc1.6_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_base_emitter_charge_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_charge.base_v
    outputs:
      collector_voltage: adc.adc1.7_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 CJE=10n VJE=0.7 MJE=0.33 FC=0.5)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_base_collector_charge_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_charge.base_v
    outputs:
      collector_voltage: adc.adc1.8_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 CJC=10n VJC=0.7 MJC=0.33 FC=0.5)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_forward_transit_charge_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_charge.base_v
    outputs:
      collector_voltage: adc.adc1.9_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TF=100n)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_combined_charge_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_charge.base_v
    outputs:
      collector_voltage: adc.adc1.10_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 CJE=10n VJE=0.7 MJE=0.33 CJC=10n VJC=0.7 MJC=0.33 FC=0.5 TF=100n)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
