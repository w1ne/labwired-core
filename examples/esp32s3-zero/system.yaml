# LabWired — Waveshare ESP32-S3-Zero, FH4R2 option.
# The onboard WS2812 DIN is GPIO21. The USB-C connector, Wi-Fi, BLE, and PSRAM
# are outside this profile.
name: "esp32s3-zero"
chip: "../../configs/chips/esp32s3-zero.yaml"
debug_uart: "uart0"
external_devices:
  - id: "status_neopixel"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO21"
      num_pixels: 1
      cpu_hz: 240000000
board_io: []
