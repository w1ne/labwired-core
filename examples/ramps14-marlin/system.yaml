# RAMPS 1.4 (EFB) on an Arduino Mega 2560 with a RepRapDiscount Full Graphic
# Smart Controller, wired as stock Marlin 2.1.2.x pins_RAMPS.h resolves it.
#
# Steppers: A4988-class STEP/DIR/EN twins (active-low EN). Each axis carries a
# travel stop at its MIN end that drives the MIN endstop input: the endstops are
# normally-closed switches to GND (pin LOW in travel, HIGH when hit, matching
# `*_MIN_ENDSTOP_HIT_STATE HIGH`). Y has INVERT_Y_DIR, so Marlin's Y- is the
# motor's positive direction and its MIN switch sits at the motor's max_steps.
#
# Heaters and thermistors: models/thermal_plant.py, one thermal mass per
# heater driven by its MOSFET gate pin (hotend D10/PB4, bed D8/PH5), read back
# through the RAMPS T0/T1 divider (100 k EPCOS NTC, B25/100 = 4092 K, to GND
# with a 4.7 k pull-up to 5 V) on ADC13 / ADC14.
name: "ramps14-marlin"
chip: "../../configs/chips/atmega2560.yaml"
cpu_hz: 16000000
external_devices:
  - id: "x_driver"
    type: "a4988"
    connection: "gpio"
    config:
      step_pin: "PF0"   # D54
      dir_pin: "PF1"    # D55
      en_pin: "PD7"     # D38
      initial_steps: 1600   # 20 mm at 80 steps/mm
      min_steps: 0
      min_limit_pin: "PE5"  # X_MIN, D3
      limit_active_high: true
  - id: "y_driver"
    type: "a4988"
    connection: "gpio"
    config:
      step_pin: "PF6"   # D60
      dir_pin: "PF7"    # D61
      en_pin: "PF2"     # D56
      initial_steps: -1600  # 20 mm from the MIN switch (inverted DIR)
      max_steps: 0
      max_limit_pin: "PJ1"  # Y_MIN, D14
      limit_active_high: true
  - id: "z_driver"
    type: "a4988"
    connection: "gpio"
    config:
      step_pin: "PL3"   # D46
      dir_pin: "PL1"    # D48
      en_pin: "PK0"     # D62
      initial_steps: 800    # 2 mm at 400 steps/mm
      min_steps: 0
      min_limit_pin: "PD3"  # Z_MIN, D18
      limit_active_high: true
  - id: "e0_driver"
    type: "a4988"
    connection: "gpio"
    config:
      step_pin: "PA4"   # D26
      dir_pin: "PA6"    # D28
      en_pin: "PA2"     # D24
  # RRD Full Graphic Smart Controller LCD: ST7920 in serial mode, bit-banged
  # by Marlin on EXP1 (CS = LCD_PINS_RS D16, SID = LCD_PINS_EN D17,
  # SCLK = LCD_PINS_D4 D23). CS is active high in serial mode.
  - id: "lcd"
    type: "st7920"
    connection: "spi_gpio"
    config:
      sck: "PA1"
      mosi: "PH0"
      cs: "PH1"
      cs_active: "high"
  # SD card on the controller, hardware SPI D50..D53, SDSS = D53. The FAT16
  # image is generated by make_sd_image.py (not committed).
  - id: "sd"
    type: "microsd"
    connection: "spi"
    config:
      cs_pin: "PB0"
      image: "./sd.img"
  - id: "encoder"
    type: "rotary_encoder"
    connection: "gpio"
    config:
      clk_pin: "PC6"    # BTN_EN1, D31
      dt_pin: "PC4"     # BTN_EN2, D33
      cpu_hz: 16000000
board_io:
  - id: "hotend_heater"   # MOSFET A, D10
    kind: "pwm_output"
    peripheral: "portb"
    pin: 4
    signal: "output"
    active_high: true
  - id: "part_fan"        # MOSFET B, D9
    kind: "pwm_output"
    peripheral: "porth"
    pin: 6
    signal: "output"
    active_high: true
  - id: "bed_heater"      # MOSFET C, D8
    kind: "pwm_output"
    peripheral: "porth"
    pin: 5
    signal: "output"
    active_high: true
  - id: "beeper"          # EXP1-1, D37
    kind: "led"
    peripheral: "portc"
    pin: 0
    signal: "output"
    active_high: true
  - id: "enc_click"       # BTN_ENC, D35, active low
    kind: "button"
    peripheral: "portc"
    pin: 2
    signal: "input"
    active_high: false
  - id: "kill_button"     # EXP2-8, D41, active low
    kind: "button"
    peripheral: "portg"
    pin: 0
    signal: "input"
    active_high: false
  - id: "sd_detect"       # EXP2-7, D49, LOW = card inserted
    kind: "button"
    peripheral: "portl"
    pin: 0
    signal: "input"
    active_high: false
cosim_models:
  # Hotend and bed as thermal masses heated through their MOSFET gates (PB4,
  # PH5), read back through the RAMPS NTC dividers on ADC13 / ADC14.
  - id: "thermal"
    adapter: "external_process"
    model: "./models/thermal_plant.py"
    step_ns: 1000000
    inputs:
      hotend_gate: "board.gpio.pb4"
      bed_gate: "board.gpio.ph5"
      hotend_probe_detached: "ui.hotend.probe_detached"
    outputs:
      hotend_v: "adc.adc.13_volts"
      bed_v: "adc.adc.14_volts"
    config:
      protocol: "jsonl"
