# Generic NTC divider and Shockley diode on the Discovery Kit's Raspberry Pi
# header, read through MSS GPIO_2.
#
# Route (reference design polarfire-soc-discovery-kit-reference-design
# @a84023d1, the "reference-rtl-v2507" design Linux's mpfs-disco-kit.dts
# names): MSS GPIO_2 is on the fabric (MPFS_DISCOVERY_KIT_MSS.cfg), and
# MPFS_DISCOVERY_KIT.tcl wires GPIO_2_0_IO to RPI_GPIO4 (ball E12) and
# GPIO_2_1_IO to RPI_GPIO17 (ball G18). MPFS_DISCOVERY_RPi.pdc puts both on
# LVCMOS33; they are Bank 1 pads at 3.3 V. Another FPGA design can route
# GPIO_2 elsewhere: this file describes that reference bitstream only.
#
# Firmware sees the levels in GPIO_IN (0x2012_2084) once GPIO_CFG[n].INREG is
# set. The header pins are digital pads, not an ADC: the firmware-visible
# result is the level against the LVCMOS33 limits (VIL 0.8 V, VIH 2.0 V).
name: "mpfs-disco-kit-analog-inputs"
chip: "../../configs/chips/mpfs095t.yaml"
external_devices: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.gpio_in.mss_gpio2.0"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.gpio_in.mss_gpio2.1"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
