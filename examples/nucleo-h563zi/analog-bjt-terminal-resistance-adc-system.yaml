    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.9_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Rcollector collector intrinsic_collector 150
        Q1 intrinsic_collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_explicit_emitter_resistor_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.10_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Remitter 0 intrinsic_emitter 100
        Q1 collector base intrinsic_emitter NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: v(collector)
      sources:
