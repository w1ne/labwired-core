# Generic Gummel-Poon terminal resistances on explicit STM32H563 ADC1 inputs.
# Model-card RB/RC/RE branches are paired with equivalent external resistor
# networks so each terminal resistance is checked independently.
name: nucleo-h563zi-analog-bjt-terminal-resistance-adc
chip: ../../configs/chips/stm32h563.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_no_terminal_resistance_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.2_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_base_resistance_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.3_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RB=1k)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_collector_resistance_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.4_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RC=150)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_emitter_resistance_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.5_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RE=100)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_all_terminal_resistances_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.6_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RB=1k RC=150 RE=100)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_explicit_all_terminal_resistors_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.7_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Rbase base intrinsic_base 1k
        Rcollector collector intrinsic_collector 150
        Remitter 0 intrinsic_emitter 100
        Q1 intrinsic_collector intrinsic_base intrinsic_emitter NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_explicit_base_resistor_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_terminal.base_v
    outputs:
      collector_voltage: adc.adc1.8_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Rbase base intrinsic_base 1k
        Q1 collector intrinsic_base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
