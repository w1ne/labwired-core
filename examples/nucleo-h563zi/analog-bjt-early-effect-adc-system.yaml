# Matched generic Gummel–Poon NPN load lines routed to explicit H563 ADC1
# co-simulation channels. No physical pad alias or silicon parity is claimed.
name: nucleo-h563zi-analog-bjt-early-effect-adc
chip: ../../configs/chips/stm32h563.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_early_effect_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: adc.adc1.2_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_EARLY
        .model NPN_EARLY NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_without_early_effect_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: adc.adc1.3_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-15 BF=100 BR=4)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
