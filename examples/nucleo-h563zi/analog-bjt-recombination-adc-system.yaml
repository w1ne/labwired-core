# Generic Gummel–Poon NPN branches route base-emitter/base-collector
# recombination to explicit H563 ADC1 co-simulation channels. No physical
# pad alias or silicon ADC parity is claimed.
name: nucleo-h563zi-analog-bjt-recombination-adc
chip: ../../configs/chips/stm32h563.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_recombination_reference_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_recombination.base_v
    outputs:
      collector_voltage: adc.adc1.2_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_base_emitter_recombination_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_recombination.base_v
    outputs:
      collector_voltage: adc.adc1.3_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_BE_RECOMBINATION
        .model NPN_BE_RECOMBINATION NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 ISE=2p NE=1.5)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_base_collector_recombination_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_recombination.base_v
    outputs:
      collector_voltage: adc.adc1.4_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_BC_RECOMBINATION
        .model NPN_BC_RECOMBINATION NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 ISC=500p NC=2)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_combined_recombination_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_recombination.base_v
    outputs:
      collector_voltage: adc.adc1.5_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_BOTH_RECOMBINATION
        .model NPN_BOTH_RECOMBINATION NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 ISE=2p NE=1.5 ISC=500p NC=2)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
