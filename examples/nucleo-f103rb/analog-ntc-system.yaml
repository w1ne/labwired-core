# NUCLEO-F103RB with a temperature-driven NTC divider routed to ADC1_IN0.
# This is a separate manifest so the basic GPIO/UART smoke stays minimal.
name: "nucleo-f103rb-analog-ntc"
chip: "../../configs/chips/stm32f103rb.yaml"
external_devices: []
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 100000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa0_volts"
    config:
      vdd: 3.3
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
