# Generic matched Gummel–Poon NPN load lines routed through NUCLEO-F103RB ADC1.
# The pair shares a base stimulus and differs only by finite forward Early voltage.
name: "nucleo-f103rb-analog-bjt-early-effect"
chip: "../../configs/chips/stm32f103rb.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_early_effect"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt.base_v"
    outputs:
      collector_voltage: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_EARLY
        .model NPN_EARLY NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_without_early_effect"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt.base_v"
    outputs:
      collector_voltage: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-15 BF=100 BR=4)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
