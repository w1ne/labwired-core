# Generic level-1 JFET gate-junction depletion charge resolves through the
# bare STM32F103 profile's PA2/PA3 ADC1 routes. A matched zero-charge JFET is
# the transient control; unrelated NTC and diode netlists stay on PA0/PA1.
name: "stm32f103-jfet-gate-charge-adc"
chip: "../../configs/chips/stm32f103.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "jfet_gate_charge"
    adapter: "analog"
    step_ns: 1000
    inputs:
      drive_voltage: "ui.jfet_gate.drive_v"
    outputs:
      gate_voltage: "board.analog.pa2_volts"
      gate_reference: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vdrive drive 0 dc 3.3
        Vdrain drain 0 dc 3.3
        Vsource source 0 dc 3.3
        Rgate drive gate 1k
        Rreference drive reference_gate 1k
        Jcharge drain gate source NJF_CHARGE
        Jreference drain reference_gate source NJF_REFERENCE
        .model NJF_CHARGE NJF(VTO=-2 BETA=500u IS=1e-30 CGS=1n CGD=1n PB=1 FC=0.5)
        .model NJF_REFERENCE NJF(VTO=-2 BETA=500u IS=1e-30 CGS=0 CGD=0 PB=1 FC=0.5)
      probes:
        gate_voltage: "v(gate)"
        gate_reference: "v(reference_gate)"
      sources:
        drive_voltage: "Vdrive"
      vdd: 3.3
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa0_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
