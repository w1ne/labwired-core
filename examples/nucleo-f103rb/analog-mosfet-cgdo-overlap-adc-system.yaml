# Generic NTC, Shockley diode, and matched level-1 NMOS branches route to
# STM32F103RB ADC1 channels 0-3. CGDO isolates gate-drain overlap charge.
name: nucleo-f103rb-mosfet-cgdo-overlap-adc
chip: ../../configs/chips/stm32f103rb.yaml
external_devices: []
board_io: []
cosim_models:
  - id: ntc_divider
    adapter: analog
    step_ns: 1000
    inputs:
      temperature: ui.ntc.temperature_c
    outputs:
      v_sense: board.analog.pa0_volts
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: v(sense)
      sources:
        temperature: Rntc
      vdd: 3.3
  - id: diode_load_line
    adapter: analog
    step_ns: 1000
    outputs:
      v_diode: board.analog.pa1_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: v(sense)
      vdd: 3.3
  - id: mosfet_drain_overlap_reference
    adapter: analog
    step_ns: 1000
    inputs:
      gate_v: ui.mosfet_drain_overlap.gate_v
    outputs:
      drain_v: board.analog.pa2_volts
    config:
      substeps: 1
      netlist_text: |
        Vgate gate 0 dc 0
        Rdrain sense 0 1k
        M1 sense gate 0 0 MOS_REF w=100u l=10u
        .model MOS_REF NMOS(VTO=5 KP=20u LAMBDA=0)
      probes:
        drain_v: v(sense)
      sources:
        gate_v: Vgate
      vdd: 3.3
  - id: mosfet_gate_drain_overlap_charge
    adapter: analog
    step_ns: 1000
    inputs:
      gate_v: ui.mosfet_drain_overlap.gate_v
    outputs:
      drain_v: board.analog.pa3_volts
    config:
      substeps: 1
      netlist_text: |
        Vgate gate 0 dc 0
        Rdrain sense 0 1k
        M1 sense gate 0 0 MOS_CGDO w=100u l=10u
        .model MOS_CGDO NMOS(VTO=5 KP=20u LAMBDA=0 CGDO=10u)
      probes:
        drain_v: v(sense)
      sources:
        gate_v: Vgate
      vdd: 3.3
