# Local copy of configs/systems/nucleo-f103rb.yaml for this runnable example.
name: "nucleo-f103rb"
chip: "../../configs/chips/stm32f103rb.yaml"
external_devices: []
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
