# Generic level-1 NJF branches routed through the bare STM32F103 profile's
# PA2..PA6 ADC1 aliases. PA0 and PA1 retain unrelated NTC and diode routes.
name: "stm32f103-jfet-terminal-resistance-adc"
chip: "../../configs/chips/stm32f103.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "jfet_terminal_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      gate_voltage: "ui.jfet.gate_v"
    outputs:
      control_drain: "board.analog.pa2_volts"
      drain_resistance_drain: "board.analog.pa3_volts"
      source_resistance_drain: "board.analog.pa4_volts"
      both_resistances_drain: "board.analog.pa5_volts"
      explicit_network_drain: "board.analog.pa6_volts"
    config:
      netlist_text: |
        Vdd supply 0 dc 3.3
        Vgate gate 0 dc 0
        Rload_control supply drain_control 1k
        Jcontrol drain_control gate 0 NJF_CONTROL
        .model NJF_CONTROL NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30)
        Rload_drain supply drain_rd 1k
        Jdrain drain_rd gate 0 NJF_DRAIN
        .model NJF_DRAIN NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RD=200)
        Rload_source supply drain_rs 1k
        Jsource drain_rs gate 0 NJF_SOURCE
        .model NJF_SOURCE NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RS=200)
        Rload_both supply drain_both 1k
        Jboth drain_both gate 0 NJF_BOTH
        .model NJF_BOTH NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RD=200 RS=200)
        Rload_explicit supply explicit_load 1k
        Rd_explicit explicit_load drain_explicit 200
        Jexplicit drain_explicit gate source_explicit NJF_ZERO
        Rs_explicit source_explicit 0 200
        .model NJF_ZERO NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30)
      probes:
        control_drain: "v(drain_control)"
        drain_resistance_drain: "v(drain_rd)"
        source_resistance_drain: "v(drain_rs)"
        both_resistances_drain: "v(drain_both)"
        explicit_network_drain: "v(explicit_load)"
      sources:
        gate_voltage: "Vgate"
      vdd: 3.3
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa0_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
