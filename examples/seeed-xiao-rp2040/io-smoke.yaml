# Seeed Studio XIAO RP2040: drive all three onboard active-low LEDs.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-xiao-rp2040-smoke"
  system: "../../configs/systems/seeed-xiao-rp2040.yaml"
limits:
  max_steps: 1000000
assertions:
  - gpio_edges:
      pin: "sio:16"
      min_edges: 8
  - gpio_edges:
      pin: "sio:17"
      min_edges: 8
  - gpio_edges:
      pin: "sio:25"
      min_edges: 8
  - expected_stop_reason: max_steps
