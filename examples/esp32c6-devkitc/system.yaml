#
# ESP32-C6-DevKitC-1 (ESP32-C6-WROOM-1, 8 MB flash). SIM-DERIVED — not
# silicon-verified. This smoke profile exposes only UART0 to the host console.

name: "esp32c6-devkitc-example"
chip: "../../configs/chips/esp32c6.yaml"
external_devices: []
connectors:
  - type: "uart"
    peripheral: "uart0"
    endpoint: "host_console"
