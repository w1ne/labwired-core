# LabWired - ESP32-C6-DevKitC-1 strict-onboarding smoke test
#
# The strict-onboarding gate builds this firmware if the target path is empty,
# then asserts that the modeled UART0 console produced its UART bytes.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-esp32c6-demo"
  system: "../../configs/systems/esp32c6-devkitc.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "OK"
  - expected_stop_reason: max_steps
