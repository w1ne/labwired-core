# NUCLEO-H533RE: USART2 ST-LINK VCP and active-high LD2 on PA5.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-nucleo-h533re-smoke"
  system: "../../configs/systems/nucleo-h533re.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "NUCLEO_H533RE_OK"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 4
  - expected_stop_reason: max_steps
