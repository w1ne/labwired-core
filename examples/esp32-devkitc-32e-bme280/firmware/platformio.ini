[platformio]
default_envs = devkitc32e_bme280

[env:devkitc32e_bme280]
platform = espressif32
board = esp32dev
framework = arduino
build_type = debug
build_flags = -g
build_src_filter = +<main.cpp>
; The smoke uses GPIO/I2C only.  Avoid the classic profile's unsupported
; PSRAM cache-fix instruction sequence.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
