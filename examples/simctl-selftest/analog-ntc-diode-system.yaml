# Generic Beta NTC and Shockley diode netlists on the simctl-selftest GPIO.
# CI fixture GPIO thresholds are simulation assumptions, not silicon data.
name: "simctl-selftest-analog"
chip: "../../configs/chips/ci-fixture-cortex-m3-uart1.yaml"
external_devices: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.gpio_in.pa0"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.gpio_in.pa1"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
