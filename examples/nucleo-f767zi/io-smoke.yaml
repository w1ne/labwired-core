# Stock STM32duino NUCLEO-F767ZI UART and PB0 LED smoke.
schema_version: "1.2"
inputs:
  firmware: "../../tests/fixtures/stm32f767-stock-arduino.elf"
  system: "./system.yaml"
limits:
  max_steps: 15000000
assertions:
  - uart_contains: "F767_OK"
  - gpio_edges: { pin: "gpiob:0", min_edges: 4 }
  - expected_stop_reason: max_steps
