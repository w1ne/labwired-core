# Matched generic Gummel–Poon PNP branches route high-injection rolloff and
# its no-rolloff control through PA2/PA3 to NUCLEO-F767ZI ADC1_IN2/IN3.
name: nucleo-f767zi-analog-pnp-bjt-high-injection-adc
chip: ../../configs/chips/stm32f767.yaml
external_devices: []
board_io: []
cosim_models:
  - id: pnp_bjt_high_injection_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_pnp_high_injection.base_v
    outputs:
      collector_voltage: board.analog.pa2_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload collector 0 1k
        Vbase drive 0 dc 3.3
        Rbase drive base 10k
        Q1 collector base supply PNP_HIGH_INJECTION
        .model PNP_HIGH_INJECTION PNP(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 IKF=50u IKR=500u NKF=0.8)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: pnp_bjt_high_injection_control_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_pnp_high_injection.base_v
    outputs:
      collector_voltage: board.analog.pa3_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload collector 0 1k
        Vbase drive 0 dc 3.3
        Rbase drive base 10k
        Q1 collector base supply PNP_CONTROL
        .model PNP_CONTROL PNP(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
