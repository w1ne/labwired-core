# Generic Gummel–Poon NPN load line driven by a co-simulation base voltage.
# The collector resolves through STM32F767 PA2 -> ADC1_IN2.
name: "nucleo-f767zi-analog-bjt-load"
chip: "../../configs/chips/stm32f767.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_common_emitter_load"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt.base_v"
    outputs:
      collector_voltage: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
