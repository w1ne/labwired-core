# Matched generic Gummel–Poon NPN branches route reverse Early effect and
# its no-reverse-Early control through PA2/PA3 to NUCLEO-F767ZI ADC1_IN2/IN3.
name: nucleo-f767zi-analog-bjt-reverse-early-adc
chip: ../../configs/chips/stm32f767.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_reverse_early_effect_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_reverse_early_effect.base_v
    outputs:
      collector_voltage: board.analog.pa2_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_VAR
        .model NPN_VAR NPN(IS=1e-16 BF=80 BR=4 VAR=10)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_no_reverse_early_control_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_reverse_early_effect.base_v
    outputs:
      collector_voltage: board.analog.pa3_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_CONTROL
        .model NPN_CONTROL NPN(IS=1e-16 BF=80 BR=4)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
