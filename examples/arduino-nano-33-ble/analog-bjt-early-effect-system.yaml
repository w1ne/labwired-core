# Generic NTC, diode, and matched Gummel–Poon branches routed to Nano 33 BLE SAADC.
name: "arduino-nano-33-ble-analog-bjt-early-effect"
chip: "../../configs/chips/nrf52840.yaml"
debug_uart: "uart0"
external_devices: []
board_io: []
cosim_models:
  - id: ntc_divider
    adapter: analog
    step_ns: 1000
    inputs:
      temperature: ui.ntc.temperature_c
    outputs:
      v_sense: adc.saadc.0_volts
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: v(sense)
      sources:
        temperature: Rntc
      vdd: 3.3
  - id: diode_load_line
    adapter: analog
    step_ns: 1000
    outputs:
      v_diode: adc.saadc.1_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: v(sense)
      vdd: 3.3
  - id: bjt_with_forward_early_effect
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: adc.saadc.2_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_EARLY
        .model NPN_EARLY NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_without_forward_early_effect
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: adc.saadc.3_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
