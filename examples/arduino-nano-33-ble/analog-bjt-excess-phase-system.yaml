# Generic NTC, diode and two common-emitter Gummel-Poon stages routed to the
# Arduino Nano 33 BLE nRF52840 SAADC. The stages share one card (IS = 1 fA,
# TF = 1 us) and one base drive; AIN2 adds PTF = 90 degrees, so its transport
# current lags the base step through Weil's excess-phase filter with
# td = PTF*pi/180*TF = 1.571 us. AIN3 has no PTF and follows the step at once.
# crates/core/tests/cosim_arduino_nano_33_ble_analog.rs checks both against an
# independent recursion.
name: "arduino-nano-33-ble-analog-bjt-excess-phase"
chip: "../../configs/chips/nrf52840.yaml"
debug_uart: "uart0"
external_devices: []
board_io: []
cosim_models:
  - id: ntc_divider
    adapter: analog
    step_ns: 1000
    inputs:
      temperature: ui.ntc.temperature_c
    outputs:
      v_sense: adc.saadc.0_volts
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: v(sense)
      sources:
        temperature: Rntc
      vdd: 3.3
  - id: diode_load_line
    adapter: analog
    step_ns: 1000
    outputs:
      v_diode: adc.saadc.1_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: v(sense)
      vdd: 3.3
  - id: bjt_with_excess_phase
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_ptf.base_v
    outputs:
      collector_voltage: adc.saadc.2_volts
    config:
      substeps: 20
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase base 0 dc 0
        Q1 collector base 0 NPN_PTF temp=27
        .model NPN_PTF NPN(IS=1e-15 BF=100 TF=1u PTF=90)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_without_excess_phase
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_ptf.base_v
    outputs:
      collector_voltage: adc.saadc.3_volts
    config:
      substeps: 20
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase base 0 dc 0
        Q1 collector base 0 NPN_NOPTF temp=27
        .model NPN_NOPTF NPN(IS=1e-15 BF=100 TF=1u)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
