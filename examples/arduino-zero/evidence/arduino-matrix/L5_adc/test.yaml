schema_version: '1.0'
inputs:
  firmware: validation/arduino-matrix/out/arduino-zero/L5_adc/firmware.elf
  system: validation/arduino-matrix/systems/arduino-zero.yaml
limits:
  max_steps: 3000000
  max_uart_bytes: 65536
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
  stop_when_assertions_pass_min_steps: 0
assertions:
- uart_contains: LW_L5_OK
