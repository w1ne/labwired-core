# Matched generic Gummel–Poon NPN branches isolate base-emitter recombination
# through ATSAMD21 ADC. The only model-card difference is ISE/NE.
name: "arduino-zero-bjt-recombination"
chip: "../../configs/chips/atsamd21g18a.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_without_recombination"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_recombination.base_v"
    outputs:
      collector_voltage: "board.analog.pa03_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_with_recombination"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_recombination.base_v"
    outputs:
      collector_voltage: "board.analog.pb09_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_RECOMBINATION
        .model NPN_RECOMBINATION NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 ISE=2p NE=1.5)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
