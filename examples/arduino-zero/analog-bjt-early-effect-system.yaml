# Matched generic Gummel–Poon NPN branches route forward Early effect through
# ATSAMD21 ADC. Only VAF differs; both branches retain VAR=75 V.
name: arduino-zero-analog-bjt-early-effect
chip: ../../configs/chips/atsamd21g18a.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_with_forward_early_effect
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: board.analog.pa03_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_EARLY
        .model NPN_EARLY NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_without_forward_early_effect
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: board.analog.pb09_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
