schema_version: "1.2"
inputs:
  firmware: "../../tests/fixtures/board-smoke/nrf54l05.elf"
  system: "./nrf54l05-system.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "NRF54L05_OK"
  - uart_contains: "rram=500K ram=96K"
  - gpio_edges: { pin: "gpio2:9", min_edges: 4 }
  - expected_stop_reason: max_steps
