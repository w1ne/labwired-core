# ESP32-S2-DevKitM-1-N4R2: boot a freestanding Xtensa ELF, send a UART0 marker,
# and drive the on-board GPIO18 WS2812 with a bit-banged GRB frame.
schema_version: "1.0"
inputs:
  firmware: "../../target/esp32s2-devkitm1-n4r2/firmware.elf"
  system: "../../configs/systems/esp32s2-devkitm1-n4r2.yaml"
limits:
  max_steps: 1000000
assertions:
  - uart_contains: "ESP32_S2_DEVKITM1_N4R2_OK"
  - gpio_edges:
      pin: "gpio:18"
      min_edges: 48
  - display_region:
      id: "rgb_led"
      min_ink: 1.0
      colour: "0xF800"
      min_colour_pixels: 1
  - expected_stop_reason: max_steps
