# NUCLEO-C092RC: boot Cortex-M0+ firmware and toggle on-board LD1 on PA5.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-nucleo-c092rc-smoke"
  system: "../../configs/systems/nucleo-c092rc.yaml"
limits:
  max_steps: 5000
assertions:
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 16
  - expected_stop_reason: max_steps
