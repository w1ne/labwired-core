; LabWired climate node — STM32F411CEU6 "Black Pill" (WeAct) Arduino sketch.
;
; Build (see ../README.md):
;   pio run -e blackpill_f411ce
;
; The env matches the hosted builder's profile for the stm32f411ceu6-blackpill
; board. Version pins are caret ranges on the verified minors; the lockfile-free
; PIO registry resolves them offline once cached in ~/.platformio.
[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit BME280 Library@^2.2.4
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit Unified Sensor@^1.1.14
build_flags = -D SERIAL_BAUD=115200
