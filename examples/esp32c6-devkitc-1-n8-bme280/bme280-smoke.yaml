# Read BME280 CHIP_ID and raw temperature over C6 I2C0 on GPIO6/7.
schema_version: "1.0"
inputs:
  firmware: "./firmware/.pio/build/devkitc_n8/firmware.elf"
  system: "../../configs/systems/esp32c6-devkitc-1-n8-bme280.yaml"
limits:
  max_steps: 50000000
assertions:
  - uart_contains: "ESP32C6_DEVKITC1_N8_BME280_OK ID=0x60 TEMP_RAW=0x082DC0 I2C0=GPIO6/7"
  - expected_stop_reason: max_steps
