# IO-Link L+ supply monitor (PC0) and generic Beta NTC divider (PC1).
#
# An IO-Link master feeds every port from a 24 V L+ rail (IEC 61131-9 allows
# 18 V to 30 V), so the station reads L+ through a 100k / 12k divider to keep
# 30 V under the 3.3 V ADC reference. The NTC divider is the same deck every
# other covered board solves. Neither netlist names the board, the ADC or a
# channel: the STM32L476 descriptor's `analog_pins:` map resolves PC0 and PC1.
name: "iolink-multiport-demo-analog"
chip: "../../configs/chips/stm32l476.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "lplus_monitor"
    adapter: "analog"
    step_ns: 1000
    inputs:
      l_plus: "ui.iolink.l_plus_volts"
    outputs:
      v_sense: "board.analog.pc0_volts"
    config:
      netlist_text: |
        Vlplus lplus 0 dc 24
        Rtop lplus sense 100k
        Rbot sense 0 12k
      probes:
        v_sense: "v(sense)"
      sources:
        l_plus: "Vlplus"
      vdd: 3.3
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pc1_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
