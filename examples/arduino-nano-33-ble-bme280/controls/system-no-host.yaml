# Control: the same board, sketch and sensor with no cable in the USB port
# (the chip descriptor's default).
name: arduino-nano-33-ble-bme280-no-host
chip: ../../../configs/chips/nrf52840.yaml
memory_overrides:
  reset_vector_offset: "0x10000"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    config:
      i2c_address: 0x77
peripherals:
  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    config:
      bootloader_rx_running: true
board_io: []
