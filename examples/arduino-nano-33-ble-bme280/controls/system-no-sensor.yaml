# Control: the same board and sketch with nothing attached to TWI0.
name: arduino-nano-33-ble-bme280-no-sensor
chip: ../../../configs/chips/boards/nrf52840-arduino-nano-33ble.yaml
memory_overrides:
  reset_vector_offset: "0x10000"
external_devices: []
peripherals:
  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    config:
      bootloader_rx_running: true
  - id: "usbd"
    type: "nrf52840_usbd"
    base_address: 0x40027000
    config:
      host: true
board_io: []
