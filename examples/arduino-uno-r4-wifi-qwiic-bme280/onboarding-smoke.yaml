# Read the BME280 identity, status, and raw temperature through Qwiic / IIC0.
schema_version: "1.0"
inputs:
  firmware: "../../target/arduino-uno-r4-wifi-qwiic-bme280/firmware.elf"
  system: "../../configs/systems/arduino-uno-r4-wifi-qwiic-bme280.yaml"
limits:
  max_steps: 5000000
  max_uart_bytes: 65536
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
  stop_when_assertions_pass_min_steps: 0
assertions:
  - uart_contains: "UNO_R4_WIFI_QWIIC_BME280_OK id=0x60 status=0x0"
