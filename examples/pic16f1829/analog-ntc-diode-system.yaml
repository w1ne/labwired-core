# Generic Beta NTC divider and Shockley diode for the PIC16F1829 on the
# Curiosity board (DM164137). The NTC divider is on RC0/AN4, the net the
# board's POT1 wiper drives (DS40001804B Figure A-1), and the diode on RC2/AN6;
# the 10-bit ADC converts both against VDD (ADCON1 ADPREF = 00).
name: "pic16f1829-curiosity-analog"
chip: "../../configs/chips/pic16f1829.yaml"
# 16 MHz HFINTOSC = 4 MIPS (Fosc/4).
cpu_hz: 4000000
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.RC0_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 5.0
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 5.0
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.RC2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 5.0
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 5.0
