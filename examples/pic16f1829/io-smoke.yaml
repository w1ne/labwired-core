#
# L1 IO smoke: boot the SDCC 4.4.0 C firmware on the enhanced mid-range
# core, receive the EUSART banner, the RA5 LED read back after setting
# LATA5, the result of three LATA5 toggles, a checksum over a stack buffer
# walked through FSR, three software INT interrupts whose ISR clobbers
# W/STATUS/BSR/PCLATH without saving them (the hardware shadows must restore
# main's context), a switch lowered to a jump table, a checked work loop
# preempted by TMR0 overflow interrupts every 256 cycles, and 16-bit
# multiplies.
# The program then spins, so the run ends at max_steps.
schema_version: "1.0"
inputs:
  firmware: "./firmware/pic16f1829-sdcc-uart-smoke.elf"
  system: "./system.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_ordered:
      - "PIC16F1829 OK\r\n"
      - "LED=1\r\n"
      - "TOGGLE OK\r\n"
      - "SUM OK\r\n"
      - "IRQ OK\r\n"
      - "three many\r\n"
      - "TMR0 IRQ OK\r\n"
      - "MUL OK\r\n"
  - expected_stop_reason: max_steps
