[platformio]
default_envs = devkitc32e_uart1

[env:devkitc32e_uart1]
platform = espressif32
board = esp32dev
framework = arduino
build_type = debug
build_flags = -g
build_src_filter = +<uart1_smoke.cpp>
; The smoke does not use PSRAM. The classic ESP32 CPU model does not execute
; this workaround's generated instruction sequence.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
