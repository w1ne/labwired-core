# Generic MNA devices on the Mini A's two SARADC pads: header pad 19
# (GPIO4_C0, SARADC_IN0) and pad 20 (GPIO4_C1, SARADC_IN1), both in the
# 1.8 V VCCIO2 domain (docs/boards/luckfox-pico-mini-a.md).
#
# The RV1103 descriptor is declared-only (CPU and memory), so this system adds
# the converter itself: the RV1103/RV1106 SARADC at 0xff3c0000 (Luckfox SDK
# @824b817f rv1106.dtsi `saradc@ff3c0000`, rockchip,rv1106-saradc, 0x200
# bytes, GIC SPI 62; two 10-bit channels; vref-supply vcc_1v8 in
# rv1103-luckfox-pico-ipc.dtsi). No GIC is on the generic bus, so no irq is
# wired. The native Linux platform does not instantiate this converter.
#
# The supply is the 1.8 V rail. The NTC divider's 10 k pull-up keeps the
# pull-up the schematic requires on SARADC_IN0.
name: luckfox-pico-mini-a-analog-inputs
chip: ../../configs/chips/rv1103.yaml
external_devices: []
board_io: []
peripherals:
  - id: saradc
    type: rockchip_saradc_v2
    base_address: 0xff3c0000
    size: 512B
    config: { channels: 2, bits: 10, vref_mv: 1800 }
cosim_models:
  - id: ntc_divider
    adapter: analog
    step_ns: 1000
    inputs:
      temperature: ui.ntc.temperature_c
    outputs:
      v_sense: adc.saradc.0_volts
    config:
      netlist_text: |
        Vcc vcc 0 dc 1.8
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: v(sense)
      sources:
        temperature: Rntc
      vdd: 1.8
  - id: diode_load_line
    adapter: analog
    step_ns: 1000
    outputs:
      v_diode: adc.saradc.1_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 1.8
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: v(sense)
      vdd: 1.8
