# ESP32-S3-DevKitC-1 v1.1 N16R8: exercise UART0 and the GPIO38 WS2812 LED.
schema_version: "1.0"
inputs:
  firmware: "../../target/xtensa-esp32s3-none-elf/release/firmware-esp32s3-devkitc-n16r8-smoke"
  system: "../../configs/systems/esp32-s3-devkitc-1-n16r8.yaml"
limits:
  max_steps: 1000000
assertions:
  - uart_contains: "ESP32_S3_DEVKITC1_V11_N16R8_OK"
  - gpio_edges:
      pin: "gpio:38"
      min_edges: 48
  - display_region:
      id: "rgb_led"
      min_ink: 1.0
      colour: "0xF800"
      min_colour_pixels: 1
  - expected_stop_reason: max_steps
