# ESP32-S3-DevKitC-1 N16R8 + BME280: assert real I2C0 register reads.
schema_version: "1.0"
inputs:
  firmware: "../../target/xtensa-esp32s3-none-elf/release/firmware-esp32s3-devkitc-n16r8-bme280-smoke"
  system: "../../configs/systems/esp32-s3-devkitc-1-n16r8-bme280.yaml"
limits:
  max_steps: 1500000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "BME280_TEMP_RAW=0x082DC0"
  - expected_stop_reason: max_steps
