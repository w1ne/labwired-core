# Headless run of the ESP32-C3 Leo air-quality firmware — NORMAL scenario.
#
# The firmware reads four sensors over the real C3 I²C0 controller using the
# unmodified Sensirion vendor drivers ON-TARGET, and prints a plain-language air
# verdict per cycle. NORMAL: a closed room fills up, CO₂ climbs from fresh
# (~450 ppm) toward stuffy (~1400 ppm), and the verdict flips from "air quality
# is good" to "ventilate now" as CO₂ crosses 1000 ppm.
#
# NB: the simple_regex engine supports only `.`, `*`, `^`, `$` — no char classes
# or alternation — so all assertions below are literal substrings.
schema_version: "1.2"
inputs:
  system: "./system-stuffy.yaml"
  firmware: "./firmware/leo_airquality.elf"
limits:
  # TWO real wires bound this run, and both are clocked at their real rate.
  #
  # 1. I²C0 clocks every transaction bit-by-bit at the rate its timing registers
  #    dictate, and the firmware busy-waits on TRANS_COMPLETE like real silicon.
  # 2. UART0 is the real Espressif block: a 128-entry TX FIFO that shifts out one
  #    10-bit frame per baud period and DROPS a write to a full FIFO. c3_uart.c
  #    therefore waits for a free entry before every byte, so console time is now
  #    part of the run. The firmware clocks the console at 2 Mbaud; at the
  #    power-on 115200 the ~25 kB this scenario prints would need ~2.1 s of wire
  #    time (~340M core cycles) on its own.
  #
  # MEASURED against this exact ELF: a measurement cycle costs ~250k core cycles
  # while the room is quiet and ~1.0M once the longer verdict/surface/mold lines
  # push a cycle's telemetry past the 128-byte FIFO (~585k on average); all 64
  # samples, `LEO DONE` and the final 8.3 kB frame dump land at ~21.5M steps /
  # ~54.5M cycles. 28M steps leaves ~30 % headroom; anything far above that
  # just burns the post-DONE idle spin (2 cycles/instruction) and pushes the
  # `cycles` counter far past the window the stimuli ladder lives in.
  max_steps: 28000000
assertions:
  # Boot banner + all four sensors brought up over real I²C.
  - uart_contains: "LEO BOOT"
  - uart_contains: "SCD41 READY"
  - uart_contains: "SGP41 READY"
  - uart_contains: "SPS30 READY"
  - uart_contains: "VEML7700 READY"
  # Early cycles: fresh air. The decoded CO₂ starts low.
  # The headline transition once CO₂ climbs past 1000 ppm — the plain-language
  # verdict Leo's product is built around.
  - uart_contains: "ventilate now"
  # STUFFY: a damp room against a cold exterior wall. Condensation sets in and
  # the mold risk escalates to its worst (SEVERE) via the surface channel.
  - uart_contains: "CONDENSING - wall is wet"
  - uart_contains: "mold risk: SEVERE"
  # The run completes its measurement cycles.
  - uart_contains: "LEO DONE"

# ── Scene ─────────────────────────────────────────────────────────────────
# The sensor models hold whatever value they were last given: there is exactly
# ONE way to move a reading, `set_input` (see labwired_core::sim_input). The
# room's story is therefore written here, as a ladder of driven values on the
# devices' real engineering-unit channels.
#
# PACING (measured, not guessed). `after_cycles` is the only time trigger the
# stimuli schema offers, so every rung is an absolute cycle count and it MUST
# sit inside the window in which the firmware is still sampling. That window was
# measured against this exact firmware ELF by probing it with a 250k-cycle
# ladder of marker values and reading back which `t=` sample each one reached:
#
#   sample t=4 reads at ~1.5M cycles ... sample t=60 reads at ~34.75M cycles
#   => ~585k cycles per measurement cycle on average (it grows through the run:
#      the verdict/surface/mold lines get longer as the room deteriorates, and
#      console time is real — see `limits` above); all 64 samples are done by
#      ~36.5M cycles.
#
# The 15 rungs below are the original first-order glide sampled every 4th
# measurement cycle, each placed at the measured read cycle of samples
# t = 4, 8, 12 ... 60 (to the 250k probe resolution, so ±1 sample). A rung
# placed past ~36.5M cycles fires after the firmware has stopped measuring and
# is DEAD: it changes no reading, and a scenario built from dead rungs passes
# (or fails) for reasons that have nothing to do with it.
stimuli:
  - target: { component: "scd41", channel: "co2" }
    trigger: !after_cycles { cycles: 1500000 }
    value: 833
