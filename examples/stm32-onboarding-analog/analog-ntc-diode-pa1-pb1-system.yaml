# Generic Beta NTC divider on PA1 and Shockley diode load line on PB1.
#
# The onboarding STM32F4-Discovery profiles map PA1 -> ADC1_INP1 and
# PB1 -> ADC1_INP9. The pads move; the netlists, the solver and the router do
# not, and neither netlist names the board, the ADC or a channel.
name: "stm32-onboarding-analog-pa1-pb1"
chip: "../../configs/chips/onboarding/stm32f4_discovery.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pb1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
