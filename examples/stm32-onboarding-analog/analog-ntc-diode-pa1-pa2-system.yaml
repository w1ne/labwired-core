# Generic Beta NTC divider on PA1 and Shockley diode load line on PA2.
#
# The onboarding STM32F412/F429/F746 profiles map PA1 -> ADC1_INP1 and
# PA2 -> ADC1_INP2, so the same two netlists the nucleo/catalog boards run on
# PA0/PA1 move here unchanged apart from the published pad. Neither netlist
# names the board, the ADC or a channel.
name: "stm32-onboarding-analog-pa1-pa2"
chip: "../../configs/chips/onboarding/stm32f412.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
