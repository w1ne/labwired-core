# Read a centered potentiometer on LOLIN C3 Mini GPIO0 / ADC1_CH0.
schema_version: "1.0"
inputs:
  firmware: "./firmware/.pio/build/lolin_c3_mini/firmware.elf"
  system: "../../configs/systems/lolin-c3-mini-adc.yaml"
limits:
  max_steps: 50000000
assertions:
  - uart_contains: "LOLIN_C3_ADC_OK GPIO0="
  - expected_stop_reason: max_steps
