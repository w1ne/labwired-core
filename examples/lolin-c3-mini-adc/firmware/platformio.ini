[platformio]
default_envs = lolin_c3_mini

[env:lolin_c3_mini]
platform = espressif32@8.0.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; Use the modeled UART0 console; USB Serial/JTAG is outside this profile.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
