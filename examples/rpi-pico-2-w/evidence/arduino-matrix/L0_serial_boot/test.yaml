schema_version: '1.0'
inputs:
  firmware: validation/arduino-matrix/out/rpipico2w/L0_serial_boot/firmware.elf
  system: validation/arduino-matrix/systems/rpipico2w.yaml
limits:
  max_steps: 80000000
  max_uart_bytes: 65536
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
  stop_when_assertions_pass_min_steps: 0
  wall_time_ms: 240000
assertions:
- uart_contains: LW_L0_OK
