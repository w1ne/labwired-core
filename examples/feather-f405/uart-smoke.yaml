# LabWired - STM32F405 USART2 peripheral-only smoke probe.
# This compatibility test does not represent a Feather connector route; the
# board's exposed USART3/PB10 path and D13 LED are covered by io-smoke.yaml.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-f401-demo"
  system: "./system.yaml"
limits:
  max_steps: 64
assertions:
  - uart_contains: "OK"
  - expected_stop_reason: max_steps
