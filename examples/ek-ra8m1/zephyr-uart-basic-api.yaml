# LabWired - EK-RA8M1 Zephyr tests/drivers/uart/uart_basic_api
#
# Unmodified upstream Zephyr v3.7.0 `tests/drivers/uart/uart_basic_api` for
# `ek_ra8m1` (rebuild: crates/firmware-ek-ra8m1-zephyr/build.sh). The same
# test as the FRDM-K64F port of Renode's "Should Run Zephyr Tests for UART";
# on the RA8M1 it is the counterpart of Renesas_RA8M1.robot "Should Read And
# Write On UART" (an interrupt-driven FSP r_sci_b_uart ELF), on stock Zephyr.
#
# Every UART interrupt here is an ICU event: the driver links
# ELC_EVENT_SCI9_RXI/TXI/TEI (0x163/0x164/0x165) to NVIC lines 24/25/26
# through IELSRn and clears IELSRn.IR in each handler. fifo_fill is driven
# by TXI/TEI, fifo_read and the pending suite by RXI (with the driver's
# default receive FIFO: FRSR.R), poll_in/poll_out by CSR.
#
# Renode writes "The quick brown fox jumps over the lazy dog" after each
# "Please send characters to serial console" prompt; this script does the
# same with cycle-timed `uart_injections` (a script cannot wait for a line).
# The run is deterministic: the prompts come at ~242M, ~252M and ~261M
# cycles, and fifo_fill's 0.5 s sleep is idle-skipped. The busy-waiting
# `k_yield` loops after each prompt are interpreted, so the injections sit
# close behind them: 250M, 260M, 275M. The run stops at `max_cycles`, idle
# after the summary (`stop_when_assertions_pass` re-checks the ordered list
# every step and makes the run ~20x slower).
schema_version: "1.2"
inputs:
  firmware: "../../tests/fixtures/r7fa8m1ah-zephyr-uart-basic-api.elf"
  system: "./system.yaml"
limits:
  max_steps: 100000000
  max_cycles: 1000000000
  wall_time_ms: 120000
uart_injections:
  - uart: "sci9"
    bytes: "The quick brown fox jumps over the lazy dog\n"
    trigger: !after_cycles { cycles: 250000000 }
  - uart: "sci9"
    bytes: "The quick brown fox jumps over the lazy dog\n"
    trigger: !after_cycles { cycles: 260000000 }
  - uart: "sci9"
    bytes: "The quick brown fox jumps over the lazy dog\n"
    trigger: !after_cycles { cycles: 275000000 }
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v3.7.0 ***"
      - "Running TESTSUITE uart_basic_api"
      - "This is a FIFO test."
      - " PASS - test_uart_fifo_fill"
      - "Please send characters to serial console"
      - "The quick brown fox jumps over the lazy dog"
      - " PASS - test_uart_fifo_read"
      - "Please send characters to serial console"
      - "The quick brown fox jumps over the lazy dog"
      - " PASS - test_uart_poll_in"
      - "This is a POLL test."
      - " PASS - test_uart_poll_out"
      - "TESTSUITE uart_basic_api succeeded"
      - "Please send characters to serial console"
      - "The quick brown fox jumps over the lazy dog"
      - " PASS - test_uart_pending"
      - "SUITE PASS - 100.00% [uart_basic_api]: pass = 6, fail = 0, skip = 0, total = 6"
      - "SUITE PASS - 100.00% [uart_basic_api_pending]: pass = 1, fail = 0, skip = 0, total = 1"
      - "PROJECT EXECUTION SUCCESSFUL"
  - expected_stop_reason: max_cycles
