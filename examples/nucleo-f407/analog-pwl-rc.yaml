# A generic PWL voltage source drives an RC network whose sense node routes to
# the NUCLEO-F407 ADC1. The source rises between the first and second 1 us steps.
name: "nucleo-f407-pwl-rc"
chip: "../../configs/chips/stm32f407.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "pwl_rc"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_sense: "board.analog.pa2_volts"
    config:
      substeps: 1
      integration: "be"
      netlist_text: |
        Vdrive drive 0 PWL(0 0 1u 0 1.001u 3.3 4u 3.3)
        Rseries drive sense 1k
        Csense sense 0 1n
      probes:
        v_sense: "v(sense)"
      vdd: 3.3
