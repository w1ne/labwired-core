# Matched generic Gummel-Poon NPN branches with intrinsic terminal
# resistances routed through NUCLEO-F407 PA2..PA7 to ADC1_IN2..IN7.
# The all-resistances model card is checked against explicit external resistors.
name: "nucleo-f407-analog-bjt-terminal-resistance"
chip: "../../configs/chips/stm32f407.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_terminal_control"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_base_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RB=1k)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_collector_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa4_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RC=150)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_emitter_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa5_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RE=100)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_all_terminal_resistances"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa6_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 RB=1k RC=150 RE=100)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_explicit_terminal_resistors"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa7_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Rbase base intrinsic_base 1k
        Rcollector collector intrinsic_collector 150
        Remitter 0 intrinsic_emitter 100
        Q1 intrinsic_collector intrinsic_base intrinsic_emitter NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
