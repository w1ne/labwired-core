# A generic level-1 NMOS gate-source overlap capacitor routes its transient
# through PA4/ADC1_IN4; the matched zero-charge branch is on PA3/ADC1_IN3.
name: "stm32f7-discovery-analog-mosfet-gate-charge"
chip: "../../configs/chips/stm32f746.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "mosfet_gate_charge_pair"
    adapter: "analog"
    step_ns: 1000
    inputs:
      gate_voltage: "ui.mosfet_charge.gate_v"
    outputs:
      reference_source: "board.analog.pa3_volts"
      charged_source: "board.analog.pa4_volts"
    config:
      substeps: 1
      netlist_text: |
        Vgate_ref gate_ref 0 dc 0
        Rsource_ref sense_ref 0 1k
        Mref 0 gate_ref sense_ref 0 NMOS_TEST w=100u l=10u
        Vgate_charge gate_charge 0 dc 0
        Rsource_charge sense_charge 0 1k
        Mcharge 0 gate_charge sense_charge 0 NMOS_CHARGE w=100u l=10u
        .model NMOS_TEST NMOS(VTO=5 KP=20u LAMBDA=0)
        .model NMOS_CHARGE NMOS(VTO=5 KP=20u LAMBDA=0 CGSO=10u)
      probes:
        reference_source: "v(sense_ref)"
        charged_source: "v(sense_charge)"
      sources:
        gate_voltage: "Vgate_charge"
      vdd: 3.3
