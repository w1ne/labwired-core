# Generic Beta NTC and Shockley diode netlists drive two CH32V003 ADC inputs
# through the chip descriptor's PA2/PA1 channel routes.
#
# Neither netlist names the board, the CPU, the ADC, or a channel: each one
# solves its own circuit and publishes a probe voltage to
# `board.analog.<pad>_volts`. The descriptor's `analog_pins:` maps PA2 ->
# adc1/channel 0 and PA1 -> adc1/channel 1, so the same decks used on the
# STM32F1/F4 boards run unchanged through the WCH 10-bit SAR (ch32v00x.h:
# ADC1 at 0x40012400, RDATAR full scale 1023).
name: "wch-ch32v003evt-analog"
chip: "../../configs/chips/ch32v003f4p6.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
