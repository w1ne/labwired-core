name: "nokia5110-invaders-lab"
chip: "../../configs/chips/stm32l476.yaml"
# STM32L476 reset clock: MSI range 6, 4 MHz. Peripheral calibration clocks
# below are independent device settings and must not affect MCU pacing.
cpu_hz: 4_000_000
# 32 cycles / 4 MHz = 8 us. A 2 cm echo lasts 116 us; an unrestricted
# 1024-cycle (256 us) grid can erase it before the firmware observes it.
max_peripheral_tick_interval: 32
# TIM2 and SPI1 use the generic event scheduler. TIM2 CNT reads derive
# elapsed cycles lazily; GPIO and the HC-SR04 use the existing pad/event path.
# Keep the walk differential and shipping tick-interval behavior gates.
walk_deleted: true
# spi1, gpioa-e and rcc all come from the chip descriptor; we only attach the
# external devices and declare the host-controllable I/O here.
external_devices:
  - id: "lcd"
    type: "pcd8544"
    connection: "spi1"
    config:
      cs_pin: "PB6"
      dc_pin: "PC7"
  - id: "dist"
    type: "hc-sr04"
    # GPIO-wired (no SPI/I2C bus); connection is unused for this device type.
    connection: "gpioa"
    config:
      trig_pin: "PA8"
      echo_pin: "PB10"
      distance_cm: 30.0
      cpu_hz: 4000000
board_io: []
