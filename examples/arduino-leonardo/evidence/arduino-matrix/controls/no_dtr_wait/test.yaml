schema_version: '1.0'
inputs:
  firmware: (pio build of controls/no_dtr_wait/main.ino, board leonardo)/firmware.elf
  system: validation/arduino-matrix/systems/arduino-leonardo.yaml
limits:
  max_steps: 2000000
  max_uart_bytes: 65536
  stop_when_assertions_pass: false
  stop_when_assertions_pass_settle_steps: 1000
  stop_when_assertions_pass_min_steps: 0
assertions:
- uart_contains: LW_L0_OK
