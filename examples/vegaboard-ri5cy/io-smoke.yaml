# LabWired - Vega board (RI5CY) IO smoke
#
# Build: cargo build -p firmware-vegaboard-ri5cy-smoke --release --target riscv32imc-unknown-none-elf
#
# The firmware boots from flash at 0x0 and prints over LPUART0. It proves the
# RV32IMC core with a real multiply, reads back the declared-stub SCG/PCC
# windows, and its heartbeat's `stat=` field is read back from the LPUART
# status register (0x00c00000 = TDRE|TC idle).
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-vegaboard-ri5cy-smoke"
  system: "./system.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "VEGABOARD RI5CY SMOKE"
  - uart_ordered:
      - "cpu=rv32imc uart=lpuart"
      - "mul=0000002a"
      - "scg=00000000 pcc0=00000000"
      - "hb=0 stat=00c00000"
      - "hb=1 stat=00c00000"
      - "hb=2 stat=00c00000"
  - expected_stop_reason: max_steps
