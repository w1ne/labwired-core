# LabWired - EK-RA6M5 stock Zephyr adc_api test (ADC1 through the ICU)
#
# Unmodified upstream Zephyr v4.1.0 `tests/drivers/adc/adc_api` for board
# `ek_ra6m5`, with its in-tree boards/ek_ra6m5.overlay (ADC1 channels 0 and
# 2, 12-bit, 3300 mV reference). Rebuild: crates/firmware-ek-ra6m5-zephyr/build.sh
#
# Zephyr's adc_renesas_ra.c drives FSP r_adc: R_ADC_ScanStart writes
# ADCSR = GBADIE | TRGE | ADST (single scan, software start), and the
# scan-end ISR reads ADDR0/ADDR2. The interrupt is ELC_EVENT_ADC1_SCAN_END
# (0x166), linked to NVIC line 39 through IELSR39, so every completed read
# is a scan-end event raised by ra_adc12 and delivered through ra_icu. With
# the old `stub` window test_adc_asynchronous_call times out (k_poll -11).
#
# adc-system.yaml puts a potentiometer (mid position, 1650 mV) on channel 0
# and a TMP36 (25 C, 750 mV) on channel 2, so the sample buffers must hold
# 0x07ff (1650 * 4095 / 3300) and 0x03a2 (750 * 4095 / 3300). The 0x8000
# entries are the test's untouched fill pattern.
schema_version: "1.2"
inputs:
  firmware: "../../tests/fixtures/r7fa6m5bh-zephyr-adc-api.elf"
  system: "./adc-system.yaml"
limits:
  max_steps: 20000000
  max_cycles: 1000000000
  wall_time_ms: 120000
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v4.1.0 ***"
      - "Running TESTSUITE adc_basic"
      - " PASS - test_adc_asynchronous_call"
      - " PASS - test_adc_invalid_request"
      - " PASS - test_adc_repeated_samplings"
      - "Samples read: 0x07ff 0x8000 0x8000 0x8000 0x8000 0x8000"
      - " PASS - test_adc_sample_one_channel"
      - "Samples read: 0x07ff 0x03a2 0x8000 0x8000 0x8000 0x8000"
      - " PASS - test_adc_sample_two_channels"
      - "sample_with_interval_callback: sampling 4"
      - " PASS - test_adc_sample_with_interval"
      - "SUITE PASS - 100.00% [adc_basic]: pass = 6, fail = 0, skip = 0, total = 6"
      - "PROJECT EXECUTION SUCCESSFUL"
  - expected_stop_reason: max_cycles
