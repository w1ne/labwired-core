# LabWired - EK-RA6M5 stock Zephyr synchronization sample
#
# Unmodified upstream Zephyr v4.0.0 `samples/synchronization` for board
# `ek_ra6m5`. Rebuild: crates/firmware-ek-ra6m5-zephyr/build.sh
#
# Two threads hand a semaphore back and forth. Each one prints, busy-waits
# 100 ms (k_busy_wait, 20 M cycles at the 200 MHz Zephyr clock), then
# k_msleep(500) on the SysTick system timer. thread_b's line therefore proves
# the SysTick timeout wake, the semaphore give/take and the PendSV context
# switch. The guest's own busy-wait dominates the step budget: one a -> b
# round takes ~21.1 M steps, so the budget is 40 M (under the CLI's 50 M-step
# default cap).
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/r7fa6m5bh-zephyr-sync.elf"
  system: "./system.yaml"
limits:
  max_steps: 40000000
  stop_when_assertions_pass: true
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v4.0.0 ***"
      - "thread_a: Hello World from cpu 0 on ek_ra6m5!"
      - "thread_b: Hello World from cpu 0 on ek_ra6m5!"
