# NUCLEO-F303RE: USART2 output and repeated LD2 GPIOA5 transitions.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-f303re-smoke"
  system: "../../configs/systems/nucleo-f303re.yaml"
limits:
  max_steps: 1000
assertions:
  - uart_contains: "NUCLEO_F303RE_OK"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 8
  - expected_stop_reason: max_steps
