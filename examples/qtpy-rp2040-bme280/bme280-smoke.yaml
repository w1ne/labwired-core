# QT Py RP2040 I2C1 STEMMA QT transaction to the attached BME280 model.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-qtpy-rp2040-bme280-smoke"
  system: "../../configs/systems/qtpy-rp2040-bme280.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "QTPY_RP2040_BME280_OK ID=0x60 TEMP_RAW=0x082DC0 I2C1=GP22/GP23 UART1_TX=GP20"
  - expected_stop_reason: max_steps
