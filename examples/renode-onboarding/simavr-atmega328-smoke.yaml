# Arduino Uno ATmega328P smoke against the narrowed imported simavr profile.
# The fixture verifies USART0 output and GPIOB/LED_BUILTIN transitions. Other
# board peripherals are outside this profile.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/avr/arduino-uno-blinky.elf"
  system: "../../configs/systems/onboarding/simavr-atmega328.yaml"
limits:
  max_steps: 2000000
assertions:
  - uart_contains: "uno-ok"
  - gpio_edges:
      pin: "portb:5"
      min_edges: 2
  - expected_stop_reason: max_steps
