# One RV64IMAC hart and UART0 on the narrowed imported SiFive FU540 profile.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv64imac-unknown-none-elf/release/firmware-sifive-fu540-smoke"
  system: "../../configs/systems/onboarding/sifive-fu540.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "RV64 FU540 UART0 smoke; mul=0000001100000011"
  - uart_contains: "timer IRQ mcause=8000000000000007 count=0000000000000001 mepc_in_wait=1 entry_mie=0 entry_mpie=1 entry_mpp=3 return_mie=1 compare_disarmed=1 mtip_clear=1 ok"
  - expected_stop_reason: max_steps
