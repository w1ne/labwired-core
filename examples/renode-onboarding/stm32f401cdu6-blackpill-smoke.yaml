# Cortex-M4 smoke against the imported Renode STM32F401 Black Pill system.
# Bare-register firmware enables RCC clocks, toggles the active-low PC13 user
# LED through BSRR with ODR readback, runs TIM2 (PSC/ARR readback, counter
# advance, UIF latch + W1C clear), and drives I2C1 and I2C2 TMP102 temperature reads
# (25 °C) plus an absent-address NACK. SPI1 reads
# a MAX31855 reset frame and checks TXE/RXNE interrupt levels. The I2C1
# start phase checks SB with ITEVTEN alone; the write-address phase checks TXE
# with ITBUFEN alone and ADDR with ITEVTEN alone;
# the pointer byte checks BTF with ITEVTEN alone. The first TMP102 read checks
# RXNE with ITBUFEN alone and release after DR is read; a second read holds its
# first byte in DR to check receive BTF with ITEVTEN alone, RXNE source
# isolation, and the IRQ release when DR is read.
# A second TMP102 on I2C2 checks SB isolation until ITEVTEN is enabled, its
# event vector, and an independent repeated-start 25 °C read, including TXE
# isolation under ITEVTEN, TXE and
# RXNE assertion/release under ITBUFEN. A second read uses the legacy POS
# ACK-position bit, checks RXNE isolation and receive BTF IRQ assertion, then
# generates STOP before both DR reads. It verifies BUSY release, BTF release
# with RXNE preserved after the first read, and RXNE clearing after the second
# read. The I2C1 absent-address probe checks ER IRQ
# 32. The I2C2 absent-address probe checks AF status, event/error-line
# isolation, ITERREN-gated ER IRQ 34 assertion/release, AF clearing and recovery.
# Results print on USART2; USART1 checks TXEIE and RXNEIE assertion/release on
# IRQ 37, with an injected RX byte. The summary word lands at 0x20017F00 and is
# 0xB1AC03FF on
# success. PC13 resets low, so three on/off toggles give 5 edges, not 6. ADC,
# EXTI, other timers and other USARTs claimed by the chip are not exercised.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-f401cdu6-blackpill-renode-smoke"
  system: "../../configs/systems/onboarding/stm32f401cdu6-blackpill.yaml"
limits:
  max_steps: 200000
uart_injections:
  - uart: "usart1"
    bytes: "R"
assertions:
  - uart_ordered:
      - "BLACKPILL F401 SMOKE"
      - "rcc apb1=00620001 ok"
      - "led pc13 odr=00002000 ok"
      - "tim2 arr=00000040 ok"
      - "i2c1 sb_irq=1 ok"
      - "i2c1 btf_irq=1 ok"
      - "i2c1 rxne_buf_irq=1 release=1 ok"
      - "i2c1 btf_rx_irq=1 rxne_isolated=1 release=1 data=00001980 ok"
      - "i2c1 tmp102=00001900 nack=00000400 buf_irq=1 buf_release=1 ev_irq=1 ev_release=1 er_irq=1 irq_released=1 ok"
      - "i2c2 tmp102=00001900 sb_irq_gate=1 addr_irq=1 txe_isolated=1 txe_buf_irq=1 txe_buf_release=1 btf_irq=1 rxne_buf_irq=1 rxne_buf_release=1 ok"
      - "pos=1 i2c2 btf_rx_irq=1 rxne_isolated=1 stop_before_dr=1 rxne_after_first=1 release=1 rxne_cleared=1 data=00001980 ok"
      - "i2c2 nack=00000400 no_addr=1 ev_isolated=1 er_isolated=1 er_irq=1 er_masked_release=1 af_cleared=1 idle=1 er_released=1 ok"
      - "spi1 max31855=01901600 txe_irq=1 rxne_irq=1 released=1 ok"
      - "usart1 txe_irq=1 released=1 ok"
      - "usart1 rxne_irq=1 data=00000052 released=1 ok"
      - "BLACKPILL PASS"
  - gpio_edges:
      pin: "gpioc:13"
      min_edges: 5
  - memory_value:
      address: 0x20017F00
      expected_value: 0xB1AC03FF
      size: 4
  - expected_stop_reason: max_steps
