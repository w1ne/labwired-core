# Cortex-M33 CPU0, LP_FLEXCOMM0 selection/status, LPUART register readback,
# TX, injected RX/NVIC, and PSP/MSP exception frames with CCR.STKALIGN enabled
# and disabled on PSP and MSP stacks, plus nested external IRQ preemption, on
# the exact imported MIMXRT700-EVK system.
# LPI2C/LPSPI transactions are not modelled or claimed.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-mimxrt700-evk-smoke"
  system: "../../configs/systems/onboarding/mimxrt700_evk.yaml"
limits:
  max_steps: 15000000
uart_injections:
  - uart: "flexcomm0"
    bytes: "RS"
assertions:
  - uart_contains: "MIMXRT700 LP_FLEXCOMM0 LPUART SMOKE"
  - uart_contains: "rx lpuart0 re_off=1 queued=2 masked=1 asserted=1 masked_data=1 unmasked=1 data=00000052,00000053 released=1 irq=11111 handler=1 ipsr=00000017 exc_return=fffffffd psp_context=1 frame_r0=12345678 frame_pc="
  - uart_contains: "padded_context=0000000f padded_xpsr=01000200 padded_sp=200000d8"
  - uart_contains: "unaligned_context=0000001f unaligned_xpsr="
  - uart_contains: "msp_context=000003ff msp_r0=9bdf1357 msp_xpsr="
  - uart_contains: "msp_noalign_context=0000001f msp_noalign_r0=2468ace0 msp_noalign_xpsr=01000000 msp_noalign_sp=200000dc msp_noalign_after=200000fc restore=1"
  - uart_contains: "nested=000000ff outer=00000017 nested_ipsr=00000018 exc=fffffffd,fffffff1 order=00000002,00000003 active=00000180->00000000 stack=1,1 priorities=00000080,00000020"
  - uart_ordered:
      - "flexcomm0 pselid=00103070->00103071->00103079"
      - "lpuart0 verid=04010003 param=00000202 baud=0f00001a ctrl=00880000 istat=00000001"
      - "pass=00000fff"
  - memory_value:
      address: 0x20000008
      expected_value: 0x00000143
      size: 4
  - memory_value:
      address: 0x2000000c
      expected_value: 0x70000fff
      size: 4
  - memory_value:
      address: 0x20000010
      expected_value: 0x0000000f
      size: 4
  - memory_value:
      address: 0x20000014
      expected_value: 0x12345678
      size: 4
  - memory_value:
      address: 0x2000001c
      expected_value: 0x01000000
      size: 4
  - memory_value:
      address: 0x20000020
      expected_value: 0x200000e0
      size: 4
  - memory_value:
      address: 0x20000024
      expected_value: 0x0000000f
      size: 4
  - memory_value:
      address: 0x20000028
      expected_value: 0x01000200
      size: 4
  - memory_value:
      address: 0x2000002c
      expected_value: 0x200000d8
      size: 4
  - memory_value:
      address: 0x20000030
      expected_value: 0x200000fc
      size: 4
  - memory_value:
      address: 0x20000034
      expected_value: 0x0000001f
      size: 4
  - memory_value:
      address: 0x20000038
      expected_value: 0x01000000
      mask: 0x01000200
      size: 4
  - memory_value:
      address: 0x2000003c
      expected_value: 0x200000dc
      size: 4
  - memory_value:
      address: 0x20000040
      expected_value: 0x200000fc
      size: 4
  - memory_value:
      address: 0x20000044
      expected_value: 0x000003ff
      size: 4
  - memory_value:
      address: 0x20000048
      expected_value: 0x9bdf1357
      size: 4
  - memory_value:
      address: 0x2000004c
      expected_value: 0x01000200
      mask: 0x01000200
      size: 4
  - memory_value:
      address: 0x20000060
      expected_value: 0x000000ff
      size: 4
  - expected_stop_reason: max_steps
