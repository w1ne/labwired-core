# ARM-state integer loop against the imported Cortex-R52 profile. This probes
# CPU admission only; it does not exercise R52-specific instructions or MMIO.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/cortex-r52-cpu-smoke.elf"
  system: "../../configs/systems/onboarding/cortex-r52.yaml"
limits:
  max_steps: 100000
assertions:
  - expected_stop_reason: max_steps
