# Direct-ELF RV32IMAC and LiteX UART smoke against the imported Tock platform.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imac-unknown-none-elf/release/firmware-litex-tock-smoke"
  system: "../../configs/systems/onboarding/litex_tock.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "LITEX TOCK RV32IMAC UART mul=323 amo=19"
  - expected_stop_reason: max_steps
