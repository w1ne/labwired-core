# Direct A32 fixture against the bounded imported renesas_rz_t2m profile: one Cortex-R52 PE (Hyp-mode reset entry), System RAM at 0x10000000, and polled SCI0 TX only. The banner prints only if MIDR reports Cortex-R52.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/rz-t2m-r52-sci-smoke.elf"
  system: "../../configs/systems/onboarding/renesas_rz_t2m.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "RZ/T2M R52 SCI0 SMOKE"
  - expected_stop_reason: max_steps
