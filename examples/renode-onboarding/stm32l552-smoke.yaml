# Cortex-M33 smoke against the imported Renode STM32L552 system.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-l552ze-smoke"
  system: "../../configs/systems/onboarding/stm32l552.yaml"
limits:
  max_steps: 2000000
uart_injections:
  - uart: "lpuart1"
    bytes: "abcdefRS"
assertions:
  - uart_regex: "^NUCLEO-L552ZE-Q SMOKE"
  - uart_contains: "NUCLEO-L552ZE-Q SMOKE"
  - uart_ordered:
      - "cpu=cortex-m33 uart=lpuart1"
      - "rxft=lpuart1 thresholds=8,7,6,4,2,1 boundary=1 states=111111111111 irq=1111 bytes=abcdef ok"
      - "rx=lpuart1 rxne_before=1 irq_isolated=1 irq_asserted=1 reasserted=1 data=00000052,00000053 rxne_after=0 irq_released=1 ok"
      - "tx_irq lpuart1 txe=1 tc=1 both=1 ok"
      - "systick pendsv m33 tailchain frame=1 r0=1 pending=1 ipsr=14 ok"
      - "led=ld1 odr=00000080"
      - "led=ld1_off odr=00000000"
      - "led=ld2 odr=00000080"
      - "led=ld2_off odr=00000000"
      - "led=ld3 odr=00000200"
      - "led=ld3_off odr=00000000"
      - "btn=0"
      - "hb=0 odr=00000080 btn=0"
  - expected_stop_reason: max_steps
