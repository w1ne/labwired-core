# Cortex-M0+ smoke against the EZR32HG320 onboarding system (Renode
# platforms/cpus/silabs/ezr32/ezr32hg320.repl). USART0 carries the Series-0
# GPIO/TIMER checks shared with the EFM32 smokes (s0.rs); TIMER3 is absent,
# so its check is skipped. PF4 toggles in the idle loop on TIMER0 overflows.
# Summary word at 0x20001F00.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-ezr32hg320-smoke"
  system: "../../configs/systems/onboarding/ezr32hg320.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EZR32HG320 RENODE SMOKE"
  - uart_ordered:
      - "gpio pf4/pf5 pushpull set=1 tgl=1 clr=1 wo=1 ok"
      - "gpio pa0 disabled_din0=1 pullup=1 pulldown=1 ok"
      - "gpio pa1 wiredand pa2 wiredor hi=3 lo=0 ok"
      - "gpio pa pinlockn reset=ffff after=fffe ok"
      - "tim0 up of=1 pend=1 released=1 running=1 ok"
      - "tim1 down oneshot dir=1 stopped=1 if=2 cnt=00c8 ok"
      - "tim2 cc0 hit=1 topbv=1 of=1 top=03e8->01f4 ok"
      - "EZR32HG PASS"
  - gpio_edges:
      pin: "gpiof:4"
      min_edges: 4
  - memory_value:
      address: 0x20001F00
      expected_value: 0xEF32007F
      size: 4
  - expected_stop_reason: max_steps
