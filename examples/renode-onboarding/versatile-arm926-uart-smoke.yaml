# Direct A32 fixture against the bounded imported versatile profile: one ARM926EJ-S, a 64 KiB SDRAM aperture at 0x00000000, and polled PL011 UART0 TX only.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/versatile-arm926-uart-smoke.elf"
  system: "../../configs/systems/onboarding/versatile.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "VERSATILE ARM926 UART SMOKE"
  - expected_stop_reason: max_steps
