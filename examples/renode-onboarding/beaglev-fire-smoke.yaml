# Run the committed stock Zephyr v4.1.0 PolarFire U54 hello image against the
# exact imported BeagleV-Fire system. This checks one U54 execution subset and
# its bounded memory/UART profile; it does not boot the HSS or Linux.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/mpfs-zephyr-hello.elf"
  system: "../../configs/systems/onboarding/beaglev-fire.yaml"
limits:
  max_steps: 2000000
  max_cycles: 60000000
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v4.1.0 ***"
      - "Hello World! mpfs_icicle/polarfire/u54"
  - expected_stop_reason: max_steps
