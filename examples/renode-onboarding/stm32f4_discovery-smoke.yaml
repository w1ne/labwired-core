# Cortex-M4 smoke against the imported Renode STM32F4-Discovery system.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-f4-discovery-smoke"
  system: "../../configs/systems/onboarding/stm32f4_discovery.yaml"
limits:
  max_steps: 4000000
uart_injections:
  - uart: "usart2"
    bytes: "RS"
stimuli:
  - target: { component: "pot_adc1_in1", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 25.0
  - target: { component: "pot_adc1_in9", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 50.0
assertions:
  - uart_contains: "F4-DISCO SMOKE"
  - uart_contains: "USART2 RX GATE re_off=1 ue_off=1 data=00005253 released=1 ok"
  - uart_contains: "SPI1 MAX31855=01901600 TXEIRQ=1 REARM=0 RXNEIRQ=1 RELEASED=1"
  - uart_contains: "SPI1 CHECKS=1"
  - uart_contains: "ADC1 IN1=000003FF EOC=1 OK"
  - uart_contains: "ADC1 SCAN IN1=000003FF IN9=000007FF IRQ=1 RELEASED=1 END=1 OK"
  - uart_contains: "ADC1 SCAN CONT=000007FF,000007FF,000007FF GROUPS=3 IRQ=1 OVR=0 STOP=1 OK"
  - uart_contains: "SysTick PendSV tailchain frame=1 r0=1 pending=1 ipsr=14 ok"
  - uart_contains: "SysTick PendSV PSP tailchain frame=1 r0=1 pending=1 ipsr=14 ok"
  - uart_ordered:
      - "hb=0 ld4=on odr=00001000"
      - "hb=1 ld4=off odr=00000000"
      - "hb=2 ld3=on odr=00002000"
      - "hb=3 ld3=off odr=00000000"
  - expected_stop_reason: max_steps
