# Cortex-M0 smoke against the imported STM32F072xB profile: RCC reset state
# and an enforced clock gate, USART1..4 TX and TXE interrupts (USART3/4 on
# the shared line 29), GPIOA..F reset values and set/reset, EXTI software and
# pad edges through the SYSCFG port mux on the grouped vectors (PF = code 5),
# and TIM1/2/3/6/7/14/15/16/17 width, counting and update interrupt on the
# right NVIC line; SPI1/SPI2 (FIFO SPI, 8-bit frames by byte access) each
# reading its own MAX31855 frame with TXEIE and RXNEIE assertion, NVIC
# re-pending, mask/re-enable, and release checks (then SPI1 through DMA1
# channels 2/3 on the shared channel-2/3 line), I2C1 reading a TMP102 plus
# RXIE and a NACK on the combined line; two MAX31855s sharing SPI1 behind
# GPIO chip selects PA4 / PB0; CRC-32 with the INIT reload; and the ADC
# (calibration, a 12-bit sequence over two pots, TS and V_REFINT with EOS on
# line 12, 8-bit descending through DMA1 channel 1, overrun, watchdog,
# off). The two
# fixture switches (PF1, PC13) are pressed by the stimuli below; the first
# stimuli set the SPI2 and second SPI1 thermocouples.
# It does not claim ADC triggers, CAN, RTC, I2C2, DAC, USB or the watchdogs.
# The core SysTick smoke checks ENABLE pause/resume on both the processor
# clock and the STM32F072 HCLK/8 reference clock, then checks repeated
# HCLK/8 timer wraps enter exception 15 and expose COUNTFLAG in the handler;
# multiple masked reference-clock wraps coalesce into one pending exception;
# updating RVR leaves the in-progress period intact; CALIB exposes the
# part-specific value and ignores writes to its RO register; CVR clears
# COUNTFLAG without discarding an already-pending SysTick exception. The final
# SysTick-to-PendSV case checks lower-priority deferral, exception-frame reuse,
# and the live handler R0 marker on Cortex-M0.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-stm32f072-smoke"
  system: "../../configs/systems/onboarding/stm32f072.yaml"
limits:
  max_steps: 4000000
stimuli:
  - target: { component: "pot_in9", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 25.0
  - target: { component: "tc_spi2", channel: "temperature" }
    trigger: !after_cycles { cycles: 1000 }
    value: 100.0
  - target: { component: "tc_spi1b", channel: "temperature" }
    trigger: !after_cycles { cycles: 1000 }
    value: 50.0
  - target: { component: "sw_pf1", channel: "pressed" }
    trigger: !after_cycles { cycles: 1500000 }
    value: 1.0
  - target: { component: "sw_pf1", channel: "pressed" }
    trigger: !after_cycles { cycles: 1700000 }
    value: 0.0
  - target: { component: "sw_pf1", channel: "pressed" }
    trigger: !after_cycles { cycles: 2100000 }
    value: 1.0
  - target: { component: "sw_pf1", channel: "pressed" }
    trigger: !after_cycles { cycles: 2300000 }
    value: 0.0
  - target: { component: "sw_pc13", channel: "pressed" }
    trigger: !after_cycles { cycles: 2700000 }
    value: 1.0
  - target: { component: "sw_pc13", channel: "pressed" }
    trigger: !after_cycles { cycles: 2900000 }
    value: 0.0
assertions:
  - uart_contains: "STM32F072 Cortex-M0 smoke"
  - uart_contains: "usart2 ok"
  - uart_contains: "usart3 ok"
  - uart_contains: "usart4 ok"
  - uart_ordered:
      - "rcc reset=1 gate=1 ok"
      - "usart irq u2=1 u3=1 u4=1 ok"
      - "gpio pa=1 reset=1 pf=1 de=1 ok"
      - "exti swier masked=1 routed=1 ok"
      - "tim1 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim2 arr=0xFFFFFFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim3 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim6 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim7 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim14 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim15 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim16 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim17 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "exti pads idle=1 presses=1 pa_quiet=1 pf1=1 pc13=1 ok"
      - "spi1 frame=0x01901600 ds=1 data=1 pend=1 alone=1 released=1 ok"
      - "spi1 TXEIE pend=1 released=1 ok"
      - "spi1 RXNEIE asserted=1 repended=1 masked=1 unmasked=1 released=1 ok"
      - "spi2 frame=0x06401600 ds=1 data=1 pend=1 alone=1 released=1 ok"
      - "spi2 TXEIE pend=1 released=1 ok"
      - "spi2 RXNEIE asserted=1 repended=1 masked=1 unmasked=1 released=1 ok"
      - "dma1 spi1 frame=0x01901600 data=1 flags=1 pend=1 alone=1 released=1 ok"
      - "i2c1 tmp102=0x00001900 oar=1 data=1 rx_pend=1 nack=1 nack_pend=1 stop=1 released=1 ok"
      - "spi1 shared a=0x01901600 b=0x03201600 after_cut=0x01901600 a=1 b=1 restart=1 ok"
      - "crc word=0xDF8A8A2B seed=1 std=1 init=1 ok"
      - "adc in1=0x000007FF ts=0x00000709 cal=1 ready=1 seq=1 eos=1 pend=1 released=1 dma=1 ovr=1 awd=1 off=1 ok"
      - "systick pause-resume window=1 frozen=1 resumed=1"
      - "systick external pause-resume reference=1 window=1 frozen=1 resumed=1"
      - "systick external periodic reference=1 entries=0x00000003 active=1 countflag=1 pending=0 ok"
      - "systick external pending-coalesce reference=1 wraps=0x00000003 pending_each=1 masked=1 pending_after_disable=1 entries=0x00000001 active=1 cleared=1 ok"
      - "systick reload-update window=1 preserved=1 first_wrap=1 next_reload=1"
      - "systick calib=0x40001770 tenms=0x00001770 skew=1 noref=0 write_ignored=1 ok"
      - "systick cvr-clear reference=1 wrapped=1 pending_before=1 countflag_clear=1 pending_preserved=1 masked=1 entries=0x00000001 handler_countflag_clear=1 active=1 returned=1 ok"
      - "pendsv clear pending=1 canceled=1 fresh repend=1 entries=0x00000001 ipsr=0x0000000E returned=1 ok"
      - "systick pendsv M0 tailchain deferred=1 frame_reused=1 r0_live=1 pending_clear=1 ipsr=0x0000000E ok"
      - "summary 0xFFFFFFFF"
      - "DONE"
  - memory_value:
      address: 0x20003000
      expected_value: 0xFFFFFFFF
      size: 4
  - gpio_edges:
      pin: "gpiof:0"
      min_edges: 4
  - expected_stop_reason: max_steps
