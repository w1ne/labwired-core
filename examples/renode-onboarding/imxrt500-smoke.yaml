# Cortex-M33 MIMXRT595S smoke against the exact imported Renode imxrt500 system.
# This imported system has no EVK wiring, so GPIO assertions cover only the
# model's output-latch readback; board LEDs and button levels are not claimed.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-mimxrt595-evk-smoke"
  system: "../../configs/systems/onboarding/imxrt500.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "MIMXRT595 EVK SMOKE"
  - uart_ordered:
      - "cpu=cortex-m33 uart=flexcomm0 pselid=000000f1 fifosize=16"
      - "fcb tag=42464346 vtor=08001000"
      - "clk frodivsel=1 mainclksela=1 pscctl0=00000100 pscctl1=0000000b"
      - "leds=off r=0 g=0 b=0 pin0=00000000"
      - "set red r=1 g=0 b=0 pin0=00004000"
      - "byte green r=1 g=1 b=0 pin0=00004000"
      - "word blue r=1 g=1 b=1 pin0=00004000"
      - "not red r=0 g=1 b=1 pin0=00000000"
      - "mpin red r=1 g=1 b=1 pin0=00004000"
      - "clr all r=0 g=0 b=0 pin0=00000000"
      - "hb=0 green=1"
      - "hb=1 green=0"
  - expected_stop_reason: max_steps
