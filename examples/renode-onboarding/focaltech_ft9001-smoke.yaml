# Imported FocalTech FT9001 smoke.
# Exercises the Cortex-M4F, memory, USART2 polled-register, CPM, reset and
# TRNG profile declared by configs/systems/onboarding/focaltech_ft9001.yaml.
# "AB" is in the RX FIFO from the start; "Z" arrives at 1,000,000 cycles.
# Boot 1 ends with RCR.SOFTRST; boot 2 reads RSR = software (bit 5). The TRNG
# words are the model's fixed-seed sequence; boot 2 continues it.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-ft9001-smoke"
  system: "../../configs/systems/onboarding/focaltech_ft9001.yaml"
limits:
  max_steps: 4000000
uart_injections:
  - uart: "usart2"
    bytes: "AB"
  - uart: "usart2"
    bytes: "Z"
    trigger: !after_cycles { cycles: 1000000 }
assertions:
  # The 'X' written before CR2.TE was set must not precede the banner.
  - uart_regex: "^FT9001 SMOKE\r\n"
  - uart_ordered:
      - "cpu=cortex-m4f uart=usart2"
      - "cr2=0c cr1=00 bdh=01 bdl=56 brdf=1a fcr=c0"
      - "rx fsr=64 drl=A fsr=64"
      - "rxfclr fsr=45 drl=00 fcr2=00"
      - "late drl=Z fsr=45"
      - "te=off|te=on"
      - "cpm ocsr=0000ff00 csw=00000201 src0=osc8m ocsr=0000ff08 csw=00000201 cder=00000001"
      - "trng ctrl=00ff093b w=e124b63a w=8b9a74ab w=64e1b3ac distinct=1"
      - "rsr=08 por=1 softrst"
      - "boot2 rsr=20 rcr=00000000 csw=00000201 cder=00000000 trng=00000800"
      - "trng ctrl=00ff093b w=00174626 w=f2adbbaf w=fed75123 distinct=1"
      - "FT9001 SMOKE DONE"
  - expected_stop_reason: max_steps
