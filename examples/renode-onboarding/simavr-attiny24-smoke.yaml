# GPIO smoke against the imported ATtiny24 profile (the part has no USART).
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/avr/attiny24-io-smoke.elf"
  system: "../../configs/systems/onboarding/simavr-attiny24.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value: {address: 0x0090, expected_value: 0x7F, size: 1}
  - gpio_edges:
      pin: "portb:0"
      min_edges: 2
  - expected_stop_reason: max_steps
