# Cortex-M4F UART1..4, ITIM32_1..6 / ITIM64, GPIO0..F, MTC, TWD, HFCG/LFCG, memory-window and SPIP smoke on the imported system.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nuvoton-npcx9-smoke"
  system: "../../configs/systems/onboarding/nuvoton_npcx9.yaml"
# The TWD T0 timer runs from reset and wakes the idle core every 2 s, so the
# run ends on max_cycles (idle time does not count toward max_steps).
limits:
  max_steps: 2000000
  max_cycles: 100000000
# Two bytes per UART2..4: the first is polled (own port only), the second
# arrives through the FIFO-mode RX interrupt.
uart_injections:
  - uart: "cr_uart2"
    bytes: "bB"
  - uart: "cr_uart3"
    bytes: "cC"
  - uart: "cr_uart4"
    bytes: "dD"
assertions:
  - uart_contains: "NPCX9 UART1 smoke"
  - uart_contains: "itim regs=1 en=1 run=1 stop=1 irq=3 sts_cleared=1 sts=1 masked=1 pend=1 rel=1 each=6 w64=1 borrow=1 lfclk=1 ok"
  - uart_contains: "gpio ports=16 latch=1 drive=1 pull=1 od=1 lock=1 ok"
  - uart_contains: "uarts tbe=3 rx=3 isolated=1 ok"
  - uart_contains: "uart irq fts=4 txp=4 txrel=4 frs=3 rx=3 hits=3 drained=3 ok"
  - uart_contains: "mtc ttc=1 pt=1 irq=3 steps=1 ms1=1000 ms2=1000 ok"
  - uart_contains: "twd regs=1 t0=1 irq=3 ms1=1000 ms2=1000 tc=1 lock=1 unlock=1 run=1 touch=1 dec=1 stop=1 ok"
  - uart_contains: "cdcg load=1 div=1 hlock=1 lf=1 llock=1 ok"
  - uart_contains: "mem code=1 data=1 image=1 pm=4 bb=1 ok"
  - uart_contains: "spip reset=1 off=1 x8=1 x16=1 cfg=1 quiet=1 rirq=1 rclr=1 wirq=1 wclr=1 ok"
  # Exactly nine T0 IRQs, then the watchdog reset and the second boot.
  - uart_contains: "twd expire .........|twd reboot wdrst=1 stopped=1 clr=1 t0=1 ok"
  # Battery-backed RAM keeps its signature across the watchdog reset.
  - uart_contains: "bbram kept=1 ok"
  - uart_contains: "cr_uart2 tx"
  - uart_contains: "cr_uart3 tx"
  - uart_contains: "cr_uart4 tx"
  - expected_stop_reason: max_cycles
