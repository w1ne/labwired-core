# Single-PE AArch64 smoke against the narrowed imported Cortex-A53 SMP system.
# Reuses the deterministic integer-loop fixture; SMP and MMIO are not tested.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/imx8mplus-a53-cpu-smoke.elf"
  system: "../../configs/systems/onboarding/cortex-a53-gicv3_smp.yaml"
limits:
  max_steps: 100000
assertions:
  - expected_stop_reason: max_steps
