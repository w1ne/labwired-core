# Cortex-M33 Series-2 USART0, TIMER0 and TIMER1 smoke against the narrowed imported EFR32xG22 system.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-efr32xg22-smoke"
  system: "../../configs/systems/onboarding/efr32xg22.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EFR32xG22 Cortex-M33 USART0 smoke"
  - uart_contains: "timers w32=1 w16=1 run=1 cnt=1 stop=1 irq=3 direct_kept=1 alias_clr=1 t1of=1 t1masked=1 t1pend=1 t1rel=1 ok"
  - expected_stop_reason: max_steps
