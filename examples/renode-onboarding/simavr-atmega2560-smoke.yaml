# Arduino Mega ATmega2560 smoke against the narrowed imported simavr profile.
# Checks USART0 output, ADC values on channels 0/8/9, and the D13/PB7 LED edge.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/avr/arduino-mega-2560-io.elf"
  system: "../../configs/systems/onboarding/simavr-atmega2560.yaml"
limits:
  max_steps: 15000000
assertions:
  - uart_contains: "MEGA READY"
  - uart_contains: "k=1 a8=512 a9=512 a0=512 ms=200 f=6"
  - gpio_edges:
      pin: "portb:7"
      min_edges: 2
  - expected_stop_reason: max_steps
