# RV32IMC direct-ELF execution against the narrowed Tock VeeR EL2 profile.
# The memory assertion proves the explicit M-extension multiply and RAM write.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-tock-veer-el2-smoke"
  system: "../../configs/systems/onboarding/tock_veer_el2_sim.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x20600000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
