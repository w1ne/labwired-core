# Bare-metal MSS GPIO fixture (examples/renode-onboarding/mpfs-gpio-smoke.S)
# against the imported polarfire-soc profile. It drives GPIO_0..2 through the
# mss_gpio.h register map and prints each bank's readback on MMUART1. The
# zero-answering stub this replaced prints 00000000 for all three. Then a
# GPIO_0 port-0 rising edge raises PLIC source 51 (GPIO_0 non-direct); the
# hart takes MEIP (mcause 0x800000000000000b), claims 51, clears the GPIO
# latch and completes. The zero-answering PLIC window this replaced never
# interrupted: it printed id=00000000.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/mpfs-gpio-smoke.elf"
  system: "../../configs/systems/onboarding/polarfire-soc.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "MPFS MSS GPIO SMOKE"
  - uart_contains: "gpio2.out=0001a5a4 gpio0.in=00003fff gpio1.out=0000ff00"
  - memory_value: {address: 0x20122088, expected_value: 0x0001A5A4}  # GPIO_2 GPIO_OUT
  - memory_value: {address: 0x20120084, expected_value: 0x00003FFF}  # GPIO_0 GPIO_IN (14 ports)
  - memory_value: {address: 0x20121094, expected_value: 0x00000000}  # GPIO_1 CFG_BYTE[1] is write-only
  - memory_value: {address: 0x2012103C, expected_value: 0x00000005}  # GPIO_1 GPIO_CFG[15] from CFG_BYTE[1]
  - uart_contains: "plic prio=00000007 claim0=00000000 id=00000033 mcause=800000000000000b pending=00000000"
  - memory_value: {address: 0x20120080, expected_value: 0x00000000}  # GPIO_0 GPIO_IRQ cleared by the handler
  - expected_stop_reason: max_steps
