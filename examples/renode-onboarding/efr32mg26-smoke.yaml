# Cortex-M33 USART1, TIMER0 and TIMER1 smoke against the narrowed imported EFR32MG26 system.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-efr32mg26-smoke"
  system: "../../configs/systems/onboarding/efr32mg26.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EFR32MG26 Cortex-M33 USART1 smoke"
  - uart_contains: "timers w32=1 t1w32=1 run=1 cnt=1 stop=1 irq=3 direct_kept=1 alias_clr=1 t1of=1 t1masked=1 t1pend=1 t1rel=1 ok"
  - expected_stop_reason: max_steps
