# Main Cortex-M33, exact DA14592 code/SRAM map, and modeled DA UART0 only.
# The auxiliary Cortex-M0+ CMAC core and other peripherals are not exercised.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-renesas-da14592-smoke"
  system: "../../configs/systems/onboarding/renesas-da14592.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "DA14592 M33 UART0 smoke; mul=323"
  - memory_value:
      address: 0x20000000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
