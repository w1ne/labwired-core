# DA14592 smoke against the imported renesas-da14592 system: both UART LSR
# resets, P0/P1 GPIO DATA/SET/RESET/MODE/WEAK_CTRL, SRAM/ROM/eFlash-data
# mirrors, SRAM top, P0.5 pulses, a line on each UART.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-renesas-da14592-smoke"
  system: "../../configs/systems/onboarding/renesas-da14592.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "DA14592 M33 UART0 smoke"
  - uart_contains: "DA14592 UART1 line"
  - uart_contains: "DA14592 checks PPPPPPPPPP DONE"
  - memory_value:
      address: 0x20017F00
      expected_value: 0xDA1403FF
      size: 4
  - gpio_edges:
      pin: "gpio:5"
      min_edges: 6
  - expected_stop_reason: max_steps
