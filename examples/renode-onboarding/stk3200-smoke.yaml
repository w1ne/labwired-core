# Smoke against the EFM32ZG STK3200 (Zero Gecko starter kit) system: the
# efm32zg222 chip surface (included whole) plus board LEDs on PC10/PC11. Runs
# the efm32zg222 chip smoke (firmware-efm32zg222-smoke) unchanged; its
# push-pull check drives LED0/LED1 and LED0 toggles on TIMER0 overflows.
# Summary word at 0x20000F00.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-efm32zg222-smoke"
  system: "../../configs/systems/onboarding/stk3200.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EFM32ZG222 RENODE SMOKE"
  - uart_ordered:
      - "EFM32ZG222 RENODE SMOKE"
      - "gpio pc10/pc11 pushpull set=1 tgl=1 clr=1 wo=1 ok"
      - "gpio pa0 disabled_din0=1 pullup=1 pulldown=1 ok"
      - "gpio pa1 wiredand pa2 wiredor hi=3 lo=0 ok"
      - "gpio pa pinlockn reset=ffff after=fffe ok"
      - "tim0 up of=1 pend=1 released=1 running=1 ok"
      - "tim1 down oneshot dir=1 stopped=1 if=2 cnt=00c8 ok"
      - "EFM32ZG PASS"
  - gpio_edges:
      pin: "gpioc:10"
      min_edges: 4
  - memory_value:
      address: 0x20000F00
      expected_value: 0xEF32003F
      size: 4
  - expected_stop_reason: max_steps
