# Cortex-M7 register smoke against the narrowed imported STM32H753 profile.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-stm32h743-smoke"
  system: "../../configs/systems/onboarding/stm32h753.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "STM32H7 register smoke"
  - uart_contains: "tim2 gated=1 arr_reset=1 w32=1 ug=1 uif_clr=1 run=1 masked=1 irq=3 stray=0 stop=1 opm=1 opm_irq=2 rel=1 ok"
  - gpio_edges:
      pin: "gpioPortB:0"
      min_edges: 1
  - expected_stop_reason: max_steps
