# Cortex-M85 scalar instruction and SRAM smoke against the exact imported
# R7FA8M1A system. No peripheral behavior is claimed by this smoke.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-renesas-r7fa8m1a-smoke"
  system: "../../configs/systems/onboarding/renesas-r7fa8m1a.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x22000000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
