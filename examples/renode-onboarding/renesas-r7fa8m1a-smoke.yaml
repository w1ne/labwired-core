# Cortex-M85, RA8 SYSTEM SCICKCR handshake, SCI0 (SCI_B) polled TX and PORT6
# (P600) smoke against the narrowed imported R7FA8M1A profile. It does not
# claim ICU/GPT/AGT/IIC parity, SCI_B interrupts or baud timing accuracy.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-renesas-r7fa8m1a-smoke"
  system: "../../configs/systems/onboarding/renesas-r7fa8m1a.yaml"
limits:
  max_steps: 400000
assertions:
  - memory_value: {address: 0x22000000, expected_value: 0x00000143, size: 4}  # MUL 17*19
  - memory_value: {address: 0x22000004, expected_value: 0x00000001, size: 4}  # SCICKCR = MOCO
  - memory_value: {address: 0x22000008, expected_value: 0x00001200, size: 4}  # CCR3 8N1 LSBF
  - memory_value: {address: 0x2200000C, expected_value: 0x00000001, size: 4}  # PODR6 P600
  - memory_value: {address: 0x40203004, expected_value: 0x7FFFFFFF}  # MSTPCRB & ~MSTPB31
  - uart_contains: "RA8M1 SCI0 SMOKE"
  - gpio_edges:
      pin: "port6:0"
      min_edges: 4
  - expected_stop_reason: max_steps
