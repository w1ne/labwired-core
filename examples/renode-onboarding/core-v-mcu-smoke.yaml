# CPU-and-memory instruction smoke against the exact imported CORE-V MCU system.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-cv32e40p-smoke"
  system: "../../configs/systems/onboarding/core-v-mcu.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x1C000000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
