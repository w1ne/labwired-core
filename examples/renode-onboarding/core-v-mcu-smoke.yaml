# Direct-ELF RV32IMC, SRAM and PULP_STDOUT smoke against the imported core-v-mcu system.
# This is LabWired's RV32IMC interpreter and a register-level STD_OUT model, not
# Renode's CV32E40P; the uDMA UART, timer, GPIO and IRQ controller are not checked.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-cv32e40p-smoke"
  system: "../../configs/systems/onboarding/core-v-mcu.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x1C000000
      expected_value: 0x00000143
      size: 4
  - memory_value:
      address: 0x1C000004
      expected_value: 0x00000000
      size: 4
  - memory_value:
      address: 0x1C000010
      expected_value: 0xC0DE5701
      size: 4
  - uart_contains: "CORE-V stdout ok"
  - expected_stop_reason: max_steps
