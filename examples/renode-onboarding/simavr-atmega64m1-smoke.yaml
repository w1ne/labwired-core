# GPIO smoke against the imported ATmega64M1 profile (no USART is used).
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/avr/atmega64m1-io-smoke.elf"
  system: "../../configs/systems/onboarding/simavr-atmega64m1.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value: {address: 0x0130, expected_value: 0x3F, size: 1}
  - gpio_edges:
      pin: "portb:0"
      min_edges: 2
  - expected_stop_reason: max_steps
