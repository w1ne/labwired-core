# Smoke against the imported LiteX Ibex Renode system descriptor.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-litex-ibex-smoke"
  system: "../../configs/systems/onboarding/litex_ibex.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "LITEX IBEX SMOKE"
  - uart_ordered:
      - "cpu=rv32imc uart=litex"
      - "mul=00000143"
      - "timer=running"
      - "timer=zero"
  - expected_stop_reason: max_steps
