# Smoke against the imported SiFive FE310 Renode system descriptor.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32im-unknown-none-elf/release/firmware-sifive-fe310-smoke"
  system: "../../configs/systems/onboarding/sifive-fe310.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "SIFIVE FE310 SMOKE"
  - uart_ordered:
      - "cpu=rv32im uart=sifive"
      - "mul=00000143"
      - "ecall trap mcause=0000000b mepc_match=1 count=00000001 entry_mie=0 entry_mpie=1 entry_mpp=00000003 return_mie=1 ok"
      - "ebreak trap mcause=00000003 mepc_match=1 count=00000001 resumed=1 entry_mie=0 entry_mpie=1 return_mie=1 ok"
      - "ecall masked mret entry_mie=0 entry_mpie=0 return_mie=0 return_mpie=1 ok"
      - "clint mtimecmp=ffffffffffffffff ticks=00000010 clocks_per_tick=00000764 lfclk_rate=1 mtip_low=1 ok"
      - "clint mtip mcause=80000007 count=00000001 armed_low=1 wfi_wake=1 disarmed=1 ok"
      - "clint msip mcause=80000003 count=00000001 mepc_next=1 cleared=1 ok"
      - "clint msip masked pending=1 released=1 traps=00000000 ok"
      - "plic uart0 ip=00000001 pending=1 disabled_low=1 meip=1 threshold_masks=1 unmasked=1 prio_warl=1 traps=00000000 ok"
      - "plic uart0 mcause=8000000b count=00000001 claim=00000003 ie_cleared=1 pending_clear=1 reclaim=00000000 meip_low=1 ok"
      - "gpio irq rise early=0 rise_ip=00000004 fall_ip=00000000 pending=1 disabled_low=1 meip=1 high_relatch=1 traps=00000000 ok"
      - "gpio irq rise mcause=8000000b count=00000001 claim=0000000a rise_ip=00000000 repended=0 reclaim=00000000 meip_low=1 ok"
      - "gpio irq fall rise_quiet=1 fall_ip=80000000 meip=1 claim=00000027 claimed_clear=1 meip_low=1 reclaim=00000000 traps=00000000 ok"
      - "gpio=PASS input_en=00080000 output_en=00080000 output_val=00080000 input_val=00080000"
  - gpio_edges:
      pin: "gpio:19"
      min_edges: 3
  - expected_stop_reason: max_steps
