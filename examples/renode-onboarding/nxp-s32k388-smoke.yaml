# S32K388 CM7_0, LPUART2 and SIUL2 smoke against the narrowed imported
# nxp-s32k388 profile. Runs the S32K388EVB smoke fixture (crates/firmware-s32k388-evb-smoke):
# IVT handoff to 0x00401000, LPUART2 8N1 output, SIUL2 GPDO/PGPDO/MPGPDO writes
# read back through GPDI/PGPDI, and PTA1 pull-up/pull-down input. SWT_0 and
# MC_ME are write-accepting stubs; no watchdog or clock gating is claimed.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/s32k388-evb-smoke.elf"
  system: "../../configs/systems/onboarding/nxp-s32k388.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "S32K388 EVB SMOKE"
  - uart_ordered:
      - "cpu=cortex-m7 core=cm7_0 uart=lpuart2"
      - "ivt marker=5aa55aa5 cm7_0=00401000 vtor=00401000"
      - "clk aips_slow=24000000 osr=16 sbr=13 baud=115384"
      - "leds=off pgpdo11=0000 pgpdi11=0000"
      - "on ptf17 gpdi=1 pgpdo11=4000 pgpdi11=4000"
      - "on ptf18 gpdi=1 pgpdo11=6000 pgpdi11=6000"
      - "on ptf19 gpdi=1 pgpdo11=7000 pgpdi11=7000"
      - "on ptf22 gpdi=1 pgpdo11=7200 pgpdi11=7200"
      - "on ptf23 gpdi=1 pgpdo11=7300 pgpdi11=7300"
      - "on ptf24 gpdi=1 pgpdo11=7380 pgpdi11=7380"
      - "mpgpdo pgpdo11=0380 pgpdi11=0380"
      - "pgpdo pgpdo11=0000 pgpdi11=0000"
      - "pta1 pu=1 pd=0"
      - "hb=0 ptf23=1"
      - "hb=1 ptf23=0"
  - expected_stop_reason: max_steps
