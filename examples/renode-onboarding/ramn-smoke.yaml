# Bounded Cortex-M33 instruction and SRAM smoke on one imported RAMN ECU.
# It does not claim RAMN CAN, ADC, UART, board wiring, or four-node behavior.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-ramn-smoke"
  system: "../../configs/systems/onboarding/ramn.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x20001000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
