# UT32M0R500 smoke on the Renode platform surface: UART0/UART1, SP804 timer0/1,
# CMSDK AHB GPIO
# banks 0..2 (reset, GPIO2 ALTFUNC reset 0xFFFF, UT32 pulls, OUTEN set/clear,
# masked byte access, edge INTSTATUS, combined GPIO2 IRQ through NVIC), SRAM
# top; GPIO 45 (GPIO2 pin 13) pulses and a line on UART1.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-ut32m0r500-smoke"
  system: "../../configs/systems/onboarding/ut32m0r500.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "UT32M0R500 Cortex-M0+ UART0 smoke"
  - uart_contains: "UT32 checks PPPPPPPPPPPP DONE"
  - uart_contains: "UT32 UART1 line"
  - memory_value:
      address: 0x20017F00
      expected_value: 0x5E320FFF
      size: 4
  - gpio_edges:
      pin: "gpio_bank2:13"
      min_edges: 6
  - fidelity_clean: true
  - expected_stop_reason: max_steps
stimuli:
  - target: { component: "gpio2_irq_button", channel: "pressed" }
    trigger: !after_cycles { cycles: 1000 }
    value: 1.0
