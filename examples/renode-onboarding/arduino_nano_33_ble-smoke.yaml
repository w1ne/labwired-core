# Arduino Nano 33 BLE smoke against its imported Renode system descriptor.
# The fixture checks UARTE0 output and GPIO0 OUT readbacks for the RGB and
# built-in LED pins; it does not claim a modeled LSM9DS1 or LED device.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabihf/release/firmware-arduino-nano-33-ble-smoke"
  system: "../../configs/systems/onboarding/arduino_nano_33_ble.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "ARDUINO NANO 33 BLE SMOKE"
  - uart_ordered:
      - "cpu=nrf52840 uart=uarte0"
      - "rgb=red out=00012040"
      - "rgb=green out=01002040"
      - "rgb=blue out=01012000"
      - "hb=0 out=01012000"
      - "hb=1 out=01012000"
  - expected_stop_reason: max_steps
