# Direct RV32IM integer smoke against the imported CrossLink-NX system.
# This checks SRAM access from an ELF loaded into the Renode ROM window; it
# does not exercise the board reset flow, LiteX peripherals, or extensions
# beyond the generic RV32IM integer subset.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32im-unknown-none-elf/release/firmware-andes-ae350-n25-smoke"
  system: "../../configs/systems/onboarding/crosslink-nx-evn.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x40001000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
