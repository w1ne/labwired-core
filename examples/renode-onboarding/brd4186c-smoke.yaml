# Cortex-M33 EFR32MG24 USART0, TIMER0 and TIMER1 smoke against the narrowed imported BRD4186C system.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-efr32mg24-smoke"
  system: "../../configs/systems/onboarding/brd4186c.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EFR32MG24 Cortex-M33 USART0 smoke"
  - uart_contains: "gpio ip=7 mode=1 set=1 din_hi=1 tgl=1 din_lo=1 set2=1 clr=1 ok"
  - uart_contains: "timers w32=1 run=1 cnt=1 stop=1 irq=3 direct_kept=1 alias_clr=1 t1of=1 t1masked=1 t1pend=1 t1rel=1 ok"
  - gpio_edges:
      pin: "gpiob:2"
      min_edges: 4
  - expected_stop_reason: max_steps
