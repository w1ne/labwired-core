# Cortex-M3 smoke against the imported EFM32LG995 (Leopard Gecko) platform
# (Renode efm32lg995.repl: 256 KiB flash, 32 KiB SRAM). UART0/UART1/USART1/
# USART2 each send one line with STATUS.TXBL set, then USART0 is the console
# for the Series-0 GPIO/TIMER checks shared with EFM32GG995 (s0.rs). PE2
# toggles in the idle loop on TIMER0 overflows. Summary word at 0x20007F00.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-efm32lg995-smoke"
  system: "../../configs/systems/onboarding/efm32lg995.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "EFM32LG995 RENODE SMOKE"
  - uart_ordered:
      - "uart0 status=40 ok"
      - "uart1 status=40 ok"
      - "usart1 status=40 ok"
      - "usart2 status=40 ok"
      - "EFM32LG995 RENODE SMOKE"
      - "gpio pe2/pe3 pushpull set=1 tgl=1 clr=1 wo=1 ok"
      - "gpio pa0 disabled_din0=1 pullup=1 pulldown=1 ok"
      - "gpio pa1 wiredand pa2 wiredor hi=3 lo=0 ok"
      - "gpio pa pinlockn reset=ffff after=fffe ok"
      - "tim0 up of=1 pend=1 released=1 running=1 ok"
      - "tim1 down oneshot dir=1 stopped=1 if=2 cnt=00c8 ok"
      - "tim2 cc0 hit=1 topbv=1 of=1 top=03e8->01f4 ok"
      - "tim3 updown of=1 dir_down=1 uf=1 up_again=1 ok"
      - "EFM32LG PASS"
  - gpio_edges:
      pin: "gpioe:2"
      min_edges: 4
  - memory_value:
      address: 0x20007F00
      expected_value: 0xEF3200FF
      size: 4
  - expected_stop_reason: max_steps
