# Cortex-M23 Thumb instruction and SRAM smoke against the exact imported EK-RA2E1.
# It does not exercise the board's GPIO, SCI, timers, or other peripherals.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.base-none-eabi/release/firmware-renesas-ek-ra2e1-smoke"
  system: "../../configs/systems/onboarding/renesas-ek_ra2e1.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x20004000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
