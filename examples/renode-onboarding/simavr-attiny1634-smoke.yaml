# GPIO smoke against the imported ATtiny1634 profile (USARTs are not used).
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/avr/attiny1634-io-smoke.elf"
  system: "../../configs/systems/onboarding/simavr-attiny1634.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value: {address: 0x0130, expected_value: 0x7F, size: 1}
  - gpio_edges:
      pin: "portb:0"
      min_edges: 2
  - expected_stop_reason: max_steps
