# Cortex-M4 smoke against the imported STM32F412 system using the shared F4
# register fixture. It exercises SysTick/PendSV, USART2, GPIOA, GPIOD, the F4
# RCC subset, and ADC1_IN1/IN2 from external potentiometer test fixtures.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-stm32f429-smoke"
  system: "../../configs/systems/onboarding/stm32f412.yaml"
limits:
  max_steps: 800000
stimuli:
  - target: { component: "pot_adc1_in1", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 25.0
  - target: { component: "pot_adc1_in2", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 50.0
assertions:
  - uart_contains: "STM32F4 shared profile smoke"
  - uart_contains: "systick pendsv psp tailchain frame=1 r0=1 pending=1 ipsr=0000000E ok"
  - uart_contains: "STM32F429 PSP tailchain PASS"
  - uart_contains: "adc1 in1=000003FF gated=1 clock=1 eoc=1 irq=1 clear=1 ok"
  - uart_contains: "adc1 scan=000003FF,000007FF irq=1 pending=1 end=1 released=1 ok"
  - uart_contains: "adc1 scan_cont_groups=000007FF,000007FF,000007FF groups=3 irq=1 ovr=0 stop=1 ok"
  - gpio_edges:
      pin: "gpioPortD:12"
      min_edges: 1
  - expected_stop_reason: max_steps
