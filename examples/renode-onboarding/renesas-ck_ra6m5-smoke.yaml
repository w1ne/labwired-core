# Cortex-M33 instruction and SRAM smoke against the exact imported CK-RA6M5.
# It does not exercise the board's SCI, GPIO, or any other peripherals.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-renesas-ck-ra6m5-smoke"
  system: "../../configs/systems/onboarding/renesas-ck_ra6m5.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x20000000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
