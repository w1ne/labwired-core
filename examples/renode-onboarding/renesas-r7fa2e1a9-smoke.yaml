# Cortex-M23 instruction and SRAM smoke against the exact imported RA2E1 system.
# It does not exercise imported peripherals or claim full RA2E1 parity.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.base-none-eabi/release/firmware-renesas-r7fa2e1a9-smoke"
  system: "../../configs/systems/onboarding/renesas-r7fa2e1a9.yaml"
limits:
  max_steps: 100000
assertions:
  - memory_value:
      address: 0x20004000
      expected_value: 0x00000143
      size: 4
  - expected_stop_reason: max_steps
