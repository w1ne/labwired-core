# Cortex-M4 smoke against the imported Renode nRF52840 system descriptor.
# Bare-register firmware (crates/firmware-nrf52840-demo/src/renode_smoke.rs)
# reports one line per block over UARTE0 (EasyDMA): FICR INFO.PART, NVMC READY,
# CLOCK HFXO/LFXO start events + HFCLKSTAT/LFCLKSTAT, GPIO P0.13 OUT->IN readback,
# GPIOTE task-mode toggles on P0.14 seen at the pad (IN) with OUT untouched,
# TIMER0 compare/capture/clear, RTC0 counter + compare (EVTEN on), two RNG
# samples, and PPI CH0 routing EGU0 TRIGGERED[0] -> EGU1 TRIGGER[0] only while
# the channel is enabled. A summary word lands at 0x2003FF00.
# SAADC converts a 50% potentiometer on AIN3 through EasyDMA, checking the
# 12-bit result and END/AMOUNT. SysTick-to-PendSV tail chaining also checks
# exception-frame reuse and live R0 preservation on the Cortex-M4 profile.
# TEMP: TASKS_START -> EVENTS_DATARDY and a value in the -40..85 degC range
# (the model holds 25 degC = raw 0x64). ECB: the FIPS-197 C.1 AES-128 vector
# through the EasyDMA data block, all 16 ciphertext bytes compared.
# TWIM0: a TMP102 test fixture on twi0 (0x48). CONFIG = 0xFFFF reads back
# 0xFFF0 through a write + repeated-START read (the TMP102 write mask keeps
# R1:R0, AL and D3:D0), the first TEMP read is 0x1900 (25.0 degC), and an
# empty address (0x49) sets EVENTS_ERROR + ERRORSRC.ANACK, cleared by W1C.
# PWM0: one Common step 0x8000 | 100 at COUNTERTOP 400 (16 MHz) on P0.15;
# a branch-free GPIO IN sampling loop must see 20..30% high (measured 2000 of
# 8000 samples = 25%) and >= 10 rising edges; TASKS_STOP returns the pad to
# the GPIO OUT latch. Logic capture also records the peripheral-driven pads:
# gpio_edges on P0.14 (the two GPIOTE toggles) and P0.15 (the PWM0 waveform).
# Before the pad-claim bracket covered peripheral events and logic watches,
# both recorded 0 transitions.
# Not exercised: radio, USBD, QSPI,
# SPIM, UART1, WDT. GPIOTE on a pin whose PIN_CNF.DIR = output is a known
# engine gap (IN shows OUT, not the GPIOTE drive) — see
# attempt-history/nrf52840/2026-11-08-direct-probe-failures.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nrf52840-renode-smoke"
  system: "../../configs/systems/onboarding/nrf52840.yaml"
limits:
  max_steps: 4000000
stimuli:
  - target: { component: "pot_saadc_ain3", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 50.0
assertions:
  - uart_ordered:
      - "NRF52840 RENODE SMOKE"
      - "ficr part=52840 nvmc ready=1 ok"
      - "clock hfstat=00010001 lfstat=00010001 ok"
      - "gpio p0.13 in=00002000/00000000 ok"
      - "gpiote out0 p0.14 in=10 out=0 ok"
      - "timer0 cmp=1 cap>=50 1 clear=00000000 ok"
      - "rtc0 cmp=1 counter>=4 1 ok"
      - "rng valrdy=11 bytes<=ff ok"
      - "ppi egu0->egu1 off=0 on=1 ok"
      - "systick-pendsv frame=1 r0=1 pending=1 priority=1 ok"
      - "saadc ain3=00000755 amount=1 end=1 ok"
      - "temp datardy=1 raw=00000064 ok"
      - "ecb fips197 ct=69c4e0d8..70b4c55a end=1 ok"
      - "twim0 tmp102 cfg=fff0 temp=1900 anack=1 held=1 w1c=1 ok"
      - "pwm0 p0.15 seqend=1 duty=1 rises=1 stop=1 idle=0 ok"
      - "NRF52840 PASS"
  - gpio_edges:
      pin: "gpio0:13"
      min_edges: 4
  - gpio_edges:
      pin: "gpio0:14"
      min_edges: 2
  - gpio_edges:
      pin: "gpio0:15"
      min_edges: 100
  - memory_value:
      address: 0x2003FF00
      expected_value: 0x52843FFF
      size: 4
  - expected_stop_reason: max_steps
