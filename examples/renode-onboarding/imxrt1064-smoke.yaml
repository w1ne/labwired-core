# Cortex-M7 smoke against the exact imported i.MX RT1064 system: LPUART6
# banner, GPIO2 pin 3 toggle, GPT1 reset/count/OF1 IRQ/OF2 level checks, and
# ADC1 calibration plus a 12-bit software conversion of test channel 0.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-imxrt1064-smoke"
  system: "../../configs/systems/onboarding/imxrt1064.yaml"
limits:
  max_steps: 800000
assertions:
  - uart_contains: "OK"
  - uart_contains: "gpt1 swr=1 cnt=1 irq=3 of1=1 of2=1 ok"
  - uart_contains: "lpuart6 tcie ispr=20 rel=00 ok"
  - uart_contains: "adc cal=1 ready=1 coco=1 result=0400 ok"
  - gpio_edges:
      pin: "gpio2:3"
      min_edges: 1
  - expected_stop_reason: max_steps
stimuli:
  - target: { component: "adc1_pot", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 25.0
