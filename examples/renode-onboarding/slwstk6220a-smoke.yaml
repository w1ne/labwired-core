# Cortex-M4F smoke against the SLWSTK6220A system (Renode slwstk6220a.repl =
# ezr32wg330.repl + LEDs on PE2/PE3). UART1/USART1/USART2 each send a line,
# then UART0 carries the Series-0 GPIO/TIMER checks (s0.rs); the push-pull
# check drives LED0/LED1 and LED0 toggles on TIMER0 overflows. Summary word
# at 0x20007F00.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-ezr32-wonder-gecko-smoke"
  system: "../../configs/systems/onboarding/slwstk6220a.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "SLWSTK6220A RENODE SMOKE"
  - uart_ordered:
      - "uart1 status=40 ok"
      - "usart1 status=40 ok"
      - "usart2 status=40 ok"
      - "SLWSTK6220A RENODE SMOKE"
      - "gpio pe2/pe3 pushpull set=1 tgl=1 clr=1 wo=1 ok"
      - "gpio pa0 disabled_din0=1 pullup=1 pulldown=1 ok"
      - "gpio pa1 wiredand pa2 wiredor hi=3 lo=0 ok"
      - "gpio pa pinlockn reset=ffff after=fffe ok"
      - "tim0 up of=1 pend=1 released=1 running=1 ok"
      - "tim1 down oneshot dir=1 stopped=1 if=2 cnt=00c8 ok"
      - "tim2 cc0 hit=1 topbv=1 of=1 top=03e8->01f4 ok"
      - "tim3 updown of=1 dir_down=1 uf=1 up_again=1 ok"
      - "SLWSTK6220A PASS"
  - gpio_edges:
      pin: "gpioe:2"
      min_edges: 4
  - memory_value:
      address: 0x20007F00
      expected_value: 0xEF3200FF
      size: 4
  - expected_stop_reason: max_steps
