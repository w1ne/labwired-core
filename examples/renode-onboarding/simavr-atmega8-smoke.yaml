# GPIOB + polled USART smoke against the imported ATmega8 profile.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/avr/atmega8-io-smoke.elf"
  system: "../../configs/systems/onboarding/simavr-atmega8.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "M8 IO bits=7F"
  - memory_value: {address: 0x0120, expected_value: 0x7F, size: 1}
  - gpio_edges:
      pin: "portb:0"
      min_edges: 2
  - expected_stop_reason: max_steps
