# Cortex-M0+ smoke against the imported STM32L071xZ profile: RCC reset state
# and an enforced clock gate (GPIOH), USART1/2/4/5 and LPUART1 TX and TXE
# interrupts each on its own line (USART4/5 on the shared 14), GPIOA-E/H
# reset values and set/reset, EXTI software and pad edges through the
# SYSCFG port mux on the grouped vectors (PH = code 5), TIM2/3/6/7/21/22
# width, counting and update interrupt on the right NVIC line; SPI1/SPI2
# (classic SPI) each reading its own MAX31855 frame (polled, then through
# DMA1 channels 2/3 and 4/5, which move nothing until CSELR selects the
# SPI), I2C1/2/3 each reading its own TMP102 plus RXIE and a NACK on the
# bus's line; two MAX31855s sharing SPI1 behind GPIO chip selects PA4 /
# PB0; and CRC-32 with the INIT reload.
# The two fixture switches (PH1, PC13) are pressed by the stimuli below; the
# first stimuli turn the IN9 potentiometer to 25 % and set the SPI2 and
# second SPI1 thermocouples.
# The ADC: calibration, a software sequence over two potentiometers
# (IN1, IN9), V_REFINT and the temperature sensor, EOS on line 12, the
# same sequence 8-bit descending through DMA1 channel 1, OVR and the
# analog watchdog.
# It does not claim COMP, LPTIM1, RTC or the watchdogs.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-stm32l071-smoke"
  system: "../../configs/systems/onboarding/stm32l071.yaml"
limits:
  max_steps: 4000000
stimuli:
  - target: { component: "pot_in9", channel: "position" }
    trigger: !after_cycles { cycles: 1000 }
    value: 25.0
  - target: { component: "tc_spi2", channel: "temperature" }
    trigger: !after_cycles { cycles: 1000 }
    value: 100.0
  - target: { component: "tc_spi1b", channel: "temperature" }
    trigger: !after_cycles { cycles: 1000 }
    value: 50.0
  - target: { component: "sw_ph1", channel: "pressed" }
    trigger: !after_cycles { cycles: 1500000 }
    value: 1.0
  - target: { component: "sw_ph1", channel: "pressed" }
    trigger: !after_cycles { cycles: 1700000 }
    value: 0.0
  - target: { component: "sw_ph1", channel: "pressed" }
    trigger: !after_cycles { cycles: 2100000 }
    value: 1.0
  - target: { component: "sw_ph1", channel: "pressed" }
    trigger: !after_cycles { cycles: 2300000 }
    value: 0.0
  - target: { component: "sw_pc13", channel: "pressed" }
    trigger: !after_cycles { cycles: 2700000 }
    value: 1.0
  - target: { component: "sw_pc13", channel: "pressed" }
    trigger: !after_cycles { cycles: 2900000 }
    value: 0.0
assertions:
  - uart_contains: "STM32L071 Cortex-M0+ smoke"
  - uart_contains: "usart2 ok"
  - uart_ordered:
      - "rcc reset=1 gate=1 ok"
      - "usart irq u1=1 u2=1 u4=1 u5=1 lp1=1 ok"
      - "gpio pa=1 reset=1 ph=1 de=1 ok"
      - "exti swier masked=1 routed=1 ok"
      - "tim2 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim3 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim6 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim7 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim21 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim22 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "exti pads idle=1 presses=1 pa_quiet=1 ph1=1 pc13=1 ok"
      - "spi1 frame=0x01901600 data=1 pend=1 alone=1 released=1 ok"
      - "spi2 frame=0x06401600 data=1 pend=1 alone=1 released=1 ok"
      - "dma1 spi1 frame=0x01901600 unselected=1 cselr=1 data=1 flags=1 pend=1 alone=1 released=1 ok"
      - "dma1 spi2 frame=0x06401600 unselected=1 cselr=1 data=1 flags=1 pend=1 alone=1 released=1 ok"
      - "i2c1 tmp102=0x00001900 oar=1 data=1 rx_pend=1 nack=1 nack_pend=1 stop=1 released=1 ok"
      - "i2c2 tmp102=0x00001900 oar=1 data=1 rx_pend=1 nack=1 nack_pend=1 stop=1 released=1 ok"
      - "i2c3 tmp102=0x00001900 oar=1 data=1 rx_pend=1 nack=1 nack_pend=1 stop=1 released=1 ok"
      - "spi1 shared a=0x01901600 b=0x03201600 after_cut=0x01901600 a=1 b=1 restart=1 ok"
      - "crc word=0xDF8A8A2B seed=1 std=1 init=1 ok"
      - "adc in1=0x000007FF ts=0x0000026D cal=1 ready=1 seq=1 eos=1 pend=1 released=1 dma=1 ovr=1 awd=1 off=1 ok"
      - "summary 0x714FFFFF"
      - "DONE"
  - memory_value:
      address: 0x20001000
      expected_value: 0x714FFFFF
      size: 4
  - gpio_edges:
      pin: "gpioh:0"
      min_edges: 4
  - expected_stop_reason: max_steps
