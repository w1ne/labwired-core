# Cortex-M7 smoke against the NUCLEO-F767ZI row, which loads the stm32f777
# silicon profile (Renode: boards/nucleo_f767zi.repl uses
# cpus/stm32f777.repl) plus the board IO: RCC reset state, clock gate and
# the F767 APB1ENR/APB2ENR masks, SRAM2 and the last word of the 512 KiB
# SRAM, all eight U(S)ART TXE lines (USART3 is the board's VCP), LD1/LD2/LD3
# on PB0/PB7/PB14 blinked through BSRR, SYSCFG MEMRMP (SWP_FB)/PMC/CMPCR,
# EXTI software triggers and line 24, B1 on PC13 pressed twice by the
# stimuli below (port A selected in EXTICR4 first: no pend; then port C:
# EXTI line 13 rising edge on EXTI15_10 = 40), TIM1..TIM14 width, counting
# and update line, SPI4/5/6 TXE on their own lines, DMA2 memory-to-memory
# (refused on DMA1), I2C1..4 NACK on their event lines, CRC (CRC-32 and a
# 16-bit polynomial) and RNG draws. SPI frames and the I2C data path have no
# on-board slave here; the stm32f777 fixture smoke covers them. It does not
# claim the Ethernet PHY, USB, ADC, DAC, CAN, SDMMC, QUADSPI, FMC, SAI or
# the watchdogs.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-f767zi-smoke"
  system: "../../configs/systems/onboarding/nucleo_f767zi.yaml"
limits:
  max_steps: 6000000
stimuli:
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 200000 }
    value: 1.0
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 300000 }
    value: 0.0
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 500000 }
    value: 1.0
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 600000 }
    value: 0.0
assertions:
  - uart_regex: "^NUCLEO-F767ZI SMOKE"
  - uart_contains: "NUCLEO-F767ZI SMOKE"
  - uart_contains: "usart3 vcp ok"
  - uart_ordered:
      - "rcc reset=1 gate=1 mask=1 ok"
      - "geometry flash_last=0xFFFFFFFF sram2=1 ok"
      - "usart irq usart1=1 usart2=1 usart3=1 uart4=1 uart5=1 usart6=1 uart7=1 uart8=1 ok"
      - "leds ld1=1 ld2=1 ld3=1 ok"
      - "syscfg memrmp=0x00000D00 pmc=0x008700FF fields=1 cmpcr=1 ok"
      - "exti swier masked=1 routed=1 ok"
      - "exti lines imr=0x01FFFFFF line24=1 ok"
      - "b1 idle=1 presses=1 pa_quiet=1 pc13=1 cleared=1 ok"
      - "tim1 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim2 arr=0xFFFFFFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim5 arr=0xFFFFFFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim14 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "spi456 irq spi4=1 spi5=1 spi6=1 ok"
      - "spi456 TXEIE idle_pend=1 idle_release=1 ok"
      - "dma m2m dma1_refused=1 dma2_copied=1 ok"
      - "i2c1 oar=1 nack=1 nack_pend=1 stop=1 released=1 ok"
      - "i2c4 oar=1 nack=1 nack_pend=1 stop=1 released=1 ok"
      - "crc word=0xDF8A8A2B crc16=0x000029B1 seed=1 std=1 init=1 idr=1 poly16=1 ok"
      - "rng off=1 ready=1 draws=1 stopped=1 ok"
      - "summary 0x7670FFFF"
      - "DONE"
  - memory_value:
      address: 0x20003000
      expected_value: 0x7670FFFF
      size: 4
  - gpio_edges:
      pin: "gpiob:0"
      min_edges: 7
  - gpio_edges:
      pin: "gpiob:7"
      min_edges: 7
  - gpio_edges:
      pin: "gpiob:14"
      min_edges: 7
  - expected_stop_reason: max_steps
