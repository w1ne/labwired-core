# RA6M5 SYSTEM, MSTP, PFS, PORT0 and SCI0 smoke against the narrowed imported
# renesas-r7fa6m5b profile. Runs the EK-RA6M5 smoke fixture
# (crates/firmware-ek-ra6m5-smoke): PRCR/SCKDIVCR clock setup on MOCO,
# MSTPCRB.MSTPB31 clear, P410/P411 routed to SCI0 through PmnPFS behind PWPR,
# SCI0 9600 8N1, then LED1-LED3 walked through PCNTR3 with PODR readback.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/ek-ra6m5-smoke.elf"
  system: "../../configs/systems/onboarding/renesas-r7fa6m5b.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "EK-RA6M5 SMOKE"
  - uart_ordered:
      - "cpu=cortex-m33 uart=sci0"
      - "clk src=moco pclka=8000000 brr=25 baud=9600"
      - "led=blue on pin=1 podr=0040"
      - "led=blue off pin=0 podr=0000"
      - "led=green on pin=1 podr=0080"
      - "led=green off pin=0 podr=0000"
      - "led=red on pin=1 podr=0100"
      - "led=red off pin=0 podr=0000"
      - "s1=1 s2=1"
      - "hb=0 podr=0040 s1=1 s2=1"
      - "hb=1 podr=0040 s1=1 s2=1"
  - memory_value: {address: 0x40084004, expected_value: 0x7FFFFFFF}  # MSTPB31 cleared
  - expected_stop_reason: max_steps
