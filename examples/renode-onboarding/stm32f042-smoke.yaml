# Smoke against the narrowed imported STM32F042 execution profile.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-stm32f042-smoke"
  system: "../../configs/systems/onboarding/stm32f042.yaml"
limits:
  max_steps: 800000
assertions:
  - uart_contains: "STM32F042 profile smoke"
  - gpio_edges:
      pin: "gpioPortA:5"
      min_edges: 1
  - expected_stop_reason: max_steps
