# Cortex-M33 WBA52 smoke against the exact imported NUCLEO-WBA52CG system.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-nucleo-wba52cg-demo"
  system: "../../configs/systems/onboarding/nucleo_wba52cg.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "NUCLEO-WBA52CG ready"
  - uart_ordered:
      - "hb=0 ld1=on"
      - "hb=1 ld1=off"
      - "hb=2 ld2=on"
      - "hb=3 ld2=off"
  - gpio_edges:
      pin: "gpioPortB:4"
      min_edges: 1
  - gpio_edges:
      pin: "gpioPortA:9"
      min_edges: 1
  - expected_stop_reason: max_steps
