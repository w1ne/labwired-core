# SAM4S16C smoke over three boots (firmware-sam4s-smoke/src/family.rs):
# power-on EEFC (FMR, GETD, GPNVM/lock bits, FCMDE) + RSTC/WDT reset state,
# an RSTC software reset, a WDT_MR-armed watchdog reset, then the WDT window
# error interrupt, write-once WDT_MR, PMC clocks, PIO latches and TC0's RC
# compare plus USART0/USART1 TXRDY IRQs 14/15. Summary word 0x5A403FFF
# means all fourteen checks passed.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-sam4s16c-smoke"
  system: "../../configs/systems/onboarding/sam4s16c.yaml"
limits:
  max_steps: 1500000
assertions:
  - uart_ordered:
      - "SAM4S16C RENODE SMOKE"
      - "eefc fmr=00000500 ok"
      - "eefc getd size="
      - "eefc gpnvm=2 set=3 glb=2 clb=0 ok"
      - "eefc fsr badkey=3 after=1 ok"
      - "rstc sr=00010000 wdt mr=3fff2fff ok"
      - "rstc software reset"
      - "SAM4S16C RENODE SMOKE"
      - "rstc rsttyp=3 ok"
      - "wdt arm wdv=2"
      - "SAM4S16C RENODE SMOKE"
      - "wdt rsttyp=2 mr=3fff2fff ok"
      - "wdt window sr=2 pended released ok"
      - "wdt mr once=00801100 ok"
      - "pmc pcsr0="
      - "pio ports=3 ok"
      - "tc0 rc pend=1 ok"
      - "usart0 txrdy imr=2 pend=1 released=1 ok"
      - "usart1 txrdy imr=2 pend=1 released=1 ok"
      - "SAM4S16C PASS"
  - memory_value:
      address: 0x2001FF00
      expected_value: 0x5A403FFF
      size: 4
  - expected_stop_reason: max_steps
