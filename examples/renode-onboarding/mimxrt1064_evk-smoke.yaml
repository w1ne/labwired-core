# Cortex-M7 smoke against the exact imported MIMXRT1064-EVK system, including
# GPT1 reset/count/OF1 IRQ/OF2 level checks.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-imxrt1064-smoke"
  system: "../../configs/systems/onboarding/mimxrt1064_evk.yaml"
limits:
  max_steps: 800000
assertions:
  - uart_contains: "OK"
  - uart_contains: "gpt1 swr=1 cnt=1 irq=3 of1=1 of2=1 ok"
  - gpio_edges:
      pin: "gpio2:3"
      min_edges: 1
  - expected_stop_reason: max_steps
