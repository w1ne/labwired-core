# AArch64 i.MX UART smoke against the bounded imported nxp-frdm-imx8mplus profile: one
# Cortex-A53 PE checks the UART4 USR1 reset value, writes a banner through
# UTXD and spins. No GIC, timer, clock or pin-mux block is exercised.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/imx8mp-a53-uart4-smoke.elf"
  system: "../../configs/systems/onboarding/nxp-frdm-imx8mplus.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "IMX8MP A53 MXCUART SMOKE USR1=OK"
  - expected_stop_reason: max_steps
