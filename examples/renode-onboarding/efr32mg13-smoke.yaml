# Cortex-M4F smoke against the imported EFR32MG13 platform.
# The firmware (firmware-efr32mg13-smoke, checks in
# firmware-efm32jg1-smoke/src/s1.rs) prints over USART0: the Series-1 GPIO
# ports at a 0x30 stride from 0x4000A000 — push-pull on PF4/PF5 (LED0/LED1
# on the WSTK radio boards) via DOUT/DOUTTGL, the reserved 0x10/0x14 words,
# DISABLED/INPUTPULL/WIREDAND/WIREDOR, PINLOCKN, CTRL reset + OVTDIS — then
# TIMER0/TIMER1 in the Series-1 layout (IF 0x0C, IEN 0x18): UP + NVIC pend
# (IRQ 11), DOWN one-shot, UP/DOWN with CC3 and DIRCHG.
# WTIMER0 32-bit (efm32s1_wtimer): from 0xFFF0, CC0 at 0x10000
# fires before OF, OF at TOP 0x11000, IEN pends IRQ 37.
# RTCC (efm32s1_rtcc, 32768 Hz LFECLK on the 19 MHz HFRCO): RET words,
# CNT from 0xFFFFFFFD wraps (OF) before CC1 matches, CNTTICK, IEN pends
# IRQ 31, CNTPRESC DIV4 tap, COMBCNT.
# LED0 toggles in the idle loop. Summary word at 0x2000FC00.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-efr32mg13-smoke"
  system: "../../configs/systems/onboarding/efr32mg13.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "EFR32MG13 RENODE SMOKE"
  - uart_ordered:
      - "gpio pf4/pf5 pushpull set=1 tgl=1 clr=1 wo=1 ok"
      - "gpio reserved 0x10/0x14 no_set=1 no_clr=1 read0=1 ok"
      - "gpio pa0 disabled_din0=1 pullup=1 pulldown=1 ok"
      - "gpio pa1 wiredand pa2 wiredor hi=3 lo=0 ok"
      - "gpio pa pinlockn reset=ffff after=fffe ok"
      - "gpio pa ctrl=00500050 ovtdis=ffff ok"
      - "tim0 up of=1 masked=1 pend=1 released=1 running=1 ok"
      - "tim1 down oneshot dir=1 stopped=1 if=2 cnt=00c8 ok"
      - "tim1 updown cc3=1 of=1 dirchg=1 dir_down=1 ok"
      - "wtim0 32bit top=1 cc0=1 no_early_of=1 cnt_hi=1 of=1 masked=1 pend=1 released=1 ifs=1 ok"
      - "rtcc ret=1 of=1 of_first=1 cc1=1 tick=1 masked=1 pend=1 released=1 presc=1 comb=1 ok"
      - "EFR32MG13 PASS"
  - gpio_edges:
      pin: "gpiof:4"
      min_edges: 4
  - memory_value:
      address: 0x2000FC00
      expected_value: 0xEF3107FF
      size: 4
  - expected_stop_reason: max_steps
