# SAM E70 (Renode sam_e70) smoke over three boots
# (crates/firmware-sam-e70-renode-smoke): power-on CHIPID, EEFC (FMR, GETD
# 2 MiB / 128 x 16 KiB, multi-word GLB, GPNVM8, GPNVM9 and bad-key FCMDE),
# RSTC/WDT reset state, an RSTC software reset, a WDT_MR-armed watchdog
# reset, then the WDT window interrupt, write-once WDT_MR, PMC banks 0/1,
# PIOA-E latches, the PIOA input change interrupt (NVIC 10) and a line out of
# USART0/2 and UART0-4. Summary word 0xE7003FFF = all fourteen checks.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-sam-e70-renode-smoke"
  system: "../../configs/systems/onboarding/sam_e70.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_ordered:
      - "SAM E70 RENODE SMOKE"
      - "chipid cidr=a1020e00 exid=00000002 ok"
      - "eefc fmr=00000600 ok"
      - "eefc getd size=00200000 page=0200 locks=0080 region=00004000 ok"
      - "eefc glb3=10 clb=0 gpnvm=002 set8=102 ok"
      - "eefc fsr gpnvm9=3 badkey=3 after=1 ok"
      - "rstc sr=00010000 wdt mr=3fff2fff ok"
      - "rstc software reset"
      - "SAM E70 RENODE SMOKE"
      - "rstc rsttyp=3 ok"
      - "wdt arm wdv=2"
      - "SAM E70 RENODE SMOKE"
      - "wdt rsttyp=2 mr=3fff2fff ok"
      - "wdt window sr=2 pended released ok"
      - "wdt mr once=00801100 ok"
      - "pmc pcsr0="
      - "pio ports=5 ok"
      - "pioa pa11 change up=1 isr=11 pend=1 released=1 ok"
      - "uarts=7 ok"
      - "SAM E70 PASS"
  - uart_contains: "usart0 tx"
  - uart_contains: "usart2 tx"
  - uart_contains: "uart0 tx"
  - uart_contains: "uart4 tx"
  - memory_value:
      address: 0x2045F000
      expected_value: 0xE7003FFF
      size: 4
  - expected_stop_reason: max_steps
