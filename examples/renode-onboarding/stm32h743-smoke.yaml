# Cortex-M7 register smoke against the narrowed imported STM32H743 profile.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabihf/release/firmware-stm32h743-smoke"
  system: "../../configs/systems/onboarding/stm32h743.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "STM32H7 register smoke"
  - uart_contains: "cortex-m7 irq ipsr=00000015 active=00000020 pending=00000000"
  - uart_contains: "cortex-m7 frame=1 regs=00000011,00000022,00000033,00000044,00000055"
  - uart_contains: "cortex-m7 return=1 stack=1 vtor=1"
  - uart_contains: "cortex-m7 psp exception=1 stack=1 msp=1 return=1 exc_return=FFFFFFFD"
  - uart_contains: "cortex-m7 psp align exception=1 frame=1 stack=1 msp=1 return=1"
  - uart_contains: "cortex-m7 psp noalign exception=1 frame=1 stack=1 msp=1 return=1 ccr=1"
  - uart_contains: "cortex-m7 fp exception=1 frame=1 stack=1 return=1 regs=1 fpscr=1 fpcar=1 exc_return=FFFFFFE9"
  - uart_contains: "cortex-m7 fp lazy unused=1 lspact=00000001,00000001->00000000 untouched=1 regs=1"
  - uart_contains: "cortex-m7 fp lazy used=1 lspact=00000001,00000000->00000000 saved=1 regs=1"
  - uart_contains: "cortex-m7 fp lazy nested=1 lspact=00000001->00000001,00000000 saved=1 regs=1 irq=00000016 active=00000060 exc_return=FFFFFFF1"
  - uart_contains: "cortex-m7 exception ok"
  - gpio_edges:
      pin: "gpioPortB:0"
      min_edges: 1
  - expected_stop_reason: max_steps
