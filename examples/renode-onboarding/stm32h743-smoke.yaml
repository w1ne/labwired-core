# Cortex-M7 register smoke against the narrowed imported STM32H743 profile.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabihf/release/firmware-stm32h743-smoke"
  system: "../../configs/systems/onboarding/stm32h743.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "STM32H7 register smoke"
  - uart_contains: "cortex-m7 cpacr priv=00500000 full=00F00000"
  - uart_contains: "cortex-m7 cpacr nocp fault=1 ipsr=00000006 cfsr=00080000 extended=1"
  - uart_contains: "cortex-m7 cpacr unprivileged fp=1 nocp=00000000 result=0000005A"
  - uart_contains: "cortex-m7 irq ipsr=00000015 active=00000020 pending=00000000"
  - uart_contains: "cortex-m7 frame=1 regs=00000011,00000022,00000033,00000044,00000055"
  - uart_contains: "cortex-m7 return=1 stack=1 vtor=1"
  - uart_contains: "cortex-m7 psp exception=1 stack=1 msp=1 return=1 exc_return=FFFFFFFD"
  - uart_contains: "cortex-m7 psp align exception=1 frame=1 stack=1 msp=1 return=1"
  - uart_contains: "cortex-m7 psp noalign exception=1 frame=1 stack=1 msp=1 return=1 ccr=1"
  - uart_contains: "cortex-m7 fp exception=1 frame=1 stack=1 return=1 regs=1 fpscr=1 fpcar=1 exc_return=FFFFFFE9"
  - uart_contains: "cortex-m7 fp lazy unused=1 lspact=00000001,00000001->00000000 untouched=1 regs=1"
  - uart_contains: "cortex-m7 fp lazy used=1 lspact=00000001,00000000->00000000 saved=1 regs=1"
  - uart_contains: "cortex-m7 fp lazy nested=1 lspact=00000001->00000001,00000000 saved=1 regs=1 irq=00000016 active=00000060 exc_return=FFFFFFF1"
  - uart_contains: "cortex-m7 fp lazy nested-touch=1 lspact=00000001->00000000 saved=1 regs=1 active=00000060"
  - uart_contains: "cortex-m7 exception ok"
  - uart_contains: "cortex-m7 cpacr privileged fp=1 nocp=00000000 result=000000A5"
  - uart_contains: "cortex-m7 cpacr privileged denied=1 ipsr=00000006 cfsr=00080000"
  - uart_contains: "cortex-m7 cpacr reserved policy-deny=1 readback=00A00000 ipsr=00000006 cfsr=00080000"
  - uart_contains: "cortex-m7 cpacr disabled usagefault hardfault=1 ipsr=00000003 cfsr=00080000 hfsr=40000000"
  - uart_contains: "cortex-m7 cpacr priority escalation=1 active_irq=00000015 ipsr=00000003 cfsr=00080000 hfsr=40000000"
  - uart_contains: "cortex-m7 cpacr subpriority escalation=1 irq_prio=0000009F group=00000500 usagefault_prio=00000080 ipsr=00000003 cfsr=00080000 hfsr=40000000"
  - uart_contains: "cortex-m7 priority subpriority order=1 first=00000016 second=00000015 group=00000500 irq5=0000009F irq6=00000080 active=00000000 pending=00000000"
  - uart_contains: "cortex-m7 basepri group mask=1 threshold=00000080 first=00000016 second=00000015 group=00000500 irq5=0000009F irq6=00000040 pending=00000020 active=00000000 after_pending=00000000 basepri_after=00000000"
  - uart_contains: "cortex-m7 subpriority nonpreempt=1 order=00000015,00000015,00000016 active_during=00000020 pending_during=00000040 ipsr_after_pend=00000015 group=00000500"
  - uart_contains: "cortex-m7 cpacr handler fp=1 ipsr=0000000B thread_unprivileged=00000001 nocp=00000000 result=000000C3"
  - gpio_edges:
      pin: "gpioPortB:0"
      min_edges: 1
  - expected_stop_reason: max_steps
