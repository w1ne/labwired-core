# Cortex-M0 smoke against the STM32F072B-DISCO row, which loads the
# stm32f072 silicon profile (Renode: boards/stm32f072b_discovery.repl uses
# cpus/stm32f072.repl) plus the board IO: RCC reset state and an enforced
# clock gate, USART2..4 TXE lines (USART3/4 shared on 29), USART2 RX held
# until UE and RE are both enabled, the four user LEDs LD3..LD6 on
# PC6/PC8/PC9/PC7 walked through BSRR, B1 on PA0 pressed twice by
# the stimuli below (port C selected in EXTICR1 first: no pend; then port A:
# EXTI line 0 rising edge on the grouped vector 5), TIM1/2/3/6/7/14/15/16/17
# width, counting and update line, DMA1 channel 1 memory-to-memory on line 9,
# CRC-32, and the ADC on TS / V_REFINT (calibration, a 12-bit sequence with
# EOS on line 12, both read 0 once CCR switches them off). SPI/I2C have no
# on-board slave here; the stm32f072 fixture smoke covers them, and the ADC
# pads. It does not claim the L3GD20, CAN, RTC, DAC, USB, TSC or the
# watchdogs. AIRCR.PRIGROUP writes are checked to read zero on ARMv6-M. A
# software-pended EXTI0_1 NVIC line then takes a real exception through a RAM
# vector and verifies handler IPSR/IABR, the eight-word Cortex-M0 stack frame,
# EXC_RETURN, and return cleanup. Another IRQ pends NMI with PRIMASK set and
# verifies that NMI preempts and returns to the masked IRQ. The NMI handler
# pends NMI once while active; it must not nest, but must run again on exception
# return before the external IRQ resumes. It also pends lower-priority IRQ 6;
# IRQ 6 must remain pending and inactive until active IRQ 5 returns, then
# tail-chain before Thread mode resumes.
# The imported STM32F072 profile also includes the core SysTick peripheral;
# its smoke verifies exception 15, COUNTFLAG read-clear behavior, and pending
# delivery after PRIMASK is cleared.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-stm32f072b-disco-smoke"
  system: "../../configs/systems/onboarding/stm32f072b_discovery.yaml"
limits:
  max_steps: 4000000
uart_injections:
  - uart: "usart2"
    bytes: "RS"
stimuli:
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 400000 }
    value: 1.0
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 600000 }
    value: 0.0
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 1000000 }
    value: 1.0
  - target: { component: "b1", channel: "pressed" }
    trigger: !after_cycles { cycles: 1200000 }
    value: 0.0
assertions:
  - uart_contains: "STM32F072B-DISCO SMOKE"
  - uart_ordered:
      - "cpu=cortex-m0 uart=usart1"
      - "rcc reset=1 gate=1 ok"
      - "aircr prigroup=0 reserved=writes_ignored=1 ok"
      - "usart irq u2=1 u3=1 u4=1 ok"
      - "usart2 rx_gate re_off=1 ue_off=1 data=0x00005253 released=1 ok"
      - "led=ld3 odr=0x00000040"
      - "led=ld4 odr=0x00000140"
      - "led=ld5 odr=0x00000340"
      - "led=ld6 odr=0x000003C0"
      - "leds walk=1 blink=1 off=1 ok"
      - "b1 idle=1 presses=1 pc_quiet=1 pa0=1 cleared=1 ok"
      - "tim1 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim2 arr=0xFFFFFFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim3 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim6 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim7 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim14 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim15 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim16 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "tim17 arr=0x0000FFFF width=1 count=1 uif=1 pend=1 alone=1 released=1 ok"
      - "dma1 m2m tc=1 data=1 pend=1 alone=1 released=1 ok"
      - "crc word=0xDF8A8A2B seed=1 std=1 ok"
      - "adc ts=0x00000709 vref=0x000005F6 cal=1 ready=1 seq=1 eos=1 pend=1 released=1 gated=1 off=1 ok"
      - "irq exception hit=1 ipsr=0x00000015 active=0x00000020 pending=0x00000000 frame=1 regs=0x00000011,0x00000022,0x00000033,0x00000044,0x00000055 lr="
      - " pc="
      - " exc_return=0xFFFFFFF9 sp="
      - " returned=1 ok"
      - "nmi repend entered=1 entries=0x00000002 after_pend_ipsr=0x00000002 after_pend_entries=0x00000001 irq=0x00000015 nmi=0x00000002 resumed=0x00000015 icsr=0x00000002 irq_active=0x00000020 primask=0x00000001 restored=0x00000001 cleanup=ok=1 ok"
      - "nmi deferred irq pending_in_nmi=0x00000040 active_in_nmi=0x00000000 after_unmask_ipsr=0x00000015 irq6_active_while_irq5=0x00000000 irq6_pending_in_irq5=0x00000040 irq_ipsr=0x00000016 irq_active=0x00000040 irq_pending=0x00000000 nmi_count=0x00000002 irq5_priority=0x00000040 irq6_priority=0x00000080 ok"
      - "systick ipsr=0x0000000F active=0x0000000F countflag=1 read_clear=1 pending_after=0x00000000 thread_ipsr=0x00000000 vtor_restored=1 ok"
      - "systick primask clear=honored=1 masked=1 ipsr=0x0000000F active=0x0000000F primask=0x00000000 pending_after=0x00000000 thread_ipsr=0x00000000 vtor_restored=1 ok"
      - "summary 0x0DFFFFFF"
      - "DONE"
  - memory_value:
      address: 0x20003000
      expected_value: 0x0DFFFFFF
      size: 4
  - gpio_edges:
      pin: "gpioc:6"
      min_edges: 5
  - expected_stop_reason: max_steps
