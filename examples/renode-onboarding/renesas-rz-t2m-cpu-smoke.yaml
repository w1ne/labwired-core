inputs:
  firmware: "../../tests/fixtures/renesas-rz-t2m-cpu-smoke.elf"
  system: "../../configs/systems/onboarding/renesas_rz_t2m.yaml"
limits:
  max_steps: 100000
assertions:
  - expected_stop_reason: max_steps
