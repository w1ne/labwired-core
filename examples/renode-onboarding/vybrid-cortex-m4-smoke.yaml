# CPU-only Cortex-M4 smoke against the exact imported Vybrid system.
# The shared Thumb integer loop performs no MMIO and is loaded directly into OCRAM.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/colibri-vf61-cortex-m4-smoke.elf"
  system: "../../configs/systems/onboarding/vybrid.yaml"
limits:
  max_steps: 100000
assertions:
  - expected_stop_reason: max_steps
