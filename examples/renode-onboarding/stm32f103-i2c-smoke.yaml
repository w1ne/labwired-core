# Cortex-M3 USART2 and I2C1 NACK plus TMP102 transactions and BME280 behavior
# against the imported STM32F103 system. Core checks include exception frames
# from Thread mode using both MSP and PSP, SVC return state through both
# stacks, SysTick wake from WFI, UsageFault and HardFault escalation, PRIMASK and BASEPRI/BASEPRI_MAX
# masking and release, plus NVIC pending and return state, priority grouping
# and subpriority arbitration.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-f103-i2c-demo"
  system: "../../configs/systems/onboarding/stm32f103.yaml"
limits:
  max_steps: 50000000
uart_injections:
  - uart: "usart2"
    bytes: "RS"
assertions:
  - uart_contains: "F103 I2C"
  - uart_contains: "SYSTICK M3 CALIB=00002328 WRAP=1 COUNTFLAG_WRITE=1 READ_CLEAR=1 PENDING=1 CLEAR=1 ok"
  - uart_contains: "SYSTICK M3 HCLK8 REFERENCE=1 WINDOW=1 FROZEN=1 RESUMED=1 ok"
  - uart_contains: "SYSTICK M3 PERIODIC=1 REPEATED=1 VECTOR=15 IPSR=15 RETURN=1 ok"
  - uart_contains: "SYSTICK M3 WFI_WAKE=1 VECTOR=15 ENTRIES=1 RESUMED=1 ok"
  - uart_contains: "SYSTICK M3 ICSR SET=1 COALESCE=1 CLEAR=1 REPEND=1 ENTRIES=2 ACTIVE=15 ok"
  - uart_contains: "SYSTICK M3 TICKINT=0 COUNTFLAG=1 NO_PEND=1 TICKINT=1 PEND=1 MASKED=1 ok"
  - uart_contains: "SYSTICK M3 CVR_WRITE WRAP=1 ZERO=1 COUNTFLAG_CLEAR=1 PENDING_PRESERVED=1 MASKED=1 ok"
  - uart_contains: "PENDSV M3 CLEAR=1 REPEND=1 VECTOR=14 IPSR=14 ok"
  - uart_contains: "IRQ M3 FRAME IPSR=54 ACTIVE=1 PENDING=0 SENTINELS=1 EXC_RETURN=FFFFFFF9 STACK=ALIGNED RETURN=1 ok"
  - uart_contains: "IRQ M3 PSP FRAME IPSR=54 ACTIVE=1 PENDING=0 SENTINELS=1 EXC_RETURN=FFFFFFFD PSP=RESTORED MSP=UNCHANGED ok"
  - uart_contains: "SVC M3 MSP VECTOR=11 IMM=42 EXC_RETURN=FFFFFFF9 STACKED_PC=AFTER_SVC RETURN=1 ok"
  - uart_contains: "SVC M3 PSP VECTOR=11 IMM=42 EXC_RETURN=FFFFFFFD STACKED_PC=AFTER_SVC PSP=RESTORED MSP=UNCHANGED RETURN=1 ok"
  - uart_contains: "FAULT M3 UNDEFINSTR USAGE=6 ESCALATE=3 CFSR=1 HFSR_FORCED=1 RETURN=1 ok"
  - uart_contains: "PRIMASK M3 MASKED=1 PENDING=1 RELEASED=1 VECTOR=54 ok"
  - uart_contains: "BASEPRI M3 MAX_KEEP=1 MAX_RAISE=1 HIGH=55 LOW=54 MASKED=1 PENDING=1 RELEASED=1 ok"
  - uart_contains: "NVIC M3 SUBPRIORITY ORDER=55,54 SAME_GROUP_PREEMPT=0 PENDING=1 ok"
  - uart_contains: "USART2 TXEIRQ=1 REARM=0"
  - uart_contains: "USART2 RX GATE re_off=1 ue_off=1 data=00005253 released=1 ok"
  - uart_contains: "SPI1 MAX31855=01901600"
  - uart_contains: "SPI1 TXEIRQ=1 REARM=0 RXNEIRQ=1 RELEASED=1"
  - uart_contains: "SPI1 CHECKS=1"
  - uart_contains: "I2C_NACK_OK"
  - uart_contains: "I2C_IDLE_OK"
  - uart_contains: "TMP102=00001900"
  - uart_contains: "TMP102_READ_OK"
  - uart_contains: "TMP102_CONFIG=0000FFF0"
  - uart_contains: "TMP102_CONFIG_WRITE_OK"
  - uart_contains: "TMP102_TLOW=00003450"
  - uart_contains: "TMP102_TLOW_WRITE_OK"
  - uart_contains: "TMP102_THIGH=00006788"
  - uart_contains: "TMP102_THIGH_WRITE_OK"
  - uart_contains: "TMP102_TLOW_SHORT=00002250"
  - uart_contains: "TMP102_TLOW_SHORT_WRITE_OK"
  - uart_contains: "BME280_ID=00000060"
  - uart_contains: "BME280_ID_READ_OK"
  - uart_contains: "BME280_T2=00006743"
  - uart_contains: "BME280_CALIBRATION_READ_OK"
  - uart_contains: "BME280_CALIBRATION_MAP_READ_OK"
  - uart_contains: "BME280_SKIPPED_PRESS_RAW=00080000"
  - uart_contains: "BME280_SKIPPED_TEMP_RAW=00080000"
  - uart_contains: "BME280_SKIPPED_HUM_RAW=00008000"
  - uart_contains: "BME280_OVERSAMPLING_SKIP_OK"
  - uart_contains: "BME280_MEASUREMENT_SETUP_OK"
  - uart_contains: "BME280_PRESS_RAW=0005883F"
  - uart_contains: "BME280_TEMP_RAW=0008E910"
  - uart_contains: "BME280_HUM_RAW=0000853F"
  - uart_contains: "BME280_SEEDED_ENVIRONMENT_OK"
  - uart_contains: "BME280_SEEDED_TEMP_CENTI=00000FA0"
  - uart_contains: "BME280_SEEDED_PRESS_Q8=01731804"
  - uart_contains: "BME280_SEEDED_HUM_Q10=00014005"
  - uart_contains: "BME280_SEEDED_COMPENSATION_OK"
  - uart_contains: "BME280_DYNAMIC_TEMP_RAW=0009A510"
  - uart_contains: "BME280_DYNAMIC_TEMPERATURE_OK"
  - uart_contains: "BME280_DYNAMIC_TEMP_CENTI=0000157C"
  - uart_contains: "BME280_DYNAMIC_TEMP_COMPENSATION_OK"
  - uart_contains: "BME280_DYNAMIC_HUMIDITY_OK"
  - uart_contains: "BME280_DYNAMIC_HUM_RAW=000064D2"
  - uart_contains: "BME280_HUM_TEMP_CENTI=0000157C"
  - uart_contains: "BME280_HUM_PRESS_Q8=0173180D"
  - uart_contains: "BME280_HUM_Q10=00008BFD"
  - uart_contains: "BME280_DYNAMIC_HUM_COMPENSATION_OK"
  - uart_contains: "BME280_DYNAMIC_PRESSURE_OK"
  - uart_contains: "BME280_DYNAMIC_PRESS_RAW=0005305F"
  - uart_contains: "BME280_PRESS_TEMP_CENTI=0000157C"
  - uart_contains: "BME280_PRESS_Q8=018B81EE"
  - uart_contains: "BME280_PRESS_HUM_Q10=00008BFD"
  - uart_contains: "BME280_DYNAMIC_PRESS_COMPENSATION_OK"
  - uart_contains: "BME280_CTRL_HUM_STORAGE=00000001"
  - uart_contains: "BME280_CTRL_HUM_STORAGE_OK"
  - uart_contains: "BME280_CTRL_MEAS_STORAGE=00000027"
  - uart_contains: "BME280_CTRL_MEAS_STORAGE_OK"
  - uart_contains: "DONE"
  - expected_stop_reason: max_steps
stimuli:
  - target: { component: "bme280", channel: "temperature" }
    trigger: !after_cycles { cycles: 1000000 }
    value: 55.0
  - target: { component: "bme280", channel: "humidity" }
    trigger: !after_cycles { cycles: 2000000 }
    value: 35.0
  - target: { component: "bme280", channel: "pressure" }
    trigger: !after_cycles { cycles: 3000000 }
    value: 1012.5
