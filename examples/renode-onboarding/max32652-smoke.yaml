# MAX32652 smoke against the imported max32652 system: three UART STAT resets,
# MAX32650 GPIO EN/OUT_EN/OUT/IN/IN_EN/PDPU_SEL on port 0-3, SRAM top,
# LED0 (P2.25) pulses, a line on each UART.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-max32652-smoke"
  system: "../../configs/systems/onboarding/max32652.yaml"
limits:
  max_steps: 100000
assertions:
  - uart_contains: "MAX32652 UART0 smoke"
  - uart_contains: "MAX32652 UART1 line"
  - uart_contains: "MAX32652 UART2 line"
  - uart_contains: "MAX32652 checks PPPPPPPPPP DONE"
  - memory_value:
      address: 0x200FF000
      expected_value: 0xA32603FF
      size: 4
  - gpio_edges:
      pin: "port2:25"
      min_edges: 6
  - expected_stop_reason: max_steps
