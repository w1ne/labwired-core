# Matched generic Gummel–Poon NPN load lines on A2/P001/AN001 and
# A3/P002/AN002. VAF is the only model difference, isolating forward Early
# effect; the board test reads both branches through ADC14 at 12 and 14 bits.
name: "arduino-uno-r4-minima-analog-bjt-early-effect"
chip: "../../configs/chips/ra4m1.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_with_forward_early_effect"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_early.base_v"
    outputs:
      collector_voltage: "board.analog.p001_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 5.0
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_EARLY
        .model NPN_EARLY NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 5.0
  - id: "bjt_without_forward_early_effect"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_early.base_v"
    outputs:
      collector_voltage: "board.analog.p002_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 5.0
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAR=75)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 5.0
