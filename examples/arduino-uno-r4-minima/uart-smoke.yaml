# LabWired - Arduino Uno R4 Minima UART smoke test
schema_version: "1.0"
inputs:
  # Built by: cargo build -p firmware-ra4m1-demo --release --target thumbv7em-none-eabi
  # Survival fixture (same bytes): tests/fixtures/ra4m1-uno-r4-smoke.elf
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-ra4m1-demo"
  system: "./system.yaml"
limits:
  max_steps: 800000
assertions:
  - uart_contains: "OK"
  - expected_stop_reason: max_steps
