# Raspberry Pi Pico W: exercise exposed GP0 through IO_BANK0 and SIO.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-pico-w-smoke"
  system: "../../configs/systems/raspberry-pi-pico-w.yaml"
limits:
  max_steps: 200000
assertions:
  - gpio_edges:
      pin: "sio:0"
      min_edges: 8
  - expected_stop_reason: max_steps
