# LabWired - NUCLEO-L552ZE-Q stock Zephyr synchronization sample
#
# Unmodified upstream Zephyr v3.7.0 `samples/synchronization` for board
# `nucleo_l552ze_q`. Rebuild: crates/firmware-l552ze-zephyr/build.sh
#
# Two threads hand a semaphore back and forth. Each one prints, busy-waits
# 100 ms (k_busy_wait, 11 M cycles at the 110 MHz Zephyr clock), then
# k_msleep(500) on the SysTick system timer. thread_b's line therefore proves
# the SysTick timeout wake, the semaphore give/take and the PendSV context
# switch; the second thread_a line proves a full a -> b -> a round.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/stm32l552-zephyr-sync.elf"
  system: "./system.yaml"
limits:
  max_steps: 30000000
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v3.7.0 ***"
      - "thread_a: Hello World from cpu 0 on nucleo_l552ze_q!"
      - "thread_b: Hello World from cpu 0 on nucleo_l552ze_q!"
      - "thread_a: Hello World from cpu 0 on nucleo_l552ze_q!"
  - expected_stop_reason: max_steps
