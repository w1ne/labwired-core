# Matched generic Gummel–Poon NPN branches route a finite-VAF device and a
# no-forward-Early control to PA6/PA7, then through ST-data analog_pins to
# STM32L552 ADC1_IN11/IN12. No silicon ADC accuracy is claimed.
name: nucleo-l552ze-q-analog-bjt-early-effect-adc
chip: ../../configs/chips/stm32l552.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_early_effect_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: board.analog.pa6_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_EARLY
        .model NPN_EARLY NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: bjt_without_forward_early_effect_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt_early.base_v
    outputs:
      collector_voltage: board.analog.pa7_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
