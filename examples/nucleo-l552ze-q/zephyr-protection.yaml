# LabWired - NUCLEO-L552ZE-Q stock Zephyr tests/kernel/mem_protect/protection
#
# Unmodified upstream Zephyr v3.7.0 `tests/kernel/mem_protect/protection`
# (twister scenario kernel.memory_protection.protection) for board
# `nucleo_l552ze_q`. Rebuild: crates/firmware-l552ze-zephyr/build.sh
#
# Renode's ARMv8M.robot "Should Pass Zephyr Protection Test" ("Test the
# PMSAv8 MPU") waits for `PROJECT EXECUTION SUCCESSFUL`. Every case passes
# only if the access faults: Zephyr's k_sys_fatal_error_handler override
# prints "Caught system error" and passes the test, while an access that
# goes through hits zassert_unreachable. So the run proves the PMSAv8 MPU is
# enforced (crates/core/src/peripherals/armv8m_mpu.rs):
#   test_exec_data/heap/stack - fetch from an XN SRAM region -> MemManage
#                               IACCVIOL
#   test_write_ro/text        - store to the read-only flash region ->
#                               MemManage DACCVIOL, MMFAR = the address
# On a core that does not enforce the MPU all five fail ("Execute from
# target buffer succeeded!", "rodata modified!").
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/stm32l552-zephyr-protection.elf"
  system: "./system.yaml"
limits:
  max_steps: 2000000
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v3.7.0 ***"
      - "Running TESTSUITE protection"
      - "Caught system error -- reason 0"
      - " PASS - test_exec_data"
      - "Caught system error -- reason 0"
      - " PASS - test_exec_heap"
      - "Caught system error -- reason 0"
      - " PASS - test_exec_stack"
      - "Caught system error -- reason 0"
      - " PASS - test_write_ro"
      - "Caught system error -- reason 0"
      - " PASS - test_write_text"
      - "SUITE PASS - 100.00% [protection]: pass = 5, fail = 0, skip = 0, total = 5"
      - "PROJECT EXECUTION SUCCESSFUL"
  - expected_stop_reason: max_steps
