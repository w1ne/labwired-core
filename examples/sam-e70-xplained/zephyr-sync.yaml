# LabWired - SAM E70 Xplained stock Zephyr synchronization sample
#
# Unmodified upstream Zephyr v3.7.0 `samples/synchronization` for board
# `sam_e70_xplained/same70q21b`. Rebuild:
# crates/firmware-sam-e70-xplained-zephyr/build.sh
#
# Two threads hand a semaphore back and forth. Each one prints, busy-waits
# 100 ms (k_busy_wait, 30 M cycles at the 300 MHz Zephyr clock), then
# k_msleep(500) on the SysTick system timer. thread_b's line therefore proves
# the SysTick timeout wake, the semaphore give/take and the PendSV context
# switch. The guest's own busy-wait dominates the step budget: one a -> b
# round fits in the 50 M-step CLI cap.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/same70q21b-zephyr-sync.elf"
  system: "./system.yaml"
limits:
  max_steps: 50000000
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v3.7.0 ***"
      - "thread_a: Hello World from cpu 0 on sam_e70_xplained!"
      - "thread_b: Hello World from cpu 0 on sam_e70_xplained!"
  - expected_stop_reason: max_steps
