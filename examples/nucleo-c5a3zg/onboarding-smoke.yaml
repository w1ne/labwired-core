# NUCLEO-C5A3ZG: boot Cortex-M33 firmware and toggle onboard LD1 on PA5.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-nucleo-c5a3zg-smoke"
  system: "../../configs/systems/nucleo-c5a3zg.yaml"
limits:
  max_steps: 5000
assertions:
