# ch32fun examples/spi_max7219, unmodified (build-ch32fun-examples.sh). Every
# MAX7219 register write is one 16-bit SPI1 frame (CTLR1.DFF, 1-line TX,
# BR = 4) bracketed by a software CS on PD0: address byte, then data byte.
#
# The run stops at max_cycles 120M (2.5 s at 48 MHz), inside the first
# Code-B phase (1 s..4 s by the example's delays): display
# test was on for 1 s (all 64 LEDs) and then off, decode mode is 0xFF, and
# digits 7..0 hold Code-B 0..7. The model renders digit RAM raw (decode is
# stored, not applied), so row y = digit register y+1 = Code-B (7 - y), bit 7
# leftmost: row 0 = 0x07 lights columns 5..7, row 3 = 0x04 column 5 only,
# row 7 = 0x00 nothing - 12 of 64 LEDs. Shutdown must have been cleared, or
# the panel would be blank.
#
schema_version: "1.2"
inputs:
  firmware: "ch32fun/spi_max7219.elf"
  system: "../../configs/systems/ch32v003evt-ch32fun-spi-max7219-smoke.yaml"
limits:
  max_cycles: 120000000
  max_steps: 200000000
  wall_time_ms: 600000
assertions:
  - display_region: { id: max7219, min_ink: 0.1875, max_ink: 0.1875 }
  # Row 0 = digit 0 = Code-B 7 = 0b0000_0111.
  - display_region: { id: max7219, x: 5, y: 0, w: 3, h: 1, min_ink: 1.0 }
  - display_region: { id: max7219, x: 0, y: 0, w: 5, h: 1, min_ink: 0.0, max_ink: 0.0 }
  # Row 1 = Code-B 6 = 0b0000_0110: columns 5 and 6, not 7.
  - display_region: { id: max7219, x: 5, y: 1, w: 2, h: 1, min_ink: 1.0 }
  - display_region: { id: max7219, x: 7, y: 1, w: 1, h: 1, min_ink: 0.0, max_ink: 0.0 }
  # Row 3 = Code-B 4 = 0b0000_0100: column 5 alone.
  - display_region: { id: max7219, x: 5, y: 3, w: 1, h: 1, min_ink: 1.0 }
  - display_region: { id: max7219, x: 6, y: 3, w: 2, h: 1, min_ink: 0.0, max_ink: 0.0 }
  # Row 6 = Code-B 1: column 7 alone. Row 7 = Code-B 0: dark.
  - display_region: { id: max7219, x: 7, y: 6, w: 1, h: 1, min_ink: 1.0 }
  - display_region: { id: max7219, x: 0, y: 7, w: 8, h: 1, min_ink: 0.0, max_ink: 0.0 }
  # SPI1 left enabled-off between writes (SPI_end clears SPE), idle: TXE set,
  # BSY clear.
  - memory_value: { address: 0x40013008, size: 16, mask: 0x0082, expected_value: 0x0002 }
