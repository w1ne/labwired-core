# ch32fun examples/adc_polled, unmodified. Every 200 ms (two Delay_Ms(100) at
# 48 MHz, 9.6 M cycles) the firmware software-starts one ADC1 conversion of
# AIN7 (PD4) and prints "Count: N adc: X" through the debug-printf channel.
# The pot on PD4 starts centred (1650 mV, 10-bit code 511), is turned to 25 %
# (825 mV, 255) between samples 1 and 2, and to 100 % (3300 mV, 1023) between
# samples 3 and 4. Each printed code has to follow the pot, so a model that
# returned a constant, converted the wrong channel, or produced 12-bit codes
# fails here.
schema_version: "1.2"
inputs:
  firmware: "ch32fun/adc_polled.elf"
  system: "../../configs/systems/ch32v003evt-ch32fun-adc-smoke.yaml"
limits:
  max_cycles: 55000000
  max_steps: 100000000
  wall_time_ms: 600000
stimuli:
  - target: { component: "pot", channel: "position" }
    trigger: !after_cycles { cycles: 24000000 }
    value: 25
  - target: { component: "pot", channel: "position" }
    trigger: !after_cycles { cycles: 43000000 }
    value: 100
assertions:
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "adc_polled example" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "initializing adc...done." }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "Count: 0 adc: 511" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "Count: 1 adc: 511" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "Count: 2 adc: 255" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "Count: 3 adc: 255" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "Count: 4 adc: 1023" }
  - memory_value: { address: 0xE00000F4, mask: 0xC0, expected_value: 0 }
  - gpio_edges: { pin: "gpiod:0", min_edges: 8 }
