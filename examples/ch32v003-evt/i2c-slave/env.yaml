# ch32fun's examples/i2c_slave, unmodified, on a CH32V003 (node `slave`,
# I2C1 at 0x09 on PC1 SDA / PC2 SCL) answering an STM32F103 controller
# (node `master`, I2C1 on PB6 SCL / PB7 SDA). Open-drain gpio_nets with the
# bus pull-up on the net, both chips' I2C bit engines on the wire.
schema_version: "1.0"
name: ch32v003-i2c-slave
nodes:
  - id: master
    system: "../../gpio-net-buses/system-f103.yaml"
    firmware: "firmware/f1-i2c-controller.elf"
  - id: slave
    system: "system-ch32v003.yaml"
    firmware: "../ch32fun/i2c_slave.elf"
interconnects:
  - type: gpio_net
    nodes: [master, slave]
    config:
      name: scl
      pull: up
      members:
        - { node: master, peripheral: gpiob, pin: 6 }
        - { node: slave, peripheral: gpioc, pin: 2 }
  - type: gpio_net
    nodes: [master, slave]
    config:
      name: sda
      pull: up
      members:
        - { node: master, peripheral: gpiob, pin: 7 }
        - { node: slave, peripheral: gpioc, pin: 1 }
