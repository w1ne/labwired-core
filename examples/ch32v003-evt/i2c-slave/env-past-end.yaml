# env.yaml with the controller built -DPAST_END=1: step 2 writes one byte
# past the end of the slave's 3-register array (see test-past-end.yaml).
schema_version: "1.0"
name: ch32v003-i2c-slave-past-end
nodes:
  - id: master
    system: "../../gpio-net-buses/system-f103.yaml"
    firmware: "firmware/f1-i2c-controller-past-end.elf"
  - id: slave
    system: "system-ch32v003.yaml"
    firmware: "../ch32fun/i2c_slave.elf"
interconnects:
  - type: gpio_net
    nodes: [master, slave]
    config:
      name: scl
      pull: up
      members:
        - { node: master, peripheral: gpiob, pin: 6 }
        - { node: slave, peripheral: gpioc, pin: 2 }
  - type: gpio_net
    nodes: [master, slave]
    config:
      name: sda
      pull: up
      members:
        - { node: master, peripheral: gpiob, pin: 7 }
        - { node: slave, peripheral: gpioc, pin: 1 }
