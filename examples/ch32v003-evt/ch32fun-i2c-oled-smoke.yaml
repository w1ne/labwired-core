# ch32fun examples/i2c_oled, unmodified, driving a 128x32 SSD1306 at 0x3C over
# polled I2C1 (PC1 SDA, PC2 SCL). After 200 ms of start-up delays it fills
# the frame with the bytes 0..511 ("buffer fill with binary"), waits 2 s, then
# draws mode 1 ("pixel plots"): for x in 0..128 one pixel at (x, x/4) and one
# at (x, 31 - x/4). The run stops inside mode 1's 2 s hold (~106 M cycles in,
# mode 2 starts near 202 M), so the panel must hold exactly those two
# diagonals: 256 lit pixels of 4096. The region checks pin the geometry, so a
# model that lost the page/column addressing, mirrored the panel, or stopped
# after mode 0 (half the pixels lit) fails here, and so does an I2C event
# timeout: ssd1306_i2c_error abandons the packet, leaving the frame short.
schema_version: "1.2"
inputs:
  firmware: "ch32fun/i2c_oled.elf"
  system: "../../configs/systems/ch32v003evt-ch32fun-i2c-oled-smoke.yaml"
limits:
  max_cycles: 130000000
  max_steps: 200000000
  wall_time_ms: 600000
assertions:
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "i2c_oled example" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "initializing i2c oled...done." }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "buffer fill with binary" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "pixel plots" }
  # Mode 1's two diagonals: 256 of the 4096 pixels (6.25 %).
  - display_region: { id: oled, min_ink: 0.062, max_ink: 0.063 }
  # Top-left 4x1: x = 0..3 all land on row 0 (x/4 = 0).
  - display_region: { id: oled, x: 0, y: 0, w: 4, h: 1, min_ink: 1.0 }
  # Bottom-left 4x1: the mirrored diagonal, (x, 31 - x/4) = row 31.
  - display_region: { id: oled, x: 0, y: 31, w: 4, h: 1, min_ink: 1.0 }
  # Right end: x = 124..127 sit on rows 31 and 0.
  - display_region: { id: oled, x: 124, y: 31, w: 4, h: 1, min_ink: 1.0 }
  - display_region: { id: oled, x: 124, y: 0, w: 4, h: 1, min_ink: 1.0 }
  # Left band, rows 8..23: the diagonals are at rows 0..3 and 28..31 there.
  - display_region: { id: oled, x: 0, y: 8, w: 16, h: 16, min_ink: 0.0, max_ink: 0.0 }
  # Centre crossing: x = 60..67 put both diagonals on rows 15 and 16 only.
  - display_region: { id: oled, x: 60, y: 15, w: 8, h: 2, min_ink: 1.0 }
  - display_region: { id: oled, x: 60, y: 0, w: 8, h: 15, min_ink: 0.0, max_ink: 0.0 }
