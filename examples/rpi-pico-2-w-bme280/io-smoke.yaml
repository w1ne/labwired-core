# Pico 2 W / RP2350 reads the BME280 chip ID from I2C0 on GP4/GP5.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-pico2w-bme280-smoke"
  system: "../../configs/systems/rpi-pico-2-w-bme280.yaml"
limits:
  max_steps: 200000
  stop_when_assertions_pass: true
assertions:
  - uart_contains: "PICO2W_BME280_ID=0x60_I2C0_GP4_GP5"
  - memory_value:
      address: 0x40028024
      expected_value: 3
      size: 4
  - memory_value:
      address: 0x4002802c
      expected_value: 3
      size: 4
