[platformio]
default_envs = devkitc_n16r8

[env:devkitc_n16r8]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; The official N16R8 board has 16 MB flash. The source uses internal SRAM only;
; PSRAM is present on the physical module but is outside this smoke's model.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
