# ch32fun examples/debugprintfdemo built for TARGET_MCU=CH32V006, unmodified.
# "+N" then "-N[c]" through the WCH-Link debug printf channel (DMDATA0/1 at
# 0xE00000F4). c is the last host byte, NUL here: no host input is
# modelled. DMDATA0 bits 7:6 read 0 at the end: the probe took every request
# and ch32fun's timeout never fired.
schema_version: "1.0"
inputs:
  firmware: "ch32fun/debugprintfdemo.elf"
  system: "../../configs/systems/ch32v006f8u7-ch32fun-smoke.yaml"
limits:
  max_cycles: 40000000
  max_steps: 40000000
  wall_time_ms: 600000
assertions:
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "+0" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "-1[" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "+4" }
  - peripheral_log: { peripheral: debug_printf, log: terminal, contains: "-5[" }
  - memory_value: { address: 0xE00000F4, mask: 0xC0, expected_value: 0 }
