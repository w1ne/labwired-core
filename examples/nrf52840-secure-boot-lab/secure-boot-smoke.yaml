schema_version: "1.2"
# CLI test for the nRF52840 secure boot + signed-OTA / anti-rollback lab,
# with an ATECC608A secure element holding the verify key.
#
# One run shows a three-boot lifecycle:
#   boot 1: UICR erased -> provision 16-byte root key from the TRNG into UICR
#           CUSTOMER, burn the anti-rollback counter to v1, APPROTECT, reboot
#   boot 2: hardware AES-128 boot verify -> host injects a signed v2 OTA
#           package over UART -> firmware hashes it (SHA-256), the secure
#           element verifies the OEM's ECDSA P-256 signature against the
#           public key in its data slot -> accept, burn counter to v2, reboot
#   boot 3: v2 boot -> authentic-but-old v1 package is ROLLBACK-REJECTED,
#           forged v3 package is BAD-SIGNATURE-REJECTED by the SE, and the SE
#           proves device identity with a sign/verify ATTESTATION round-trip
#
# The sim's RNG is deterministic (xorshift32, seed 0xC0DEF00D), so the
# provisioned key — and every golden value below — is identical on every
# fresh run. That is what lets this script assert REAL crypto bit-for-bit:
#   key            = 22 CA B3 3F 02 30 A2 F2 0B EE F7 8A 31 63 B7 56
#   challenge      = "LabWired-ROT-v01"
#   boot ciphertext= F9 EE BB 62 D1 39 1E B8 BF F1 88 ED B8 24 9C 02
#   v2 pkg SHA-256 = 6F EB 7B 70 99 6C 99 C7 31 5A 35 FE 25 8E 37 39
#                    E0 41 CB 9D FD 7A A1 80 25 63 3E C9 6A B5 B6 74
# The three injected packages are generated by ./make_packages.py (openssl);
# re-run it after any format change, never hand-edit the byte arrays.
#
# Build the firmware first:
#   cargo build -p firmware-nrf52840-secure-boot --target thumbv7em-none-eabi --release
# Then run:
#   cargo run -q -p labwired-cli -- test \
#     --script examples/nrf52840-secure-boot-lab/secure-boot-smoke.yaml \
#     --output-dir out/nrf52840-secure-boot
#
# RESULTS struct: pinned at 0x20000000 (.uninit lands at RAM start; field
# order in main.rs fixes every offset — the layout no longer shifts between
# builds). Offsets:
#   ota_accepted 0x00  digest 0x04..0x24  approtect_readback 0x24
#   rollback_counter 0x28  badsig_rejected 0x2c  boot_phase 0x30
#   installed_version 0x34  rollback_rejected 0x38  tamper_reject 0x3c
#   verify_result 0x40  attestation_ok 0x44
#   ciphertext 0x48..0x58  key_words 0x58..0x68
inputs:
  system: "./system.yaml"
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nrf52840-secure-boot"
limits:
  max_steps: 30000000

# ── The OTA server: three packages queued to uart0 RX at run start ────────
# The firmware consumes them in order — one per boot phase — so no pacing is
# needed: every STARTRX finds its package already in the queue.
uart_injections:
  # ── v2-accept (140 bytes) ──
  - uart: "uart0"
    trigger: !at_start
    bytes:
      [0x4C, 0x57, 0x4F, 0x54, 0x02, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x4C, 0x61, 0x62, 0x57,
        0x69, 0x72, 0x65, 0x64, 0x20, 0x4F, 0x54, 0x41, 0x20, 0x69, 0x6D, 0x61, 0x67, 0x65, 0x20, 0x76,
        0x32, 0x20, 0x28, 0x64, 0x65, 0x6D, 0x6F, 0x20, 0x70, 0x61, 0x79, 0x6C, 0x6F, 0x61, 0x64, 0x2C,
        0x20, 0x6E, 0x6F, 0x74, 0x20, 0x65, 0x78, 0x65, 0x63, 0x75, 0x74, 0x61, 0x62, 0x6C, 0x65, 0x29,
        0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAC, 0xF2, 0x8B, 0xD5,
        0x61, 0xA5, 0x2F, 0xAC, 0x23, 0x5C, 0x88, 0xC1, 0x2A, 0xDF, 0xEB, 0xF1, 0x1B, 0x6F, 0xD7, 0x37,
        0x01, 0x40, 0x86, 0x41, 0x71, 0xC8, 0x72, 0x90, 0x03, 0xAC, 0x60, 0xC7, 0xAD, 0x36, 0xC8, 0x0F,
        0x02, 0xE6, 0x7C, 0xD9, 0x7C, 0x2B, 0x53, 0xEA, 0x5A, 0xB9, 0xAE, 0xC5, 0xA6, 0x63, 0xD7, 0xFD,
        0xC0, 0x02, 0x24, 0xDB, 0x9E, 0xA5, 0x6F, 0x81, 0xE2, 0x32, 0xFE, 0x46]
  # ── v1-rollback (140 bytes) ──
  - uart: "uart0"
    trigger: !at_start
    bytes:
      [0x4C, 0x57, 0x4F, 0x54, 0x01, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x4C, 0x61, 0x62, 0x57,
        0x69, 0x72, 0x65, 0x64, 0x20, 0x4F, 0x54, 0x41, 0x20, 0x69, 0x6D, 0x61, 0x67, 0x65, 0x20, 0x76,
        0x31, 0x20, 0x2D, 0x20, 0x61, 0x75, 0x74, 0x68, 0x65, 0x6E, 0x74, 0x69, 0x63, 0x20, 0x62, 0x75,
        0x74, 0x20, 0x4F, 0x4C, 0x44, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
        0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x5E, 0x0C, 0x30, 0xB0,
        0xA6, 0xB7, 0xAC, 0x7E, 0x0F, 0x0E, 0x95, 0x87, 0xB1, 0x8F, 0x02, 0xB0, 0xA6, 0xA0, 0xC0, 0x35,
        0x9C, 0x3C, 0x38, 0xEB, 0x8F, 0xF2, 0x85, 0x12, 0x19, 0x71, 0xB1, 0xC4, 0xE8, 0x91, 0x6E, 0x2B,
        0xD4, 0xD9, 0x23, 0xF0, 0xEE, 0x74, 0x30, 0x64, 0x69, 0x22, 0x37, 0x5F, 0x2A, 0x1C, 0x21, 0x28,
        0xEC, 0x6E, 0x69, 0xED, 0x0C, 0xA9, 0x72, 0xB0, 0x0B, 0xD2, 0xAC, 0x30]
  # ── v3-forged (140 bytes) ──
  - uart: "uart0"
    trigger: !at_start
    bytes:
      [0x4C, 0x57, 0x4F, 0x54, 0x03, 0x00, 0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x4C, 0x61, 0x62, 0x57,
        0x69, 0x72, 0x65, 0x64, 0x20, 0x4F, 0x54, 0x41, 0x20, 0x69, 0x6D, 0x61, 0x67, 0x65, 0x20, 0x76,
        0x33, 0x20, 0x2D, 0x20, 0x46, 0x4F, 0x52, 0x47, 0x45, 0x44, 0x20, 0x73, 0x69, 0x67, 0x6E, 0x61,
        0x74, 0x75, 0x72, 0x65, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
        0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xAB, 0xE7, 0x51, 0xD9,
        0x79, 0x2B, 0xDE, 0xCB, 0x08, 0x8D, 0xF5, 0x83, 0x69, 0xB5, 0x9D, 0x3E, 0x7F, 0xD6, 0x42, 0xE9,
        0x56, 0x6E, 0xB0, 0x65, 0x14, 0x2C, 0xED, 0xF2, 0x40, 0xE3, 0xA8, 0x3F, 0xDE, 0xE2, 0xD5, 0x26,
        0x55, 0x4B, 0x97, 0x84, 0x59, 0xA4, 0xFB, 0xC5, 0x72, 0xFA, 0x4A, 0xC3, 0x83, 0x51, 0x78, 0x85,
        0x1A, 0xBF, 0xB1, 0x86, 0xB2, 0x29, 0x5F, 0x12, 0xBC, 0xA2, 0x9A, 0xA5]

assertions:
  # ── UART narrative: all three boots, in story order ─────────────────────
  - uart_contains: "ROT: PROVISIONED"
  - uart_contains: "SECURE BOOT OK (v1)"
  - uart_contains: "OTA v2 SIGNATURE OK"
  - uart_contains: "OTA v2 COMMITTED"
  - uart_contains: "SECURE BOOT OK (v2)"
  - uart_contains: "ANTI-ROLLBACK v2 ACTIVE"
  - uart_contains: "ROLLBACK REJECTED"
  - uart_contains: "BAD SIGNATURE REJECTED"
  - uart_contains: "ATTESTATION OK"
  - uart_contains: "UPDATE SLOT VERIFIED"

  # ── Lifecycle state ──────────────────────────────────────────────────────
  - memory_value:
      address: 0x20000030 # BOOT_PHASE
      expected_value: 3
      size: 4
  - memory_value:
      address: 0x20000034 # INSTALLED_VERSION
      expected_value: 2
      size: 4
  - memory_value:
      address: 0x20000028 # ROLLBACK_COUNTER (v1+v2 burned, one-way)
      expected_value: 0xFFFFFFFC
      size: 4
  - memory_value:
      address: 0x20000024 # APPROTECT_READBACK (0 = Protected)
      expected_value: 0
      size: 4

  # ── Verdicts: verify, accept, both rejects, attestation ─────────────────
  - memory_value:
      address: 0x20000040 # VERIFY_RESULT
      expected_value: 1
      size: 4
  - memory_value:
      address: 0x2000003c # TAMPER_REJECT_RESULT
      expected_value: 1
      size: 4
  - memory_value:
      address: 0x20000000 # OTA_ACCEPTED (.uninit, survives boot-3 reboot)
      expected_value: 1
      size: 4
  - memory_value:
      address: 0x20000038 # ROLLBACK_REJECTED
      expected_value: 1
      size: 4
  - memory_value:
      address: 0x2000002c # BADSIG_REJECTED
      expected_value: 1
      size: 4
  - memory_value:
      address: 0x20000044 # ATTESTATION_OK
      expected_value: 1
      size: 4

  # ── The provisioned key, as read back from UICR ──────────────────────────
  - memory_value:
      address: 0x20000058 # KEY_WORDS[0]
      expected_value: 0x3FB3CA22
      size: 4
  - memory_value:
      address: 0x2000005c # KEY_WORDS[1]
      expected_value: 0xF2A23002
      size: 4
  - memory_value:
      address: 0x20000060 # KEY_WORDS[2]
      expected_value: 0x8AF7EE0B
      size: 4
  - memory_value:
      address: 0x20000064 # KEY_WORDS[3]
      expected_value: 0x56B76331
      size: 4

  # ── Real AES-128-ECB boot ciphertext from the ECB coprocessor ────────────
  - memory_value:
      address: 0x20000048 # CIPHERTEXT[0]
      expected_value: 0x62BBEEF9
      size: 4
  - memory_value:
      address: 0x2000004c # CIPHERTEXT[1]
      expected_value: 0xB81E39D1
      size: 4
  - memory_value:
      address: 0x20000050 # CIPHERTEXT[2]
      expected_value: 0xED88F1BF
      size: 4
  - memory_value:
      address: 0x20000054 # CIPHERTEXT[3]
      expected_value: 0x029C24B8
      size: 4

  # ── The SHA-256 digest the firmware computed and the SE verified ─────────
  - memory_value:
      address: 0x20000004 # DIGEST[0]
      expected_value: 0x6FEB7B70
      size: 4
  - memory_value:
      address: 0x20000008 # DIGEST[1]
      expected_value: 0x996C99C7
      size: 4
  - memory_value:
      address: 0x2000000c # DIGEST[2]
      expected_value: 0x315A35FE
      size: 4
  - memory_value:
      address: 0x20000010 # DIGEST[3]
      expected_value: 0x258E3739
      size: 4
  - memory_value:
      address: 0x20000014 # DIGEST[4]
      expected_value: 0xE041CB9D
      size: 4
  - memory_value:
      address: 0x20000018 # DIGEST[5]
      expected_value: 0xFD7AA180
      size: 4
  - memory_value:
      address: 0x2000001c # DIGEST[6]
      expected_value: 0x25633EC9
      size: 4
  - memory_value:
      address: 0x20000020 # DIGEST[7]
      expected_value: 0x6AB5B674
      size: 4

  # ── The committed update, read back from the flash slot in boot 3 ────────
  # (SHA-256 of the 64-byte v2 payload at flash 0x00070000)
  - memory_value:
      address: 0x20000068 # FLASH_DIGEST[0]
      expected_value: 0xEE5496F2
      size: 4
  - memory_value:
      address: 0x2000006c # FLASH_DIGEST[1]
      expected_value: 0x4970A1BC
      size: 4
  - memory_value:
      address: 0x20000070 # FLASH_DIGEST[2]
      expected_value: 0x5DAA5C5A
      size: 4
  - memory_value:
      address: 0x20000074 # FLASH_DIGEST[3]
      expected_value: 0x9F5A2C82
      size: 4
  - memory_value:
      address: 0x20000078 # FLASH_DIGEST[4]
      expected_value: 0xD72643C8
      size: 4
  - memory_value:
      address: 0x2000007c # FLASH_DIGEST[5]
      expected_value: 0x8479FAAA
      size: 4
  - memory_value:
      address: 0x20000080 # FLASH_DIGEST[6]
      expected_value: 0x2EA34302
      size: 4
  - memory_value:
      address: 0x20000084 # FLASH_DIGEST[7]
      expected_value: 0x242FD799
      size: 4

  # ── The panel ────────────────────────────────────────────────────────────
  # Until now nothing in this script read the OLED, and the run went green
  # while the panel painted scrambled output: the SSD1306 model dropped the
  # control byte on every transfer after the first, so the framebuffer was
  # parsed as commands and the image landed 49 columns to the right with rows
  # wrapped into the wrong pages. 45 passing assertions said nothing about it.
  #
  # These measure the final frame, which is boot 3's screen:
  #
  #   page 0  SECURE BOOT OK     page 4  ROLLBACK REJECTED
  #   page 1  FW V2 ACTIVE       page 5  FORGED REJECTED
  #   page 2  ANTI-ROLLBACK ON   page 6  ATTEST + FLASH OK
  #   page 3  (never painted)    page 7  CRA READY
  #
  # Each text row sits near 0.28 ink, so 0.15..0.45 passes the real glyphs and
  # fails both a blank row and a row of noise. The tail regions are the ones
  # that matter most: they must be EXACTLY empty, which is what a shifted,
  # wrapped or overrun image cannot be.
  #
  # Coverage limit, stated because a check only covers what it reads: this is
  # the final frame only. A row that is wrong mid-run and repainted correctly
  # after a reboot passes here. Catching that needs either a time-scoped
  # display assertion or a second capped run, and a second run would mean a
  # third copy of the injected package bytes.

  # Text is present, and starts at the left edge. Under the shifted-image bug
  # this first character cell was blank.
  - display_region:
      id: "oled"
      x: 0
      y: 0
      w: 6
      h: 8
      min_ink: 0.10
      max_ink: 0.60
  - display_region:
      id: "oled"
      x: 0
      y: 0
      w: 84
      h: 8
      min_ink: 0.15
      max_ink: 0.45
  - display_region:
      id: "oled"
      x: 0
      y: 16
      w: 96
      h: 8
      min_ink: 0.15
      max_ink: 0.45
  - display_region:
      id: "oled"
      x: 0
      y: 32
      w: 102
      h: 8
      min_ink: 0.15
      max_ink: 0.45
  - display_region:
      id: "oled"
      x: 0
      y: 56
      w: 54
      h: 8
      min_ink: 0.15
      max_ink: 0.45

  # Nothing past the end of a line, and nothing on the row boot 3 never paints.
  - display_region:
      id: "oled"
      x: 90
      y: 0
      w: 38
      h: 8
      min_ink: 0.0
      max_ink: 0.0
  - display_region:
      id: "oled"
      x: 102
      y: 16
      w: 26
      h: 8
      min_ink: 0.0
      max_ink: 0.0
  - display_region:
      id: "oled"
      x: 0
      y: 24
      w: 128
      h: 8
      min_ink: 0.0
      max_ink: 0.0
  - display_region:
      id: "oled"
      x: 108
      y: 32
      w: 20
      h: 8
      min_ink: 0.0
      max_ink: 0.0
  - display_region:
      id: "oled"
      x: 60
      y: 56
      w: 68
      h: 8
      min_ink: 0.0
      max_ink: 0.0

  - expected_stop_reason: max_steps
