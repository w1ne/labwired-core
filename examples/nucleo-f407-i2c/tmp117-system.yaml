# NUCLEO-F407 + TI TMP117 I2C temperature sensor design smoke.
# The board's native I2C1 model and board LED are used; no other sensors are
# attached in this focused system.

name: "nucleo-f407-tmp117"
chip: "../../configs/chips/stm32f407.yaml"
external_devices:
  - id: "tmp117"
    type: "tmp117"
    connection: "i2c1"
    config:
      i2c_address: 0x48
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
