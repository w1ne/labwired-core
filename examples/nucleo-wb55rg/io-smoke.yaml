# LabWired - NUCLEO-WB55RG (MB1355C) onboarding smoke
#
# Build: cargo build -p firmware-nucleo-wb55rg-demo --release --target thumbv7em-none-eabi
#
# LD1 PB5, LD2 PB0, LD3 PB1 are active high; the heartbeat uses USART1 on
# PB6/PB7, the default ST-LINK VCP pins. The message reports GPIO ODR state.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-wb55rg-demo"
  system: "../../configs/systems/mb1355c.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "NUCLEO-WB55RG ready"
  - uart_ordered:
      - "hb=0 ld1=on"
      - "hb=1 ld1=off"
      - "hb=2 ld2=on"
      - "hb=3 ld2=off"
  - gpio_edges:
      pin: "gpiob:5"
      min_edges: 2
  - gpio_edges:
      pin: "gpiob:0"
      min_edges: 2
  - gpio_edges:
      pin: "gpiob:1"
      min_edges: 2
  - expected_stop_reason: max_steps
