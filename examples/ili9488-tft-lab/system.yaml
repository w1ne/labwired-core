name: "ili9488-tft-lab"
chip: "../../configs/chips/stm32f103.yaml"
peripherals:
  - id: "spi1"
    type: "spi"
    base_address: 0x40013000
    size: "1KB"
    irq: 35
external_devices:
  - id: "tft"
    type: "ili9488"
    connection: "spi1"
    config:
      cs_pin: "PA4"
      dc_pin: "PB0"
      # Active-low reset; held high after boot (same as Nano Pong RST wiring).
      reset_pin: "PB1"
board_io: []
