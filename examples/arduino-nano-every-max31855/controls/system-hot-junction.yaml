# Value control: the same board and sketch, with the hot junction at
# 100.25 °C and the cold junction at 30.5 °C. The printed readings must
# follow these inputs.
name: arduino-nano-every-max31855-hot-junction
chip: ../../../configs/chips/atmega4809.yaml
cpu_hz: 16000000
external_devices:
  - id: "max31855"
    type: "max31855"
    connection: "spi0"
    config:
      cs_pin: "PB1"
      temperature: 100.25
      internal: 30.5
board_io: []
