# LabWired - Adafruit Metro M4 UART smoke test
schema_version: "1.0"
inputs:
  # Built by: cargo build -p firmware-atsamd51-demo --release --target thumbv7em-none-eabi
  # Survival fixture (same bytes): tests/fixtures/atsamd51-metro-m4-smoke.elf
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-atsamd51-demo"
  system: "./system.yaml"
limits:
  max_steps: 800000
assertions:
  - uart_contains: "OK"
  - expected_stop_reason: max_steps
