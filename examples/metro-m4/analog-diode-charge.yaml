# Four generic Shockley diode branches isolate depletion and diffusion charge
# while routing their solved terminal voltages through Metro M4 ADC0. The
# 100 nF CJO makes depletion storage measurable at this fixture's 1 us step;
# it is a transient stress case rather than a representative small diode.
name: "metro-m4-diode-charge"
chip: "../../configs/chips/atsamd51.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "diode_charge_reference"
    adapter: "analog"
    step_ns: 1000
    inputs:
      supply_v: "ui.diode_charge.supply_v"
    outputs:
      v_sense: "board.analog.pa04_volts"
    config:
      substeps: 1
      netlist_text: |
        Vdrive drive 0 dc 0
        Rdrive drive sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_sense: "v(sense)"
      sources:
        supply_v: "Vdrive"
      vdd: 3.3
  - id: "diode_depletion_charge"
    adapter: "analog"
    step_ns: 1000
    inputs:
      supply_v: "ui.diode_charge.supply_v"
    outputs:
      v_sense: "board.analog.pa05_volts"
    config:
      substeps: 1
      netlist_text: |
        Vdrive drive 0 dc 0
        Rdrive drive sense 1k
        D1 sense 0 DCHARGE TEMP=25
        .model DCHARGE D(IS=2.52n N=1.752 RS=0.568 CJO=100n VJ=0.7 M=0.5 FC=0.5 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_sense: "v(sense)"
      sources:
        supply_v: "Vdrive"
      vdd: 3.3
  - id: "diode_transit_charge"
    adapter: "analog"
    step_ns: 1000
    inputs:
      supply_v: "ui.diode_charge.supply_v"
    outputs:
      v_sense: "board.analog.pa06_volts"
    config:
      substeps: 1
      netlist_text: |
        Vdrive drive 0 dc 0
        Rdrive drive sense 1k
        D1 sense 0 DTRANSIT TEMP=25
        .model DTRANSIT D(IS=2.52n N=1.752 RS=0.568 TT=10u TNOM=25 EG=1.11 XTI=3)
      probes:
        v_sense: "v(sense)"
      sources:
        supply_v: "Vdrive"
      vdd: 3.3
  - id: "diode_depletion_and_transit_charge"
    adapter: "analog"
    step_ns: 1000
    inputs:
      supply_v: "ui.diode_charge.supply_v"
    outputs:
      v_sense: "board.analog.pb09_volts"
    config:
      substeps: 1
      netlist_text: |
        Vdrive drive 0 dc 0
        Rdrive drive sense 1k
        D1 sense 0 DCOMBINED TEMP=25
        .model DCOMBINED D(IS=2.52n N=1.752 RS=0.568 CJO=100n VJ=0.7 M=0.5 FC=0.5 TT=10u TNOM=25 EG=1.11 XTI=3)
      probes:
        v_sense: "v(sense)"
      sources:
        supply_v: "Vdrive"
      vdd: 3.3
