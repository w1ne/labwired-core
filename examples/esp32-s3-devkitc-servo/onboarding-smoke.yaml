# ESP32-S3-DevKitC-1 v1.0: UART, built-in GPIO48 LED, and a GPIO4 LEDC servo.
schema_version: "1.2"
inputs:
  firmware: "../../target/xtensa-esp32s3-none-elf/release/firmware-esp32-s3-devkitc-servo-smoke"
  system: "../../configs/systems/esp32-s3-devkitc-1-n16r8-v10-servo.yaml"
limits:
  max_steps: 9000000
assertions:
  - uart_contains: "ESP32_S3_DEVKITC1_V10_LEDC_SERVO_OK"
  - display_region:
      id: "rgb_led"
      min_ink: 1.0
  - memory_value:
      address: 0x6001904C
      size: 32
      expected_value: 18992
  - gpio_edges:
      pin: "gpio:4"
      min_edges: 2
  - expected_stop_reason: max_steps
