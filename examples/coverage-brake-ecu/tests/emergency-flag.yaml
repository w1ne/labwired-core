# Emergency-brake request with the pedal up still lights the lamp.
schema_version: "1.2"
inputs:
  firmware: "../../../tests/fixtures/coverage-brake-ecu-cm3.elf"
  system: "../system.yaml"
limits:
  max_steps: 200000
uart_injections:
  - uart: "uart1"
    bytes: [0xA5, 0x07, 0x00, 0x01, 0x62, 0xA5, 0x08, 0x00, 0x00, 0xF9]
assertions:
  - uart_contains: "BRAKE ECU READY"
  - uart_contains: "BRAKE ON"
  - uart_contains: "BRAKE OFF"
  - expected_stop_reason: max_steps
