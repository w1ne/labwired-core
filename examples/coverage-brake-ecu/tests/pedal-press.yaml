# Driver presses and releases the pedal.
schema_version: "1.2"
inputs:
  firmware: "../../../tests/fixtures/coverage-brake-ecu-cm3.elf"
  system: "../system.yaml"
limits:
  max_steps: 200000
uart_injections:
  - uart: "uart1"
    bytes: [0xA5, 0x01, 0x00, 0x00, 0x7A, 0xA5, 0x02, 0x28, 0x00, 0xD9, 0xA5, 0x03, 0x64, 0x00, 0xCB, 0xA5, 0x04, 0x00, 0x00, 0xF3]
assertions:
  - uart_contains: "BRAKE ECU READY"
  - uart_contains: "BRAKE OFF"
  - uart_contains: "BRAKE ON"
  - expected_stop_reason: max_steps
