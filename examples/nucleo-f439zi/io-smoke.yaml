# NUCLEO-F439ZI: boot and repeatedly toggle the blue LD2 user LED on PB7.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-f439zi-smoke"
  system: "../../configs/systems/nucleo-f439zi.yaml"
limits:
  max_steps: 256
assertions:
  - gpio_edges:
      pin: "gpiob:7"
      min_edges: 8
  - expected_stop_reason: max_steps
