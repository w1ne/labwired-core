[platformio]
default_envs = devkitm1

[env:devkitm1]
platform = espressif32
board = esp32dev
framework = arduino
build_type = debug
build_flags = -g
build_src_filter = +<main.cpp>
; This smoke uses only UART0 and does not need PSRAM cache fix instructions.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw

[env:devkitm1_bme280]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
build_type = debug
build_flags =
  -g
  -Wl,--undefined=labwired_entry
build_src_filter = +<bme280_smoke.cpp>
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
