# Generic Beta NTC divider (GPIO34 = ADC1_CH6) and Shockley diode load line
# (GPIO35 = ADC1_CH7) for the classic ESP32 boards.
#
# esp32.yaml publishes the ADC1 inputs in an `analog_pins:` table, so neither
# netlist names the board, the ADC or a channel: each solves its own circuit
# and publishes a probe voltage to `board.analog.<pad>_volts`. Every profile
# that loads the same classic-ESP32 descriptor can run this deck unchanged.
name: "esp32-classic-analog-ntc-diode"
chip: "../../configs/chips/esp32.yaml"
cpu_hz: 240000000
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.gpio34_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.gpio35_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
