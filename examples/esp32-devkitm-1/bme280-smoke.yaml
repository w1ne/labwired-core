# Read the BME280 CHIP_ID through classic ESP32 I2C0 on GPIO21/22.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/tier1/esp32-devkitm-1-bme280.elf"
  system: "../../configs/systems/esp32-devkitm-1-bme280.yaml"
limits:
  max_steps: 250000
assertions:
  - memory_value:
      address: 0x3FF44004
      expected_value: 0x00800000
      mask: 0x00800000
      size: 4
  - memory_value:
      address: 0x3FF53008
      expected_value: 1
      mask: 1
      size: 4
  - memory_value:
      address: 0x3FF44584
      expected_value: 30
      size: 4
  - memory_value:
      address: 0x3FF44588
      expected_value: 29
      size: 4
  - expected_stop_reason: max_steps
