# dsPIC33FJ32MC204 demo system — M3: ADC1 + SPI1 loopback + TMP102 on I2C1.
name: "dspic33fj32mc204-demo"
chip: "../../configs/chips/dspic33fj32mc204.yaml"
external_devices:
  - id: "temp"
    type: "tmp102"
    connection: "i2c1"
    config:
      descriptor: "../../configs/peripherals/tmp102.yaml"
      i2c_address: 0x48
  - id: "spi_loopback"
    type: "loopback"
    connection: "spi1"
