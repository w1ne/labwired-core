# Generic NTC, Shockley diode, and temperature-paired level-1 NMOS branches
# routed to NUCLEO-F103RB ADC1_IN0..3 through the STM32F103 pin descriptor.
name: "nucleo-f103rb-epaper-mosfet-temperature"
chip: "../../configs/chips/stm32f103rb.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa0_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
  - id: "mosfet_temperature_pair"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_nominal: "board.analog.pa2_volts"
      v_hot: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Vg gate 0 dc 3.0
        Rnominal supply d_nominal 1k
        Rhot supply d_hot 1k
        Mnominal d_nominal gate 0 0 MNOM W=100u L=10u TEMP=25
        Mhot d_hot gate 0 0 MNOM W=100u L=10u TEMP=85
        .model MNOM NMOS(VTO=1 KP=20u GAMMA=0.4 PHI=0.65 LAMBDA=0.02 IS=1e-30 TNOM=25)
      probes:
        v_nominal: "v(d_nominal)"
        v_hot: "v(d_hot)"
      vdd: 3.3
