# LabWired - Capacitive Touch Lab system configuration
#
# Arduino Nano (ATmega328P) drives a CapacitiveSensor circuit: R1 = 1 MOhm
# from D4 to a touch pad wired to D2, plus the onboard LED on D13/PB5. The
# `cosim_models` block below is generated by board-config compile for the
# playground starter diagram; keep in sync (drift test).
name: "capacitive-touch-lab"
chip: "../../configs/chips/atmega328p.yaml"
cpu_hz: 16000000
board_io:
  - id: "status_led"
    kind: "led"
    peripheral: "portb"
    pin: 5          # PB5 / Arduino D13 LED_BUILTIN
    signal: "output"
    active_high: true

# generated by board-config compile for the playground starter diagram; keep
# in sync (drift test)
cosim_models:
  - id: "circuit"
    adapter: "analog"
    step_ns: 1000
    inputs:
      ctl_touch: "ui.touch.pressed"
      drv_pd2: "board.gpio.pd2"
      ctl_pd2: "board.gpio_output.pd2"
      drv_pd4: "board.gpio.pd4"
      ctl_pd4: "board.gpio_output.pd4"
    outputs:
      in_pd2: "board.gpio_in.pd2"
      in_pd4: "board.gpio_in.pd4"
    config:
      vdd: 5.0
      netlist_text: |
        RR1 v_net_mcu_d4 v_net_mcu_d2 1meg
        Ctouch_pad v_net_mcu_d2 0 20p
        Ctouch_finger f_touch 0 100p
        Stouch v_net_mcu_d2 f_touch ctl_touch ron=1k roff=1e12
        Vdrv_pd2 d_pd2 0 dc 0
        Sdrv_pd2 d_pd2 v_net_mcu_d2 ctl_pd2 ron=25 roff=1e12
        Vdrv_pd4 d_pd4 0 dc 0
        Sdrv_pd4 d_pd4 v_net_mcu_d4 ctl_pd4 ron=25 roff=1e12
      probes:
        in_pd2: "v(v_net_mcu_d2)"
        in_pd4: "v(v_net_mcu_d4)"
        v_net_mcu_d2: "v(v_net_mcu_d2)"
        v_net_mcu_d4: "v(v_net_mcu_d4)"
      sources:
        drv_pd2: "Vdrv_pd2"
        drv_pd4: "Vdrv_pd4"
