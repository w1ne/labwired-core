# LabWired - LiteX Minerva IO smoke
#
# Build: cargo build -p firmware-litex-minerva-smoke --release --target riscv32i-unknown-none-elf
#
# The firmware boots from the SoC's SRAM and prints over the LiteX UART. It
# proves the RV32I core with an add/shift-only result, reads back the
# declared-stub timer window (`timer=00000000`), and its heartbeat's `txfull=`
# field is read back from the UART CSR.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32i-unknown-none-elf/release/firmware-litex-minerva-smoke"
  system: "./system.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "MINERVA LITEX SMOKE"
  - uart_ordered:
      - "cpu=rv32i uart=litex"
      - "acc=00000100"
      - "timer=00000000"
      - "hb=0 txfull=00000000"
      - "hb=1 txfull=00000000"
      - "hb=2 txfull=00000000"
  - expected_stop_reason: max_steps
