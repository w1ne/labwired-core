# L1 UART0 smoke on the active ESP32-H2-DevKitM-1-N4S board variant.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-esp32h2-demo"
  system: "../../configs/systems/esp32h2-devkitm-1-n4s.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "H2_N4S_UART_OK"
  - expected_stop_reason: max_steps
