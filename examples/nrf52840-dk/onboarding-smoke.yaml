# nRF52840-DK: boot the SoC and toggle physical LED1 (Zephyr led0) on P0.13.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nrf52840-dk-smoke"
  system: "../../configs/systems/nrf52840-dk-led-smoke.yaml"
limits:
  max_steps: 100000
assertions:
  - gpio_edges:
      pin: "gpio0:13"
      min_edges: 16
  - expected_stop_reason: max_steps
