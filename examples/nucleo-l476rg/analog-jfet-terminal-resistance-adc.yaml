# Generic level-1 NJF branches routed to explicit STM32L476 ADC1 channels.
# Each model-card RD/RS branch is paired with an explicit resistor network.
# The chip descriptor has no PAx-to-channel analog aliases.
name: nucleo-l476rg-analog-jfet-terminal-resistance-adc
chip: ../../configs/chips/stm32l476.yaml
external_devices: []
board_io: []
cosim_models:
  - id: jfet_terminal_resistance_adc
    adapter: analog
    step_ns: 1000
    inputs:
      gate_voltage: ui.jfet.gate_v
    outputs:
      control_drain: adc.adc1.0_volts
      drain_resistance_drain: adc.adc1.1_volts
      source_resistance_drain: adc.adc1.2_volts
      both_resistances_drain: adc.adc1.3_volts
      explicit_drain_resistance_drain: adc.adc1.8_volts
      explicit_source_resistance_drain: adc.adc1.9_volts
      explicit_both_resistances_drain: adc.adc1.10_volts
    config:
      netlist_text: |
        Vdd supply 0 dc 3.3
        Vgate gate 0 dc 0
        Rload_control supply drain_control 1k
        Jcontrol drain_control gate 0 NJF_CONTROL
        .model NJF_CONTROL NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30)
        Rload_drain supply drain_rd 1k
        Jdrain drain_rd gate 0 NJF_DRAIN
        .model NJF_DRAIN NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RD=200)
        Rload_source supply drain_rs 1k
        Jsource drain_rs gate 0 NJF_SOURCE
        .model NJF_SOURCE NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RS=200)
        Rload_both supply drain_both 1k
        Jboth drain_both gate 0 NJF_BOTH
        .model NJF_BOTH NJF(VTO=-2 BETA=500u LAMBDA=0.025 B=1 PB=1 IS=1e-30 RD=200 RS=200)
        Rload_explicit_drain supply drain_explicit_drain 1k
        Rext_drain drain_explicit_drain drain_intrinsic_explicit_drain 200
        Jexplicit_drain drain_intrinsic_explicit_drain gate 0 NJF_CONTROL
        Rload_explicit_source supply drain_explicit_source 1k
        Jexplicit_source drain_explicit_source gate source_explicit NJF_CONTROL
        Rext_source source_explicit 0 200
        Rload_explicit_both supply drain_explicit_both 1k
        Rext_both_drain drain_explicit_both drain_intrinsic_explicit_both 200
        Jexplicit_both drain_intrinsic_explicit_both gate source_explicit_both NJF_CONTROL
        Rext_both_source source_explicit_both 0 200
      probes:
        control_drain: v(drain_control)
        drain_resistance_drain: v(drain_rd)
        source_resistance_drain: v(drain_rs)
        both_resistances_drain: v(drain_both)
        explicit_drain_resistance_drain: v(drain_explicit_drain)
        explicit_source_resistance_drain: v(drain_explicit_source)
        explicit_both_resistances_drain: v(drain_explicit_both)
      sources:
        gate_voltage: Vgate
      vdd: 3.3
