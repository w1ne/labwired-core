schema_version: '1.0'
inputs:
  firmware: validation/arduino-matrix/out/arduino-nano-every/L3_i2c_sensor/firmware.elf
  system: validation/arduino-matrix/systems/arduino-nano-every.yaml
limits:
  max_steps: 500000
  max_uart_bytes: 65536
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
  stop_when_assertions_pass_min_steps: 0
assertions:
- uart_contains: LW_L3_OK
