# Generic Beta NTC and Shockley diode netlists drive two ATmega4809 ADC0
# inputs through the pad map in the chip's `pins:` table.
#
# Neither netlist names the board, the CPU, the ADC, or a channel: each one
# solves its own circuit and publishes a probe voltage to
# `board.analog.<pad>_volts`. The ATmega4809 descriptor records
# `{ type: adc, peripheral: adc0, channel: N }` on PD0..PD7, PE0..PE3 and
# PF2..PF5, so the router resolves PD3 -> ADC0/AIN3 and PD2 -> ADC0/AIN2.
#
# On the Arduino Nano Every those pads are A0 and A1. The supply is the
# board's 5 V rail, which is also the VDD reference the megaAVR converter
# converts against, so a full-scale input reads 1023.
name: "arduino-nano-every-analog"
chip: "../../configs/chips/atmega4809.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pd3_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 5.0
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 5.0
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pd2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 5.0
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 5.0
