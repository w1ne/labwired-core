# Generic Beta NTC and Shockley diode netlists drive two MAIN_GPIO0 pads of
# the SK-AM62 40-pin user expansion connector (SPRUJ40F, Table 2-28):
#   pin 15  EXP_GPIO0_32  ball L23  GPIO0_32  <- NTC divider
#   pin 13  EXP_GPIO0_42  ball L21  GPIO0_42  <- diode load line
# Both pads are LVCMOS in the 3.3 V GPMC group (VDDSHV3). Firmware reads the
# levels in MAIN_GPIO0 IN_DATA23 (0x0060_0048), bits 0 and 10. The PADCONFIG
# receiver enable is not modelled (the pad configuration is a stub).
name: "sk-am62-analog-inputs"
chip: "../../configs/chips/am6234.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.gpio_in.main_gpio0.32"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.gpio_in.main_gpio0.42"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
