[platformio]
default_envs = feather_nopsramfix

[env:feather_nopsramfix]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
build_type = debug
build_flags = -g
build_src_filter = +<main.cpp> -<bme280_smoke.cpp>
; The classic ESP32 CPU model does not execute this PSRAM cache workaround's
; generated instruction sequence. The smoke never accesses external PSRAM.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw

[env:feather_bme280]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
build_type = debug
build_flags = -g
build_src_filter = +<bme280_smoke.cpp> -<main.cpp>
; The classic ESP32 CPU model does not execute this PSRAM cache workaround's
; generated instruction sequence. This smoke does not access external PSRAM.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
