# Adafruit ESP32 Feather V2's red #13 user LED is GPIO13.
# The committed fixture drives the modeled output low then high.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/tier1/adafruit-feather-esp32-v2-gpio.elf"
  system: "../../configs/systems/adafruit-feather-esp32-v2.yaml"
limits:
  max_steps: 200000
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 100
  stop_when_assertions_pass_min_steps: 0
assertions:
  - gpio_edges:
      pin: "gpio:13"
      min_edges: 2
