# Feather ESP32 V2: enable the STEMMA QT rail on GPIO2, then read BME280 over I2C0.
schema_version: "1.2"
inputs:
  firmware: "firmware/.pio/build/feather_bme280/firmware.elf"
  system: "../../configs/systems/adafruit-feather-esp32-v2-bme280.yaml"
limits:
  max_steps: 12000000
  stop_when_assertions_pass: true
  stop_when_assertions_pass_min_steps: 1500000
  stop_when_assertions_pass_settle_steps: 1000
assertions:
  - uart_contains: "BME280_POWER_OFF_NACK=1"
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "BME280_TEMP_RAW=0x082DC0"
