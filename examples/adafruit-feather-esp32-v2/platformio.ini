[platformio]
default_envs = feather_esp32_v2_gpio

[env:feather_esp32_v2_gpio]
platform = espressif32@8.0.0
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
build_flags =
  -Wl,--undefined=labwired_entry

[env:feather_esp32_v2_bme280]
extends = env:feather_esp32_v2_gpio
build_src_filter = -<*> +<bme280_smoke.cpp>
