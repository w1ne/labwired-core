# Generic Beta NTC divider and Shockley diode for the STM32F072B-DISCO.
# Each solved voltage reaches a GPIO input; the NTC also reaches PA0/ADC1_IN0,
# and the diode is wired to PA1/ADC1_IN1 for the ADC conversion proof.
name: stm32f072b-disco-analog
chip: ../../configs/chips/stm32f072.yaml
external_devices: []
board_io: []
cosim_models:
  - id: ntc_divider
    adapter: analog
    step_ns: 1000
    inputs:
      temperature: ui.ntc.temperature_c
    outputs:
      v_sense: board.gpio_in.pa0
      adc_sense: board.analog.pa0_volts
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: v(sense)
        adc_sense: v(sense)
      sources:
        temperature: Rntc
      vdd: 3.3
  - id: diode_load_line
    adapter: analog
    step_ns: 1000
    outputs:
      v_diode: board.gpio_in.pa9
      adc_diode: board.analog.pa1_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: v(sense)
        adc_diode: v(sense)
      vdd: 3.3
