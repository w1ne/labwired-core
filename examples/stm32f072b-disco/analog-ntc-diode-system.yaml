# Generic Beta NTC divider and Shockley diode for the STM32F072B-DISCO.
# Solved voltages route to modeled GPIOA inputs; this proves the F072 GPIO
# threshold path. The configured L4-style ADC model has no external conversion
# input yet, so this fixture does not claim ADC conversion support.
name: stm32f072b-disco-analog
chip: ../../configs/chips/stm32f072.yaml
external_devices: []
board_io: []
cosim_models:
  - id: ntc_divider
    adapter: analog
    step_ns: 1000
    inputs:
      temperature: ui.ntc.temperature_c
    outputs:
      v_sense: board.gpio_in.pa0
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: v(sense)
      sources:
        temperature: Rntc
      vdd: 3.3
  - id: diode_load_line
    adapter: analog
    step_ns: 1000
    outputs:
      v_diode: board.gpio_in.pa9
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: v(sense)
      vdd: 3.3
