# Raspberry Pi Pico 2 reads BME280 CHIP_ID over I2C0 on GP4/GP5.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-pico2-bme280-smoke"
  system: "../../configs/systems/pico2-bme280.yaml"
limits:
  max_steps: 200000
  stop_when_assertions_pass: true
assertions:
  - uart_contains: "PICO2_BME280_ID=0x60_I2C0_GP4_GP5"
  - memory_value:
      address: 0x40028024
      expected_value: 3
      size: 4
  - memory_value:
      address: 0x4002802c
      expected_value: 3
      size: 4
