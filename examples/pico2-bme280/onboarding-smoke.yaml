# Raspberry Pi Pico 2 + BME280: live I2C register read, UART result, and LED.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-pico2-bme280-smoke"
  system: "../../configs/systems/pico2-bme280.yaml"
limits:
  max_steps: 300000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "BME280_TEMP_RAW=0x082DC0"
  - uart_contains: "PICO2_BME280_SMOKE_OK"
  - gpio_edges:
      pin: "sio:25"
      min_edges: 8
  - expected_stop_reason: max_steps
