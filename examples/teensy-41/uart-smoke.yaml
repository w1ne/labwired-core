# LabWired - Teensy 4.1 UART smoke test
schema_version: "1.0"
inputs:
  # Built by: cargo build -p firmware-imxrt1064-demo --release --target thumbv7em-none-eabi
  # Survival fixture (same bytes): tests/fixtures/imxrt1064-teensy41-smoke.elf
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-imxrt1064-demo"
  system: "./system.yaml"
limits:
  max_steps: 800000
assertions:
  - uart_contains: "OK"
  - expected_stop_reason: max_steps
