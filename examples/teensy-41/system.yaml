# Teensy 4.1 (MIMXRT1062 silicon; chip yaml is the RT1064-class cousin).
# SIM-DERIVED — not silicon-verified. LED on GPIO2_IO03; Serial1 = LPUART6.

name: "teensy-41-example"
chip: "../../configs/chips/imxrt1064.yaml"
external_devices: []
board_io:
  - id: "led_d13"
    kind: "led"
    peripheral: "gpio2"
    pin: 3   # GPIO2_IO03 — PJRC Teensy 4.1 pin 13 / LED_BUILTIN
    signal: "output"
    active_high: true
connectors:
  - type: "uart"
    peripheral: "lpuart6"
    endpoint: "host_console"
