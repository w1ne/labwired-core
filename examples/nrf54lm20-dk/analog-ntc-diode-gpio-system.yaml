# Two generic MNA devices routed to nRF54LM20-DK button pads as digital inputs.
# Both run from the DK's default 1.8 V VDD:nRF rail (nRF54LM20 DK HW User
# Guide v0.7.0, 2.2), so the pads switch at the datasheet's 0.3/0.7 x VDD
# (0.54/1.26 V), not at a 3.3 V part's levels.
name: "nrf54lm20dk-analog-ntc-diode-gpio"
chip: "../../configs/chips/nrf54lm20a.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.gpio_in.p0.05"
    config:
      netlist_text: |
        Vcc vcc 0 dc 1.8
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 1.8
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.gpio_in.p1.26"
    config:
      netlist_text: |
        Vcc supply 0 dc 1.8
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 1.8
