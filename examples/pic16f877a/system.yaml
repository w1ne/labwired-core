#
# PIC16F877A (40-pin PDIP) with a 16 MHz HS crystal, the USART on RC6/TX and
# an LED on RB0.
name: "pic16f877a-demo"
chip: "../../configs/chips/pic16f877a.yaml"
# 16 MHz HS crystal = 4 MIPS (Fosc/4); the chip default is the 20 MHz maximum.
cpu_hz: 4000000
