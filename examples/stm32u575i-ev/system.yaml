# LabWired - STM32U575I-EV example system (MB1550, STM32U575AII6Q).
#
# Same board manifest as configs/systems/stm32u575i-ev.yaml, kept beside the
# example so the package is self-contained.
#
# Pin/polarity sources: UM2854 Rev 2 and ST STM32CubeU5 v1.9.0
# `stm32u575i-ev-bsp` v1.4.1 `stm32u575i_eval.h` (LED5 PB7, LED6 PH7, active
# high; USER PC13; COM1 = USART1 PA9/PA10).
name: "stm32u575i-ev"
chip: "../../configs/chips/stm32u575.yaml"
debug_uart: "usart1"
external_devices: []
board_io:
  - id: "led_green_led5"
    kind: "led"
    peripheral: "gpiob"
    pin: 7
    signal: "output"
    active_high: true
  - id: "led_red_led6"
    kind: "led"
    peripheral: "gpioh"
    pin: 7
    signal: "output"
    active_high: true
  - id: "button_user_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: true
