# Read BME280.CHIP_ID over the NUCLEO-F103RB Arduino I2C1 route and pulse LD2.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-nucleo-f103rb-bme280-smoke"
  system: "../../configs/systems/nucleo-f103rb-bme280.yaml"
limits:
  max_steps: 400000
assertions:
  - uart_contains: "NUCLEO_F103RB_BME280_OK ID=0x60 I2C1=PB8/PB9"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 32
  - expected_stop_reason: max_steps
