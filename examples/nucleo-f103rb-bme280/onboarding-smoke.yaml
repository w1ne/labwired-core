# Read the BME280 chip ID over I2C1, then exercise the Nucleo LD2 output.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-nucleo-f103rb-bme280-smoke"
  system: "../../configs/systems/nucleo-f103rb-bme280.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "NUCLEO_F103RB_BME280_ID=0x60"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 4
  - expected_stop_reason: max_steps
