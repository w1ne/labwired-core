# Generic level-1 NMOS body-effect pair on STM32WBA52 PA2/PA3 GPIO inputs.
# The unrelated NTC divider and Shockley diode stay on PA0/PA1.
name: nucleo-wba52cg-mosfet-body-effect
chip: ../../configs/chips/stm32wba52.yaml
external_devices: []
board_io: []
cosim_models:
  - id: mosfet_body_effect
    adapter: analog
    step_ns: 1000
    inputs:
      gate_v: ui.mosfet_body.gate_v
      bulk_v: ui.mosfet_body.bulk_v
    outputs:
      reference_drain: board.gpio_in.pa2
      body_effect_drain: board.gpio_in.pa3
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Vgate gate 0 dc 1.5
        Vbulk bulk 0 dc 0
        Rload_ref supply drain_ref 100k
        Mref drain_ref gate 0 0 NMOS W=100u L=10u
        Rload_body supply drain_body 100k
        Mbody drain_body gate 0 bulk NMOS W=100u L=10u
        .model NMOS NMOS(VTO=1 KP=20u GAMMA=0.4 PHI=0.7 LAMBDA=0.02)
      probes:
        reference_drain: v(drain_ref)
        body_effect_drain: v(drain_body)
      sources:
        gate_v: Vgate
        bulk_v: Vbulk
      vdd: 3.3
