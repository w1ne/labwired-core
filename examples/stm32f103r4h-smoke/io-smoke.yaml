# STM32F103R4H boots the low-density smoke image: the reset vector runs,
# USART2 prints "OK", and PA5 toggles. The NUCLEO-F103RB image does NOT
# boot here (initial SP 0x2000_5000 is past this part's SRAM; HardFault on
# the first push), so this smoke is the per-variant boot proof.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-stm32f103-lowdensity-smoke"
  system: "./system.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "OK"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 4
  - expected_stop_reason: max_steps
