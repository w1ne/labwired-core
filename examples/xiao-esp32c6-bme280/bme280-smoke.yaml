# Read BME280 identity/temperature over XIAO D4/D5 and capture the GPIO15 LED.
schema_version: "1.2"
inputs:
  firmware: "./firmware/.pio/build/xiao_c6/firmware.elf"
  system: "../../configs/systems/xiao-esp32c6-bme280.yaml"
limits:
  max_steps: 50000000
assertions:
  - uart_contains: "XIAO_ESP32C6_BME280_OK ID=0x60 TEMP_RAW=0x082DC0 I2C0=D4(GPIO22)/D5(GPIO23) LED=GPIO15"
  - gpio_edges:
      pin: "gpio:15"
      min_edges: 4
  - expected_stop_reason: max_steps
