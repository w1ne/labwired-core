# Generic Beta NTC divider (GPIO4 = ADC1_CH3) and Shockley diode load line
# (GPIO5 = ADC1_CH4) for every ESP32-S3 board.
#
# esp32s3.yaml publishes the ADC1 inputs in an `analog_pins:` table, so neither
# netlist names the board, the ADC or a channel: each solves its own circuit
# and publishes a probe voltage to `board.analog.<pad>_volts`. GPIO4/GPIO5 are
# not strapping pins (GPIO0, GPIO3, GPIO45 and GPIO46 are) and are A3/A4 on the
# XIAO ESP32S3 header. Every profile that loads the same ESP32-S3 descriptor
# can run this deck unchanged.
name: "esp32s3-analog-ntc-diode"
chip: "../../configs/chips/esp32s3.yaml"
cpu_hz: 240000000
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.gpio4_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.gpio5_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
