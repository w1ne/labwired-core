# ESP32-S3-DevKitC-1 v1.1 board smoke.
# Boots the committed ESP32-S3 Tier-1 firmware on this board profile and checks
# its UART0 console transcript. The board's RGB LED is intentionally excluded
# from this profile; this smoke does not claim that it lights.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/tier1/esp32s3.elf"
  system: "../../configs/systems/esp32s3-devkitc-1-v11.yaml"
limits:
  max_steps: 8000000
assertions:
  - uart_contains: "TIER1 clock PASS"
  - uart_contains: "TIER1 gpio PASS"
  - uart_contains: "TIER1 timer PASS"
  - uart_contains: "TIER1 irq PASS"
  - uart_contains: "TIER1 dma PASS"
  - uart_contains: "TIER1 mcpwm PASS"
  - uart_contains: "TIER1 rmt PASS"
  - uart_contains: "TIER1 i2c PASS"
  - uart_contains: "TIER1 done"
