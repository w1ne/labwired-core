# STM32F103R8T6: toggle an external active-low LED on PC13.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-stm32f103r8-gpio-smoke"
  system: "../../configs/systems/stm32f103r8t6-gpio-smoke.yaml"
limits:
  max_steps: 200000
assertions:
  - gpio_edges:
      pin: "gpioc:13"
      min_edges: 4
  - expected_stop_reason: max_steps
