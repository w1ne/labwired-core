# Generic Beta NTC divider and Shockley diode for the EK-RX261. The NTC
# divider is on P40/AN000 and the diode on P41/AN001 (R01UH1045EJ0100
# Table 1.5); the S12AD converts both against VREFH0 = 3.3 V. The firmware
# (examples/ek-rx261/firmware/adc-ntc-diode.c) prints both codes on SCI6.
name: "ek-rx261-analog-inputs"
chip: "../../configs/chips/r5f52618bgfp.yaml"
external_devices: []
debug_uart: "sci6"
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.P40_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.P41_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
