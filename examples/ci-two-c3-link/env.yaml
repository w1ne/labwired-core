schema_version: "1.0"
name: "ci-two-c3-link"
nodes:
  - id: server
    system: "../../configs/systems/esp32c3-devkit.yaml"
    firmware: "firmware/server.elf"
  - id: client
    system: "../../configs/systems/esp32c3-devkit.yaml"
    firmware: "firmware/client.elf"
interconnects:
  # uart0 is each chip's USB console; uart1 is the wire between them — the same
  # instance Arduino's `Serial1` opens, and what a diagram's TX/RX wires resolve
  # to on a GPIO-matrix chip where the pin cannot name a peripheral.
  - type: "uart_cross_link"
    nodes: ["server", "client"]
    config:
      node_a_uart: "uart1"
      node_b_uart: "uart1"
