# Generic Beta NTC divider (PA0 = ADC1_IN5) and Shockley diode load line
# (PA1 = ADC1_IN6).
#
# The STM32WB55 descriptor publishes its ADC inputs in `analog_pins:`.
# Neither netlist names the board, the ADC or a channel: each solves its own
# circuit and publishes a probe voltage to `board.analog.<pad>_volts`, and the
# router resolves the pad from the chip descriptor. The circuits are the same
# as examples/nucleo-l476rg/analog-ntc-diode-pa0-pa1-system.yaml.
name: "mb1355c-analog"
chip: "../../configs/chips/stm32wb55.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.pa0_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
