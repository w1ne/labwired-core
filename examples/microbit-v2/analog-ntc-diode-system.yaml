# Generic Beta NTC and Shockley diode netlists drive separate micro:bit v2
# edge-connector inputs through the nRF52833 descriptor's SAADC routes.
#
# Neither netlist names the board, the SAADC, or a channel: each one only
# solves its own circuit and publishes a probe voltage to
# `board.analog.<pad>_volts`. The descriptor's `analog_pins:` maps P0.02 ->
# saadc/AIN0 and P0.03 -> saadc/AIN1, so the same two decks that run on the
# STM32 profiles run here unchanged.
name: "microbit-v2-analog"
chip: "../../configs/chips/nrf52833.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.analog.p0.02_volts"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rntc vcc sense 10k beta=3950 tnom=25 temp=25
        Rpull sense 0 10k
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.analog.p0.03_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF
        .model DREF D(IS=2.52n N=1.752 RS=0.568)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
