# ESP32-C3-DevKit-RUST-2: send a red frame to the built-in WS2812B on GPIO2.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-esp32c3-rust2-smoke"
  system: "../../configs/systems/esp32c3-devkit-rust-2.yaml"
limits:
  max_steps: 200000
assertions:
  - gpio_edges:
      pin: "gpio:2"
      min_edges: 48
  - display_region:
      id: "rgb_led"
      min_ink: 1.0
      colour: "0xF800"
      min_colour_pixels: 1
  - expected_stop_reason: max_steps
