; Ryan's bay-occupancy firmware — Adafruit ESP32 Feather V2 (PID 5400).
; Same environment as ryanlab so the twin sees the same variant, pin map and
; core version the real board runs.
[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
build_type = debug
build_flags = -g
lib_deps =
    adafruit/Adafruit_VCNL4010@^1.1.2
    adafruit/Adafruit ILI9341@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

; Bare ESP32 DevKit (4MB, no mux, no sensors, no panel). This is the
; missing-hardware oracle for tests 9 and 11 — every bay must report FAULT,
; and it must report it on real silicon, not only in the twin.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_type = debug
build_flags = -g
lib_deps =
    adafruit/Adafruit_VCNL4010@^1.1.2
    adafruit/Adafruit ILI9341@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

; Same Feather V2 target, minus Espressif's PSRAM cache-bug codegen workaround.
; Purely a bisect env: if loop() runs here and not in the stock Feather build,
; the twin mishandles the code -mfix-esp32-psram-cache-issue generates.
[env:feather_nopsramfix]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
build_type = debug
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw
build_flags = -g
lib_deps =
    adafruit/Adafruit_VCNL4010@^1.1.2
    adafruit/Adafruit ILI9341@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
