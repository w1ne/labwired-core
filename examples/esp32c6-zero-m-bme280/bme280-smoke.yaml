# Waveshare ESP32-C6-Zero-M + BME280: verify I2C0 register reads.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-esp32c6-devkitc-bme280-smoke"
  system: "../../configs/systems/esp32c6-zero-m-bme280.yaml"
limits:
  max_steps: 1500000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "BME280_TEMP_RAW=0x082DC0"
  - expected_stop_reason: max_steps
