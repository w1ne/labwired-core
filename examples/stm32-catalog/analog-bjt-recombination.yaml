# Generic Gummel–Poon NPN branches routed through PA1/PA2/PA3 ADC1.
# The reference is matched against separate base-emitter (ISE/NE) and
# base-collector (ISC/NC) recombination branches.
name: "stm32-catalog-analog-bjt-recombination"
chip: "../../configs/chips/stm32f103rb.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_without_recombination"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt.base_v"
    outputs:
      collector_voltage: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_with_recombination"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt.base_v"
    outputs:
      collector_voltage: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_RECOMBINATION
        .model NPN_RECOMBINATION NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 ISE=2p NE=1.5)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_with_base_collector_recombination"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt.base_v"
    outputs:
      collector_voltage: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_BASE_COLLECTOR_RECOMBINATION
        .model NPN_BASE_COLLECTOR_RECOMBINATION NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 ISC=500p NC=2)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
