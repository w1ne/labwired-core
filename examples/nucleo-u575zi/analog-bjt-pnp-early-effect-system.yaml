# Matched generic Gummel–Poon PNP branches route finite forward Early effect
# and its control through PA2/PA3 to U575 ADC1 channels 7/8.
name: nucleo-u575zi-analog-bjt-pnp-early-effect
chip: ../../configs/chips/stm32u575.yaml
external_devices: []
board_io: []
cosim_models:
  - id: pnp_early_effect_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_voltage: ui.bjt_pnp_early_effect.base_v
    outputs:
      collector_voltage: board.analog.pa2_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload collector 0 1k
        Vbase drive 0 dc 3.3
        Rbase drive base 10k
        Q1 collector base supply PNP_EARLY
        .model PNP_EARLY PNP(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_voltage: Vbase
      vdd: 3.3
  - id: pnp_no_forward_early_control_adc
    adapter: analog
    step_ns: 1000
    inputs:
      base_voltage: ui.bjt_pnp_early_effect.base_v
    outputs:
      collector_voltage: board.analog.pa3_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload collector 0 1k
        Vbase drive 0 dc 3.3
        Rbase drive base 10k
        Q1 collector base supply PNP_CONTROL
        .model PNP_CONTROL PNP(IS=1e-16 BF=80 BR=4 VAR=75)
      probes:
        collector_voltage: v(collector)
      sources:
        base_voltage: Vbase
      vdd: 3.3
