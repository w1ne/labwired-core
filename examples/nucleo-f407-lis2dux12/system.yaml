# NUCLEO-F407 + ST LIS2DUX12 over I2C1, using the sensor's SA0-low address.
name: "nucleo-f407-lis2dux12"
chip: "../../configs/chips/stm32f407.yaml"
external_devices:
  - id: "lis2dux12"
    type: "lis2dux12"
    connection: "i2c1"
    config:
      i2c_address: 0x18
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
