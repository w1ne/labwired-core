# LabWired - Waveshare RP2350-Zero UART + onboard WS2812 smoke
# Firmware: bare-metal RP2350 UART0 and GP16 WS2812 waveform.
# The twin console is UART0; USB CDC is outside this board profile.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-rp2350-zero-ws2812-smoke"
  system: "./system.yaml"
limits:
  max_steps: 300000
  stop_when_assertions_pass: true
assertions:
  - uart_contains: "RP2350_SMOKE_OK"
  - gpio_edges:
      pin: "sio:16"
      min_edges: 48
  - display_region:
      id: "rgb_led"
      min_ink: 1.0
      colour: "0xF800"
      min_colour_pixels: 1
