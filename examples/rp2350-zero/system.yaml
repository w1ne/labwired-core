# LabWired - Waveshare RP2350-Zero example
#
# Waveshare RP2350-Zero: its WS2812 DIN is GP16. The NeoPixel component
# decodes the actual SIO waveform. Twin UART is UART0, not USB-C CDC.
name: "rp2350-zero-example"
chip: "../../configs/chips/rp2350-zero-smoke.yaml"
cpu_hz: 150_000_000
external_devices:
  - id: "rgb_led"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO16"
      num_pixels: 1
      cpu_hz: 150_000_000
