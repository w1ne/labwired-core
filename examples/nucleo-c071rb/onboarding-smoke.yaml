# NUCLEO-C071RB: boot Cortex-M0+ firmware and toggle the on-board LD1 on PA5.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-nucleo-c071rb-smoke"
  system: "../../configs/systems/nucleo-c071rb.yaml"
limits:
  max_steps: 5000
assertions:
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 16
  - expected_stop_reason: max_steps
