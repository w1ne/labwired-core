schema_version: "1.2"
inputs:
  firmware: "ch32fun/usart_rx_irq.elf"
  system: "./usart-rx-irq-system.yaml"
limits:
  max_steps: 200000
  wall_time_ms: 120000
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 500
uart_injections:
  - uart: "usart1"
    bytes: "wch!"
assertions:
  - uart_contains: "USART1_IRQ_RX=wch!"
