# Local fixture spi_dma_tx.c on ch32fun startup (build-ch32fun-examples.sh).
# SPI2 TX requests pace DMA1 channel 5 through 8 half-word frames per lap,
# circular. Each lap gives HT then TC on PFIC interrupt 31; the handler
# disables the channel after lap 3, so CNTR holds the reloaded 8.
# CTLR2.TXDMAEN is set before CFGR.EN: the request pending at enable time
# must be served, not lost.
schema_version: "1.2"
inputs:
  firmware: "ch32fun/spi_dma_tx.elf"
  system: "./system.yaml"
limits:
  max_steps: 2000000
  wall_time_ms: 120000
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 500
assertions:
  - uart_contains: "SPI2_DMA events=HTHTHT laps=3 cntr=8"
