# Local fixture adc_irq.c on ch32fun startup (build-ch32fun-examples.sh).
# ADC1 converts IN0 (PA0, 1650 mV) and IN17 (VREFINT, 1.2 V) and returns
# each code through ADC_IRQn 34; ADC2 converts IN1 (PA1, 825 mV) polled.
# 12-bit codes against 3.3 V: 2047, 1489, 1023; two interrupts.
schema_version: "1.2"
inputs:
  firmware: "ch32fun/adc_irq.elf"
  system: "./adc-system.yaml"
limits:
  max_steps: 4000000
  wall_time_ms: 120000
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 500
assertions:
  - uart_contains: "ADC1_IN0=2047 VREF=1489 ADC2_IN1=1023 irqs=2"
