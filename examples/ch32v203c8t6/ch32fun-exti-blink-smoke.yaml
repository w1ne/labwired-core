# ch32fun examples_v20x/exti_blink, unmodified (build-ch32fun-examples.sh).
# AFIO_EXTICR1 selects PA for EXTI line 1, rising edge only; the EXTI1
# handler (PFIC interrupt 23) toggles PA10 and clears INTFR. main() spins,
# so every PA10 edge after the boot-time set-high comes from the handler.
#
# Press, release, press: two rising edges give two toggles (high -> low ->
# high); the release gives none. So PA10 has 3 edges: the set-high
# at boot and one per press.
schema_version: "1.2"
inputs:
  firmware: "ch32fun/exti_blink.elf"
  system: "./exti-system.yaml"
limits:
  max_cycles: 8000000
  max_steps: 8000000
  wall_time_ms: 120000
stimuli:
  - target: { component: button_pa1, channel: pressed }
    trigger: !after_cycles { cycles: 2000000 }
    value: 1.0
  - target: { component: button_pa1, channel: pressed }
    trigger: !after_cycles { cycles: 4000000 }
    value: 0.0
  - target: { component: button_pa1, channel: pressed }
    trigger: !after_cycles { cycles: 6000000 }
    value: 1.0
assertions:
  - gpio_edges: { pin: "gpioa:10", min_edges: 3 }
  # PA10 ends high: boot high, first press low, second press high.
  - memory_value: { address: 0x4001080C, size: 32, mask: 0x400, expected_value: 0x400 }
  # EXTICR1 line 1 -> PA (0); INTENR and RTENR line 1; FTENR clear; INTFR acked.
  - memory_value: { address: 0x40010008, size: 32, expected_value: 0x0 }
  - memory_value: { address: 0x40010400, size: 32, expected_value: 0x2 }
  - memory_value: { address: 0x40010408, size: 32, expected_value: 0x2 }
  - memory_value: { address: 0x4001040C, size: 32, expected_value: 0x0 }
  - memory_value: { address: 0x40010414, size: 32, expected_value: 0x0 }
  # The PFIC is core-decoded (not a bus window), so memory_value cannot read
  # its ISR/IPR/IACTR words; the PA10 toggles are the handler evidence.
