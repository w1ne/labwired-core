# NUCLEO-U3C5ZI-Q: boot Cortex-M33 firmware and toggle onboard LD1 on PA5.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv8m.main-none-eabi/release/firmware-nucleo-u3c5zi-q-smoke"
  system: "../../configs/systems/nucleo-u3c5zi-q-smoke.yaml"
limits:
  max_steps: 5000
assertions:
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 16
  - expected_stop_reason: max_steps
