# LabWired - BRD2709A (xG26-EK2709A) Example System Configuration
name: "brd2709a-example"
chip: "../../configs/chips/efr32mg26.yaml"
external_devices: []
board_io:
  # LED0 = PC08, LED1 = PC09; active-high (UG594).
  - id: "led0_pc08"
    kind: "led"
    peripheral: "gpioc"
    pin: 8
    signal: "output"
    active_high: true
  - id: "led1_pc09"
    kind: "led"
    peripheral: "gpioc"
    pin: 9
    signal: "output"
    active_high: true
  # BTN0 = PB00, BTN1 = PB01; active-low.
  - id: "btn0_pb00"
    kind: "button"
    peripheral: "gpiob"
    pin: 0
    signal: "input"
    active_high: false
  - id: "btn1_pb01"
    kind: "button"
    peripheral: "gpiob"
    pin: 1
    signal: "input"
    active_high: false
