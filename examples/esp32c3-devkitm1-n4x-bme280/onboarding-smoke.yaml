# ESP32-C3-DevKitM-1-N4X + BME280: read the sensor ID and temperature ADC.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-esp32c3-bme280-smoke"
  system: "../../configs/systems/esp32c3-devkitm1-n4x-bme280.yaml"
limits:
  max_steps: 1000000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "BME280_TEMP_RAW=0x082DC0"
  - expected_stop_reason: max_steps
