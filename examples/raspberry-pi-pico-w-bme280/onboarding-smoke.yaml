# Pico W BME280: read the sensor ID and raw temperature registers over I2C0.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-pico-w-bme280-smoke"
  system: "../../configs/systems/raspberry-pi-pico-w-bme280.yaml"
limits:
  max_steps: 300000
assertions:
  - uart_contains: "BME280_ID=0x60"
  - uart_contains: "BME280_TEMP_RAW=0x082DC0"
  - uart_contains: "PICO_W_BME280_SMOKE_OK"
  - expected_stop_reason: max_steps
