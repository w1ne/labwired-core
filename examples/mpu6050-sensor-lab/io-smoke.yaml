# LabWired - MPU6050 IMU Lab smoke test
#
# Asserts VALUES, not labels. The old `WHO_AM_I=0x` check passed while the
# firmware printed `WHO_AM_I=0xD1 ERR`.
#   * WHO_AM_I (register 0x75) reads 0x68 (MPU-6000/6050 Register Map
#     RM-MPU-6000A-00 Rev 4.2, §4.32). The firmware appends " OK" only on 0x68.
#   * At rest and the reset full scale (AFS_SEL=0, +/-2 g) the Z axis reads
#     +1 g = 16384 LSB (Product Spec PS-MPU-6000A-00 Rev 3.4, §6.1 table,
#     "Sensitivity Scale Factor" 16384 LSB/g).
#   * X/Y are signed 16-bit words; gyro uses 131 LSB/(deg/s) at FS_SEL=0.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/mpu6050-sensor-lab"
  system: "./system.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "MPU6050 IMU Lab"
  - uart_contains: "WHO_AM_I=0x68 OK\n"
  - uart_regex: "AX=-?[0-9]+ AY=-?[0-9]+ AZ=16384 GX=-?[0-9]+ GY=-?[0-9]+ GZ=-?[0-9]+\n"
  - expected_stop_reason: max_steps
