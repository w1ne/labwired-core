# STM32F3DISCOVERY: repeated LD3 GPIOE/PE9 transitions.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-stm32f3-discovery-smoke"
  system: "../../configs/systems/stm32f3-discovery.yaml"
limits:
  max_steps: 2200
assertions:
  - gpio_edges:
      pin: "gpioe:9"
      min_edges: 8
  - expected_stop_reason: max_steps
