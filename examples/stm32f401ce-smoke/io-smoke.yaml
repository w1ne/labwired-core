# STM32F401CE boots the family smoke image (firmware-f401-demo) on its own
# exact descriptor. Assertions are the family smoke's, unchanged.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-f401-demo"
  system: "./system.yaml"
limits:
  max_steps: 64
assertions:
  - uart_contains: "OK"
  - expected_stop_reason: max_steps
