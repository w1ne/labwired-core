# Three boards, three wires. An STM32F103, an STM32F401 and an ATmega328P on
# gpio_net interconnects: the F1 and F4 count edges from another chip with
# their EXTI (port picked by AFIO_EXTICR on the F1, SYSCFG_EXTICR on the F4),
# and two of the wires have no pull of their own: a chip's internal pull-up is
# what holds them high.
# Firmware: src/f103.c, src/f401.c, src/avr.c (rebuild with ./build.sh).
schema_version: "1.0"
name: gpio-net-f1-f4
nodes:
  - id: f1
    system: "../../configs/systems/stm32f103-bare.yaml"
    firmware: "firmware/f103.elf"
  - id: f4
    system: "../../configs/systems/nucleo-f401re.yaml"
    firmware: "firmware/f401.elf"
  - id: avr
    system: "../../configs/systems/arduino-uno.yaml"
    firmware: "firmware/avr.elf"
interconnects:
  - type: gpio_net
    nodes: [avr, f1, f4]
    config:
      name: irq
      pull: down
      members:
        - { node: avr, peripheral: portd, pin: 2 }   # push-pull out
        - { node: f1, peripheral: gpiob, pin: 0 }    # EXTI0, AFIO port B
        - { node: f4, peripheral: gpioc, pin: 1 }    # EXTI1, SYSCFG port C
  - type: gpio_net
    nodes: [avr, f4]
    config:
      # No pull on the board: the F401's internal pull-up holds it high.
      name: alert
      members:
        - { node: avr, peripheral: portd, pin: 4 }   # DDR drives low
        - { node: f4, peripheral: gpioa, pin: 8 }    # input, internal pull-up
  - type: gpio_net
    nodes: [avr, f1]
    config:
      # No pull on the board: the AVR's internal pull-up holds it high.
      name: wake
      members:
        - { node: f1, peripheral: gpioa, pin: 0 }    # open-drain
        - { node: avr, peripheral: portd, pin: 5 }   # input, internal pull-up
