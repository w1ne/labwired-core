# Generic Beta NTC and Shockley diode netlists for the FRDM-KW41Z GPIO route.
# Both devices use PB2 in separate simulations; the chip's GPIO thresholds are
# simulation assumptions and do not claim silicon electrical limits.
# Routing the same netlists to board.analog.<pad>_volts (PTB1, PTB2, PTB3,
# PTB18, PTA19) converts them on ADC0 instead
# (crates/core/tests/cosim_frdm_kw41z_adc16_analog.rs).
name: "frdm-kw41z-analog-gpio"
chip: "../../configs/chips/mkw41z4.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "ntc_divider"
    adapter: "analog"
    step_ns: 1000
    inputs:
      temperature: "ui.ntc.temperature_c"
    outputs:
      v_sense: "board.gpio_in.pb2"
    config:
      netlist_text: |
        Vcc vcc 0 dc 3.3
        Rpull vcc sense 10k
        Rntc sense 0 10k beta=3950 tnom=25 temp=25
      probes:
        v_sense: "v(sense)"
      sources:
        temperature: "Rntc"
      vdd: 3.3
  - id: "diode_load_line"
    adapter: "analog"
    step_ns: 1000
    outputs:
      v_diode: "board.gpio_in.pb2"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        v_diode: "v(sense)"
      vdd: 3.3
