# The G491RE's modeled I2C1 controller reads the external BME280 over PB8/PB9.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-g491re-bme280-smoke"
  system: "./system.yaml"
limits:
  max_steps: 400000
assertions:
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "addr 0x77 W ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0xd0 ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "addr 0x77 R ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0x60 ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0xfa ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0xfb ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0xfc ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0x82 ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0xdc ack" }
  - peripheral_log: { peripheral: i2c1, log: bus_trace, contains: "data 0x00 ack" }
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 8
  - gpio_edges:
      pin: "gpiob:8"
      min_edges: 8
  - gpio_edges:
      pin: "gpiob:9"
      min_edges: 2
  - expected_stop_reason: max_steps
