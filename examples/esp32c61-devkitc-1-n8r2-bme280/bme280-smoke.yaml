# Read the BME280 ID and raw temperature over the C61 I2C0 GPIO6/GPIO22 route.
schema_version: "1.0"
inputs:
  firmware: "build/firmware.elf"
  system: "../../configs/systems/esp32c61-devkitc-1-n8r2-bme280.yaml"
limits:
  max_steps: 5000000
assertions:
  - uart_contains: "C61_BME280_OK ID=0x60 TEMP_RAW=0x082DC0 I2C0=GPIO6/22"
  - uart_contains: "C61_RGB_OK"
  - gpio_edges:
      pin: "gpio:8"
      min_edges: 16
  - expected_stop_reason: max_steps
