# ESP32-DevKitC-32E: read the BME280 ID and raw temperature ADC over I2C1.
schema_version: "1.2"
inputs:
  firmware: "firmware/.pio/build/devkitc32e_i2c1_bme280/firmware.elf"
  system: "../../configs/systems/esp32-devkitc-32e-i2c1-bme280.yaml"
limits:
  max_steps: 8000000
  stop_when_assertions_pass: true
  stop_when_assertions_pass_min_steps: 1500000
  stop_when_assertions_pass_settle_steps: 1000
assertions:
  - uart_contains: "BME280_I2C1_ID=0x60"
  - uart_contains: "BME280_I2C1_TEMP_RAW=0x082DC0"
