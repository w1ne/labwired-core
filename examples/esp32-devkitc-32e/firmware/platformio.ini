[platformio]
default_envs = devkitc32e

[env:devkitc32e]
platform = espressif32
board = esp32dev
framework = arduino
build_type = debug
build_flags = -g
build_src_filter = +<main.cpp>
; The smoke does not use PSRAM. The classic ESP32 CPU model does not execute
; this workaround's generated instruction sequence.
build_unflags = -mfix-esp32-psram-cache-issue -mfix-esp32-psram-cache-strategy=memw

[env:devkitc32e_bme280]
extends = env:devkitc32e
build_src_filter = +<bme280_smoke.cpp>

[env:devkitc32e_i2c1_bme280]
extends = env:devkitc32e
build_src_filter = +<bme280_i2c1_smoke.cpp>

[env:devkitc32e_rmt]
extends = env:devkitc32e
build_src_filter = +<rmt_smoke.cpp>

[env:devkitc32e_adc]
extends = env:devkitc32e
build_src_filter = +<adc_smoke.cpp>

[env:devkitc32e_dac]
extends = env:devkitc32e
build_src_filter = +<dac_smoke.cpp>

[env:devkitc32e_ledc]
extends = env:devkitc32e
build_src_filter = +<ledc_servo_smoke.cpp>

[env:devkitc32e_uart1]
extends = env:devkitc32e
build_src_filter = +<uart1_smoke.cpp>

[env:devkitc32e_spi_oled]
extends = env:devkitc32e
build_src_filter = +<spi_oled_smoke.cpp>

[env:devkitc32e_microsd]
extends = env:devkitc32e
build_src_filter = +<microsd_smoke.cpp>

[env:devkitc32e_pcnt]
extends = env:devkitc32e
build_src_filter = +<pcnt_smoke.cpp>

[env:devkitc32e_mcpwm]
extends = env:devkitc32e
build_src_filter = +<mcpwm_smoke.cpp>
