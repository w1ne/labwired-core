# GPIO board smoke for the active ST NUCLEO-G491RE.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-g491re-smoke"
  system: "../../configs/systems/nucleo-g491re.yaml"
limits:
  max_steps: 200000
assertions:
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 8
  - expected_stop_reason: max_steps
