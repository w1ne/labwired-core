# Standalone mirror of configs/systems/nucleo-g491re.yaml; I2C1 is used by the
# separately scoped BME280 add-on profile.
name: "nucleo-g491re"
chip: "../../configs/chips/stm32g491re.yaml"
cpu_hz: 170_000_000
external_devices: []
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
