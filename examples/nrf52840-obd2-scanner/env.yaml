schema_version: "1.0"
name: "nrf52840-obd2-scanner"
nodes:
  - id: scanner
    system: "examples/nrf52840-obd2-scanner/scanner/system.yaml"
    firmware: "target/thumbv7em-none-eabi/release/firmware-nrf52840-obd2-scanner"
  - id: ecu
    system: "examples/nrf52840-obd2-scanner/ecu/system.yaml"
    firmware: "examples/nrf52840-obd2-scanner/ecu/firmware/build/obd2_ecu.elf"
interconnects:
  - type: can_bus
    nodes: [scanner, ecu]
    config:
      endpoints:
        scanner: mcp2515
        ecu: bxcan1
