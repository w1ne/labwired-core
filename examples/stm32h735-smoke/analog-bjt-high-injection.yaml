# Generic Gummel–Poon NPN with Early effect, explicit high-injection
# exponent, and base-emitter recombination; the unrelated diode proves
# independent device/netlist routing on the same board.
name: stm32h735-smoke-analog-bjt-high-injection
chip: ../../configs/chips/stm32h735.yaml
external_devices: []
board_io: []
cosim_models:
  - id: bjt_high_injection
    adapter: analog
    step_ns: 1000
    inputs:
      base_drive: ui.bjt.base_v
    outputs:
      collector_voltage: board.analog.pa0_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-16 BF=80 BR=4 NF=1 NR=1 VAF=50 VAR=75 IKF=50u IKR=500u NKF=0.8 ISE=2p NE=1.5)
      probes:
        collector_voltage: v(collector)
      sources:
        base_drive: Vbase
      vdd: 3.3
  - id: unrelated_diode
    adapter: analog
    step_ns: 1000
    outputs:
      diode_voltage: board.analog.pa1_volts
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rlim supply sense 1k
        D1 sense 0 DREF TEMP=25
        .model DREF D(IS=2.52n N=1.752 RS=0.568 TNOM=25 EG=1.11 XTI=3)
      probes:
        diode_voltage: v(sense)
      vdd: 3.3
