# LabWired - LiteX PicoRV32 IO smoke
#
# Build: cargo build -p firmware-litex-picorv32-smoke --release --target riscv32imc-unknown-none-elf
#
# The firmware boots from the SoC's SRAM and prints over the LiteX UART. It
# proves the RV32IMC core with a real multiply (`mul=0000002a` = 7 * 6), reads
# back the declared-stub timer window (`timer=00000000`), and its heartbeat's
# `txfull=` field is read back from the UART CSR.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-litex-picorv32-smoke"
  system: "./system.yaml"
limits:
  max_steps: 4000000
assertions:
  - uart_contains: "PICORV32 LITEX SMOKE"
  - uart_ordered:
      - "cpu=rv32imc uart=litex"
      - "mul=0000002a"
      - "timer=00000000"
      - "hb=0 txfull=00000000"
      - "hb=1 txfull=00000000"
      - "hb=2 txfull=00000000"
  - expected_stop_reason: max_steps
