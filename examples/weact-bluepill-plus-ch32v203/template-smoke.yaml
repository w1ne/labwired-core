# WeAct BluePill Plus (CH32V203C8T6) running a clean-room rewrite of WeAct's
# CH32V203 01-template (weact_template.c): banner on USART1, PB2 LED blink
# every 250 ms, and a KEY (PA0) press that changes the blink to every 100 ms.
#
# Clock: 8 MHz HSI, so 250 ms = 2,000,000 cycles and 100 ms = 800,000.
# The key is held from 7.0 M to 7.8 M cycles (100 ms). The firmware waits
# for the release in 50 ms steps, then swaps toggle_tick to 100.
# check-blink-rate.py measures the PB2 edge spacing on both sides of the
# press from logic_edges.json.
schema_version: "1.2"
inputs:
  firmware: "../../tests/fixtures/weact-bluepill-plus-ch32v203-template.elf"
  system: "../../configs/systems/weact-bluepill-plus-ch32v203.yaml"
limits:
  max_cycles: 14000000
  max_steps: 14000000
  wall_time_ms: 240000
stimuli:
  - target: { component: key_pa0, channel: pressed }
    trigger: !after_cycles { cycles: 7000000 }
    value: 1.0
  - target: { component: key_pa0, channel: pressed }
    trigger: !after_cycles { cycles: 7800000 }
    value: 0.0
assertions:
  - uart_ordered:
      - "WeAct Studio Core Board"
      - "SystemClk:8000000"
      - "Template"
  # 3 edges at 250 ms before the press, 7 or more at 100 ms after it.
  - gpio_edges: { pin: "gpiob:2", min_edges: 10 }
  # PA0 is an input with pull-down (CNF = 10, MODE = 00); PB2 is a
  # push-pull output (MODE = 11).
  - memory_value: { address: 0x40010800, size: 32, mask: 0xF, expected_value: 0x8 }
  - memory_value: { address: 0x40010C00, size: 32, mask: 0xF00, expected_value: 0x300 }
