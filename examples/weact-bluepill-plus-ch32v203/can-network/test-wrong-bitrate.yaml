# CLI: labwired test --script examples/weact-bluepill-plus-ch32v203/can-network/test-wrong-bitrate.yaml --output-dir out
# Negative control for test.yaml: the bus at 25 kbit/s (env-wrong-bitrate.yaml)
# while both CH32V203 nodes run 12.5 kbit/s. Same ELFs, same 200 ms.
schema_version: "1.0"
inputs:
  env: "env-wrong-bitrate.yaml"
limits:
  max_steps: 2000
  wall_time_ms: 120000
assertions:
  # Transmitter TSTATR: RQCP0 | TERR0, no TXOK0. NART is set, so the
  # controller does not retry. ESR: TEC 8, LEC 4 (bit recessive error).
  - memory_value: { node: tx, address: 0x40006408, mask: 0x0F, expected_value: 0x09 }
  - memory_value: { node: tx, address: 0x40006418, expected_value: 0x00080040 }
  # The example still prints success. `while (!MessageSent(mb) && timeout--)`
  # leaves timeout at 0xFFFFFFFF when it runs out, so its `timeout == 0`
  # branch ("timed out") cannot run. This is ch32fun's code, not the model.
  - peripheral_log: { node: tx, peripheral: debug_printf, log: terminal, contains: "Message sent successfully on mailbox 0" }
  # Receiver: FIFO0 empty (RFIFO0.FMP0 = 0), so no "FIFO:" line. ESR REC 1,
  # LEC 1 (stuff error).
  - memory_value: { node: rx, address: 0x4000640C, mask: 0x03, expected_value: 0 }
  - memory_value: { node: rx, address: 0x40006418, expected_value: 0x01000010 }
  - peripheral_log: { node: rx, peripheral: debug_printf, log: terminal, contains: "Exiting CAN Init mode...Done" }
