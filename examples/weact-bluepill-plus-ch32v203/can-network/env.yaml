# ch32fun's examples_v20x/canbus_network on two CH32V203C8T6 boards, as its
# README describes: node `rx` runs the example as committed (TRANSMIT 0) and
# node `tx` the same source with TRANSMIT 1. One timed CAN bus.
#
# The bus runs at 12.5 kbit/s, not the 25 kbit/s the example's BAUD_25kbps
# names. That table assumes PCLK1 = 144 MHz, which is what ch32fun's
# SystemInit gives the example's own target, the CH32V208 (CH32V20x_D8:
# PPRE1 /1). On the CH32V203 it sets PPRE1 /2, so PCLK1 = 72 MHz and
# BTIMR (BRP 479, TS1 6 tq, TS2 5 tq) is 72e6 / (480 x 12) = 12 500 bit/s.
# The example prints the rate it computes: "CAN Baud Rate: 12500bps".
schema_version: "1.0"
name: ch32v203-canbus-network
nodes:
  - id: tx
    system: "system.yaml"
    firmware: "../ch32fun/canbus_network_tx.elf"
  - id: rx
    system: "system.yaml"
    firmware: "../ch32fun/canbus_network.elf"
interconnects:
  - type: can_bus
    nodes: [tx, rx]
    config:
      peripheral: bxcan1
      bitrate: 12500
