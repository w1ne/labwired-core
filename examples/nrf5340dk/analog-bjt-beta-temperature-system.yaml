# Generic Gummel-Poon forward/reverse beta temperature coefficients route
# through SAADC beside unrelated NTC and diode netlists.
name: "nrf5340dk-analog-bjt-beta-temperature"
chip: "../../configs/chips/nrf5340.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_beta_temperature_forward_full"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_beta_temperature.forward_base_v"
    outputs:
      collector_voltage: "adc.saadc.2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 10k
        Vbase drive 0 dc 0
        Rbase drive base 1Meg
        Q1 collector base 0 NPN_BETA_FORWARD_FULL temp=125
        .model NPN_BETA_FORWARD_FULL NPN(IS=1e-16 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0 TBF1=2m TBF2=15u)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_beta_temperature_forward_explicit"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_beta_temperature.forward_base_v"
    outputs:
      collector_voltage: "adc.saadc.3_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 10k
        Vbase drive 0 dc 0
        Rbase drive base 1Meg
        Q1 collector base 0 NPN_BETA_FORWARD_HOT temp=125
        .model NPN_BETA_FORWARD_HOT NPN(IS=1e-16 BF=108 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_beta_temperature_forward_first_order"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_beta_temperature.forward_base_v"
    outputs:
      collector_voltage: "adc.saadc.4_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 10k
        Vbase drive 0 dc 0
        Rbase drive base 1Meg
        Q1 collector base 0 NPN_BETA_FORWARD_FIRST temp=125
        .model NPN_BETA_FORWARD_FIRST NPN(IS=1e-16 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0 TBF1=2m)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_beta_temperature_reverse_full"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_beta_temperature.reverse_base_v"
    outputs:
      emitter_voltage: "adc.saadc.5_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply emitter 1k
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 0 base emitter NPN_BETA_REVERSE_FULL temp=125
        .model NPN_BETA_REVERSE_FULL NPN(IS=1e-16 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0 TBR1=3m TBR2=30u)
      probes:
        emitter_voltage: "v(emitter)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_beta_temperature_reverse_explicit"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_beta_temperature.reverse_base_v"
    outputs:
      emitter_voltage: "adc.saadc.6_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply emitter 1k
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 0 base emitter NPN_BETA_REVERSE_HOT temp=125
        .model NPN_BETA_REVERSE_HOT NPN(IS=1e-16 BF=80 BR=6.4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0)
      probes:
        emitter_voltage: "v(emitter)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_beta_temperature_reverse_first_order"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_beta_temperature.reverse_base_v"
    outputs:
      emitter_voltage: "adc.saadc.7_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply emitter 1k
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 0 base emitter NPN_BETA_REVERSE_FIRST temp=125
        .model NPN_BETA_REVERSE_FIRST NPN(IS=1e-16 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0 TBR1=3m)
      probes:
        emitter_voltage: "v(emitter)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
