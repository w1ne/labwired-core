        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 collector base 0 NPN_IKF_FIRST temp=125
        .model NPN_IKF_FIRST NPN(IS=1e-16 BF=80 BR=4 VAF=0 VAR=0 IKF=50u IKR=500u TLEV=3 TNOM=25 TIS1=0 TIS2=0 TIKF1=-1m)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_knee_temperature_reverse_full"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_knee_temperature.reverse_base_v"
    outputs:
      emitter_voltage: "adc.saadc.5_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply emitter 1k
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 0 base emitter NPN_IKR_FULL temp=125
        .model NPN_IKR_FULL NPN(IS=1e-16 BF=80 BR=4 VAF=0 VAR=0 IKF=500u IKR=500u TLEV=3 TNOM=25 TIS1=0 TIS2=0 TIKR1=1m TIKR2=50u)
      probes:
        emitter_voltage: "v(emitter)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_knee_temperature_reverse_explicit"
    adapter: "analog"
    step_ns: 1000
    inputs:
