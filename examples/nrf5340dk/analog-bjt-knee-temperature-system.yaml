        Rbase drive base 2k
        Q1 0 base emitter NPN_IKR_HOT temp=125
        .model NPN_IKR_HOT NPN(IS=1e-16 BF=80 BR=4 VAF=0 VAR=0 IKF=500u IKR=800u TLEV=3 TNOM=25 TIS1=0 TIS2=0)
      probes:
        emitter_voltage: "v(emitter)"
      sources:
