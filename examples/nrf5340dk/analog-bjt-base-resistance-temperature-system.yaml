        .model NPN_RB_EXPLICIT NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 TLEV=3 TNOM=25 TIS1=0 TIS2=0 RB=10k RBM=1.2k IRB=26u)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
