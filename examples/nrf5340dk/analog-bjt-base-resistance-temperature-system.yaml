        Rbase drive base 2k
        Q1 collector base 0 NPN_TIRB_TEMP temp=125
        .model NPN_TIRB_TEMP NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 TLEV=3 TNOM=25 TIS1=0 TIS2=0 RB=10k RBM=1k IRB=20u TIRB1=1m TIRB2=20u)
      probes:
        collector_voltage: "v(collector)"
