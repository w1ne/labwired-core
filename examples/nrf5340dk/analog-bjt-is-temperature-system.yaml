# Generic Gummel-Poon transport-IS temperature coefficients route through SAADC
# beside unrelated NTC and diode netlists.
name: "nrf5340dk-analog-bjt-is-temperature"
chip: "../../configs/chips/nrf5340.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_is_temperature_full"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_is_temperature.base_v"
    outputs:
      collector_voltage: "adc.saadc.2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1meg
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 collector base 0 NPN_TIS_FULL temp=125
        .model NPN_TIS_FULL NPN(IS=1e-14 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=-1m TIS2=6u)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_is_temperature_explicit_hot"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_is_temperature.base_v"
    outputs:
      collector_voltage: "adc.saadc.3_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1meg
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 collector base 0 NPN_TIS_HOT temp=125
        .model NPN_TIS_HOT NPN(IS=3.630780547701014e-14 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_is_temperature_first_order"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_is_temperature.base_v"
    outputs:
      collector_voltage: "adc.saadc.4_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1meg
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 collector base 0 NPN_TIS_FIRST temp=125
        .model NPN_TIS_FIRST NPN(IS=1e-14 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=-1m TIS2=0)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_is_temperature_no_coefficients"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_is_temperature.base_v"
    outputs:
      collector_voltage: "adc.saadc.5_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1meg
        Vbase drive 0 dc 0
        Rbase drive base 2k
        Q1 collector base 0 NPN_TIS_CONTROL temp=125
        .model NPN_TIS_CONTROL NPN(IS=1e-14 BF=80 BR=4 VAF=0 VAR=0 TLEV=3 TNOM=25 TIS1=0 TIS2=0)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
