# Toggle the integrated active-high status LED on GPIO35 of Heltec WiFi LoRa 32 V4.
schema_version: "1.0"
inputs:
  firmware: "../../target/xtensa-esp32s3-none-elf/release/firmware-heltec-wifi-lora-32-v4-s3r2-gpio-smoke"
  system: "../../configs/systems/heltec-wifi-lora-32-v4-s3r2.yaml"
limits:
  max_steps: 5000
assertions:
  - gpio_edges:
      pin: "gpio:35"
      min_edges: 8
  - expected_stop_reason: max_steps
