# Set GPIO4 high using the ESP32-C61 HP GPIO output-enable/latch registers.
schema_version: "1.0"
inputs:
  firmware: "build/firmware.elf"
  system: "../../configs/systems/esp32c61-devkitc-1-n8r2.yaml"
limits:
  max_steps: 400000
assertions:
  - memory_value:
      address: 0x60091004
      expected_value: 0x00000010
      mask: 0x00000010
      size: 4
  - memory_value:
      address: 0x60091034
      expected_value: 0x00000010
      mask: 0x00000010
      size: 4
  - expected_stop_reason: max_steps
