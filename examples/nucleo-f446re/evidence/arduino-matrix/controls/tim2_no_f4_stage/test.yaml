schema_version: '1.0'
inputs:
  firmware: (matrix build of L6_pwm)/firmware.elf
  system: examples/nucleo-f446re/evidence/arduino-matrix/controls/tim2_no_f4_stage/system.yaml
limits:
  max_steps: 20000000
  max_uart_bytes: 65536
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
  stop_when_assertions_pass_min_steps: 0
assertions:
- uart_contains: LW_L6_OK
