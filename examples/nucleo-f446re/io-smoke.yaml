# NUCLEO-F446RE: USART2 output and repeated LD2 GPIOA5 transitions.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-f446re-smoke"
  system: "../../configs/systems/nucleo-f446re.yaml"
limits:
  max_steps: 10000
assertions:
  - uart_contains: "NUCLEO_F446RE_OK"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 8
  - expected_stop_reason: max_steps
