# NUCLEO-F446RE: USART2 VCP output and the onboard LD2 (PA5).
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nucleo-f446re-smoke"
  system: "../../configs/systems/nucleo-f446re.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "F446RE_USART2_OK"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 8
  - expected_stop_reason: max_steps
