# NUCLEO-U031R8: boot STM32U031R8 and toggle LD4 on PA5.
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-nucleo-u031r8-smoke"
  system: "../../configs/systems/nucleo-u031r8.yaml"
limits:
  max_steps: 10000
assertions:
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 16
  - expected_stop_reason: max_steps
