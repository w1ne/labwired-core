# LabWired - CC2538DK: AES-CCM on the AES/SHA-256 cryptoprocessor
#
# Firmware: tests/fixtures/cc2538dk-contiki-crypto-ccm.elf, UNMODIFIED Contiki-NG
# v4.9 examples/platform-specific/cc2538-common/crypto/ccm-test.c (crates/firmware-cc2538dk-contiki/build.sh).
# Every one of its 22 test vectors must print each driver call's success and
# every "... OK" check, in order; a wrong output, tag or digest prints "wrong"
# or "authentication failed" instead and breaks the sequence.
#
# Superset of Renode's tests/platforms/CC2538/cc2538_cryptoprocessor.robot
# "Should Handle CCM Mode" (same firmware source, same milestones, plus the
# key-store load and get_result lines).
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/cc2538dk-contiki-crypto-ccm.elf"
  system: "./system.yaml"
limits:
  max_steps: 30000000
assertions:
  - uart_ordered:
      - "aes_load_keys(): success"
      - "Test vector #0: encrypt"
      - "ccm_auth_encrypt_start(): success"
      - "ccm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "MIC OK"
      - "Test vector #1: encrypt"
