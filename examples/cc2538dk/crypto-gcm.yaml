# LabWired - CC2538DK: AES-GCM on the AES/SHA-256 cryptoprocessor
#
# Firmware: tests/fixtures/cc2538dk-contiki-crypto-gcm.elf, UNMODIFIED Contiki-NG
# v4.9 examples/platform-specific/cc2538-common/crypto/gcm-test.c (crates/firmware-cc2538dk-contiki/build.sh).
# Every one of its 16 test vectors must print each driver call's success and
# every "... OK" check, in order; a wrong output, tag or digest prints "wrong"
# or "authentication failed" instead and breaks the sequence.
#
# Not in Renode's cc2538_cryptoprocessor.robot (which covers CBC, CBC-MAC,
# CTR and CCM); the same Contiki-NG suite's other test.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/cc2538dk-contiki-crypto-gcm.elf"
  system: "./system.yaml"
limits:
  max_steps: 30000000
assertions:
  - uart_ordered:
      - "aes_load_keys(): success"
      - "Test vector #0: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #1: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #2: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #3: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #4: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "Test vector #5: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "Test vector #6: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "Test vector #7: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "aes_load_keys(): success"
      - "Test vector #8: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #9: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #10: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "Test vector #11: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "aes_load_keys(): success"
      - "Test vector #12: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #13: encrypt"
      - "gcm_auth_encrypt_start(): success"
      - "gcm_auth_encrypt_get_result(): success"
      - "Encrypted message OK"
      - "Tag OK"
      - "Test vector #14: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "Test vector #15: decrypt"
      - "gcm_auth_decrypt_start(): success"
      - "gcm_auth_decrypt_get_result(): success"
      - "Decrypted message OK"
      - "Done!"
  - expected_stop_reason: max_steps
