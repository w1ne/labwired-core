# STM32F103C6 customer minimum-system example: USART2 on PA2/PA3 and an
# off-board LED + current-limiting resistor on PA5. GPIO logic is modeled;
# electrical current and LED brightness are not.
name: "stm32f103c6-smoke"
chip: "../../configs/chips/stm32f103c6.yaml"
external_devices: []
board_io:
  - id: "led_pa5"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
