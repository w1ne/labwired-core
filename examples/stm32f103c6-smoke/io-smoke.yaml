# STM32F103C6 boots the low-density smoke image, reports its marker over
# USART2 and toggles PA5. DBGMCU_IDCODE is debug-only on this part (ES0348).
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-stm32f103-lowdensity-smoke"
  system: "./system.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "F103_LOW_DENSITY_SMOKE_OK"
  - uart_contains: "OK"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 4
  - expected_stop_reason: max_steps
