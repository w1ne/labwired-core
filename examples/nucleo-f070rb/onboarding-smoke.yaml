# NUCLEO-F070RB: toggle the board's active-high LD2 on PA5.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv6m-none-eabi/release/firmware-nucleo-f070rb-smoke"
  system: "../../configs/systems/nucleo-f070rb.yaml"
limits:
  max_steps: 20000
assertions:
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 8
  - expected_stop_reason: max_steps
