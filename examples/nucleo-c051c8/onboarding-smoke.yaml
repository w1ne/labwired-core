# NUCLEO-C051C8: boot STM32C051C8 and toggle active-high LD4 on PA5.
schema_version: "1.0"
inputs:
  firmware: ../../target/thumbv6m-none-eabi/release/firmware-nucleo-c051c8-smoke
  system: ../../configs/systems/nucleo-c051c8.yaml
limits:
  max_steps: 5000
assertions:
  - gpio_edges:
      pin: gpioa:5
      min_edges: 16
  - expected_stop_reason: max_steps
