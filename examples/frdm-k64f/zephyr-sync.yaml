# LabWired - FRDM-K64F stock Zephyr synchronization sample
#
# Unmodified upstream Zephyr v3.7.0 `samples/synchronization` for board
# `frdm_k64f`. Rebuild: crates/firmware-frdm-k64f-zephyr/build.sh
#
# Two threads hand a semaphore back and forth. Each one prints, busy-waits
# 100 ms (k_busy_wait, 12 M cycles at the 120 MHz Zephyr clock), then
# k_msleep(500) on the SysTick system timer. thread_b's line therefore proves
# the SysTick timeout wake, the semaphore give/take and the PendSV context
# switch; the second thread_a line proves a full a -> b -> a round.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/mk64f12-zephyr-sync.elf"
  system: "./system.yaml"
limits:
  max_steps: 30000000
assertions:
  - uart_ordered:
      - "*** Booting Zephyr OS build v3.7.0 ***"
      - "thread_a: Hello World from cpu 0 on frdm_k64f!"
      - "thread_b: Hello World from cpu 0 on frdm_k64f!"
      - "thread_a: Hello World from cpu 0 on frdm_k64f!"
  - expected_stop_reason: max_steps
