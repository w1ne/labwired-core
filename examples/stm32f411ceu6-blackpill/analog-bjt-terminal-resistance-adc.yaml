# Generic Gummel-Poon RB/RC/RE branches route through STM32F411 ADC1.
# The final branch uses ordinary external resistors as an equivalent-circuit
# reference for the BJT model-card terminal resistances.
name: "stm32f411ceu6-blackpill-bjt-terminal-resistance"
chip: "../../configs/chips/stm32f411ceu6.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_no_terminal_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_base_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 RB=1k)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_collector_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa5_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 RC=150)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_emitter_resistance"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pa6_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 RE=100)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_all_terminal_resistances"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pb0_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 RB=1k RC=150 RE=100)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_explicit_terminal_resistors"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_terminal.base_v"
    outputs:
      collector_voltage: "board.analog.pb1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rdrive drive base 10k
        Rbase base intrinsic_base 1k
        Rcollector collector intrinsic_collector 150
        Remitter 0 intrinsic_emitter 100
        Q1 intrinsic_collector intrinsic_base intrinsic_emitter NPN_TEST
        .model NPN_TEST NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
