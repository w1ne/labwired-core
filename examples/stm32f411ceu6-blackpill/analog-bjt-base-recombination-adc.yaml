# Matched generic Gummel–Poon NPN branches route base-emitter recombination
# through STM32F411 ADC1. Only the ISE/NE model-card terms differ.
name: "stm32f411ceu6-blackpill-analog-bjt-recombination"
chip: "../../configs/chips/stm32f411ceu6.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_without_recombination"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_recombination.base_v"
    outputs:
      collector_voltage: "board.analog.pb0_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_REFERENCE
        .model NPN_REFERENCE NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_with_recombination"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_recombination.base_v"
    outputs:
      collector_voltage: "board.analog.pb1_volts"
    config:
      netlist_text: |
        Vcc supply 0 dc 3.3
        Rload supply collector 1k
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_RECOMBINATION
        .model NPN_RECOMBINATION NPN(IS=1e-16 BF=80 BR=4 VAF=50 VAR=75 ISE=2p NE=1.5)
      probes:
        collector_voltage: "v(collector)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
