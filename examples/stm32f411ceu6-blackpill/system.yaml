# LabWired - STM32F411CEU6 Black Pill Example System Configuration
#
# Referenced by io-smoke.yaml, which runs the committed tier-1 fixture ELF and
# asserts its TIER1 self-test transcript over USART2.
#
# Board IO sourced from WeAct's MiniSTM32F4x1 product literature and the
# V3.0 schematic. The user LED is PC13 and active-low. The PA0 key is omitted
# until its pressed logic is tested for this board revision.
name: "stm32f411ceu6-blackpill-example"
chip: "../../configs/chips/stm32f411ceu6.yaml"
external_devices: []
board_io:
  - id: "led_pc13"
    kind: "led"
    peripheral: "gpioc"
    pin: 13
    signal: "output"
    active_high: false
