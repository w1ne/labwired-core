# A classic ESP32 VSPI master (register level, src/esp32x_spi_master.S built
# with PADS_HI) and an STM32G071 SPI1 slave, mode 0, on bank-1 pads: SCK out
# on GPIO33, MOSI out on GPIO32, MISO in on the input-only GPIO34, CS0 on
# GPIO5, all through the classic GPIO matrix.
schema_version: "1.0"
name: gpio-net-spi-esp32-hi
nodes:
  - id: esp
    system: "../../configs/systems/esp32-wroom-32.yaml"
    firmware: "firmware/esp32-spi-hi-master.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/spi-slave.elf"
interconnects:
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: cs
      pull: up
      members:
        - { node: esp, peripheral: gpio, pin: 5 }   # VSPICS0
        - { node: b, peripheral: gpioa, pin: 4 }    # SPI1_NSS
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: sck
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 33 }   # VSPICLK
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: miso
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 34 }   # VSPIQ (input-only pad)
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 32 }   # VSPID
        - { node: b, peripheral: gpioa, pin: 7 }
