# Two STM32F401s, SPI1 to SPI1, 16-bit frames, with the hardware slave
# select wired: node `a` is the master with CR2.SSOE=1 (its SPI drives PA4 =
# SPI1_NSS low from SPE=1 until SPE=0), node `b` the slave with SSM=0 (it is
# selected by the level on its own PA4 = SPI1_NSS). Every SPI wire is a
# gpio_net.
schema_version: "1.0"
name: gpio-net-spi16-nss
nodes:
  - id: a
    system: "system-f401.yaml"
    firmware: "firmware/f4-spi16-master-nss.elf"
  - id: b
    system: "system-f401.yaml"
    firmware: "firmware/f4-spi16-slave-nss.elf"
interconnects:
  - type: gpio_net
    nodes: [a, b]
    config:
      name: nss
      pull: up
      members:
        - { node: a, peripheral: gpioa, pin: 4 }   # SPI1_NSS out (SSOE)
        - { node: b, peripheral: gpioa, pin: 4 }   # SPI1_NSS in
  - type: gpio_net
    nodes: [a, b]
    config:
      name: sck
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 5 }
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: miso
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 6 }
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 7 }
        - { node: b, peripheral: gpioa, pin: 7 }
