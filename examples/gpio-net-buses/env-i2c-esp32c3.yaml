# An ESP32-C3 I2C0 controller (register level, src/esp32c_i2c_controller.c)
# and an STM32G071 I2C1 target at 0x42 (the env-i2c.yaml target). SCL and SDA
# are open-drain gpio_nets with the bus pull-up on the net; the C3 routes
# both lines out and back in through its GPIO matrix.
schema_version: "1.0"
name: gpio-net-i2c-esp32c3
nodes:
  - id: esp
    system: "../../configs/systems/esp32c3-devkit.yaml"
    firmware: "firmware/esp32c3-i2c-controller.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/i2c-target.elf"
interconnects:
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: scl
      pull: up
      members:
        - { node: esp, peripheral: gpio, pin: 9 }   # I2CEXT0_SCL
        - { node: b, peripheral: gpiob, pin: 6 }
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: sda
      pull: up
      members:
        - { node: esp, peripheral: gpio, pin: 8 }   # I2CEXT0_SDA
        - { node: b, peripheral: gpiob, pin: 7 }
