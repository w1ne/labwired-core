# Two STM32F401s, SPI1 to SPI1, 16-bit frames (CR1.DFF). Node `a` is the
# master, node `b` the slave in software select (SSM=1, SSI=0): the model
# does not route the F401's hardware NSS pad, so there is no chip-select
# wire and the slave frames by bit count from enable. Every SPI wire is a
# gpio_net.
schema_version: "1.0"
name: gpio-net-spi16
nodes:
  - id: a
    system: "system-f401.yaml"
    firmware: "firmware/f4-spi16-master.elf"
  - id: b
    system: "system-f401.yaml"
    firmware: "firmware/f4-spi16-slave.elf"
interconnects:
  - type: gpio_net
    nodes: [a, b]
    config:
      name: sck
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 5 }
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: miso
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 6 }
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 7 }
        - { node: b, peripheral: gpioa, pin: 7 }
