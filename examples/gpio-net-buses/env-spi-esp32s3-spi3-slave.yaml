# An STM32G071 SPI1 master (mode 0, CS on a GPIO) and an ESP32-S3 GP-SPI3
# slave (register level, src/esp32x_spi_slave.S built with INST1 and PADS_HI)
# answering from its W buffer, on bank-1 pads GPIO34..37 through the S3 GPIO
# matrix.
schema_version: "1.0"
name: gpio-net-spi-esp32s3-spi3-slave
nodes:
  - id: esp
    system: "../../configs/systems/esp32s3.yaml"
    firmware: "firmware/esp32s3-spi3-slave.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/spi-master.elf"
interconnects:
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: cs
      pull: up
      members:
        - { node: esp, peripheral: gpio, pin: 34 }   # SPI3_CS0
        - { node: b, peripheral: gpioa, pin: 4 }    # GPIO chip select
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: sck
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 36 }   # SPI3_CLK
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: miso
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 37 }   # SPI3_Q (slave output)
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 35 }   # SPI3_D
        - { node: b, peripheral: gpioa, pin: 7 }
