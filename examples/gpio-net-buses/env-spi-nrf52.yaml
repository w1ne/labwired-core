# An nRF52840 SPIM0 master and an STM32G071 SPI1 slave, mode 0. The nRF
# drives its chip select from a GPIO (P0.02), which the G071 takes as its
# hardware NSS. EasyDMA moves the four bytes each way.
schema_version: "1.0"
name: gpio-net-spi-nrf52
nodes:
  - id: nrf
    system: "system-nrf52840.yaml"
    firmware: "firmware/nrf-spim-master.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/spi-slave.elf"
interconnects:
  - type: gpio_net
    nodes: [nrf, b]
    config:
      name: cs
      pull: up
      members:
        - { node: nrf, peripheral: gpio0, pin: 2 }   # GPIO out
        - { node: b, peripheral: gpioa, pin: 4 }     # SPI1_NSS
  - type: gpio_net
    nodes: [nrf, b]
    config:
      name: sck
      pull: down
      members:
        - { node: nrf, peripheral: gpio0, pin: 3 }   # PSEL.SCK
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [nrf, b]
    config:
      name: miso
      pull: down
      members:
        - { node: nrf, peripheral: gpio0, pin: 5 }   # PSEL.MISO
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [nrf, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: nrf, peripheral: gpio0, pin: 4 }   # PSEL.MOSI
        - { node: b, peripheral: gpioa, pin: 7 }
