# Two STM32G071s, I2C1 to I2C1, pin to pin: SCL and SDA are open-drain
# gpio_nets with the bus pull-up on the net. Node `a` is the controller,
# node `b` the target at address 0x42.
schema_version: "1.0"
name: gpio-net-i2c
nodes:
  - id: a
    system: "system.yaml"
    firmware: "firmware/i2c-controller.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/i2c-target.elf"
interconnects:
  - type: gpio_net
    nodes: [a, b]
    config:
      name: scl
      pull: up
      members:
        - { node: a, peripheral: gpiob, pin: 6 }
        - { node: b, peripheral: gpiob, pin: 6 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: sda
      pull: up
      members:
        - { node: a, peripheral: gpiob, pin: 7 }
        - { node: b, peripheral: gpiob, pin: 7 }
