# An STM32G071 I2C1 controller (the `env-i2c.yaml` controller firmware) and
# an nRF52840 TWIS0 target at 0x42.
schema_version: "1.0"
name: gpio-net-i2c-nrf52-target
nodes:
  - id: a
    system: "system.yaml"
    firmware: "firmware/i2c-controller.elf"
  - id: nrf
    system: "system-nrf52840.yaml"
    firmware: "firmware/nrf-twis-target.elf"
interconnects:
  - type: gpio_net
    nodes: [a, nrf]
    config:
      name: scl
      pull: up
      members:
        - { node: a, peripheral: gpiob, pin: 6 }
        - { node: nrf, peripheral: gpio0, pin: 27 }  # PSEL.SCL
  - type: gpio_net
    nodes: [a, nrf]
    config:
      name: sda
      pull: up
      members:
        - { node: a, peripheral: gpiob, pin: 7 }
        - { node: nrf, peripheral: gpio0, pin: 26 }  # PSEL.SDA
