# An STM32F401 SPI1 master moving both directions through DMA2 stream FIFOs
# (half-word INCR4 bursts, src/f4_spi_dma_master.c, which first runs two
# memory-to-memory streams at different priorities) against the STM32G071
# DMA slave (src/spi_dma_slave.c). Every SPI wire is a gpio_net, so the bytes
# cross bit by bit at the pads.
schema_version: "1.0"
name: gpio-net-spi-f4-dma
nodes:
  - id: a
    system: "system-f401.yaml"
    firmware: "firmware/f4-spi-dma-master.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/spi-dma-slave.elf"
interconnects:
  - type: gpio_net
    nodes: [a, b]
    config:
      name: cs
      pull: up
      members:
        - { node: a, peripheral: gpioa, pin: 4 }   # GPIO out
        - { node: b, peripheral: gpioa, pin: 4 }   # SPI1_NSS
  - type: gpio_net
    nodes: [a, b]
    config:
      name: sck
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 5 }
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: miso
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 6 }
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 7 }
        - { node: b, peripheral: gpioa, pin: 7 }
