# Two STM32G071s, SPI1 to SPI1, pin to pin, both moving their data by DMA
# (DMAMUX -> DMA1, src/spi_dma_*.c). Node `a` is the master (CS on a GPIO),
# node `b` the slave (hardware NSS). Every SPI wire is a gpio_net, so the
# bytes cross bit by bit at the pads.
schema_version: "1.0"
name: gpio-net-spi-dma
nodes:
  - id: a
    system: "system.yaml"
    firmware: "firmware/spi-dma-master.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/spi-dma-slave.elf"
interconnects:
  - type: gpio_net
    nodes: [a, b]
    config:
      name: cs
      pull: up
      members:
        - { node: a, peripheral: gpioa, pin: 4 }   # GPIO out
        - { node: b, peripheral: gpioa, pin: 4 }   # SPI1_NSS
  - type: gpio_net
    nodes: [a, b]
    config:
      name: sck
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 5 }
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: miso
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 6 }
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [a, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: a, peripheral: gpioa, pin: 7 }
        - { node: b, peripheral: gpioa, pin: 7 }
