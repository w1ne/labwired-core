# An STM32G071 SPI1 master (mode 0, CS on a GPIO) and a classic ESP32 HSPI (SPI2)
# slave (register level, src/esp32x_spi_slave.S) answering from its W
# buffer. SCK, MOSI and CS0 reach it through its GPIO matrix inputs.
schema_version: "1.0"
name: gpio-net-spi-esp32-slave
nodes:
  - id: esp
    system: "../../configs/systems/esp32-wroom-32.yaml"
    firmware: "firmware/esp32-spi-slave.elf"
  - id: b
    system: "system.yaml"
    firmware: "firmware/spi-master.elf"
interconnects:
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: cs
      pull: up
      members:
        - { node: esp, peripheral: gpio, pin: 5 }   # HSPICS0
        - { node: b, peripheral: gpioa, pin: 4 }    # GPIO chip select
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: sck
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 18 }   # HSPICLK
        - { node: b, peripheral: gpioa, pin: 5 }
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: miso
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 19 }   # HSPIQ (slave output)
        - { node: b, peripheral: gpioa, pin: 6 }
  - type: gpio_net
    nodes: [esp, b]
    config:
      name: mosi
      pull: down
      members:
        - { node: esp, peripheral: gpio, pin: 23 }   # HSPID
        - { node: b, peripheral: gpioa, pin: 7 }
