# STM32F103C8T6 Blue Pill: USART1 banner and active-low PC13 LED edges.
schema_version: "1.2"
inputs:
  firmware: "../../target/thumbv7m-none-eabi/release/firmware-stm32f103-bluepill-smoke"
  system: "../../configs/systems/stm32f103-blue-pill.yaml"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "BLUEPILL_F103C8_OK"
  - gpio_edges:
      pin: "gpioc:13"
      min_edges: 4
  - expected_stop_reason: max_steps
