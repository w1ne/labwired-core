# LabWired — Arduino Nano (ATmega328P) smoke test
#
# The AVR core does not go through `labwired run`, which only drives the ARM,
# RISC-V and Xtensa paths; an AVR part runs through its board manifest, which
# is what this script does.
#
# The sketch prints "nano-ok" once from setup() and then toggles PB5 forever.
# The serial assertion proves the Arduino core reached setup() and drove
# USART0 at the configured baud; the stop-reason assertion proves the model
# then executes the whole step budget — 2 million AVR instructions of real
# Arduino-core firmware — with no fault, no halt and no unmapped access.
# The PB5 toggle itself is proven in crates/core/tests/avr_nano_live_run.rs.
schema_version: "1.0"
inputs:
  firmware: "../../tests/fixtures/avr/arduino-nano-blinky.elf"
  system: "../../configs/systems/arduino-nano.yaml"
limits:
  max_steps: 2000000
assertions:
  - uart_contains: "nano-ok"
  - expected_stop_reason: max_steps
