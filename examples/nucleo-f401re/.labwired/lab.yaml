# LabWired - NUCLEO-F401RE IO/UART smoke test
schema_version: "1.0"
inputs:
  firmware: "../../../target/thumbv7em-none-eabi/release/firmware-nucleo-f401re-smoke"
  system: "../system.yaml"
limits:
  max_steps: 10000
assertions:
  - uart_contains: "NUCLEO_F401RE_OK"
  - gpio_edges:
      pin: "gpioa:5"
      min_edges: 8
  - expected_stop_reason: max_steps
