# LabWired - NUCLEO-F401RE Example System Configuration
name: "nucleo-f401re-example"
chip: "../../configs/chips/stm32f401.yaml"
# ST-LINK VCP = USART2 PA2/PA3 (UM1724 §6.8); the console taps it only.
debug_uart: "uart2"
external_devices: []
board_io:
  - id: "led2_pa5"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_user_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    # UM1724: B1 is active-low (same as L476 Nucleo-64). Was incorrectly true.
    active_high: false
