# BJT TTR1/TTR2 reverse transit-time temperature scaling is compared with
# explicit TR values. Reverse-active NPN branches and an unrelated diode
# route through F401 ADC1.
name: "nucleo-f401re-bjt-reverse-transit-temperature"
chip: "../../configs/chips/stm32f401.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_ttr_nominal"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_ttr.base_v"
    outputs:
      base_voltage: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0
        Vemitter emitter 0 dc 2
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base emitter NPN_TEST temp=27
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TNOM=27 TR=1u TTR1=20m TTR2=200u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_ttr_nominal_explicit"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_ttr.base_v"
    outputs:
      base_voltage: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0
        Vemitter emitter 0 dc 2
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base emitter NPN_TEST temp=27
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TNOM=27 TR=1u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_ttr_hot"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_ttr.base_v"
    outputs:
      base_voltage: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0
        Vemitter emitter 0 dc 2
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base emitter NPN_TEST temp=77
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TNOM=27 TR=1u TTR1=20m TTR2=200u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_ttr_hot_explicit"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_ttr.base_v"
    outputs:
      base_voltage: "board.analog.pa4_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0
        Vemitter emitter 0 dc 2
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base emitter NPN_TEST temp=77
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TNOM=27 TR=2.5u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_ttr_hot_control"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_ttr.base_v"
    outputs:
      base_voltage: "board.analog.pa5_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0
        Vemitter emitter 0 dc 2
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base emitter NPN_TEST temp=77
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TNOM=27 TR=1u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
