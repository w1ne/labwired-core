# Matched NPN transit-charge branches route their base voltage through F401 ADC1.
# The deliberately long TF makes XTF/VTF/ITF effects visible at the 1 us step.
name: "nucleo-f401re-bjt-bias-transit-charge"
chip: "../../configs/chips/stm32f401.yaml"
external_devices: []
board_io: []
cosim_models:
  - id: "bjt_tf_reference"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_transit.base_v"
    outputs:
      base_voltage: "board.analog.pa1_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0.1
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TF=1u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_xtf_vtf_itf"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_transit.base_v"
    outputs:
      base_voltage: "board.analog.pa2_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0.1
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TF=1u XTF=4 VTF=0.2 ITF=20u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_xtf_zero_vtf"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_transit.base_v"
    outputs:
      base_voltage: "board.analog.pa3_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0.1
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TF=1u XTF=4 VTF=0 ITF=20u)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
  - id: "bjt_xtf_zero_itf"
    adapter: "analog"
    step_ns: 1000
    inputs:
      base_drive: "ui.bjt_transit.base_v"
    outputs:
      base_voltage: "board.analog.pa4_volts"
    config:
      netlist_text: |
        Vcollector collector 0 dc 0.1
        Vbase drive 0 dc 0
        Rbase drive base 10k
        Q1 collector base 0 NPN_TEST
        .model NPN_TEST NPN(IS=1e-15 BF=100 BR=4 VAF=50 TF=1u XTF=4 VTF=0.2 ITF=0)
      probes:
        base_voltage: "v(base)"
      sources:
        base_drive: "Vbase"
      vdd: 3.3
