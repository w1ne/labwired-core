# Waveshare ESP32-C3-Zero (SKU 25452): drive its onboard WS2812 red on GPIO10.
schema_version: "1.0"
inputs:
  firmware: "../../target/riscv32imc-unknown-none-elf/release/firmware-esp32c3-waveshare-c3-zero-smoke"
  system: "../../configs/systems/waveshare-esp32c3-zero.yaml"
limits:
  max_steps: 200000
assertions:
  - gpio_edges:
      pin: "gpio:10"
      min_edges: 48
  - display_region:
      id: "rgb_led"
      min_ink: 1.0
      colour: "0xF800"
      min_colour_pixels: 1
  - expected_stop_reason: max_steps
