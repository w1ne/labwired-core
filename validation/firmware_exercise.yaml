  - id: mkw41z4
    arch: cortex-m0plus
    headline: "No tier-1 target (absent from TIER1_TARGETS and tier1-matrix.json). Firmware that runs: five PR-gated firmware_survival ELFs — the bare-metal LPUART0 smoke, the genuine NXP MCUXpresso SystemInit + BOARD_BootClockRUN boot (MCG FEE + RSIM RF_OSC_READY + LPUART), unmodified Zephyr v3.7 hello_world, the stock Zephyr fxos8700 sample, and the bare-metal cow-activity tag — plus the tag's nightly CLI cell (examples/kw41z-cow-activity/calm.yaml, core-coverage-matrix-smoke.yml:200-202); strict_onboarding skips this chip (strict_onboarding.rs:99-104). The descriptor's beyond-rubric blocks are all engine-less declarative banks: SIM is driven by the gated vendor boot (SIM.COPC written, CLOCK_SetSimConfig programs SIM.CLKDIV1, BOARD_RfOscInit reads SIM.SDID), SMC only by the uncalled BOARD_BootClockVLPR path, and PMC/RCM/TRNG0 by nothing. The radio wall — BTLE_RF, the nine XCVR_* blocks, GENFSK, ZLL, ANT and CMT — is present in the vendored SVD (tests/fixtures/real_world/mkw41z4.svd) and deliberately not modelled: those windows are unmapped, so radio firmware faults loudly (configs/chips/mkw41z4.yaml:7-14)."
    functional:
      - what: "FXOS8700 accelerometer read over Kinetis I2C1 drives a PCD8544 LCD render (cattle-activity tag): pixel-level cow features are asserted in the calm pose, and a tilt injected on the sensor channels (x=+2.0 g, y=-2.0 g, z=1.0 g) must change >=300 framebuffer pixels"
        fw: kw41z-lcd-activity
        ev: "firmware_survival.rs:2111-2187 (render) and :2195-2285 (tilt reaction); nightly CLI cell examples/kw41z-cow-activity/calm.yaml"
        gate: pr
    advanced_unit_only: []
    advanced_dead: []
    shim:
      - {p: SIM, ev: "configs/chips/mkw41z4.yaml:67-72 (type declarative; configs/peripherals/mkw41z4/sim.yaml)", note: "CLOSABLE: engine-less bank — the gated vendor boot writes SIM.COPC (crates/firmware-kw41z-nxp/vendor/system_MKW41Z4.c:87-88), programs SIM.CLKDIV1 via CLOCK_SetSimConfig (vendor/fsl_clock.c:475-479, called from BOARD_BootClockRUN at vendor/clock_config.c:163), and BOARD_RfOscInit reads SIM.SDID (vendor/clock_config.c:174); the hand-set SDID REVID is what makes that routine skip the rev-1.0 workaround (configs/chips/mkw41z4.yaml:62-66), and no gating or clock-divider behaviour follows the writes."}
      - {p: PMC, ev: "configs/chips/mkw41z4.yaml:91-96 (type declarative; configs/peripherals/mkw41z4/pmc.yaml)", note: "CLOSABLE: zero-behaviour power-mode bank with no engine; no in-tree firmware opens it — the vendor VLPR path that writes SMC is not called by this board's bring-up."}
      - {p: SMC, ev: "configs/chips/mkw41z4.yaml:97-102 (type declarative; configs/peripherals/mkw41z4/smc.yaml)", note: "CLOSABLE: engine-less power-mode controller — BOARD_BootClockVLPR's SMC_SetPowerModeVlpr + PMSTAT poll (vendor/clock_config.c:112-114) is dead code on this board; were it called, the poll would HANG, not pass — PMSTAT is a read-only 0x01 (Run) with no engine behind it to advance it (configs/peripherals/mkw41z4/smc.yaml:75-86), while kSMC_PowerStateVlpr is 0x04 (vendor/fsl_smc.h:63), so SMC_GetPowerModeState (fsl_smc.h:275-277) never equals it and the while loop never exits."}
      - {p: RCM, ev: "configs/chips/mkw41z4.yaml:103-108 (type declarative; configs/peripherals/mkw41z4/rcm.yaml)", note: "CLOSABLE: reset-cause/control bank with no engine; no gated firmware reads it."}
      - {p: TRNG0, ev: "configs/chips/mkw41z4.yaml:203-210 (type declarative; configs/peripherals/mkw41z4/trng0.yaml)", note: "CLOSABLE: register file only — no entropy source or ready-state engine and IRQ 13 is never pended; no firmware or test drives it (the radio crypto path that would is unmodelled)."}

