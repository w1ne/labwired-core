  # ── NXP/Silabs/Renesas/RP2350 batch. None of the five parts is a tier-1
  # ── target (all absent from TIER1_TARGETS and tier1-matrix.json), so each
  # ── entry carries the whole story. `firmware_survival` is PR-gated
  # ── (core-ci.yml:779); the coverage-matrix cells are nightly/push-main and
  # ── the pico2 strict-onboarding smoke runs in the nightly core-full job;
  # ── efr32mg26's deck behaviour gate also runs in the advisory PR workspace
  # ── shards, and its Arduino lane lives in the labwired superproject.
  - id: efr32mg26
    arch: cortex-m33
    headline: "L2 on the conformance board (silicon reset oracle, 243/243 registers — docs/coverage/chip-conformance.md:39) and no tier-1 row, so this entry carries the story. Two firmwares are gated: the bare-metal demo, rebuilt by the nightly coverage-matrix cell examples/brd2709a/uart-smoke.yaml (core-coverage-matrix-smoke.yml:207-213), and the BRD2709A agent deck, named as this chip's behavior_gate in chip_conformance.rs:350 and asserted in process by efr32_deck_behavior::the_deck_firmware_drives_every_part (advisory PR workspace shards; a superset of the nightly CLI cell examples/brd2709a/deck-smoke.yaml, core-coverage-matrix-smoke.yml:221-227 — the CLI cell asserts 100% ink + lit, while the in-process gate adds the uniform top_colour=0x001F check): the committed bare-metal deck drives CMU-gated USART0 as SPI (ST7789 panel — all 170x320 pixels carry the 0x001F the firmware wrote), USART2 as I2S (INMP441 mic — even slots driven, odd tristated), IADC0 (fader code=2048) and five GPIO contacts through the Series-2 port model plus the USART ROUTE registers. That covers the board's spi/i2s/adc/gpio path where no tier-1 fixture exists. What the deck does NOT touch: the analog-bus allocation (the fader converts without allocating — on silicon that bus reads 0), SMU, MSC and the BLE controller — those are the shims and unit-only models below, and no in-tree gated firmware drives MSC or virtual_ble (the XMODEM bootloader is bench-only; firmware-mg26-ble is wired to no lane). I2C/timer are rubric classes, not recorded here."
    functional:
      - what: "BRD2709A agent deck — ST7789 panel over USART0/SPI, INMP441 microphone over USART2/I2S, IADC fader and five GPIO contacts, asserted against the published display artifact (lit, every pixel inked, uniform 0x001F), the I2S slot halves (left=4 right=0), the 12-bit conversion (2048) and each contact's idle polarity"
        fw: firmware-mg26-deck
        ev: "crates/core/tests/efr32_deck_behavior.rs:138-246 (in process) + examples/brd2709a/deck-smoke.yaml (coverage-matrix cell, core-coverage-matrix-smoke.yml:221-227)"
        gate: nightly
    advanced_unit_only:
      - "MSC (14 msc.rs unit tests plus efr32_msc_persistence.rs, which drives WREN/ADDRB/WDATA/BUSY and reads the word back through ordinary memory; the only firmware that drives it, firmware-mg26-bootloader, is bench-only — docs/boards/brd2709a.md:58-63)"
      - "virtual_ble (LabWired's DECLARED controller at 0x4F000000, NOT silicon — the EFR32 radio is a closed RAIL blob with no register documentation; 13 virtual_ble.rs unit tests plus efr32mg26_ble.rs two-machine advertising/scanning through this descriptor; firmware-mg26-ble exists but no lane runs it)"
    advanced_dead: []
    shim:
      - {p: gpio_busalloc, ev: "configs/chips/efr32mg26.yaml:265-269 (type efr32s2_busalloc; crates/core/src/peripherals/efr32/busalloc.rs:46-52)", note: "CLOSABLE: the three analog-bus words store and read back and adc0_owns() decodes them (6 unit tests), but IADC0 is not gated on the model — a firmware that never allocates still converts the pad, which reads 0 on silicon. Neither gated in-tree firmware allocates (the deck's fader converts without one; firmware-mg26-adc also skips it and its examples/brd2709a/adc-smoke.yaml is wired into no workflow); the external silabs-arduino analogRead is the one that writes it. Port path: gate IADC0 on adc0_owns, as RouteGate did for the USART/I2C routing."}
      - {p: smu, ev: "configs/chips/efr32mg26.yaml:529-534 (type efr32s2_smu; crates/core/src/peripherals/efr32/smu.rs:29-49)", note: "CLOSABLE: register file with header reset values and read-only members (4 unit tests, including SystemInit's exact sequence) but NO protection enforced — PPUFS never latches and the non-secure alias move is not modelled. Declared so a Simplicity-SDK SystemInit (CLKEN1_SET + PPUSATD*_CLR, three instructions in) cannot bus-fault; no in-tree gated firmware drives or polls it."}

