  # ── STM32 G0/G4/H7/L0 batch. The G071 is the first G0 port (sim-derived)
  # ── whose tier-1 fixture covers all 12 declared classes; the G474RE's whole
  # ── descriptor is rubric-covered by gated vendor firmware; the H735's
  # ── beyond-rubric estate is mostly CI-invisible; the L073 is the
  # ── silicon-diffed L0 whose demo pins DBGMCU and the CRC engine by value.
  - id: stm32g071
    arch: cortex-m0plus
    headline: "SIM-DERIVED first G0 port: its committed tier-1 fixture drives all 12 declared classes over USART2 (clock/gpio/timer/pwm/dma/irq/i2c/spi/adc/wdt/rtc plus the implicit uart; nightly-ratcheted by the full-CI `tier1_matrix_ratchet` step (core-ci.yml:2087), fixture drift checked on Sundays), and the PR-gated `firmware_survival::test_nucleo_g071rb_smoke_survival` (nightly coverage-matrix cell examples/nucleo-g071rb/uart-smoke.yaml, crate firmware-stm32g0-demo) pins the dedicated `stm32g0` RCC layout. Beyond the rubric nothing runs: PWR/LPTIM1/LPTIM2/DAC1/DBGMCU are family models with no unit test and no firmware (the port's KNOWN_LIMITATIONS.md records LPTIM/CRC/EXTI-SYSCFG as declared-but-untouched), CRC is driven by no firmware and its always-run coverage is the H563 bench oracle (h563_conformance.rs:144) plus the F103 sim-only thumb oracle (stm32f1_exec_oracle.rs:300) and IDR-width masking (crc.rs:204), with no G0-specific test asserting a computed value, and WWDG/SYSCFG are an inert register bank and a stub window."
    functional: []
    advanced_unit_only: [CRC]
    advanced_dead: [PWR, LPTIM1, LPTIM2, DAC1, DBGMCU]
    shim:
      - {p: "WWDG", ev: "configs/chips/stm32g071.yaml:349 (type: wwdg; crates/core/src/peripherals/wwdg.rs:63)", note: "CLOSABLE: inert register bank — tick() is the trait-default no-op, so an armed watchdog never fires; no behavioural test and no gated firmware drives it (unlike the L476, no misc fingerprint reads its CR/CFR/SR)."}
      - {p: "SYSCFG", ev: "configs/chips/stm32g071.yaml:375 (type: syscfg; crates/core/src/peripherals/generic_factory.rs:739)", note: "CLOSABLE: hardcoded StubPeripheral — reads return 0 (plus a canned CCCSR=READY at 0x20 that is an H7-HAL seed, meaningless on G0) and writes are dropped, so EXTI source-select is not modelled; the tier-1 fixture pends its NVIC line via ISPR0 and nothing reads the window back."}

