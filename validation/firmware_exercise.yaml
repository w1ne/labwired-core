  # ── STM32 U5/WB/WBA batch. The U575 has no tier-1 row (absent from
  # ── TIER1_TARGETS and tier1-matrix.json), which is why its entry carries the
  # ── whole story; the WB55 and WBA52 each own one (nightly-ratcheted,
  # ── core-ci.yml:2087). On WB55/WBA52 every beyond-rubric block is
