# LabWired firmware-exercise matrix — the BEYOND-RUBRIC layer.
#
# WHAT THIS FILE IS (AND IS NOT)
#   The RUBRIC peripheral classes (clock/gpio/uart/timer/dma/irq/i2c/spi/adc/pwm/
#   wdt/rtc/can/rmt) are NOT recorded here. Their firmware-exercise status is
#   AUTHORITATIVE from docs/coverage/tier1-matrix.json — the committed, ratchet-
#   gated output of the Tier-1 fixture sims (each chip's fixture is real firmware
#   that drives those classes and self-reports PASS). The matrix generator reads
#   that JSON directly, so the rubric grid cannot drift from reality.
#
#   This file records only what tier1 does NOT cover:
#     functional         — a real driver decoding a sensor/protocol over a bus
#                           and asserting a physical value (the gold standard).
#     advanced_unit_only — chip-specific peripherals exercised by unit tests but
#                           by no running firmware.
#     advanced_dead      — chip-specific peripherals modeled but never exercised.
#     shim               — a block that answers reads/writes without doing the
#                           work: a hardcoded stub, or a declarative register
#                           file with no behavioural engine behind it. A
#                           declarative file consumed by a real engine
#                           (interrupt routing, GPIO, timers) is NOT a shim.
#                           Shims are the most misleading class: several are
#                           structurally irreducible (a closed RF blob ships no
#                           runnable image).
#
#   MODELED means the part supports the block AND the codebase models it —
#   including family models the part carries that no descriptor wires as a
#   standalone instance (the nRF52 TWIS/SPIS/CCM models are the reference
#   case). A block the part does not have is not listed. Evidence for every
#   entry is the model file and/or the chip yaml.
#
# WHY THE SPLIT
#   A first-pass hand-authored matrix under-counted the STM32 family ~4x because
#   it read only the banner-level survival tests and missed the tier1 fixtures.
#   Sourcing the rubric from tier1-matrix.json makes that error impossible; this
#   file holds only the curated, non-rubric judgements.
#
#   scripts/generate_firmware_exercise_matrix.py renders
#   docs/boards/FIRMWARE_EXERCISE_MATRIX.md and CI fails (--check) if stale.
#   EVERY top-level chip in configs/chips/ needs an entry, even when it has no
#   beyond-rubric content: an entry with empty lists and a headline saying so is
#   valid and expected. The generator fails if a chip is unledgered.

chips:
  - id: stm32l476
    arch: cortex-m4f
    headline: "Richest ARM coverage: drives 11 rubric classes via real firmware, plus the gated IO-Link station (real AHT20/BMP280 + shift-register devices over USART3/I2C). Beyond the rubric, PR-gated survival firmware also drives PWR (cubeMX VOS/VOSF handshake), FLASH (ACR 4WS latency dance), DBGMCU (IDCODE=10076415), LPTIM1 (ENABLE-gated ARR/CMP writes, ARROK/CMPOK), SDMMC1 (silicon-diffed CMD/CTIMEOUT handshake) and COMP/TSC (silicon-diffed EN→VALUE and START→EOAF/MCEF). RNG/CRC/FMC/SPI2/SPI3 are unit-tested only — RNG's only coverage is the shared L073 kernel-clock tests over the L073 bus (rcc_kernel_clock_gate.rs:184-254, no L476 test) — and DAC/QUADSPI/SAI1/USB OTG FS are modeled but appear only as reset-value reads in gated transcripts, while LPTIM2/SAI2 are touched by no firmware and no test; SYSCFG and WWDG are inert shims."
    functional:
      - what: "IO-Link master station — AHT20 + BMP280 over I2C, SN74HC165 shift register"
        fw: iolink-station
        ev: "examples/iolink-station ci/test.sh (firmware-gate)"
        gate: pr
    advanced_unit_only: [SPI2, SPI3, CRC, RNG, FMC]
    advanced_dead: [DAC, LPTIM2, QUADSPI, SAI1, SAI2, USB OTG FS]
    shim:
      - {p: "SYSCFG", ev: "configs/chips/stm32l476.yaml:421 (type: stub; configs/peripherals/stm32l476/syscfg.yaml; docs/coverage/silent-path-census.md:403)", note: "CLOSABLE: author-declared stub — read 0, writes dropped, so EXTI source-select (the block's main job) is not modelled and nothing reads the window back: r12 gates its clock because COMP shares the window (crates/firmware-l476-demo/src/r12.rs:130), and the silent-path census records it as the live stub of examples/ci/l476-bldc-stall.yaml."}
      - {p: "WWDG", ev: "crates/core/src/peripherals/wwdg.rs:63 (configs/chips/stm32l476.yaml:396; configs/peripherals/stm32l476/wwdg.yaml)", note: "CLOSABLE: inert register bank — tick() is the trait-default no-op, so an armed watchdog never fires; the PR-gated nucleo_l476rg_misc fingerprint reads CR/CFR/SR off it (crates/core/tests/firmware_survival.rs:623), but that exercises storage only, not watchdog behaviour."}

  - id: esp32c3
    arch: riscv32imc
    headline: "Leo air-quality is the sensor-depth proof: the nightly example e2e asserts it explicitly, and the advisory PR workspace shards also exercise it. clock/dma stay unrecorded by design — esp32c3 wires system/rtc_cntl/dma as declarative register files with no behavioural engine, so a PASS would overclaim. The non-rubric declarative wall (crypto, USB device, I2S, UHCI, radio) is not yet swept into this entry — tracked for a later ledger pass."
    functional:
      - what: "Leo air-quality — real Sensirion SCD41/SGP41/SPS30 + Melexis MLX90614 + Vishay VEML7700 decode CO2 / humidity / surface condensation to plain-language verdicts"
        fw: leo-airquality
        ev: "e2e_leo_airquality.rs:121-143"
        gate: nightly
    advanced_unit_only:
      - ana_i2c
      - sha
      - "virtual_wifi (real shared-802.11 medium model two C3 firmwares associate over, 2 tests)"
      - "wifi_mac (RE'd MAC<->SimNet bridge, RX descriptor ring, 5 tests)"
    advanced_dead: [cache, rng]
    shim: []

  - id: esp32s3
    arch: xtensa-lx7
    headline: "Broad model surface (~35); the rubric grid proves ~9, plus a TMP102 functional read in the nightly fixtures lane. GDMA is a real 65-test mem-to-mem engine (proven via the dma rubric cell), not a stub. `spi_mem_flash`/`extmem` stay unit-only: mask-ROM bring-up reads are not firmware exercise."
    functional:
      - what: "TMP102 temperature read over I2C (real driver, decoded value + GPIO threshold)"
        fw: esp32s3-i2c-tmp102
        ev: "e2e_i2c_tmp102.rs:147-188"
        gate: nightly
    advanced_unit_only: [aes, ds, hmac, rsa, rng, sha, i2s, lcd_cam, sdmmc, usb_otg, gpspi,
                         pcnt, io_mux, extmem, spi_mem_flash, sens, system,
                         core1_control, crosscore_ipi]
    advanced_dead: []
    shim:
      - {p: efuse_stub, ev: "crates/core/src/system/xtensa/esp32s3.rs:647 (esp_xtensa_common/system_stub.rs:454)", note: "CLOSABLE: canned MAC + chip-rev only; no eFuse state, no burn path. The ROM boot and esp-hal accept the canned values."}
      - {p: rtc_cntl_stub, ev: "crates/core/src/system/xtensa/esp32s3.rs:640 (esp_xtensa_common/system_stub.rs:203)", note: "CLOSABLE: register round-trip plus three canned behaviours — PLL_LOCK seeded, TIME_UPDATE snapshot handshake, APP_CPU un-stall. The RTC clock tree, SWD_CONF super-watchdog and sleep domains are not modelled."}
      - {p: wifi_thunks, ev: "esp32s3/wifi_thunks.rs:8 (CHEAT(THUNK-LIB))", note: "IRREDUCIBLE: the ESP32 WiFi MAC/PHY is a closed RF-coprocessor blob with NO executable image — there is no firmware to run, so it can never be firmware-exercised. The lwIP/socket layer above is routed to a real SimNet."}

  - id: esp32
    arch: xtensa-lx6
    headline: "tier1 fixture drives 8 rubric classes incl. a BMP280 chip-id read over the I2C command-list engine and a real LEDC duty-latch."
    functional: []
    advanced_unit_only: [efuse, sha, syscon, twai, mcpwm, rtc_cntl]
    advanced_dead: []
    shim:
      - {p: sdio_stub, ev: "esp32/sdio_stub.rs:5", note: "STRUCTURAL: hardcoded FSM_DONE so the boot ROM's SDIO bring-up poll terminates. Removing it breaks boot; the ROM blob is the only 'firmware' that touches it."}

  - id: nrf52840
    arch: cortex-m4f
    headline: "TWIM/PWM are firmware-proven via the rubric fixture; the PR-gated OBD2 scanner e2e drives the RADIO TXEN/READY/START/END handshake (asserts ble_tx > 0), and the #[ignore]d proximity e2e adds an on-demand radio path. The Zephyr BME280 temperature read runs in an external west build."
    functional:
      - what: "BME280 temperature read (~25 °C) via an unmodified Zephyr sensor driver"
        fw: zephyr-bme280-ztest
        ev: "external west build (not in core cargo test)"
        gate: ignored
    advanced_unit_only: [TWIS, SPIS, CCM, RNG, TEMP, ECB, GPIOTE, PPI, NVMC, FICR,
                         UICR, NFCT, PDM, EGU, QSPI, USBD]
    advanced_dead: [QDEC, AAR, ACL, COMP, CRYPTOCELL, I2S, LPCOMP, MWU]
    shim:
      - {p: USBREGULATOR, ev: "nrf52/usbregulator.rs (70 lines, 0 tests)", note: "thin VBUS-ready register stub"}

  - id: nrf52832
    arch: cortex-m4f
    headline: "Shares the nRF52 model; tier1 fixture drives TWIM/SPIM/SAADC/WDT/RTC/PWM. (The separate firmware_survival demo ELF is RAM-broken — built for 256KB on a 64KB part — but the tier1 fixture is correct.)"
    functional: []
    advanced_unit_only: [TWIS, SPIS, CCM, RADIO, RNG, TEMP, ECB, GPIOTE, PPI, NVMC,
                         FICR, UICR, NFCT, PDM, "EGU0-5"]
    advanced_dead: [AAR, BPROT, COMP, I2S, LPCOMP, MWU, QDEC]
    shim: []

  - id: nrf52833
    arch: cortex-m4f
    headline: "Shares the nRF52 model with nrf52840/nrf52832; tier-1 drives 12 rubric classes (incl. EasyDMA and a real TIMER0 IRQ) and the micro:bit-v2 smoke proves UARTE0. Nothing beyond the rubric is firmware-driven: TWIS/SPIS/CCM/RADIO/NFCT/GPIOTE/TEMP/RNG/ECB/EGU/PDM/NVMC/PPI/USBD/FICR/UICR are unit-tested models, and QDEC/AAR/ACL/COMP/LPCOMP/MWU/I2S have no tests at all."
    functional: []
    advanced_unit_only: [TWIS, SPIS, CCM, RADIO, GPIOTE, NFCT, TEMP, RNG, ECB, "EGU0-5",
                         PDM, NVMC, PPI, USBD, FICR, UICR]
    advanced_dead: [QDEC, AAR, ACL, COMP, LPCOMP, MWU, I2S]
    dead_note: "ACL is on the part (nRF52833 PS feature list + ch. 6.3; Zephyr nrf52833.dtsi acl@4001e000) but shares the NVMC window the descriptor declares, so no ACL instance is wired."
    shim: []

  - id: rp2040
    arch: cortex-m0plus
    headline: "tier1 fixture drives clock/timer/gpio/spi/i2c (PL022/DW_apb); boots unmodified Zephyr. PIO0 is exercised by the required nightly PIO onboarding lane — not by a tier-1 fixture: firmware-rp2040-pio-onboarding boots through this descriptor and must reach PIO_OK (crates/core/tests/rp2040_pio_onboarding.rs:82-135), built and required by the core-full job's LABWIRED_REQUIRE_FIRMWARE (core-ci.yml:2014, :2034, run at :2062; cross-build-excluded from the PR shards)."
    functional: []
    advanced_unit_only: []
    advanced_dead: []
    shim: []

  - id: stm32h563
    arch: cortex-m33
    headline: "Drives all 13 rubric classes (incl. FDCAN→can) via real firmware — the broadest rubric coverage. UDS bootloader/ECU examples exist but are not yet gated as automated tests."
    functional: []
    advanced_unit_only: ["UDS bootloader/ECU (0x10/0x27/0x34/0x36/0x37/0x85/0x28 — example firmware, not gated)"]
    advanced_dead: []
    shim: []

  # ── Chips with NO tier1 fixture (not in the rubric grid) ─────────────────
  - id: nrf5340
    arch: cortex-m33
    headline: "No tier1 fixture. Boots unmodified Zephyr hello_world end-to-end: CLOCK/UARTE0/RTC1 drive the boot (firmware_survival + nrf5340_clock_boot). Nine peripheral blocks are benign boot stubs."
    functional:
      - what: "Unmodified Zephyr v3.7 hello_world boots + prints over UARTE0 EasyDMA"
        fw: nrf5340-zephyr
        ev: "firmware_survival::test_nrf5340_zephyr_survival"
        gate: pr
    advanced_unit_only: [GPIO, "TIMER0-2", RTC0]
    advanced_dead: []
    shim:
      - {p: "DCNF/FPU/CACHE/SPU/OSC_REG/CTRLAP/GPIOTE0/DPPIC/FICR", ev: "nrf5340_*_stub", note: "STRUCTURAL: SystemInit pokes them once at boot and never polls them again, so a register stub is byte-faithful for the hello_world boot path."}

  - id: nrf54l15
    arch: cortex-m33
    headline: "No tier1 fixture. Unmodified Zephyr v4.4 hello_world boots end-to-end (nRF54L CLOCK/LFCLK, GRTC kernel tick, TAMPC approtect gate, RRAM-mapped UARTE20 EasyDMA) and the PR-gated smart-ring probe reads four I2C sensor IDs. Beyond the rubric TEMP/EGU/GPIOTE are unit-tested models no firmware drives; TAMPC/RRAMC/regulators/FICR/UICR/DPPIC are zero-filled stub windows the boot path pokes but never polls."
    functional: []
    advanced_unit_only: [TEMP, EGU10, EGU20, GPIOTE20, GPIOTE30]
    advanced_dead: []
    shim:
      - {p: TAMPC, ev: "configs/chips/nrf54l15.yaml:363 (nrf54l_tampc_stub)", note: "STRUCTURAL: SystemInit READS the protect-domain signal registers, and the MDK deliberately hangs the part on locked+high — zero is the only boot-safe answer. Read once, never polled."}
      - {p: RRAMC, ev: "configs/chips/nrf54l15.yaml:390 (nrf54l_rramc_stub)", note: "STRUCTURAL: firmware executes from RRAM and no boot path polls the controller for a settled value. Closable only by firmware that writes NVM at runtime — none does."}
      - {p: REGULATORS, ev: "configs/chips/nrf54l15.yaml:398 (nrf54l_regulators_stub)", note: "STRUCTURAL: DCDC/LDO selection is write-only on the boot path; nothing reads it back."}
      - {p: FICR, ev: "configs/chips/nrf54l15.yaml:423 (nrf54l_ficr_stub)", note: "STRUCTURAL: factory info read once at boot; zero is the honest answer for an unprovisioned part."}
      - {p: UICR, ev: "configs/chips/nrf54l15.yaml:429 (nrf54l_uicr_stub)", note: "STRUCTURAL: unprovisioned UICR reads zero, which the boot path accepts; APPROTECT provisioning is not modelled."}
      - {p: DPPIC20/DPPIC30, ev: "configs/chips/nrf54l15.yaml:407,413 (nrf54l_dppic_stub)", note: "CLOSABLE: event-routing fabric only — poked during peripheral init, never polled for a settled value, and no firmware routes events through DPPI."}

  - id: nrf54lm20a
    arch: cortex-m33
    headline: "No tier1 fixture. The strict-onboarding snake lab is the only firmware: SPIM22 drives an RM67162 AMOLED and the gate asserts rendered frame ink (a rubric class, so unrecorded here). Beyond the rubric TEMP/EGU/GPIOTE are unit-tested models no firmware drives; TAMPC/RRAMC/regulators/DPPIC20/DPPIC30 are zero-filled stub windows."
    functional: []
    advanced_unit_only: [TEMP, EGU10, EGU20, GPIOTE20, GPIOTE30]
    advanced_dead: []
    shim:
      - {p: TAMPC, ev: "configs/chips/nrf54lm20a.yaml:329 (nrf54l_tampc_stub)", note: "STRUCTURAL: SystemInit READS the protect-domain signal registers, and the MDK deliberately hangs the part on locked+high — zero is the only boot-safe answer. Read once, never polled."}
      - {p: RRAMC, ev: "configs/chips/nrf54lm20a.yaml:351 (nrf54l_rramc_stub)", note: "STRUCTURAL: firmware executes from RRAM and no boot path polls the controller for a settled value. Closable only by firmware that writes NVM at runtime — none does."}
      - {p: REGULATORS, ev: "configs/chips/nrf54lm20a.yaml:358 (nrf54l_regulators_stub)", note: "STRUCTURAL: DCDC/LDO selection is write-only on the boot path; nothing reads it back."}
      - {p: DPPIC20/DPPIC30, ev: "configs/chips/nrf54lm20a.yaml:365,369 (nrf54l_dppic_stub)", note: "CLOSABLE: event-routing fabric only — poked during peripheral init, never polled for a settled value, and no firmware routes events through DPPI."}

  # ── Espressif batch: the C6 has its own tier1 row; the S3-Zero is an
  # ── esp32s3 board variant (same die + wiring) and shares its row.
  - id: esp32c6
    arch: riscv32imac
    headline: "Richest Espressif rubric coverage: the tier-1 fixture drives all 12 of its declared classes. clock and irq are real engines, not register stand-ins — the native PCR enforces CLK_EN (gated UART0 reads back 0, then recovers) and interrupt_core0+intpri route both the software doorbell and UART0's peripheral source into real mcause traps. Beyond the rubric only io_mux and hp_sys remain — SVD-derived declarative register files with no behavioural engine."
    functional: []
    advanced_unit_only: []
    advanced_dead: []
    shim:
      - {p: io_mux, ev: "configs/chips/esp32c6.yaml:231 (declarative; configs/peripherals/esp32c6/io_mux.yaml)", note: "CLOSABLE: reset-value register storage; pad function writes are recorded but never read back or electrically enforced — the DevKitC demo writes U0TXD's MCU_SEL and the tier-1 console both pass regardless of routing. The S3's real io_mux model is the port path."}
      - {p: hp_sys, ev: "configs/chips/esp32c6.yaml:256 (declarative; configs/peripherals/esp32c6/hp_sys.yaml)", note: "CLOSABLE: declarative register file with no engine; nothing drives it today, so the false-success path is latent — timeout monitor, SDIO control, ROM-table lock and memory test are not modelled."}

  - id: esp32s3-zero
    arch: xtensa-lx7
    headline: "Board variant of the esp32s3 die: same configure_xtensa_esp32s3 wiring and the same committed tier-1 ELF, which non-ignored CLI/workspace tests boot under this chip's name and assert through `TIER1 ... PASS` (SYSTIMER runs the clock check; USB-Serial/JTAG is the console of the TMP102 e2e, so neither is a gap). The yaml's IRAM/ROM-thunk/XIP windows are memory-map declarations, not per-chip models, and its eFuse/RTC_CNTL stubs are the shared family stubs listed on the esp32s3 entry. `spi_mem_flash`/`extmem` stay unit-only here too: mask-ROM bring-up reads are not firmware exercise."
    functional: []
    advanced_unit_only: [aes, ds, hmac, rsa, rng, sha, i2s, lcd_cam, sdmmc, usb_otg, gpspi,
                         pcnt, io_mux, extmem, spi_mem_flash, sens, system,
                         core1_control, crosscore_ipi]
    advanced_dead: []
    shim:
      - {p: efuse_stub, ev: "crates/core/src/system/xtensa/esp32s3.rs:647 (esp_xtensa_common/system_stub.rs:454; configs/chips/esp32s3-zero.yaml:72)", note: "CLOSABLE: canned MAC + chip-rev only; no eFuse state, no burn path. The ROM boot and esp-hal accept the canned values."}
      - {p: rtc_cntl_stub, ev: "crates/core/src/system/xtensa/esp32s3.rs:640 (esp_xtensa_common/system_stub.rs:203; configs/chips/esp32s3-zero.yaml:66)", note: "CLOSABLE: register round-trip plus three canned behaviours — PLL_LOCK seeded, TIME_UPDATE snapshot handshake, APP_CPU un-stall. The RTC clock tree, SWD_CONF super-watchdog and sleep domains are not modelled."}
      - {p: wifi_thunks, ev: "esp32s3/wifi_thunks.rs:8 (CHEAT(THUNK-LIB))", note: "IRREDUCIBLE: the ESP32 WiFi MAC/PHY is a closed RF-coprocessor blob with NO executable image — there is no firmware to run, so it can never be firmware-exercised. The lwIP/socket layer above is routed to a real SimNet. (Same shim as the esp32s3 entry.)"}

  # ── STM32 F1/F4 batch: the F103 BluePill and the F4 family. F401 and F407
  # ── have tier-1 rows; F405 does not appear in tier1-matrix.json at all, so
  # ── its entry is the only record of what firmware actually runs on it.
  - id: stm32f103
    arch: cortex-m3
    headline: "Drives 10 rubric classes via its tier-1 fixture, and the nightly J1939 monitor drives bxCAN1 end to end (per-SA BAM reassembly + engine-speed decode); AFIO and DBGMCU are exercised by the PR-gated Zephyr hello (pinctrl remap, debug-init) and PWR by the Arduino startup; beyond the rubric, the shared CRC engine's always-run coverage is the H563 bench oracle (h563_conformance.rs:144) plus IDR-width masking (crc.rs:204), and the F103 polynomial is additionally pinned by the sim-only thumb oracle (stm32f1_exec_oracle.rs:300) and the conformance digest, which CI skips without its prebuilt ELF — while WWDG is an inert shim rather than a dead model, and the USB-device and BKP windows also resolve to zero stubs."
    functional:
      - what: "J1939 engine-bus monitor — per-SA BAM transport reassembly and engine-speed decode from a replayed CAN capture (ENGINE idle_rpm=600; 9 DM1 source addresses)"
        fw: f103-j1939-monitor
        ev: "examples/f103-j1939-monitor/j1939-replay.yaml (nightly coverage-matrix required target, .github/workflows/core-coverage-matrix-smoke.yml:171)"
        gate: nightly
    advanced_unit_only: [CRC]
    advanced_dead: []
    shim:
      - {p: usb_dev, ev: "configs/chips/stm32f103.yaml:216 (type: stub; configs/peripherals/stm32f103/usb.yaml)", note: "CLOSABLE: author-declared stub — writes are dropped and every read returns 0, so the F1 USB-FS device engine (EPnR/CNTR/ISTR/BTABLE/PMA) is not modelled; no gated firmware opens the window, and the declarative usb.yaml is decode-only."}
      - {p: bkp, ev: "configs/chips/stm32f103.yaml:222 (type: stub)", note: "CLOSABLE: author-declared stub with no schema wired in the descriptor — the backup-domain registers (RTC backup data and calibration) are not modelled; no gated firmware touches the window."}
      - {p: "WWDG", ev: "crates/core/src/peripherals/wwdg.rs:63 (configs/chips/stm32f103.yaml:185)", note: "CLOSABLE: inert register bank — tick() is the trait-default no-op, so an armed watchdog never fires. No behavioural test and no gated firmware drives it; reset values are pinned by the bench-F103 probe in stm32f1_mmio_diff."}

  - id: stm32f401
    arch: cortex-m4f
    headline: "All 12 declared rubric classes are driven by its tier-1 fixture — including a byte-exact memory-to-memory transfer on DMA2 plus the EXTI→NVIC and TIM1-PWM checks — while PWR_CR.VOS is programmed by the PR-gated Arduino startup and DBGMCU_CR by the Zephyr SoC-debug init; TIM2 input capture is driven by two register-level firmwares (HC-SR04 echo width through the CC2 interrupt, and PWM-input period/duty in slave reset mode); that leaves the other stream controller, DMA1, as the chip's one beyond-rubric gap."
    functional:
      - what: "TIM2 input capture — HC-SR04 echo width (CH1 rising + CH2 indirect falling, CC2 interrupt) within one 1 µs tick of distance × 58 µs, 2-400 cm"
        fw: timer-capture/echo-capture
        ev: "timer_input_capture.rs:hc_sr04_echo_width_is_measured_by_tim2_input_capture"
      - what: "TIM2 PWM-input mode (TS=TI1FP1, SMS=reset) — CCR1 period and CCR2 high time equal to the injected edge cycles exactly"
        fw: timer-capture/freq-meter
        ev: "timer_input_capture.rs:pwm_input_mode_measures_period_and_duty_exactly"
    advanced_unit_only: [DMA1]
    advanced_dead: []
    shim: []

  - id: stm32f405
    arch: cortex-m4f
    headline: "No tier-1 target (absent from tier1-matrix.json), so this entry carries the whole story: the committed part-specific fixture runs nightly via examples/feather-f405/tier1-smoke.yaml and PR-gated firmware_survival::test_stm32f405_tier1_survival, driving clock/gpio/timer/i2c/spi/adc/wdt/rtc over USART2 and explicitly leaving dma/irq/pwm unclaimed; PWR and both DMA controllers are modeled but firmware-untouched, and DBGMCU is never exercised at all."
    functional: []
    advanced_unit_only: [PWR, DMA1, DMA2]
    advanced_dead: [DBGMCU]
    shim: []

  - id: stm32f407
    arch: cortex-m4f
    headline: "Its 9-class tier-1 fixture leaves dma/irq/pwm unrecorded, and the DMA gap is real: no firmware drives either stream controller (only the descriptor-level differential does); the PR-gated smoke reads DBGMCU IDCODE, the Arduino startup programs PWR_CR.VOS then reads REV_ID back, and the `arduino-matrix-gate` L8_can loopback sketch drives bxCAN1 to self-reception (ID 0x123, data 0xA5), so debug, power and CAN are firmware-exercised; the AHT20+BMP280 e2e drives two real I²C device twins but decodes no physical value."
    functional: []
    advanced_unit_only: [DMA1, DMA2]
    advanced_dead: []
    shim: []

  # ── STM32F4 package variants and the F7 batch. The CDU6 is a rowless
  # ── package variant: it shares the stm32f401 silicon but not its descriptor,
  # ── declaring a wall of zero stubs the F401 does not; the F411 owns its own
  # ── tier-1 row through its own descriptor. Neither F7 part is a tier-1
  # ── target, so its entry carries the whole story.
