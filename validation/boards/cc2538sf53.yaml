  - "firmware_survival::test_cc2538dk_contiki_flash_test_survival"
  - "firmware_survival::test_cc2538dk_contiki_crypto_ccm_survival"
  - "firmware_survival::test_cc2538dk_contiki_crypto_sha256_survival"
  - "cc2538_rom (12 tests: ROM utility API incl. PageErase/ProgramFlash through FLASH_CTRL + CCA boot on the CPU model)"
  - "cc2538_sleep_timer_irq (compare -> SM Timer IRQ 145 -> handler)"
  - "cc2538_rpl_udp (3 nodes, stock Contiki-NG rpl-udp: 3 round trips per client; event-scheduler)"
