id: cc2538sf53
# 2026-10-30: TI CC2538DK (CC2538SF53, Cortex-M3; 512 KiB flash at
# 0x00200000, 32 KiB SRAM at 0x20000000). First CC2538 part: SYS_CTRL
# (cc2538_sys_ctrl, CLOCK_CTRL/CLOCK_STA + gate banks at their SWRU319C
# Table 7-3 reset values, SYNC_32K from the cycle clock), the PL061-style
# GPIO A-D (cc2538_pl061_gpio, address-masked GPIO_DATA) and UART0/1 on
# the pl011 layout. Same day, a stock Contiki-NG boot: an in-tree clean-room ROM at 0x0
# (crates/core/roms/cc2538, NOT a TI dump: SWRU333A CCA boot + the 0x48
# utility API), the RF core alone in an empty channel (cc2538_rfcore:
# strobes, timed main FSM, RSSI/CCA, RFRND; no reception), the sleep
# timer (cc2538_sleep_timer: 32-kHz count + compare IRQ 145) and the info
# page's primary IEEE address, enough for stock Contiki-NG v4.9
# hello-world (tests/fixtures/cc2538dk-contiki-hello.elf). Later the
# flash controller (cc2538_flash_ctrl: page erase, FCTL/FADDR/FWDATA
# write sequence, CCA lock bits, DIECFG0-2) behind the ROM's
# PageErase/ProgramFlash: stock Contiki-NG cfs-coffee test-cfs and
# example-coffee, plus the steps of Renode's cc2538_flash_controller.robot.
# 2026-10-31: the AES/SHA-256 cryptoprocessor (cc2538_aes: DMA, key
# store, ECB/CBC/CTR/CBC-MAC/CCM/GCM, SHA-256, IRQ 143): the unmodified
# Contiki-NG cc2538-common/crypto suite, a superset of Renode's
# cc2538_cryptoprocessor.robot.
# 2026-10-31: three nodes on a shared 802.15.4 air (ieee802154_air:
# timed broadcast, frame filtering, AUTOACK decided at push time) run the
# unmodified Contiki-NG v4.9 examples/rpl-udp, the topology of Renode's
# cc2538_rpl-udp.robot: the RF core's RX FIFO, FIFOP IRQ 141 and the
# µDMA (cc2538_udma: software basic/auto transfers, CHIS + IRQ 46).
# IOC, PKA, SSI, I2C, GPTimers, USB and ADC are declared
# stubs. SIM-DERIVED — no CC2538 bench part. See docs/boards/cc2538dk.md
# and examples/cc2538dk/VALIDATION.md.
doc: docs/boards/cc2538dk.md
chip: configs/chips/cc2538sf53.yaml
tier: smoke-manual
