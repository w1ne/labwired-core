id: r7fa6m5bh
# 2026-10-30: Renesas EK-RA6M5 (R7FA6M5BH, Cortex-M33; 2 MiB code flash
# at 0x0, 512 KiB SRAM at 0x20000000). First RA6M5 part. Reuses the RA4M1
# models at the RA6M5 bases: PORT0-B (ra_port), PmnPFS/PWPR (ra_pfs),
# SYSTEM (id ra_sysc, now the full ra6_sysc register file, see below)
# and SCI0 on the sci layout. MSTP, ICU,
# DMAC/DTC, ELC, RTC, IWDT/WDT, USBFS/USBHS, IIC, CANFD, AGT, ETHERC,
# SPI, GPT, ADC12 and FACI are declared stubs; SCI1-9 and the remaining
# blocks are not mapped.
# 2026-10-31: stock Zephyr v4.0.0 samples/hello_world and
# samples/synchronization for ek_ra6m5 boot (tests/fixtures/
# r7fa6m5bh-zephyr-{hello,sync}.elf, rebuilt byte-identical by
# crates/firmware-ek-ra6m5-zephyr/build.sh): ra6_sysc as a full
# R_SYSTEM register file (0x700 bytes) with derived OSCSF and the
# USB/OCTA/CANFD CKCR handshake, the classic SCI FIFO registers (FCR
# reset handshake, FTDRL/FRDRL, FDR) on the sci layout, and declared
# stubs for FCACHE, the C-cache and PSCU/CPSCU. SIM-DERIVED — no RA6M5
# bench part. See docs/boards/ek-ra6m5.md and
# examples/ek-ra6m5/VALIDATION.md.
# 2026-11-01 (feat/ek-ra6m5-agt-icu): the ICU at 0x40006000 is the RA ICU
# IELSRn event link (ra_icu) and AGT0-5 are ra_agt (events 0x040 + 3n);
# stock Zephyr v4.1.0 samples/drivers/counter/alarm (AGT0 compare match
# through IELSR84).
# 2026-11-01 (feat/ek-ra6m5-sci-irq): SCI0 raises RXI/TXI/TEI as ELC
# events 0x180-0x182 through the ICU (SCR stored; its enables drive
# uart/sci_b_irq.rs) and in FIFO mode SSR reads as SSR_FIFO; stock
# Zephyr v4.0.0 tests/drivers/uart/uart_basic_api 7/7 on the
# interrupt-driven classic SCI driver.
# 2026-11-01 (feat/ek-ra6m5-zephyr-shell): stock Zephyr v4.0.0
# samples/subsys/shell/shell_module (interrupt-driven shell backend on
# SCI0) answers typed commands, TAB completion and history recall
# (examples/ek-ra6m5/zephyr-shell.yaml). No model change.
