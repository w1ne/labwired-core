id: rp2350
doc: docs/boards/rp2350.md
chip: configs/chips/rp2350.yaml
tier: smoke-manual
note: "Pico 2 / RP2350: UART0 smoke (examples/pico2) with firmware-rp2350-demo (M33 bare-metal). Reuses RP2040 behavioural models on the RP2350 APB map via clkrst profile rp2350. No TrustZone/bootrom/PIO v2/dual-core; no silicon bench."
models:
  - crates/core/src/cpu/cortex_m.rs
  - crates/core/src/decoder/arm.rs
  - configs/chips/rp2350.yaml
  - crates/core/src/peripherals/rp2040_clocks.rs
  - crates/core/src/peripherals/rp2040
  - configs/peripherals/rp2350
  # 2026-09-21, model_paths_drift_gate: models this board REGISTERS that
  # its list omitted, so they were invisible to the drift digest. This
  # board records no silicon capture, so there is no "silicon-verified"
  # claim for the corrected digest to invalidate — no ack is implied.
  - crates/core/src/peripherals/declarative.rs
  - crates/core/src/peripherals/pio.rs
  - crates/core/src/peripherals/rp2040/adc.rs
  - crates/core/src/peripherals/rp2040/dma.rs
  - crates/core/src/peripherals/rp2040/i2c.rs
  - crates/core/src/peripherals/rp2040/io_bank0.rs
  - crates/core/src/peripherals/rp2040/pwm.rs
  - crates/core/src/peripherals/rp2040/sio.rs
  - crates/core/src/peripherals/rp2040/spi.rs
  - crates/core/src/peripherals/rp2040/timer.rs
  - crates/core/src/peripherals/rp2040/watchdog.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/peripherals/systick.rs
  - crates/core/src/peripherals/uart.rs
  # 2026-11-01 (#1603 / #1607): models this board now registers or runs:
  # the RP2040 USB controller on USBCTRL_IRQ 14, the BOOTRAM block, the
  # clean-room boot ROM image, and the DCP coprocessor model. No silicon
  # capture on this board, so no drift_ack is implied.
  - crates/core/src/peripherals/rp2040/usb.rs
  - crates/core/src/peripherals/rp2350_bootram.rs
  - crates/core/roms/rp2350
  - crates/core/src/cpu/cortex_m/rp2350_dcp.rs
  - crates/core/src/cpu/cortex_m/exec/misc.rs
