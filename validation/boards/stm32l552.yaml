id: stm32l552
# 2026-10-29: NUCLEO-L552ZE-Q (STM32L552ZET6Q, Cortex-M33 / Armv8-M;
# 512 KiB flash at 0x08000000, 192 KiB SRAM1 at 0x20000000 + 64 KiB SRAM2
# at 0x20030000). First STM32L5 part: a new `stm32l5` RCC profile
# (RM0438 RCC — AHB1ENR/AHB2ENR/AHB3ENR/APB1ENR1/APB1ENR2/APB2ENR,
# MSI boot, APB1ENR2.LPUART1EN), v2 GPIO, LPUART1/USART1-3/UART4-5, SPI
# v2 FIFO, v2 I2C, timers, DMA/DMAMUX, RNG/CRC/RTC/IWDG/WWDG and PWR.
# FLASH controller, EXTI, ADC, FDCAN and USB are declared stubs.
# TrustZone/SAU/GTZC are NOT modelled.
# 2026-10-30: stock Zephyr v3.7.0 samples/hello_world for
# nucleo_l552ze_q boots and prints over LPUART1
# (tests/fixtures/stm32l552-zephyr-hello.elf, rebuilt byte-identical by
# crates/firmware-l552ze-zephyr/build.sh) after mapping the ICACHE (the
# U5 icache model, same IP) and the DBGMCU at 0xE0044000.
# 2026-10-31: stock Zephyr v3.7.0 samples/synchronization also runs
# (tests/fixtures/stm32l552-zephyr-sync.elf, same build script):
# SysTick k_msleep timeouts, semaphore hand-off and PendSV switches,
# asserted by examples/nucleo-l552ze-q/zephyr-sync.yaml in ci/test.sh.
# 2026-10-31 (feat/l552-mpu-protection): the PMSAv8 MPU is enforced
# (armv8m_mpu + cortex_m.rs: MemManage DACCVIOL/MMFAR, IACCVIOL); stock
# Zephyr tests/kernel/mem_protect/protection passes 5/5 and
# tests/kernel/mem_protect/userspace 40/40 (PPB privileged-only,
# unprivileged MSR ignored, TTT R/RW), zephyr-protection.yaml and
# zephyr-userspace.yaml in ci/test.sh: all four Renode ARMv8M.robot cases.
# SIM-DERIVED — no STM32L552 bench part. See
# docs/boards/nucleo-l552ze-q.md and
# examples/nucleo-l552ze-q/VALIDATION.md.
doc: docs/boards/nucleo-l552ze-q.md
