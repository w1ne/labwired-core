# one field). The INTERRUPT_CORE0 routing itself is untouched: MAP at
# 0x600C_2000 + s*4, CPU_INT_ENABLE 0x104, CPU_INT_PRI_n 0x114 + n*4,
# CPU_INT_THRESH 0x194, FROM_CPU doorbells as sources 50..53 — same offsets,
