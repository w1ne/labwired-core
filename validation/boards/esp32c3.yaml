# 2026-09-17 (perf/bus-scheduler-pass): per-instruction COST only, no model
# change. Three edits: `CortexM::step_execute` asks "is anything pending"
# before ranking exceptions (the ranking it now skips returned `None`, and
# the `exception_num != 0` arm already made the block dead); `SystemBus`
# negative-caches the hole between `extra_mem` windows, which an access
# wholly inside provably misses; and `RiscV` remembers an aligned fetch
# window base whose refill just failed instead of re-deriving the same
# failure every instruction (the fetch still falls through to
# `bus.read_u32`, the path it was already taking). No register map, reset
# value, timing or IRQ route is touched.
# EVIDENCE: seven runs of five firmwares at --max-steps 5000000 (nrf52840
# Zephyr step+batch, nrf52840 tier1, stm32f405 tier1 step+batch, esp32c3
# tier1, esp32c3 demo) hash 21/21 IDENTICAL over stdout, the cycle-stamped
# `--bus-trace-out` event list and the `[batched]` summary, against a
# binary built from 80c01390d. The digest moves because it hashes whole
# files. This is an ACK, NOT A CAPTURE — a live re-capture is still owed.
# 2026-09-20: recover bounded RISC-V ADDI/back-branch aggregation from the
# fork, using the existing permission-vetted fetch window instead of a
# persistent promotion cache. Reset and both CPU snapshot restore paths
# now invalidate fetched code. The three stale-code regressions failed
# before the repair; the optimized RISC-V unit group passes 37/37 after it.
# IRQ-enabled, observer, logic-tap, and cycle-accurate execution remains
# interpreted. This acknowledges CPU-source drift, NOT a silicon recapture.
# 2026-09-28 (BLE connections + GATT): the RW-BLE baseband model
# (`peripherals/esp32c3/bt.rs` + new `bt_link.rs`) gained connection events,
