# 2026-08-21: `peripherals/esp32c3/bt.rs` changed in two ways, neither of
# which alters a register, a bit position, a timing or a decode:
#   1. `next_node_id()` moved to `peripherals/ble_air.rs` and is imported
#      from there. It has to be ONE counter now that a second kind of BLE
#      controller can share an air — two counters would both start at 1,
#      the first controller of each kind would collide, and each would
#      swallow the other's frames as "its own transmission".
#   2. `set_air` is now also reachable as `Peripheral::attach_ble_air`, so
#      `SystemBus::attach_lab_air` stops downcasting to this concrete type
#      to find it. The body it runs is unchanged — it calls `set_air`.
