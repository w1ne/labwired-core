id: vegaboard-ri5cy
# 2026-10-23: the Vega board's RI5CY SoC (RV32IMC; 1 MiB flash at 0x0,
# 192 KiB SRAM at 0x20000000). Modelled: CPU + memory + LPUART0/1; the
# SCG/PCC clock blocks, INTMUX and low-power timers are declared stubs and
# the smoke prints the SCG/PCC readbacks. SIM-DERIVED — no silicon
# capture. See docs/boards/vegaboard-ri5cy.md and
# examples/vegaboard-ri5cy/VALIDATION.md.
doc: docs/boards/vegaboard-ri5cy.md
chip: configs/chips/vegaboard-ri5cy.yaml
tier: smoke-manual
offline_tests:
  - "firmware_survival::test_vegaboard_ri5cy_smoke_survival"
models:
  - crates/core/src/cpu/riscv.rs
  - crates/core/src/decoder/riscv.rs
  - crates/core/src/peripherals/uart.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/bus/from_config.rs
  - crates/core/src/bus/profiles.rs
  - crates/core/src/peripherals/generic_factory.rs
  - crates/core/src/system/riscv.rs
  - crates/core/src/system/builder/riscv.rs
  - crates/firmware-vegaboard-ri5cy-smoke
  - configs/chips/vegaboard-ri5cy.yaml
  - configs/systems/vegaboard-ri5cy.yaml
