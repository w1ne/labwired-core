silicon:
  last_capture: 2026-08-09
  probe: "ST-LINK V2 (V2J37S7, serial 48FF6B064884534929321087), openocd 0.12.0 hla_swd; nRF52840 FICR INFO.PART=0x00052840, DEVICEID 707dc298"
  result: "re-captured live 2026-08-09 with NRF52_STRICT=1: ALL 11 hw-oracle suites pass — conformance, cpu_conformance, mmio 16/16, gpio, onboarding, power, spis_twis, timer_rtc, spim_easydma, full_register, ccm. NOT a second board: DEVICEID 707dc298 matches the 2026-06-09 baseline, so this is a re-read of the SAME part (unlike the C3/S3 re-captures, which were cross-board). The run was NOT clean on arrival and found three real defects, all fixed in this commit: (1) seven nrf52_* hw-oracle tests had not COMPILED since the 2026-07-18 bus consolidation removed the inherent SystemBus read_u32/write_u32 shadows — they build only under --features hw-oracle-nrf52, which CI never enables, so the 're-capture pending' ack pointed at a path that could not build; (2) mmio was 15/16, SPIM0 PSEL_MISO sim=0x0 vs hw=0x2E, because the serial-instance broadcast PSEL WRITES to both halves but dispatched READS to TWIM, which models only 0x508/0x50C; (3) SPIM PSEL.CSN (0x514) was missing from Nrf52SpiRegs entirely — corroborated present on silicon (wrote 0x2B, read 0x2B). Guarded going forward by a hardware-free unit test, serial_instance::psel_block_reads_back_while_disabled."
# The UARTE model gained an EasyDMA TX path (STARTTX now reads the TXD buffer,
# emits the bytes, and raises TXSTARTED/TXDRDY/ENDTX/TXSTOPPED) so an unmodified
# nrfx console boots under the sim. Additive: the 2026-06-17 register sweep
# (conformance/mmio/GPIO/POWER/SPIS/TWIS/RTC/TIMER) is unaffected. No live SWD
# re-capture of the new TX register sequence was run this session (no bench
# board); a UARTE TX live diff is tracked.
# 2026-06-27: SAADC + PWM gained Tier-3 behavioral engines (real conversion /
# duty output) for the coverage matrix. Additive and behavioral-only; the
# 2026-06-17 register sweep is unaffected. No live SWD re-capture this session.
# 2026-06-29: unified SPIM0/TWIM0 serial-instance mux (Nrf52SerialInstance) at
# 0x40003000 replaces the generic spi0 chip-YAML entry. The 2026-06-17 register
# sweep did not cover SPIM0/TWIM0 shared-MMIO behaviour (it tested SPIS/TWIS/
# TIMER/RTC/POWER/GPIO). This is a new model for an untested path; additive
# and validated by 6 offline unit tests (twim_path_reads_bme280_chip_id etc.).
# 2026-06-30: four temporal/clock-domain fidelity fixes so an unmodified Zephyr
# BME280 ztest now passes in-sim: (1) TWIM completion EVENTS/IRQ fire after a
# physical-latency countdown (transfer_cycles) instead of the same tick as
# TASKS_START; (2) TWIM TASKS_RESUME/SUSPEND made no-ops (only STARTTX/STARTRX
# initiate); (3) Cortex-M no longer re-latches an NVIC pending bit the firmware
# cleared via ICPR (is_nvic_irq_pending gate — kills a spurious double-ISR);
# (4) nRF52 RTC counts on the 32.768 kHz LFCLK via an exact fractional
# accumulator instead of the 64 MHz core clock. Behavioural timing/IRQ changes,
# NOT register-reset-value changes: the 2026-06-17 register sweep (conformance/
# mmio/GPIO/POWER/SPIS/TWIS/RTC/TIMER) is unaffected. The success-path BME280
# read was NOT live-diffed on silicon this session (no BME280 wired to the
# bench board — only the NACK/no-device path was captured 2026-06-30); a live
# success-path TWIM+RTC re-capture is tracked.
# 2026-07-04: modeled the legacy UART personality of UART0/UARTE0 — a byte
# written to TXD (0x51C) is transmitted and EVENTS_TXDRDY (0x11C) is raised on
# the same access, and TASKS_STARTTX no longer arms EasyDMA when ENABLE selects
# legacy UART (=4). Unblocks the Adafruit/Arduino nRF52 core's blocking
# Uart::write. Additive register behaviour on a path the 2026-06-17 sweep did
# not cover (it exercised UARTE EasyDMA, not the legacy TXD shifter); the reset
# sweep (conformance/mmio/GPIO/POWER/SPIS/TWIS/RTC/TIMER) is unaffected. No live
# SWD re-capture of the legacy-UART TX sequence this session (no bench board).
# 2026-07-10: bus-trace single-choke-point refactor (attach wraps at SystemBus::attach_i2c_slave/attach_spi_device; no per-callsite set_bus_trace) + cycle stamp on trace events + gpio_routing/pin_routing metadata. Additive; oracle output unchanged.
# 2026-07-19: unified stimulus interface — every bus controller gained a
# `for_each_attached_sim_input` impl (and TWIM/SPIM gained `as_any` +
# attached-device accessors) so SimInput reaches devices without
# downcasting. PURELY ADDITIVE: `git diff` over every model file listed
# below shows 0 removed lines — no existing method body was modified, so
# no register read/write path changed. Reset values, register layout and
# byte paths are unchanged; the mmio/conformance diffs pass unchanged.
# Drift is the shared-file commit date only. No live re-capture.
# 2026-07-20: per-cycle-walk participation only. Six shared peripheral
# models (gpio, stub, nrf52 timer/egu/temp/uarte) gained
# `legacy_tick_active()` / `legacy_tick_dynamic()` overrides so peripherals
# that do nothing are skipped by the legacy walk (nRF54L15 measured
# 2.74M -> 5.09M IPS). PURELY ADDITIVE: `git diff origin/main..HEAD` over
# those six files shows +12/+18 and **0 removed lines** — no existing method
# body was touched, so no register read/write path, reset value or layout
# changed. A peripheral is skipped ONLY in states where its `tick()` already
# returned a default PeripheralTickResult (or where it overrides no tick at
# all), and the bus re-arms the entry via `refresh_legacy_tick_index()` on
# any MMIO write. GPIOTE was tried the same way and REVERTED — its tick()
# detects IN edges rather than draining a queue, and
# nrf52840_onboarding_gpiote_event_in_fires_on_edge caught it. Offline
# oracle/mmio/conformance suites pass unchanged. No live re-capture.
# 2026-07-21: GPIOTE now DOES opt out of the walk — but safely, unlike the
# reverted attempt. `legacy_tick_active()` returns true whenever any queue
# is non-empty (pending_gpio_writes / pending_in_events / pending_in_mask),
# so it stays in the walk exactly when its tick() has an IN edge or GPIO
# write to deliver, and drops out ONLY when genuinely idle (all queues
# empty, tick() takes its no-op early return). NVIC also opted out (its
# tick() is the trait-default no-op). PURELY ADDITIVE: +16/+11, 0 removed
# lines — no register read/write path, reset value or layout touched.
# EVIDENCE it is byte-identical: nrf52840_onboarding_gpiote_event_in_fires_
# on_edge (the exact test that caught the reverted attempt) passes, and all
# cross-chip walk-vs-scheduler byte-identical differentials pass (82 walk
# tests + f401/h563/l073/l476 Zephyr-boot). No live re-capture required.
# 2026-07-22: BLE virtual air moved from a process-static (static AIR) to an
# injected VirtualAirBus handle each Nrf52Radio holds. Nrf52Radio::new() (what
# the factory builds) binds a transitional process-global bus, so existing
# behaviour is byte-identical: cross_instance_via_virtual_air and
# nrf52840_ble_loopback_through_virtual_air pass UNCHANGED. No register
# read/write path, reset value or layout touched — drift is the shared nrf52
# file commit date only. No live re-capture.
# 2026-07-24: IR-component-engine retirement (phase B) removed the dead
# `type: ir` SPI escape-hatch branch from nrf52/factory.rs. No register
# read/write path, reset value or layout touched — drift is the shared nrf52
# file commit date only. No live re-capture.
# 2026-07-27: configs/chips/nrf52840.yaml corrected three NVIC numbers against tests/fixtures/real_world/nrf52840.svd — PDM 31->29 (31 is unassigned), PWM1 29->33 (29 was PDM's vector), PWM2 30->34 (30 is unassigned) — surfaced by the new SVD conformance gate. Numbers only; no peripheral model, register layout or base address changed, and the ACL / GPIO P1 base deviations were reviewed and left as recorded modelling limitations rather than silently 'fixed'. Evidence re-run on this commit: full cargo test -p labwired-core green, including this board's conformance, onboarding and firmware_survival cases. No live re-capture.
# 2026-07-31: I2C transaction dispatch in nrf52/twim.rs gained `claims_address` /
# `select_address` hooks so a bus switch (TCA9548A) can answer for addresses
# reachable behind an enabled channel. The DEFAULT `claims_address` is
# `self.address() == addr` — the exact predicate the previous
# `position(|d| d.borrow().address() == addr)` lookup used — so every existing
# device dispatches byte-identically; only the switch overrides it. No register
# read/write path, reset value, layout or base address changed. Evidence re-run
# on this commit: full `cargo test -p labwired-core` green, 82 test binaries, 0
# failures. No live re-capture.
# 2026-07-30: crates/core/src/peripherals/nrf52/rtc.rs gained a `tick_elapsed_forced` override. Under `event-scheduler` the RTC's `tick` no-ops and the counter advances only from the bus-published cycle clock, which the bare-CPU forced walk freezes — so RTC0 could never reach its compare and nrf52840_onboarding_rtc0_fires_compare_and_pends_irq failed under `cargo test --workspace`. The override restores the legacy one-tick-per-bus-tick advance on that oracle-only path and carries `anchor` with it so no cycle is replayed. No register layout, base address or reset value changed, and the production event chain (take_scheduled_events / on_event) is untouched — this path is never reached from Machine execution, so nothing the 2026-06-17 capture asserts can move. Evidence: full `cargo test --workspace --lib` green, this board's conformance/onboarding/firmware_survival cases green, and the feature-off path unchanged at 2423 passed. No live re-capture.
# 2026-07-30: configs/chips/nrf52840.yaml gained a 4KB zero-filled `nrf_errata_probe` memory region at 0xF0000000 (#708), so the Nordic nRF5 SDK / ArduinoCore-nRF5 errata probes that read 0xF0000FE0 stop recording unmapped_mmio. MEMORY MAP ONLY: no peripheral model, register layout, base address or reset value changed, and that window was previously UNMAPPED — it is not part of the 2026-06-17 asserted set (conformance 16/16, mmio 16/16, GPIO P0/P1, POWER/SPIS/TWIS/RTC0/TIMER0 sweeps all sit in the 0x4000_0000/0x5000_0000 peripheral space), so no captured value can move. The zero fill is a RECORDED MODELLING LIMITATION, not silicon parity: real die returns a package/rev fingerprint there, and zeros make the probe read 'not this rev' rather than have the sim invent a fingerprint it has never captured off the bench. Same pattern already carried by configs/chips/nrf52832.yaml. A live re-capture is still owed for the fingerprint window itself, but not for the drifted claim. No live re-capture.
# 2026-07-31: I²C slave resolution changed from a flat `d.address() == addr`
# first-match to `d.claims_address(addr)` plus a `select_address` hook at the TWIM
# dispatch sites in crates/core/src/peripherals/nrf52/{twim,factory}.rs (#720), so
# a TCA9548A bus switch can route for itself. DISPATCH ONLY: both hooks are
# defaulted on the `I2cDevice` trait — `claims_address` defaults to
# `self.address() == addr` and `select_address` to a no-op — so with no mux on the
# bus the resolution is byte-identical to the code it replaces. No TWIM register
# layout, base address, reset value or EasyDMA read/write path moved, and slave
# selection is not part of the 2026-06-17 asserted set (conformance 16/16, mmio
# 16/16, GPIO P0/P1, POWER/SPIS/TWIS/RTC0/TIMER0 sweeps), so no captured value can
# move. Evidence: the new per-family mux coverage drives a real EasyDMA
# transaction through this controller and passes unchanged. No live re-capture.
# 2026-08-03: ⚠ REAL MODEL CHANGE, not metadata. `spi2` in configs/chips/nrf52840.yaml had NO `config.profile`, and every *RegisterLayout derives Default = STM32 — so this nRF52840 SPI peripheral was being modelled with the STM32 SPI register map, silently. It now states `profile: "nrf52_spim"` and gets the Nordic SPIM layout (#753). This can only move values TOWARD silicon (the previous layout was the wrong vendor's), and SPI2 is not in the 2026-06-17 asserted set — that capture covers conformance 16/16, mmio 16/16, GPIO P0/P1 and POWER/SPIS/TWIS/RTC0/TIMER0 sweeps, none of which touch SPIM2 @ 0x40023000. But this is a fidelity change and a live SPIM2 re-capture IS owed; acking so the gate tracks it rather than hiding it. Same board also gained debug_schema entries (metadata only, see the note pattern on the other boards). Evidence: all 249 nrf52 tests green.
    # 2026-08-05: additive RX + NVM control changes. UARTE gains an RX injection
# queue with EasyDMA drain (RXD.PTR/MAXCNT/AMOUNT/ENDRX) and legacy RXD pop;
# NVMC gains Wen gating (flash stores drop without it, commit 1->0 AND) and
# real ERASEPAGE/ERASEALL/ERASEUICR drained at the instruction boundary;
# UICR gains erase() and both models implement as_any (their absence made
# downcast lookups silently no-op). No reset-state readback, no TX path and
# no swept register in the 2026-06-17 asserted set moves: UARTE TX is
# untouched, NVMC reset reads (READY=1 etc.) are unchanged, and the new
# behaviors only fire on firmware actions (STARTRX, flash store, erase
# request) that no capture performs. Evidence: 263 nrf52 tests + 7 new
# nvmc tests green. Live re-capture owed for the RX drain timing.
# 2026-08-06: universal I2C kits + external_devices attach path; nRF UARTE RX test style only.
# No register map / base / reset change on silicon-asserted set. Offline gates unchanged.
# 2026-08-07: nRF52 GPIOTE `observe_gpio_change` now REPORTS whether it latched an
# edge (return type only — the channel/polarity matching logic is byte-identical),
# and the bus stopped seeding its GPIO edge baseline at zero, so a level the
# outside world already holds is no longer a phantom rising edge at cycle 1. No
# register map, base address, reset value or readback in the 2026-06-17 asserted
# set moves; the only observable delta is a GPIOTE EVENTS_IN that used to latch
# with no contact having moved. Offline gates unchanged. Live re-capture still
# owed for the RX drain timing.
# 2026-08-07: RADIO air-time accounting — a packet's air time now ends at its
# computed deadline instead of at the first wake that happens to land inside
# it. Scheduling behaviour, not silicon surface: no register in the asserted
# 16/16 sweep changes address, reset value or access, and no base moves.
# Owner-authorised ack WITHOUT a live re-capture; the RADIO packet-timing
# live diff remains owed and is NOT evidenced by this entry.
# 2026-08-08: TIMER scheduler re-arm dedup (#861). `take_scheduled_events`
# kept minting a fresh arming token on every drain, which runs after every
# MMIO write; since scheduler dedup keys on (peripheral, token, deadline),
# a poll loop left one far-future compare wake resident per poll until the
# live-event ceiling tripped. The token now holds steady when a re-arm
# targets the instant already in flight. Scheduler bookkeeping, not silicon
# surface: no register in the asserted 16/16 sweep changes address, reset
# value or access; counter width/BITMODE masking, prescaler division,
# CC compare matching, SHORTS and EVENTS_COMPARE latching are all untouched,
# and TIMER0's 16/0 sweep re-runs green. Acked WITHOUT a live re-capture —
# no TIMER live diff is evidenced by this entry.
# 2026-08-09: RNG byte production now stops while a byte sits unread in
# VALUE. BEHAVIOURAL, not additive — the diff is +21/-0 in nrf52/rng.rs and
# removes no line, but it changes WHEN bytes are produced: the model used to
# keep generating for every BYTE_PERIOD a batch covered, overwriting VALUE
# and handing firmware only the last one. Real silicon free-runs and a slow
# reader does miss bytes, so this is a deliberate divergence: on silicon the
# pacing is the chip's, in the sim it was the host's batching choice, and no
# firmware-visible sequence may depend on that. The byte SEQUENCE is
# unchanged (same xorshift32 chain from the same seed, one byte per byte
# read); only production timing moves.
#
# No register address, reset value, access or layout changes, and the
# asserted 2026-06-17 sweep does not cover RNG at all — it is
# conformance/mmio/GPIO/POWER/SPIS/TWIS/RTC0/TIMER0 plus SPIM0/CCM. Acked
# WITHOUT a live re-capture (no bench board); an RNG live diff is owed and is
# NOT evidenced by this entry.
# 2026-08-09 census ack: the silent-path census adds `census_reg!(..)` to the
# catch-all arms of peripheral read/write. With `default = []` the macro
# expands to `()`, so every default build compiles to exactly the code that
# was captured — the source digest moved, the model did not. Accepted by
# Andrii without a live re-capture; no new silicon diff is evidenced here.
# 2026-08-10: rides the logic-analyzer wire-channel contract. This board's models gained ONLY
# the two additive accessors line_names() and wire_lines(); the diff across
# crates/core/src/peripherals/{nrf52,esp32c3,esp32s3,rp2040} is +72 lines and ZERO deletions, so
# no existing code path was altered. The source digest moved; the model did not. No live
# re-capture is evidenced here.
# 2026-08-10 UARTE BAUDRATE reset correction. Unlike the acks above this is
# NOT digest-only churn: it changes a RESET VALUE the model answers with.
# UARTE BAUDRATE reset was 0x01D7_E000 (Baud115200); silicon resets it to
# 0x0400_0000 (Baud250000) per nRF52840 PS v1.11 §6.34.9.27 p847, and p830
# for the legacy UART. The old value was the engine's invention, so the
# register sweep in the 2026-06-17 capture recorded 115200 only because the
# model said so — a live re-read of BAUDRATE at reset is exactly what would
# settle it, and no bench board was available this session.
#
# Accepted because the datasheet is unambiguous and cited, the change is
# confined to the reset constant plus the zero-BAUDRATE fallback that
# already referenced it, and firmware that sets BAUDRATE before use (all of
# ours) is unaffected. A live UARTE re-capture is tracked with the UARTE TX
# diff already noted above; whoever runs it should read BAUDRATE at reset
# first, because that single register is the whole claim here.
#
# 2026-08-09: a bench board WAS attached and all 11 suites re-ran live (see
# silicon.result), so the ack is discharged. One caveat it raised survives
# the discharge: RNG is still not covered by any asserted sweep. That is a
# COVERAGE gap, not a drift gap — re-capturing cannot close it, only adding
# an RNG oracle can. Do not read "fresh" as "RNG is validated".
#
# Merged 2026-08-10: the discharge recorded above applies to the tree as it
# stood at that live capture. The acks below cover model changes that
# postdate it and are NOT evidenced by that capture.
# 2026-08-13 (#962): the chip descriptor now declares the clock its core
# runs at (`ChipDescriptor::cpu_hz`), which moved every configs/chips/*.yaml
# and this board's digest with them. NOTHING THIS CAPTURE PINS MOVED: the
# field is declarative and no peripheral model reads it — the ESP/nRF
# peripherals keep their own CPU_CLOCK_HZ constants, and a new test
# (cpu_hz_single_source) asserts the descriptor agrees with them rather
# than replacing them. What consumes the clock is the external-device
# attach path (DHT22, HC-SR04, rotary encoder, WS2812), and no silicon
# capture covers any of those. No live re-capture owed for this change;
# any re-capture already owed above still is.
# 2026-08-21 (CPU): `cpu/cortex_m.rs` — a CORRECTNESS FIX, not a
# refactor, and it changes what firmware does. The nine 16-bit T1
# data-processing encodings ADC/AND/BIC/EOR/MUL/MVN/ORR/RSB/SBC set flags
# unconditionally; their `setflags` is `!InITBlock()`. Leaking them
# corrupted the CONDITION of every instruction still to run in the same IT
# block. Measured on real gcc output: an `orrls` before a `strls` in one
# `itt ls` cleared Z, so the store never ran and a peripheral register was
# silently never written. LSL and the arithmetic forms already carried the
# guard (with a note citing an earlier H563/WBA52 regression); these nine
# did not.
#
# Why no re-capture is owed: what this board's capture PINS is a cold-reset
# REGISTER dump, not an execution trace, and no register's reset value
# moved. The behaviour gates that DO execute firmware — firmware_survival
# (61 passed), board_io_button_stimulus, the tier-1 suites — are unchanged
# by it. A future live re-capture should agree BETTER than the last one,
# since the CPU now runs IT blocks the way the silicon that produced the
# capture does.
#
# Re-stamped again for the EFR32 silicon capture work: `i2c.rs` gained a
# `txc` and a `bus_idle_known` field and corrected `STATE`/`STATUS`/`IF`
# reset values — ALL inside `Efr32s2I2c`, whose variant these boards never
# construct. The STM32 arms are untouched; only the file's digest moved.
#
# Digest re-stamped the same day for a follow-up commit that is TEST-ONLY:
# a `!(x == 1)` simplification in the IT-block test itself, a feature-gated
# match arm in i2c.rs, and a doc comment moved back onto the enum it
# documents in spi.rs. No executable path moved, so nothing above changes.
#
# Re-stamped 2026-08-22 a THIRD time, for GPIO_TIMERROUTE. The shared
# pad-claim table moved out of the Nordic module (`NrfPinClaims` is now an
# alias for `PadClaims`) and `GpioPort`'s claim field was generalised, so
# `gpio.rs` and the nRF files moved. ⚠️ Behaviour on these boards is
# unchanged: the nRF52 pad tests, the STM32 AFR path and every `bus_
# visibility` row pass untouched — an STM32 pad still answers from its own
# AFR nibble and never consults a claim table.
#
# Re-stamped 2026-08-22 AGAIN, for the EFR32 I²C/SPI wire narration: both
# `i2c.rs` and `spi.rs` gained a `PadLines` cell and a narrator call on the
# `Efr32s2*` arms, plus `Efr32s2SpiRegs` fields. The STM32 arms are
# untouched, these boards never construct the EFR32 variants, and the STM32
# waveform gates (`stm32h5_reset_values_match_silicon`, the L4 I²C
# narration tests, `bus_visibility` for every stm32 row) pass unchanged.
#
# Re-stamped 2026-08-22 for the EFR32MG26 reset-value corrections. `i2c.rs`
# and `spi.rs` both moved, and both edits are confined to their `Efr32s2*`
# arms: the I2C IPVERSION constant, and in spi.rs a hand-written `Default`
# for `Efr32s2SpiRegs` plus a `txc` flag so `STATUS` stops asserting TXC
# before anything has been transmitted. `SpiRegs::Stm32*` and the STM32 I2C
# layouts are not touched — these boards never construct the EFR32 variant,
# and the STM32 reset-value tests (`stm32h5_reset_values_match_silicon`,
# `test_i2c_reset_values`) pass unchanged.
#
# Re-stamped 2026-08-22 for explicit wrapping ops on GUEST arithmetic.
# `cortex_m.rs` and `riscv.rs` replace `+`/`<<` with `wrapping_add`/`wrapping_shl`
# at sites where the guest ISA specifies modulo-2^32 behaviour: exception entry
# and return stacking (`frame_ptr + 4..32`), branch target `pc + 4 + offset`,
# `vtor + n*4`, the BL link address, and the RISC-V vectored trap base and
# SLLI/SRLI/SRAI shifts (shamt is masked to 5 bits at decode).
#
# `a + b` and `a.wrapping_add(b)` differ ONLY when the op overflows, which under
# `overflow-checks = true` was a PANIC, never a wrong value. So no silicon-anchored
# register can have moved: every input that used to produce a number still produces
# the same number. Four inputs that used to CRASH the simulator now wrap the way the
# part does — see the four new tests (`armv7m_exception_entry/return_wraps_the_stack
# _frame`, `armv7m_branch_wraps_at_the_signed_pc_boundary`,
# `riscv_vectored_trap_wraps_at_the_top_of_the_address_space`). Confirmed by
# restoring one site to `+`: it panics at cortex_m.rs:1367 `attempt to add with
# overflow`.
#
# Ran: labwired-core --lib 3260 pass / 0 fail, and nrf52_timer_walk_differential,
# stm32f401/stm32l476_walk_differential, kw41z_walk_free_differential. This is an
# ack, not a capture — no live re-capture was made.
# Re-stamped 2026-08-22 for the EFR32 walk-free migration. Two files these
