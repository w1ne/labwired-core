id: litex-vexriscv
# 2026-10-19: first RISC-V soft-core SoC in the engine (LiteX VexRiscv,
# RV32IM). SIM-DERIVED — no silicon capture and no executing-fidelity
# differential: the modelled surface is CPU + memory + the LiteX UART
# console path and the LiteX countdown timer; the SPI-flash, Ethernet and
# MMCM CSR windows are declared stubs (the smoke prints one of those
# readbacks). See
# docs/boards/litex-vexriscv.md and examples/litex-vexriscv/VALIDATION.md.
doc: docs/boards/litex-vexriscv.md
chip: configs/chips/litex-vexriscv.yaml
tier: smoke-manual
offline_tests:
  - "firmware_survival::test_litex_vexriscv_smoke_survival"
models:
  - crates/core/src/cpu/riscv.rs
  - crates/core/src/decoder/riscv.rs
  - crates/core/src/peripherals/uart.rs
  - crates/core/src/peripherals/litex_timer.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/bus/from_config.rs
  - crates/core/src/bus/profiles.rs
  - crates/core/src/peripherals/generic_factory.rs
  - crates/core/src/system/riscv.rs
  - crates/core/src/system/builder/riscv.rs
  - crates/firmware-litex-vexriscv-smoke
  - configs/chips/litex-vexriscv.yaml
  - configs/systems/litex-vexriscv.yaml
