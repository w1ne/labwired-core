  - crates/core/src/decoder/arm.rs
  - crates/core/src/peripherals/gpio.rs
  - crates/core/src/peripherals/sam/sercom_usart.rs
  # 2026-11-08: SERCOM3 (Wire) and SERCOM4 (SPI) on the Arduino Zero roles.
  - crates/core/src/peripherals/sam/sercom_i2cm.rs
  - crates/core/src/peripherals/sam/sercom_spi.rs
  # 2026-11-08: the ADC conversion slice (arduino-matrix L5).
  - crates/core/src/peripherals/sam/adc21.rs
  # 2026-11-08: TCC0..2 and their NPWM pad wire (arduino-matrix L6).
  - crates/core/src/peripherals/sam/tcc.rs
  - crates/core/src/peripherals/esp_ledc_wave.rs
  - configs/chips/atsamd21g18a.yaml
  # 2026-09-21, model_paths_drift_gate: models this board REGISTERS that
  # its list omitted, so they were invisible to the drift digest. This
  # board records no silicon capture, so there is no "silicon-verified"
  # claim for the corrected digest to invalidate — no ack is implied.
  - crates/core/src/peripherals/declarative.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/peripherals/systick.rs
  # Every `path:` the chip yaml wires must be listed, or the drift gate
  # reads this board as fresh forever — the esp32c3 hole in the header.
  - configs/peripherals/atsamd21g18a/pm.yaml
  - configs/peripherals/atsamd21g18a/sysctrl.yaml
  - configs/peripherals/atsamd21g18a/gclk.yaml
  - configs/peripherals/atsamd21g18a/wdt.yaml
  - configs/peripherals/atsamd21g18a/nvmctrl.yaml
  - configs/peripherals/atsamd21g18a/dac.yaml
  # 2026-11-19: the USB device model and its scripted host (Nano 33 IoT).
  - crates/core/src/peripherals/sam/usb21.rs
  - crates/core/src/peripherals/usb_host.rs
