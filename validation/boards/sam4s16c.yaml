id: sam4s16c
# 2026-10-23: SAM4S Xplained (ATSAM4S16C, Cortex-M4; 1 MiB flash at
# 0x00400000, 128 KiB SRAM at 0x20000000). First SAM4S part: the PMC
# (sam4s_pmc) and the older SAM4S PIO block (sam4s_pio, not the SAM D21
# PORT), UART0/1/USART0/1 on the `sam` layout; TC/SPI/TWI/EEFC and the
# system controller are declared stubs. SIM-DERIVED — no SAM4S bench part.
# See docs/boards/sam4s-xplained.md and examples/sam4s-xplained/VALIDATION.md.
doc: docs/boards/sam4s-xplained.md
chip: configs/chips/sam4s16c.yaml
tier: smoke-manual
offline_tests:
  - "firmware_survival::test_sam4s_xplained_smoke_survival"
models:
  - crates/core/src/cpu/cortex_m.rs
  - crates/core/src/decoder/arm.rs
  - crates/core/src/peripherals/sam4s.rs
  - crates/core/src/peripherals/uart.rs
  - crates/core/src/peripherals/systick.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/bus/from_config.rs
  - crates/core/src/bus/profiles.rs
  - crates/core/src/peripherals/generic_factory.rs
  - crates/core/src/system/builder/arm.rs
  - crates/firmware-sam4s-xplained-smoke
  - configs/chips/sam4s16c.yaml
  - configs/systems/sam4s-xplained.yaml
