  - crates/core/src/peripherals/esp32/i2c.rs
  - crates/core/src/peripherals/esp32/ledc.rs
  - crates/core/src/peripherals/esp32/mcpwm.rs
  # 2026-11-08: the PCNT pulse counter (was a round-trip stub), inputs from
  # the GPIO input matrix. No silicon capture on this board.
  - crates/core/src/peripherals/esp32/pcnt.rs
  # 2026-11-10: classic RMT TX → GPIO (was a system_stub). This board
