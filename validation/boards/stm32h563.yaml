# 2026-08-21 (CPU): `cpu/cortex_m.rs` — a CORRECTNESS FIX, not a
# refactor, and it changes what firmware does. The nine 16-bit T1
# data-processing encodings ADC/AND/BIC/EOR/MUL/MVN/ORR/RSB/SBC set flags
# unconditionally; their `setflags` is `!InITBlock()`. Leaking them
# corrupted the CONDITION of every instruction still to run in the same IT
# block. Measured on real gcc output: an `orrls` before a `strls` in one
# `itt ls` cleared Z, so the store never ran and a peripheral register was
# silently never written. LSL and the arithmetic forms already carried the
# guard (with a note citing an earlier H563/WBA52 regression); these nine
# did not.
