# 2026-07-31: I2C transaction dispatch in peripherals/i2c.rs gained `claims_address` /
# `select_address` hooks so a bus switch (TCA9548A) can answer for addresses
# reachable behind an enabled channel. The DEFAULT `claims_address` is
# `self.address() == addr` — the exact predicate the previous
# `position(|d| d.borrow().address() == addr)` lookup used — so every existing
# device dispatches byte-identically; only the switch overrides it. No register
# read/write path, reset value, layout or base address changed. Evidence re-run
# on this commit: full `cargo test -p labwired-core` green, 82 test binaries, 0
# failures. No live re-capture.
# 2026-07-31: crates/core/src/peripherals/i2c.rs — slave resolution moved from a
# flat `d.address() == addr` first-match to `d.claims_address(addr)` plus a
# `select_address` hook at the dispatch sites (#720), so a TCA9548A bus switch
# can route for itself instead of every controller growing a tree resolver.
# DISPATCH ONLY: both hooks are defaulted on the `I2cDevice` trait —
# `claims_address` defaults to `self.address() == addr` and `select_address` to a
# no-op — so with no mux on the bus the resolution is byte-identical to the code
# it replaces. No I2C register layout, base address, reset value or MMIO
# read/write path moved. Which slave answers an address is on the far side of the
# wire, outside a reset-value/register-sweep capture, so no captured value can
# move. Evidence: the new per-family mux coverage drives a real transaction
