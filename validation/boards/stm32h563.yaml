# 2026-11-05: reviewed G0 DMA extension in shared UART/DMA source. Strict
# channel completion/circular/IRQ semantics are opt-in (profile: stm32g0);
# existing constructors retain their legacy profile. The bus completion
# hook defaults to no-op. Timed UART adds real DMAR/DMAT requests, documented
# DDRE/OVRDIS receive policies and consumed-wake rearming; byte-stream
# capture paths retain their behavior. G0 DMA register/fault/reset tests,
# existing DMA walk/event differential and G071 DMAMUX gates pass. Real
# CMSIS/HAL ELF recovery and one-action tests are model evidence only.
# No live silicon capture; preserve capture dates, ack age and expiry.
# 2026-11-05 (#1702): TIOL112 attachment changes the shared UART/RCC file
# digests. RCC clock publication is opt-in and STM32G0-only; the existing
# H5/L4/L0/F1/F4 RCC implementations are unchanged. UART EN/CQ gating and
# local echo apply only when a TIOL112 is attached (None by default); these
# boards do not attach one. The existing per-board offline MMIO/parity
# regression targets are the supporting software evidence. This is a
# reviewed model-drift acknowledgment, NOT a new silicon capture; no
# capture date, asserted hardware scope, existing ack date or expiry is
# extended. Live recapture remains pending on the existing schedule.
# 2026-09-16 (#1128): Cortex-M browser JIT rides `Machine::advance_with_window_runner` — the advance loop now plans and commits the window (tick cadence, reset drains, idle fast forward) and a compiled backend only supplies the instruction stream; the JIT batch gates (takeable exception, SysTick crossing, SYSRESETREQ latch) become public for `jit-framework` so the browser adapter refuses the same windows `run_jit_loop` does. In `cortex_m.rs`: `note_chained` only counts a chain that retired instructions, `sysreset_latched` is pub. Interpreter path unchanged — the gates are the ones `run_jit_loop` already used; pinned by `cortex_m_jit_alu_lockstep` and new window-runner cadence tests. No silicon capture pins JIT.
# 2026-09-16 (#1125): Cortex-M JIT follow-ups (block chaining, floor 4, IT-predicated ALU, VFP S-ALU, VLDR/VSTR, LDR.W PC), plus two model fixes that ride along: the bit-band alias decode no longer swallows peripherals vendors place inside 0x4200_0000 (SAMD51 QSPI/SERCOM), and the STM32 timer's scheduled compare pend lands on the latch tick like the walk. JIT is opt-in (`cortex_m_jit_enabled` default off); interpreter path unchanged, JIT-on vs off lockstep in cortex_m_jit_nrf_differential; both fixes pinned by bus-level gates. No silicon capture pins JIT.
# 2026-09-15: Cortex-M JIT SysTick countdown clamp (`block_would_cross_irq`). ticks_until_fire math unchanged; consume_cycles is JIT-only and no-ops in scheduler mode. Interpreter/silicon path unchanged.
# 2026-09-15 (#1124): gpio.rs gained SAM PORT / RA PORT / i.MX GPIO families behind profile discriminants the STM32 construction path never sets. No silicon-visible STM32 behaviour change.
# 2026-09-15 (#1073): NVIC level-sensitive pending follows the IRQ line down (timer SR&DIER); software ISPR pends still fire once. Matches STM32 silicon; F103 integration tests. Re-capture still owed.
# 2026-09-15 (#1120): Cortex-M wasm-JIT is opt-in (`cortex_m_jit_enabled` default off). Interpreter path unchanged; JIT-on vs off lockstep in cortex_m_jit_nrf_differential. No silicon capture pins JIT.
