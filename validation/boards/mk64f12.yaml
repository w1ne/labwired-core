id: mk64f12
# 2026-10-29: FRDM-K64F (MK64FN1M0VLL12, Cortex-M4F; 1 MiB flash at
# 0x00000000, 64 KiB SRAM_L at 0x1FFF0000 + 192 KiB SRAM_U at
# 0x20000000). UART-only L1 slice: the classic Kinetis UART0-4 block,
# Kinetis GPIO A-E (PDOR/PSOR/PCOR/PDIR/PDDR) and the behavioural MCG FEI
# clock. SIM clock gating, PORT pad mux/pulls and MCG PLL/FEE are not
# modelled; ENET+KSZ8081, RNGA and FTFE are declared stubs; eDMA, PIT/FTM,
# I2C/SPI, ADC/DAC, USB, CAN and SDHC are not mapped (access faults).
# 2026-10-30: stock Zephyr v3.7.0 boots (crates/firmware-frdm-k64f-zephyr,
# byte-identical rebuilds): hello_world, plus tests/drivers/uart/uart_basic_api
# (the suite Renode's NXP-K64F.robot runs) passes 7/7 with injected input.
# New for this: MCG `k6x` profile (PLL0 PLLST/LOCK0, PEE CLKST=11), the
# Kinetis UART C2 TIE/TCIE/RIE interrupts, and SVD register files for
# SYSMPU, PMC and OSC (no MPU protection modelled).
# 2026-10-31: stock Zephyr v3.7.0 samples/synchronization also runs
# (tests/fixtures/mk64f12-zephyr-sync.elf, same build script, no model
# change): SysTick k_msleep timeouts, semaphore hand-off and PendSV
# switches, asserted by examples/frdm-k64f/zephyr-sync.yaml in ci/test.sh.
# 2026-10-31: stock Zephyr v3.7.0 tests/net/tcp (Renode NXP-K64F.robot's
# TCP case) passes 19/19 over its dummy L2
# (tests/fixtures/mk64f12-zephyr-net-tcp.elf, examples/frdm-k64f/zephyr-net-tcp.yaml).
# New: the RNGA is `kinetis_rnga` (instant refill, deterministic samples, no
# error IRQ), which Zephyr's entropy_mcux_rnga spins on. ENET is still a stub.
# SIM-DERIVED — no K64F bench part. See
# docs/boards/frdm-k64f.md and examples/frdm-k64f/VALIDATION.md.
doc: docs/boards/frdm-k64f.md
chip: configs/chips/mk64f12.yaml
tier: smoke-manual
offline_tests:
  - "firmware_survival::test_frdm_k64f_smoke_survival"
  - "firmware_survival::test_frdm_k64f_zephyr_survival (stock Zephyr hello)"
  - "mcg::tests (k6x PLL0) + uart::tests::test_kinetis_uart_c2_interrupt_enables"
models:
  - crates/core/src/cpu/cortex_m.rs
  - crates/core/src/decoder/arm.rs
  - crates/core/src/peripherals/uart.rs
  - crates/core/src/peripherals/gpio.rs
  - crates/core/src/peripherals/mcg.rs
  - crates/core/src/peripherals/systick.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/peripherals/kinetis_rnga.rs
  - crates/core/src/bus/from_config.rs
  - crates/core/src/bus/profiles.rs
  - crates/core/src/peripherals/generic_factory.rs
  - crates/core/src/system/builder/arm.rs
  - crates/core/src/peripherals/declarative.rs
  - crates/firmware-frdm-k64f-smoke
  - crates/firmware-frdm-k64f-zephyr
  - configs/chips/mk64f12.yaml
  - configs/peripherals/mk64f12/sysmpu.yaml
  - configs/peripherals/mk64f12/pmc.yaml
  - configs/peripherals/mk64f12/osc.yaml
  - configs/systems/frdm-k64f.yaml
