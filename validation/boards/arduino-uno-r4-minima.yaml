id: arduino-uno-r4-minima
doc: docs/boards/arduino-uno-r4-minima.md
chip: configs/chips/ra4m1.yaml
tier: smoke-manual
note: "Arduino Uno R4 Minima (Renesas R7FA4M1AB). Bare-metal UART/LED smoke prints OK on SCI2 (D0/D1) after the HOCO/OSCSF bring-up; USBFS is a stub. First Renesas RA part in the engine. SIM-DERIVED — no silicon diff; no executing-fidelity differential."
offline_tests:
  - "firmware_survival::test_ra4m1_uno_r4_smoke_survival"
models:
  - crates/core/src/cpu/cortex_m.rs
  - crates/core/src/decoder/arm.rs
  - crates/core/src/peripherals/gpio.rs
  - crates/core/src/peripherals/ra_clock.rs
  - crates/core/src/peripherals/ra_pfs.rs
  - crates/core/src/peripherals/uart.rs
  - configs/chips/ra4m1.yaml
  - configs/systems/arduino-uno-r4-minima.yaml
  # 2026-09-21, model_paths_drift_gate: models this board REGISTERS that
  # its list omitted, so they were invisible to the drift digest. This
  # board records no silicon capture, so there is no "silicon-verified"
  # claim for the corrected digest to invalidate — no ack is implied.
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/peripherals/systick.rs
  # 2026-11-08, model_paths_drift_gate: the stock-Arduino UNO R4 row put
  # ICU, AGT, IIC, GPT, ADC14, RSPI and CAN0 on the shared ra4m1.yaml, so this
  # board registers them too. Still no silicon capture, so no ack.
  - crates/core/src/peripherals/ra_adc12.rs
  - crates/core/src/peripherals/ra_agt.rs
  - crates/core/src/peripherals/ra_can.rs
  - crates/core/src/peripherals/ra_gpt.rs
  - crates/core/src/peripherals/ra_icu.rs
  - crates/core/src/peripherals/ra_iic.rs
  - crates/core/src/peripherals/spi.rs
