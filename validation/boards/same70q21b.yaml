id: same70q21b
# 2026-10-30: Microchip SAM E70 Xplained (ATSAME70Q21B, Cortex-M7; 2 MiB
# flash at 0x00400000, 384 KiB SRAM at 0x20400000). First SAM E70 part.
# Reuses the SAM4S PMC (sam4s_pmc) and PIO (sam4s_pio) models, whose
# register layouts the SAM E70 keeps, at the SAM E70 bases; UART0-4 and
# USART0-2 on the `sam` layout. EEFC, the RSTC/SUPC/RTT/WDT/RTC system
# controller and the bus matrix are declared stubs; GMAC, TRNG, TC, SPI,
# QSPI, TWIHS, MCAN, AFEC, DACC, PWM, HSMCI, SSC, USBHS and XDMAC are not
# mapped. SIM-DERIVED — no SAM E70 bench part. See
# docs/boards/sam-e70-xplained.md and examples/sam-e70-xplained/VALIDATION.md.
# 2026-10-30 (feat/same70-zephyr-hello): stock Zephyr v3.7.0 hello_world
# and synchronization boot unmodified. New: the Cortex-M7 L1 cache model
# (cortex_m7_cache: SCB CLIDR/CTR/CCSIDR/CSSELR geometry + no-op
# maintenance window at 0xE000EF50), the PMC clock generator (CKGR_MOR
# key, PLLA/PLLB/UPLL lock, PMC_SR derived) and CHIPID (declarative,
# rev-B CIDR). Still SIM-DERIVED.
doc: docs/boards/sam-e70-xplained.md
chip: configs/chips/same70q21b.yaml
tier: smoke-manual
