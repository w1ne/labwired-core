id: arty-litex-vexriscv
# 2026-10-22: Digilent Arty A7-35T running the LiteX VexRiscv SoC. The SoC
# surface is the litex-vexriscv set plus the board's Control-and-Status
# block (Leds/Switches/ButtonsStatus/ButtonsPending/ButtonsEnabled), so the
# smoke proves the LED walk with CSR readback, the switch/button levels and
# the pending/enable registers. SIM-DERIVED — no bitstream capture and no
# executing-fidelity differential. See docs/boards/arty-litex-vexriscv.md
# and examples/arty-litex-vexriscv/VALIDATION.md.
doc: docs/boards/arty-litex-vexriscv.md
chip: configs/chips/arty-litex-vexriscv.yaml
tier: smoke-manual
offline_tests:
  - "firmware_survival::test_arty_litex_smoke_survival"
models:
  - crates/core/src/cpu/riscv.rs
  - crates/core/src/decoder/riscv.rs
  - crates/core/src/peripherals/uart.rs
  - crates/core/src/peripherals/litex_timer.rs
  - crates/core/src/peripherals/litex_control_status.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/bus/from_config.rs
  - crates/core/src/bus/profiles.rs
  - crates/core/src/peripherals/generic_factory.rs
  - crates/core/src/system/riscv.rs
  - crates/core/src/system/builder/riscv.rs
  - crates/firmware-arty-litex-smoke
  - configs/chips/arty-litex-vexriscv.yaml
  - configs/systems/arty-litex-vexriscv.yaml
