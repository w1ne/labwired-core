id: stm32f7-discovery
doc: docs/boards/stm32f7-discovery.md
chip: configs/chips/stm32f746.yaml
tier: smoke-manual
note: "STM32F7 Discovery (32F746GDISCOVERY / STM32F746NG). Soft-float bare-metal UART/LED smoke prints OK on USART1 (ST-LINK VCP) after RCC AHB1/APB2 ungating and toggles PI1; LTDC/Ethernet/DMA2D/USB/QuadSPI are stub windows. SIM-DERIVED — no silicon diff; no executing-fidelity differential."
offline_tests:
  - "firmware_survival::test_stm32f746_discovery_smoke_survival"
models:
  - crates/core/src/cpu/cortex_m.rs
  - crates/core/src/decoder/arm.rs
  - crates/core/src/peripherals/gpio.rs
  - crates/core/src/peripherals/rcc.rs
  - crates/core/src/peripherals/uart.rs
  - configs/chips/stm32f746.yaml
  - configs/systems/stm32f7-discovery.yaml
  # 2026-09-21, model_paths_drift_gate: models this board REGISTERS that
  # its list omitted, so they were invisible to the drift digest. This
  # board records no silicon capture, so there is no "silicon-verified"
  # claim for the corrected digest to invalidate — no ack is implied.
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/peripherals/systick.rs
