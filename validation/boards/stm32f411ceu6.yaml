doc: docs/boards/stm32f411.md
chip: configs/chips/stm32f411ceu6.yaml
tier: sim-validated
note: "STM32F411CEU6 (WeAct Black Pill) — same silicon row as the STM32F401 (RM0383 vs RM0368: identical peripheral bases and IRQ numbers) with three deltas: 512 KiB flash, 128 KiB SRAM, and the extra SPI5 instance @ 0x4001_5000 IRQ 85. Required NO new peripheral model and NO new RCC layout: the F411 RCC offsets (AHB1ENR 0x30, APB1ENR 0x40, APB2ENR 0x44) were read out of the vendored SVD and are byte-identical to the shipped stm32f4 profile, and SPI5 reuses the existing classic-SPI IP. The tier-1 fixture (tests/fixtures/tier1/stm32f411.elf) drives raw-register self-tests and reports clock/gpio/timer/i2c/spi/adc/wdt/rtc PASS plus a working UART over USART2; its spi check covers SPI1 AND SPI5. SIM-DERIVED: there is NO F411 bench part, NO ST-Link capture and NO silicon diff — every value comes from ST's CMSIS header (stm32f411xe.h) and modm-io's F411 SVD. THREE THINGS ARE EXPLICITLY UNVERIFIED AND MUST NOT BE READ AS CLAIMS: (1) the DBGMCU IDCODE is in neither source, so dbg ships as a stub with NO IDCODE and none was invented (F401CDU6's 0x10016433 is F401's); (2) the Black Pill LED PC13 / button PA0 pinout is carried over from the F401 board and is a board-level fact no chip source can settle; (3) the 100 MHz max SYSCLK is unrepresentable in the schema (the stm32f4 RCC model derives no frequency) and is documentation only. Clock gating is declared only for TIM2/ADC1/SPI1/SPI5 — the four gates the fixture proves; every other block responds unclocked, the same modelling gap the F401 descriptors carry. DMA1/2 stay stubs because the F4 stream controller is not the modelled F1/L4 channel IP. SPI5's clock-gate bit (RCC_APB2ENR bit 20) is header-only: no public F411 SVD declares an SPI5EN field, so the fixture's spi check is its only executable evidence."
offline_tests:
  - "tier1 fixture (clock/gpio/timer/i2c/spi/adc/wdt/rtc PASS + uart via TIER1 done)"
  - "io-smoke (examples/stm32f411ceu6-blackpill: asserts the TIER1 transcript over USART2)"
  - "chip_conformance (estate OK — no peripheral window faults)"
  - "register_coverage (scanned against the vendored modm-io SVD, 56 IRQs)"
# 2026-07-28: three model corrections toward silicon, all found by running
# real Arduino-core firmware on the sim (not by a fixture):
#   gpio.rs  - IDR now reports the PIN level, so a push-pull output reads
#              back the level it drives, instead of a private latch.
#   i2c.rs   - optional ERROR-line NVIC vector, plus correct SR1 rc_w0 and
#              read-only SR2 write semantics (a raw SR1 assignment had let
#              a HAL flag-clear SET every other flag).
#   spi.rs   - full-duplex frames now always complete the receive (RXNE/RXP
#              + data register) instead of gating on an attached slave.
# None of these paths are pinned by this board's frozen capture, which
# covers reset values and register sweeps rather than output-pin readback
# or full-duplex RX events: labwired-hw-oracle (27/27) and chip_conformance
# pass unchanged. No live re-capture this session; re-capturing IDR readback
# and SPI RX behaviour is tracked.
# 2026-08-10 RP2040 probe re-binding (shared bus files). accessors.rs now
# brackets an IO_BANK0 GPIOn_CTRL write with the SIO tap snapshot/report
# pair so a probe armed before firmware muxes a pad follows the new source.
# For THIS board the bracket is inert: begin_rp2040_io_bank0_write() type-
# checks the peripheral against Rp2040IoBank0 and returns None otherwise, so
# no register read/write path, reset value or layout is touched. The source
# digest moved because a shared file's commit date moved; the model did not.
# No live re-capture is evidenced here.
# 2026-08-09: rides the nRF52 SPIM PSEL fix. peripherals/spi.rs is on this
# board's watch list so its digest moved, but every edit is inside
# `Nrf52SpiRegs` — an nRF-only struct this board's Stm32* layouts do not
# use. Recorded explicitly because `--write-ack-digests` re-stamps EVERY
# ack, which would otherwise have widened this one to cover a change
# nobody had written down.
# 2026-08-12 (#959): peripherals/adc.rs — the F1 regular-channel select moved
# to SQR3 SQ1[4:0] (RM0008 §11.12.14) and ADC_SQR3 is newly stored/readable
# @ 0x34. This board's ADC1 runs the F1 layout (no profile override in its
# chip yaml), so the arm IS reachable here — but the tier-1 fixture's adc
# cell (ADON/SWSTART -> EOC -> DR != 0, nothing injected) converts channel 0
# under the SQR3 reset value exactly as before, and DR = 1 either way.
# Recorded explicitly for the same reason as the 2026-08-09 note:
# `--write-ack-digests` re-stamps every ack, and this digest now covers the
# #959 adc.rs content. No silicon capture exists to re-run (sim-derived
# board); the tier-1 fixture lane is the evidence and passes unchanged.
# 2026-08-13 (#962): the chip descriptor now declares the clock its core
# runs at (`ChipDescriptor::cpu_hz`), which moved every configs/chips/*.yaml
# and this board's digest with them. NOTHING THIS CAPTURE PINS MOVED: the
# field is declarative and no peripheral model reads it, and a new test
# (cpu_hz_single_source) asserts the descriptor agrees with the peripheral
# constants rather than replacing them. What consumes the clock is the
# external-device attach path (DHT22, HC-SR04, rotary encoder, WS2812), and
# no silicon capture covers any of those. The digest is re-stamped here so
# this ack names content a human actually read; no live re-capture owed for
# this change, and any already owed above still is.
drift_ack: 2026-09-14
# 2026-08-22: the Thumb-2 decoder gained SMLABB/BT/TB/TT and SMULBB/BT/TB/TT
# (ARMv7-M A7.7.166/171). They were UNDECODED, which in this core means a
# silent no-op — `digitalWrite` on EFR32MG26 computes its port base with
# SMLABB and was writing to a garbage address, so blink did not blink.
# Purely additive: one new `else if` in decoder/arm.rs and one new match arm
# in cortex_m.rs; `git diff` removes no existing line, so every encoding that
# decoded before decodes identically now.
# ⚠ MEASURED, NOT ASSUMED, because a newly-decoded instruction genuinely does
# change behaviour for firmware that executes it — this is the one drift note
# in this file where "additive" is not by itself an argument. All 96 committed
# ELF fixtures were disassembled: exactly ONE contains the family, the
# `smulbb r0, r1, r0` divide-by-3 in
# crates/wasm/tests/fixtures/firmware-l476-bldc-six-step.elf, and its committed
# golden trace (crates/wasm/tests/fixtures/motor-parity-native.json) still
# matches. No other pinned firmware on any board reaches the encoding, so
# nothing a silicon capture asserts moved. No live re-capture is evidenced here.
