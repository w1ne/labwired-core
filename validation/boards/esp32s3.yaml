# 2026-07-28: the UART twin moved from peripherals/esp32s3/uart.rs to the
# chip-neutral peripherals/esp_uart.rs (struct Esp32s3Uart -> EspUart, with
# esp32s3::uart re-exporting the old name so every S3 call site is
# unchanged). The ESP32-C3 carries the identical UART IP and now wires the
# same model, and the arch-isolation gate forbids a chip module reaching
# into another chip's — hence chip-neutral rather than an allow-list entry.
# TWO BEHAVIOURAL DELTAS, both shared with the S3:
#   * TX drain is measured in CYCLES, not tick calls. It was `drain_accum
#     += 1` per tick(), so the baud rate silently scaled with
#     peripheral_tick_interval (64x slow at interval 64, 512x at the
#     browser's 512) and the walk disagreed with the scheduler by the event
#     phase. Now the walk takes the batched interval via tick_elapsed() and
#     the scheduler anchors to absolute cycles from the push that filled the
#     FIFO. Caught by esp32c3_walk_differential's uart0 gate, which diverged
#     on ONE character of the boot log (an ESP-IDF timestamp, 4696 vs 4697
#     ms) — that gate is now byte-identical at interval 1 and framebuffer-
#     identical at 64. cycles_per_byte() also takes the core clock as a
#     constructor argument (S3 240 MHz unchanged, C3 160 MHz).
#   * rx_buffer() added, so attach_uart_rx_source[_named] resolve the twin
#     and `uart_injections:` reaches it; and attach_uart_tx_sink[_named] can
#     now SILENCE the stdout echo (never enable it — console-ness is still
#     decided at construction), so capture-only callers stop double-echoing.
# Register map, reset values and the 9-reg reset-state anchor are untouched;
# esp32s3 reset conformance + the GDMA UART-TX descriptor tests pass. No S3
# board attached; no live re-capture.
# 2026-07-31: I2C transaction dispatch in esp32s3/i2c.rs gained `claims_address` /
# `select_address` hooks so a bus switch (TCA9548A) can answer for addresses
# reachable behind an enabled channel. The DEFAULT `claims_address` is
# `self.address() == addr` — the exact predicate the previous
# `position(|d| d.borrow().address() == addr)` lookup used — so every existing
# device dispatches byte-identically; only the switch overrides it. No register
# read/write path, reset value, layout or base address changed. Evidence re-run
# on this commit: full `cargo test -p labwired-core` green, 82 test binaries, 0
# failures. No live re-capture.
# 2026-07-31: crates/core/src/peripherals/esp32s3/i2c.rs — slave resolution moved
# from a flat `d.address() == addr` first-match to `d.claims_address(addr)` plus a
# `select_address` hook at both the command-list dispatch and the `SLAVE_ADDR`
# fallback (#720), so a TCA9548A bus switch can route for itself. DISPATCH ONLY:
# both hooks are defaulted on the `I2cDevice` trait — `claims_address` defaults to
# `self.address() == addr` and `select_address` to a no-op — so with no mux on the
# bus the resolution is byte-identical to the code it replaces. Register map,
# reset values and the 9-reg reset-state anchor are untouched; esp32s3 reset
# conformance passes. No S3 board attached; no live re-capture.
# 2026-08-01: two shared-path changes, neither an S3 peripheral.
# `crates/core/src/peripherals/esp_xtensa_common/rom_thunks.rs` gained the
# wide-`movi` shape in `repin_loop_task` (a classic-ESP32 firmware-image
