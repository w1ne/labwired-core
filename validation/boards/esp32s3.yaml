# SPIMEM1 flash-command model fix: SPI_MEM_ADDR_REG is read right-justified
# (was wrongly >>8) and the dual/quad fast-read opcodes (0x3B/0xBB/0x6B/0xEB)
# are now decoded, so a 2nd-stage bootloader (MCUboot) reads slot0 and
# unmodified Zephyr boots on S3 + C3. Behavioural only — no register
# reset-value change, so the 9-reg reset-state silicon anchor is unaffected.
# Corroborated: the tier1 esp32s3 prebuilt-image rom-boot still passes all
# self-tests (loads app from 0x10000). No live SWD re-capture this session
# (no S3 board attached; a real C3 was used to dump the C3 mask ROM).
# 2026-07-05: added runtime-snapshot serialization to esp32s3/flash_xip.rs
# (Esp32s3MmuTable) + esp32s3/systimer.rs + the Xtensa CPU snapshot path, for the
# app-entry boot cache. Pure (de)serialization of existing MMU/counter/register
# state, invoked only on snapshot/resume — normal-run behaviour and the 9-reg
# reset-state silicon anchor are byte-for-byte unaffected. Covers the model-file
# touch; no live re-capture warranted.
# 2026-07-06: SYSTIMER gained scheduler/elapsed-cycle execution so C3/S3 idle
# fast-forward can jump directly to alarm deadlines instead of polling every
# CPU cycle. The register layout, reset values (including CONF=0x46000000),
# level IRQ semantics, and one-cycle tick equivalence are preserved by offline
# elapsed-vs-repeated-tick tests; no live USB-JTAG re-capture this session.
# 2026-07-07: SYSTIMER gained a per-instance scheduler-mode flag so C3 ROM boot
# can force legacy ticking while the default S3 constructor remains
# scheduler-driven. S3 reset values/MMIO semantics are unchanged; unit coverage
# asserts default scheduler behaviour and snapshot compatibility.
# 2026-07-09: universal logic analyzer — additive read_gpio_pad pad probe (ENABLE-mask direction) + I2C controller wraps attached slaves in TracingI2cDevice (shared bus trace) and signals START to the selected slave at address match so traces carry decodable address frames. Register map/reset values byte-for-byte untouched; conformance/e2e unchanged. No live re-capture.
# 2026-07-10: bus-trace single-choke-point refactor (attach wraps at SystemBus::attach_i2c_slave/attach_spi_device; no per-callsite set_bus_trace) + cycle stamp on trace events + gpio_routing/pin_routing metadata. Additive; oracle output unchanged.
# 2026-07-11: walk-free Class-A sweep — asserted needs_legacy_walk()==false on
# SpiMemFlash, FlashXipPeripheral, Esp32s3MmuTable and UsbSerialJtag (all
# verified structurally inert in the per-cycle walk: work happens at the MMIO
# access, tick() is the trait-default no-op). Pure walk-scheduling metadata —
# no register, reset-value, timing or IRQ change; the 9-reg reset-state
# silicon anchor is unaffected. No live re-capture warranted.
# 2026-07-12: walk-free C3 SYSTIMER batch — the shared SYSTIMER model
# (esp32s3/systimer.rs) gained a bus-published CycleClock handle (fresh
# OP-update snapshot on read) + matrix_irq_sources() (live level query) so a
# C3 SYSTIMER can migrate off the per-cycle walk: alarms fire as scheduled
# events routed through the C3 interrupt matrix. Register layout, reset
# values (CONF=0x46000000), alarm/level-IRQ semantics and one-cycle tick
# equivalence are preserved (elapsed-vs-repeated + walk-vs-scheduler
# differential gates). S3 default construction is unchanged. No live
