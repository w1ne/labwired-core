id: stm32f072
# 2026-10-23: STM32F072B-DISCO (STM32F072RBT6, Cortex-M0; 128 KiB flash
# at 0x08000000, 16 KiB SRAM at 0x20000000). First STM32F0 part: the F0
# RCC profile (RM0360), the v2 GPIO/USART blocks, the legacy SPI/I2C and
# the F1-shaped FLASH_R; USB/TSC/CRS are declared stubs. SIM-DERIVED — no
# STM32F072 bench part. See docs/boards/stm32f072b-disco.md and
# examples/stm32f072b-disco/VALIDATION.md.
