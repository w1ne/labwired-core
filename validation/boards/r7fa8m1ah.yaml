id: r7fa8m1ah
# 2026-10-30: Renesas EK-RA8M1 (R7FA8M1AH, Cortex-M85; 2 MiB code flash
# at 0x02000000, 896 KiB SRAM at 0x22000000). First RA8 part. New: the
# SCI_B UART layout (sci_b), the RA8 PFS with PWPR/PWPRS moved (ra8_pfs)
# and the SCICKCR handshake (ra8_sysc). PORT0-B reuse ra_port. MSTP, ICU,
# DMAC/DTC, FCACHE, FACI, ELC, RTC, IWDT/WDT, AGT, USBFS/USBHS, IIC, GPT,
# ADC12, ETHERC, SPI and CANFD are declared stubs; SCI0-8 and the remaining
# blocks are not mapped. Helium/MVE and TrustZone are not modelled.
# 2026-10-31: stock Zephyr v3.7.0 samples/hello_world and
# samples/synchronization for ek_ra8m1 boot (tests/fixtures/
# r7fa8m1ah-zephyr-{hello,sync}.elf, rebuilt byte-identical by
# crates/firmware-ek-ra8m1-zephyr/build.sh): Armv8.1-M DLS/WLS/LE
# low-overhead loops and CSEL/CSINC/CSINV/CSNEG in the Thumb-2 decoder,
# ra8_sysc as a full R_SYSTEM register file with derived OSCSF
# (HOCO/MOSC/PLL/PLL2) and the CKSREQ/CKSRDY handshake on every xxxCKCR,
# and the ICU WUPEN/IELSR window at 0x4000C000. SIM-DERIVED — no RA8M1
# bench part. See docs/boards/ek-ra8m1.md and
# examples/ek-ra8m1/VALIDATION.md.
# 2026-10-31 (feat/ek-ra8m1-agt-counter): the ICU IELSRn event link
# (ra_icu) and AGT0/AGT1 (ra_agt); stock Zephyr v4.0.0
# samples/drivers/counter/alarm (AGT0 compare match through IELSR84).
# 2026-11-01 (feat/ek-ra8m1-sci-irq): SCI3/SCI9 raise RXI/TXI/TEI as ELC
# events through the ICU (uart/sci_b_irq.rs) and read FRSR.R; stock
# Zephyr v3.7.0 tests/drivers/uart/uart_basic_api 7/7 on the
# interrupt-driven SCI_B driver.
# 2026-11-01 (feat/ek-ra8m1-zephyr-shell): stock Zephyr v3.7.0
# samples/subsys/shell/shell_module (interrupt-driven shell backend on
# SCI9) answers typed commands, TAB completion and history recall
# (examples/ek-ra8m1/zephyr-shell.yaml). No model change.
