id: mpfs095t
# 2026-11-01: Microchip PolarFire SoC Discovery Kit (MPFS095T). First RV64
# part and LabWired's first 64-bit RISC-V core (crates/core/src/cpu/
# riscv64.rs): one U54 hart (mhartid 1) as RV64IMAC + Zicsr/Zifencei in
# M-mode, with the CLINT (msip, mtimecmp, mtime at 1 MHz) inside the core,
# and the five MMUARTs as 16550s (4-byte stride, LCR.DLAB divisor
# latches). Unmodified Zephyr v4.1.0 hello_world, synchronization and
# tests/kernel/common (12 suites, 63/63) for mpfs_icicle/polarfire/u54 (the
# same MSS) boot from the DDR window at 0x8000_0000. F/D, S/U modes, Sv39,
# the PLIC and the other harts are not modelled; PLIC, MSS GPIO/I2C/SPI/QSPI
# and the system-controller mailbox are declared stubs. SIM-DERIVED — no
# MPFS bench part. See docs/boards/mpfs-disco-kit.md and
# examples/mpfs-disco-kit/VALIDATION.md.
doc: docs/boards/mpfs-disco-kit.md
chip: configs/chips/mpfs095t.yaml
tier: smoke-manual
offline_tests:
  - "firmware_survival::test_mpfs_disco_kit_zephyr_survival"
  - "riscv64_tests (15 tests: RV64I/M/A/C, traps, CLINT + MTI, WFI fast-forward, CSR surface, snapshot)"
  - "uart16550_dlab_routes_divisor_writes_to_the_latches"
models:
  - crates/core/src/cpu/riscv64.rs
  - crates/core/src/peripherals/uart.rs
  - crates/core/src/peripherals/stub.rs
  - crates/core/src/bus/from_config.rs
  - crates/core/src/bus/profiles.rs
  - crates/core/src/peripherals/generic_factory.rs
  - crates/core/src/system/builder/riscv.rs
  - crates/core/src/system/node.rs
  - crates/firmware-mpfs-zephyr
  - configs/chips/mpfs095t.yaml
  - configs/systems/mpfs-disco-kit.yaml
