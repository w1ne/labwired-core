id: esp32c6
chip: esp32c6
system: systems/esp32c6.yaml
# Arduino-ESP32 3.x only: the C6 needs IDF 5, which espressif32 7.0.1 lacks.
# CI pins espressif32@8.0.0 for this board alone (core-arduino-matrix-smoke).
pio: { platform: espressif32, board: esp32-c6-devkitc-1, framework: arduino }
max_steps: 50000000
budget_reason: "C6 L0 boot ~1.41M; L6 analogWrite ~5.4M; same 50M cap as C3"
# LED_BUILTIN → rgbLedWrite → RMT TX_START (inspect + synthetic ch0 edges),
# the same oracle as the C3 row; the C6 RMT is the C3 model at source 49.
min_rmt_tx: 1
led_watch: "rmt:0"
led_min_edges: 2
# L6: analogWrite(2, 128) on plain GPIO2 (the RGB LED_BUILTIN is RMT, not
# LEDC). LEDC ch0 reaches the pad through FUNC2_OUT_SEL = signal 0, clocked
# from PCR.LEDC_SCLK_SEL; the watch counts real pad edges.
pwm_watch: "gpio:2"
pwm_min_edges: 20
family: esp32
# L5: A0 = GPIO0 = ADC1_CH0 -> 256 (0x100), the APB_SARADC fixed channel
# source; an A1 build reads 529 (0x211), so the code tracks the channel.
notes: "Arduino-ESP32-C6 (IDF 5.5) on the in-tree C6 mask ROM; L3 INA219 on variant SDA/SCL 23/22; L4 SPI MISO from the MAX31855 kit; L5 oneshot APB_SARADC (REG_CLK_EN gate, PWDET stub); L6 LEDC on GPIO2; L8 TWAI0 self-RX @0x6000B000"
