id: stm32f401
chip: stm32f401
system: systems/stm32f401.yaml
pio: { platform: ststm32, board: nucleo_f401re, framework: arduino }
max_steps: 3000000
budget_reason: "Nucleo L0~0.84M L2~0.26M; LD2=PA5"
led_watch: "gpioa:5"
led_min_edges: 2
# L6 analogWrite(LED_BUILTIN): LD2/PA5 is TIM2_CH1 on AF1 (no DAC on an
# F401), routed by the F4 timer AF table, so L6 is proven on pad edges.
pwm_watch: "gpioa:5"
pwm_min_edges: 20
family: stm32
sketches_skip: [L8_can]
sketches_skip_reason:
  L8_can: "No bxCAN/FDCAN in chip yaml"
