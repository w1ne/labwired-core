# Arduino sketch matrix — every LabWired-supported chip with an Arduino path.
# chip: configs/chips/<name>.yaml stem
# system: relative to this matrix dir
# pio: PlatformIO platform / board / framework
# max_steps: sim budget (document why in budget_reason — no silent inflation)
# led_watch: optional "peripheral:pin" for L2 GPIO oracle (--watch-gpio)
# led_min_edges: min logic transitions required when led_watch is set (default 2)
# family: grouping only

boards:
  - id: esp32
    chip: esp32
    system: systems/esp32.yaml
    pio: { platform: espressif32, board: esp32dev, framework: arduino }
    max_steps: 50000000
    budget_reason: "FreeRTOS dual-core boot ~3.2M L0; L3 Wire needs more headroom"
    # L2 LED_BUILTIN often GPIO2 digitalWrite — watch classic gpio peripheral
    led_watch: "gpio:2"
    led_min_edges: 2
    family: esp32
    notes: "Arduino-ESP32 FreeRTOS — real models only (no thunks); L8 TWAI self-RX"
    # L8_can: classic TWAI @ 0x3FF6B000 self-reception (esp32_twai model)

  - id: esp32c3
    chip: esp32c3
    system: systems/esp32c3.yaml
    pio: { platform: espressif32, board: esp32-c3-devkitm-1, framework: arduino }
    max_steps: 50000000
    budget_reason: "FreeRTOS C3 boot ~1.9M; L3 Wire headroom (CLI max_steps cap 50M)"
    # LED_BUILTIN → rgbLedWrite → RMT TX_START (inspect + synthetic ch0 edges)
    min_rmt_tx: 1
    led_watch: "rmt:0"
    led_min_edges: 2
    family: esp32
    notes: "Arduino-ESP32-C3 RISC-V; L8 TWAI self-RX (S3 TWAI model, irq 25)"
    # L8_can: TWAI @ 0x6002B000 self-reception (esp32s3_twai model)

  - id: esp32s3
    chip: esp32s3
    system: systems/esp32s3.yaml
    pio: { platform: espressif32, board: esp32-s3-devkitc-1, framework: arduino }
    max_steps: 50000000
    budget_reason: "Dual-core S3 boot ~1.1M; L3 Wire headroom"
    # RGB LED_BUILTIN → RMT TX (min_rmt_tx). Programmatic bank id is rmt_s3,
    # not rmt — use the TX_START count oracle, not --watch-gpio.
    min_rmt_tx: 1
    family: esp32
    notes: "Arduino-ESP32-S3 — SPI L4, SAR ADC L5, TWAI L8 via programmatic bank"
    # L5: sar_adc_s3 @ 0x60040000 (esp32s3_sar_adc); L8: twai @ 0x6002B000

  - id: esp32s2
    chip: esp32s2-arduino
    system: systems/esp32s2.yaml
    # esp32-s2-saola-1 = Espressif's generic S2 devkit (variant esp32s2).
    # Serial is UART0 through the board's USB-UART bridge (no CDC on boot),
    # the same console the ESP32-S2-DevKitM-1 has.
    pio: { platform: espressif32, board: esp32-s2-saola-1, framework: arduino }
    max_steps: 50000000
    budget_reason: "single-core S2 FreeRTOS boot ~0.6M; same cap as the other ESP32 rows"
    # LED_BUILTIN is the WS2812 on GPIO18: digitalWrite -> rgbLedWrite -> RMT
    # ch0, routed by the GPIO matrix (signal 87). The probe is the pad: two
    # 24-bit frames before LW_L2_OK are 96 edges, so 48 is one whole frame.
    led_watch: "gpio:18"
    led_min_edges: 48
    min_rmt_tx: 1
    # L6: analogWrite(2, 128) through LEDC LS ch0 routed by the matrix
    # (signal 79). The sketch uses GPIO2 because LED_BUILTIN is the RGB
    # pixel's virtual pin 64, which stock analogWrite ignores.
    pwm_watch: "gpio:2"
    pwm_min_edges: 4
    family: esp32
    notes: "Arduino-ESP32-S2 on the genuine S2 mask ROM; L0/L1/L7 (UART0, FreeRTOS tick, 80 MHz SYSTIMER), L2 (RMT WS2812 waveform on GPIO18), L3 (I2C0 Wire reads INA219 CONFIG/BUS), L4 (FSPI/SPI2 reads the MAX31855 frame), L5 (SENS oneshot: analogRead(A0) = 2048), L6 (LEDC PWM on GPIO2), L8 (TWAI self-RX at 0x3F42B000)"

  - id: nrf52832
    chip: nrf52832
    system: systems/nrf52832.yaml
    pio: { platform: nordicnrf52, board: nrf52_dk, framework: arduino }
    max_steps: 3000000
    budget_reason: "Arduino nRF boot ~0.7M; L2 ~0.26M after short delays"
    # PIN_CNF.DIR sync + LED1 = P0.17 on nRF52 DK Arduino core
    led_watch: "gpio0:17"
    led_min_edges: 2
    family: nrf
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "No on-chip CAN model"

  - id: nrf52840
    chip: nrf52840
    system: systems/nrf52840.yaml
    pio: { platform: nordicnrf52, board: nrf52840_dk, framework: arduino }
    max_steps: 3000000
    budget_reason: "Same class as nRF52832 Arduino core"
    led_watch: "gpio0:17"
    led_min_edges: 2
    family: nrf
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "No on-chip CAN model"

  - id: rp2040
    chip: rp2040
    system: systems/rp2040.yaml
    pio: { platform: raspberrypi, board: pico, framework: arduino }
    # TIMER runs at its real 1 MHz since #1454, so mbed's pre-main
    # busy_wait_us(100_000) (double_tap_usb_boot) alone costs 12.5M cycles at
    # 125 MHz; 40M = 320 ms (the CLI caps scripts at 50M steps).
    max_steps: 40000000
    budget_reason: "real-rate TIMER: 100 ms pre-main double-tap wait = 12.5M cycles; 320 ms window (was 8M, red since #1454)"
    # Pico LED = GPIO25 via SIO (not APB GPIO)
    led_watch: "sio:25"
    led_min_edges: 2
    # L6: Mbed analogWrite(LED_BUILTIN) = PWM slice 4 B on GP25 (FUNCSEL 4),
    # period_ms(2): DIV 250.0, TOP 1000 = 250,250 cycles (499.5 Hz), CC 502.
    # 30 ms of sketch = 30 edges.
    pwm_watch: "sio:25"
    pwm_min_edges: 20
    family: rp2040
    notes: "Needs platform raspberrypi (pio pkg install -g -p raspberrypi if missing); SPI slave attach for L4"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "No on-chip CAN model"

  - id: rp2350
    chip: rp2350
    system: systems/rp2350.yaml
    # Raspberry Pi Pico 2 on Earle Philhower's arduino-pico core. The registry
    # `raspberrypi` platform has no RP2350 boards (and its `pico` board is the
    # Mbed core the rp2040 row uses), so this pins Max Gerhardt's platform,
    # the one arduino-pico documents for PlatformIO, at a fixed commit.
    pio: { platform: "https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1", board: rpipico2, framework: arduino }
    # Serial is native USB CDC: the sketches wait for the simulated host's
    # DTR (`while (!Serial)`), so every cell pays USB enumeration first.
    max_steps: 3000000
    budget_reason: "USB CDC enumeration + DTR before the first print: L0/L5 ~0.73M steps; ~4x headroom"
    # Pico 2 LED = GP25 via SIO (pinMode/digitalWrite go through the GPIO
    # coprocessor, p0).
    led_watch: "sio:25"
    led_min_edges: 2
    # L6: arduino-pico analogWrite(LED_BUILTIN, 128) = PWM slice 4 B on GP25
    # (FUNCSEL 4) via the RP2350 IO_BANK0 model: 150,004 cycles @150 MHz =
    # 1.000 kHz, 50.2 % high; ~60 edges in the 3M-step window.
    pwm_watch: "sio:25"
    pwm_min_edges: 20
    family: rp2040
    notes: "arduino-pico core; Serial = USB CDC; L6 analogWrite = PWM slice 4B on GP25"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "RP2350 has no CAN controller"

  - id: stm32f103
    chip: stm32f103
    system: systems/stm32f103.yaml
    pio: { platform: ststm32, board: bluepill_f103c8, framework: arduino }
    max_steps: 15000000
    budget_reason: "L0~0.7M L2~0.22M; L3 Wire I2C may need multi-M steps"
    led_watch: "gpioc:13"
    led_min_edges: 2
    # L6 drives PA0 = TIM2_CH1 (1 kHz). PC13 has no timer channel, so
    # analogWrite(LED_BUILTIN, 128) was a digitalWrite(HIGH).
    pwm_watch: "gpioa:0"
    pwm_min_edges: 20
    family: stm32

  - id: stm32f401
    chip: stm32f401
    system: systems/stm32f401.yaml
    pio: { platform: ststm32, board: nucleo_f401re, framework: arduino }
    max_steps: 3000000
    budget_reason: "Nucleo L0~0.84M L2~0.26M; LD2=PA5"
    led_watch: "gpioa:5"
    led_min_edges: 2
    # L6: analogWrite(LED_BUILTIN = PA5) is TIM2_CH1 on AF1 (F401 has no
    # DAC), 1 kHz on the pad: 84,000 cycles at 84 MHz, measured 2026-11-09.
    pwm_watch: "gpioa:5"
    pwm_min_edges: 20
    family: stm32
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "No bxCAN/FDCAN in chip yaml"

  - id: stm32f411ceu6
    chip: stm32f411ceu6
    system: systems/stm32f411ceu6.yaml
    pio: { platform: ststm32, board: blackpill_f411ce, framework: arduino }
    max_steps: 4000000
    budget_reason: "Black Pill 100 MHz: L0~0.10M L2~0.29M L4~0.20M; L6 30x delay(1) ~2.98M"
    led_watch: "gpioc:13"
    led_min_edges: 2
    # L6 drives TIM2_CH1 on PA0 (PC13 has no timer channel, so analogWrite
    # would fall back to digitalWrite). TIM2_CH1 reaches PA0 on AF1: 1 kHz,
    # 96,000 cycles at 96 MHz, measured 2026-11-09.
    pwm_watch: "gpioa:0"
    pwm_min_edges: 20
    family: stm32
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "STM32F411 has no CAN peripheral"

  - id: stm32f446re
    chip: stm32f446re
    system: systems/stm32f446re.yaml
    # Pinned like CI (core-arduino-matrix-smoke maps stm32* to 19.7.1):
    # ststm32 20.0.0 makes SPI.begin() a no-op and L4 spins on a null SPI.
    pio: { platform: ststm32@19.7.1, board: nucleo_f446re, framework: arduino }
    max_steps: 10000000
    budget_reason: "NUCLEO-F446RE 180 MHz, measured 2026-11-09: L0 0.18M, L2 0.54M, L3 0.73M, L7 0.72M, L6 5.58M"
    # LD2 = PA5 (UM1724 §6.4).
    led_watch: "gpioa:5"
    led_min_edges: 2
    # L6 drives TIM2_CH1 on PA0 (AF1), not LD2/PA5: PA5 is DAC_OUT2 as well,
    # and stock analogWrite prefers the DAC, which this chip does not model.
    pwm_watch: "gpioa:0"
    pwm_min_edges: 20
    family: stm32
    notes: "Stock stm32duino NUCLEO_F446RE (HSI PLL 180 MHz + over-drive); L8 bxCAN1 loopback"

  - id: stm32f407
    chip: stm32f407
    system: systems/stm32f407.yaml
    pio: { platform: ststm32, board: disco_f407vg, framework: arduino }
    max_steps: 8000000
    budget_reason: "Disco L0~1.7M L2~0.5M; green LED PD12"
    led_watch: "gpiod:12"
    led_min_edges: 2
    # L6: analogWrite(LED_BUILTIN = PD12) is TIM4_CH1 on AF2. The pad toggles
    # at 50 % duty but at 2 kHz, not 1 kHz (84,000 cycles at 168 MHz,
    # measured 2026-11-09): the timer model counts at the CPU clock, and
    # TIM4 really runs at 2 x APB1 = 84 MHz. Edges gated, frequency not.
    pwm_watch: "gpiod:12"
    pwm_min_edges: 20
    family: stm32
    # L8_can: bxCAN1 loopback (chip yaml + RM0090 APB1ENR bit 25)

  - id: stm32g474re
    chip: stm32g474re
    system: systems/stm32g474re.yaml
    pio: { platform: ststm32, board: nucleo_g474re, framework: arduino }
    max_steps: 20000000
    budget_reason: "L0–L2 light; L3 Wire.begin runs i2c_computeTiming (~7M+ steps)"
    led_watch: "gpioa:5"
    led_min_edges: 2
    # L6 uses PA0 (TIM2) — not PA5 LED (DAC1_OUT2) — see L6 sketch.
    # pwm_watch deferred: TIM OC→pad edge routing not yet reliable for L6 oracle.
    family: stm32
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "No FDCAN in chip yaml for matrix L8"

  - id: stm32g071rb
    chip: stm32g071
    system: systems/stm32g071rb.yaml
    pio: { platform: ststm32, board: nucleo_g071rb, framework: arduino }
    max_steps: 20000000
    budget_reason: "NUCLEO-G071RB 64 MHz: L0~0.07M L2~0.20M; L3 Wire.begin i2c_computeTiming ~11M; L5 ~5.9M; L6 ~2.0M"
    led_watch: "gpioa:5"
    led_min_edges: 2
    # L6 drives TIM2_CH1 on PA0, not LD4/PA5: PA5 is DAC1_OUT2 and the twin
    # models DAC1, so analogWrite(LED_BUILTIN) took the DAC path (DAC_CR.EN2=1,
    # TIM2 untouched) and passed without any PWM. On PA0, TIM2 reaches
    # CEN/PWM1/CC1E with PA0 on AF2. No pwm_watch: no STM32 TIM OC->pad
    # routing on main yet (PROBLEMS.md "L6 PWM edges"), PA0 shows 0 edges.
    family: stm32
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "STM32G071 has no CAN peripheral"

  - id: stm32c031c6
    chip: stm32c031c6
    system: systems/stm32c031c6.yaml
    # ststm32 19.7.1 (the CI pin; 20.0.0 makes SPI.begin() a no-op) has the
    # C0 Arduino core but no nucleo_c031c6 board JSON, so pio-boards/ carries
    # 20.0.0's copy.
    pio: { platform: ststm32@19.7.1, board: nucleo_c031c6, framework: arduino }
    max_steps: 20000000
    budget_reason: "NUCLEO-C031C6 48 MHz HSE: L3 Wire.begin i2c_computeTiming ~11.3M, L6 ~1.5M, rest <0.2M"
    led_watch: "gpioa:5"
    led_min_edges: 2
    # L6: LD4/PA5 is TIM1_CH1 (AF5) and the C0 has no DAC, so stock
    # analogWrite(LED_BUILTIN) takes the timer path; the probe is the pad.
    pwm_watch: "gpioa:5"
    pwm_min_edges: 4
    family: stm32
    # L5 is skipped, not passed: stock analogRead(A0) completes but reads
    # "0 0" — the L4-shaped ADC model does not decode the C0's CFGR1/CHSELR
    # register file, and the generic oracle would accept equal samples.
    sketches_skip: [L5_adc, L6_pwm, L8_can]
    sketches_skip_reason:
      L6_pwm: "Lane predates main #1734 (STM32 timer AF pad routing); the C0 pad table ships in the main PR — on the lane PA5 shows 0 edges"
      L5_adc: "No C0 ADC (CHSELR) model: analogRead returns 0 on every pin; a pass would be vacuous"
      L8_can: "STM32C031C6 has no CAN peripheral"

  - id: stm32h563
    chip: stm32h563
    system: systems/stm32h563.yaml
    pio: { platform: ststm32, board: nucleo_h563zi, framework: arduino }
    max_steps: 20000000
    budget_reason: "L0 light; L3 Wire.begin i2c_computeTiming needs multi-M steps"
    led_watch: "gpiob:0"
    led_min_edges: 2
    family: stm32
    # L5: adc profile stm32h7; L8: FDCAN enter_loopback sequence
  - id: stm32h723zg
    chip: stm32h723zg
    system: systems/stm32h723zg.yaml
    # Pinned like CI (core-arduino-matrix-smoke maps stm32* to 19.7.1):
    # ststm32 20.0.0 makes SPI.begin() a no-op and L4 spins on a null SPI.
    pio: { platform: ststm32@19.7.1, board: nucleo_h723zg, framework: arduino }
    max_steps: 20000000
    budget_reason: "NUCLEO-H723ZG 550 MHz HSE-bypass PLL1; first measurement pending"
    # LD1 (green) = PB0 = LED_BUILTIN (UM2407, variant_NUCLEO_H723ZG.h).
    led_watch: "gpiob:0"
    led_min_edges: 2
    # H7 LD1/PB0 is TIM1_CH2N (not wired yet); stock analogWrite on PA0/TIM2_CH1
    # must toggle the header pad, not just print OK.
    pwm_watch: "gpioa:0"
    pwm_min_edges: 20
    family: stm32
    notes: "Stock stm32duino NUCLEO_H723ZG (HSE bypass 8 MHz, PLL1 550 MHz, VOS0)"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: >-
        No H7 FDCAN model: the engine's fdcan model is the H5 fixed-layout
        FDCAN, while the H7's is the full M_CAN with a configurable message RAM
        at 0x4000AC00 (RM0468), so the H723 profile does not declare FDCAN

  - id: stm32l073
    chip: stm32l073
    system: systems/stm32l073.yaml
    pio: { platform: ststm32, board: nucleo_l073rz, framework: arduino }
    max_steps: 15000000
    budget_reason: "L0 light; L3 may run I2C timing compute under stm32duino"
    led_watch: "gpioa:5"
    led_min_edges: 2
    family: stm32
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "No CAN peripheral on L0 series"

  - id: stm32l476
    chip: stm32l476
    system: systems/stm32l476.yaml
    pio: { platform: ststm32, board: nucleo_l476rg, framework: arduino }
    max_steps: 20000000
    budget_reason: "L0~0.8M; L3 Wire.begin i2c_computeTiming ~7.3M steps measured"
    led_watch: "gpioa:5"
    led_min_edges: 2
    family: stm32
    # L8_can: bxCAN1 loopback

  - id: stm32wb55
    chip: stm32wb55
    system: systems/stm32wb55.yaml
    pio: { platform: ststm32, board: nucleo_wb55rg_p, framework: arduino }
    max_steps: 20000000
    budget_reason: "L0 light; L3 Wire.begin i2c_computeTiming needs multi-M steps"
    led_watch: "gpiob:5"
    led_min_edges: 2
    family: stm32
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "No CAN model in matrix path"

  - id: stm32wba52
    chip: stm32wba52
    system: systems/stm32wba52.yaml
    # ststm32 has no upstream board JSON; matrix supplies pio-boards/nucleo_wba52cg.json
    pio: { platform: ststm32, board: nucleo_wba52cg, framework: arduino }
    max_steps: 20000000
    budget_reason: "L0 light; L3 Wire.begin i2c_computeTiming needs multi-M steps"
    led_watch: "gpiob:4"
    led_min_edges: 2
    family: stm32
    sketches_skip: [L5_adc]
    sketches_skip_reason:
      L5_adc: "No ADC model in stm32wba52 chip yaml yet"
      L8_can: "No CAN model in matrix path"

  - id: stm32u575
    chip: stm32u575
    system: systems/stm32u575.yaml
    pio: { platform: ststm32, board: nucleo_u575zi_q, framework: arduino }
    max_steps: 10000000
    budget_reason: "Measured first run: L0~0.17M, L2~0.49M, L3 Wire.begin i2c_computeTiming 7.1M, L6 analogWrite 5.0M — 10M covers L0-L4/L6/L7 with ~40% headroom (was 20M H563/L476 sibling budget)"
    led_watch: "gpioc:7"
    led_min_edges: 2
    family: stm32
    # L5: adc profile stm32u5; L8: FDCAN1 enter_loopback @ 0x4000A400 behind
    # RCC APB1ENR2.FDCAN1EN bit 9

  - id: stm32u545
    chip: stm32u545
    system: systems/stm32u545.yaml
    # No NUCLEO_U545RE_Q variant exists in the stm32duino core (3.0.0); this
    # uses the generic U545RETxQ variant plus board pin overrides from
    # pio-boards/nucleo_u545re_q.json (LED PA5, VCP USART1 PA9/PA10, Wire PB7/PB6).
    pio: { platform: ststm32, board: nucleo_u545re_q, framework: arduino }
    max_steps: 10000000
    budget_reason: "Same U5 Arduino core boot as stm32u575 (L0~0.17M, L3 Wire.begin 7.1M); 10M budget carried over"
    led_watch: "gpioa:5"
    led_min_edges: 2
    family: stm32

  - id: stm32g0b1re
    chip: stm32g0b1re
    system: systems/stm32g0b1re.yaml
    pio: { platform: ststm32, board: nucleo_g0b1re, framework: arduino }
    max_steps: 20000000
    budget_reason: "NUCLEO-G0B1RE 64 MHz: L0~0.07M L2~0.20M; L3 Wire.begin i2c_computeTiming ~11M; L5 ~5.9M; L6 ~2.0M"
    led_watch: "gpioa:5"
    led_min_edges: 2
    # L6 drives TIM2_CH1 on PA0, not LD4/PA5 (DAC1_OUT2), see the L6 sketch.
    family: stm32

  - id: atmega328p
    chip: atmega328p
    system: systems/atmega328p.yaml
    pio: { platform: atmelavr, board: nanoatmega328, framework: arduino }
    max_steps: 500000
    budget_reason: "AVR: L0~14k L2~40k L3/L4 TWI/SPI headroom for millis + Wire/SPI"
    led_watch: "portb:5"
    led_min_edges: 2
    # L6 drives D9 = PB1 = OC1A (Timer1 phase-correct, 490 Hz). D13 has no
    # timer output, so analogWrite(LED_BUILTIN, 128) was a digitalWrite(HIGH).
    pwm_watch: "portb:1"
    pwm_min_edges: 20
    family: avr
    notes: "Classic Arduino Nano — L0–L7 twin; L8 no CAN"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "ATmega328P has no CAN controller"

  - id: atmega2560
    chip: atmega2560
    system: systems/atmega2560.yaml
    pio: { platform: atmelavr, board: megaatmega2560, framework: arduino }
    max_steps: 500000
    budget_reason: "AVR 16 MHz, same budget as the Nano row"
    # LED_BUILTIN = D13 = PB7 on the Mega.
    led_watch: "portb:7"
    led_min_edges: 2
    # L6 keeps LED_BUILTIN: on the Mega D13 = PB7 = OC0A (Timer0 fast PWM,
    # 16 MHz / 64 / 256 = 976.6 Hz), unlike the Nano's D13.
    pwm_watch: "portb:7"
    pwm_min_edges: 20
    family: avr
    notes: "Arduino Mega 2560 Rev3"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "ATmega2560 has no CAN controller"

  - id: arduino-leonardo
    chip: atmega32u4
    system: systems/arduino-leonardo.yaml
    pio: { platform: atmelavr, board: leonardo, framework: arduino }
    max_steps: 2000000
    budget_reason: "AVR 16 MHz; the scripted host enumerates in ~13 USB frames (13 ms = 208k cycles) before while(!Serial) lets setup() print"
    # LED_BUILTIN = D13 = PC7 on the Leonardo.
    led_watch: "portc:7"
    led_min_edges: 2
    # L6 drives D9 = PB5 = OC1A (Timer1 phase-correct, 490 Hz). D13 is OC4A
    # (high-speed Timer4), which is not modelled.
    pwm_watch: "portb:5"
    pwm_min_edges: 20
    family: avr
    notes: "Arduino Leonardo (ATmega32U4): Serial is native USB CDC on the CPU's USB device model and a scripted host"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "ATmega32U4 has no CAN controller"

  - id: arduino-nano-every
    chip: atmega4809
    system: systems/arduino-nano-every.yaml
    # ArduinoCore-megaavr `nona4809`: Serial is USART3 behind the SAMD11 USB
    # bridge (PB4/PB5), millis() runs on TCB3 clocked from TCA0 (CLK_PER/64).
    pio: { platform: atmelmegaavr@1.10.0, board: nano_every, framework: arduino }
    max_steps: 500000
    budget_reason: "AVR 16 MHz, same budget as the Nano and Mega rows"
    led_watch: "porte:2"
    led_min_edges: 2
    # L6 drives D9 = PB0 = TCA0 WO0 (TCAROUTEA = PORTB, 976.6 Hz). D13 = PE2
    # has no timer output, so analogWrite(LED_BUILTIN, 128) was digitalWrite.
    pwm_watch: "portb:0"
    pwm_min_edges: 20
    family: avr
    notes: "Arduino Nano Every (ATmega4809, megaAVR 0-series)"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "ATmega4809 has no CAN controller"

  - id: arduino-zero
    chip: atsamd21g18a
    system: systems/arduino-zero.yaml
    # `zero` = "Arduino Zero (Programming/Debug Port)": Serial is the EDBG
    # UART (SERCOM5), not native USB CDC. The sketch is linked at 0x2000
    # behind the bootloader; the chip's reset_vector_offset enters it there.
    pio: { platform: atmelsam@9.0.0, board: zero, framework: arduino }
    max_steps: 3000000
    budget_reason: "Cortex-M0+ 48 MHz; L0 reaches loop() in well under 1M steps"
    led_watch: "gpio_a:17"
    led_min_edges: 2
    # L6: analogWrite(LED_BUILTIN = D13 = PA17) runs TCC2 WO1 in NPWM on PMUX
    # E; the pad must carry the waveform, not the PORT latch.
    pwm_watch: "gpio_a:17"
    family: sam
    notes: "Arduino Zero (ArduinoCore-samd), Programming Port"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "ATSAMD21G18A has no CAN controller"

  - id: arduino-uno-r4-wifi
    chip: r7fa4m1ab-uno-r4-wifi-smoke
    system: systems/arduino-uno-r4-wifi.yaml
    # ArduinoCore-renesas `unor4wifi` builds with NO_USB: Serial is SCI9 on
    # P109/P110 (the ESP32-S3 USB bridge), not USB CDC. The sketch is linked
    # at 0x4000 behind the bootloader; the chip's reset_vector_offset enters
    # it there.
    pio: { platform: renesas-ra@1.9.0, board: uno_r4_wifi, framework: arduino }
    max_steps: 5000000
    budget_reason: "Cortex-M4 48 MHz: L0 0.11M steps, L3 0.28M, L6 1.55M (30 ms of 490 Hz PWM); ~3x headroom"
    # LED_BUILTIN = D13 = P102.
    led_watch: "port1:2"
    led_min_edges: 2
    # L6 keeps LED_BUILTIN: D13 = P102 = GTIOC2B (GPT2, 32-bit), 490 Hz.
    pwm_watch: "port1:2"
    pwm_min_edges: 20
    family: renesas
    notes: "Arduino UNO R4 WiFi (R7FA4M1AB, ArduinoCore-renesas 1.x via renesas-ra 1.9.0)"

  - id: teensy41
    chip: mimxrt1062-teensy41
    system: systems/teensy41.yaml
    # Stock Teensyduino (PJRC core) via PlatformIO `teensy`: the image boots
    # from the FlexSPI NOR IVT, and `Serial` is USB CDC — the chip's scripted
    # host enumerates USB1 and opens the port. Measured on teensy 6.0.0
    # (framework-arduinoteensy 1.162.0, Teensyduino 1.62).
    pio: { platform: teensy@6.0.0, board: teensy41, framework: arduino }
    max_steps: 250000000
    budget_reason: "Cortex-M7 600 MHz; stock startup busy-waits 300 ms on millis() (20 ms before usb_init, 280 ms after) = 180M cycles before setup()"
    # max_steps above the CLI's 50M guard needs a wall-clock bound.
    wall_time_ms: 240000
    # LED_BUILTIN = 13 = GPIO_B0_03, driven through fast GPIO7 (GPR27).
    led_watch: "gpio7:3"
    led_min_edges: 2
    # L6: analogWrite(13) is QuadTimer2 TIMER0 on GPIO_B0_03 (ALT1); the pad
    # must carry the waveform.
    pwm_watch: "gpio7:3"
    family: imxrt
    notes: "PJRC Teensy 4.1 (MIMXRT1062DVJ6B), Teensyduino; Serial = USB1 CDC"
    sketches_skip: [L4_spi_sensor, L6_pwm, L8_can]
    sketches_skip_reason:
      L4_spi_sensor: "No LPSPI model yet: SPI = LPSPI4 (0x403A0000) is unmapped, so SPI.begin() faults"
      L6_pwm: >-
        No QuadTimer model yet: analogWrite(13) runs QTIMER2 TIMER0 on
        GPIO_B0_03, a declared stub, so the pad stays idle (measured: 0
        edges with pwm_watch gpio7:3)
      L8_can: "No FlexCAN model yet (CAN1-3 unmapped)"

  # ── Silicon Labs BRD2709A (xG26 Explorer Kit, EFR32MG26) ────────────────
  #
  # ⚠️ The ONLY board here that does not compile through PlatformIO. Silicon
  # Labs never published an xG26 Arduino core, so LabWired's is hand-written
  # and lives in the labwired monorepo at
  # `services/labwired-builder/silabs-arduino`. Its compile flags were derived
  # on real silicon (hard/soft float split, the 0x08008000 app slot, -nostdlib)
  # and they have exactly one home — copying them into this repo would give
  # them two, and the two would drift.
  #
  # So this board declares `external_compile:` instead of `pio:`, and the lane
  # that owns the core supplies the driver through $LW_EXTERNAL_COMPILE (see
  # run_matrix.py). ⚠️ With no driver the rows come back `toolchain_missing`,
  # which is a FAILURE the gate counts — not a skip. `scripts/ci/chip_coverage.py`
  # is what stops this board from sitting in boards.yaml with nothing anywhere
  # running it: a board with `external_compile:` must NOT be in this repo's job
  # matrix (that job could only report toolchain_missing) and MUST name a
  # `lane:`, or the gate refuses the tree.
  - id: brd2709a
    chip: efr32mg26
    system: systems/brd2709a.yaml
    external_compile:
      target: "silabs-arduino:xg26explorerkit"
    lane: "labwired/.github/workflows/brd2709a-arduino-matrix.yml"
    max_steps: 3000000
    budget_reason: "Cortex-M33 at the 19 MHz HFRCODPLL startup band; L0 boots in ~30k, L3/L4 need Wire/SPI headroom"
    # LED0 = PC08, active-high (variants/xg26explorerkit/pins_arduino.h).
    led_watch: "gpioc:8"
    led_min_edges: 2
    family: efr32
    notes: "Hand-written silabs-arduino core; Wire=I2C0 @0x4B000000, SPI=USART0 sync"
    sketches_skip: [L8_can]
    sketches_skip_reason:
      L8_can: "EFR32MG26 has no CAN controller"


  - id: ch32v003
    chip: ch32v003f4p6-ch32fun-smoke
    system: systems/ch32v003.yaml
    # WCH's official core (openwch/arduino_core_ch32) via the community ch32v
    # platform. Not in the PlatformIO registry; pinned like the other WCH rows.
    pio:
      platform: https://github.com/Community-PIO-CH32V/platform-ch32v.git#f26b06a375c5a8b4dd58af5265538e88aa2a68c7
      board: genericCH32V003F4P6
      framework: arduino
      # platform.json names the framework by branch, so pin it here too.
      platform_packages:
        - "framework-arduino-openwch-ch32 @ https://github.com/Community-PIO-CH32V/arduino_core_ch32.git#3820604346d0a9f0ee9a72cab8b7583e488e6674"
      # The CH32V003F4 variant leaves LED_BUILTIN as PNUM_NOT_DEFINED, and
      # digitalWrite() on it compiles to a trap. PD0 is a pin choice (the
      # ch32v003fun blink pin), not a board fact. L6 drives TIM2_CH1 on its
      # default pad PD4 (variant PeripheralPins.c PinMap_TIM).
      build_flags: ["-DLED_BUILTIN=PD0", "-DLW_PWM_PIN=PD4"]
    max_steps: 3000000
    budget_reason: "48 MHz RV32EC; L0 ~1M steps to LW_L0_OK"
    led_watch: "gpiod:0"
    led_min_edges: 2
    # Stock analogWrite(PD4, 128) must toggle the pad. A pin that falls back to
    # digitalWrite (no TIM route) holds one level and fails this.
    pwm_watch: "gpiod:4"
    pwm_min_edges: 4
    family: wch
    notes: "QingKe V2A RV32EC: PFIC, STK, HPE, XW compressed insns"
    sketches_skip: [L7_timer, L8_can]
    sketches_skip_reason:
      # Measured 2026-11-07, re-measured 2026-11-09 on the lane model:
      # LW_L7_FAIL t0=1991 t1=3999 t2=3778 t3=4999.
      L7_timer: >-
        Upstream core bug, not a model gap: getCurrentMicros() (ch32/clock.c)
        computes (CMP+1-CNT), which assumes a down-counter, but the V2 STK
        counts up (WCH's own Delay_Ms polls CNTIF from CNT=0), so micros()
        runs backwards inside each millisecond
      L8_can: "No CAN on CH32V003"

  - id: ch32v203
    chip: ch32v203c8t6-ch32fun-smoke
    system: systems/ch32v203.yaml
    # WCH's official core (openwch/arduino_core_ch32) via the community ch32v
    # platform, pinned to the same revisions as the ch32v003 row.
    pio:
      platform: https://github.com/Community-PIO-CH32V/platform-ch32v.git#f26b06a375c5a8b4dd58af5265538e88aa2a68c7
      board: genericCH32V203C8T6
      framework: arduino
      platform_packages:
        - "framework-arduino-openwch-ch32 @ https://github.com/Community-PIO-CH32V/arduino_core_ch32.git#3820604346d0a9f0ee9a72cab8b7583e488e6674"
      # The CH32V203C8 variant leaves LED_BUILTIN as PNUM_NOT_DEFINED. PB2 is
      # the WeAct BluePill-Plus-CH32 blue user LED (active high), a board fact.
      # PB2 has no timer channel, so L6 drives TIM2_CH1 on PA0 (variant
      # PeripheralPins.c PinMap_TIM, reset mapping) instead.
      build_flags: ["-DLED_BUILTIN=PB2", "-DLW_PWM_PIN=PA0"]
    max_steps: 20000000
    budget_reason: "144 MHz QingKe V4; L0 prints LW_L0_OK well inside 20M steps"
    led_watch: "gpiob:2"
    led_min_edges: 2
    # Stock analogWrite(PA0, 128) must toggle the pad. A pin that falls back to
    # digitalWrite (no TIM route) holds one level and fails this.
    pwm_watch: "gpioa:0"
    pwm_min_edges: 4
    family: wch
    notes: "QingKe V4 RV32IMAC + XW on WeAct BluePill-Plus-CH32; L8 bxCAN1 loopback"
    sketches_skip: [L7_timer]
    sketches_skip_reason:
      # Measured 2026-11-08 (Serial.print, since the core's libprintf drops
      # %lu): t0=1999 t1=3999 t2=3929 t3=4999, micros() falling inside each ms.
      L7_timer: >-
        Upstream core bug, not a model gap: getCurrentMicros() (ch32/clock.c)
        computes (CMP+1-CNT), which assumes a down-counter, but hw_config.c
        starts the V4 STK with CTLR=0xF, MODE (bit 4) clear = count up, so
        micros() runs backwards inside each millisecond (same bug as ch32v003)

  - id: ch32v307
    chip: ch32v307vct6-ch32fun-smoke
    system: systems/ch32v307.yaml
    # WCH's official core (openwch/arduino_core_ch32) via the community ch32v
    # platform, pinned to the same revisions as the ch32v203 row.
    pio:
      platform: https://github.com/Community-PIO-CH32V/platform-ch32v.git#f26b06a375c5a8b4dd58af5265538e88aa2a68c7
      board: genericCH32V307VCT6
      framework: arduino
      platform_packages:
        - "framework-arduino-openwch-ch32 @ https://github.com/Community-PIO-CH32V/arduino_core_ch32.git#3820604346d0a9f0ee9a72cab8b7583e488e6674"
      # The CH32V307VCT6 variant leaves LED_BUILTIN as PNUM_NOT_DEFINED, and
      # the CH32V307V-EVT wires its LEDs to nothing (jumpered by the user).
      # PA3 is the pad the ch32v307v-evt ch32fun smoke drives; it is TIM2_CH4
      # (variant PeripheralPins.c PinMap_TIM, reset mapping), so it also
      # carries L6's analogWrite.
      build_flags: ["-DLED_BUILTIN=PA3", "-DLW_PWM_PIN=PA3"]
    max_steps: 20000000
    budget_reason: "144 MHz QingKe V4F; same budget as the ch32v203 row"
    led_watch: "gpioa:3"
    led_min_edges: 2
    pwm_watch: "gpioa:3"
    pwm_min_edges: 4
    family: wch
    notes: "QingKe V4F on CH32V307V-EVT; Wire is I2C2 (PB10/PB11) in WCH's variant; L8 bxCAN1 loopback"
    sketches_skip: [L7_timer]
    sketches_skip_reason:
      # Measured 2026-11-08 with a Serial.print probe (the core's libprintf
      # drops %lu): t0=1996 t1=3999 t2=3929 t3=4999, STK CTLR=0xF.
      L7_timer: >-
        Upstream core bug, not a model gap: getCurrentMicros() (ch32/clock.c)
        computes (CMP+1-CNT), which assumes a down-counter, but hw_config.c
        starts the V4 STK with CTLR=0xF, MODE (bit 4) clear = count up, so
        micros() runs backwards inside each millisecond (same bug as the
        ch32v003 and ch32v203 rows)

  - id: ch32x035
    chip: ch32x035g8u6
    system: systems/ch32x035.yaml
    # WCH's official core (openwch/arduino_core_ch32) via the community ch32v
    # platform, pinned to the same revisions as the ch32v203 row. The core
    # ships one X035 variant, CH32X035G8U (QFN28).
    pio:
      platform: https://github.com/Community-PIO-CH32V/platform-ch32v.git#f26b06a375c5a8b4dd58af5265538e88aa2a68c7
      board: genericCH32X035G8U6
      framework: arduino
      platform_packages:
        - "framework-arduino-openwch-ch32 @ https://github.com/Community-PIO-CH32V/arduino_core_ch32.git#3820604346d0a9f0ee9a72cab8b7583e488e6674"
      # The variant leaves LED_BUILTIN as PNUM_NOT_DEFINED (this is a chip
      # row, no board LED). PB12 is a plain GPIO pad. L6 drives TIM3_CH1 on
      # PA6 (variant PeripheralPins.c PinMap_TIM, AFIO_NONE = reset mapping).
      build_flags: ["-DLED_BUILTIN=PB12", "-DLW_PWM_PIN=PA6"]
    max_steps: 20000000
    budget_reason: "48 MHz QingKe V4C; same budget as the other WCH rows"
    led_watch: "gpiob:12"
    led_min_edges: 2
    pwm_watch: "gpioa:6"
    pwm_min_edges: 4
    family: wch
    notes: "QingKe V4C on CH32X035G8U6; Wire is I2C1 on PC16/PC17 (PartialRemap2) in WCH's variant"
    sketches_skip: [L7_timer, L8_can]
    sketches_skip_reason:
      # Measured 2026-11-08 with a Serial.print probe (the core's libprintf
      # drops %lu): t0=1999 t1=3999 t2=3788 t3=4999, STK CTLR=0xF.
      L7_timer: >-
        Upstream core bug, not a model gap: getCurrentMicros() (ch32/clock.c)
        computes (CMP+1-CNT), which assumes a down-counter, but hw_config.c
        starts the V4 STK with CTLR=0xF, MODE (bit 4) clear = count up, so
        micros() runs backwards inside each millisecond (same bug as the
        ch32v003, ch32v203 and ch32v307 rows)
      L8_can: "No CAN on the CH32X035 (ch32x035.h has no CAN block)"

sketches:
  - id: L0_serial_boot
    dir: sketches/L0_serial_boot
    marker: "LW_L0_OK"
    description: "setup() prints once — proves Arduino core boot + UART"

  - id: L1_serial_loop
    dir: sketches/L1_serial_loop
    marker: "LW_L1_OK"
    description: "loop() prints — proves millis/loop scheduling"

  - id: L2_blink_serial
    dir: sketches/L2_blink_serial
    marker: "LW_L2_OK"
    description: "LED_BUILTIN toggle + serial — UART + optional GPIO edges"

  - id: L3_i2c_sensor
    dir: sketches/L3_i2c_sensor
    marker: "LW_L3_OK"
    description: "Wire + INA219@0x40 — exact config 0x399F + bus 0x19CA when master-RX works; else ACK + PARTIAL marker"

  - id: L4_spi_sensor
    dir: sketches/L4_spi_sensor
    marker: "LW_L4_OK"
    description: "SPI + MAX31855@CS — exact frame 0x01901600"

  - id: L5_adc
    dir: sketches/L5_adc
    marker: "LW_L5_OK"
    description: "analogRead() — family-faithful deterministic codes (not bare 0..4095)"

  - id: L6_pwm
    dir: sketches/L6_pwm
    marker: "LW_L6_OK"
    description: "analogWrite mid duty left running + optional GPIO edge oracle"

  - id: L7_timer
    dir: sketches/L7_timer
    marker: "LW_L7_OK"
    description: "micros() advances ≥1 ms and stays monotonic"

  - id: L8_can
    dir: sketches/L8_can
    marker: "LW_L8_OK"
    description: "CAN loopback ID+data (bxCAN/FDCAN) or TWAI self-RX decode 0x123/0xA5"

