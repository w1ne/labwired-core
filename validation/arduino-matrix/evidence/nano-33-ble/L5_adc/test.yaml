schema_version: '1.0'
inputs:
  firmware: <out>/nano-33-ble/L5_adc/firmware.elf
  system: validation/arduino-matrix/systems/nano-33-ble.yaml
limits:
  max_steps: 10000000
  max_uart_bytes: 65536
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
  stop_when_assertions_pass_min_steps: 0
assertions:
- uart_contains: LW_L5_OK
