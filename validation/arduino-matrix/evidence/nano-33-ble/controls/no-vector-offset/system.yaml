name: arduino-matrix-nano-33-ble
chip: configs/chips/nrf52840.yaml
external_devices:
- id: ina219
  type: ina219
  connection: i2c0
  config:
    i2c_address: 64
- id: max31855
  type: max31855
  connection: spi2
  config:
    cs_pin: P1.02
peripherals:
- id: uart0
  type: nrf52840_uart
  base_address: 1073750016
  config:
    bootloader_rx_running: true
- id: usbd
  type: nrf52840_usbd
  base_address: 1073901568
  config:
    host: true
- id: saadc
  type: nrf52840_saadc
  base_address: 1073770496
  config:
    input_mv:
      2: 1650
board_io: []
