# Arduino matrix system — WCH CH32X035G8U6 (QFN28).
# INA219 on Wire for L3 — WCH's CH32X035G8U variant routes Wire to I2C1 on
# PC16 SCL / PC17 SDA (variant_CH32X035G8U.h PIN_WIRE_*, PeripheralPins.c
# PinMap_I2C_* PartialRemap2) — and MAX31855 on SPI (SPI1, PA5/6/7, CS PA4)
# for L4; L0–L2 ignore both.
name: "arduino-matrix-ch32x035"
chip: "../../../configs/chips/ch32x035g8u6.yaml"
external_devices:
  - id: "ina219"
    type: "ina219"
    connection: "i2c1"
    config:
      i2c_address: 0x40
  - id: "max31855"
    type: "max31855"
    connection: "spi1"
    config:
      cs_pin: "PA4"
board_io: []
