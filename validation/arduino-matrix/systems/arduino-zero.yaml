# Arduino matrix system — Arduino Zero (ATSAMD21G18A), Programming Port.
# `Serial` on the Zero's Programming Port is the EDBG virtual COM port, which is
# SERCOM5 in UART mode on PB22/PB23 (variants/arduino_zero/variant.cpp); the
# EDBG chip only bridges it to USB. LED_BUILTIN = D13 = PA17.
# L3: INA219 on Wire (SERCOM3, SDA PA22 / SCL PA23).
# L4: MAX31855 on SPI (SERCOM4); CS is the sketch's SS = A2 = PB9.
# L5: A0 (PA02 = AIN0) held at 1650 mV, half of VDDANA — a divider on the
# pin. Stock analogRead() must return exactly 512 (10-bit, full scale 3.3 V).
name: "arduino-matrix-arduino-zero"
chip: "../../../configs/chips/atsamd21g18a.yaml"
external_devices:
  - id: "ina219"
    type: "ina219"
    connection: "sercom3"
    config:
      i2c_address: 0x40
  - id: "max31855"
    type: "max31855"
    connection: "sercom4"
    config:
      cs_pin: "PB9"
peripherals:
  - id: "adc"
    type: "samd21_adc"
    base_address: 0x42004000
    config:
      input_mv: { 0: 1650 }
board_io: []
