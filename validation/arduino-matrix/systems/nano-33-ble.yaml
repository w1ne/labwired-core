# Arduino matrix system — Arduino Nano 33 BLE Rev2 (nRF52840, u-blox NINA-B306).
# ArduinoCore-mbed variants/ARDUINO_NANO33BLE:
#   Serial = USB CDC on the nRF52840 USBD; the host is plugged in.
#   The application starts at 0x10000, above the resident bootloader.
name: "arduino-matrix-nano-33-ble"
chip: "../../../configs/chips/nrf52840.yaml"
memory_overrides:
  reset_vector_offset: "0x10000"
external_devices:
  - id: "ina219"
    type: "ina219"
    connection: "i2c0"
    config:
      i2c_address: 0x40
  - id: "max31855"
    type: "max31855"
    connection: "spi2"
    config:
      cs_pin: "P1.02"
peripherals:
  # The resident bootloader is not modelled. It leaves UARTE0 enabled with
  # the receiver started; initVariant() stops it and waits for RXTO.
  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    config:
      bootloader_rx_running: true
  - id: "usbd"
    type: "nrf52840_usbd"
    base_address: 0x40027000
    config:
      host: true
  - id: "saadc"
    type: "nrf52840_saadc"
    base_address: 0x40007000
    config:
      input_mv: { 2: 1650 }
board_io: []
