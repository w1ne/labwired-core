# Arduino matrix system — INA219 on Wire for L3; L0–L2 ignore it.
name: "arduino-matrix-nrf52832"
chip: "../../../configs/chips/nrf52832.yaml"
external_devices:
  # Matrix L3_i2c_sensor: INA219 at 0x40 on default Arduino Wire bus (i2c0).
  # Harmless for L0–L2 (unused). Proves kit attach + I2C end-to-end.
  - id: "ina219"
    type: "ina219"
    connection: "twi1"
    config:
      i2c_address: 0x40
  # Matrix L4_spi_sensor: MAX31855 on default Arduino SPI (spi2).
  # Single-device bus: CS soft-ignored by SpiDevice v1 broadcast.
  - id: "max31855"
    type: "max31855"
    connection: "spi2"
    config:
      cs_pin: "P0.22"
board_io: []
