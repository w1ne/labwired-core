# Arduino matrix system — INA219 on Wire for L3; L0–L2 ignore it.
name: "arduino-matrix-stm32l073"
chip: "../../../configs/chips/stm32l073.yaml"
external_devices:
  # Matrix L3_i2c_sensor: INA219 at 0x40 on default Arduino Wire bus (i2c1).
  # Harmless for L0–L2 (unused). Proves kit attach + I2C end-to-end.
  - id: "ina219"
    type: "ina219"
    connection: "i2c1"
    config:
      i2c_address: 0x40
  # Matrix L4_spi_sensor: MAX31855 on default Arduino SPI (spi1).
  # Single-device bus: CS soft-ignored by SpiDevice v1 broadcast.
  - id: "max31855"
    type: "max31855"
    connection: "spi1"
    config:
      cs_pin: "PA4"
# Matrix L5_adc: A0 (PA0 = ADC_IN0, variant PeripheralPins.c) held at
# 1651 mV. 12-bit against VREF+ = 3.3 V is 2048. Stock analogRead(A0) on the
# NUCLEO-L073RZ must return exactly 512 on stm32duino 2.x (10-bit read) and
# 511 on 3.x (12-bit read, mapped with ((v + 1) >> 2) - 1). The unheld fixed
# source would read 930; no conversion 0.
peripherals:
  - id: "adc1"
    type: "adc"
    base_address: 0x40012400
    config:
      input_mv: { 0: 1651 }
board_io: []
