# Arduino matrix system — NUCLEO-C031C6 (UM2953): INA219 on Wire (I2C1,
# D14/D15 = PB9/PB8) for L3, MAX31855 on SPI (SPI1, D13/D12/D11) for L4.
name: "arduino-matrix-stm32c031c6"
chip: "../../../configs/chips/stm32c031c6.yaml"
external_devices:
  - id: "ina219"
    type: "ina219"
    connection: "i2c1"
    config:
      i2c_address: 0x40
  - id: "max31855"
    type: "max31855"
    connection: "spi1"
    config:
      cs_pin: "PB0"
# Matrix L5_adc: A0 (PA0 = ADC1_IN0, variant PeripheralPins.c) held at
# 1651 mV. 12-bit against VREF+ = 3.3 V is 2048, and stm32duino returns the
# 10-bit Arduino default, so stock analogRead(A0) on the NUCLEO-C031C6 must
# return exactly 512. The unheld fixed source would read 930; no conversion 0.
peripherals:
  - id: "adc1"
    type: "adc"
    base_address: 0x40012400
    config:
      input_mv: { 0: 1651 }
board_io: []
