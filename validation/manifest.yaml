      - "tier1 fixture (clock/gpio/timer/pwm/i2c/spi/wdt/irq PASS + uart via TIER1 done)"
      - "io-smoke (examples/stm32h735-smoke: asserts the TIER1 transcript over UART)"
      - "chip_conformance (estate OK — no peripheral window faults)"
