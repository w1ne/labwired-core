# actionlint configuration for labwired-core.
#
# Custom labels carried by this repo's self-hosted runners. actionlint's
# runner-label check only knows GitHub's hosted labels, so every custom one
# has to be declared here or it is reported as unknown.
#
# `hil`  — shared label on the hardware-in-the-loop runners (each also carries
#          its own board label, e.g. `stm32f103`; see hil/README.md). The board
#          labels come from the `matrix.runner_label` expression, which
#          actionlint does not evaluate, so only `hil` needs declaring.
self-hosted-runner:
  labels:
    - hil
