name: Core Coverage Matrix Smoke

on:
  # Slow gates: nightly + main tip + manual. Not on PRs (PR merge target <1 min).
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
    paths:
      - "configs/chips/**"
      - "configs/systems/**"
      - "examples/**"
      - "crates/core/**"
      - "crates/cli/**"
      - "crates/labwired-models-**"
      - ".github/workflows/core-coverage-matrix-smoke.yml"
  workflow_dispatch:

concurrency:
  group: core-coverage-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage-matrix-smoke:
    name: coverage-matrix-${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ci-fixture-armv6m
            target: thumbv6m-none-eabi
            crate: firmware-ci-fixture
            profile: release
            profile_dir: release
            script: examples/ci/uart-ok.yaml
            system: configs/systems/ci-fixture-uart1.yaml
          - id: riscv-ci-fixture
            target: riscv32i-unknown-none-elf
            crate: riscv-ci-fixture
            profile: release
            profile_dir: release
            script: examples/ci/riscv-uart-ok.yaml
            system: configs/systems/ci-fixture-riscv-uart1.yaml
          - id: demo-blinky-stm32f103
            target: thumbv7m-none-eabi
            crate: demo-blinky
            profile: release
            profile_dir: release
            script: examples/demo-blinky/io-smoke.yaml
            system: examples/demo-blinky/system.yaml
          - id: stm32h563-nucleo
            target: thumbv7m-none-eabi
            crate: firmware-h563-demo
            profile: release
            profile_dir: release
            script: examples/nucleo-h563zi/uart-smoke.yaml
            system: examples/nucleo-h563zi/system.yaml
          - id: stm32f401cdu6
            target: thumbv7em-none-eabi
            crate: firmware-f401-demo
            profile: release
            profile_dir: release
            script: examples/stm32f401cdu6/uart-smoke.yaml
            system: configs/systems/stm32f401cdu6.yaml
          # The H735 telematics lab — the Cortex-M7 cell, and the only one here
          # whose script asserts PIXELS rather than a UART transcript.
          #
          # Its io-smoke.yaml had been running in NO workflow at all: the lab's
          # four `display_region` boxes (solid header, solid MQTT band, sparse
          # glyph rows, and a max_ink 0.0 dead zone below row 62) existed but
          # gated nothing. The only automated check was the playground deploy's
          # browser lab-smoke, which asserts the CYCLE COUNTER advances and
          # states in its own header that "display motion is REPORTED, never
          # asserted" — so a build painting a black panel still passed.
          #
          # Non-vacuity was verified before wiring this in, not assumed:
          # re-pointing `dc_pin` from PA3 to an unconnected PC13 takes the run
          # from 11/11 to 7/11, with all three ink regions reading 0.0%. The
          # five UART assertions and the mqtt_fabric collect still PASS in that
          # state, which is the whole point — the transcript says "location
          # published" while the panel shows nothing. Cost is negligible: the
          # sim reaches its assertions in 840k steps / 0.23s.
          - id: h735-telematics-lab
            target: thumbv7em-none-eabi
            crate: h735-telematics-lab
            profile: release
            profile_dir: release
            script: examples/h735-telematics-lab/io-smoke.yaml
            system: examples/h735-telematics-lab/system.yaml
          # Note: demo-blinky-stm32f103 already covers F103 bluepill + same ELF;
          # a second identical cell was removed (CI roast 2026-07-23).
          - id: canmod-gps-sim
            make: examples/canmod-gps-sim/firmware
            script: examples/canmod-gps-sim/canmod-smoke.yaml
            system: examples/canmod-gps-sim/system.yaml
          - id: f103-j1939-monitor
            make: examples/f103-j1939-monitor/firmware
            script: examples/f103-j1939-monitor/j1939-replay.yaml
            system: examples/f103-j1939-monitor/replay-system.yaml
          # Committed-ELF cells. No `crate`/`make`: the firmware is a checked-in
          # fixture, so these need no cross toolchain and finish in seconds
          # (measured 0.05s / 0.09s / 2.4s / 2.3s on this tree).
          #
          # All four were found by scripts/ci/chip_coverage.py, which derives
          # per-chip coverage from what CI actually runs. Each smoke was already
          # in the tree and PASSING, and executed by no workflow at all — the
          # same shape as the h735 lab above. They are the only CLI proof for
          # three chips: nrf54l15, stm32f411ceu6 and mkw41z4.
          - id: nrf54l15-dk
            script: examples/nrf54l15-dk/io-smoke.yaml
            system: examples/nrf54l15-dk/system.yaml
          # nrf54lm20a's only CLI proof. Committed ELF, and the only cell here
          # that judges a DISPLAY: its io-smoke asserts ink in the AMOLED's play
          # area and requires the never-addressed strip below it to be exactly
          # black, so a SPIM that completes its transfers into nothing fails.
          - id: nrf54lm20a-snake
            script: examples/nrf54lm20a-snake/io-smoke.yaml
            system: examples/nrf54lm20a-snake/system.yaml
          - id: nrf54l15-smart-ring
            script: examples/nrf54l15-smart-ring/io-smoke.yaml
            system: examples/nrf54l15-smart-ring/system.yaml
          - id: stm32f411ceu6-blackpill
            script: examples/stm32f411ceu6-blackpill/io-smoke.yaml
            system: examples/stm32f411ceu6-blackpill/system.yaml
          - id: kw41z-cow-activity
            script: examples/kw41z-cow-activity/calm.yaml
            system: configs/systems/frdm-kw41z-lcd.yaml
          # BRD2709A / EFR32MG26: first CLI cell for Series-2 Gecko. The
          # uart-smoke ELF is also committed at tests/fixtures/mg26-smoke.elf
          # for the install canary; this cell builds from source so a linker
          # or USART-layout regression cannot hide behind a stale blob.
          - id: brd2709a
            target: thumbv7m-none-eabi
            crate: firmware-mg26-demo
            profile: release
            profile_dir: release
            script: examples/brd2709a/uart-smoke.yaml
            system: examples/brd2709a/system.yaml
          # F405 and F767 had no cell at all: their only smokes borrowed
          # firmware-f401-demo from a sibling part, which needs a build, so no
          # workflow ran them. Their own TIER1 fixtures are committed blobs, so
          # these two cells cost seconds and no toolchain — and they are what
          # found I2C1 answering before its RCC gate on both parts.
          - id: feather-f405
            script: examples/feather-f405/tier1-smoke.yaml
            system: examples/feather-f405/system.yaml
          - id: nucleo-f767zi
            script: examples/nucleo-f767zi/tier1-smoke.yaml
            system: examples/nucleo-f767zi/system.yaml
          # The first CLI cell on an ESP32-S3. No S3 chip had one, because
          # `labwired test` could not boot an S3 image: it recognised the part by
          # an exact name (so every board variant took the generic builder and
          # died with a memory violation) and then booted every S3 image on the
          # factory-partition flash layout (so a bare-metal image's DROM reads
          # landed on the wrong pages and it jumped to 0x0 at step 48). The
          # Arduino matrix's esp32s3 cell could not see either defect — its
          # images DO have a partition table and it never names a board variant.
          # Committed fixture, no toolchain, 3.2s.
          - id: esp32s3-zero
            script: examples/esp32s3-zero/tier1-smoke.yaml
            system: examples/esp32s3-zero/system.yaml
          # nRF5340: real upstream Zephyr v3.7 hello_world on the application
          # core. The ELF already booted in firmware_survival.rs, but IN
          # PROCESS — no CLI ran it, which is why the chip sat in the coverage
          # ledger. Non-vacuity checked: pointed at the nrf52840-dk system the
          # same script drops to 1/3, with both banner assertions failing.
          - id: nrf5340dk-zephyr
            script: examples/nrf5340dk/zephyr-smoke.yaml
            system: examples/nrf5340dk/system.yaml
          # RP2350 — the last chip that no gate ran, and the cell that emptied
          # configs/ci/chip-coverage.yaml (the file is deleted; all 26 chips are
          # covered). The model, the reset-path test and this firmware all
          # existed; there was no system manifest, so no script could name them
          # together and no workflow executed the chip.
          #
          # `build_dir` is not decoration: the linker script comes from the
          # crate's OWN .cargo/config.toml (`-C link-arg=-Tlink.x`), and cargo
          # reads config from the working directory's ancestors, not from the
          # package it is building. Built from the workspace root the same
          # command links entry 0x0 (measured, both ways) and the firmware
          # boots nowhere. The entry-point guard below names that failure
          # instead of leaving it as a silent empty UART.
          #
          # Non-vacuity checked: on the rp2040 descriptor — whose UART0 sits at
          # 0x4003_4000, not the RP2350's 0x4007_0000 — the same script captures
          # zero UART bytes and drops to 1/2.
          - id: rp2350-demo
            target: thumbv8m.main-none-eabi
            crate: firmware-rp2350-demo
            build_dir: crates/firmware-rp2350-demo
            profile: release
            profile_dir: release
            script: examples/rp2350-demo/io-smoke.yaml
            system: examples/rp2350-demo/system.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi,thumbv7m-none-eabi,thumbv7em-none-eabi,thumbv8m.main-none-eabi,riscv32i-unknown-none-elf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-coverage-matrix
          workspaces: |
            . -> target

      - name: Build CLI (release — matches local matrix / fidelity path)
        run: cargo build -p labwired-cli --release

      - name: Install C cross toolchain
        if: matrix.make != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build C firmware
        if: matrix.make != ''
        run: make -C ${{ matrix.make }}

      - name: Build matrix firmware
        if: matrix.crate != ''
        # `build_dir` (default: the workspace root) is the directory cargo runs
        # IN, which is not the same question as which package it builds. A crate
        # whose linker script comes from its own .cargo/config.toml must be
        # built from inside itself — see the rp2350-demo cell.
        working-directory: ${{ matrix.build_dir || '.' }}
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo build -p "${{ matrix.crate }}" --release --target "${{ matrix.target }}"
          else
            cargo build -p "${{ matrix.crate }}" --target "${{ matrix.target }}"
          fi

      # A firmware that linked with entry 0x0 boots nowhere and prints nothing,
      # so the smoke below fails with an empty UART and no clue why. Say it here.
      - name: Firmware must not have linked with entry 0x0
        if: matrix.crate != ''
        run: |
          set -euo pipefail
          elf="target/${{ matrix.target }}/${{ matrix.profile_dir }}/${{ matrix.crate }}"
          entry=$(python3 -c "import struct,sys;print(struct.unpack_from('<I',open(sys.argv[1],'rb').read(),0x18)[0])" "$elf")
          if [ "$entry" -eq 0 ]; then
            echo "::error::$elf linked with entry 0x0 — its linker script was not applied."
            echo "::error::Cargo reads .cargo/config.toml from the working directory, not the package."
            echo "::error::Set build_dir on this matrix cell to the crate's own directory."
            exit 1
          fi
          printf 'entry point 0x%08x\n' "$entry"

      - name: Run matrix smoke
        run: |
          mkdir -p "out/coverage-matrix/${{ matrix.id }}"
          ./target/release/labwired test \
            --script "${{ matrix.script }}" \
            --output-dir "out/coverage-matrix/${{ matrix.id }}" \
            --no-uart-stdout

      # The dual-UE pub/sub story, gated on its own marker.
      #
      # `env-two-ue-smoke.yaml` carries NO assertions, and cannot: the
      # environment runner rejects anything that is not a node-qualified
      # `memory_value` (validate_environment_assertions in
      # crates/cli/src/commands/environment_test.rs), and `memory_value` takes a
      # raw `address: u64` with no symbol lookup — too brittle to pin a static
      # across relinks. So the runner exits 0 with `assertions: []` and
      # `stop_reason: max_steps` whether or not ue_b ever hears ue_a. Verified:
      # a clean run produces `status: pass` with an empty assertion list.
      #
      # env-two-ue.yaml's own header already says collect "is proven by
      # subscriber UART (`location received`)". This step is what makes that
      # sentence true. `grep -q` fails the job when the marker is absent, so a
      # subscriber that silently stops receiving reddens here instead of
      # passing vacuously.
      - name: Dual-UE pub/sub collect (subscriber must actually receive)
        if: matrix.id == 'h735-telematics-lab'
        run: |
          set -euo pipefail
          out="out/coverage-matrix/${{ matrix.id }}-two-ue"
          mkdir -p "$out"
          ./target/release/labwired test \
            --script examples/h735-telematics-lab/env-two-ue-smoke.yaml \
            --output-dir "$out" \
            --no-uart-stdout
          grep -q '+QMTRECV' "$out/uart.log" \
            || { echo "::error::ue_b never received a +QMTRECV from the fabric"; exit 1; }
          grep -q 'location received' "$out/uart.log" \
            || { echo "::error::subscriber never logged 'location received'"; exit 1; }
          echo "dual-UE collect OK: +QMTRECV and 'location received' both present"

      - name: Verify frames against CSS's real DBC
        if: matrix.id == 'canmod-gps-sim'
        run: |
          python3 -m pip install --quiet cantools
          python3 "$(dirname "${{ matrix.script }}")/decode_check.py" \
            "out/coverage-matrix/${{ matrix.id }}/uart.log"

      - name: Run unsupported-instruction audit
        if: matrix.crate != ''
        run: |
          ./scripts/unsupported_instruction_audit.sh \
            --firmware "target/${{ matrix.target }}/${{ matrix.profile_dir }}/${{ matrix.crate }}" \
            --system "${{ matrix.system }}" \
            --max-steps 20000 \
            --out-dir "out/coverage-matrix/${{ matrix.id }}/unsupported-audit"

      - name: Publish audit summary
        if: matrix.crate != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          metrics = Path("out/coverage-matrix/${{ matrix.id }}/unsupported-audit/metrics.json")
          if not metrics.exists():
              print("### Coverage Matrix Audit: ${{ matrix.id }}")
              print("")
              print("- metrics: missing")
          else:
              data = json.loads(metrics.read_text())
              print("### Coverage Matrix Audit: ${{ matrix.id }}")
              print("")
              print(f"- instructions executed: `{data.get('instructions_executed', 0)}`")
              print(f"- unsupported observations: `{data.get('unsupported_total', 0)}`")
              print(f"- instruction support coverage: `{data.get('instruction_support_percent', 0)}%`")
          PY

      - name: Upload matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix-${{ matrix.id }}
          path: out/coverage-matrix/${{ matrix.id }}/
          retention-days: 14

  coverage-matrix-scoreboard:
    name: coverage-matrix-scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: coverage-matrix-smoke
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download matrix artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/coverage-matrix
          pattern: coverage-matrix-*
          merge-multiple: false

      - name: Generate scoreboard
        run: |
          python3 scripts/generate_coverage_matrix_scoreboard.py \
            --matrix-root out/coverage-matrix \
            --markdown-out out/coverage-matrix/scoreboard.md \
            --json-out out/coverage-matrix/scoreboard.json \
            --required-target stm32h563-nucleo \
            --required-target stm32f401cdu6 \
            --required-target riscv-ci-fixture \
            --required-target demo-blinky-stm32f103 \
            --required-target f103-j1939-monitor \
            --required-target canmod-gps-sim \
            --required-target ci-fixture-armv6m \
            --min-required-pass-rate 1.0

      - name: Publish scoreboard summary
        run: |
          cat out/coverage-matrix/scoreboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required targets (100% pass — no soft loophole)
        run: |
          python3 scripts/generate_coverage_matrix_scoreboard.py \
            --matrix-root out/coverage-matrix \
            --markdown-out /tmp/coverage-matrix-gate.md \
            --json-out /tmp/coverage-matrix-gate.json \
            --required-target stm32h563-nucleo \
            --required-target stm32f401cdu6 \
            --required-target riscv-ci-fixture \
            --required-target demo-blinky-stm32f103 \
            --required-target f103-j1939-monitor \
            --required-target canmod-gps-sim \
            --required-target ci-fixture-armv6m \
            --min-required-pass-rate 1.0

      - name: Upload scoreboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix-scoreboard
          path: |
            out/coverage-matrix/scoreboard.md
            out/coverage-matrix/scoreboard.json
          retention-days: 14
