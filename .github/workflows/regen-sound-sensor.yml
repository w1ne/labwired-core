name: Regenerate sound sensor artifacts

on:
  push:
    branches:
      - fix/sound-sensor-siminput

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sound-sensor-siminput
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Regenerate peripheral manifest
        run: |
          cargo run -q -p labwired-cli --bin gen-peripherals-manifest -- \
            --out crates/core/tests/fixtures/peripherals/manifest.json

      - name: Regenerate configuration-reference catalog
        run: python3 scripts/ci/device_catalog_doc.py --write

      - name: Commit generated artifacts and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regen-sound-sensor.yml
          git add crates/core/tests/fixtures/peripherals/manifest.json docs/configuration_reference.md
          git diff --cached --stat
          git commit -m "chore: regenerate sound sensor catalog artifacts"
          git push origin HEAD:fix/sound-sensor-siminput
