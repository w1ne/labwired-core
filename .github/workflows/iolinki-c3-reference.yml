name: ESP32-C3 IO-Link firmware prerequisite
on:
  pull_request:
    # Lean PR gate (2026-11-13): on pull requests this lane runs only when
    # its own files change. Shared engine paths (crates/core, crates/cli,
    # Cargo.*) trigger it in the daily schedule instead.
    paths:
      - 'configs/chips/esp32c3.yaml'
      - '.github/workflows/iolinki-c3-reference.yml'
  push:
    branches: [main]
    paths:
      - 'configs/chips/esp32c3.yaml'
      - '.github/workflows/iolinki-c3-reference.yml'
  # Shared-engine regressions (crates/core, crates/cli, crates/config, Cargo.*)
  # are caught daily instead of on every main push: this lane cost ~9 runner-min
  # per push, ~31 pushes/day, and the PR lane already skips it for engine edits.
  schedule:
    - cron: "50 2 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  c3-esp-idf-firmware-wake:
    # Cron runs are gated to this repository (a fork would mail failures to a
    # maintainer here about a run they cannot see).
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: w1ne/iolinki
          ref: 5572a628b8befa6a9c74496311da2359868f96d9
          path: .iolinki
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19
      # Restore everywhere, save only off pull requests (step below). This
      # toolchain cache is ~1.5 GB; `actions/cache@v4` saved a PR-ref copy on
      # every PR, readable only by that PR, which evicted main's entries out of
      # the 10 GB budget (see `core-pr-gate` in core-ci.yml).
      - id: pio-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-iolinki-pio-6.1.19-espressif32-6.10.0-idf-5.4.0
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build actual native ESP-IDF customer firmware
        run: |
          platformio run -d .iolinki/examples/esp32_l6362a -e esp32c3
          sha256sum .iolinki/examples/esp32_l6362a/.pio/build/esp32c3/firmware.elf
      - name: Save PlatformIO toolchain cache (main only)
        if: github.event_name != 'pull_request' && steps.pio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.platformio
          key: ${{ steps.pio-cache.outputs.cache-primary-key }}
      - name: Execute genuine ROM boot and actual GPIO ISR in both modes
        env:
          IOLINKI_C3_ELF: ${{ github.workspace }}/.iolinki/examples/esp32_l6362a/.pio/build/esp32c3/firmware.elf
        run: |
          cargo test -p labwired-core --test esp -- --include-ignored c3_gpio_interrupts:: c3_reference_firmware::
          cargo test -p labwired-core --features event-scheduler --test esp -- --include-ignored c3_gpio_interrupts:: c3_reference_firmware::
      - uses: actions/upload-artifact@v4
        with:
          name: iolinki-c3-esp-idf-firmware-prerequisite
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .iolinki/examples/esp32_l6362a/.pio/build/esp32c3/firmware.elf
            .iolinki/examples/esp32_l6362a/.pio/build/esp32c3/iolinki_esp32c3_l6362a.map
            .iolinki/examples/esp32_l6362a/.pio/build/esp32c3/firmware.bin
            .iolinki/examples/esp32_l6362a/.pio/build/esp32c3/bootloader.bin
            .iolinki/examples/esp32_l6362a/.pio/build/esp32c3/partitions.bin
