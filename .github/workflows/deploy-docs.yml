name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # docs/boards/VALIDATION_STATUS.md is rendered at deploy time from the
      # manifest and the source it watches, so those changes republish it.
      - 'validation/boards/**'
      - 'validation/registry_dir.py'
      - 'scripts/generate_validation_status.py'
      - 'configs/**'
      - 'crates/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The validation report derives source dates from full history.
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt pyyaml

      # Not committed: render the board validation report into the docs tree so
      # the site serves it at /boards/VALIDATION_STATUS/ and existing links work.
      - name: Render validation status report
        run: python3 scripts/generate_validation_status.py

      - name: Build and Deploy
        run: mkdocs gh-deploy --force
