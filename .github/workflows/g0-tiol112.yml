name: G0B1 TIOL112 digital rig
on:
  pull_request:
    # Lean PR gate (2026-11-13): on pull requests this lane runs only when
    # its own files change. Shared engine paths (crates/core, crates/cli,
    # Cargo.*) trigger it on push to main instead.
    paths:
      - 'configs/chips/stm32g0b1re.yaml'
      - 'configs/systems/nucleo-g0b1re.yaml'
      - 'crates/core/src/peripherals/components/tiol112.rs'
      - 'crates/core/src/peripherals/components/iolink_master.rs'
      - 'crates/core/src/peripherals/stm32g0_clock.rs'
      - 'crates/core/tests/g0_*'
      - 'crates/core/tests/iolink_master_config.rs'
      - 'crates/core/tests/stm32g0_uart_dma.rs'
      - 'crates/core/tests/common/g0_dma_recovery.rs'
      - '.github/workflows/g0-tiol112.yml'
  push:
    branches: [main]
    paths:
      - 'configs/chips/stm32g0b1re.yaml'
      - 'configs/systems/nucleo-g0b1re.yaml'
      - 'crates/core/src/peripherals/components/tiol112.rs'
      - 'crates/core/src/peripherals/components/iolink_master.rs'
      - 'crates/core/src/peripherals/stm32g0_clock.rs'
      - 'crates/core/src/peripherals/rcc.rs'
      - 'crates/core/src/peripherals/dma.rs'
      - 'crates/core/src/peripherals/dmamux.rs'
      - 'crates/core/src/peripherals/generic_factory.rs'
      - 'crates/core/src/peripheral.rs'
      - 'crates/core/src/bus/tick.rs'
      - 'crates/core/src/peripherals/uart*'
      - 'crates/core/src/peripherals/uart/**'
      - 'crates/core/src/network/timed_uart.rs'
      - 'crates/core/tests/g0_*'
      - 'crates/core/tests/iolink_master_config.rs'
      - 'crates/core/tests/stm32g0_uart_dma.rs'
      - 'crates/core/tests/common/g0_dma_recovery.rs'
      - '.github/workflows/g0-tiol112.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  digital-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p labwired-core --test g0_tiol112 --test modern_uart_timing --test g0_uart_pad --test g0_exti
      - run: cargo test -p labwired-core --test iolink_master_config
      - run: cargo test -p labwired-core --test stm32g0_uart_dma --test stm32g0_dmamux_generators
      - run: cargo test -p labwired-core --features event-scheduler --test g0_tiol112 --test modern_uart_timing --test stm32g0_uart_dma --test stm32_dma_walk_differential
