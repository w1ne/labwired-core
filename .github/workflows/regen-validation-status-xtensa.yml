name: Regenerate validation status for Xtensa PR

on:
  push:
    branches:
      - fix/xtensa-elf-vaddr

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xtensa-elf-vaddr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml
      - run: python3 scripts/generate_validation_status.py
      - name: Commit generated status and remove helper
        run: |
          git config user.name "labwired-bot"
          git config user.email "bot@labwired.com"
          git rm .github/workflows/regen-validation-status-xtensa.yml
          git add docs/boards/VALIDATION_STATUS.md
          git commit -m "chore: regenerate validation status"
          git push origin HEAD:fix/xtensa-elf-vaddr
