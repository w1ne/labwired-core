name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-x86_64
            binary: labwired
            archive_format: tar.gz
            shell: bash
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux-aarch64
            cross: true
            binary: labwired
            archive_format: tar.gz
            shell: bash
          - target: x86_64-apple-darwin
            runner: macos-latest
            platform: darwin-x86_64
            binary: labwired
            archive_format: tar.gz
            shell: bash
          - target: aarch64-apple-darwin
            runner: macos-latest
            platform: darwin-aarch64
            binary: labwired
            archive_format: tar.gz
            shell: bash
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform: windows-x86_64
            binary: labwired.exe
            archive_format: zip
            shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: . -> target

      - name: Install cross (for aarch64 Linux)
        if: matrix.cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build -p labwired-cli --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.cross != true
        run: cargo build -p labwired-cli --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.archive_format == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          PLATFORM="${{ matrix.platform }}"
          ARCHIVE="labwired-${VERSION}-${PLATFORM}.tar.gz"

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/labwired
          chmod +x dist/labwired

          tar -czf "${ARCHIVE}" -C dist labwired
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package Windows binary
        if: matrix.archive_format == 'zip'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          $archive = "labwired-$version-${{ matrix.platform }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" 'dist/labwired.exe'
          Compress-Archive -Path 'dist/labwired.exe' -DestinationPath $archive -Force
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: labwired-${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate archive checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          test -s dist/SHA256SUMS

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: LabWired ${{ github.ref_name }}
          body: |
            ## Installation

            ```sh
            curl -fsSL https://labwired.com/install.sh | sh
            ```

            Or with a specific version:

            ```sh
            curl -fsSL https://labwired.com/install.sh | LABWIRED_VERSION=${{ github.ref_name }} sh
            ```

            See the [full changelog](CHANGELOG.md) for what's new.
          files: dist/*
          fail_on_unmatched_files: true
