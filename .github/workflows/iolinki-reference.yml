name: IO-Link customer firmware prerequisites
on:
  pull_request:
    paths:
      - 'crates/core/**'
      - 'crates/cli/**'
      - 'validation/iolinki/**'
      - 'configs/systems/iolinki-g0-startup.yaml'
      - 'crates/config/**'
      - 'crates/loader/**'
      - 'configs/chips/stm32g0b1re.yaml'
      - 'configs/chips/stm32u575.yaml'
      - '.github/workflows/iolinki-reference.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g0-firmware-wake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: w1ne/iolinki
          ref: 5572a628b8befa6a9c74496311da2359868f96d9
          path: .iolinki
      - uses: actions/checkout@v4
        with:
          repository: STMicroelectronics/cmsis-device-g0
          ref: f576c24e123edf3332988ecd49512c0f35f85186
          path: .vendor/g0
      - uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS_5
          ref: 61e36449f53c25ef7825c40f7dd93685736f457f
          path: .vendor/cmsis
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Read-only on pull requests; see `core-pr-gate` in core-ci.yml.
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install ARM GCC
        timeout-minutes: 10
        uses: ./.github/actions/apt-install-cached
        with:
          packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build actual customer firmware
        env:
          STM32_CMSIS_ROOT: ${{ github.workspace }}/.vendor/g0
          CMSIS_CORE_ROOT: ${{ github.workspace }}/.vendor/cmsis/CMSIS/Core
          BUILD_DIR: ${{ github.workspace }}/.iolinki-g0-build
        run: |
          bash .iolinki/examples/stm32g0_tiol112/build.sh
          sha256sum .iolinki-g0-build/reference-device.elf
      - name: Verify GPIO mux and actual wake ISR in both execution modes
        env:
          IOLINKI_G0_ELF: ${{ github.workspace }}/.iolinki-g0-build/reference-device.elf
        run: |
          cargo test -p labwired-core --test g0_uart_pad --test g0_exti --test g0_reference_firmware -- --include-ignored
          cargo test -p labwired-core --features event-scheduler --test g0_uart_pad --test g0_exti --test g0_reference_firmware -- --include-ignored
      - name: Prove actual ELF startup through the user-facing CLI
        run: |
          cargo run -p labwired-cli --bin labwired -- test --script validation/iolinki/g0-startup.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: iolinki-g0-firmware-prerequisite
          path: .iolinki-g0-build/reference-device.*
          include-hidden-files: true
          if-no-files-found: error
  u5-zephyr-firmware-wake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: w1ne/iolinki
          ref: 5572a628b8befa6a9c74496311da2359868f96d9
          path: .iolinki
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # Read-only on pull requests; see `core-pr-gate` in core-ci.yml.
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install ARM GCC
        timeout-minutes: 10
        uses: ./.github/actions/apt-install-cached
        with:
          packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Install Zephyr board build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          timeout 600 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y cmake ninja-build device-tree-compiler
          pip install west
          # west init --mr only accepts a branch or tag. This pin is a commit.
          mkdir -p .zephyr-workspace/zephyr
          git -C .zephyr-workspace/zephyr init
          git -C .zephyr-workspace/zephyr remote add origin https://github.com/zephyrproject-rtos/zephyr
          git -C .zephyr-workspace/zephyr fetch --depth 1 origin c66235fb7346bbe3dbedd1dd76ec5a37a8e8262b
          git -C .zephyr-workspace/zephyr checkout --detach FETCH_HEAD
          west init -l .zephyr-workspace/zephyr
          cd .zephyr-workspace
          west update cmsis hal_stm32
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt
      - name: Build actual customer Zephyr firmware
        working-directory: .zephyr-workspace
        run: |
          west build -b nucleo_u575zi_q ../.iolinki/samples/stm32u5_tiol112 -d ../.iolinki-u5-build -- -DZEPHYR_TOOLCHAIN_VARIANT=gnuarmemb -DGNUARMEMB_TOOLCHAIN_PATH=/usr
          sha256sum ../.iolinki-u5-build/zephyr/zephyr.elf
      - name: Verify microsecond timer, SIO mux and actual WAKE ISR in both execution modes
        env:
          IOLINKI_U5_ELF: ${{ github.workspace }}/.iolinki-u5-build/zephyr/zephyr.elf
        run: |
          cargo test -p labwired-core --test u5_exti --test u5_reference_firmware -- --include-ignored
          cargo test -p labwired-core --features event-scheduler --test u5_exti --test u5_reference_firmware -- --include-ignored
      - uses: actions/upload-artifact@v4
        with:
          name: iolinki-u5-firmware-prerequisite
          path: |
            .iolinki-u5-build/zephyr/zephyr.elf
            .iolinki-u5-build/zephyr/zephyr.map
            .iolinki-u5-build/zephyr/zephyr.hex
          include-hidden-files: true
          if-no-files-found: error
