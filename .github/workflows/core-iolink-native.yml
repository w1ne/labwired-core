name: Core IO-Link Native

on:
  push:
    paths:
      - ".github/workflows/core-iolink-native.yml"
      - "Cargo.lock"
      - "crates/core/Cargo.toml"
      - "crates/core/build.rs"
      - "crates/core/native/**"
      - "crates/cli/src/execute.rs"
      - "crates/cli/tests/uart_ordered_cache.rs"
      - "crates/core/src/bus/construct.rs"
      - "crates/core/src/peripherals/device.rs"
      - "crates/core/src/peripherals/esp_uart.rs"
      - "crates/core/src/peripherals/uart.rs"
      - "crates/core/src/peripherals/components/iolink_master.rs"
      - "crates/core/src/peripherals/components/mlx90640.rs"
      - "crates/core/tests/iolink_master_config.rs"
      - "crates/core/tests/mlx90640_clock.rs"
      - "crates/core/src/peripherals/components/iolink_native.rs"
      - "crates/core/src/peripherals/components/iolink_station.rs"
      - "crates/core/src/world.rs"
      - "crates/core/tests/iolink_native_master.rs"
      - "crates/core/tests/world_multichip.rs"
      - "crates/core/tests/world_station_services.rs"
      - "crates/core/src/network/mod.rs"
      - "crates/core/src/network/virtual_uart_wire.rs"
      - "crates/core/src/fidelity.rs"
      - "examples/iolink-dido/**"
      - "examples/iolink-station/**"
      - "examples/esp32c3-mlx90640-thermal/**"
      - "third_party/iolinki"
      - "third_party/iolinki-master/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/core-iolink-native.yml"
      - "Cargo.lock"
      - "crates/core/Cargo.toml"
      - "crates/core/build.rs"
      - "crates/core/native/**"
      - "crates/cli/src/execute.rs"
      - "crates/cli/tests/uart_ordered_cache.rs"
      - "crates/core/src/bus/construct.rs"
      - "crates/core/src/peripherals/device.rs"
      - "crates/core/src/peripherals/esp_uart.rs"
      - "crates/core/src/peripherals/uart.rs"
      - "crates/core/src/peripherals/components/iolink_master.rs"
      - "crates/core/src/peripherals/components/mlx90640.rs"
      - "crates/core/tests/iolink_master_config.rs"
      - "crates/core/tests/mlx90640_clock.rs"
      - "crates/core/src/peripherals/components/iolink_native.rs"
      - "crates/core/src/peripherals/components/iolink_station.rs"
      - "crates/core/src/world.rs"
      - "crates/core/tests/iolink_native_master.rs"
      - "crates/core/tests/world_multichip.rs"
      - "crates/core/tests/world_station_services.rs"
      - "crates/core/src/network/mod.rs"
      - "crates/core/src/network/virtual_uart_wire.rs"
      - "crates/core/src/fidelity.rs"
      - "examples/iolink-dido/**"
      - "examples/iolink-station/**"
      - "examples/esp32c3-mlx90640-thermal/**"
      - "third_party/iolinki"
      - "third_party/iolinki-master/**"
  workflow_dispatch:

concurrency:
  group: core-iolink-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iolink-native:
    name: iolink-native-c-master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LabWired core
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure private submodule auth
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout iolinki device submodule
        run: git submodule update --init --depth 1 third_party/iolinki

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install host C toolchain
        timeout-minutes: 10
        uses: ./.github/actions/apt-install-cached
        with:
          packages: build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Show host C toolchain
        run: |
          cc --version
          arm-none-eabi-gcc --version

      # LABWIRED_STRICT_FIDELITY makes the first undecoded instruction or
      # unmapped MMIO access this real firmware hits a hard failure, instead of
      # a silent skip. This is the early-warning guard for the class of bug that
      # let newlib's SIMD strlen (UADD8/SEL) run as NOPs and corrupt string
      # ISDU reads for months.
      - name: Native C master UART-boundary tests (strict fidelity)
        env:
          LABWIRED_STRICT_FIDELITY: "1"
        run: cargo test -p labwired-core --features iolink-native --test iolink_native_master -- --nocapture

      - name: Native C master compile check
        run: cargo check -p labwired-core --features iolink-native

      - name: Fetch STM32L4 firmware device pack
        uses: ./.github/actions/fetch-pack
        with:
          pack: stm32cubel4@v1.18.2

      - name: Build the real station master and device firmware
        run: bash examples/iolink-station/ci/build.sh

      # The script requires every ELF. Protocol drift between the pinned device,
      # vendored master and service fixtures must fail here instead of skipping
      # until a downstream repository overlays its current master sources.
      - name: Run station, DIDO and full service tests with real firmware
        run: bash examples/iolink-station/ci/test.sh

      - name: Upload LabWired IO-Link simulation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labwired-iolink-native
          path: out/iolink

  # Build smoke for the ESP32-C3 thermal-fingerprint firmware, which links the
  # iolinki DEVICE stack for riscv32. This is the firmware an iolinki submodule
  # pin bump silently broke (issue #445: iolink_core.c removed by the reentrant
  # device-context line) — building it here makes the next API-breaking pin
  # bump fail this workflow instead of the example.
  thermal-firmware-build:
    name: esp32c3-mlx90640-thermal firmware build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LabWired core
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure private submodule auth
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout iolinki device submodule
        run: git submodule update --init --depth 1 third_party/iolinki

      # The Espressif riscv32 GCC the example's Makefile auto-discovers under
      # ~/.platformio/packages/toolchain-riscv32-esp (pipx ships on the runner).
      - name: Install riscv32-esp toolchain via PlatformIO
        run: |
          pipx install platformio
          pio pkg install --global --tool "platformio/toolchain-riscv32-esp"
          "$HOME/.platformio/packages/toolchain-riscv32-esp/bin/riscv32-esp-elf-gcc" --version

      - name: Build thermal-fingerprint firmware against the pinned iolinki
        run: make -C examples/esp32c3-mlx90640-thermal/firmware

      - name: Upload the source-built thermal firmware
        uses: actions/upload-artifact@v4
        with:
          name: thermal-firmware-${{ github.run_id }}
          path: examples/esp32c3-mlx90640-thermal/firmware/thermal_fingerprint.elf
          if-no-files-found: error

  thermal-scenarios:
    name: thermal clock and IO-Link scenarios
    needs: thermal-firmware-build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      # Match the test harness so the CLI reuses the same compiled Core.
      CARGO_PROFILE_RELEASE_PANIC: "unwind"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: thermal-firmware-${{ github.run_id }}
          path: examples/esp32c3-mlx90640-thermal/firmware
      # Select both packages in one invocation so CLI's IR/SVD dependency
      # features and the unwind test profile use one compiled Core artifact.
      # Cargo also builds the labwired binary used by the integration test.
      - name: Check calibration, native UART, and ordered verdict contracts
        run: >-
          cargo test --locked --release -p labwired-core -p labwired-cli
          --features labwired-core/event-scheduler
          --test mlx90640_clock --test iolink_master_config --test uart_ordered_cache
      - name: Complete normal and fault scenarios, with and without IO-Link
        run: |
          for script in test test-fault test-iolink test-iolink-fault; do
            target/release/labwired test \
              --script "examples/esp32c3-mlx90640-thermal/$script.yaml" \
              --output-dir "out/thermal/$script"
          done
      - name: Upload complete scenario receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermal-scenarios-${{ github.run_id }}
          path: out/thermal
          if-no-files-found: warn
