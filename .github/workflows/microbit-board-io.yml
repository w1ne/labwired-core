name: microbit active board qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'configs/chips/nrf52833.yaml'
      - 'configs/peripherals/nrf52833/**'
      - 'configs/systems/microbit-v2.yaml'
      - 'crates/core/src/**'
      - 'crates/core/Cargo.toml'
      - 'crates/wasm/src/inputs.rs'
      - 'crates/core/tests/microbit_v2*.rs'
      - 'examples/microbit-v2/**'
      - 'scripts/perf/*microbit*'
      - '.github/workflows/microbit-board-io.yml'
  push:
    branches: [main]
    paths:
      - 'configs/chips/nrf52833.yaml'
      - 'configs/peripherals/nrf52833/**'
      - 'configs/systems/microbit-v2.yaml'
      - 'crates/core/src/**'
      - 'crates/core/Cargo.toml'
      - 'crates/wasm/src/inputs.rs'
      - 'crates/core/tests/microbit_v2*.rs'
      - 'examples/microbit-v2/**'
      - 'scripts/perf/*microbit*'
      - '.github/workflows/microbit-board-io.yml'
permissions:
  contents: read
concurrency:
  group: microbit-board-${{ github.ref }}
  cancel-in-progress: true
jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install source guest compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Record qualification runner and toolchains
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            uname -a
            lscpu
            rustc -Vv
            cargo -V
            arm-none-eabi-gcc --version
          } > microbit-runner-context.txt
      - name: Prove silicon GPIO mapping and guest board behavior
        env:
          LABWIRED_GUEST_ARTIFACT_DIR: ${{ github.workspace }}/adc-guest-artifacts
        run: |
          python3 scripts/perf/test_microbit_active_report.py
          python3 scripts/perf/test_microbit_motion_report.py
          cargo test --release -p labwired-core --features microbit-board-io-test \
            --test nrf52833_config --test nrf52833_gpio_geometry \
            --test microbit_v2_led_matrix --test microbit_v2_board_io_guest \
            --test microbit_v2_motion_io_guest --test peripheral_kit_gate
          cargo test --release -p labwired-core --features microbit-board-io-test \
            --test microbit_v2_adc_scan_guest
          cargo test --release -p labwired-core --features microbit-board-io-test \
            --test nrf52_easydma_tick512_fidelity
          for suite in chip_map::tests nrf52::gpiote::tests nrf52::saadc::tests gpio::tests gpio::nrf_pull_tests gpio::nrf_pull_mask_tests gpio::routing_tests lsm303agr_halves_are_declarative_at_their_silicon_addresses cpu::cortex_m::t16_countdown_tests cpu::cortex_m; do
            cargo test --release -p labwired-core --features microbit-board-io-test \
              --lib "$suite"
          done
      - name: Prove native WASM analog input routing
        run: cargo test --release -p labwired-wasm --lib adc_routing_tests
      - name: Measure active board throughput
        shell: bash
        env:
          LABWIRED_REQUIRE_REALTIME: '1'
        run: |
          set -o pipefail
          cargo test --release -p labwired-core --features microbit-board-io-test \
            --test microbit_v2_board_io_guest active_display_button_workload_throughput \
            -- --ignored --nocapture | tee microbit-active-throughput.log
          python3 scripts/perf/microbit_active_report.py \
            --log microbit-active-throughput.log --commit "$GITHUB_SHA" \
            --output microbit-active-throughput.json
          # The initial hosted five-sample baseline exceeded1x. Require that
          # median while retaining every raw sample and exact provenance.
      - name: Measure guest motion, display and button throughput
        shell: bash
        env:
          LABWIRED_REQUIRE_REALTIME: '1'
          LABWIRED_GUEST_ARTIFACT_DIR: ${{ github.workspace }}/motion-guest-artifacts
        run: |
          set -o pipefail
          benchmark_status=0
          cargo test --release -p labwired-core --features microbit-board-io-test \
            --test microbit_v2_motion_io_guest active_motion_display_button_workload_throughput \
            -- --ignored --nocapture | tee microbit-motion-throughput.log || benchmark_status=$?
          python3 scripts/perf/microbit_motion_report.py \
            --log microbit-motion-throughput.log --commit "$GITHUB_SHA" \
            --output microbit-motion-throughput.json
          exit "$benchmark_status"
      - name: Upload active workload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microbit-active-board-evidence
          path: |
            microbit-runner-context.txt
            microbit-active-throughput.log
            microbit-active-throughput.json
            microbit-motion-throughput.log
            microbit-motion-throughput.json
            motion-guest-artifacts/*.elf
            adc-guest-artifacts/*.elf
