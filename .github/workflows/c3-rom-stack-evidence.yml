name: C3 ROM stack regression evidence
on:
  push:
    branches: [test/c3-rom-stack-20261119]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Focused browser constructor test
        run: cargo test -p labwired-wasm --lib romboot_tests::c3_flash_fast_start_uses_rom_reset_stack -- --exact --nocapture
