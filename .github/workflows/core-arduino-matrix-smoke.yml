name: Core Arduino Matrix Smoke

# Stock Arduino on every boards.yaml MCU: L0 + L2 + L3_i2c + L4_spi kits.
# Required status: `arduino-matrix-gate` (branch protection).
# See validation/FRAMEWORK_FLEET.md.

on:
  # Slow fleet: nightly + main tip + manual. Not on PRs (PR merge target <1 min).
  schedule:
    - cron: "20 2 * * *"
  push:
    branches:
      - main
    paths:
      - "validation/arduino-matrix/**"
      - "validation/matrix_lib/**"
      - "configs/chips/**"
      - "configs/systems/**"
      - "crates/core/**"
      - "crates/cli/**"
      - ".github/workflows/core-arduino-matrix-smoke.yml"
  workflow_dispatch:

concurrency:
  group: core-arduino-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arduino-matrix:
    name: arduino-${{ matrix.board }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32
          - esp32c3
          - esp32s3
          - nrf52832
          - nrf52840
          - rp2040
          - stm32f103
          - stm32f401
          - stm32f407
          - stm32g474re
          - stm32h563
          - stm32l073
          - stm32l476
          - stm32wb55
          - stm32wba52
          - atmega328p

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-arduino-matrix
          workspaces: |
            . -> target

      - name: Build release CLI
        run: cargo build -p labwired-cli --release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No distro gcc-arm-none-eabi apt: PlatformIO installs its own toolchains,
      # and parallel apt-get across matrix jobs has hung runners for 20+ minutes.

      # WHY THE KEY IS THE PLATFORM AND NOT THE BOARD.
      #
      # `~/.platformio` holds a PLATFORM's toolchain, and sixteen boards in this
      # matrix pull only FIVE platforms — nine of them are `ststm32`. Keying per
      # board stored the same ~0.7 GB toolchain nine times over.
      #
      # Measured 2026-08-20: fifteen `pio-<board>-` entries held ~8.5 GB of the
      # repository's 10 GB Actions cache budget. That is not merely wasteful, it
      # is what EVICTS the one cache every pull request depends on — the 0.96 GB
      # `v0-rust-core-ci` target dir that `pr-workspace-tests` restores in all
      # three shards. A nightly fleet lane was starving every PR of its warm
      # build, which is how "No cache found" and a cold 8-minute build per shard
      # became normal (see the timing block in core-ci.yml).
      #
      # Five keys instead of sixteen: ~8.5 GB -> ~2.3 GB, freeing ~6 GB.
      #
      # Matrix jobs sharing one key race to save it. That is fine and is not an
      # error: the loser logs "Cache already exists", and a board whose extra
      # sub-packages are missing from the winner's copy simply downloads them.
      # This is a warm start, never a correctness input.
      - name: Which PlatformIO platform this board needs
        id: pio
        run: |
          case "${{ matrix.board }}" in
            stm32*)      platform=ststm32 ;;
            nrf*)        platform=nordicnrf52 ;;
            rp2040)      platform=raspberrypi ;;
            esp32*)      platform=espressif32 ;;
            atmega328p)  platform=atmelavr ;;
            *)
              echo "::error::no PlatformIO platform mapped for board '${{ matrix.board }}'"
              exit 1
              ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "board ${{ matrix.board }} -> platform $platform"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ steps.pio.outputs.platform }}-${{ hashFiles('validation/arduino-matrix/boards.yaml') }}
          restore-keys: |
            pio-${{ steps.pio.outputs.platform }}-

      - name: Install PyYAML + PlatformIO
        run: |
          python -m pip install --quiet 'platformio>=6.1' pyyaml
          # Warm the platform resolved above — one source for the mapping, so
          # the cache key and the thing being cached can never disagree.
          pio pkg install -g -p "${{ steps.pio.outputs.platform }}"

      - name: Arduino matrix (L0 + L2 + L3 I2C kit)
        env:
          LABWIRED_RP2040_BOOTROM: ${{ github.workspace }}/crates/core/roms/rp2040/bootrom.bin
        run: |
          set -euo pipefail
          # Absolute --out so PIO work dirs never break under cwd tricks.
          OUT="${{ github.workspace }}/validation/arduino-matrix/out-ci/${{ matrix.board }}"
          python3 validation/arduino-matrix/run_matrix.py \
            --boards "${{ matrix.board }}" \
            --sketches L0_serial_boot,L1_serial_loop,L2_blink_serial,L3_i2c_sensor,L4_spi_sensor,L5_adc,L6_pwm,L7_timer,L8_can \
            --out "$OUT"

      - name: Upload board artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arduino-matrix-${{ matrix.board }}
          path: validation/arduino-matrix/out-ci/${{ matrix.board }}/
          retention-days: 14
          if-no-files-found: ignore

  arduino-matrix-gate:
    name: arduino-matrix-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: arduino-matrix
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: validation/arduino-matrix/out-ci
          pattern: arduino-matrix-*
          merge-multiple: false

      - name: Require full fleet cells pass
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          # 16 boards × 9 sketches (L0–L8); skips count as cells
          EXPECTED = 16 * 9
          root = Path("validation/arduino-matrix/out-ci")
          results = list(root.rglob("results.json"))
          if not results:
              print("::error::no results.json from arduino matrix jobs", file=sys.stderr)
              sys.exit(1)

          bad = []
          total = 0
          for path in results:
              data = json.loads(path.read_text())
              for row in data.get("rows") or []:
                  total += 1
                  st = row.get("status")
                  # skipped = explicit boards.yaml sketches_skip (e.g. STM32 L3 Wire)
                  if st not in ("pass", "skipped"):
                      bad.append(f"{row.get('board')}/{row.get('sketch')}: {st}")
          print(f"cells={total} expected>={EXPECTED} fails={len(bad)}")
          for b in bad:
              print("FAIL", b)
          if total < EXPECTED:
              print(f"::error::expected ≥{EXPECTED} cells, got {total}", file=sys.stderr)
              sys.exit(1)
          if bad:
              sys.exit(1)
          print("arduino matrix gate: full fleet pass (pass|skipped ok)")
          PY
