name: PCA OE paired evidence
on:
  push:
    branches: [test/pca-oe-paired-20-evidence-20261119]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run app-generated 20-servo fixture on core
        run: cargo test --locked -p labwired-core --test pca_oe_paired_generated -- --nocapture
