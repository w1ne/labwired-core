name: CRA secure-boot evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "examples/nrf52840-secure-boot-lab/**"
      - "crates/firmware-nrf52840-secure-boot/**"
      - "crates/core/src/peripherals/components/atecc608a.rs"
      - "crates/cli/**"
      - ".github/workflows/core-cra-secure-boot-evidence.yml"
  pull_request:
    paths:
      - "examples/nrf52840-secure-boot-lab/**"
      - "crates/firmware-nrf52840-secure-boot/**"
      - "crates/core/src/peripherals/components/atecc608a.rs"
      - "crates/cli/**"
      - ".github/workflows/core-cra-secure-boot-evidence.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv7em-none-eabi

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cra-secure-boot-evidence

      - name: Gate — no committed OEM private keys
        run: |
          if find examples/nrf52840-secure-boot-lab -name "*.pem" | grep -q .; then
            echo "PEM files must not live under the lab directory" >&2
            exit 1
          fi
          if grep -R "BEGIN EC PRIVATE KEY" examples/nrf52840-secure-boot-lab \
            --include="*.py" --include="*.yaml" --include="*.md" --include="*.json"; then
            echo "OEM private key material must not live in the lab directory" >&2
            exit 1
          fi

      - name: Run evidence CI
        run: ./examples/nrf52840-secure-boot-lab/run_evidence_ci.sh
        env:
          OUT_DIR: ${{ github.workspace }}/out/nrf52840-secure-boot-evidence
          PACK_DIR: ${{ github.workspace }}/out/nrf52840-secure-boot-evidence/cra-evidence-pack

      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cra-evidence-pack
          path: out/nrf52840-secure-boot-evidence/cra-evidence-pack/
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          if [ -f out/nrf52840-secure-boot-evidence/cra-evidence-pack/claims.md ]; then
            cat out/nrf52840-secure-boot-evidence/cra-evidence-pack/claims.md >> "$GITHUB_STEP_SUMMARY"
          fi
