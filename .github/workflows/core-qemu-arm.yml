name: Native QEMU-derived ARM core

on:
  pull_request:
    paths:
      - "Cargo.*"
      - "crates/core/**"
      - "crates/arm-system/**"
      - "crates/arm-core/**"
      - "third_party/tlib/**"
      - "third_party/tlib-PROVENANCE.md"
      - "crates/cli/**"
      - "crates/config/**"
      - "crates/loader/**"
      - "configs/chips/rv1103.yaml"
      - "configs/systems/luckfox-pico-mini-a.yaml"
      - "examples/cortex-a7-core/**"
      - "examples/luckfox-pico-mini-a-linux/**"
      - "scripts/prepare-rv1103-linux.py"
      - "scripts/tests/test_prepare_rv1103_linux.py"
      - "scripts/prepare-rv1103-basket.py"
      - "scripts/tests/test_prepare_rv1103_basket.py"
      - "scripts/tests/test_basket_ci.py"
      - "scripts/ci/validate-basket-ci-inputs.py"
      - "tests/fixtures/cortex-a7-core-smoke.elf"
      - "tests/fixtures/kv260-r5-zephyr-*.elf"
      - "crates/firmware-kv260-r5-zephyr/**"
      - "configs/chips/xck26-rpu.yaml"
      - "configs/systems/kv260-r5.yaml"
      - "examples/kv260-r5/**"
      - "tools/cosim/**"
      - "examples/smart-basket-power/**"
      - ".github/workflows/core-qemu-arm.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.*"
      - "crates/core/**"
      - "crates/arm-system/**"
      - "crates/arm-core/**"
      - "third_party/tlib/**"
      - "third_party/tlib-PROVENANCE.md"
      - "crates/cli/**"
      - "crates/config/**"
      - "crates/loader/**"
      - "configs/chips/rv1103.yaml"
      - "configs/systems/luckfox-pico-mini-a.yaml"
      - "examples/cortex-a7-core/**"
      - "examples/luckfox-pico-mini-a-linux/**"
      - "scripts/prepare-rv1103-linux.py"
      - "scripts/tests/test_prepare_rv1103_linux.py"
      - "scripts/prepare-rv1103-basket.py"
      - "scripts/tests/test_prepare_rv1103_basket.py"
      - "scripts/tests/test_basket_ci.py"
      - "scripts/ci/validate-basket-ci-inputs.py"
      - "tests/fixtures/cortex-a7-core-smoke.elf"
      - "tests/fixtures/kv260-r5-zephyr-*.elf"
      - "crates/firmware-kv260-r5-zephyr/**"
      - "configs/chips/xck26-rpu.yaml"
      - "configs/systems/kv260-r5.yaml"
      - "examples/kv260-r5/**"
      - "tools/cosim/**"
      - "examples/smart-basket-power/**"
      - ".github/workflows/core-qemu-arm.yml"
  workflow_dispatch:
    inputs:
      linux_acceptance:
        description: "Run the bounded real RV1103 zImage/PID1 acceptance gate"
        type: boolean
        required: false
        default: false

      basket_acceptance:
        description: "Run actual joint Linux/I2C/UART/persistent-plant acceptance (private app read secret required)"
        type: boolean
        required: false
        default: false
      basket_app_commit:
        description: "Explicit full 40-hex commit in private w1ne/labwired; required only for basket opt-in"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: qemu-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-qemu-arm
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libngspice0 python3-pytest
      - name: Check CPU, bus, builder and trace contracts
        run: cargo test --locked -p labwired-core --features qemu-arm,event-scheduler --test qemu_arm_core --test cpu_trace_conformance --test luckfox_declaration --test cpu_runtime_snapshot_honesty --test observer_store_visibility
      - name: Check native CLI execution
        run: cargo test --locked -p labwired-cli --features qemu-arm --test cortex_a_cli
      - name: Check behavioral power and real ngspice adapters
        run: |
          cargo build --locked -p labwired-cli --features qemu-arm
          /usr/bin/python3 -m pytest tools/cosim/test_smart_basket_power.py tools/cosim/test_labwired_ngspice.py -q
          /usr/bin/python3 examples/smart-basket-power/run_scenarios.py --output "$RUNNER_TEMP/smart-basket-power"
  default-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: default-cortex-a-refusal
      - name: Check default CLI refuses application cores
        run: cargo test --locked -p labwired-cli --test cortex_a_cli --test rv1103_linux_cli
      - name: Check default and browser dependency independence
        run: |
          cargo tree --locked -p labwired-cli > "$RUNNER_TEMP/default-cli-tree.txt"
          cargo tree --locked -p labwired-wasm --target wasm32-unknown-unknown > "$RUNNER_TEMP/browser-tree.txt"
          if grep -E 'labwired-arm-(core|system)' "$RUNNER_TEMP/default-cli-tree.txt" "$RUNNER_TEMP/browser-tree.txt"; then
            echo 'Optional native ARM backend leaked into default/browser dependencies' >&2
            exit 1
          fi
      - name: Check standalone system backend stays default off
        run: scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-arm-system --lib
      - name: Install compiled-DTB fixture tools
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - name: Check default loader refusal and device contracts
        run: cargo test --locked -p labwired-core --test rv1103_linux_loader --test rv1103_devices --test cpu_runtime_snapshot_honesty --test rv1103_basket_loader --test rv1103_rk3x_i2c --test rv1103_uart4_esp_at

  native-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_PANIC: unwind
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-arm-system
      - name: Install native and compiled-DTB build tools
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y cmake ninja-build clang device-tree-compiler busybox
      - name: Install pinned ARM C compiler
        timeout-minutes: 10
        uses: ./.github/actions/apt-install-cached
        with:
          packages: gcc-arm-none-eabi=15:13.2.rel1-2 libnewlib-arm-none-eabi
      - name: Check strict joint preparation, historical modules and CI input contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p test_prepare_rv1103_basket.py
          python3 -m unittest discover -s scripts/tests -p test_basket_ci.py
      - name: Check native architectural backend and compiled binary identity
        run: scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-arm-system --features native --lib --test architecture
      - name: Check real SystemBus backend, MMU, devices, retirement, snapshot refusal and Cortex-R5F Zephyr
        run: >
          scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-core --features qemu-arm-system,event-scheduler
          --test qemu_arm_system --test rv1103_devices --test rv1103_linux_loader
          --test cpu_runtime_snapshot_honesty --test event_scheduler
          --test rv1103_basket_loader --test rv1103_rk3x_i2c --test dw_uart_timeout --test rv1103_uart4_esp_at --test cosim_canonical_basket --test ordered_debug_metadata --test kv260_r5_zephyr
      - name: Check exact interrupt metadata ordering and duplicate-value goldens
        run: scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-config --test ordered_interrupt_metadata
      - name: Check native basket parser and evidence unit contracts
        run: |
          set -o pipefail
          scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-cli --features qemu-arm-system,event-scheduler --lib basket 2>&1 | tee "$RUNNER_TEMP/native-basket-units.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/native-basket-units.log"
      - name: Check explicit native CLI surface
        run: cargo test --locked -p labwired-cli --features qemu-arm-system,event-scheduler --test rv1103_linux_cli
      # Same commands as examples/kv260-r5/ci/test.sh, written out so the chip
      # coverage ledger (scripts/ci/chip_coverage.py) sees each --script.
      - name: KV260 RPU (Cortex-R5F) stock Zephyr through the native CLI
        timeout-minutes: 30
        run: |
          cargo build --locked --profile native-system -p labwired-cli --features qemu-arm-system,event-scheduler
          target/native-system/labwired test --script examples/kv260-r5/zephyr-hello.yaml --output-dir out/boards/kv260-r5/zephyr-hello --no-uart-stdout
          target/native-system/labwired test --script examples/kv260-r5/zephyr-sync.yaml --output-dir out/boards/kv260-r5/zephyr-sync --no-uart-stdout
          target/native-system/labwired test --script examples/kv260-r5/zephyr-kernel-common.yaml --output-dir out/boards/kv260-r5/zephyr-kernel-common --no-uart-stdout

  linux-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_acceptance }}
    runs-on: ubuntu-latest
    # Build plus the strict 1800-second guest wall limit; no automatic PR boot.
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      LABWIRED_RV1103_CLI: ${{ github.workspace }}/target/native-system/labwired
    steps:
      - uses: actions/checkout@v4
      - name: Initialize fresh Linux artifact and receipt paths
        run: |
          {
            printf 'LABWIRED_RV1103_ARTIFACTS=%s/rv1103-linux\n' "$RUNNER_TEMP"
            printf 'LABWIRED_RV1103_BOOT_RECEIPT=%s/rv1103-linux-boot.json\n' "$RUNNER_TEMP"
            printf 'LABWIRED_RV1103_FAILURE_RECEIPT=%s/rv1103-linux-bounded-failure.json\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-arm-system
      - name: Install native and artifact preparation tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang device-tree-compiler python3
      - name: Check strict preparation (Python standard library only)
        run: python3 -m unittest discover -s scripts/tests -p test_prepare_rv1103_linux.py
      - name: Prepare fresh pinned official artifacts
        run: python3 scripts/prepare-rv1103-linux.py --cache "$RUNNER_TEMP/rv1103-apk-cache" --output "$LABWIRED_RV1103_ARTIFACTS"
      - name: Build the shipped optimized panic-unwind native CLI
        run: cargo build --locked -p labwired-cli --bin labwired --profile native-system --features qemu-arm-system,event-scheduler
      - name: Check optimized architectural backend and native containment
        run: >
          scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-arm-system --profile native-system
          --features native --lib --test architecture
      - name: Check 32 real zImage instructions refuse guest acceptance
        run: >
          scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-cli --profile native-system --features qemu-arm-system,event-scheduler
          --test rv1103_linux_cli -- --ignored --nocapture
      - name: Run production zImage acceptance exactly once (24 MHz functional calibration)
        run: >
          scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-core --profile native-system --features qemu-arm-system,event-scheduler
          --test rv1103_linux_boot -- --ignored --nocapture
      - name: Preserve preparation and complete success/failure boot receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv1103-linux-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/rv1103-linux/artifact-manifest.json
            ${{ runner.temp }}/rv1103-linux-boot.json
            ${{ runner.temp }}/rv1103-linux-boot.gate.json
            ${{ runner.temp }}/rv1103-linux-bounded-failure.json

  basket-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.basket_acceptance }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Initialize evidence before any opt-in failure
        env:
          PINNED_APP_COMMIT: ${{ inputs.basket_app_commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/basket-evidence"
          printf '%s\n' "$PINNED_APP_COMMIT" > "$RUNNER_TEMP/basket-evidence/requested-app-commit.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/basket-evidence/core-head.txt"
      - name: Validate explicit app pin and private checkout authorization
        env:
          LABWIRED_BASKET_APP_COMMIT: ${{ inputs.basket_app_commit }}
          LABWIRED_BASKET_APP_READ_TOKEN: ${{ secrets.LABWIRED_BASKET_APP_READ_TOKEN }}
        run: python3 scripts/ci/validate-basket-ci-inputs.py
      - uses: actions/checkout@v4
        with:
          repository: w1ne/labwired
          ref: ${{ inputs.basket_app_commit }}
          token: ${{ secrets.LABWIRED_BASKET_APP_READ_TOKEN }}
          persist-credentials: false
          path: basket-app
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install exact reviewed helper compiler
        timeout-minutes: 10
        uses: ./.github/actions/apt-install-cached
        with:
          packages: gcc-arm-none-eabi=15:13.2.rel1-2 libnewlib-arm-none-eabi
      - name: Install exact reviewed native tools
        timeout-minutes: 10
        run: >
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y
          device-tree-compiler=1.7.0-2build1
          cmake ninja-build clang busybox python3
      - name: Record pinned inputs and tools
        run: |
          mkdir -p "$RUNNER_TEMP/basket-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/basket-evidence/core-head.txt"
          git -C basket-app rev-parse HEAD > "$RUNNER_TEMP/basket-evidence/app-head.txt"
          test "$(git -C basket-app rev-parse HEAD)" = "${{ inputs.basket_app_commit }}"
          arm-none-eabi-gcc --version > "$RUNNER_TEMP/basket-evidence/compiler.txt"
          dtc --version > "$RUNNER_TEMP/basket-evidence/dtc.txt"
          sha256sum examples/luckfox-pico-mini-a-linux/basket/reviewed-modules/* > "$RUNNER_TEMP/basket-evidence/historical-module-bundle.sha256"
      - name: Export pinned app against this core BEFORE compiling
        run: |
          npm install --prefix "$RUNNER_TEMP/basket-node" --ignore-scripts --no-audit --no-fund tsx@4.19.0 yaml@2.9.0 zod@4.3.6
          ln -s "$RUNNER_TEMP/basket-node/node_modules" basket-app/node_modules
          node "$RUNNER_TEMP/basket-node/node_modules/tsx/dist/cli.mjs" --tsconfig basket-app/examples/smart-basket/tsconfig.json             basket-app/examples/smart-basket/export-native-runtime.ts --core "$GITHUB_WORKSPACE"             --out "$GITHUB_WORKSPACE/examples/luckfox-pico-mini-a-linux/basket-native-runtime"
          cp examples/luckfox-pico-mini-a-linux/basket-native-runtime/*.json "$RUNNER_TEMP/basket-evidence/"
      - name: Check strict preparation and actual BusyBox sysctl regression
        run: |
          python3 -m unittest discover -s scripts/tests -p test_prepare_rv1103_basket.py
          python3 -m unittest discover -s scripts/tests -p test_basket_ci.py
      - name: Fresh base and basket preparation using exact HISTORICAL reviewed modules
        run: |
          python3 scripts/prepare-rv1103-linux.py --cache "$RUNNER_TEMP/basket-apk-cache" --output "$RUNNER_TEMP/basket-base"
          python3 - "$RUNNER_TEMP/basket-apk-cache" <<'PY'
          import importlib.util, pathlib, sys
          spec=importlib.util.spec_from_file_location('modules','scripts/prepare-rv1103-modules.py')
          modules=importlib.util.module_from_spec(spec); spec.loader.exec_module(modules)
          cache=pathlib.Path(sys.argv[1])
          modules.base.cached_apk(cache,modules.DEV['url'],modules.DEV['sha256'],modules.DEV['size'])
          modules.cached_source(cache)
          PY
          python3 scripts/prepare-rv1103-basket.py --cache "$RUNNER_TEMP/basket-apk-cache"             --base-artifacts "$RUNNER_TEMP/basket-base"             --module-artifacts examples/luckfox-pico-mini-a-linux/basket/reviewed-modules             --output "$RUNNER_TEMP/basket-prepared"
      - name: Build unchanged shipped optimized native profile after current export
        run: |
          cargo build --locked -p labwired-cli --bin labwired --profile native-system --features qemu-arm-system,event-scheduler 2>&1 | tee "$RUNNER_TEMP/basket-evidence/build.log"
          sha256sum target/native-system/labwired > "$RUNNER_TEMP/basket-evidence/cli.sha256"
          find target/native-system/build -name libtlib.so -exec sha256sum {} + > "$RUNNER_TEMP/basket-evidence/backend.sha256"
      - name: Check actual persistent plant startup and fresh recovery epoch (opt-in only)
        env:
          LABWIRED_RV1103_BASKET_ARTIFACTS: ${{ runner.temp }}/basket-prepared
        run: |
          set -o pipefail
          scripts/ci/cargo-test-nonvacuous.sh --locked -p labwired-cli --profile native-system --features qemu-arm-system,event-scheduler --lib actual_persistent_plant_startup_hold_release_and_fresh_epoch_keep_one_child_and_time -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/basket-evidence/startup-unit.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$RUNNER_TEMP/basket-evidence/startup-unit.log"
      - name: Run actual joint guest once with explicit positive bounds
        run: |
          target/native-system/labwired rv1103-basket --artifacts "$RUNNER_TEMP/basket-prepared"             --receipt "$RUNNER_TEMP/basket-evidence/actual-basket.json"             --max-cycles 4000000000 --max-fuel 4000000000 --max-retirements 2000000000             --wall-seconds 3600 --console-bytes 65536             > "$RUNNER_TEMP/basket-evidence/guest-stdout.log" 2> "$RUNNER_TEMP/basket-evidence/guest-stderr.log"
      - name: Archive complete success/failure console, receipts, hashes and preparation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv1103-linux-basket-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/basket-evidence/
            ${{ runner.temp }}/basket-prepared/
            ${{ runner.temp }}/basket-base/artifact-manifest.json
            examples/luckfox-pico-mini-a-linux/basket/reviewed-modules/
