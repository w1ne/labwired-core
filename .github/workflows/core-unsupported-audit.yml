name: Core Unsupported Audit

# Scheduled runs are gated to this repository: every job below carries
# `if: github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core'`.
# GitHub attributes a cron run to whoever last edited the schedule, so a fork
# with Actions enabled mails this workflow's failures to a maintainer here,
# about a run they can neither see nor stop. Only the cron is gated: a manual
# dispatch in a fork still runs every job here.
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

jobs:
  unsupported-audit:
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-unsupported-audit
          workspaces: |
            . -> target

      - name: Install ARM target
        run: rustup target add thumbv7m-none-eabi

      - name: Build audit firmware fixture
        run: cargo build -p demo-blinky --release --target thumbv7m-none-eabi

      - name: Run unsupported instruction audit
        run: ./scripts/unsupported_instruction_audit.sh --firmware target/thumbv7m-none-eabi/release/demo-blinky --system configs/systems/ci-fixture-uart1.yaml --max-steps 20000 --out-dir out/unsupported-audit/ci-fixture --fail-on-unsupported

      - name: Upload unsupported audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-unsupported-audit
          path: out/unsupported-audit/
