name: Rust Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Nightly full integrity + feature gates (02:30 UTC).
    - cron: "30 2 * * *"
  workflow_dispatch:

# PR runs still cancel superseded PR heads. push / schedule / workflow_dispatch
# each get their own group so a manual full-CI dispatch (or nightly) cannot
# cancel the push-to-main integrity lane mid-flight (and vice versa).
concurrency:
  group: core-ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: true

jobs:
  # ── Static contract (always on PR; seconds) ────────────────────────────────
  release-runner-contract:
    name: release-runner-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release runner contract
        run: bash scripts/ci/verify-release-runner-contract.sh

  # ── Formatting is APPLIED, not demanded (PR only) ─────────────────────────
  #
  # `cargo fmt --all -- --check` used to sit in `pr-gate`, i.e. a REQUIRED
  # check. It failed three times in one evening on a change whose content was
  # already correct: the machine printed the exact diff it wanted and then
  # refused to apply it. Whitespace is the one class of review comment a
  # machine can settle by itself, so it does. This job runs `cargo fmt --all`
  # and pushes the result back to the PR branch; the blocking `--check` step is
  # gone from `pr-gate`.
  #
  # ─────────────────────────────────────────────────────────────────────────
  # WHY A PAT AND NOT `GITHUB_TOKEN` + `permissions: contents: write`
  # ─────────────────────────────────────────────────────────────────────────
  # `GITHUB_TOKEN` CAN push here — one line of `permissions:` and it works.
  # The problem is what happens next, and it is not "a check re-runs
  # needlessly", it is "the PR can never be merged again":
  #
  #   * `main` requires exactly two contexts (`gh api
  #     repos/w1ne/labwired-core/branches/main/protection`):
  #     **pr-gate** and **release-runner-contract**;
  #   * `enforce_admins` is ON, so nobody — including the repo owner — can
  #     merge past a missing one;
  #   * BOTH of those jobs are `pull_request`-only (`pr-gate` is gated on
  #     `github.event_name == 'pull_request'`; `release-runner-contract` has no
  #     `push`-to-branch trigger either, this workflow's `push` filter is
  #     `branches: [main]`);
  #   * required contexts are evaluated against the PR's **head SHA**;
  #   * a push made with `GITHUB_TOKEN` deliberately triggers NO workflow run.
  #
  # Put together: the fixup commit advances the head SHA, no `pull_request`
  # run fires for it, and the new head therefore carries ZERO of the two
  # required contexts. The PR reads `BLOCKED` / "Expected — waiting for status
  # to be reported" while every check it did run is green, and the only way out
  # is a human pushing another commit. That is a strictly worse developer
  # experience than the red `fmt --check` this job replaces — it is the same
  # failure mode that stranded #1207/#1208/#1195 in the superproject, and it is
  # why `.github/workflows/submodule-bump.yml` in the superproject also refuses
  # to fall back to `GITHUB_TOKEN`.
  #
  # A PAT push is an ordinary user push: it fires `pull_request` → both
  # required contexts are re-reported against the new head, and the PR stays
  # mergeable. `permissions: contents: read` below is deliberate — the write
  # capability comes from the PAT the checkout is given, so nothing here can
  # push with the ambient token by accident.
  #
  # NO `[skip ci]` IN THE FIXUP COMMIT, for the same reason: it would suppress
  # the very run that re-reports the required checks.
  #
  # ⚠️ The PAT needs only `contents: write` on this repo. If it is absent the
  # job GREEN-SKIPS with a message (see below) rather than failing — a
  # formatting job that goes red is exactly what is being removed here.
  #
  # ─────────────────────────────────────────────────────────────────────────
  # WHERE FORMATTING IS STILL ENFORCED
  # ─────────────────────────────────────────────────────────────────────────
  # Dropping `--check` from `pr-gate` does NOT mean unformatted code can reach
  # main unnoticed. `core-integrity` (push to main / nightly / dispatch) keeps
  # its `Check Formatting` step, so main is still asserted formatted on every
  # merge — it just reports there instead of gating the merge. That step is the
  # backstop for the paths this job cannot cover: fork PRs, a missing PAT, and
  # anything pushed to main outside the PR flow.
  fmt-autofix:
    name: fmt-autofix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only on purpose — see the PAT note above.
    permissions:
      contents: read
    steps:
      # Green-skip, never red. Two ways this job legitimately has nothing to
      # do, and neither is an error:
      #
      #   1. FORK PR. `pull_request` from a fork gets a read-only `GITHUB_TOKEN`
      #      and no access to secrets at all, so the push cannot work by
      #      construction. This repo is effectively single-owner so this is a
      #      landmine, not a daily path — but an unhandled landmine is how a
      #      first outside contributor meets a red X they cannot fix.
      #   2. NO PAT CONFIGURED. Same reasoning as submodule-bump.yml: a red
      #      cron/PR job every morning trains people to ignore it.
      - name: Can this run push to the PR branch?
        id: gate
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          PAT: ${{ secrets.CI_FMT_PAT }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::notice title=fmt-autofix skipped::PR head is a fork ($HEAD_REPO). A fork PR's token is read-only and secrets are withheld, so the fixup cannot be pushed. Run 'cargo fmt --all' locally; 'core-integrity' still asserts formatting on main."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${PAT:-}" ]; then
            echo "::notice title=fmt-autofix skipped::Secret CI_FMT_PAT is not set. GITHUB_TOKEN is not a fallback: its pushes fire no workflow run, so the new head SHA would carry neither required context (pr-gate, release-runner-contract) and the PR would be unmergeable. Add a PAT with contents:write to enable auto-formatting."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # The PR BRANCH TIP, not the merge commit `pull_request` checks out by
      # default: the fixup has to land on the branch, and a detached merge
      # commit has nowhere to push to.
      - name: Checkout the PR branch tip
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.CI_FMT_PAT }}
          persist-credentials: true
          # Depth 1 is enough: one new commit whose parent the remote already
          # has pushes fine from a shallow clone, and this job runs no
          # history-dependent gate.
          fetch-depth: 1

      # ⚠️ PINNED, and it must stay pinned to whatever `pr-gate` /
      # `core-integrity` use. rustfmt output is toolchain-dependent — the same
      # drift that made `clippy::redundant_closure` fire only in CI would here
      # mean CI reformats what the developer's local `cargo fmt` just
      # formatted, on every push, forever. No `components: clippy`: this job
      # lints nothing and compiles nothing, so it needs no cache either.
      - name: Install Rust (pinned — must match pr-gate)
        if: steps.gate.outputs.ok == 'true'
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Format, and push the result if anything moved
        if: steps.gate.outputs.ok == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MARKER: "style: cargo fmt --all [ci-autofix]"
        run: |
          set -euo pipefail

          # Evidence in the log that the PINNED formatter ran, not whatever the
          # runner image happened to ship.
          cargo fmt --version
          rustc --version

          # LOOP GUARD. A PAT push fires a fresh `pull_request` run, so this
          # job sees its own commit — that is the point (it is how the required
          # checks get re-reported), but it must terminate. It does, because
          # rustfmt is idempotent: the re-run reformats nothing and pushes
          # nothing, so at most ONE fixup exists per human push.
          #
          # This flag exists for the case where that is NOT true. If the tip is
          # already a fixup and `cargo fmt` STILL wants changes, formatting is
          # not converging (two toolchains fighting, a rustfmt bug, an
          # unparseable file) and the honest answer is to stop and say so
          # rather than push a second time and start a cycle. That is the one
          # condition under which this job goes red, and it should.
          tip_subject=$(git log -1 --format=%s)
          tip_is_fixup=false
          if [ "$tip_subject" = "$MARKER" ]; then
            tip_is_fixup=true
            echo "Tip commit is a previous autofix — this run must not push again."
          fi

          cargo fmt --all

          if git diff --quiet; then
            if [ "$tip_is_fixup" = true ]; then
              echo "Formatting converged: the previous autofix is stable under a re-run."
            else
              echo "Already formatted — nothing to push."
            fi
            echo "### Formatting: clean" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "rustfmt wants these changes:"
          git --no-pager diff --stat

          if [ "$tip_is_fixup" = true ]; then
            echo "::error title=rustfmt is not converging::The tip commit is already a '${MARKER}' fixup and 'cargo fmt --all' still reports a diff. Pushing again would loop, so this run stops. Reproduce with the pinned 1.95.0 toolchain."
            git --no-pager diff
            exit 1
          fi

          git config user.name "Andrii Shylenko"
          git config user.email "14119286+w1ne@users.noreply.github.com"
          git add -A
          # Subject is the loop-guard marker above — keep the two in step.
          # No '[skip ci]': the run this push triggers is what re-reports
          # pr-gate and release-runner-contract on the new head SHA.
          git commit -m "$MARKER" \
            -m "Applied by the fmt-autofix job in .github/workflows/core-ci.yml with the pinned 1.95.0 toolchain. Formatting only — no other step wrote to the tree."

          # Never force. If the branch moved while this ran, the push is
          # rejected and that is FINE: the newer push has its own fmt-autofix
          # run which will do the same work against the current tip. Losing
          # that race must not turn this job red.
          if git push origin "HEAD:refs/heads/${BRANCH}"; then
            echo "Pushed the formatting fixup to ${BRANCH}."
            {
              echo "### Formatting applied"
              echo
              echo 'Pushed `'"$MARKER"'`. A fresh CI run is now in flight against the new head SHA.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=fmt-autofix push skipped::${BRANCH} moved while this job was running, so the fixup was not pushed. The newer commit has its own fmt-autofix run."
          fi

  # ── PR merge gate (REQUIRED) — target wall clock under ~1 minute ───────────
  # focused clippy/tests only. No firmware builds, no feature-variant
  # recompiles, no coverage/onboarding/arduino matrices (those are nightly).
  #
  # NO FORMATTING STEP HERE, ON PURPOSE. `cargo fmt --all -- --check` used to
  # be the first thing that could fail this required check, and it failed on
  # changes that were otherwise correct while printing the exact patch that
  # would fix them. The `fmt-autofix` job above applies that patch instead.
  # `core-integrity` still runs `--check` on push to main, so "formatted" is
  # still asserted — it just is not a merge gate. Do not re-add a `--check`
  # step here.
  pr-gate:
    name: pr-gate
    # `workflow_dispatch` too, and this is not a convenience — it is the only
    # way out of a specific deadlock. `pr-gate` is one of the two REQUIRED
    # contexts on main, and required contexts are reported against the PR's
    # head SHA. GitHub keeps at most ONE pending run per concurrency group, so
    # when a run in `core-ci-<pr>` gets stuck queued (2026-08-06: an Actions
    # outage left runs queued with zero jobs, un-cancellable — force-cancel
    # answers "cannot cancel a workflow re-run that has not yet queued"), every
    # later push to that PR creates NO run at all. The head SHA then carries no
    # `pr-gate` context, `enforce_admins` is on, and the PR is unmergeable with
    # nothing anyone can click.
    #
    # A dispatch escapes it because `github.ref` is `refs/heads/<branch>`, which
    # lands in a DIFFERENT concurrency group than the wedged `core-ci-<pr>` one,
    # and it reports against the branch tip — the same commit as the PR head.
    # The superproject hit the same wall the same night and fixed it the same
    # way (w1ne/labwired#1405).
    #
    # ⚠️ A dispatch checks out the BRANCH TIP, whereas `pull_request` builds the
    # merge commit. That difference is real (see the default-members note below
    # on catching semantic conflicts against the merge result), so a dispatched
    # pr-gate is only equivalent when the branch is already up to date with
    # main — which `strict` branch protection requires before merging anyway.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Was 5. The browser-layer steps below (crates/wasm clippy + lib tests) are
    # a real ~1.5 min of additional compile — crates/wasm is a cdylib outside
    # default-members, so nothing earlier in this job has already built it.
    # Measured runs sat at 3.0-4.6 min before; the first run WITH those steps
    # hit 5m15s and was killed by this timeout mid-`labwired_wasm` test, which
    # reads as a test failure and is not one.
    #
    # 10 buys headroom on a shared runner without hiding a real slowdown: if
    # this job starts approaching 10 it has genuinely grown and the browser
    # steps should move to their own job, the way pr-scheduler-observable did.
    timeout-minutes: 10
    steps:
      # Full history required: generate_validation_status.py uses
      # `git log -1 --format=%cI -- <model>` for drift. Shallow checkout
      # makes every path resolve to HEAD's date → false DRIFT failures.
      # The generator now refuses to run at all on a truncated history rather
      # than emitting wrong dates, so lowering this turns the whole job red with
      # an explanation instead of quietly producing a bad document.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-pr-gate
          workspaces: |
            . -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Generated docs + drift — pure Python, no cargo.
      - name: Validation status — regen check + drift gate
        run: |
          python -m pip install --quiet pyyaml
          python3 scripts/generate_validation_status.py --check --drift
          python3 scripts/generate_firmware_exercise_matrix.py --check

      # The perf gate measures whatever chip descriptors it can link a fixture
      # against. Adding a chip on an unhandled memory map used to drop it out of
      # the gate silently — this asserts, on the PR that adds it, that it is
      # either covered or waived with a reason. Pure Python, seconds.
      #
      # The pytest run alongside it covers the same property from the other
      # side (a stale baseline for a deleted chip, a fixture that shares a
      # memory map it must not). scripts/ has carried unit tests for a while
      # with nothing executing them — scripts/ci/test_board_matrix.py has never
      # been run by any workflow — so this step names the files it runs rather
      # than discovering them, and grows a line when a suite is added.
      #
      # ADDING A TEST FILE UNDER scripts/? Add it to the pytest line below or it
      # will never run. test_generate_validation_status.py covers the
      # incomplete-history guard, which is precisely a "this ran and told you
      # nothing" bug; a test for it that nothing executes would be the same bug
      # one level up. It needs pyyaml, installed by the step above.
      - name: Perf gate — every chip covered or waived
        run: |
          python -m pip install --quiet pytest
          python3 scripts/perf/board_perf.py --check-coverage
          python3 -m pytest -q \
            scripts/perf/test_board_perf.py \
            scripts/ci/test_board_matrix.py \
            scripts/test_generate_validation_status.py

      # Universal staleness gate. Regenerates EVERY committed artifact derived
      # from repo state and asserts the tree is clean. This catches the
      # generators that have no --check flag of their own (7 of 9 at the time
      # this landed, four of which no workflow referenced at all), including
      # generated Rust source, and it automatically covers any generator added
      # to regen-all.sh later.
      - name: Generated artifacts — regenerate and assert no drift
        run: |
          python -m pip install --quiet pyyaml
          ./scripts/regen-all.sh
          if ! git diff --exit-code; then
            echo "::error::A committed generated artifact is stale."
            echo "Run scripts/regen-all.sh locally and commit the result."
            exit 1
          fi

      # Clippy + lib tests over the workspace's default-members — cli, core,
      # dap, loader, labwired-fuzz. Feature lanes and the firmware/matrix
      # crates stay in nightly integrity-full.
      #
      # These two steps used to narrow to `-p labwired-core -p labwired-cli`,
      # which left `dap`, `loader` and `labwired-fuzz` compiled by NO pre-merge
      # gate at all: `core-integrity` lints them (its bare `cargo clippy
      # --all-targets` resolves to default-members) but it runs only on push to
      # main, so the first thing to notice a break was main itself, after the
      # merge. `channel: Option<String>` on `BoardIoBinding` reached main
      # exactly that way — it stranded four `BoardIoBinding` literals in the
      # DAP adapter's tests, and because those literals are `#[cfg(test)]` the
      # break was invisible to anything short of `--all-targets`. pr-gate was
      # green, main went red on the merge.
      #
      # `pull_request` CI builds the merge commit, not the branch tip, so
      # linting the default-members here catches that class of semantic
      # conflict against the tree the merge will actually produce — before it
      # lands rather than after. Keep this scope in step with the `Run Clippy`
      # step in core-integrity; if they drift apart the hole reopens.
      - name: Clippy (default-members)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (default-members lib)
        run: cargo test --lib

      # THE BROWSER LAYER. `crates/wasm` is a cdylib and is NOT a default-member
      # (see `default-members` in the root Cargo.toml), so every step above
      # resolves to a set that excludes it: `cargo clippy --all-targets` does not
      # lint it and `cargo test --lib` does not build it. Before this step, NO
      # pre-merge lane in this repo compiled the code the browser actually runs.
      #
      # That is not a theoretical hole, it is where this class of bug lives. The
      # browser is the only consumer that goes through the wasm bindings, so a
      # fork that exists ONLY there — an inlined device-type alias table, a
      # per-model framebuffer accessor that drifted from the engine's registry —
      # is invisible to every gate that stops at the workspace default set. A
      # `gxepd2_290_c90c` panel attached, was driven, and rendered dark for
      # exactly this reason, behind a fully green board.
      #
      # Host target on purpose: wasm-bindgen compiles for the host, and the
      # failures worth catching pre-merge (type errors, a dropped match arm, a
      # signature that no longer lines up with core) all surface here without
      # needing the wasm32 toolchain on the runner. A wasm32 link is a heavier,
      # separate concern and stays in the deploy path.
      - name: Clippy + build the browser layer (crates/wasm)
        run: cargo clippy -p labwired-wasm --all-targets -- -D warnings

      - name: Unit tests (browser layer)
        run: cargo test -p labwired-wasm --lib

      # Walk-deletion honesty, on EVERY PR. The structural arm of this test
      # needs no firmware, no `event-scheduler` recompile and no fixtures — it
      # only asserts that a chip's `legacy_walk_disabled` is what the
      # conservative derivation proves rather than a hand-written claim, and
      # that check compiles under default features. Under DEFAULT features the
      # file's observable twin is `#[cfg]`-ed out entirely, so this command
      # runs exactly ONE test; its twin needs an `event-scheduler` build and
      # lives in the `pr-scheduler-observable` job below (which runs in
      # PARALLEL with this job, so it costs this lane nothing).
      #
      # It is here because the bug it covers shipped precisely BECAUSE the only
      # lanes that could see it were nightly: a classic-ESP32 lab was 12/12 on
      # the CLI and livelocked in the browser for as long as nobody ran a
      # browser-configuration lane. A gate nobody runs on PRs is a gate this
      # class walks back through.
      - name: Walk-deletion derivation (PR-fast structural arm)
        run: cargo test -p labwired-core --test esp32_classic_walk_differential

  # ── Browser-configuration observable gate (PR; parallel with pr-gate) ──────
  #
  # THE LANE THAT DID NOT EXIST PRE-MERGE.
  #
  # `esp32_classic_walk_differential` has two arms. `pr-gate` carries the
  # STRUCTURAL one, which is cheap because it compiles under default features.
  # The OBSERVABLE one — the arm that boots the committed classic-ESP32 ELF
  # under the browser's own scheduling policy and asserts that serial bytes
  # actually reach the UART sink — is `#[cfg(feature = "event-scheduler")]`,
  # because with the feature off `legacy_walk_disabled` is never read and the
  # defect is unobservable by construction. Until this job existed that arm ran
  # ONLY in `core-integrity` (push to main), i.e. AFTER the merge — which is
  # exactly how the defect it covers shipped: a classic-ESP32 lab was 12/12
  # green on the CLI and livelocked in the browser, and main was the first
  # thing to notice.
  #
  # WHY A SEPARATE JOB RATHER THAN A STEP IN `pr-gate` (measured, not guessed):
  #   * the feature-variant recompile of `labwired-core` costs ~45s on a warm
  #     cache (measured: the `Feature gate — scheduler IRQ delivery` step in
  #     `core-integrity`, run 30838517438, `Finished ... in 44.79s`; this job
  #     builds it COLD in 46.32s, so ~45-50s either way);
  #   * a PASSING observable arm exits on the first 500k-step batch, but a
  #     FAILING one burns the whole 20M-step budget — locally 15s pass vs 129s
  #     fail, ~8x. `pr-gate` has `timeout-minutes: 5` and already runs 3.0-4.5
  #     min, so a failing arm inside it would hit the job timeout and kill the
  #     lane WITHOUT printing the CLKDIV / TXFIFO_CNT / sink_bytes diagnostic
  #     that makes this gate worth having.
  # As its own job it runs concurrently with `pr-gate`, so the PR's critical
  # path is unchanged, and it can afford a timeout sized for the failing case.
  #
  # `--features event-scheduler` WITHOUT `jit`: that is what `crates/wasm/
  # Cargo.toml` pins, so this is the browser's exact feature set.
  # `core-integrity` runs the same test with `jit,event-scheduler`, which the
  # browser never builds — this lane is the faithful one. It does not replace
  # the integrity run; both stay.
  pr-scheduler-observable:
    name: pr-scheduler-observable
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Shallow checkout is fine here: unlike `pr-gate` this job runs no
      # git-history-dependent gate. The fixture it needs
      # (`tests/fixtures/tier1/esp32.elf`) is a plain committed binary, not LFS.
      - uses: actions/checkout@v4

      # No rustfmt/clippy components: this job lints nothing.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      # NO CACHE STEP, ON PURPOSE — measured, not assumed. The first cut of this
      # job used `Swatinem/rust-cache@v2` with `shared-key: core-ci` +
      # `save-if: false`, on the theory that it would restore `core-integrity`'s
      # warm target dir. Run 30842338316 reported `... Restoring cache ... No
      # cache found.`: rust-cache's key folds in the installed toolchain
      # components, and `core-integrity` installs rustfmt + clippy, so the two
      # jobs never share a key. The cold build cost 46.32s and the whole job 71s
      # — while `core-integrity`'s WARM feature-variant compile of the same
      # crate is 44.79s. The cache was buying ~0s and would have cost an ~18s
      # restore plus repo cache storage, so it is gone. Keep it that way unless
      # a measurement says otherwise.

      # `--nocapture` on purpose: on PASS the arm prints
      # `uart0: CLKDIV=... TXFIFO_CNT=... sink_bytes=N`, which is the evidence
      # that the lane actually observed bytes rather than merely existing in
      # the YAML. A gate whose log cannot distinguish "ran and saw bytes" from
      # "was skipped" is the failure mode this job was added to remove.
      - name: Observable arm — classic-ESP32 serial reaches the sink (browser policy)
        run: >
          cargo test -p labwired-core --features event-scheduler
          --test esp32_classic_walk_differential -- --nocapture

  # ── Main-branch integrity (push to main) — fuller than PR, still no matrices ─
  integrity:
    name: core-integrity
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 30, not 20: the release-gated step now boots two ESP32-C3 mask ROMs and
    # plays the BLE Pong election out (~180M cycles, several minutes on a hosted
    # runner). A timeout that cannot fit the work it names is a gate that fails
    # for the wrong reason.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          workspaces: |
            . -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validation status — regen check + drift gate
        run: |
          python -m pip install --quiet pyyaml
          python3 scripts/generate_validation_status.py --check --drift
          python3 scripts/generate_firmware_exercise_matrix.py --check

      # THE FORMATTING BACKSTOP. This is now the ONLY `--check` in the file —
      # `pr-gate` no longer has one, because `fmt-autofix` applies formatting to
      # PR branches instead of demanding it. Keep this step: it is what makes
      # "formatting is no longer enforced anywhere" false. It reports on main
      # rather than gating a merge (this job is not a required context), and it
      # covers exactly the paths `fmt-autofix` cannot: fork PRs, a run with no
      # CI_FMT_PAT configured, and anything that reaches main outside the PR
      # flow. If it ever goes red, run `cargo fmt --all` on 1.95.0.
      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (no fixtures)
        run: cargo test --workspace --lib

      # Fixture-backed firmware regression suites. firmware_survival loads
      # committed ELFs and asserts byte-exact UART traces against real silicon;
      # e2e_stm32f407_i2c cross-builds the AHT20/BMP280 firmware from source and
      # drives it through the I2C state machine. Together they catch model
      # regressions the pure --lib unit run cannot (e.g. the STM32 F4/L4 I2C
      # fidelity break). They used to run only in the nightly-gated `core-full`
      # job, so a shared-model rework could land on main silently — pull them
      # into the required push gate. The e2e firmware targets thumbv7em, so the
      # target must be installed first (as `core-full` does).
      - name: Install ARM target for the F407 e2e firmware build
        run: rustup target add thumbv7em-none-eabi

      - name: Firmware survival + F407 I2C e2e (fixtures)
        run: >
          cargo test -p labwired-core
          --test firmware_survival
          --test e2e_stm32f407_i2c

      - name: Board-coverage ratchet (static naming scan)
        run: cargo test -p labwired-core --test board_coverage_ratchet -- --nocapture

      # Chip configs vs the vendored SVDs — peripheral base addresses and NVIC
      # numbers. Pure data (~20s, no firmware build, no toolchain), and it is
      # the only gate that reads the silicon's own register map: `register_
      # coverage` counts how many SVD registers respond, which a WRONG offset
      # also satisfies. Living only in the nightly `core-full` job is how the
      # WB55 RCC misplacement and the WBA52 LPUART1/SPI1 vector collision both
      # sat on main for months, so it runs on every push.
      - name: SVD conformance (config addresses + IRQs vs silicon)
        run: cargo test -p labwired-core --test svd_conformance -- --nocapture

      # RELEASE-ONLY CODE — the lane that did not exist.
      #
      # Every other cargo step in this file builds DEBUG, so a
      # `#[cfg(not(debug_assertions))]` block is not merely untested: the
      # compiler never sees it. `crates/core/tests/event_scheduler.rs` rotted
      # exactly that way — its release-only block called `drain_due(&[0u32])`
      # against a 0-argument API, so `cargo test --release -p labwired-core`
      # could not COMPILE, while every green lane above silently excluded the
      # block. A gate is worth what it touches; this one touches release.
      #
      # It also RUNS the two release-gated scheduler tests, which have no debug
      # twin by construction: `schedule`'s live-event ceiling panics via
      # `debug_assert!` in debug and increments `live_event_ceiling_trips` in
      # release, so the counter path is observable in this lane and nowhere
      # else. `release_only_cfg_ratchet` (below) keeps the target list honest
      # if a new release-only block is ever added elsewhere.
      # `world_esp32c3_ble_pong` is release-only for cost, not for behaviour:
      # two C3 mask-ROM boots plus the advertising rounds the owner's BLE Pong
      # needs to elect a host is ~180M cycles, seconds in release and tens of
      # minutes in debug. It is the only lane that runs two ESP32-C3 instances
      # against each other over the BLE air, which is where "both nodes have the
      # same address" hid.
      - name: Release-gated tests — cfg(not(debug_assertions))
        run: >
          cargo test --release -p labwired-core --features event-scheduler
          --lib --test event_scheduler --test release_only_cfg_ratchet
          --test world_esp32c3_ble_pong

      # `esp32_classic_walk_differential` is BOTH arms here, and both arms are
      # covered pre-merge as well — do not read this step as their only lane.
      # `pr-gate` runs the structural arm under default features, and
      # `pr-scheduler-observable` runs the observable arm under
      # `event-scheduler` on every PR. This step keeps the push-to-main copy
      # (with `jit` on, which no PR lane exercises).
      #
      # The original note here said the test was "NOT in pr-gate" because the
      # defect is only reachable in an `event-scheduler` build and the CLI
      # deliberately compiles that feature OFF. The premise is still true; the
      # conclusion no longer is. A classic-ESP32 lab was 12/12 green on the CLI
      # while livelocked in the browser because no lane ran classic ESP32 under
      # the browser's own feature set BEFORE THE MERGE — a push-to-main lane
      # reports that after the fact. See the comment on
      # `pr-scheduler-observable`.
      - name: Feature gate — scheduler IRQ delivery (jit + event-scheduler)
        run: >
          cargo test -p labwired-core --features jit,event-scheduler
          --test intmatrix_alarm
          --test esp32_classic_walk_differential
          --test esp32s3_walk_differential
          --test esp32c3_walk_differential
          --test stm32_timer_walk_differential
          --test stm32_dma_walk_differential
          --test kw41z_walk_free_differential
          --lib

      # HARDWARE ORACLE UNDER THE SCHEDULER FEATURE — the configuration that
      # single-crate commands cannot reproduce.
      #
      # `labwired-hw-oracle` does not request `event-scheduler` itself, so
      # `cargo test -p labwired-hw-oracle` builds it OFF. Cargo's feature
      # unification switches it ON only under `cargo test --workspace`, which
      # runs solely in the dispatch-gated `core-full` job. `exti0_interrupt_
      # delivery_sim` failed in exactly that gap for as long as EXTI had a
      # scheduler mode: `Exti::tick()` no-ops under the scheduler (correct —
      # the event chain owns delivery), but the oracle forces the compatibility
      # walk through `tick_elapsed_forced`, which EXTI did not override, so the
      # guard swallowed the forced call and NO interrupt was delivered.
      #
      # The hole is structural, not EXTI-specific: any peripheral whose `tick`
      # self-guards on `scheduler_mode()` without overriding
      # `tick_elapsed_forced` has it. This step runs the oracle in the
      # configuration that exposes it, on every push to main.
      - name: Feature gate — hardware oracle under event-scheduler
        run: >
          cargo test -p labwired-hw-oracle
          --features labwired-core/event-scheduler

  # ── CI runner OCI smoke (NOT a PR required check) ──────────────────────────
  ci-runner-image:
    name: ci-runner-image
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke CI runner image
        run: |
          set -euo pipefail
          docker build --pull \
            --file Dockerfile.ci \
            --tag labwired-ci-smoke:local \
            --build-arg VERSION=ci-smoke \
            --build-arg REVISION="$GITHUB_SHA" \
            .
          docker run --rm labwired-ci-smoke:local --version

  # ── Full suite (nightly schedule + manual + [full-ci] on main) ─────────────
  full:
    name: core-full
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 — the Tier-1 baseline ratchet resolves its baseline from
      # `git merge-base HEAD origin/main`. On a shallow checkout that cannot be
      # computed, and the gate FAILS rather than guessing (see
      # tier1::resolve_baseline_matrix). Do not lower this.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout fetches the checked-out ref only, so the
      # origin/main remote-tracking ref the ratchet needs may not exist yet.
      - name: Fetch Tier-1 ratchet baseline ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          workspaces: |
            . -> target

      - name: Install ARM targets
        # thumbv7em-none-eabihf is required by nucleo_l476rg BLDC tests
        # (firmware-l476-demo / six-step). Soft-float eabi alone is not enough;
        # without the hard-float target, cargo test --workspace fails mid-suite
        # with E0463 can't find crate for `core`. Nightly already installs it.
        # thumbv8m.main-none-eabi is required by firmware-rp2350-demo for the
        # pico2 strict-onboarding io-smoke (RP2350 / Cortex-M33).
        run: |
          rustup target add thumbv6m-none-eabi
          rustup target add thumbv7m-none-eabi
          rustup target add thumbv7em-none-eabi
          rustup target add thumbv7em-none-eabihf
          rustup target add thumbv8m.main-none-eabi

      - name: Build test firmware fixture
        run: |
          cargo build -p demo-blinky --release --target thumbv7m-none-eabi
          cargo build -p firmware-h563-io-demo --release --target thumbv7m-none-eabi
          cargo build -p firmware-f401-demo --release --target thumbv7em-none-eabi
          RUSTFLAGS="-C link-arg=-Tlink.x" cargo build -p firmware-rp2040-pio-onboarding --release --target thumbv6m-none-eabi
          cargo build -p firmware-ci-fixture --target thumbv7m-none-eabi

      - name: Run Workspace Tests
        # This job builds the firmware above, so for those artifacts a missing
        # ELF is a failure, not a skip. Tests that can't find their firmware
        # otherwise `return` early and report `ok` — passing without testing
        # anything, which is how a broken cross-build sails through a green
        # gate. Only the keys built in the step above are listed: requiring an
        # artifact this job never produces would fail it for the wrong reason.
        env:
          LABWIRED_REQUIRE_FIRMWARE: firmware-ci-fixture,firmware-rp2040-pio-onboarding
        run: cargo test --workspace

      - name: Feature tests — jit + event-scheduler
        run: cargo test -p labwired-core --features jit,event-scheduler

      - name: Tier-1 matrix + ratchet (release)
        run: cargo test --release -p labwired-cli --test tier1_matrix --test tier1_matrix_ratchet -- --nocapture
