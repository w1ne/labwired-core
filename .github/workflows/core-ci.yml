name: Rust Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Nightly full integrity + feature gates (02:30 UTC).
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static contract (always on PR; seconds) ────────────────────────────────
  release-runner-contract:
    name: release-runner-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release runner contract
        run: bash scripts/ci/verify-release-runner-contract.sh

  # ── PR merge gate (REQUIRED) — target wall clock under ~1 minute ───────────
  # fmt + focused clippy/tests only. No firmware builds, no feature-variant
  # recompiles, no coverage/onboarding/arduino matrices (those are nightly).
  pr-gate:
    name: pr-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history required: generate_validation_status.py uses
      # `git log -1 --format=%cI -- <model>` for drift. Shallow checkout
      # makes every path resolve to HEAD's date → false DRIFT failures.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-pr-gate
          workspaces: |
            . -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Generated docs + drift — pure Python, no cargo.
      - name: Validation status — regen check + drift gate
        run: |
          python -m pip install --quiet pyyaml
          python3 scripts/generate_validation_status.py --check --drift
          python3 scripts/generate_firmware_exercise_matrix.py --check

      # Universal staleness gate. Regenerates EVERY committed artifact derived
      # from repo state and asserts the tree is clean. This catches the
      # generators that have no --check flag of their own (7 of 9 at the time
      # this landed, four of which no workflow referenced at all), including
      # generated Rust source, and it automatically covers any generator added
      # to regen-all.sh later.
      - name: Generated artifacts — regenerate and assert no drift
        run: |
          python -m pip install --quiet pyyaml
          ./scripts/regen-all.sh
          if ! git diff --exit-code; then
            echo "::error::A committed generated artifact is stale."
            echo "Run scripts/regen-all.sh locally and commit the result."
            exit 1
          fi

      - name: Check Formatting
        run: cargo fmt --all -- --check

      # Clippy + lib tests over the workspace's default-members — cli, core,
      # dap, loader, labwired-fuzz. Feature lanes and the firmware/matrix
      # crates stay in nightly integrity-full.
      #
      # These two steps used to narrow to `-p labwired-core -p labwired-cli`,
      # which left `dap`, `loader` and `labwired-fuzz` compiled by NO pre-merge
      # gate at all: `core-integrity` lints them (its bare `cargo clippy
      # --all-targets` resolves to default-members) but it runs only on push to
      # main, so the first thing to notice a break was main itself, after the
      # merge. `channel: Option<String>` on `BoardIoBinding` reached main
      # exactly that way — it stranded four `BoardIoBinding` literals in the
      # DAP adapter's tests, and because those literals are `#[cfg(test)]` the
      # break was invisible to anything short of `--all-targets`. pr-gate was
      # green, main went red on the merge.
      #
      # `pull_request` CI builds the merge commit, not the branch tip, so
      # linting the default-members here catches that class of semantic
      # conflict against the tree the merge will actually produce — before it
      # lands rather than after. Keep this scope in step with the `Run Clippy`
      # step in core-integrity; if they drift apart the hole reopens.
      - name: Clippy (default-members)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (default-members lib)
        run: cargo test --lib

      # THE BROWSER LAYER. `crates/wasm` is a cdylib and is NOT a default-member
      # (see `default-members` in the root Cargo.toml), so every step above
      # resolves to a set that excludes it: `cargo clippy --all-targets` does not
      # lint it and `cargo test --lib` does not build it. Before this step, NO
      # pre-merge lane in this repo compiled the code the browser actually runs.
      #
      # That is not a theoretical hole, it is where this class of bug lives. The
      # browser is the only consumer that goes through the wasm bindings, so a
      # fork that exists ONLY there — an inlined device-type alias table, a
      # per-model framebuffer accessor that drifted from the engine's registry —
      # is invisible to every gate that stops at the workspace default set. A
      # `gxepd2_290_c90c` panel attached, was driven, and rendered dark for
      # exactly this reason, behind a fully green board.
      #
      # Host target on purpose: wasm-bindgen compiles for the host, and the
      # failures worth catching pre-merge (type errors, a dropped match arm, a
      # signature that no longer lines up with core) all surface here without
      # needing the wasm32 toolchain on the runner. A wasm32 link is a heavier,
      # separate concern and stays in the deploy path.
      - name: Clippy + build the browser layer (crates/wasm)
        run: cargo clippy -p labwired-wasm --all-targets -- -D warnings

      - name: Unit tests (browser layer)
        run: cargo test -p labwired-wasm --lib

      # Walk-deletion honesty, on EVERY PR. The structural arm of this test
      # needs no firmware, no `event-scheduler` recompile and no fixtures — it
      # only asserts that a chip's `legacy_walk_disabled` is what the
      # conservative derivation proves rather than a hand-written claim, and
      # that check compiles under default features. Its observable twin (which
      # does need `event-scheduler`) stays in `core-integrity`.
      #
      # It is here because the bug it covers shipped precisely BECAUSE the only
      # lanes that could see it were nightly: a classic-ESP32 lab was 12/12 on
      # the CLI and livelocked in the browser for as long as nobody ran a
      # browser-configuration lane. A gate nobody runs on PRs is a gate this
      # class walks back through.
      - name: Walk-deletion derivation (PR-fast structural arm)
        run: cargo test -p labwired-core --test esp32_classic_walk_differential

  # ── Main-branch integrity (push to main) — fuller than PR, still no matrices ─
  integrity:
    name: core-integrity
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          workspaces: |
            . -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validation status — regen check + drift gate
        run: |
          python -m pip install --quiet pyyaml
          python3 scripts/generate_validation_status.py --check --drift
          python3 scripts/generate_firmware_exercise_matrix.py --check

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (no fixtures)
        run: cargo test --workspace --lib

      # Fixture-backed firmware regression suites. firmware_survival loads
      # committed ELFs and asserts byte-exact UART traces against real silicon;
      # e2e_stm32f407_i2c cross-builds the AHT20/BMP280 firmware from source and
      # drives it through the I2C state machine. Together they catch model
      # regressions the pure --lib unit run cannot (e.g. the STM32 F4/L4 I2C
      # fidelity break). They used to run only in the nightly-gated `core-full`
      # job, so a shared-model rework could land on main silently — pull them
      # into the required push gate. The e2e firmware targets thumbv7em, so the
      # target must be installed first (as `core-full` does).
      - name: Install ARM target for the F407 e2e firmware build
        run: rustup target add thumbv7em-none-eabi

      - name: Firmware survival + F407 I2C e2e (fixtures)
        run: >
          cargo test -p labwired-core
          --test firmware_survival
          --test e2e_stm32f407_i2c

      - name: Board-coverage ratchet (static naming scan)
        run: cargo test -p labwired-core --test board_coverage_ratchet -- --nocapture

      # Chip configs vs the vendored SVDs — peripheral base addresses and NVIC
      # numbers. Pure data (~20s, no firmware build, no toolchain), and it is
      # the only gate that reads the silicon's own register map: `register_
      # coverage` counts how many SVD registers respond, which a WRONG offset
      # also satisfies. Living only in the nightly `core-full` job is how the
      # WB55 RCC misplacement and the WBA52 LPUART1/SPI1 vector collision both
      # sat on main for months, so it runs on every push.
      - name: SVD conformance (config addresses + IRQs vs silicon)
        run: cargo test -p labwired-core --test svd_conformance -- --nocapture

      # RELEASE-ONLY CODE — the lane that did not exist.
      #
      # Every other cargo step in this file builds DEBUG, so a
      # `#[cfg(not(debug_assertions))]` block is not merely untested: the
      # compiler never sees it. `crates/core/tests/event_scheduler.rs` rotted
      # exactly that way — its release-only block called `drain_due(&[0u32])`
      # against a 0-argument API, so `cargo test --release -p labwired-core`
      # could not COMPILE, while every green lane above silently excluded the
      # block. A gate is worth what it touches; this one touches release.
      #
      # It also RUNS the two release-gated scheduler tests, which have no debug
      # twin by construction: `schedule`'s live-event ceiling panics via
      # `debug_assert!` in debug and increments `live_event_ceiling_trips` in
      # release, so the counter path is observable in this lane and nowhere
      # else. `release_only_cfg_ratchet` (below) keeps the target list honest
      # if a new release-only block is ever added elsewhere.
      - name: Release-gated tests — cfg(not(debug_assertions))
        run: >
          cargo test --release -p labwired-core --features event-scheduler
          --lib --test event_scheduler --test release_only_cfg_ratchet

      # `esp32_classic_walk_differential` is here and NOT in `pr-gate` for the
      # same structural reason the rest of this step is: the defect it covers is
      # only reachable in an `event-scheduler` build, and the CLI (which every
      # PR-fast lane exercises) deliberately compiles that feature OFF. A
      # classic-ESP32 lab was 12/12 green on the CLI while livelocked in the
      # browser because NO lane ran classic ESP32 under the browser's own
      # feature set. This step is that lane.
      - name: Feature gate — scheduler IRQ delivery (jit + event-scheduler)
        run: >
          cargo test -p labwired-core --features jit,event-scheduler
          --test intmatrix_alarm
          --test esp32_classic_walk_differential
          --test esp32s3_walk_differential
          --test esp32c3_walk_differential
          --test stm32_timer_walk_differential
          --test stm32_dma_walk_differential
          --test kw41z_walk_free_differential
          --lib

      # HARDWARE ORACLE UNDER THE SCHEDULER FEATURE — the configuration that
      # single-crate commands cannot reproduce.
      #
      # `labwired-hw-oracle` does not request `event-scheduler` itself, so
      # `cargo test -p labwired-hw-oracle` builds it OFF. Cargo's feature
      # unification switches it ON only under `cargo test --workspace`, which
      # runs solely in the dispatch-gated `core-full` job. `exti0_interrupt_
      # delivery_sim` failed in exactly that gap for as long as EXTI had a
      # scheduler mode: `Exti::tick()` no-ops under the scheduler (correct —
      # the event chain owns delivery), but the oracle forces the compatibility
      # walk through `tick_elapsed_forced`, which EXTI did not override, so the
      # guard swallowed the forced call and NO interrupt was delivered.
      #
      # The hole is structural, not EXTI-specific: any peripheral whose `tick`
      # self-guards on `scheduler_mode()` without overriding
      # `tick_elapsed_forced` has it. This step runs the oracle in the
      # configuration that exposes it, on every push to main.
      - name: Feature gate — hardware oracle under event-scheduler
        run: >
          cargo test -p labwired-hw-oracle
          --features labwired-core/event-scheduler

  # ── CI runner OCI smoke (NOT a PR required check) ──────────────────────────
  ci-runner-image:
    name: ci-runner-image
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Smoke CI runner image
        run: |
          set -euo pipefail
          docker build --pull \
            --file Dockerfile.ci \
            --tag labwired-ci-smoke:local \
            --build-arg VERSION=ci-smoke \
            --build-arg REVISION="$GITHUB_SHA" \
            .
          docker run --rm labwired-ci-smoke:local --version

  # ── Full suite (nightly schedule + manual + [full-ci] on main) ─────────────
  full:
    name: core-full
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 — the Tier-1 baseline ratchet resolves its baseline from
      # `git merge-base HEAD origin/main`. On a shallow checkout that cannot be
      # computed, and the gate FAILS rather than guessing (see
      # tier1::resolve_baseline_matrix). Do not lower this.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout fetches the checked-out ref only, so the
      # origin/main remote-tracking ref the ratchet needs may not exist yet.
      - name: Fetch Tier-1 ratchet baseline ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-ci
          workspaces: |
            . -> target

      - name: Install ARM targets
        run: |
          rustup target add thumbv6m-none-eabi
          rustup target add thumbv7m-none-eabi
          rustup target add thumbv7em-none-eabi

      - name: Build test firmware fixture
        run: |
          cargo build -p demo-blinky --release --target thumbv7m-none-eabi
          cargo build -p firmware-h563-io-demo --release --target thumbv7m-none-eabi
          cargo build -p firmware-f401-demo --release --target thumbv7em-none-eabi
          RUSTFLAGS="-C link-arg=-Tlink.x" cargo build -p firmware-rp2040-pio-onboarding --release --target thumbv6m-none-eabi
          cargo build -p firmware-ci-fixture --target thumbv7m-none-eabi

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Feature tests — jit + event-scheduler
        run: cargo test -p labwired-core --features jit,event-scheduler

      - name: Tier-1 matrix + ratchet (release)
        run: cargo test --release -p labwired-cli --test tier1_matrix --test tier1_matrix_ratchet -- --nocapture
