name: PyBadge exact packaging notice evidence

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/pybadge-toolchain-notice-evidence/**
      - .github/workflows/pybadge-toolchain-notice-evidence.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pybadge-toolchain-notices-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaging-notice-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pure archive admission controls (no compiler or guest)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/pybadge-toolchain-notice-evidence -p 'test_*.py' -v
      - name: Acquire exact qualified metadata and official context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/CrispStrobe/labwired-core/actions/runs/37821668715 > "$RUNNER_TEMP/source-run.json"
          gh api repos/CrispStrobe/labwired-core/actions/runs/37821668715/artifacts > "$RUNNER_TEMP/source-artifacts.json"
          gh api repos/CrispStrobe/labwired-core/actions/artifacts/11569199112/zip > "$RUNNER_TEMP/source-metadata.zip"
      - name: Capture bounded notice members from exact small packaging archives
        run: |
          python3 scripts/pybadge-toolchain-notice-evidence/collect.py \
            --prior "$RUNNER_TEMP/source-metadata.zip" \
            --run-record "$RUNNER_TEMP/source-run.json" \
            --artifact-record "$RUNNER_TEMP/source-artifacts.json" \
            --out "$RUNNER_TEMP/packaging-notice-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: pybadge-exact-packaging-notices
          path: ${{ runner.temp }}/packaging-notice-evidence/
          if-no-files-found: error
