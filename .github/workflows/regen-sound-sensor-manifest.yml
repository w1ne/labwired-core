name: Regenerate sound-sensor artifacts

on:
  push:
    branches:
      - fix/sound-sensor-siminput
    paths:
      - .github/workflows/regen-sound-sensor-manifest.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sound-sensor-siminput
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Exercise the new device model
        run: cargo test -p labwired-core --test sound_sensor

      - name: Regenerate committed catalog artifacts
        run: |
          cargo run -q -p labwired-cli --bin gen-peripherals-manifest -- \
            --out crates/core/tests/fixtures/peripherals/manifest.json
          python3 scripts/ci/device_catalog_doc.py --write

      - name: Commit generated output and remove this one-shot workflow
        run: |
          rm .github/workflows/regen-sound-sensor-manifest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && {
            echo "The generator produced no changes." >&2
            exit 1
          } || true
          git commit -m "chore: regenerate sound sensor catalog artifacts"
          git push origin HEAD:fix/sound-sensor-siminput
