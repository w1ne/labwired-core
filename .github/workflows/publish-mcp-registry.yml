name: Publish LabWired to MCP Registry

on:
  pull_request:
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate MCP Registry metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official MCP publisher
        run: |
          curl -fsSL --retry 3 -o /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          echo '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  /tmp/mcp-publisher.tar.gz' | sha256sum -c
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate official server.json
        run: ./mcp-publisher validate server.json

  publish:
    name: Publish through GitHub OIDC
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official MCP publisher
        run: |
          curl -fsSL --retry 3 -o /tmp/mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          echo '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  /tmp/mcp-publisher.tar.gz' | sha256sum -c
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Authenticate and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
