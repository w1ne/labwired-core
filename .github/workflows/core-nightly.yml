name: Rust Core Nightly

on:
  schedule:
    # Nightly 02:00 UTC (was Sunday-only). Slow coverage / validation lives here.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      pong_soak_cycles:
        description: >-
          Cycles per node for the BLE Pong cadence soak. The default covers
          ~30 advertising republish periods; raise it to characterise a
          slower cadence, lower it to get a quick answer.
        required: false
        default: "480000000"

permissions:
  contents: write

concurrency:
  group: core-nightly
  cancel-in-progress: true

jobs:
  validation:
    name: Advanced Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-nightly
          workspaces: |
            . -> target

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Install ARM and RISC-V targets
        run: |
          rustup target add thumbv7m-none-eabi
          rustup target add thumbv7em-none-eabihf
          rustup target add thumbv6m-none-eabi
          rustup target add riscv32i-unknown-none-elf

      - name: Build Firmware Fixtures
        run: |
          cargo build -p demo-blinky --release --target thumbv7m-none-eabi
          cargo build -p firmware-h563-demo --release --target thumbv7em-none-eabihf
          cargo build -p firmware-ci-fixture --release --target thumbv6m-none-eabi
          cargo build -p riscv-ci-fixture --release --target riscv32i-unknown-none-elf

      - name: Run ignored H563 CLI integration test
        run: cargo test -p labwired-cli --test h5_demo -- --ignored

      - name: Unsupported Instruction Audit
        run: ./scripts/unsupported_instruction_audit.sh --firmware target/thumbv7m-none-eabi/release/demo-blinky --system configs/systems/ci-fixture-uart1.yaml --max-steps 20000 --out-dir out/unsupported-audit/ci-fixture --fail-on-unsupported

      - name: Digital Twin Verification
        run: ./scripts/digital_twin_verification.sh out/digital-twin-verification

      - name: Trace Drift Assertions
        run: ./scripts/trace_drift_assert.sh --out-dir out/trace-drift-assert

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-validation-artifacts
          path: |
            out/unsupported-audit/
            out/digital-twin-verification/
            out/trace-drift-assert/

  example-smokes:
    name: Example Smokes (real-output autochecks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-nightly
          workspaces: |
            . -> target

      # clang + rust-lld build the bare-metal C examples (e.g. the H563 UDS
      # responder); arm-none-eabi-objcopy strips them for the sim.
      - name: Install C cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-arm-none-eabi

      # Rebuild the H563 UDS responder from source against the pinned UDSLib so a
      # firmware/library regression is caught here, not on the live blog demo.
      - name: Rebuild H563 UDS responder firmware from source
        run: |
          RUST_LLD="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/rust-lld"
          make -C examples/h563-uds-ecu/firmware fetch-udslib
          make -C examples/h563-uds-ecu/firmware RUST_LLD="$RUST_LLD"
          arm-none-eabi-objcopy --strip-debug \
            examples/h563-uds-ecu/firmware/build/h563_uds_ecu.elf \
            examples/h563-uds-ecu/firmware/h563_uds_ecu.elf

      # Run every example whose firmware ELF is available; report uncovered ones.
      - name: Run example smokes
        run: ./scripts/example_smokes.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # The decoded-output e2e checks: assert the FDCAN UDS trace (what the web
      # logic analyzer shows) and the Leo air-quality verdicts are real.
      - name: Run example e2e assertions
        run: cargo test --release -p labwired-cli --test e2e_h563_uds --test e2e_leo_airquality

  esp32s3-fixtures-e2e:
    name: ESP32-S3 Fixtures E2E (espup)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-nightly-esp32s3-e2e
          workspaces: |
            . -> target

      - name: Install espup
        run: cargo install espup --locked

      - name: Install Xtensa toolchain via espup
        run: espup install

      # espup emits ~/export-esp.sh; source it so the +esp toolchain and
      # xtensa-esp32s3-none-elf target are available for cargo build.
      - name: Build ESP32-S3 example fixtures
        # Build from INSIDE each example dir so its .cargo/config.toml and
        # rust-toolchain.toml apply (--manifest-path from the repo root skips
        # them — that's what broke the first run with E0463).
        run: |
          # shellcheck disable=SC1090  # export-esp.sh is generated at runtime
          # by `espup install`; there is no file to follow at lint time.
          source ~/export-esp.sh
          (cd examples/esp32s3-blinky && cargo build --release)
          (cd examples/esp32s3-hello-world && cargo build --release)
          (cd examples/esp32s3-i2c-tmp102 && cargo build --release)

      # FAITHFUL path (default, no FASTBOOT): esp-hal apps now boot on the REAL
      # vendored boot ROM with ZERO thunks. The historical blocker
      # ("rom_config_instruction_cache_mode jumps to 0") is fixed — fast-boot
      # skipped the ROM reset's `.data` copy, leaving rom_cache_internal_table_ptr
      # @0x3FCEFFC4 null; we now replicate that copy (see esp32s3_rom.rs) and use
      # identity XIP for fast-boot (see Esp32s3Opts.real_reset_boot). The boot
      # guard asserts no near-null jump through init; hello-world then prints real
      # serial output through the real ROM.
      #
      # Only hello-world runs on the faithful lane: blinky (GPIO) and i2c_tmp102
      # pace their work with delays, and on the faithful path the real ROM's
      # ets_delay_us BUSY-WAITS for real (the harness thunk returns instantly),
      # so those delay loops elapse genuine simulated time and overrun the
      # harness-tuned step budgets — a fidelity property, not a boot failure.
      # They stay on the harness lane below (instant delays fit the budget).
      - name: Run ESP32-S3 faithful (real-ROM, zero-thunk) e2e
        run: cargo test --release -p labwired-core --features esp32s3-fixtures --test e2e_esp32s3_faithful_boot --test e2e_hello_world

      # The tests are gated on --features esp32s3-fixtures and call
      # ensure_firmware_built() which skips the cargo +esp build if the ELF
      # already exists (we built it above). The tests themselves run on the
      # standard host toolchain; only the ELF needs the Xtensa cross-compiler.
      # LABWIRED_ESP32S3_FASTBOOT=1 forces the thunk harness path (real ROM
      # opted out) — kept as a lane so the harness stays exercised for the
      # toolchain-less / stripped-firmware case and for the delay-heavy
      # blinky/i2c timing.
      - name: Run ESP32-S3 fixtures e2e tests (harness)
        env:
          LABWIRED_ESP32S3_FASTBOOT: "1"
        # Only the three gated e2e binaries — the FASTBOOT opt-out must not
        # leak into lib unit tests (it makes provision_rom_images() return
        # None by design, breaking the ROM-provisioning tests).
        run: cargo test --release -p labwired-core --features esp32s3-fixtures --test e2e_blinky --test e2e_hello_world --test e2e_i2c_tmp102

  # ── ESP32-C3 BLE baseband: the only gate that runs a real BLE stack ────────
  #
  # `crates/core/src/peripherals/esp32c3/bt.rs` models the BLE baseband window
  # at 0x6003_1000. Its unit tests assert what the model does with a write;
  # NOTHING asserted that the compiled Arduino/Bluedroid stack gets through it.
  # Both real failures of that model were invisible to every unit test in the
  # tree — an unmapped register (memory violation at 0x6003_1204) and a command
  # bit that did not self-clear (controller spins on its own kick forever) —
  # and both only surface a few hundred million steps into a genuine ROM boot.
  # This job is what notices.
  #
  # Heavy by nature (~360M steps, release-only), so it lives in nightly rather
  # than the PR gate, in line with the rest of the heavy-gate layering. Run it
  # on demand with `workflow_dispatch` when touching the BT model.
  esp32c3-ble-e2e:
    name: ESP32-C3 BLE Baseband E2E
    runs-on: ubuntu-latest
    # 45 covered the first two gates. The re-publication gate below adds ~500 M
    # steps for each of two twins — the sketch's own 700 ms `delay()` is 112 M
    # simulated steps per iteration and five iterations is the acceptance — so
    # the job needs room for a slow runner to finish rather than to be measured
    # by its own timeout.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-nightly-esp32c3-ble
          workspaces: |
            . -> target

      # The composed image is 4 MiB and deliberately NOT committed: it would be
      # a stale-able binary in git. The four content-addressed flash parts are
      # fetched and recomposed here, with every digest pinned in
      # scripts/ci/c3-ble-flash.sha256 — a mismatch fails loudly rather than
      # letting the gate measure a binary nobody reviewed.
      - name: Fetch + compose the pinned BLE probe flash image
        run: scripts/ci/fetch-c3-ble-flash.sh

      # LABWIRED_REQUIRE_C3_BLE=1 turns a missing image into a HARD failure.
      # Without it the test skips itself, and a gate that can silently skip in
      # CI is exactly the hole this job was added to close.
      - name: ESP32-C3 BLE e2e (real Arduino BLE firmware through the mask ROM)
        env:
          LABWIRED_REQUIRE_C3_BLE: "1"
        run: >
          cargo test --release -p labwired-cli
          --test e2e_esp32c3_ble_arduino -- --ignored --nocapture

      # The RECEIVE path needs its own image (advertise AND scan, one binary
      # booted as both nodes), so it gets its own pinned manifest. Same fetch
      # script — the manifest is an argument precisely so there is one
      # fetch/compose/verify mechanism rather than a copy per image.
      - name: Fetch + compose the pinned BLE two-node flash image
        run: >
          scripts/ci/fetch-c3-ble-flash.sh fixtures/esp32c3-ble
          scripts/ci/c3-ble-node-flash.sha256

      # `--features event-scheduler` is LOAD-BEARING, not belt-and-braces: the
      # test file is `#![cfg(feature = "event-scheduler")]`, because the radio
      # engine that carries a frame between the two twins lives in `on_event`.
      # Drop the flag and this compiles to an empty test binary that reports
      # "ok. 0 passed" — green while proving nothing. See the gate-vacuity note
      # in the test's own module docs.
      - name: ESP32-C3 BLE two-node e2e (app-level data exchange, both ways)
        env:
          LABWIRED_REQUIRE_C3_BLE: "1"
        run: >
          cargo test --release -p labwired-cli --features event-scheduler
          --test e2e_esp32c3_ble_two_node -- --ignored --nocapture

      # CONTINUOUS re-publication, which is a different property from the one
      # above and the one an application actually needs. The two-node gate
      # proves the bytes change ONCE (setup's `val=0`, the first loop()'s
      # `val=1`); this one requires five successive values to cross the air and
      # be read by the peer, i.e. `stop()/setAdvertisementData()/start()`
      # surviving repetition. It is also the only gate that fails on the
      # firmware's own `assert` line, which is how the RX-descriptor staleness
      # it was written against announced itself ~198 M steps in — long after
      # every marker a laxer gate stops on.
      #
      # Same image, same manifest, same `--features event-scheduler` contract
      # (the file is `#![cfg(feature = "event-scheduler")]`; without the flag it
      # is an EMPTY binary reporting "ok. 0 passed"). Slow by construction: the
      # sketch's own `delay(700)` is 112 M simulated steps per iteration, so
      # five iterations is ~500 M steps for each of two twins.
      - name: ESP32-C3 BLE advertising re-publication e2e (five values, both ways)
        env:
          LABWIRED_REQUIRE_C3_BLE: "1"
        run: >
          cargo test --release -p labwired-cli --features event-scheduler
          --test e2e_esp32c3_ble_adv_republish -- --ignored --nocapture

  # ── BLE Pong advertising-cadence soak ─────────────────────────────────────
  #
  # `crates/core/tests/world_esp32c3_ble_pong.rs` is release-gated and runs on
  # push-to-main at `PONG_CYCLES` = 90M cycles per node. Roughly 45M of that is
  # the C3 mask-ROM boot, so the sketch's `loop()` gets ~140 ms — about ONE
  # advertising republish period at `PUBLISH_MS` 100. That window is why the
  # 700 ms cadence regression was reported as "no host frame ever arrived"
  # instead of being named: it did not fit in the window at all. A cadence that
  # merely doubled or quadrupled would have fitted, and would have passed.
  #
  # This lane is the same test at `PONG_SOAK_CYCLES` = 480M, ~30 republish
  # periods, which is the length the twin's RW-BLE controller has to survive
  # for `stop() / setAdvertisementData() / start()` repetition to be under
  # test at all. ~366 s of run on top of a release build, so it belongs here
  # and NOT in the merge gate — the constant in the test file stays at 90M on
  # purpose, because the gate's job is to be fast.
  #
  # Its own job rather than a step on `esp32c3-ble-e2e`: a soak that overruns
  # must not take the three pinned-image BLE gates down with it.
  esp32c3-ble-pong-soak:
    name: ESP32-C3 BLE Pong Cadence Soak
    runs-on: ubuntu-latest
    # The run is ~6 min; the release build of labwired-core on a cold cache is
    # the rest. Generous so a slow runner reports the SOAK's verdict rather
    # than being measured by its own timeout.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-nightly-esp32c3-ble
          workspaces: |
            . -> target

      # Everything this needs is committed: the flash image
      # (crates/core/tests/fixtures/esp32c3-ble-pong-flash.bin), the C3 mask ROM
      # blobs, and configs/systems/esp32c3-ble-pong.yaml. No fetch step, and no
      # network — unlike the pinned-image BLE gates above.
      #
      # `--release` and `--features event-scheduler` are BOTH load-bearing. The
      # test file is `#![cfg(all(feature = "event-scheduler",
      # not(debug_assertions)))]`; drop either and this compiles to an empty
      # binary that reports "ok. 0 passed" — green while proving nothing. The
      # step after this one is what makes that impossible to miss.
      - name: BLE Pong two-node soak (~30 advertising republish periods)
        env:
          PONG_SOAK_CYCLES: ${{ inputs.pong_soak_cycles || '480000000' }}
        run: >
          cargo test --release -p labwired-core --features event-scheduler
          --test world_esp32c3_ble_pong -- --nocapture
          | tee "$RUNNER_TEMP/pong-soak.log"

      # An empty test binary and a passing one both exit 0. Assert the two
      # properties actually ran, so a cfg/feature slip is a red lane rather
      # than a soak that silently stops soaking.
      - name: Assert the soak was not vacuous
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pong-soak.log"
          grep -q 'two_c3_nodes_in_one_lab_do_not_share_a_bluetooth_address' "$log" \
            || { echo "::error::identity property did not run — release/feature gate slipped"; exit 1; }
          grep -q 'two_c3_nodes_running_one_ble_pong_image_start_the_game' "$log" \
            || { echo "::error::game-start property did not run — release/feature gate slipped"; exit 1; }

      # The test eprintln!s both nodes' role, last status line and 8-line tail
      # on PASS as well as on fail. At soak length that tail is the cadence
      # evidence a human reads, so keep it even when the lane is green.
      - name: Upload soak console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-ble-pong-soak-log
          path: ${{ runner.temp }}/pong-soak.log
          if-no-files-found: warn

  tier1-fixture-drift:
    name: Tier-1 Fixture Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Gate to Sundays only for scheduled runs; workflow_dispatch always proceeds.
      - name: Set drift-skip flag on non-Sunday scheduled runs
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "7" ]; then
            echo "SKIP_DRIFT=1" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.SKIP_DRIFT != '1'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        if: env.SKIP_DRIFT != '1'
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        if: env.SKIP_DRIFT != '1'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-nightly-esp
          workspaces: |
            . -> target

      # Install the Espressif Xtensa toolchain via espup.
      # NOTE: Xtensa release builds may not be bit-reproducible across toolchain versions.
      # If espup installs a newer toolchain and the hashes differ from MANIFEST.json,
      # this job fails and a human decides whether to refresh the committed blobs.
      # That failure is the feature — it prevents silent blob drift.
      - name: Install ARM and RISC-V fixture targets
        if: env.SKIP_DRIFT != '1'
        # build_tier1_fixtures.sh chains every per-family build script — the
        # STM32/nRF/RP2040 fixtures need the thumb targets, the C3 needs riscv.
        run: rustup target add thumbv6m-none-eabi thumbv7m-none-eabi thumbv7em-none-eabi riscv32imc-unknown-none-elf

      - name: Install espup and espflash
        if: env.SKIP_DRIFT != '1'
        run: cargo install espup espflash --locked

      - name: Install Xtensa toolchain via espup
        if: env.SKIP_DRIFT != '1'
        run: espup install

      - name: Rebuild tier1 fixture blobs
        if: env.SKIP_DRIFT != '1'
        run: |
          # Snapshot the COMMITTED manifest first — build_tier1_fixtures.sh
          # overwrites MANIFEST.json with hashes of the fresh build, and
          # comparing the rebuild against itself would always pass.
          git show HEAD:tests/fixtures/tier1/MANIFEST.json > /tmp/committed-manifest.json
          # shellcheck disable=SC1090  # export-esp.sh is generated at runtime
          # by `espup install`; there is no file to follow at lint time.
          source ~/export-esp.sh
          ./scripts/build_tier1_fixtures.sh

      # Compare freshly-built blob hashes against sha256 values in the COMMITTED
      # manifest (snapshotted above), ignoring source_rev (changes every rebuild).
      - name: Verify fixture hashes match committed manifest
        if: env.SKIP_DRIFT != '1'
        run: |
          python3 - <<'EOF'
          import hashlib, json, pathlib, sys

          manifest_path = pathlib.Path("/tmp/committed-manifest.json")
          committed = json.loads(manifest_path.read_text())

          failures = []
          for filename, meta in committed.items():
              blob = pathlib.Path("tests/fixtures/tier1") / filename
              if not blob.exists():
                  failures.append(f"MISSING: {filename}")
                  continue
              actual = hashlib.sha256(blob.read_bytes()).hexdigest()
              expected = meta["sha256"]
              if actual != expected:
                  failures.append(
                      f"DRIFT: {filename}\n"
                      f"  committed sha256 : {expected}\n"
                      f"  rebuilt  sha256  : {actual}"
                  )

          if failures:
              for msg in failures:
                  print(f"::error::{msg}")
              print(
                  "\nTier-1 fixture blobs drifted from the committed manifest.\n"
                  "If the toolchain was upgraded intentionally, re-run "
                  "./scripts/build_tier1_fixtures.sh locally and commit the updated blobs."
              )
              sys.exit(1)

          print(f"All {len(committed)} fixture blobs match committed manifest hashes.")
          EOF
