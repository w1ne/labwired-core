name: Rerun on runner loss

# Self-hosted runners drop mid-job; the check then fails or is cancelled with no
# failing step and, under strict up-to-date protection, the PR stalls until
# someone runs `gh run rerun --failed`. This re-runs the failed jobs of a
# completed PR-gating run, but only when scripts/ci/rerun-on-runner-loss.mjs
# decides it looks like runner loss (never a failed step, never a concurrency or
# user cancel), and at most twice (run_attempt < 3). GITHUB_TOKEN only.
#
# Public repo: GitHub-hosted runners work, so the rerun job itself does not
# depend on the self-hosted pool it is rescuing.

on:
  workflow_run:
    workflows:
      - Rust Core CI
      - Core IO-Link Native
      - Core workflows lint
      - Native QEMU-derived ARM core
      - Core UDS evidence (H563)
      - Plugin contract
      - Python SDK
    types: [completed]

permissions:
  actions: write
  checks: read # job annotations tell runner loss from a cancel
  contents: read

jobs:
  rerun:
    # Skip cheaply: only failed/cancelled runs below the attempt cap need a job.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run executes the default branch's copy of this workflow; the
      # checkout is the default branch too, never the PR head.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci/rerun-on-runner-loss.mjs
          sparse-checkout-cone-mode: false
      - name: Classify and rerun failed jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/ci/rerun-on-runner-loss.mjs
