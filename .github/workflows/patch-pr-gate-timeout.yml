name: Patch pr-gate timeout

on:
  push:
    branches: [fix/xtensa-elf-vaddr]

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Linux, X64, europa]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xtensa-elf-vaddr
          fetch-depth: 0
      - name: Apply timeout correction
        run: python3 tools/patch_pr_gate_timeout.py
      - name: Commit corrected CI budget
        run: |
          git config user.name "labwired-bot"
          git config user.email "bot@labwired.com"
          git rm .github/workflows/patch-pr-gate-timeout.yml tools/patch_pr_gate_timeout.py
          git add .github/workflows/core-ci.yml
          git commit -m "ci: give required pr-gate enough test headroom"
          git push origin HEAD:fix/xtensa-elf-vaddr
