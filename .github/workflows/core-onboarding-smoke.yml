  workflow_dispatch:

concurrency:
  group: core-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-smoke:
    name: onboarding-${{ matrix.id }}
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Cortex-A9 PE, a bounded RAM aperture and one polled UART TX;
          # boot ROM, multicore, GIC, timers and other SoC peripherals are not modeled.
          - id: zynq-7000
            prebuilt_firmware: tests/fixtures/zynq7000-a9-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/zynq-7000-a9-uart-smoke.yaml
            system: configs/systems/onboarding/zynq-7000.yaml
          # One Cortex-A9 PE, a bounded RAM aperture and one polled UART TX;
          # boot ROM, multicore, GIC, timers and other SoC peripherals are not modeled.
          - id: zedboard
            prebuilt_firmware: tests/fixtures/zynq7000-a9-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/zedboard-a9-uart-smoke.yaml
            system: configs/systems/onboarding/zedboard.yaml
          # One Cortex-A9 PE, a bounded RAM aperture and one polled UART TX;
          # boot ROM, multicore, GIC, timers and other SoC peripherals are not modeled.
          - id: mars_zx3
            prebuilt_firmware: tests/fixtures/zynq7000-a9-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/mars_zx3-a9-uart-smoke.yaml
            system: configs/systems/onboarding/mars_zx3.yaml
          # One ARM926EJ-S, a bounded SDRAM aperture and one polled PL011 TX;
          # VIC/SIC, timers, Thumb execution and other peripherals are not modeled.
          - id: versatile
            prebuilt_firmware: tests/fixtures/versatile-arm926-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/versatile-arm926-uart-smoke.yaml
            system: configs/systems/onboarding/versatile.yaml
          # One Cortex-A9 PE, a bounded RAM aperture and one polled UART TX;
          # boot ROM, multicore, GIC, timers and other SoC peripherals are not modeled.
          - id: vexpress
            prebuilt_firmware: tests/fixtures/vexpress-a9-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/vexpress-a9-uart-smoke.yaml
            system: configs/systems/onboarding/vexpress.yaml
          # One Cortex-A9 PE, a bounded RAM aperture and one polled UART TX;
          # boot ROM, multicore, GIC, timers and other SoC peripherals are not modeled.
          - id: tegra2
            prebuilt_firmware: tests/fixtures/tegra-a9-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/tegra2-a9-uart-smoke.yaml
            system: configs/systems/onboarding/tegra2.yaml
          # One Cortex-A9 PE, a bounded RAM aperture and one polled UART TX;
          # boot ROM, multicore, GIC, timers and other SoC peripherals are not modeled.
          - id: tegra3
            prebuilt_firmware: tests/fixtures/tegra-a9-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/tegra3-a9-uart-smoke.yaml
            system: configs/systems/onboarding/tegra3.yaml
          # One A20 Cortex-A7 PE, a bounded DDR aperture and UART0 polled TX;
          # the BROM, multicore boot and other SoC peripherals are not modeled.
          - id: a20
            prebuilt_firmware: tests/fixtures/a20-a7-uart-smoke.elf
            cli_features: qemu-arm
            cli_profile: native-system
            script: examples/renode-onboarding/a20-a7-uart-smoke.yaml
            system: configs/systems/onboarding/a20.yaml
          # ARM7TDMI CPU execution plus only the imported UART0 TX write path;
          # no other LPC2294 peripheral registers are claimed by this smoke.
          - id: lpc2294
            prebuilt_firmware: tests/fixtures/lpc2294-arm7-uart-smoke.elf
            cli_features: qemu-arm-system
            cli_profile: native-system
            script: examples/renode-onboarding/lpc2294-arm7-uart-smoke.yaml
            system: configs/systems/onboarding/lpc2294.yaml
          # This imported STM32W108 profile is intentionally CPU-only: its
          # imported timer windows are not covered by this instruction smoke.
          - id: stm32w108
            crate: firmware-stm32w108-boot-smoke
            target: thumbv7m-none-eabi
            script: examples/renode-onboarding/stm32w108-boot-smoke.yaml
            system: configs/systems/onboarding/stm32w108.yaml
          # The imported Apollo4 boot-ROM scaffold was superseded by a sourced
          # M4F profile. This smoke covers UART0, GPIO, PWRCTRL and memories;
          # the SBL and every other Apollo4 peripheral remain outside scope.
          - id: ambiq-apollo4
            crate: firmware-apollo4p-evb-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/ambiq-apollo4-smoke.yaml
            system: configs/systems/onboarding/ambiq-apollo4.yaml
          # FT9001: corrected flash/SRAM map and the polled USART2 path that
          # Renode's FT9001_USART exposes; interrupts and other blocks are
          # outside scope.
          - id: focaltech_ft9001
            crate: firmware-ft9001-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/focaltech_ft9001-smoke.yaml
            system: configs/systems/onboarding/focaltech_ft9001.yaml
          # EOS S3 smokes cover only the corrected M4 code/SRAM windows and
          # the model-backed PL011; generated peripheral claims are omitted.
          - id: eos-s3
            crate: firmware-eos-s3-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/eos-s3-smoke.yaml
            system: configs/systems/onboarding/eos-s3.yaml
          - id: eos-s3-qomu
            crate: firmware-eos-s3-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/eos-s3-qomu-smoke.yaml
            system: configs/systems/onboarding/eos-s3-qomu.yaml
          - id: eos-s3-quickfeather
            crate: firmware-eos-s3-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/eos-s3-quickfeather-smoke.yaml
            system: configs/systems/onboarding/eos-s3-quickfeather.yaml
          # RA2E1's imported descriptor had stale flash/SRAM bounds and
          # generated peripheral claims. This smoke covers its sourced M23
          # core, code flash, and SRAM only.
          - id: renesas-ek_ra2e1
            crate: firmware-renesas-ek-ra2e1-smoke
            target: thumbv8m.base-none-eabi
            script: examples/renode-onboarding/renesas-ek_ra2e1-smoke.yaml
            system: configs/systems/onboarding/renesas-ek_ra2e1.yaml
          # RA2L1 is limited to Renode's Cortex-M23, code flash and SRAM map;
          # generated peripheral claims are omitted from this instruction smoke.
          - id: renesas-r7fa2l1a
            crate: firmware-renesas-r7fa2l1a-smoke
            target: thumbv8m.base-none-eabi
            script: examples/renode-onboarding/renesas-r7fa2l1a-smoke.yaml
            system: configs/systems/onboarding/renesas-r7fa2l1a.yaml
          # The standalone RA2E1 profile is restricted to its sourced M23
          # core, 128 KiB code flash, and 16 KiB SRAM; generated peripherals
          # are omitted until their models have been validated.
          - id: renesas-r7fa2e1a9
            crate: firmware-renesas-r7fa2e1a9-smoke
            target: thumbv8m.base-none-eabi
            script: examples/renode-onboarding/renesas-r7fa2e1a9-smoke.yaml
            system: configs/systems/onboarding/renesas-r7fa2e1a9.yaml
          # R7FA8M1A is restricted to the model-backed M85 CPU and memory map;
          # the imported peripheral claims remain omitted for this smoke.
          - id: renesas-r7fa8m1a
            crate: firmware-renesas-r7fa8m1a-smoke
            target: thumbv8m.main-none-eabi
            script: examples/renode-onboarding/renesas-r7fa8m1a-smoke.yaml
            system: configs/systems/onboarding/renesas-r7fa8m1a.yaml
          # One AArch32 Cortex-R52 PE (tlib arm64 target), a bounded RAM window and
          # one polled UART TX; GIC, generic timer, TCM and other PEs are not modeled.
          - id: renesas_rz_t2m
            prebuilt_firmware: tests/fixtures/rz-t2m-r52-sci-smoke.elf
            cli_features: qemu-arm-system
            cli_profile: native-system
            script: examples/renode-onboarding/renesas_rz_t2m-r52-sci-smoke.yaml
            system: configs/systems/onboarding/renesas_rz_t2m.yaml
          # One AArch32 Cortex-R52 PE (tlib arm64 target), a bounded RAM window and
          # one polled UART TX; GIC, generic timer, TCM and other PEs are not modeled.
          - id: renesas-rz_t2m_rsk
            prebuilt_firmware: tests/fixtures/rz-t2m-r52-sci-smoke.elf
            cli_features: qemu-arm-system
            cli_profile: native-system
            script: examples/renode-onboarding/renesas-rz_t2m_rsk-r52-sci-smoke.yaml
            system: configs/systems/onboarding/renesas-rz_t2m_rsk.yaml
          # One AArch32 Cortex-R52 PE (tlib arm64 target), a bounded RAM window and
