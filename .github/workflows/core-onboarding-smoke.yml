      - "tests/fixtures/avr/attiny84-cpu-smoke.elf"
      - "tests/fixtures/avr/attiny1634-cpu-smoke.elf"
      - "tests/fixtures/avr/attiny25-cpu-smoke.elf"
      - "tests/fixtures/avr/attiny45-cpu-smoke.elf"
      - "tests/fixtures/avr/attiny85-cpu-smoke.elf"
      - "scripts/build_attiny_x5_cpu_smoke.sh"
      - "crates/cli/**"
