name: Core Onboarding Smoke

# Scheduled runs are gated to this repository: every job below carries
# `if: github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core'`.
# GitHub attributes a cron run to whoever last edited the schedule, so a fork
# with Actions enabled mails this workflow's failures to a maintainer here,
# about a run they can neither see nor stop. Pushes and manual dispatch are
# untouched — a fork still gets this workflow on its own changes.
on:
  # Slow gates: nightly + main tip + manual. Not on PRs (PR merge target <1 min).
  schedule:
    - cron: "10 2 * * *"
  push:
    branches:
      - main
    paths:
      - "configs/chips/**"
      - "configs/systems/**"
      - "examples/**"
      - "crates/firmware-f401-demo/**"
      - "crates/firmware-f446-demo/**"
      - "crates/firmware-f4-discovery-smoke/**"
      - "crates/firmware-stm32g0-demo/**"
      - "crates/firmware-esp32c6-demo/**"
      - "crates/firmware-nucleo-f072rb-smoke/**"
      - "crates/firmware-nucleo-f091rc-smoke/**"
      - "crates/firmware-nucleo-f302r8-smoke/**"
      - "crates/firmware-nucleo-f303re-smoke/**"
      - "crates/firmware-nucleo-f303k8-smoke/**"
      - "crates/firmware-nucleo-f030r8-smoke/**"
      - "crates/firmware-nucleo-l011k4-smoke/**"
      - "crates/firmware-nucleo-f103rb-smoke/**"
      - "crates/firmware-nucleo-f411re-smoke/**"
      - "crates/firmware-nucleo-f410rb-smoke/**"
      - "crates/firmware-nucleo-f439zi-smoke/**"
      - "crates/firmware-nucleo-g071rb-smoke/**"
      - "crates/firmware-stm32g071b-disco-smoke/**"
      - "crates/firmware-nucleo-g0b1re-smoke/**"
      - "crates/firmware-nucleo-g431kb-smoke/**"
      - "crates/firmware-nucleo-g431rb-smoke/**"
      - "crates/firmware-nucleo-g491re-smoke/**"
      - "crates/firmware-nucleo-l432kc-smoke/**"
      - "configs/chips/stm32l432kc-nucleo-smoke.yaml"
      - "configs/systems/nucleo-l432kc.yaml"
      - "examples/nucleo-l432kc/**"
      - "crates/firmware-nucleo-l4a6zg-smoke/**"
      - "configs/chips/stm32l4a6zg-nucleo-smoke.yaml"
      - "configs/systems/nucleo-l4a6zg.yaml"
      - "examples/nucleo-l4a6zg/**"
      - "crates/firmware-nucleo-l452re-p-smoke/**"
      - "crates/firmware-nucleo-wb55rg-demo/**"
      - "crates/firmware-nucleo-wba55cg-smoke/**"
      - "crates/firmware-nucleo-h503rb-smoke/**"
      - "crates/firmware-nucleo-h533re-smoke/**"
      - "crates/firmware-nucleo-h723zg-smoke/**"
      - "crates/firmware-nucleo-h753zi-smoke/**"
      - "crates/firmware-stm32h735g-dk-smoke/**"
      - "crates/firmware-nucleo-c071rb-smoke/**"
      - "crates/firmware-teensy4-smoke/**"
      - "crates/firmware-uno-r4-wifi-smoke/**"
      - "crates/firmware-xiao-nrf54l15-smoke/**"
      - "configs/chips/stm32wba55cg-nucleo-smoke.yaml"
      - "configs/chips/stm32h503rb-nucleo-smoke.yaml"
      - "configs/chips/stm32h533re-nucleo-gpio-smoke.yaml"
      - "configs/chips/stm32c071rb-nucleo-smoke.yaml"
      - "configs/systems/nucleo-wba55cg-smoke.yaml"
      - "configs/systems/nucleo-h503rb.yaml"
      - "configs/systems/nucleo-h533re.yaml"
      - "configs/systems/nucleo-c071rb.yaml"
      - "configs/chips/r7fa4m1ab-uno-r4-wifi-smoke.yaml"
      - "configs/systems/arduino-uno-r4-wifi.yaml"
      - "examples/arduino-uno-r4-wifi/**"
      - "examples/nucleo-wba55cg/**"
      - "examples/nucleo-h503rb/**"
      - "examples/nucleo-h533re/**"
      - "examples/nucleo-c071rb/**"
      - "crates/firmware-l073-demo/**"
      - "crates/firmware-rp2040-demo/**"
      - "crates/firmware-feather-rp2040-smoke/**"
      - "crates/firmware-itsybitsy-rp2040-smoke/**"
      - "crates/firmware-feather-m4-express-smoke/**"
      - "configs/chips/rp2040-itsybitsy-smoke.yaml"
      - "configs/systems/adafruit-itsybitsy-rp2040.yaml"
      - "examples/adafruit-itsybitsy-rp2040/**"
      - "crates/firmware-pico-w-smoke/**"
      - "crates/firmware-xiao-rp2040-smoke/**"
      - "crates/firmware-nano-rp2040-connect-smoke/**"
      - "crates/firmware-pico2-demo/**"
      - "crates/firmware-pico2-w-smoke/**"
      - "crates/firmware-xiao-rp2350-smoke/**"
      - "crates/firmware-adafruit-feather-rp2350-smoke/**"
      - "examples/adafruit-feather-esp32-v2/**"
      - "scripts/build-adafruit-feather-esp32-v2-smoke.sh"
      - "crates/core/**"
      - "crates/firmware-stm32u575-demo/**"
      - "crates/firmware-nucleo-u545re-smoke/**"
      - "crates/firmware-atsamd51-demo/**"
      - "crates/firmware-atsamd51-pybadge-demo/**"
      - "crates/firmware-l552ze-smoke/**"
      - "crates/cli/**"
      - "crates/labwired-models-**"
      - ".github/workflows/core-onboarding-smoke.yml"
  workflow_dispatch:

concurrency:
  group: core-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-smoke:
    name: onboarding-${{ matrix.id }}
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: nucleo-f302r8
            crate: firmware-nucleo-f302r8-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-f302r8/onboarding-smoke.yaml
            system: configs/systems/nucleo-f302r8.yaml
          - id: nucleo-f303k8
            crate: firmware-nucleo-f303k8-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-f303k8/io-smoke.yaml
            system: configs/systems/nucleo-f303k8.yaml
          - id: nucleo-f303re
            crate: firmware-nucleo-f303re-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-f303re/io-smoke.yaml
            system: configs/systems/nucleo-f303re.yaml
          - id: nucleo-f030r8
            crate: firmware-nucleo-f030r8-smoke
            target: thumbv6m-none-eabi
