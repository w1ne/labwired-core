            target: riscv32imc-unknown-none-elf
            script: examples/esp32c6-devkitc/io-smoke.yaml
            system: configs/systems/esp32c6-devkitc.yaml
          - id: arduino-uno-r4-minima
            crate: firmware-ra4m1-demo
            target: thumbv7em-none-eabi
            script: examples/arduino-uno-r4-minima/io-smoke.yaml
            system: configs/systems/arduino-uno-r4-minima.yaml
          - id: arduino-uno-r4-wifi
