name: Core Onboarding Smoke

# Scheduled runs are gated to this repository: every job below carries
# `if: github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core'`.
# GitHub attributes a cron run to whoever last edited the schedule, so a fork
# with Actions enabled mails this workflow's failures to a maintainer here,
# about a run they can neither see nor stop. Pushes and manual dispatch are
# untouched — a fork still gets this workflow on its own changes.
on:
  # Slow gates: nightly + main tip + manual. Not on PRs (PR merge target <1 min).
  schedule:
    - cron: "10 2 * * *"
  push:
    branches:
      - main
    paths:
      - "configs/chips/**"
      - "configs/systems/**"
      - "examples/**"
      - "crates/core/**"
      - "crates/firmware-stm32u575-demo/**"
      - "crates/firmware-esp32c61-smoke/**"
      - "crates/firmware-esp32c61-bme280-smoke/**"
      - "crates/firmware-esp32h2-devkitm-1-smoke/**"
      - "crates/firmware-nucleo-f446re-smoke/**"
      - "crates/firmware-nucleo-h503rb-smoke/**"
      - "crates/firmware-nucleo-h753zi-smoke/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/cli/**"
      - "crates/labwired-models-**"
      - ".github/workflows/core-onboarding-smoke.yml"
  workflow_dispatch:

concurrency:
  group: core-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-smoke:
    name: onboarding-${{ matrix.id }}
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: stm32f401cdu6
            crate: firmware-f401-demo
            target: thumbv7em-none-eabi
            script: examples/stm32f401cdu6/uart-smoke.yaml
            system: configs/systems/stm32f401cdu6.yaml
          - id: stm32h563-nucleo
            crate: firmware-h563-demo
            target: thumbv7m-none-eabi
            script: examples/nucleo-h563zi/uart-smoke.yaml
            system: examples/nucleo-h563zi/system.yaml
          - id: stm32f103-bluepill
            crate: firmware-stm32f103-bluepill-smoke
            target: thumbv7m-none-eabi
            script: examples/stm32f103-bluepill/io-smoke.yaml
            system: configs/systems/stm32f103-bluepill.yaml
          - id: stm32u575-nucleo
            crate: firmware-stm32u575-demo
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-u575zi/io-smoke.yaml
            system: configs/systems/nucleo-u575zi.yaml
          # U5A5 uses the shared U575 demo only for its common Cortex-M33 boot
          # and USART1 `OK` path. Its PKA/HASH/SAES operation coverage remains
          # in the U5A5 SystemBus oracle, not in this board bring-up smoke.
          - id: stm32u5a5zj-nucleo
            crate: firmware-stm32u575-demo
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-u5a5zj/io-smoke.yaml
            system: examples/nucleo-u5a5zj/system.yaml
          - id: stm32u575-star-catcher
            crate: firmware-stm32u575-demo
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-u575zi/star-catcher-smoke.yaml
            system: examples/nucleo-u575zi/star-catcher-system.yaml
          - id: nucleo-g491re
            crate: firmware-nucleo-g491re-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-g491re/io-smoke.yaml
            system: configs/systems/nucleo-g491re.yaml
          # NUCLEO-G474RE: ensure the model routes advanced TIM1_CH1 PWM to
          # PA8 / AF6 and the output waveform reaches a board pad.
          - id: nucleo-g474re-tim1-pwm
            firmware_build_script: examples/nucleo_g474re/build-firmware.sh
            script: examples/nucleo_g474re/tim1-pwm-smoke.yaml
            system: examples/nucleo_g474re/system.yaml
          - id: nucleo-h533re
            crate: firmware-nucleo-h533re-smoke
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-h533re/io-smoke.yaml
            system: configs/systems/nucleo-h533re.yaml
          - id: nucleo-h503rb
            crate: firmware-nucleo-h503rb-smoke
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-h503rb/io-smoke.yaml
            system: configs/systems/nucleo-h503rb.yaml
          - id: nucleo-h753zi
            crate: firmware-nucleo-h753zi-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-h753zi/io-smoke.yaml
            system: configs/systems/nucleo-h753zi.yaml
          - id: nucleo-f446re
            crate: firmware-nucleo-f446re-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-f446re/io-smoke.yaml
            system: configs/systems/nucleo-f446re.yaml
          - id: nucleo-g491re-bme280
            crate: firmware-nucleo-g491re-bme280-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-g491re-bme280/bme280-smoke.yaml
            system: configs/systems/nucleo-g491re-bme280.yaml
          - id: rp2040-pio
            crate: firmware-rp2040-pio-onboarding
            target: thumbv6m-none-eabi
            script: examples/rp2040-pio/io-smoke.yaml
            system: examples/rp2040-pio/system.yaml
          - id: rp2040-pico-bme280
            crate: firmware-rp2040-pico-bme280-smoke
            target: thumbv6m-none-eabi
            script: examples/rp2040-pico-bme280/bme280-smoke.yaml
            system: configs/systems/rp2040-pico-bme280.yaml
          - id: rp2350-pico2w-bme280
            crate: firmware-rp2350-pico2w-bme280-smoke
            target: thumbv8m.main-none-eabi
            script: examples/rp2350-pico2w-bme280/bme280-smoke.yaml
            system: configs/systems/rp2350-pico2w-bme280.yaml
          - id: esp32c5-devkitc-1-n8r8-gpio
            crate: firmware-esp32c5-devkitc-1-gpio-smoke
            target: riscv32imac-unknown-none-elf
            script: examples/esp32c5-devkitc-1-gpio-smoke/io-smoke.yaml
            system: configs/systems/esp32c5-devkitc-1-n8r8-gpio.yaml
          - id: esp32s3-devkitc-1-n16r8-bme280
            firmware_build_script: examples/esp32s3-devkitc-1-n16r8-bme280/build-firmware.sh
            script: examples/esp32s3-devkitc-1-n16r8-bme280/bme280-smoke.yaml
            system: configs/systems/esp32s3-devkitc-1-n16r8-bme280.yaml
          - id: esp32c6-devkitc-1-n8-bme280
            firmware_build_script: examples/esp32c6-devkitc-1-n8-bme280/firmware/build-firmware.sh
            script: examples/esp32c6-devkitc-1-n8-bme280/bme280-smoke.yaml
            system: configs/systems/esp32c6-devkitc-1-n8-bme280.yaml
          - id: xiao-esp32c6-bme280
            firmware_build_script: examples/xiao-esp32c6-bme280/firmware/build-firmware.sh
            script: examples/xiao-esp32c6-bme280/bme280-smoke.yaml
            system: configs/systems/xiao-esp32c6-bme280.yaml
          - id: esp32c61-devkitc-1-n8r2-uart-gpio
            crate: firmware-esp32c61-smoke
            target: riscv32imc-unknown-none-elf
            script: examples/esp32c61-devkitc-1-n8r2/uart-smoke.yaml
            system: configs/systems/esp32c61-devkitc-1-n8r2.yaml
          - id: esp32c61-devkitc-1-n8r2-bme280
            crate: firmware-esp32c61-bme280-smoke
            target: riscv32imc-unknown-none-elf
            script: examples/esp32c61-devkitc-1-n8r2-bme280/bme280-smoke.yaml
            system: configs/systems/esp32c61-devkitc-1-n8r2-bme280.yaml
          - id: esp32h2-devkitm-1-n4s-uart-gpio
            crate: firmware-esp32h2-devkitm-1-smoke
            target: riscv32imac-unknown-none-elf
            script: examples/esp32h2-devkitm-1-n4s/uart-gpio-smoke.yaml
            system: configs/systems/esp32h2-devkitm-1-n4s.yaml
          - id: esp32c3-devkitm-1-n4x-bme280
            firmware_build_script: examples/esp32c3-devkitm-1-n4x-bme280/firmware/build-firmware.sh
            script: examples/esp32c3-devkitm-1-n4x-bme280/bme280-smoke.yaml
            system: configs/systems/esp32c3-devkitm-1-n4x-bme280.yaml
            rom_boot: true
          - id: arduino-nano-esp32-bme280
            firmware_build_script: examples/arduino-nano-esp32-bme280/firmware/build-firmware.sh
            script: examples/arduino-nano-esp32-bme280/bme280-smoke.yaml
            system: configs/systems/arduino-nano-esp32-bme280.yaml
          - id: esp32-devkitc-32e-bme280
            firmware_build_script: examples/esp32-devkitc-32e-bme280/firmware/build-firmware.sh
            script: examples/esp32-devkitc-32e-bme280/bme280-smoke.yaml
            system: configs/systems/esp32-devkitc-32e-bme280.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi,thumbv7m-none-eabi,thumbv7em-none-eabi,thumbv8m.main-none-eabi,riscv32imac-unknown-none-elf,riscv32imc-unknown-none-elf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-onboarding-smoke
          workspaces: |
            . -> target

      - name: Install PlatformIO
        if: ${{ matrix.firmware_build_script != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO package
        if: ${{ matrix.firmware_build_script != '' }}
        run: python -m pip install platformio==6.1.19

      - name: Run onboarding smoke
        if: ${{ matrix.firmware_build_script == '' }}
        run: |
          chmod +x scripts/onboarding_smoke.sh
          scripts/onboarding_smoke.sh \
            --target-id "${{ matrix.id }}" \
            --crate "${{ matrix.crate }}" \
            --target "${{ matrix.target }}" \
            --script "${{ matrix.script }}" \
            --system "${{ matrix.system }}" \
            --out-dir "out/onboarding-smoke/${{ matrix.id }}" \
            --threshold-seconds 3600

      - name: Run PlatformIO onboarding smoke
        if: ${{ matrix.firmware_build_script != '' }}
        run: |
          chmod +x scripts/onboarding_smoke.sh
          rom_boot_args=()
          if [[ "${{ matrix.rom_boot }}" == "true" ]]; then
            export LABWIRED_ESP32C3_FLASH="${GITHUB_WORKSPACE}/examples/esp32c3-devkitm-1-n4x-bme280/firmware/.pio/build/devkitm1_n4x/merged.bin"
            rom_boot_args+=(--rom-boot)
          fi
          scripts/onboarding_smoke.sh \
            --target-id "${{ matrix.id }}" \
            --firmware-build-script "${{ matrix.firmware_build_script }}" \
            --script "${{ matrix.script }}" \
            --system "${{ matrix.system }}" \
            --out-dir "out/onboarding-smoke/${{ matrix.id }}" \
            --threshold-seconds 3600 \
            "${rom_boot_args[@]}"

      - name: Publish onboarding summary
        if: always()
        run: |
          cat "out/onboarding-smoke/${{ matrix.id }}/onboarding-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload onboarding artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-smoke-${{ matrix.id }}
          path: out/onboarding-smoke/${{ matrix.id }}/
          retention-days: 5

  stm32u575-reference:
    name: stm32u575-60north-reference
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RENODE_U5_FIRMWARE: ${{ github.workspace }}/.external/renode-stm32u5/build/firmware
      U5_REFERENCE_SHA: 9cef86b9a9d880c0fae0c7b6c92ff039ec8a0c82
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned MIT 60North reference
        uses: actions/checkout@v4
        with:
          repository: 60north/renode-stm32u5
          ref: 9cef86b9a9d880c0fae0c7b6c92ff039ec8a0c82
          path: .external/renode-stm32u5
          persist-credentials: false

      - name: Install firmware build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stm32u575-reference

      - name: Build all 13 pinned reference firmwares
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stm32u575-reference
          reference=.external/renode-stm32u5
          test "$(git -C "$reference" rev-parse HEAD)" = "$U5_REFERENCE_SHA"
          {
            echo "60North reference: $U5_REFERENCE_SHA"
            git rev-parse HEAD
            arm-none-eabi-gcc --version
            cmake --version
            ninja --version
          } > out/stm32u575-reference/provenance.txt
          # Upstream CMake verifies all six ST/CMSIS component commits after fetch.
          cmake -S "$reference/firmware-tests" -B "$RENODE_U5_FIRMWARE" -G Ninja \
            -DSTM32CUBE_FIRMWARE=ON 2>&1 | tee out/stm32u575-reference/configure.log
          cmake --build "$RENODE_U5_FIRMWARE" --parallel 2 2>&1 | tee out/stm32u575-reference/build.log
          firmwares=(core-smoke clock-init hal-clock hal-gpio hal-uart hal-spi hal-spi-dma
            hal-spi-dma-loopback hal-uart-dma st-spi-fullduplex-polling-master
            st-i2c-twoboards-polling-master st-fdcan-loopback st-dma-flash-to-ram)
          for firmware in "${firmwares[@]}"; do
            test -s "$RENODE_U5_FIRMWARE/$firmware.elf"
            sha256sum "$RENODE_U5_FIRMWARE/$firmware.elf"
          done > out/stm32u575-reference/firmware-sha256.txt
          for component in st_hal st_device st_cmsis_core st_nucleo_bsp st_eval_bsp; do
            printf '%s ' "$component" >> out/stm32u575-reference/provenance.txt
            git -C "$RENODE_U5_FIRMWARE/_deps/$component-src" rev-parse HEAD >> out/stm32u575-reference/provenance.txt
          done
          git -C "$RENODE_U5_FIRMWARE/_deps/stm32cubeu5-examples" rev-parse HEAD >> out/stm32u575-reference/provenance.txt

      - name: Run firmware acceptance, register contracts and chip drift guards
        shell: bash
        run: |
          set -euo pipefail
          # These are LabWired runs of reference firmware, not Renode differential or silicon tests.
          cargo test --locked -p labwired-core --test stm32u575_60north -- --ignored --nocapture \
            2>&1 | tee out/stm32u575-reference/firmware-tests.log
          cargo test --locked -p labwired-core --test stm32u575_60north_registers --test u545_u575_drift_guard -- --nocapture \
            2>&1 | tee out/stm32u575-reference/register-drift-tests.log

      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32u575-60north-reference
          path: out/stm32u575-reference/
          if-no-files-found: warn
          retention-days: 14

  onboarding-scoreboard:
    name: onboarding-scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: onboarding-smoke
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download onboarding artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/onboarding-smoke
          pattern: onboarding-smoke-*
          merge-multiple: false

      - name: Generate onboarding scoreboard
        run: |
          python3 scripts/generate_onboarding_scoreboard.py \
            --metrics-root out/onboarding-smoke \
            --markdown-out out/onboarding-smoke/onboarding-scoreboard.md \
            --json-out out/onboarding-smoke/onboarding-scoreboard.json \
            --soft-threshold-seconds 3600

      - name: Publish scoreboard summary
        run: |
          cat out/onboarding-smoke/onboarding-scoreboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scoreboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-scoreboard
          path: |
            out/onboarding-smoke/onboarding-scoreboard.md
            out/onboarding-smoke/onboarding-scoreboard.json
          retention-days: 5
