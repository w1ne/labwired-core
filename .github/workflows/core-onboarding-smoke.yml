            system: configs/systems/seeed-xiao-rp2350.yaml
          - id: adafruit-feather-rp2350
            crate: firmware-adafruit-feather-rp2350-smoke
            firmware_build_dir: crates/firmware-adafruit-feather-rp2350-smoke
            target: thumbv8m.main-none-eabi
            script: examples/adafruit-feather-rp2350/io-smoke.yaml
            system: configs/systems/adafruit-feather-rp2350.yaml
          - id: pico
            crate: firmware-rp2040-demo
            target: thumbv6m-none-eabi
            script: examples/pico/io-smoke.yaml
            system: configs/systems/rp2040-pico.yaml
          - id: adafruit-feather-rp2040
            crate: firmware-feather-rp2040-smoke
            target: thumbv6m-none-eabi
            script: examples/adafruit-feather-rp2040/io-smoke.yaml
            system: configs/systems/adafruit-feather-rp2040.yaml
          - id: adafruit-itsybitsy-rp2040
            crate: firmware-itsybitsy-rp2040-smoke
