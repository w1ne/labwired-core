concurrency:
  group: core-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-smoke:
    name: onboarding-${{ matrix.id }}
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: nucleo-c051c8
            crate: firmware-nucleo-c051c8-smoke
            target: thumbv6m-none-eabi
            script: examples/nucleo-c051c8/onboarding-smoke.yaml
            system: configs/systems/nucleo-c051c8.yaml
          - id: esp32-s3-devkitc-1-n16r8
            firmware_build_script: examples/esp32-s3-devkitc-1-n16r8/ci/build-firmware.sh
