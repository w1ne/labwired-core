name: Core Onboarding Smoke

# Scheduled runs are gated to this repository: every job below carries
# `if: github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core'`.
# GitHub attributes a cron run to whoever last edited the schedule, so a fork
# with Actions enabled mails this workflow's failures to a maintainer here,
# about a run they can neither see nor stop. Pushes and manual dispatch are
# untouched — a fork still gets this workflow on its own changes.
on:
  # Slow gates: nightly + main tip + manual. Not on PRs (PR merge target <1 min).
  schedule:
    - cron: "10 2 * * *"
  push:
    branches:
      - main
    paths:
      - "configs/chips/**"
      - "configs/systems/**"
      - "examples/**"
      - "crates/core/**"
      - "crates/firmware-stm32f746-demo/**"
      - "crates/firmware-stm32u575-demo/**"
      - "crates/firmware-stm32h743-smoke/**"
      - "crates/firmware-stm32f429-smoke/**"
      - "crates/firmware-stm32f042-smoke/**"
      - "crates/firmware-stm32f072-smoke/**"
      - "crates/firmware-samd21-j17d-smoke/**"
      - "crates/firmware-stm32l071-smoke/**"
      - "crates/firmware-stm32l072-smoke/**"
      - "crates/firmware-nucleo-wba52cg-demo/**"
      - "crates/cli/**"
      - "crates/labwired-models-**"
      - ".github/workflows/core-onboarding-smoke.yml"
  workflow_dispatch:

concurrency:
  group: core-onboarding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  onboarding-smoke:
    name: onboarding-${{ matrix.id }}
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: stm32f401cdu6
            crate: firmware-f401-demo
            target: thumbv7em-none-eabi
            script: examples/stm32f401cdu6/uart-smoke.yaml
            system: configs/systems/stm32f401cdu6.yaml
          - id: stm32h563-nucleo
            crate: firmware-h563-demo
            target: thumbv7m-none-eabi
            script: examples/nucleo-h563zi/uart-smoke.yaml
            system: examples/nucleo-h563zi/system.yaml
          - id: stm32u575-nucleo
            crate: firmware-stm32u575-demo
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-u575zi/io-smoke.yaml
            system: configs/systems/nucleo-u575zi.yaml
          # U5A5 uses the shared U575 demo only for its common Cortex-M33 boot
          # and USART1 `OK` path. Its PKA/HASH/SAES operation coverage remains
          # in the U5A5 SystemBus oracle, not in this board bring-up smoke.
          - id: stm32u5a5zj-nucleo
            crate: firmware-stm32u575-demo
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-u5a5zj/io-smoke.yaml
            system: examples/nucleo-u5a5zj/system.yaml
          - id: stm32u575-star-catcher
            crate: firmware-stm32u575-demo
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-u575zi/star-catcher-smoke.yaml
            system: examples/nucleo-u575zi/star-catcher-system.yaml
          - id: rp2040-pio
            crate: firmware-rp2040-pio-onboarding
            target: thumbv6m-none-eabi
            script: examples/rp2040-pio/io-smoke.yaml
            system: examples/rp2040-pio/system.yaml
          # Imported Renode Cortex-M systems. These exercise representative
          # M0/M3/M4/M7 firmware against the exact imported system descriptors.
          # The SAMD21 J17D profile uses its actual 128 KiB/16 KiB memory map
          # and only the register windows used by this M0+ bring-up smoke.
          - id: atsamd21j17d-aft
            crate: firmware-samd21-j17d-smoke
            target: thumbv6m-none-eabi
            script: examples/renode-onboarding/atsamd21j17d-aft-smoke.yaml
            system: configs/systems/onboarding/atsamd21j17d-aft.yaml
          - id: stm32f072b_discovery
            crate: firmware-stm32f072b-disco-smoke
            target: thumbv6m-none-eabi
            script: examples/renode-onboarding/stm32f072b_discovery-smoke.yaml
            system: configs/systems/onboarding/stm32f072b_discovery.yaml
          - id: stm32f103
            crate: firmware-nucleo-f103rb-smoke
            target: thumbv7m-none-eabi
            script: examples/renode-onboarding/stm32f103-smoke.yaml
            system: configs/systems/onboarding/stm32f103.yaml
          # The EFM32G210 import is narrowed to its Cortex-M3, memory, and
          # model-backed USART0 path exercised by this firmware.
          - id: efm32g210
            crate: firmware-efm32g210-smoke
            target: thumbv7m-none-eabi
            script: examples/renode-onboarding/efm32g210-smoke.yaml
            system: configs/systems/onboarding/efm32g210.yaml
          - id: stm32f4_discovery
            crate: firmware-f4-discovery-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32f4_discovery-smoke.yaml
            system: configs/systems/onboarding/stm32f4_discovery.yaml
          - id: stm32f746
            crate: firmware-stm32f746-demo
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32f746-smoke.yaml
            system: configs/systems/onboarding/stm32f746.yaml
          # The shared F7 bare-register smoke exercises this imported F777
          # profile's modeled RCC, GPIOI, and USART1 blocks.
          - id: stm32f777
            crate: firmware-stm32f746-demo
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32f777-smoke.yaml
            system: configs/systems/onboarding/stm32f777.yaml
          - id: stm32f401cdu6-blackpill
            crate: firmware-f401cdu6-blackpill-demo
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32f401cdu6-blackpill-smoke.yaml
            system: configs/systems/onboarding/stm32f401cdu6-blackpill.yaml
          - id: stm32l552
            crate: firmware-l552ze-smoke
            target: thumbv8m.main-none-eabi
            script: examples/renode-onboarding/stm32l552-smoke.yaml
            system: configs/systems/onboarding/stm32l552.yaml
          # The WBA52 profile is limited to the modeled Cortex-M33, RCC,
          # GPIOA/GPIOB and USART1 surfaces exercised by this smoke.
          - id: nucleo_wba52cg
            crate: firmware-nucleo-wba52cg-demo
            target: thumbv8m.main-none-eabi
            script: examples/renode-onboarding/nucleo_wba52cg-smoke.yaml
            system: configs/systems/onboarding/nucleo_wba52cg.yaml
          # The imported H743 profile is limited to H7 RCC, GPIOA/GPIOD,
          # USART3, and the memory used by the shared H7 register smoke.
          - id: stm32h743
            crate: firmware-stm32h743-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32h743-smoke.yaml
            system: configs/systems/onboarding/stm32h743.yaml
          # Reuse the H7 register fixture on the imported NUCLEO-H753ZI board.
          # The smoke also asserts its imported GreenLED attachment at GPIOB.0.
          - id: nucleo_h753zi
            crate: firmware-stm32h743-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/nucleo_h753zi-smoke.yaml
            system: configs/systems/onboarding/nucleo_h753zi.yaml
          # The STM32F746G Discovery fixture is limited to the imported
          # Cortex-M7, bounded memory, RCC, GPIOI, and USART1 smoke surface.
          - id: stm32f7_discovery-bb
            crate: firmware-stm32f746-demo
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32f7_discovery-bb-smoke.yaml
            system: configs/systems/onboarding/stm32f7_discovery-bb.yaml
          # The L071 smoke exercises the shared STM32L0 RCC/GPIO/USART2 model
          # surface with a Cortex-M0+ binary built for the ARMv6-M ISA.
          - id: stm32l071
            crate: firmware-stm32l071-smoke
            target: thumbv6m-none-eabi
            script: examples/renode-onboarding/stm32l071-smoke.yaml
            system: configs/systems/onboarding/stm32l071.yaml
          # The L072 smoke exercises its imported system's bounded STM32L0 RCC,
          # GPIOA, and USART2 profile with an ARMv6-M Cortex-M0+ binary.
          - id: stm32l072
            crate: firmware-stm32l072-smoke
            target: thumbv6m-none-eabi
            script: examples/renode-onboarding/stm32l072-smoke.yaml
            system: configs/systems/onboarding/stm32l072.yaml
          # The F042 profile is limited to its modeled F0 RCC, GPIOA, and
          # modern USART1 surfaces exercised by this ARMv6-M fixture.
          - id: stm32f042
            crate: firmware-stm32f042-smoke
            target: thumbv6m-none-eabi
            script: examples/renode-onboarding/stm32f042-smoke.yaml
            system: configs/systems/onboarding/stm32f042.yaml
          # The F072 smoke exercises the shared F0 RCC, GPIOA and modern
          # USART1 models against the exact imported generic F072 system.
          - id: stm32f072
            crate: firmware-stm32f072-smoke
            target: thumbv6m-none-eabi
            script: examples/renode-onboarding/stm32f072-smoke.yaml
            system: configs/systems/onboarding/stm32f072.yaml
          # The shared F4 smoke exercises this imported F429 profile's RCC,
          # GPIOA/GPIOD and classic USART2 subset.
          - id: stm32f429
            crate: firmware-stm32f429-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32f429-smoke.yaml
            system: configs/systems/onboarding/stm32f429.yaml
          # Reuse the F4 register fixture against the exact imported F412
          # system, with a separate bounded profile and measured assertions.
          - id: stm32f412
            crate: firmware-stm32f429-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/stm32f412-smoke.yaml
            system: configs/systems/onboarding/stm32f412.yaml
          - id: nrf52840
            crate: firmware-nrf52840-demo
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/nrf52840-smoke.yaml
            system: configs/systems/onboarding/nrf52840.yaml
          # The imported DK profile keeps only its modeled P0, LED0 and UARTE0
          # path; the same fixture asserts UART output and a P0.13 transition.
          - id: nrf52840dk_nrf52840
            crate: firmware-nrf52840-demo
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/nrf52840dk_nrf52840-smoke.yaml
            system: configs/systems/onboarding/nrf52840dk_nrf52840.yaml
          - id: nucleo_f767zi
            crate: firmware-stm32f746-demo
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/nucleo_f767zi-smoke.yaml
            system: configs/systems/onboarding/nucleo_f767zi.yaml
          - id: sam4s_xplained
            crate: firmware-sam4s-xplained-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/sam4s_xplained-smoke.yaml
            system: configs/systems/onboarding/sam4s_xplained.yaml
          # Narrowed SAM E70 import: only its existing PMC, PIOC, and USART1
          # models remain in the execution profile.
          - id: sam_e70
            crate: firmware-sam-e70-renode-smoke
            target: thumbv7em-none-eabi
            script: examples/renode-onboarding/sam_e70-smoke.yaml
            system: configs/systems/onboarding/sam_e70.yaml
          # Imported RISC-V systems narrowed to modeled CPU, memory and
          # peripheral surfaces before these smokes run.
          - id: litex_vexriscv
            crate: firmware-litex-vexriscv-smoke
            target: riscv32im-unknown-none-elf
            script: examples/renode-onboarding/litex_vexriscv-smoke.yaml
            system: configs/systems/onboarding/litex_vexriscv.yaml
          - id: litex_ibex
            crate: firmware-litex-ibex-smoke
            target: riscv32imc-unknown-none-elf
            script: examples/renode-onboarding/litex_ibex-smoke.yaml
            system: configs/systems/onboarding/litex_ibex.yaml
          - id: litex_picorv32
            crate: firmware-litex-picorv32-smoke
            target: riscv32imc-unknown-none-elf
            script: examples/renode-onboarding/litex_picorv32-smoke.yaml
            system: configs/systems/onboarding/litex_picorv32.yaml
          - id: arty_litex_vexriscv
            crate: firmware-arty-litex-smoke
            target: riscv32im-unknown-none-elf
            script: examples/renode-onboarding/arty_litex_vexriscv-smoke.yaml
            system: configs/systems/onboarding/arty_litex_vexriscv.yaml
          - id: vegaboard_ri5cy
            crate: firmware-vegaboard-ri5cy-smoke
            target: riscv32imc-unknown-none-elf
            script: examples/renode-onboarding/vegaboard_ri5cy-smoke.yaml
            system: configs/systems/onboarding/vegaboard_ri5cy.yaml
          # Imported SiFive FE310 narrowed to RV32IMAC memory and uart0.
          - id: sifive-fe310
            crate: firmware-sifive-fe310-smoke
            target: riscv32im-unknown-none-elf
            script: examples/renode-onboarding/sifive-fe310-smoke.yaml
            system: configs/systems/onboarding/sifive-fe310.yaml
          # Mi-V profile follows Renode's CPU/memory map and keeps only the
          # CoreUART path exercised by the smoke.
          - id: miv_rv32
            crate: firmware-miv-rv32-smoke
            target: riscv32im-unknown-none-elf
            script: examples/renode-onboarding/miv_rv32-smoke.yaml
            system: configs/systems/onboarding/miv_rv32.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi,thumbv7m-none-eabi,thumbv7em-none-eabi,thumbv8m.main-none-eabi,riscv32im-unknown-none-elf,riscv32imc-unknown-none-elf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-onboarding-smoke
          workspaces: |
            . -> target

      - name: Run onboarding smoke
        run: |
          chmod +x scripts/onboarding_smoke.sh
          scripts/onboarding_smoke.sh \
            --target-id "${{ matrix.id }}" \
            --crate "${{ matrix.crate }}" \
            --target "${{ matrix.target }}" \
            --script "${{ matrix.script }}" \
            --system "${{ matrix.system }}" \
            --out-dir "out/onboarding-smoke/${{ matrix.id }}" \
            --threshold-seconds 3600

      - name: Publish onboarding summary
        if: always()
        run: |
          cat "out/onboarding-smoke/${{ matrix.id }}/onboarding-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload onboarding artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-smoke-${{ matrix.id }}
          path: out/onboarding-smoke/${{ matrix.id }}/
          retention-days: 5

  stm32u575-reference:
    name: stm32u575-60north-reference
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RENODE_U5_FIRMWARE: ${{ github.workspace }}/.external/renode-stm32u5/build/firmware
      U5_REFERENCE_SHA: 9cef86b9a9d880c0fae0c7b6c92ff039ec8a0c82
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned MIT 60North reference
        uses: actions/checkout@v4
        with:
          repository: 60north/renode-stm32u5
          ref: 9cef86b9a9d880c0fae0c7b6c92ff039ec8a0c82
          path: .external/renode-stm32u5
          persist-credentials: false

      - name: Install firmware build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stm32u575-reference

      - name: Build all 13 pinned reference firmwares
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stm32u575-reference
          reference=.external/renode-stm32u5
          test "$(git -C "$reference" rev-parse HEAD)" = "$U5_REFERENCE_SHA"
          {
            echo "60North reference: $U5_REFERENCE_SHA"
            git rev-parse HEAD
            arm-none-eabi-gcc --version
            cmake --version
            ninja --version
          } > out/stm32u575-reference/provenance.txt
          # Upstream CMake verifies all six ST/CMSIS component commits after fetch.
          cmake -S "$reference/firmware-tests" -B "$RENODE_U5_FIRMWARE" -G Ninja \
            -DSTM32CUBE_FIRMWARE=ON 2>&1 | tee out/stm32u575-reference/configure.log
          cmake --build "$RENODE_U5_FIRMWARE" --parallel 2 2>&1 | tee out/stm32u575-reference/build.log
          firmwares=(core-smoke clock-init hal-clock hal-gpio hal-uart hal-spi hal-spi-dma
            hal-spi-dma-loopback hal-uart-dma st-spi-fullduplex-polling-master
            st-i2c-twoboards-polling-master st-fdcan-loopback st-dma-flash-to-ram)
          for firmware in "${firmwares[@]}"; do
            test -s "$RENODE_U5_FIRMWARE/$firmware.elf"
            sha256sum "$RENODE_U5_FIRMWARE/$firmware.elf"
          done > out/stm32u575-reference/firmware-sha256.txt
          for component in st_hal st_device st_cmsis_core st_nucleo_bsp st_eval_bsp; do
            printf '%s ' "$component" >> out/stm32u575-reference/provenance.txt
            git -C "$RENODE_U5_FIRMWARE/_deps/$component-src" rev-parse HEAD >> out/stm32u575-reference/provenance.txt
          done
          git -C "$RENODE_U5_FIRMWARE/_deps/stm32cubeu5-examples" rev-parse HEAD >> out/stm32u575-reference/provenance.txt

      - name: Run firmware acceptance, register contracts and chip drift guards
        shell: bash
        run: |
          set -euo pipefail
          # These are LabWired runs of reference firmware, not Renode differential or silicon tests.
          cargo test --locked -p labwired-core --test stm32u575_60north -- --ignored --nocapture \
            2>&1 | tee out/stm32u575-reference/firmware-tests.log
          cargo test --locked -p labwired-core --test stm32u575_60north_registers --test u545_u575_drift_guard -- --nocapture \
            2>&1 | tee out/stm32u575-reference/register-drift-tests.log

      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32u575-60north-reference
          path: out/stm32u575-reference/
          if-no-files-found: warn
          retention-days: 14

  onboarding-scoreboard:
    name: onboarding-scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: onboarding-smoke
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download onboarding artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/onboarding-smoke
          pattern: onboarding-smoke-*
          merge-multiple: false

      - name: Generate onboarding scoreboard
        run: |
          python3 scripts/generate_onboarding_scoreboard.py \
            --metrics-root out/onboarding-smoke \
            --markdown-out out/onboarding-smoke/onboarding-scoreboard.md \
            --json-out out/onboarding-smoke/onboarding-scoreboard.json \
            --soft-threshold-seconds 3600

      - name: Publish scoreboard summary
        run: |
          cat out/onboarding-smoke/onboarding-scoreboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scoreboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-scoreboard
          path: |
            out/onboarding-smoke/onboarding-scoreboard.md
            out/onboarding-smoke/onboarding-scoreboard.json
          retention-days: 5
