            target: thumbv7em-none-eabi
            script: examples/feather-m4-express/io-smoke.yaml
            system: configs/systems/feather-m4-express.yaml
          - id: raspberry-pi-pico-w
            crate: firmware-pico-w-smoke
            target: thumbv6m-none-eabi
            script: examples/raspberry-pi-pico-w/io-smoke.yaml
            system: configs/systems/raspberry-pi-pico-w.yaml
          - id: arduino-nano-rp2040-connect
            crate: firmware-nano-rp2040-connect-smoke
            target: thumbv6m-none-eabi
            script: examples/arduino-nano-rp2040-connect/io-smoke.yaml
            system: configs/systems/arduino-nano-rp2040-connect.yaml
          - id: seeed-xiao-rp2040
            crate: firmware-xiao-rp2040-smoke
            target: thumbv6m-none-eabi
            script: examples/seeed-xiao-rp2040/io-smoke.yaml
            system: configs/systems/seeed-xiao-rp2040.yaml
          - id: metro-m4
            crate: firmware-atsamd51-demo
            target: thumbv7em-none-eabi
            script: examples/metro-m4/onboarding-smoke.yaml
            system: configs/systems/metro-m4.yaml
          - id: adafruit-pybadge
            crate: firmware-atsamd51-pybadge-demo
            target: thumbv7em-none-eabi
            script: examples/pybadge/onboarding-smoke.yaml
            system: examples/pybadge/system.yaml
          - id: nucleo-l476rg
            crate: firmware-l476-demo
            target: thumbv7em-none-eabihf
            script: examples/nucleo-l476rg/io-smoke.yaml
            system: configs/systems/nucleo-l476rg.yaml
          - id: nucleo-l552ze-q
            crate: firmware-l552ze-smoke
            target: thumbv8m.main-none-eabi
            script: examples/nucleo-l552ze-q/io-smoke.yaml
            system: examples/nucleo-l552ze-q/system.yaml
          - id: adafruit-feather-esp32-v2
            firmware_build_script: scripts/build-adafruit-feather-esp32-v2-smoke.sh
            script: examples/adafruit-feather-esp32-v2/io-smoke.yaml
            system: configs/systems/adafruit-feather-esp32-v2.yaml

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi,thumbv7m-none-eabi,thumbv7em-none-eabi,thumbv7em-none-eabihf,thumbv8m.main-none-eabi,riscv32imc-unknown-none-elf

      - name: Set up Python for Feather ESP32 V2
        if: matrix.firmware_build_script != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO for Feather ESP32 V2
        if: matrix.firmware_build_script != ''
        run: python -m pip install platformio

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-onboarding-smoke
          workspaces: |
            . -> target

      - name: Run onboarding smoke
        run: |
          chmod +x scripts/onboarding_smoke.sh
          scripts/onboarding_smoke.sh \
            --target-id "${{ matrix.id }}" \
            --crate "${{ matrix.crate }}" \
            --target "${{ matrix.target }}" \
            --script "${{ matrix.script }}" \
            --system "${{ matrix.system }}" \
            --firmware-build-dir "${{ matrix.firmware_build_dir }}" \
            --firmware-build-script "${{ matrix.firmware_build_script }}" \
            --out-dir "out/onboarding-smoke/${{ matrix.id }}" \
            --threshold-seconds 3600

      - name: Publish onboarding summary
        if: always()
        run: |
          cat "out/onboarding-smoke/${{ matrix.id }}/onboarding-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload onboarding artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-smoke-${{ matrix.id }}
          path: out/onboarding-smoke/${{ matrix.id }}/
          retention-days: 5

  stm32u575-reference:
    name: stm32u575-60north-reference
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RENODE_U5_FIRMWARE: ${{ github.workspace }}/.external/renode-stm32u5/build/firmware
      U5_REFERENCE_SHA: 9cef86b9a9d880c0fae0c7b6c92ff039ec8a0c82
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned MIT 60North reference
        uses: actions/checkout@v4
        with:
          repository: 60north/renode-stm32u5
          ref: 9cef86b9a9d880c0fae0c7b6c92ff039ec8a0c82
          path: .external/renode-stm32u5
          persist-credentials: false

      - name: Install firmware build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stm32u575-reference

      - name: Build all 13 pinned reference firmwares
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/stm32u575-reference
          reference=.external/renode-stm32u5
          test "$(git -C "$reference" rev-parse HEAD)" = "$U5_REFERENCE_SHA"
          {
            echo "60North reference: $U5_REFERENCE_SHA"
            git rev-parse HEAD
            arm-none-eabi-gcc --version
            cmake --version
            ninja --version
          } > out/stm32u575-reference/provenance.txt
          # Upstream CMake verifies all six ST/CMSIS component commits after fetch.
          cmake -S "$reference/firmware-tests" -B "$RENODE_U5_FIRMWARE" -G Ninja \
            -DSTM32CUBE_FIRMWARE=ON 2>&1 | tee out/stm32u575-reference/configure.log
          cmake --build "$RENODE_U5_FIRMWARE" --parallel 2 2>&1 | tee out/stm32u575-reference/build.log
          firmwares=(core-smoke clock-init hal-clock hal-gpio hal-uart hal-spi hal-spi-dma
            hal-spi-dma-loopback hal-uart-dma st-spi-fullduplex-polling-master
            st-i2c-twoboards-polling-master st-fdcan-loopback st-dma-flash-to-ram)
          for firmware in "${firmwares[@]}"; do
            test -s "$RENODE_U5_FIRMWARE/$firmware.elf"
            sha256sum "$RENODE_U5_FIRMWARE/$firmware.elf"
          done > out/stm32u575-reference/firmware-sha256.txt
          for component in st_hal st_device st_cmsis_core st_nucleo_bsp st_eval_bsp; do
            printf '%s ' "$component" >> out/stm32u575-reference/provenance.txt
            git -C "$RENODE_U5_FIRMWARE/_deps/$component-src" rev-parse HEAD >> out/stm32u575-reference/provenance.txt
          done
          git -C "$RENODE_U5_FIRMWARE/_deps/stm32cubeu5-examples" rev-parse HEAD >> out/stm32u575-reference/provenance.txt

      - name: Run firmware acceptance, register contracts and chip drift guards
        shell: bash
        run: |
          set -euo pipefail
          # These are LabWired runs of reference firmware, not Renode differential or silicon tests.
          cargo test --locked -p labwired-core --test stm32u575_60north -- --ignored --nocapture \
            2>&1 | tee out/stm32u575-reference/firmware-tests.log
          cargo test --locked -p labwired-core --test stm32u575_60north_registers --test u545_u575_drift_guard -- --nocapture \
            2>&1 | tee out/stm32u575-reference/register-drift-tests.log

      - name: Upload reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32u575-60north-reference
          path: out/stm32u575-reference/
          if-no-files-found: warn
          retention-days: 14

  onboarding-scoreboard:
    name: onboarding-scoreboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: onboarding-smoke
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download onboarding artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/onboarding-smoke
          pattern: onboarding-smoke-*
          merge-multiple: false

      - name: Generate onboarding scoreboard
        run: |
          python3 scripts/generate_onboarding_scoreboard.py \
            --metrics-root out/onboarding-smoke \
            --markdown-out out/onboarding-smoke/onboarding-scoreboard.md \
            --json-out out/onboarding-smoke/onboarding-scoreboard.json \
            --soft-threshold-seconds 3600

      - name: Publish scoreboard summary
        run: |
          cat out/onboarding-smoke/onboarding-scoreboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scoreboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-scoreboard
          path: |
            out/onboarding-smoke/onboarding-scoreboard.md
            out/onboarding-smoke/onboarding-scoreboard.json
          retention-days: 5
