            target: thumbv7em-none-eabi
            script: examples/nucleo-g491re/onboarding-smoke.yaml
            system: configs/systems/nucleo-g491re.yaml
          - id: nucleo-l452re-p
            crate: firmware-nucleo-l452re-p-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-l452re-p/onboarding-smoke.yaml
            system: configs/systems/nucleo-l452re-p-smoke.yaml
          - id: nucleo-l432kc
            crate: firmware-nucleo-l432kc-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-l432kc/onboarding-smoke.yaml
            system: configs/systems/nucleo-l432kc.yaml
          - id: nucleo-l4a6zg
            crate: firmware-nucleo-l4a6zg-smoke
            target: thumbv7em-none-eabi
            script: examples/nucleo-l4a6zg/onboarding-smoke.yaml
