          - id: nucleo-l073rz
            crate: firmware-l073-demo
            target: thumbv6m-none-eabi
            script: examples/nucleo-l073rz/io-smoke.yaml
            system: examples/nucleo-l073rz/system.yaml
          - id: nucleo-f401re
            crate: firmware-f401-demo
            target: thumbv7em-none-eabi
            script: examples/nucleo-f401re/io-smoke.yaml
            system: configs/systems/nucleo-f401re.yaml
          - id: nucleo-f446re
