; Source for the two flash fixtures that
; crates/core/tests/esp32c3_usb_cdc_console.rs boots.
;
; ONE sketch, TWO consoles — that pairing is the whole point. The `cdc` env is
; the ESP32-C3 SuperMini's real configuration (USB-C wired to USB_SERIAL_JTAG,
; so `Serial` is an interrupt-driven HWCDC); the `uart` env is the identical
; sketch on HardwareSerial/UART0 and exists purely as the control that proves a
; silent CDC console is the peripheral model's fault and not the twin's boot.
;
; Rebuild:
;   pio run -e cdc -e uart
;   python3 - <<'PY'  # merge each env at 0x0/0x8000/0x10000, pad with 0xff
;   ...
;   PY
; then copy the merged images to crates/core/tests/fixtures/ as
; esp32c3-usb-cdc-console-flash.bin and esp32c3-uart0-console-control-flash.bin.

[platformio]
boards_dir = ../esp32c3-display-workshop/boards

[env:cdc]
platform = espressif32@7.0.1
board = esp32-c3-supermini
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=0

[env:uart]
platform = espressif32@7.0.1
board = esp32-c3-supermini
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -DARDUINO_USB_MODE=1
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
