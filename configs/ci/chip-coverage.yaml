  rv1103:
    kind: waived
    reason: >-
      No CI gate qualifies full RV1103 platform coverage. The normal descriptor
      still declares CPU and memory geometry only. Optional native reduced Linux
      direct boot and joint I2C3/UART4 basket acceptance pass separately at fixed
      functional 24MHz, with a persistent reduced power plant. The older generic
      Cortex-A7 CPU subset is not board coverage. Vendor BSP/SD/ROM boot, DDR
      initialization, full silicon and physical qualification remain unavailable.
