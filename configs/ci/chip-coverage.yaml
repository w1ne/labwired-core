# Explicit debt for the RV1103 prototype and geometry-only SAMD21 variants,
# not firmware coverage.
# scripts/ci/chip_coverage.py derives coverage from actual workflow execution;
# this ledger only records shipped models without a qualifying per-chip firmware run.
# Another uncovered chip still fails. Remove this entry and the file when an
# RV1103 firmware CLI gate and SAMD21 variant CLI coverage exist; the
# stale-waiver check enforces that change.
max_uncovered: 12

uncovered:
  atsamd21e15a:
    kind: pending
    reason: >-
      Geometry-only SAMD21 alternate reuses the atsamd21g18a engine. Descriptor
