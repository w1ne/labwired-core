# Board/example CI manifest. One entry per CI target.
# kind:        firmware-gate | sim-validate | aggregate
# gate: true   -> runs on pull_request/push to main; false -> nightly only
# path:        directory whose ci/build.sh + ci/test.sh run the entry
# apt:         apt packages to install (e.g. gcc-arm-none-eabi)
# rust_targets: rustup targets to add (e.g. thumbv6m-none-eabi)
# packs:       named, reusable device-pack fetchers (see .github/actions/fetch-pack)
boards:
  - id: iolink-station-l476
    kind: firmware-gate
    path: examples/iolink-station
    apt: [gcc-arm-none-eabi, libnewlib-arm-none-eabi]
    packs: [stm32cubel4@v1.18.2]
    submodules: recursive
    gate: true
  - id: ci-fixture-arm
    kind: firmware-gate
    path: examples/ci-fixture-arm
    rust_targets: [thumbv6m-none-eabi]
    gate: false
  - id: ci-fixture-riscv
    kind: firmware-gate
    path: examples/ci-fixture-riscv
    rust_targets: [riscv32i-unknown-none-elf]
    gate: false
  - id: nucleo-h563zi
    kind: firmware-gate
    path: examples/nucleo-h563zi
    rust_targets: [thumbv7m-none-eabi]
    gate: false
  # Committed ELF, no cross-toolchain, runs in seconds — cheap enough to gate on
  # every PR. It went ungated long enough for its own assertions to stop passing.
  - id: esp32c3-blinky
    kind: sim-validate
    path: examples/esp32c3-blinky
    gate: true
  # atmega2560's only CLI proof. Committed ELF, no toolchain, seconds to run.
  - id: arduino-mega-2560-io
    kind: sim-validate
    path: examples/arduino-mega-2560-io
    gate: true
  # atmega2561's CLI proof. Committed tiny AVR ELF, no toolchain, seconds to run.
  - id: atmega2561-io
    kind: sim-validate
    path: examples/atmega2561-io
    gate: true
  # PIC18F4520: the first PIC18 part. Committed SDCC 4.4.0 ELF (rebuilding
  # needs the upstream SDCC pic16 port, so CI checks the HEX->ELF wrap is
  # byte-identical instead), the EUSART/LED io-smoke and a clean 200k-step run.
  - id: pic18f4520
    kind: sim-validate
    path: examples/pic18f4520
    gate: true
  # Builds the real target source with avr-gcc and runs its committed ELF.
  - id: atmega1281-io
    kind: sim-validate
    path: examples/atmega1281-io
    apt: [gcc-avr, binutils-avr, avr-libc]
    gate: true
  # CC2538DK: the first TI CC2538 part. Builds the cortex-m-rt smoke for
  # thumbv7m (the CC2538 is a Cortex-M3) and runs the UART0/LED io-smoke plus
  # the unsupported-instruction audit through the CLI.
  - id: cc2538dk
    kind: sim-validate
    path: examples/cc2538dk
    rust_targets: [thumbv7m-none-eabi]
    gate: true
  # EK-RA6M5: the first RA6M5 part. Builds the cortex-m-rt smoke for
  # thumbv8m.main (the RA6M5 is a Cortex-M33) and runs the SCI0/LED io-smoke
  # plus the unsupported-instruction audit through the CLI.
  - id: ek-ra6m5
    kind: sim-validate
    path: examples/ek-ra6m5
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # SAM E70 Xplained: the first SAM E70 part. Builds the cortex-m-rt smoke for
  # thumbv7em (the SAM E70 is a Cortex-M7) and runs the USART1/LED io-smoke
  # plus the unsupported-instruction audit through the CLI.
  - id: sam-e70-xplained
    kind: sim-validate
    path: examples/sam-e70-xplained
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # Apollo4 Plus EVB: the first Ambiq part. Builds the cortex-m-rt smoke for
  # thumbv7em (the Apollo4 Plus is a Cortex-M4F) and runs the UART0/LED
  # io-smoke plus the unsupported-instruction audit through the CLI.
  - id: apollo4p-evb
    kind: sim-validate
    path: examples/apollo4p-evb
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # S32K388EVB-Q289: the first S32K3 part. Builds the cortex-m-rt smoke for
  # thumbv7em (CM7_0 is a Cortex-M7) and runs the LPUART2/SIUL2 io-smoke plus
  # the unsupported-instruction audit through the CLI.
  - id: s32k388-evb
    kind: sim-validate
    path: examples/s32k388-evb
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # MIMXRT595-EVK: the first i.MX RT500 part. Builds the cortex-m-rt smoke
  # for thumbv8m.main (Cortex-M33) and runs the FLEXCOMM0/GPIO io-smoke plus
  # the unsupported-instruction audit through the CLI.
  - id: mimxrt595-evk
    kind: sim-validate
    path: examples/mimxrt595-evk
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # NUCLEO-L552ZE-Q: the first STM32L5 part. Builds the cortex-m-rt smoke for
  # thumbv8m.main and runs the LPUART1/GPIO io-smoke plus the unsupported-
  # instruction audit through the CLI, so the chip is proven by a gate on
  # every PR that touches configs/ or examples/.
  - id: nucleo-l552ze-q
    kind: sim-validate
    path: examples/nucleo-l552ze-q
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # FRDM-K64F UART-only L1: builds the Cortex-M4F smoke and runs the UART0/RGB
  # LED io-smoke plus the unsupported-instruction audit through the CLI.
  - id: frdm-k64f
    kind: sim-validate
    path: examples/frdm-k64f
    rust_targets: [thumbv7em-none-eabi]
    gate: true
