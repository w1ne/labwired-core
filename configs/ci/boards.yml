# Board/example CI manifest. One entry per CI target.
# kind:        firmware-gate | sim-validate | aggregate
# gate: true   -> runs on pull_request/push to main; false -> nightly only
# path:        directory whose ci/build.sh + ci/test.sh run the entry
# apt:         apt packages to install (e.g. gcc-arm-none-eabi)
# rust_targets: rustup targets to add (e.g. thumbv6m-none-eabi)
# packs:       named, reusable device-pack fetchers (see .github/actions/fetch-pack)
boards:
  - id: iolink-station-l476
    kind: firmware-gate
    path: examples/iolink-station
    apt: [gcc-arm-none-eabi, libnewlib-arm-none-eabi]
    packs: [stm32cubel4@v1.18.2]
    submodules: recursive
    gate: true
  - id: ci-fixture-arm
    kind: firmware-gate
    path: examples/ci-fixture-arm
    rust_targets: [thumbv6m-none-eabi]
    gate: false
  - id: ci-fixture-riscv
    kind: firmware-gate
    path: examples/ci-fixture-riscv
    rust_targets: [riscv32i-unknown-none-elf]
    gate: false
  - id: nucleo-h563zi
    kind: firmware-gate
    path: examples/nucleo-h563zi
    rust_targets: [thumbv7m-none-eabi]
    gate: false
  # Maintenance coverage for the already-onboarded NUCLEO-H723ZG. Its exact
  # USART3 VCP + LD1 smoke is cheap and guards the board profile on main pushes.
  - id: nucleo-h723zg
    kind: sim-validate
    path: examples/nucleo-h723zg
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # Demand group #4/#4: other STM32 is 13% of MCU use; Nucleo/Discovery kits
  # are 23%. Active H533RE Nucleo smoke covers USART2, PA5/LD2, and BME280 I2C1.
  - id: nucleo-h533re
    kind: sim-validate
    path: examples/nucleo-h533re
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # TI MSPM0G3507 LaunchPad strategic vendor coverage (TI LaunchPad kits: 7%;
  # this MCU has no separately measured demand rank). The narrow UART0 smoke
  # gates core boot and TXDATA capture on its exact memory map.
  - id: lp-mspm0g3507-launchpad
    kind: sim-validate
    path: examples/lp-mspm0g3507-launchpad
    rust_targets: [thumbv6m-none-eabi]
    gate: true
  # Committed ELF, no cross-toolchain, runs in seconds — cheap enough to gate on
  # every PR. It went ungated long enough for its own assertions to stop passing.
  - id: esp32c3-blinky
    kind: sim-validate
    path: examples/esp32c3-blinky
    gate: true
  # Demand-rank 1 ESP32-family board: the active DevKitM-1-N4X UART0 and
  # GPIO8 addressable RGB LED smoke uses a board-specific fixture and the
  # decoded WS2812 observer, leaving the generic C3 reference firmware intact.
  - id: esp32c3-devkitm-1-n4x
    kind: sim-validate
    path: examples/esp32c3-devkitm-1-n4x
    rust_targets: [riscv32imc-unknown-none-elf]
    gate: true
  # Demand-rank 1 ESP32-family depth: current ESP8684-DevKitM-1-H4X UART0
  # and onboard red LED output on GPIO0. C2 itself is not separately ranked.
  - id: esp8684-devkitm-1-h4x
    kind: sim-validate
    path: examples/esp8684-devkitm-1-h4x
    rust_targets: [riscv32imac-unknown-none-elf]
    gate: true
  # Demand-rank 1 ESP32-family addition: the current ESP32-S2-DevKitC-1-N8R2.
  # The committed LX7 ELF exercises UART0 through its host-console bridge.
  - id: esp32s2-devkitc-1-n8r2
    kind: sim-validate
    path: examples/esp32s2-devkitc-1-n8r2
    gate: true
  # ESP32-H2-DevKitM-1-N4S: rebuild the RV32IMC fixture and verify UART0 plus
  # a decoded red frame on the onboard GPIO8 WS2812 LED.
  - id: esp32h2-devkitm-1-n4s
    kind: sim-validate
    path: examples/esp32h2-devkitm-1-n4s
    rust_targets: [riscv32imc-unknown-none-elf]
    gate: true
  # Demand-rank 1 ESP32-family depth: C61 DevKitC-1 N8R2 UART0 + GPIO4 output.
  - id: esp32c61-devkitc-1-n8r2
    kind: sim-validate
    path: examples/esp32c61-devkitc-1-n8r2
    rust_targets: [riscv32imc-unknown-none-elf]
    gate: true
  # C61 I2C0 and BME280 sensor smoke on the live GPIO6/GPIO22 board route.
  - id: esp32c61-devkitc-1-n8r2-bme280
    kind: sim-validate
    path: examples/esp32c61-devkitc-1-n8r2-bme280
    rust_targets: [riscv32imc-unknown-none-elf]
    gate: true
  # Demand-rank 1 ESP32 family: C6-Zero-M with a BME280 on GPIO6/GPIO7.
  # This board profile uses the conservative 4 MB C6FH4 stock listing.
  - id: esp32c6-zero-m-bme280
    kind: sim-validate
    path: examples/esp32c6-zero-m-bme280
    rust_targets: [riscv32imc-unknown-none-elf]
    gate: true
  # Demand-rank 1 ESP32 family: current Arduino Nano ESP32 with a committed
  # S3 GPIO48/D13 smoke fixture. The onboarding workflow rebuilds it with PIO.
  - id: arduino-nano-esp32-gpio
    kind: sim-validate
    path: examples/arduino-nano-esp32
    gate: true
  # Demand-rank 1 Seeed XIAO ESP32C3 + BME280. Stock Arduino build boots in
  # full and reads the sensor with Wire on D4/D5 (GPIO6/GPIO7).
  - id: seeed-xiao-esp32c3-bme280
    kind: sim-validate
    path: examples/xiao-esp32c3-bme280
    gate: true
  # Demand-rank 1 ESP32-S3-DevKitC-1 N16R8 + BME280. Reads sensor ID and raw
  # temperature through the S3 I2C model and the GPIO-matrix route.
  - id: esp32s3-devkitc-1-n16r8-bme280
    kind: sim-validate
    path: examples/esp32s3-devkitc-1-n16r8-bme280
    gate: true
  # Demand-rank 1 ESP32 family: LCD-EV v1.5's SUB2 touch controller returns
  # one FT5x06 point over GPIO47/GPIO48 I2C; unrelated display/audio remain out.
  - id: esp32s3-lcd-ev-board-v1-5-touch
    kind: sim-validate
    path: examples/esp32s3-lcd-ev-board
    gate: true
  # Demand-rank 1 ESP32 family: the Feather V2's on-board red GPIO13 LED.
  # The committed fast-boot fixture keeps this board smoke quick on every PR.
  - id: adafruit-feather-esp32-v2-gpio
    kind: sim-validate
    path: examples/adafruit-feather-esp32-v2
    gate: true
  # Rank-1 ESP32 family depth: DevKitM-1 reads the BME280 chip ID on I2C0.
  - id: esp32-devkitm-1-bme280
    kind: sim-validate
    path: examples/esp32-devkitm-1
    gate: true
  # Demand group #2: current Adafruit Feather RP2350 with HSTX, no-PSRAM SKU.
  - id: adafruit-feather-rp2350
    kind: sim-validate
    path: examples/adafruit-feather-rp2350
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # Demand group #2: the exact Pico 2 W profile reads BME280 ID over I2C0.
  - id: rpi-pico-2-w-bme280
    kind: sim-validate
    path: examples/rpi-pico-2-w-bme280
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # Demand group #2: original Pico W/RP2040 reads a BME280 on I2C0 GP4/GP5;
  # wireless/CYW43439 behavior is explicitly outside this profile.
  - id: pico-w-bme280
    kind: sim-validate
    path: examples/pico-w-bme280
    rust_targets: [thumbv6m-none-eabi]
    gate: true
  # Demand group #2: the non-wireless Pico 2 reads the BME280 ID on I2C0/GP4-GP5.
  - id: pico2-bme280
    kind: sim-validate
    path: examples/pico2-bme280
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # Narrow ESP32-DevKitC-32E onboarding profile. Committed TIER1 ELF, no
  # cross-toolchain, seconds to run. Proves the new chip descriptor through
  # `labwired test` on every PR (chip-coverage ceiling forbids another waiver).
  - id: esp32-devkitc-32e-gpio-smoke
    kind: sim-validate
    path: examples/esp32-devkitc-32e-gpio-smoke
    gate: true
  # Narrow UART1-TX onboarding profile of the same DevKitC-32E SoC. Committed
  # TIER1 ELF, no cross-toolchain. Proves the new chip descriptor through
  # `labwired test` on every PR (chip-coverage ceiling forbids another waiver).
  - id: esp32-devkitc-32e-uart1
    kind: sim-validate
    path: examples/esp32-devkitc-32e-uart1
    gate: true
  # Narrow NUCLEO-F103RB + BME280 onboarding profile. Builds the in-repo
  # firmware crate and runs onboarding-smoke.yaml on every PR (chip-coverage
  # ceiling forbids another waiver).
  # STM32F446RE: committed real-register Cortex-M4 smoke ELF, UART2
  # banner and PA5 edges. No extra toolchain; gate the exact descriptor on PRs.
  - id: nucleo-f446re
    kind: sim-validate
    path: examples/nucleo-f446re
    gate: true
  # STM32F411RE: committed real-register Cortex-M4 smoke ELF, USART2
  # banner and PA5 (LD2) edges. No extra toolchain; gate the exact descriptor.
  - id: nucleo-f411re
    kind: sim-validate
    path: examples/nucleo-f411re
    gate: true
  # STM32L432KC: committed real-register Cortex-M4 smoke ELF, USART2
  # banner and PB3 (LD3) edges. No extra toolchain; gate the exact descriptor.
  - id: nucleo-l432kc
    kind: sim-validate
    path: examples/nucleo-l432kc
    gate: true
  # STM32L031K6: committed real-register Cortex-M0+ smoke ELF, USART2
  # banner and PB3 (LD3) edges. No extra toolchain; gate the exact descriptor.
  - id: nucleo-l031k6
    kind: sim-validate
    path: examples/nucleo-l031k6
    gate: true
  # Two Nordic nRF54L application-core siblings in one cheap PR-gated
  # simulation lane; committed exact ELFs (no Nordic SDK/toolchain dependency).
  - id: nrf54l05-l10-smoke
    kind: sim-validate
    path: examples/nrf54l05-l10
    gate: true
  - id: nucleo-f103rb-bme280
    kind: sim-validate
    path: examples/nucleo-f103rb-bme280
    rust_targets: [thumbv7m-none-eabi]
    gate: true
  # Demand-rank 3 STM32F103 exact C6 low-density profile. Boots the 32 KB /
  # 10 KB part configuration and checks USART2 plus PA5 LED behavior.
  - id: stm32f103c6-low-density
    kind: sim-validate
    path: examples/stm32f103c6-smoke
    rust_targets: [thumbv7m-none-eabi]
    gate: true
  # Demand-rank 3 STM32F103 exact R6 low-density profile. Boots the 32 KB /
  # 10 KB LQFP64 part configuration and checks USART2 plus PA5 LED behavior.
  - id: stm32f103r6-low-density
    kind: sim-validate
    path: examples/stm32f103r6-smoke
    rust_targets: [thumbv7m-none-eabi]
    gate: true
  # atmega2560's only CLI proof. Committed ELF, no toolchain, seconds to run.
  - id: arduino-mega-2560-io
    kind: sim-validate
    path: examples/arduino-mega-2560-io
    gate: true
  # atmega2561's CLI proof. Committed tiny AVR ELF, no toolchain, seconds to run.
  - id: atmega2561-io
    kind: sim-validate
    path: examples/atmega2561-io
    gate: true
  # ATmega328PB: builds the exact AVR-GCC target and verifies USART1 + PB5.
  - id: atmega328pb-usart1
    kind: sim-validate
    path: examples/atmega328pb-usart1
    apt: [gcc-avr, binutils-avr, avr-libc]
    gate: true
  # Demand-rank 2 AVR maintenance (ATmega328: 30%). Microchip currently marks
  # ATmega328P Not Recommended for new designs, so this protects the existing
  # Uno R3 path without onboarding a new part. Both committed-fixture smokes
  # exercise its Arduino UART/timer/LED and GPIO/ADC paths.
  - id: arduino-uno-r3-existing
    kind: sim-validate
    path: examples/arduino-uno-blinky
    gate: true
  # PIC18F4520: the first PIC18 part. Committed SDCC 4.4.0 ELF (rebuilding
  # needs the upstream SDCC pic16 port, so CI checks the HEX->ELF wrap is
  # byte-identical instead), the EUSART/LED io-smoke and a clean 200k-step run.
  - id: pic18f4520
    kind: sim-validate
    path: examples/pic18f4520
    gate: true
  # PIC16F877A L1: committed SDCC 4.4.0 pic14 firmware (the pic14 port is not
  # in distro packages either, so CI checks the HEX->ELF wrap), the USART/LED
  # io-smoke and a clean 200k-step run.
  - id: pic16f877a
    kind: sim-validate
    path: examples/pic16f877a
    gate: true
  # PIC16F1829 L1 (first enhanced mid-range part): committed SDCC 4.4.0
  # pic14 firmware (HEX->ELF wrap checked), the io-smoke with EUSART, LATA,
  # software INT and TMR0 interrupts, and a clean 200k-step run.
  - id: pic16f1829
    kind: sim-validate
    path: examples/pic16f1829
    gate: true
  # Builds the real target source with avr-gcc and runs its committed ELF.
  - id: atmega1281-io
    kind: sim-validate
    path: examples/atmega1281-io
    apt: [gcc-avr, binutils-avr, avr-libc]
    gate: true
  # CC2538DK: the first TI CC2538 part. Builds the cortex-m-rt smoke for
  # thumbv7m (the CC2538 is a Cortex-M3) and runs the UART0/LED io-smoke plus
  # the unsupported-instruction audit through the CLI.
  - id: cc2538dk
    kind: sim-validate
    path: examples/cc2538dk
    rust_targets: [thumbv7m-none-eabi]
    gate: true
  # PolarFire SoC Discovery Kit: the first RV64 part. Committed stock Zephyr
  # v4.1.0 fixtures (hello, synchronization, tests/kernel/common) on one U54
  # hart, plus the unsupported-instruction audit of each image.
  - id: mpfs-disco-kit
    kind: sim-validate
    path: examples/mpfs-disco-kit
    gate: true
  # SK-AM62: the first AArch64 part (TI AM6234, Cortex-A53). Committed stock
  # Zephyr v4.3.0 fixtures (hello, synchronization, tests/kernel/common), plus
  # the unsupported-instruction audit of each image.
  - id: sk-am62
    kind: sim-validate
    path: examples/sk-am62
    gate: true
  # EK-RX261: the first Renesas RX part (RXv3 core). Committed stock Zephyr
  # v4.3.0 fixtures (hello, synchronization, tests/kernel/common), plus the
  # unsupported-instruction audit of each image.
  - id: ek-rx261
    kind: sim-validate
    path: examples/ek-rx261
    gate: true
  # Curiosity PIC32MZ EF 2.0: the first MIPS part (PIC32MZ2048EFM144,
  # MIPS32r2 M5150 core). Committed stock upstream NuttX fixtures (nsh with a
  # scripted `hello`, ostest), plus the unsupported-instruction audit of each
  # image.
  - id: curiosity-pic32mz-ef
    kind: sim-validate
    path: examples/curiosity-pic32mz-ef
    gate: true
  # EK-RA6M5: the first RA6M5 part. Builds the cortex-m-rt smoke for
  # thumbv8m.main (the RA6M5 is a Cortex-M33) and runs the SCI0/LED io-smoke
  # plus the unsupported-instruction audit through the CLI.
  - id: ek-ra6m5
    kind: sim-validate
    path: examples/ek-ra6m5
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # EK-RA8M1: the first RA8 part. Builds the cortex-m-rt smoke for
  # thumbv8m.main (Armv8-M Mainline code; the RA8M1's Cortex-M85 Helium/MVE
  # and low-overhead branches are not decoded) and runs the SCI9/LED
  # io-smoke plus the unsupported-instruction audit through the CLI.
  - id: ek-ra8m1
    kind: sim-validate
    path: examples/ek-ra8m1
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # SAM E70 Xplained: the first SAM E70 part. Builds the cortex-m-rt smoke for
  # thumbv7em (the SAM E70 is a Cortex-M7) and runs the USART1/LED io-smoke
  # plus the unsupported-instruction audit through the CLI.
  - id: sam-e70-xplained
    kind: sim-validate
    path: examples/sam-e70-xplained
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # Apollo4 Plus EVB: the first Ambiq part. Builds the cortex-m-rt smoke for
  # thumbv7em (the Apollo4 Plus is a Cortex-M4F) and runs the UART0/LED
  # io-smoke plus the unsupported-instruction audit through the CLI.
  - id: apollo4p-evb
    kind: sim-validate
    path: examples/apollo4p-evb
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # S32K388EVB-Q289: the first S32K3 part. Builds the cortex-m-rt smoke for
  # thumbv7em (CM7_0 is a Cortex-M7) and runs the LPUART2/SIUL2 io-smoke plus
  # the unsupported-instruction audit through the CLI.
  - id: s32k388-evb
    kind: sim-validate
    path: examples/s32k388-evb
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # MIMXRT595-EVK: the first i.MX RT500 part. Builds the cortex-m-rt smoke
  # for thumbv8m.main (Cortex-M33) and runs the FLEXCOMM0/GPIO io-smoke plus
  # the unsupported-instruction audit through the CLI.
  - id: mimxrt595-evk
    kind: sim-validate
    path: examples/mimxrt595-evk
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # NUCLEO-L552ZE-Q: the first STM32L5 part. Builds the cortex-m-rt smoke for
  # thumbv8m.main and runs the LPUART1/GPIO io-smoke plus the unsupported-
  # instruction audit through the CLI, so the chip is proven by a gate on
  # every PR that touches configs/ or examples/.
  - id: nucleo-l552ze-q
    kind: sim-validate
    path: examples/nucleo-l552ze-q
    rust_targets: [thumbv8m.main-none-eabi]
    gate: true
  # FRDM-K64F UART-only L1: builds the Cortex-M4F smoke and runs the UART0/RGB
  # LED io-smoke plus the unsupported-instruction audit through the CLI.
  - id: frdm-k64f
    kind: sim-validate
    path: examples/frdm-k64f
    rust_targets: [thumbv7em-none-eabi]
    gate: true
  # WCH CH32V003EVT: committed, digest-checked RV32E/EC firmware proves the
  # configured PC0-to-LED1 jumper and polled USART1 TX; no USB/debug claim.
  - id: wch-ch32v003evt
    kind: sim-validate
    path: examples/wch-ch32v003evt
    gate: true
  # WeAct BluePill Plus (CH32V203C8T6): committed, digest-checked RV32IMAC
  # template ELF; USART1 banner, PB2 LED rate and the PA0 KEY, with the
  # edge spacing measured by check-blink-rate.py. No USB/PLL claim.
  - id: weact-bluepill-plus-ch32v203
    kind: sim-validate
    path: examples/weact-bluepill-plus-ch32v203
    gate: true
