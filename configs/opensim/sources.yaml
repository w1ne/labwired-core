# Consumed by scripts/onboard_opensim_targets.py.
# Regeneration notes: docs/strategy/ingestion/opensim-report.md.
comment: 'Open-source simulator device facts for LabWired onboarding. Extracted 2026-10-18; names/geometry
  only (no upstream code). Consumed by scripts/onboard_opensim_targets.py. Regeneration notes: docs/strategy/ingestion/opensim-report.md.'
sources:
  simavr:
    repo: https://github.com/buserror/simavr
    commit: 5b08da60497f7564f50941f74a549fe2851db030
    license: GPL-3.0
    kind: core-model
    retrieved: '2026-10-18'
    method: flash/ram/eeprom parsed from vendored avr-libc device headers (FLASHEND/RAMSTART/RAMEND/E2END)
  mspsim:
    repo: https://github.com/contiki-ng/mspsim
    commit: c8169c98ad6696b0e2ad2e0f926a371499dacd8f
    license: BSD-3-Clause
    kind: chip-config
    retrieved: '2026-10-18'
    method: mainFlashConfig/ramConfig values from se/sics/mspsim/config/MSP430*Config.java
  gpsim:
    url: https://gpsim.sourceforge.net/
    license: GPL-2.0
    kind: processor-list
    retrieved: '2026-10-18'
    method: processor list from project site
    geometry: unavailable in list (parse gpsim device sources when a PIC core is onboarded)
  ucsim:
    url: https://sourceforge.net/projects/sdcc/
    license: GPL-2.0-or-later
    kind: generic-cores
    retrieved: '2026-10-18'
    method: instruction-set cores only; no fixed device geometry
  avr8js:
    repo: https://github.com/wokwi/avr8js
    commit: bee6f0a94e0e27786f6bc21aee3c775849fb50fd
    license: MIT
    kind: subset
    retrieved: '2026-10-18'
    method: AVR8 only (Arduino UNO class); covered by simavr entries
  rp2040js:
    repo: https://github.com/wokwi/rp2040js
    license: MIT
    kind: partial
    retrieved: '2026-10-18'
    method: RP2040 partial; LabWired already models RP2040 (configs/chips/rp2040.yaml)
