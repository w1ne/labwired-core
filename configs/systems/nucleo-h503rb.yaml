# NUCLEO-H503RB (MB1814) smoke profile. Only the active-high user LED LD2 on
# PA5 is attached; the button, VCP, USB, and other board connections are not
# part of this descriptor.
name: "nucleo-h503rb"
chip: "../chips/stm32h503rb-nucleo-smoke.yaml"
external_devices: []
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
