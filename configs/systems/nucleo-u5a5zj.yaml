# LabWired - NUCLEO-U5A5ZJ-Q board system (STM32U5A5ZJ).
# Board references: UM2861 (NUCLEO-U5A5ZJ-Q user manual), stm32u5xx-nucleo BSP
# (COM1 = USART1 PA9/PA10), Zephyr nucleo_u575zi_q board docs (LEDs).
name: "nucleo-u5a5zj"
chip: "../chips/stm32u5a5zj.yaml"
debug_uart: "usart1"
external_devices: []
board_io:
  - id: "led_ld1"
    kind: "led"
    peripheral: "gpioc"
    pin: 7
    signal: "output"
    active_high: true
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpiob"
    pin: 7
    signal: "output"
    active_high: true
  - id: "led_ld3"
    kind: "led"
    peripheral: "gpiog"
    pin: 2
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: true
