# ESP32-C5-DevKitC-1 v1.2, current N8R8 variant.
# The focused system profile exposes UART0 and direct GPIO27 output to its
# onboard addressable RGB LED. RMT, USB, PSRAM, radios, and the LP core remain
# outside this slice.
name: "esp32c5-devkitc"
chip: "../chips/esp32c5.yaml"
cpu_hz: 240_000_000
debug_uart: "uart0"
external_devices:
  - id: "rgb_led"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO27"
      num_pixels: 1
      cpu_hz: 240_000_000
