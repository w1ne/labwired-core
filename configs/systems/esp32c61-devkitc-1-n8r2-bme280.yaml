# ESP32-C61-DevKitC-1-N8R2 with a BME280 at 0x77 on the GPIO6/GPIO22 I2C0 route.
name: "esp32c61-devkitc-1-n8r2-bme280"
chip: "../chips/esp32c61.yaml"
cpu_hz: 160_000_000
debug_uart: "uart0"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    route:
      sda: "GPIO6"
      scl: "GPIO22"
    config:
      i2c_address: 0x77
  - id: "rgb_led"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO8"
      num_pixels: 1
      cpu_hz: 160000000
board_io: []
