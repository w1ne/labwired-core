# ESP32-S3-DevKitC-1 v1.1 / N16R8 with an Adafruit BME280 STEMMA QT breakout.
# Only UART0 and I2C0 are claimed. The breakout is attached to GPIO8/GPIO9.
name: "esp32s3-devkitc-1-n16r8-bme280"
chip: "../chips/esp32s3.yaml"
cpu_hz: 240_000_000
debug_uart: "uart0"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    route:
      sda: "GPIO8"
      scl: "GPIO9"
    config:
      i2c_address: 0x77
board_io: []
