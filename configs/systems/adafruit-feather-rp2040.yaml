# Adafruit Feather RP2040 (product 4884), narrowed to its modeled D13 LED path.
# Adafruit board guide / Zephyr board DTS: D13 is GP13 and the red LED is active high.
name: "adafruit-feather-rp2040"
chip: "../chips/rp2040-feather-smoke.yaml"
external_devices: []
board_io:
  - id: "led_d13"
    kind: "led"
    peripheral: "sio"
    pin: 13
    signal: "output"
    active_high: true
