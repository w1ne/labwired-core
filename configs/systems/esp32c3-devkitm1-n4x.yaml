# Espressif ESP32-C3-DevKitM-1-N4X smoke profile.
# GPIO8 (header J3 pin 6) drives the board's addressable RGB LED (schematic
# reference D6, SK68XXMINI-HS). UART, USB, radios, and other peripherals are
# intentionally omitted from this board-level slice.
name: "esp32c3-devkitm1-n4x"
chip: "../chips/esp32c3-devkitm1-n4x-smoke.yaml"
cpu_hz: 160_000_000
external_devices:
  - id: "rgb_led"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO8"
      num_pixels: 1
      cpu_hz: 160_000_000
