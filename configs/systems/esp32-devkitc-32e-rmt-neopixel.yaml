# ESP32-DevKitC-32E classic RMT TX smoke with one external WS2812 pixel.
name: "esp32-devkitc-32e-rmt-neopixel"
chip: "../chips/esp32-devkitc-32e-gpio-smoke.yaml"
cpu_hz: 240000000
debug_uart: "uart0"
external_devices:
  - id: "rgb_led"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO23"
      num_pixels: 1
      cpu_hz: 240000000
