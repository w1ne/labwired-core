# LabWired - NUCLEO-F303RE system manifest
#
# Board wiring per ST UM1724 / MB1136: LD2 on PA5 and USART2 PA2/PA3 on the
# on-board ST-LINK/V2-1 Virtual COM Port. This profile claims only the paths
# exercised by its smoke.
name: nucleo-f303re
chip: "../chips/stm32f303re-nucleo-smoke.yaml"
debug_uart: usart2
external_devices: []
board_io:
  - id: led_ld2
    kind: led
    peripheral: gpioa
    pin: 5
    signal: output
    active_high: true
