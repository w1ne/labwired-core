# NUCLEO-F411RE plus the Adafruit BME280 STEMMA QT breakout (PID 2652).
# STM32duino Wire defaults to Arduino D14/D15 (PB9/SDA, PB8/SCL), on I2C1.
name: "nucleo-f411re-bme280"
chip: "../chips/stm32f411re-nucleo-bme280-smoke.yaml"
debug_uart: "usart2"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c1"
    config:
      i2c_address: 0x77
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
