# Arduino UNO R4 WiFi with an Adafruit BME280 breakout on its 3.3 V Qwiic
# connector. The board maps Qwiic SDA=P401 and SCL=P400 to RA4M1 IIC0 (Wire1).
name: "arduino-uno-r4-wifi-qwiic-bme280"
chip: "../chips/r7fa4m1ab-uno-r4-wifi-smoke.yaml"
debug_uart: "sci9"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "iic0"
    config:
      i2c_address: 0x77
board_io:
  - id: "led_d13"
    kind: "led"
    peripheral: "port1"
    pin: 2
    signal: "output"
    active_high: true
connectors:
  - type: "uart"
    peripheral: "sci9"
    endpoint: "host_console"
