# ESP32-P4X-Function-EV-Board plus an external BME280 on the I2C0 model bus.
# The sensor is attached at the controller boundary; this profile does not
# claim a GPIO-matrix or physical J1 SDA/SCL route.
# The second HP core, LP core, C6 companion module, boot ROM, and the board's
# multimedia/communications peripherals are not represented in this system.
name: "esp32p4x-function-ev-board"
chip: "../chips/esp32p4.yaml"
cpu_hz: 400_000_000
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    config:
      i2c_address: 0x77
