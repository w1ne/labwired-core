# Espressif ESP32-S3-DevKitC-1 v1.1, using an ESP32-S3-WROOM-1-N16R8.
# The supported board profile is limited to the onboard USB-to-UART bridge:
# J3 TX/RX map to GPIO43/U0TXD and GPIO44/U0RXD. The RGB LED, PSRAM, USB-OTG,
# Wi-Fi/Bluetooth and buttons are not represented by this smoke profile.
name: "esp32s3-devkitc-1-v1.1"
chip: "../chips/esp32s3.yaml"
external_devices: []

connectors:
  - type: "uart"
    peripheral: "uart0"
    endpoint: "host_console"
