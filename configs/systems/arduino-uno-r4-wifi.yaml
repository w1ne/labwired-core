# Arduino UNO R4 WiFi (ABX00087), narrowed to the RA4M1 paths exercised by
# examples/arduino-uno-r4-wifi. The ESP32-S3 module, LED matrix, USBFS, and
# Qwiic connector are not part of this simulator profile.
name: "arduino-uno-r4-wifi"
chip: "../chips/r7fa4m1ab-uno-r4-wifi-smoke.yaml"
debug_uart: "sci2"
external_devices: []
board_io:
  - id: "led_d13"
    kind: "led"
    peripheral: "port1"
    pin: 2 # RA4M1 P102 / Arduino D13 / LED_BUILTIN
    signal: "output"
    active_high: true
connectors:
  - type: "uart"
    peripheral: "sci2"
    endpoint: "host_console"
