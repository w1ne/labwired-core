# STM32F103C8T6 Blue Pill with an Adafruit BME280 STEMMA QT breakout.
# The breakout uses the default 0x77 address and attaches to I2C1 on PB6/PB7.
name: "stm32f103c8-bluepill-bme280"
chip: "../chips/stm32f103c8-bluepill-bme280-smoke.yaml"
debug_uart: "uart1"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c1"
    config:
      i2c_address: 0x77
board_io:
  - id: "led_pc13"
    kind: "led"
    peripheral: "gpioc"
    pin: 13
    signal: "output"
    active_high: false
