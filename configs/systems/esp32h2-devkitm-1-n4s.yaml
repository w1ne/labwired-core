# Narrow profile for the buyable ESP32-H2-DevKitM-1-N4S.
# Espressif's board guide identifies GPIO8 as the onboard addressable RGB LED
# data pin. Only that GPIO-to-WS2812 path is represented here; USB, UART bridge,
# boot/reset buttons, BLE, Thread, Zigbee, and board power are omitted.
name: "esp32h2-devkitm-1-n4s"
chip: "../chips/esp32h2-devkitm-1-n4s-smoke.yaml"
cpu_hz: 96_000_000
external_devices:
  - id: "rgb_led"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO8"
      num_pixels: 1
      cpu_hz: 96_000_000
