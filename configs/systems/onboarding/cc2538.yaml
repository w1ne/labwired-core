# Imported Renode CC2538 platform, backed by the modelled CC2538SF53 execution
# profile. The generated onboarding chip descriptor had the wrong flash and
# RAM map and zero-answering peripherals, so it is intentionally not referenced.
name: cc2538
chip: ../../chips/cc2538sf53.yaml
cpu_hz: 16_000_000
external_devices: []
