# Exact imported board system, bounded to the narrowed chip profile (real
# SIUL2 and LPUART2 models; SWT_0 and MC_ME write-accepting stubs). PTF23 is
# the green LED as in configs/systems/s32k388-evb.yaml.
name: nxp-s32k388evb
chip: ../../chips/onboarding/nxp-s32k388evb.yaml
debug_uart: "lpuart2"
external_devices: []
board_io:
  - id: "led1_green"
    kind: "led"
    peripheral: "siul2"
    pin: 183
    signal: "output"
    active_high: true
