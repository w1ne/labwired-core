    kind: led
    peripheral: gpioc
    pin: 7
    signal: output
    active_high: true
  - id: led_ld2
    kind: led
    peripheral: gpiob
    pin: 7
    signal: output
    active_high: true
  - id: led_ld3
    kind: led
    peripheral: gpioa
    pin: 9
    signal: output
    active_high: true
