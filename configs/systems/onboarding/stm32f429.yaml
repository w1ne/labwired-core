name: stm32f429
chip: ../../chips/onboarding/stm32f429.yaml
# Test-fixture input: a potentiometer drives ADC1_IN1 on PA1; it is not a
# component declared on the imported Renode board.
external_devices:
  - id: pot_adc1_in1
    type: potentiometer
    connection: adc
    config:
      channel: 1
  - id: pot_adc1_in2
    type: potentiometer
    connection: adc
    config:
      channel: 2
  - id: tc_spi1
    type: max31855
    connection: spi1
    config:
      cs_pin: PA4
  # External smoke fixture on I2C1; not a component declared on the imported
  # Discovery board.
  - id: bme280
    type: bme280
    connection: i2c1
    config:
      i2c_address: 0x76
