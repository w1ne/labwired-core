name: "stm32f401cdu6-blackpill"
chip: "../../chips/onboarding/stm32f401cdu6-blackpill.yaml"
external_devices:
  - id: tc_spi1
    type: max31855
    connection: spi1
    config:
      cs_pin: PA4
  - id: tmp102_i2c1
    type: tmp102
    connection: i2c1
    config:
      i2c_address: 0x48
  - id: tmp102_i2c2
    type: tmp102
    connection: i2c2
    config:
      i2c_address: 0x49
board_io:
  - id: "led_pc13"
    kind: "led"
    peripheral: "gpioc"
    pin: 13
    signal: "output"
    active_high: false
  - id: "button_user_pa0"
    kind: "button"
    peripheral: "gpioa"
    pin: 0
    signal: "input"
    active_high: true
