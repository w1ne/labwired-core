name: stm32l151
chip: ../../chips/onboarding/stm32l151.yaml
# Smoke fixture inputs, not a board: Renode's stm32l151.repl is a bare CPU
# platform. Two switches to ground on PH1 and PC13 (pressed = low, against
# the GPIO pull-up) give the EXTI port mux real pad edges to route. A
# MAX31855 on each SPI (CS on PA4 / PB12 / PA15; the smoke scenario sets
# their thermocouples to 25 / 100 / -25 °C, so every bus has its own frame),
# a second MAX31855 on SPI1 behind its own CS on PB0 (set to 50 °C) and a
# TMP102 on I2C1 give the serial blocks real slaves. The two SPI1 slaves are
# told apart only by the GPIO chip-select edges the engine routes to them.
external_devices:
  - id: "tc_spi1"
    type: "max31855"
    connection: "spi1"
    config:
      cs_pin: "PA4"
  - id: "tc_spi1b"
    type: "max31855"
    connection: "spi1"
    config:
      cs_pin: "PB0"
  - id: "tc_spi2"
    type: "max31855"
    connection: "spi2"
    config:
      cs_pin: "PB12"
  - id: "tc_spi3"
    type: "max31855"
    connection: "spi3"
    config:
      cs_pin: "PA15"
  - id: "tmp102"
    type: "tmp102"
    connection: "i2c1"
    config:
      i2c_address: 0x48
board_io:
  - id: "sw_ph1"
    kind: "button"
    peripheral: "gpioh"
    pin: 1
    signal: "input"
    active_high: false
  - id: "sw_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
