name: simavr-atmega2560
chip: ../../chips/onboarding/simavr-atmega2560.yaml
cpu_hz: 16000000
external_devices:
  - id: pot_a8
    type: potentiometer
    connection: adc
    config:
      channel: 8
      supply_mv: 5000
  - id: pot_a9
    type: potentiometer
    connection: adc
    config:
      channel: 9
      supply_mv: 5000
board_io:
  - id: status_led
    kind: led
    peripheral: portb
    pin: 7
    signal: output
    active_high: true
