# Renode imported SAM E70 system, using the narrowed execution profile in
# configs/chips/onboarding/sam_e70.yaml. The tested scope is PMC, PIOC, and
# USART1; unmodeled system blocks are not included in that chip profile.
name: sam_e70
chip: ../../chips/onboarding/sam_e70.yaml
cpu_hz: 12000000
debug_uart: usart1
external_devices: []
