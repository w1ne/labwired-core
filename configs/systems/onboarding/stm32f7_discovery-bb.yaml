name: stm32f7_discovery-bb
chip: ../../chips/onboarding/stm32f7_discovery-bb.yaml
# Test fixtures only: potentiometers drive ADC1_IN1/PA1 and ADC1_IN2/PA2;
# they are not on-board components.
external_devices:
  - id: pot_adc1_in1
    type: potentiometer
    connection: adc
    config:
      channel: 1
  - id: pot_adc1_in2
    type: potentiometer
    connection: adc
    config:
      channel: 2
# 32F746GDISCOVERY board IO (UM1907 §6.5/§6.6). LD1 (green) is on PI1, active
# high. B1 USER connects PI11 to VDD when pressed (active high).
board_io:
  - id: "ld1"
    kind: "led"
    peripheral: "gpioi"
    pin: 1
    signal: "output"
    active_high: true
  - id: "b1"
    kind: "button"
    peripheral: "gpioi"
    pin: 11
    signal: "input"
    active_high: true
