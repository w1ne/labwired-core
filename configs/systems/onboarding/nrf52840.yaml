name: nrf52840
chip: ../../chips/onboarding/nrf52840.yaml
external_devices:
  # A mid-position potentiometer drives physical SAADC input AIN3 (P0.05).
  - id: pot_saadc_ain3
    type: potentiometer
    connection: saadc
    config:
      channel: 3
