name: stm32f777
chip: ../../chips/onboarding/stm32f777.yaml
# Smoke fixture inputs, not a board: Renode's stm32f777.repl is a bare CPU
# platform. Two switches to ground on PK3 and PC13 (pressed = low, against
# the GPIO pull-up) give the EXTI port mux real pad edges to route. A
# MAX31855 on each SPI (CS on PA4 / PB12 / PD2 / PE4 / PF6 / PG8; the smoke
# scenario sets SPI2..6 to 100, 75, 60, 125 and 200 °C), a second MAX31855
# on SPI1 behind its own CS on PB0 (50 °C) and a TMP102 on I2C1 give the
# serial blocks real slaves.
external_devices:
  - id: "tc_spi1"
    type: "max31855"
    connection: "spi1"
    config:
      cs_pin: "PA4"
  - id: "tc_spi1b"
    type: "max31855"
    connection: "spi1"
    config:
      cs_pin: "PB0"
  - id: "tc_spi2"
    type: "max31855"
    connection: "spi2"
    config:
      cs_pin: "PB12"
  - id: "tc_spi3"
    type: "max31855"
    connection: "spi3"
    config:
      cs_pin: "PD2"
  - id: "tc_spi4"
    type: "max31855"
    connection: "spi4"
    config:
      cs_pin: "PE4"
  - id: "tc_spi5"
    type: "max31855"
    connection: "spi5"
    config:
      cs_pin: "PF6"
  - id: "tc_spi6"
    type: "max31855"
    connection: "spi6"
    config:
      cs_pin: "PG8"
  - id: "tmp102"
    type: "tmp102"
    connection: "i2c1"
    config:
      i2c_address: 0x48
board_io:
  - id: "sw_pk3"
    kind: "button"
    peripheral: "gpiok"
    pin: 3
    signal: "input"
    active_high: false
  - id: "sw_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
