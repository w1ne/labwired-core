# STM32F103C8T6 Blue Pill with a BME280 breakout on I2C1's default PB6/PB7 pins.
# This narrow profile declares only the UART1 console, PC13 user LED and I2C1.
name: "stm32f103-blue-pill-bme280"
chip: "../chips/stm32f103c8-bluepill-bme280-smoke.yaml"
debug_uart: "uart1"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c1"
    config:
      i2c_address: 0x77
board_io:
  - id: "led_user"
    kind: "led"
    peripheral: "gpioc"
    pin: 13
    signal: "output"
    active_high: false
