# STM32F103C8T6 Blue Pill with a BME280 breakout on I2C1's default PB6/PB7 pins.
# Same chip model and reset-HSI clock as stm32f103-blue-pill.yaml; the only
# addition is the sensor on I2C1.
name: "stm32f103-blue-pill-bme280"
chip: "../chips/stm32f103.yaml"
cpu_hz: 8_000_000
debug_uart: "uart1"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c1"
    config:
      i2c_address: 0x77
board_io:
  - id: "led_user"
    kind: "led"
    peripheral: "gpioc"
    pin: 13
    signal: "output"
    active_high: false
