# Adafruit Metro M4 Express (SAMD51J19A). SIM-DERIVED — not silicon-verified.
# Bench silicon may be ItsyBitsy M4 (SAMD51G19A); Playground pinout is Metro M4.
# This focused profile keeps the reset DFLL48M clock at 48 MHz, models Serial1
# on PA22/PA23 and D13 on PA16, and omits QSPI, native USB, NeoPixel, and unused
# MCU peripherals (including the higher-speed DPLL clock path).

name: "metro-m4"
chip: "../chips/atsamd51-metro-m4-smoke.yaml"
external_devices: []
board_io:
  - id: "led_d13"
    kind: "led"
    peripheral: "porta"
    pin: 16   # PA16 — Adafruit variants/metro_m4/variant.cpp D13
    signal: "output"
    active_high: true
connectors:
  - type: "uart"
    peripheral: "sercom3"
    endpoint: "host_console"
