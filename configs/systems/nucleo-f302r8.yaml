# NUCLEO-F302R8 / MB1136 board connections per ST UM1724.
# The focused profile models LD2 on PA5 and USART2 PA2/PA3 on the default
# ST-LINK/V2-1 Virtual COM Port. Other board and MCU peripherals are outside
# this smoke's declared scope.
name: nucleo-f302r8
chip: ../chips/stm32f302r8-nucleo-smoke.yaml
debug_uart: usart2
external_devices: []
board_io:
  - id: led_ld2
    kind: led
    peripheral: gpioa
    pin: 5
    signal: output
    active_high: true
