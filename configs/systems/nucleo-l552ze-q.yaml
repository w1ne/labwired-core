# LabWired - NUCLEO-L552ZE-Q system manifest
#
# Board pinout per UM2623 (STM32 Nucleo-144 user manual) and Zephyr
# `nucleo_l552ze_q`:
#   LD1 (green)  PC7  active high
#   LD2 (blue)   PB7  active high
#   LD3 (red)    PA9  active high
#   B1  (user)   PC13 active high
#   VCP console  LPUART1 PG7 (TX) / PG8 (RX), AF8
#   second UART  USART3 PD8 (TX) / PD9 (RX), AF7
#
# The on-board ST-LINK/V3E exposes LPUART1 as the Virtual COM Port; USART3 is
# available on the morpho/Arduino headers. Only LPUART1 is the console here.

name: "nucleo-l552ze-q"
chip: "../chips/stm32l552.yaml"
# STM32L5 reset clock: MSI range 6 = 4 MHz. The smoke firmware never configures
# the PLL, so the core runs at the MSI reset rate — NOT the part's 110 MHz
# maximum. The browser's RealtimeGovernor paces to this value (a ceiling only).
cpu_hz: 4_000_000
external_devices: []
board_io:
  - id: "led_ld1"
    kind: "led"
    peripheral: "gpioc"
    pin: 7
    signal: "output"
    active_high: true
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpiob"
    pin: 7
    signal: "output"
    active_high: true
  - id: "led_ld3"
    kind: "led"
    peripheral: "gpioa"
    pin: 9
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: true
