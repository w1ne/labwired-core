# NUCLEO-H533RE (MB1814) smoke profile. Only its active-high user LED LD2 on
# PA5 is attached. Button, VCP, USB, TrustZone, and other H533 features are not
# part of this descriptor.
name: "nucleo-h533re"
chip: "../chips/stm32h533re-nucleo-gpio-smoke.yaml"
external_devices: []
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
