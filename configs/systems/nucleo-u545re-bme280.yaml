# NUCLEO-U545RE-Q plus Adafruit BME280 STEMMA QT breakout on Arduino I2C1.
# Board pins: PB6/SCL (D15), PB7/SDA (D14); VCP remains USART1 PA9/PA10.
name: "nucleo-u545re-bme280"
chip: "../chips/stm32u545.yaml"
cpu_hz: 160_000_000
debug_uart: "usart1"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c1"
    config:
      i2c_address: 0x77
board_io:
  - id: "led_green_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_user_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: true
