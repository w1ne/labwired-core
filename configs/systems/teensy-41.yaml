#
# Focused Teensy 4.1 profile: onboard D13 LED through GPIO2_IO03.
# This profile omits Serial1 because IOMUXC alternate-function routing is not
# modeled; it also omits USB, Ethernet, SD, FlexSPI/XIP, and other peripherals.

name: "teensy-41"
chip: "../chips/mimxrt1062-teensy41-gpio-smoke.yaml"
external_devices: []
board_io:
  - id: "led_d13"
    kind: "led"
    peripheral: "gpio2"
    pin: 3   # GPIO2_IO03 — PJRC Teensy 4.1 pin 13 / LED_BUILTIN
    signal: "output"
    active_high: true
