# Adafruit PyBadge (SAMD51J19A) board wiring.
#
# Pin assignments are from Microsoft's MIT-licensed uf2-samdx1
# boards/arcade_pybadge/board_config.h CF2 table.  This manifest deliberately
# attaches only devices whose transport is modelled end-to-end today.
name: "pybadge"
chip: "../chips/atsamd51-pybadge.yaml"

external_devices:
  # Eight physical buttons behind the on-board SN74HC165, not direct GPIOs.
  - id: "buttons"
    type: "pybadge_buttons"
    connection: "gpio"
    config:
      latch_pin: "PB0"
      clock_pin: "PB31"
      data_pin: "PB30"

  # Five on-board NeoPixels, BOARD_NEOPIXEL_PIN / PIN_NEOPIXEL = PA15.
  - id: "neopixels"
    type: "neopixel"
    connection: "porta"
    config:
      data_pin: "PA15"
      num_pixels: 5
      cpu_hz: 120000000

board_io:
  # Red status LED, active high (CF2 PIN_LED = D13 = PA23).
  - id: "led_d13"
    kind: "led"
    peripheral: "porta"
    pin: 23
    signal: "output"
    active_high: true

connectors:
  # Feather UART: SERCOM1, TX=PA16/PAD0 and RX=PA17/PAD1.
  - type: "uart"
    peripheral: "sercom1"
    endpoint: "host_console"

# Honest boundary:
# * SERCOM4 has a blocking byte-level SPI slice (PB15 MOSI, PB13 SCK), but
#   the ST7735 panel and DMA-backed native firmware path are not attached yet;
# * buttons support GPIO scanning, but do not imply working native display/UI;
# * QSPI flash and native USB remain stub register windows in the chip model.
