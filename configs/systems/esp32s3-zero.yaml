# Waveshare ESP32-S3-Zero, FH4R2 option (4 MiB flash / 2 MiB PSRAM).
# The onboard WS2812 DIN is GPIO21; Waveshare's wiki and schematic both
# identify GPIO21 (not GPIO48). PSRAM, USB, Wi-Fi and BLE are outside this
# smoke profile.
name: "esp32s3-zero"
chip: "../chips/esp32s3-zero.yaml"
debug_uart: "uart0"
external_devices:
  - id: "status_neopixel"
    type: "neopixel"
    connection: "gpio"
    config:
      data_pin: "GPIO21"
      num_pixels: 1
      cpu_hz: 240000000
board_io: []
