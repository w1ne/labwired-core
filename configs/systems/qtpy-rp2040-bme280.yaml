# Adafruit QT Py RP2040 + Adafruit BME280 STEMMA QT breakout (product 2652).
# The QT port is I2C1 on GP22 (SDA) / GP23 (SCL); UART1 TX is available on
# the board TX pad, GP20. The physical USB-C host/CDC path and the onboard
# addressable NeoPixel are not attached in this system profile.
name: "qtpy-rp2040-bme280"
chip: "../chips/rp2040.yaml"
cpu_hz: 125_000_000
debug_uart: "uart1"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c1"
    route:
      sda: "GP22"
      scl: "GP23"
    config:
      i2c_address: 0x77
board_io: []
