# STM32F7 Discovery (32F746GDISCOVERY / STM32F746NG).
# SIM-DERIVED — not silicon-verified. LED LD1 on PI1; ST-LINK VCP = USART1.

name: "stm32f7-discovery"
chip: "../chips/stm32f746.yaml"
external_devices: []
board_io:
  - id: "led_ld1"
    kind: "led"
    peripheral: "gpioi"
    pin: 1   # PI1 — green user LED
    signal: "output"
    active_high: true
connectors:
  - type: "uart"
    peripheral: "usart1"
    endpoint: "host_console"
