# Raspberry Pi Pico 2 board profile backed by the RP2350 descriptor.
# The smoke covers the modeled SIO output for the onboard user LED on GP25
# and the UART0 data-register path. USB boot/CDC, PADS_BANK0 electrical
# behavior, Wi-Fi, and Bluetooth are not claimed by this system.
name: "pico2"
chip: "../chips/rp2350-pico2-smoke.yaml"
external_devices: []
board_io:
  - id: "led_gp25"
    kind: "led"
    peripheral: "sio"
    pin: 25
    signal: "output"
    active_high: true
