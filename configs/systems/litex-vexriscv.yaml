# LabWired - LiteX VexRiscv SoC system manifest
#
# The SoC's console is the LiteX UART at 0x60001800 (see the chip descriptor
# for the CSR map and its sources). The chip models the Zephyr board's
# GPIOOut/GPIOIn CSRs, but which board LEDs, switches or buttons the gateware
# wires to them is not documented for this SoC, so no board_io bindings are
# declared. See examples/litex-vexriscv/
# EXTERNAL_COMPONENTS.md for what a LiteX board carries beyond this SoC.
name: "litex-vexriscv"
chip: "../chips/litex-vexriscv.yaml"
debug_uart: "uart"
external_devices: []
board_io: []
