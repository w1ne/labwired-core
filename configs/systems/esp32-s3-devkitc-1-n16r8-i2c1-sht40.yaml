# ESP32-S3-DevKitC-1 v1.1 N16R8 with an SHT40 on I2C1.
name: "esp32-s3-devkitc-1-n16r8-i2c1-sht40"
chip: "../chips/esp32s3-devkitc-1-n16r8-smoke.yaml"
cpu_hz: 240000000
debug_uart: "uart0"
external_devices:
  - id: "sht40"
    type: "sht40"
    connection: "i2c1"
    route:
      sda: "GPIO41"
      scl: "GPIO42"
    config:
      i2c_address: 0x44
