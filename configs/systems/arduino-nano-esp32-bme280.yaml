# Arduino Nano ESP32 (ABX00092/ABX00083) with an Adafruit BME280 STEMMA QT.
# The board routes A4/SDA to GPIO11 and A5/SCL to GPIO12 per Arduino's pinout.
name: "arduino-nano-esp32-bme280"
chip: "../chips/esp32s3.yaml"
cpu_hz: 240_000_000
debug_uart: "uart0"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    route:
      sda: "GPIO11"
      scl: "GPIO12"
    config:
      i2c_address: 0x77
board_io: []
