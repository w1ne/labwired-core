# LabWired - NUCLEO-F103RB system manifest
#
# Board wiring per ST UM1724: LD2 (green user LED) on PA5, active high;
# B1 (USER button) on PC13; and USART2 PA2/PA3 connected to the default
# ST-LINK/V2-1 virtual COM port through SB13/SB14.

name: "nucleo-f103rb"
chip: "../chips/stm32f103rb.yaml"
external_devices: []
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
