# LabWired - STM32F411CEU6 Black Pill System Configuration
#
# Board IO sourced from WeAct's MiniSTM32F4x1 product literature and the
# V3.0 schematic. The user LED is PC13 and active-low. The KEY pad is PA0, but
# its pressed logic is not declared until the exact board switch net is tested.
name: "stm32f411ceu6-blackpill"
chip: "../chips/stm32f411ceu6.yaml"
external_devices: []
board_io:
  - id: "led_pc13"
    kind: "led"
    peripheral: "gpioc"
    pin: 13
    signal: "output"
    active_high: false
