# LabWired - STM32F411CEU6 Black Pill System Configuration
#
# UNVERIFIED BOARD PINOUT: the LED/button bindings below are carried over from
# the F401 Black Pill (LED PC13 active-low, user button PA0 active-high). No
# chip-level source can settle a board-level fact — nobody has had a WeAct F411
# Black Pill in hand for this onboarding. See examples/stm32f411ceu6-blackpill/
# VALIDATION.md before trusting these for anything physical.
name: "stm32f411ceu6-blackpill"
chip: "../chips/stm32f411ceu6.yaml"
external_devices: []
board_io:
  - id: "led_pc13"
    kind: "led"
    peripheral: "gpioc"
    pin: 13
    signal: "output"
    active_high: false
  - id: "button_user_pa0"
    kind: "button"
    peripheral: "gpioa"
    pin: 0
    signal: "input"
    active_high: true
