# ST NUCLEO-G491RE (MB1367) board wiring, based on ST UM2505.
# LD2 user LED: PA5, active high. B1 user button: PC13, active low by default.
# Board scope is deliberately limited to GPIO board I/O; USB, ST-LINK, external
# oscillators, analog measurement, and other MCU peripherals are not modelled.
name: "nucleo-g491re"
chip: "../chips/stm32g491re.yaml"
cpu_hz: 170_000_000
external_devices: []
board_io:
  - id: "led_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
