# ESP8684-DevKitM-1-H4X board smoke profile with a potentiometer test input.
# The board has a discrete RGB LED; the potentiometer is an external fixture
# wired to GPIO2 / ADC1_CH2.
name: "esp8684-devkitm-1-h4x"
chip: "../chips/esp8684-devkitm-1-h4x-smoke.yaml"
cpu_hz: 120_000_000
external_devices:
  - id: "pot"
    type: "potentiometer"
    connection: "apb_saradc"
    config:
      channel: 2
board_io:
  - id: "rgb_red"
    kind: "led"
    peripheral: "gpio"
    pin: 0
    signal: "output"
    active_high: false
  - id: "rgb_green"
    kind: "led"
    peripheral: "gpio"
    pin: 1
    signal: "output"
    active_high: false
  - id: "rgb_blue"
    kind: "led"
    peripheral: "gpio"
    pin: 8
    signal: "output"
    active_high: false
  - id: "pot"
    kind: "adc_input"
    peripheral: "apb_saradc"
    pin: 2
    signal: "input"
    active_high: true
    device_type: "potentiometer"
