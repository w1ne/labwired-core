# Seeed Studio XIAO ESP32S3 (ESP32-S3R8, 8 MB flash, 8 MB octal PSRAM).
# Pin and LED wiring: Seeed Studio XIAO ESP32S3 Getting Started guide and the
# Arduino-ESP32 XIAO_ESP32S3 variant (LED_BUILTIN = GPIO21, active low).
# The profile claims the user LED and BOOT input only; it does not model the
# PSRAM, radio, camera/SD expansion, battery charger, or power.
name: "seeed-xiao-esp32s3"
chip: "../chips/esp32s3.yaml"
external_devices: []
board_io:
  - id: "user_led"
    kind: "led"
    peripheral: "gpio"
    pin: 21
    signal: "output"
    active_high: false
  - id: "button_boot"
    kind: "button"
    peripheral: "gpio"
    pin: 0
    signal: "input"
    active_high: false
