# Arduino Nano 33 BLE Rev2 (nRF52840 @ 64 MHz) with an Adafruit BME280
# breakout. The breakout's default address is 0x77 and it carries its own I2C
# pull-ups. SDA / SCL connect to A4 / A5 (P0.31 / P0.02), the variant's Wire
# pins. Mbed OS drives them with the TWI0 master (byte registers, ENABLE = 5).
# `Serial` is the native USB port as a CDC serial device; the scripted host
# enumerates it and opens the port as a terminal does.
#
# The sketch is linked for the board's resident bootloader, which is not
# modelled: reset enters the application's vector table at 0x10000, and UARTE0
# starts as the bootloader leaves it (enabled, receiver running).
# This digital system attaches the sensor model to TWI0. It does not model
# the pull-up voltage or the conversion time. The on-board BMI270, BMM150 and
# the radio's BLE stack are not attached.
name: arduino-nano-33-ble-bme280
chip: ../chips/nrf52840.yaml
memory_overrides:
  reset_vector_offset: "0x10000"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    config:
      i2c_address: 0x77
peripherals:
  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    config:
      bootloader_rx_running: true
  - id: "usbd"
    type: "nrf52840_usbd"
    base_address: 0x40027000
    config:
      host: true
board_io:
  - id: "status_led"
    kind: "led"
    peripheral: "gpio0"
    pin: 13         # P0.13 / Arduino D13 / LED_BUILTIN
    signal: "output"
    active_high: true
