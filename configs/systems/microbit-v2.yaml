# LabWired - micro:bit v2 (Nordic nRF52833) System Configuration
#
# Board: BBC micro:bit v2 — target MCU nRF52833, interface MCU (KL27 / DAPLink)
# bridged UART, 5x5 LED matrix, buttons A/B.
#
# Sources:
#   * micro:bit v2 hardware documentation (tech.microbit.org/hardware/2-0-revision)
#     and the nRF52833 pin map at tech.microbit.org/hardware/schematic/:
#     UART_INT_RX = P0.06 (target TX), UART_INT_TX = P1.08 (target RX).
#     The schematic's UART_* labels are from the INTERFACE MCU's perspective;
#     codal-microbit-v2 sets MICROBIT_PIN_UART_TX = P0.06.
#   * Buttons: P0.14 = BTN_A, P0.23 = BTN_B (same page), both active-low.
#
# The 5x5 LED matrix is a row/column multiplexed `led-matrix-mux` external device
# (no one pin is an LED, so it is not a board_io `led`). Wiring from
# codal-microbit-v2 model/MicroBitIO.cpp: ROW1..5 = P0.21, P0.22, P0.15,
# P0.24, P0.19 (driven high); COL1..5 = P0.28, P0.11, P0.31, P1.05, P0.30
# (sunk low). model/MicroBit.cpp's ledMatrixPositions is the identity
# (row = y, column = x). CODAL drives the columns through GPIOTE Task mode and
# PPI (NRF52LedMatrix.cpp), so the model reads the pad levels GPIOTE drives.
name: "microbit-v2"
chip: "../chips/nrf52833.yaml"
external_devices:
  # Selected LSM303AGR-equipped v2 variant, not the alternate FXOS8700 board.
  # Separate fixed 7-bit addresses on the internal TWIM0 bus. The shared
  # open-drain sensor interrupt P0.25 is not connected by this bounded model.
  - id: "accelerometer"
    type: "lsm303agr_accel"
    connection: "i2c0"
  - id: "magnetometer"
    type: "lsm303agr_mag"
    connection: "i2c0"
  - id: "led_matrix"
    type: "led-matrix-mux"
    connection: "gpio0"
    config:
      row_pins: ["P0.21", "P0.22", "P0.15", "P0.24", "P0.19"]
      col_pins: ["P0.28", "P0.11", "P0.31", "P1.05", "P0.30"]
      row_active_high: true
      col_active_high: false
      cpu_hz: 64000000
board_io:
  # Buttons — active-low with internal pull-ups (pressed = 0).
  - id: "button_a"
    kind: "button"
    peripheral: "gpio0"
    pin: 14
    signal: "input"
    active_high: false
  - id: "button_b"
    kind: "button"
    peripheral: "gpio0"
    pin: 23
    signal: "input"
    active_high: false
connectors:
  - type: "uart"
    peripheral: "uart0"
    endpoint: "host_console"
