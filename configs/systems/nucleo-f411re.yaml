# ST UM1724 Nucleo-64 board signals (NUCLEO-F411RE).
# LD2 green LED on PA5 (Arduino D13); USART2 TX PA2 / RX PA3 to the ST-LINK
# virtual COM port (stm32duino variant_NUCLEO_F411RE.h).
name: "nucleo-f411re"
chip: "../chips/stm32f411re.yaml"
external_devices: []
board_io:
  - { id: "ld2_pa5", kind: "led", peripheral: "gpioa", pin: 5, signal: "output", active_high: true }
