# ESP32-S3-DevKitC-1-N8R8 plus an Adafruit BME280 STEMMA QT breakout.
# This profile claims only the GPIO-matrix I2C0 route, BME280, and UART0 console
# exercised by the local smoke. PSRAM, USB, and radio behavior are not claimed.
name: "esp32-s3-devkitc-1-n8r8-bme280"
chip: "../chips/esp32s3-devkitc-1-n8r8-smoke.yaml"
cpu_hz: 240_000_000
debug_uart: "uart0"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    route:
      sda: "GPIO8"
      scl: "GPIO9"
    config:
      i2c_address: 0x77
