# Narrow board profile for the ESP32-S3-DevKitC-1-N16R8 UART0 smoke.
# Espressif's N16R8 guide maps J3 TX/RX to U0TXD/GPIO43 and U0RXD/GPIO44.
# Only UART0 is exercised. The USB-to-UART bridge, native USB, PSRAM, radio,
# buttons and LEDs are not modeled or claimed by this smoke.
name: "esp32-s3-devkitc-1-n16r8"
chip: "../chips/esp32s3-devkitc-1-n16r8-smoke.yaml"
debug_uart: "uart0"
external_devices: []
