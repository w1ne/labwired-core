# Narrow board profile for the ESP32-S3-DevKitC-1-N16R8 UART0 smoke.
#
# The twin's model-only pin map routes UART0 TX/RX to GPIO43/GPIO44. This
# descriptor exposes only that console path; the board's USB bridge, native USB,
# PSRAM, radio, buttons and LEDs are outside this smoke's claims.
name: "esp32-s3-devkitc-1-n16r8"
chip: "../chips/esp32s3-devkitc-1-n16r8-smoke.yaml"
debug_uart: "uart0"
external_devices: []
