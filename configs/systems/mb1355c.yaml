schema_version: "1.0"
name: "mb1355c"
chip: "../chips/stm32wb55.yaml"
debug_uart: "usart1"

# Scope: STM32WB55 application core, user LEDs/buttons, and USART1 TX/RX on
# the default ST-LINK VCP jumpers. The M0+ radio core and RF stacks are not
# represented by this system profile.

board_io:
  - id: "led_blue"
    kind: "led"
    peripheral: "gpiob"
    pin: 5
    signal: "output"
    active_high: true
  - id: "led_green"
    kind: "led"
    peripheral: "gpiob"
    pin: 0
    signal: "output"
    active_high: true
  - id: "led_red"
    kind: "led"
    peripheral: "gpiob"
    pin: 1
    signal: "output"
    active_high: true
  - id: "button_sw1"
    kind: "button"
    peripheral: "gpioc"
    pin: 4
    signal: "input"
    active_high: false
  - id: "button_sw2"
    kind: "button"
    peripheral: "gpiod"
    pin: 0
    signal: "input"
    active_high: false
  - id: "button_sw3"
    kind: "button"
    peripheral: "gpiod"
    pin: 1
    signal: "input"
    active_high: false

