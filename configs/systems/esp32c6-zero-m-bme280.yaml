# Waveshare ESP32-C6-Zero-M header board with an external BME280 breakout.
# This conservative profile uses the 4 MB C6FH4 variant listed in current
# Electrokit stock; see the vendor receipt for the manufacturer-page mismatch.
name: "esp32c6-zero-m-bme280"
chip: "../chips/esp32c6fh4.yaml"
cpu_hz: 160_000_000
debug_uart: "uart0"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    route:
      sda: "GPIO6"
      scl: "GPIO7"
    config:
      i2c_address: 0x77
board_io: []
