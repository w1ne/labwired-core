# Focused Teensy 4.0 profile: onboard D13 LED through GPIO2_IO03.
# The profile exposes only the MIMXRT1062 blocks exercised by the smoke.

name: "teensy-40"
chip: "../chips/mimxrt1062-teensy4-gpio-smoke.yaml"
external_devices: []
board_io:
  - id: "led_d13"
    kind: "led"
    peripheral: "gpio2"
    pin: 3   # GPIO2_IO03 — Teensy 4.0 pin 13 / onboard red LED
    signal: "output"
    active_high: true
