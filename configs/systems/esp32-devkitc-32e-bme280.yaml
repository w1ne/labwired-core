# Espressif ESP32-DevKitC-32E with an external BME280 breakout.
# I2C0 is routed to GPIO21 (SDA, J3 pin 6) and GPIO22 (SCL, J3 pin 3).
name: "esp32-devkitc-32e-bme280"
chip: "../chips/esp32-devkitc-32e-gpio-smoke.yaml"
cpu_hz: 240_000_000
debug_uart: "uart0"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    route:
      sda: "GPIO21"
      scl: "GPIO22"
    config:
      i2c_address: 0x77
board_io: []
