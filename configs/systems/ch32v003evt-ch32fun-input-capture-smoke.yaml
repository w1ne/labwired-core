# WCH CH32V003 evaluation board running ch32fun's input_capture, unmodified:
# a pulse source on PD2 (T1CH1, TIM1_RM = 00), standing for any external
# signal the example would time. The example leaves PD2 a floating input, so
# the source is modelled as a contact to 3.3 V with an external pull-down.
# It is a test connection, not a factory-installed part. A WCH-LinkE on SWIO
# carries the debug-printf console, as for the other ch32fun profiles.
name: ch32v003evt-ch32fun-input-capture-smoke
chip: ../chips/ch32v003f4p6-ch32fun-smoke.yaml
external_devices: []
board_io:
  - { id: pulse_pd2, kind: button, peripheral: gpiod, pin: 2, signal: input, active_high: true }
