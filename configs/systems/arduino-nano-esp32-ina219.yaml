# Arduino Nano ESP32 (ABX00083) plus an INA219 high-side power monitor.
# The Nano's A4/A5 I2C pins map to GPIO11/GPIO12.
name: "arduino-nano-esp32-ina219"
chip: "../chips/esp32s3-arduino-nano-i2c-smoke.yaml"
cpu_hz: 240_000_000
debug_uart: "uart0"
external_devices:
  - id: "ina219"
    type: "ina219"
    connection: "i2c0"
    route:
      sda: "GPIO11"
      scl: "GPIO12"
    config:
      i2c_address: 0x40
