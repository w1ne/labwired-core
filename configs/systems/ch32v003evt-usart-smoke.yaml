# WCH CH32V003 evaluation board profile for GPIO PD0 and USART1 TX on PD5.
# The external LED is the test connection used by the smoke, not a factory
# installed LED on PD0.
name: ch32v003evt-usart-smoke
chip: ../chips/ch32v003f4p6-usart-smoke.yaml
external_devices: []
board_io:
  - id: external_led_pd0
    kind: led
    peripheral: gpiod
    pin: 0
    signal: output
    active_high: true
