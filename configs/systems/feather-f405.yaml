# LabWired - Feather-STM32F405 Demo System Configuration
name: "feather-f405"
chip: "../chips/stm32f405.yaml"
external_devices: []
board_io:
  # D13 / the red user LED is PC1 on the Feather STM32F405 Express (it was
  # declared on PA5, which is the Nucleo LD2 pin, not this board's).
  - id: "led_d13_pc1"
    kind: "led"
    peripheral: "gpioc"
    pin: 1
    signal: "output"
    active_high: true
