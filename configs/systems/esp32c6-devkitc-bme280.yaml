# ESP32-C6-DevKitC-1-N8 plus an Adafruit BME280 breakout on I2C0.
# This focused profile claims UART0 and the wired sensor path.
name: "esp32c6-devkitc-bme280"
chip: "../chips/esp32c6.yaml"
cpu_hz: 160_000_000
debug_uart: "uart0"
external_devices:
  - id: "bme280"
    type: "bme280"
    connection: "i2c0"
    route:
      sda: "GPIO6"
      scl: "GPIO7"
    config:
      i2c_address: 0x77
