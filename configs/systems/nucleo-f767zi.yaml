# LabWired - NUCLEO-F767ZI system configuration
#
# Referenced by firmware_survival::test_stm32f767_tier1_survival, which runs the
# committed Tier-1 fixture (tests/fixtures/tier1/stm32f767.elf) and asserts its
# TIER1 self-test transcript over USART3, the ST-LINK VCP route.
name: "nucleo-f767zi"
chip: "../chips/stm32f767.yaml"
external_devices: []
board_io:
  - id: "led1_pb0"
    kind: "led"
    peripheral: "gpiob"
    pin: 0
    signal: "output"
    active_high: true
  - id: "button_user_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: true
