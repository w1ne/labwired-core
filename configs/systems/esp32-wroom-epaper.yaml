# ESP32-WROOM-32 + WeAct/Waveshare 2.9" tri-color e-paper system manifest.
#
# Standard Arduino-ESP32 SPI3 / VSPI wiring used by the GxEPD2 reference
# constructors:
#   BUSY = GPIO4
#   RST  = GPIO16
#   DC   = GPIO17
#   CS   = GPIO5
#   SCK  = GPIO18
#   MOSI = GPIO23
#
# The module is the `GxEPD2_290_C90c` (GDEY029Z90c) panel, which is an
# **SSD1680** controller. `peripherals::kit::registry::TYPE_ALIASES` is the one
# place that owns driver-class → controller. Despite the name, C90c emits
# SSD1680 opcodes (0x12 SWRESET, 0x11 data entry, 0x24/0x26 RAM, 0x22+0x20
# update). `uc8151d_tricolor_290` is the `GxEPD2_290_Z13c` panel: it decodes that
# stream as PWR/LUT/DRF, never releases BUSY, and paints nothing.
#
# More than one manifest describes this board — this file (bundled by the
# playground for the labwired-ereader demo), `examples/esp32-epaper-lab/
# system.yaml` (esp-hal Rust lab), and `platformio/esp32-epaper-ereader/
# board.yaml`. They are NOT hand-synced: `epaper_twin_single_source.rs` fails
# if any two manifests wire the same chip + bus + CS + DC to different members
# of the `*_tricolor_290` family.
name: "esp32-wroom-epaper"
chip: "../chips/esp32.yaml"
external_devices:
  - id: "epaper"
    type: "ssd1680_tricolor_290"
    connection: "spi3"
    config:
      cs_pin: "GPIO5"
      dc_pin: "GPIO17"
board_io: []

