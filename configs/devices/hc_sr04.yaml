# A rising trigger latches a finite echo waveform on the peripheral tick grid.
type: hc-sr04
behavior:
  primitive: gpio_device
  seed_input_clamp: true
  pins: {TRIG: trig_pin}
  outputs: [ECHO]
  output_pins: {ECHO: echo_pin}
  pin_config_defaults: {trig_pin: PA8, echo_pin: PA9}
  pin_defaults: {TRIG: false, ECHO: false}
  params:
    cpu_hz: {key: cpu_hz, default: 80000000}
  schedules:
    echo:
      output: ECHO
      idle: false
      final: false
      timing: peripheral_tick_grid
      segments:
        - hold: {level: false, us: 200}
        - hold:
            level: true
            us: {input: distance, scale: 58, arithmetic: f32, min_cycles: 1}
    # Datasheet: with no target inside the rated 400 cm the module times out
    # and holds ECHO high for ~38 ms, which no valid range produces.
    out_of_range:
      output: ECHO
      idle: false
      final: false
      timing: peripheral_tick_grid
      segments:
        - hold: {level: false, us: 200}
        - hold: {level: true, us: 38000}
  rules:
    - on: {pin: TRIG, edge: rising}
      when: "input(distance) <= 400"
      do: [{emit_schedule: echo}]
    - on: {pin: TRIG, edge: rising}
      when: "input(distance) > 400"
      do: [{emit_schedule: out_of_range}]

metadata:
  label: "HC-SR04"
  summary: "Ultrasonic distance sensor (trigger / echo)"
  category: gpio
  inputs:
    - { key: distance, label: "Distance", unit: cm, min: 2, max: 1000, default: 50, config_key: distance_cm, expr_precision: f32 }

# --- Canvas-compiler emit mapping (phase 2: unifies the TS/Rust emitters) ---
# NOTE: unlike the self-timed one-wire/quadrature devices, HC-SR04's cpu_hz uses
# the emitter's echo-pacing override (DEFAULT_CPU_HZ_BY_BOARD), not sim_cpu_hz —
# firmware times the echo itself, so the stretched clock is tolerated. Phase 2
# must preserve that when it derives the emit from this descriptor.
emit:
  device_type: hc-sr04 # canvas part type is `ultrasonic`; emitted type is hc-sr04
  connection: gpio
  config:
    - { key: trig_pin, from_part_pin: [TRIG] }
    - { key: echo_pin, from_part_pin: [ECHO] }
    - { key: distance_cm, from_attr: distance, default: 100 }
    - { key: cpu_hz, from: echo_pacing_cpu_hz }
