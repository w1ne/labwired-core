# Microchip MCP3008 8-channel 10-bit SAR ADC with SPI interface — declarative
# SPI MESSAGE device. Datasheet: Microchip MCP3004/3008, DS21295D (2008) —
# §5.0 "Serial Communications", Table 5-2 "Configure Bits for the MCP3008",
# Equation 4-2 "Digital Output Code Calculation", §6.1 and Figure 6-1 "SPI
# Communication with the MCP3004/3008 using 8-bit segments".
#
# ── Why this part needs `spi.miso_var` ──────────────────────────────────────
# The MCP3008 has no registers and no command byte. CS↓, then a START bit (the
# first 1 on DIN), SGL/DIFF, D2, D1, D0; it samples, and clocks the result out
# MSB first starting with a NULL bit. In the 8-bit-segment framing every
# microcontroller library uses (Figure 6-1, Mode 0,0 or 1,1):
#
#   byte   MOSI                         MISO
#   0      0000 0001  (start = bit 0)   ???? ????   (Hi-Z)
#   1      SGL D2 D1 D0 xxxx            ???? ?0 B9 B8
#   2      xxxx xxxx                    B7 … B0
#
# The reply in byte 1 carries B9:B8 in the SAME byte whose high nibble selects
# the channel. A register map cannot say that; a `frames: { length: 1 }` part
# whose rules run before MISO is read (`miso_var`) can. That is the batch-4
# blocker this descriptor is the first user of.
#
# Continuing to clock after B0 outputs the result again LSB first (B1 … B9,
# "Figure 5-2"), then zeros "indefinitely" (§5.0) — bytes 3 and 4 below.
#
# ── Conversion (Equation 4-2) ────────────────────────────────────────────────
#   code = 1024 · VIN / VREF, clamped to 0 … 1023
# SGL/DIFF = 1: VIN = CHn (n = D2:D0). SGL/DIFF = 0: VIN = IN+ − IN−, pairs per
# Table 5-2 (000 CH0−CH1, 001 CH1−CH0, 010 CH2−CH3, … 111 CH7−CH6); a negative
# difference reads 0. Inputs are in MILLIVOLTS because the rule arithmetic is
# integer; the division truncates, which is the ideal transfer function's
# floor. VREF is the `vref_mv` input (3300 mV by default, a 3.3 V board).
#
# ⚠️ NOT MODELLED, named rather than faked:
#   * Start-bit alignment other than Figure 6-1's: the start bit must be bit 0
#     of the first byte (`0x01`). A driver that puts it elsewhere (e.g. the
#     5-bit `0x18 | ch` form) gets 0x00 back, not a shifted result.
#   * The Hi-Z bits read 0, not floating; sample time, conversion timing, the
#     10 kHz minimum clock and droop of a slow sample — the result is ideal.
#   * The MCP3004 (4 channels) — D2 is honoured here.
type: mcp3008

behavior:
  primitive: spi_device
  spi:
    miso_var: miso
  frames:
    # Every byte is a frame, so the rules run once per byte, before MISO.
    length: 1
    discard_partial: true
  vars:
    idx: 0       # byte index since CS↓
    started: 0   # byte 0 carried the Figure 6-1 start bit
    cfg: 0       # SGL/DIFF D2 D1 D0
    vin: 0       # selected input, mV
    raw: 0       # 1024 · VIN / VREF before the clamp
    code: 0      # the 10-bit result
    miso: 0      # the byte this frame answers with
  rules:
    - on: cs_select
      do:
        - { var: { name: idx, value: "0" } }
        - { var: { name: started, value: "0" } }
        - { var: { name: miso, value: "0" } }
    # Default answer for every byte: Hi-Z before the null bit, zeros after the
    # LSB-first repeat.
    - on: frame
      do: [ { var: { name: miso, value: "0" } } ]
    - on: frame
      when: "var(idx) == 0"
      do: [ { var: { name: started, value: "frame_byte(0) & 1" } } ]
    # Byte 1: the configuration nibble arrives, the sample is taken, and the
    # null bit plus B9:B8 leave in this same byte.
    - on: frame
      when: "var(idx) == 1 && var(started)"
      do:
        - { var: { name: cfg, value: "(frame_byte(0) >> 4) & 0xF" } }
        - { var: { name: vin, value: "(var(cfg) & 8 != 0) * ((var(cfg) & 7 == 0) * input(ch0_mv) + (var(cfg) & 7 == 1) * input(ch1_mv) + (var(cfg) & 7 == 2) * input(ch2_mv) + (var(cfg) & 7 == 3) * input(ch3_mv) + (var(cfg) & 7 == 4) * input(ch4_mv) + (var(cfg) & 7 == 5) * input(ch5_mv) + (var(cfg) & 7 == 6) * input(ch6_mv) + (var(cfg) & 7 == 7) * input(ch7_mv)) + (var(cfg) & 8 == 0) * ((var(cfg) & 7 == 0) * (input(ch0_mv) - input(ch1_mv)) + (var(cfg) & 7 == 1) * (input(ch1_mv) - input(ch0_mv)) + (var(cfg) & 7 == 2) * (input(ch2_mv) - input(ch3_mv)) + (var(cfg) & 7 == 3) * (input(ch3_mv) - input(ch2_mv)) + (var(cfg) & 7 == 4) * (input(ch4_mv) - input(ch5_mv)) + (var(cfg) & 7 == 5) * (input(ch5_mv) - input(ch4_mv)) + (var(cfg) & 7 == 6) * (input(ch6_mv) - input(ch7_mv)) + (var(cfg) & 7 == 7) * (input(ch7_mv) - input(ch6_mv)))" } }
        - { var: { name: raw, value: "var(vin) * 1024 / input(vref_mv)" } }
        - { var: { name: code, value: "var(raw) * (var(raw) > 0) - (var(raw) - 1023) * (var(raw) > 1023)" } }
        - { var: { name: miso, value: "(var(code) >> 8) & 3" } }
    - on: frame
      when: "var(idx) == 2 && var(started)"
      do: [ { var: { name: miso, value: "var(code) & 0xFF" } } ]
    # Figure 5-2: clocks past B0 repeat the result LSB first — B1 … B8 …
    - on: frame
      when: "var(idx) == 3 && var(started)"
      do: [ { var: { name: miso, value: "(((var(code) >> 1) & 1) << 7) | (((var(code) >> 2) & 1) << 6) | (((var(code) >> 3) & 1) << 5) | (((var(code) >> 4) & 1) << 4) | (((var(code) >> 5) & 1) << 3) | (((var(code) >> 6) & 1) << 2) | (((var(code) >> 7) & 1) << 1) | (((var(code) >> 8) & 1) << 0)" } } ]
    # … then B9, then zeros.
    - on: frame
      when: "var(idx) == 4 && var(started)"
      do: [ { var: { name: miso, value: "((var(code) >> 9) & 1) << 7" } } ]
    # Declared LAST: every rule above reads this byte's index.
    - on: frame
      do: [ { var: { name: idx, value: "var(idx) + 1" } } ]

metadata:
  label: "Microchip MCP3008 ADC"
  summary: "8-channel 10-bit SPI ADC (single-ended / differential, Figure 6-1 framing)."
  detail: "Microchip MCP3008 over SPI, three-byte transaction per Figure 6-1: 0x01 (start bit), SGL/DIFF·D2·D1·D0 in the high nibble of byte 1, then a don't-care byte. Byte 1 answers with the null bit and B9:B8, byte 2 with B7..B0, so (b1 & 3) << 8 | b2 is the code; further bytes repeat the result LSB first, then zeros. code = 1024·VIN/VREF clamped 0..1023, single-ended on CH0..CH7 or differential on the Table 5-2 pairs. Inputs ch0_mv..ch7_mv and vref_mv are in millivolts. Not modelled: other start-bit alignments, conversion timing."
  category: spi
  config_keys:
    - { name: cs_pin, ty: str, doc: "SPI CS GPIO pin. Defaults to PA4." }
  inputs:
    - { key: ch0_mv, label: "CH0", unit: "mV", min: 0, max: 5500, default: 1650 }
    - { key: ch1_mv, label: "CH1", unit: "mV", min: 0, max: 5500, default: 825 }
    - { key: ch2_mv, label: "CH2", unit: "mV", min: 0, max: 5500, default: 2475 }
    - { key: ch3_mv, label: "CH3", unit: "mV", min: 0, max: 5500, default: 100 }
    - { key: ch4_mv, label: "CH4", unit: "mV", min: 0, max: 5500, default: 3300 }
    - { key: ch5_mv, label: "CH5", unit: "mV", min: 0, max: 5500, default: 1000 }
    - { key: ch6_mv, label: "CH6", unit: "mV", min: 0, max: 5500, default: 2000 }
    - { key: ch7_mv, label: "CH7", unit: "mV", min: 0, max: 5500, default: 3000 }
    - { key: vref_mv, label: "VREF", unit: "mV", min: 250, max: 5500, default: 3300 }
