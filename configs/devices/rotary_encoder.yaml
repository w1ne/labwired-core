# EC11 quadrature: round position to detents; walk one Gray phase every 2 ms.
# A changed target anchors its first full interval on the next serviced tick.
type: rotary_encoder
behavior:
  primitive: gpio_device
  output_update: final_level
  timer_clock: cycles_floor
  input_timer_start_on_service: true
  pin_defaults: { a: true, b: true }
  outputs: [a, b]
  output_pins: { a: clk_pin, b: dt_pin }
  pin_config_defaults: { clk_pin: PA0, dt_pin: PA1 }
  params:
    cpu_hz: { key: cpu_hz, default: 80000000 }
  vars: { phase: 0, target: 0, next: 0 }
  timers:
    - { name: edge, period_us: 2000, start: manual }
  rules:
    - on: { input: position }
      when: "input(position) <= 2305843009213693951 && input(position) >= -2305843009213693952"
      do: [ { var: next, value: "input(position) * 4" } ]
    - on: { input: position }
      when: "input(position) > 2305843009213693951"
      do: [ { var: next, value: "9223372036854775807" } ]
    - on: { input: position }
      when: "input(position) < -2305843009213693952"
      do: [ { var: next, value: "-9223372036854775807 - 1" } ]
    - on: { input: position }
      when: "var(next) != var(target)"
      do:
        - { var: target, value: "var(next)" }
        - { timer: edge, start: true }
    - on: { timer: edge }
      when: "var(phase) != var(target)"
      do:
        - { var: phase, value: "var(phase) + (var(target) > var(phase)) - (var(target) < var(phase))" }
        - { pin: a, level: "((var(phase) % 4 + 4) % 4 == 0) || ((var(phase) % 4 + 4) % 4 == 3)" }
        - { pin: b, level: "((var(phase) % 4 + 4) % 4 == 0) || ((var(phase) % 4 + 4) % 4 == 1)" }
    - on: { timer: edge }
      when: "var(phase) == var(target)"
      do: [ { timer: edge, start: false } ]

# --- Display / manifest metadata (phase 2: derives KitMetadata) ------------
metadata:
  label: "Rotary encoder"
  summary: "Incremental quadrature knob (EC11)"
  category: gpio
  # Drivable stimulus channels (must match the primitive's SimInput impl).
  inputs:
    - { key: position, label: "Position", unit: detents, min: -1000, max: 1000 }

# --- Canvas-compiler emit mapping (phase 2: unifies the TS/Rust emitters) ---
# Both engines derive the external_devices block from this, killing the
# hand-mirrored emit_rotary_encoder / emitRotaryEncoder pair.
emit:
  device_type: rotary-encoder # descriptor type is rotary_encoder; emitted type differs
  connection: gpio
  config:
    - { key: clk_pin, from_part_pin: [CLK] }
    - { key: dt_pin, from_part_pin: [DT] }
    - { key: cpu_hz, from: sim_cpu_hz }
  # SW push switch closes to GND: active-low, with released level pulled high.
  # A plain board_io button (optional; omitted when unwired).
  board_io:
    - { from_part_pin: [SW], kind: button, signal: input, active_high: false }

