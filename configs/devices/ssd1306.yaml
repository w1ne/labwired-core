# Solomon Systech SSD1306 OLED controller — declarative `display` primitive.
#
# The 0.96" 128x64 panel, the default form factor sold as a bare I2C module.
# The 0.91" 128x32 variant is `ssd1306_128x32.yaml`: identical command set, four
# GDDRAM pages instead of eight.
#
# FRAMING. The SSD1306 has no D/C pad on the I2C variant. The FIRST byte of every
# I2C transaction is the control byte (Co / D#C#, datasheet section 8.1.5.2):
# 0x00 opens the command stream for the rest of the transaction, 0x40 the data
# stream. A START — not a STOP — re-arms it, because a driver that issues several
# transfers under one trailing STOP (which is what the nRF52 TWIM does, one
# STARTTX per transfer) must not have its second control byte read as an opcode.
#
# GDDRAM is page-major: byte (page x 128 + column), bit (row mod 8), LSB the
# topmost row of the page. There is no RAMWR opcode — every data-stream byte IS
# frame memory — which is why the command table below has no `ram_write`.
#
# NOT modelled: contrast (0x81), charge pump (0x8D), multiplex ratio (0xA8),
# display offset (0xD3), clock divide (0xD5), pre-charge (0xD9), COM pins (0xDA),
# VCOMH (0xDB), segment remap (0xA0/0xA1), COM scan direction (0xC0/0xC8), entire
# display on (0xA4/0xA5) and normal/inverse (0xA6/0xA7). Each is listed with its
# parameter count so its arguments are CONSUMED rather than mis-decoded as
# opcodes, and each then does nothing: they change how the glass looks, not what
# is in GDDRAM, and this model reports what is in GDDRAM.
type: oled-ssd1306

behavior:
  primitive: display
  display:
    width: 128
    height: 64
    pixel_format: mono_page
    artifact_format: ssd1306_page
    ram: { pages: 8, bytes: 1024, layout: page_major, stream: always }
    dc: { source: control_byte, command_value: 0x00 }
    default_address: 0x3C
    addressing:
      modes: [horizontal, vertical, page]
      default: horizontal
    # What the paint artifact publishes beside the pixels. Stated per panel
    # because these key names are the contract the browser overlay and the
    # CLI's `painted bytes=` line read.
    artifact_meta: [ink_bytes, lit_pixels]
    commands:
      # 0x20 SET MEMORY ADDRESSING MODE. A[1:0]: 00 horizontal, 01 vertical,
      # 10 page. 11 is "invalid" in the datasheet; the engine holds the last
      # declared mode for it.
      - { opcode: 0x20, name: SETMEMORYMODE, args: 1, do: [ { set_mode: { args: [0], mask: 0x03 } } ] }
      # 0x21 SET COLUMN ADDRESS: start, end. Seven-bit fields — the datasheet
      # states A[6:0], so an out-of-range byte is MASKED, not clamped.
      - opcode: 0x21
        name: SETCOLUMNADDR
        args: 2
        do:
          - set_window: { axis: col, start: { args: [0], mask: 0x7F }, end: { args: [1], mask: 0x7F } }
      # 0x22 SET PAGE ADDRESS: start, end. Three-bit fields, A[2:0].
      - opcode: 0x22
        name: SETPAGEADDR
        args: 2
        do:
          - set_window: { axis: page, start: { args: [0], mask: 0x07 }, end: { args: [1], mask: 0x07 } }
      - { opcode: 0xAE, name: DISPLAYOFF, do: [ { display_on: false } ] }
      - { opcode: 0xAF, name: DISPLAYON,  do: [ { display_on: true } ] }
      # 0xB0..0xB7 SET PAGE START ADDRESS (page addressing mode): the page is in
      # the opcode's low three bits. The page WINDOW is untouched.
      - opcode: 0xB0
        opcode_end: 0xB7
        name: SETPAGESTART
        do:
          - set_cursor: { axis: page, value: { opcode_mask: 0x07 } }
      # 0x00..0x0F / 0x10..0x1F SET LOWER / HIGHER COLUMN START ADDRESS (page
      # addressing mode): each carries one nibble of the column, so the cursor is
      # read-modify-written rather than replaced.
      - opcode: 0x00
        opcode_end: 0x0F
        name: SETLOWCOLUMN
        do:
          - set_cursor: { axis: col, part: low_nibble, value: { opcode_mask: 0x0F } }
      - opcode: 0x10
        opcode_end: 0x1F
        name: SETHIGHCOLUMN
        do:
          - set_cursor: { axis: col, part: high_nibble, value: { opcode_mask: 0x0F } }
      # Declared for their PARAMETER COUNTS. Without these entries the argument
      # byte of, say, `0x81 0xCF` would be decoded as opcode 0xCF, and a `0xD3
      # 0x00` would set the column low nibble from 0x00. The whole init sequence
      # would walk the cursor around and the first frame would land shifted.
      - { opcode: 0x81, name: SETCONTRAST, args: 1 }
      - { opcode: 0x8D, name: CHARGEPUMP, args: 1 }
      - { opcode: 0xA8, name: SETMULTIPLEX, args: 1 }
      - { opcode: 0xD3, name: SETDISPLAYOFFSET, args: 1 }
      - { opcode: 0xD5, name: SETDISPLAYCLOCKDIV, args: 1 }
      - { opcode: 0xD9, name: SETPRECHARGE, args: 1 }
      - { opcode: 0xDA, name: SETCOMPINS, args: 1 }
      - { opcode: 0xDB, name: SETVCOMDETECT, args: 1 }

metadata:
  label: "SSD1306 OLED"
  summary: "128×64 monochrome OLED display over I2C with a paged framebuffer."
  detail: "Solomon Systech SSD1306 with the canonical 0x3C / 0x3D address pair. Tracks the 8-page-by-128-column framebuffer; the WASM bridge surfaces pixel state for the playground's display overlay."
  category: i2c
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to 0x3C; 0x3D selects the SA0=high variant."
  labs:
    - board_id: ssd1306-hello-lab
      chip: stm32f103
      example_dir: ssd1306-hello-lab
      demo_elf: demo-ssd1306-hello-lab.elf
