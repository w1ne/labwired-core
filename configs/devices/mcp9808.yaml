# Microchip MCP9808 I²C temperature sensor — declarative register-pointer
# device (MCP9808 datasheet DS20005095B).
#
# Register pointer (Table 5-1, Register 5-2): the low four bits select the
# register — 0x1 CONFIG, 0x2 T_UPPER, 0x3 T_LOWER, 0x4 T_CRIT, 0x5 T_A,
# 0x6 Manufacturer ID, 0x7 Device ID/Revision, 0x8 Resolution. 0x0 is
# reserved (RFU) and is not modelled.
#
# T_A (Register 5-4): bit 12 is the sign and bits 11:0 the magnitude in
# 0.0625 °C steps, so bits 12:0 are one 13-bit two's-complement count
# (raw = °C × 16; -10.125 °C → 0x1F5E). That is a signed 13-bit `fields:`
# entry. Bits 15:13 are the T_CRIT/T_UPPER/T_LOWER comparator flags; they are
# not modelled and read 0. Reads are sourced from the `temperature` input
# channel with datasheet-grade noise (σ = 0.0625 °C, ±0.25 °C typical
# accuracy; a placement's `noise_sigma` overrides it, 0 = exact reads) and a
# τ≈1 s first-order thermal lag (effective only on buses with an honest µs
# source).
#
# Write masks follow the unimplemented bits of each register: CONFIG 15:11
# (Register 5-1), the limit registers 15:13 and 1:0 (Register 5-3, 0.25 °C
# steps), RESOLUTION 7:2 (Register 5-7).
#
# Limitations (intentional, documented for the fidelity page): the alert
# output and the T_A comparator flags are not modelled; the resolution
# register's conversion-time and LSB effect (30–250 ms, 0.5–0.0625 °C) is
# not applied (reads are always ready at 0.0625 °C), matching how every
# declarative sensor degrades on buses without a µs source; shutdown and the
# lock bits in CONFIG are storage only.
type: mcp9808

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x18
    pointer_mask: 0x0F
    registers:
      # CONFIG: hysteresis, shutdown, lock and alert bits; storage only.
      - { name: CONFIG, addr: 0x01, width: 2, endian: be, access: rw, reset: 0x0000, write_mask: 0x07FF }
      # Alert limits: sign at bit 12, 0.25 °C steps in bits 11:2.
      - { name: T_UPPER, addr: 0x02, width: 2, endian: be, access: rw, reset: 0x0000, write_mask: 0x1FFC }
      - { name: T_LOWER, addr: 0x03, width: 2, endian: be, access: rw, reset: 0x0000, write_mask: 0x1FFC }
      - { name: T_CRIT, addr: 0x04, width: 2, endian: be, access: rw, reset: 0x0000, write_mask: 0x1FFC }
      # T_A: 13-bit two's complement in bits 12:0, big-endian, sourced+noisy.
      - name: T_A
        addr: 0x05
        width: 2
        endian: be
        access: r
        reset: 0x0000
        fields:
          - { source: temperature, shift: 0, width_bits: 13, signed: true, encode: { scale: 16.0 } }
      # Identification (datasheet fixed values).
      - { name: MANUF_ID, addr: 0x06, width: 2, endian: be, access: r, reset: 0x0054 }
      - { name: DEV_ID, addr: 0x07, width: 2, endian: be, access: r, reset: 0x0400 }
      # Resolution: one byte, POR 0.0625 °C; stored only (see header).
      - { name: RESOLUTION, addr: 0x08, width: 1, endian: be, access: rw, reset: 0x03, write_mask: 0x03 }

metadata:
  label: "Microchip MCP9808"
  summary: "±0.25 °C I²C temperature sensor with seeded noise + thermal lag."
  detail: "Microchip MCP9808 at 0x18 (A2:A0 straps to 0x1F). T_A (pointer 0x05) is the 13-bit two's-complement temperature from the temperature channel with σ=0.0625 °C Gaussian noise (placement `noise_sigma` overrides it) and τ≈1 s thermal lag. Alert output, T_A comparator flags and resolution-timed conversions are not modelled."
  category: i2c
  inputs:
    - { key: temperature, label: "Temperature", unit: "°C", min: -40, max: 125, default: 25, noise_sigma: 0.0625, thermal_tau_s: 1.0, noise_sigma_key: noise_sigma }
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to 0x18; A2:A0 straps select 0x18–0x1F."
    - name: noise_sigma
      ty: float
      doc: "Optional Gaussian noise sigma on the temperature channel in °C, seeded and replay-safe. Absent = the datasheet 0.0625 °C; 0 = no noise (the thermal lag stays)."
