# Microchip MCP9808 I²C temperature sensor — declarative register-pointer
# device (MCP9808 datasheet DS20005095). Pointer decodes the low four bits.
# TA (0x05) is 13-bit, 1 LSB = 0.0625 °C (raw = °C × 16 for positive temps);
# reads are sourced from the `temperature` input channel with datasheet-grade
# noise (σ = 0.0625 °C, ±0.25 °C typical accuracy) and a τ≈1 s first-order
# thermal lag (effective only on buses with an honest µs source).
#
# Limitations (intentional, documented for the fidelity page): alert output
# (CONFIG hysteresis/limit interrupts) is not modelled; the input range is
# clamped to positive temperatures until the signed 13-bit two's-complement
# encode path is verified against hardware; the resolution register's
# conversion-time effect (30–250 ms) is not gated (reads are always ready),
# matching how every declarative sensor degrades on buses without a µs source.
type: mcp9808

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x18
    pointer_mask: 0x0F
    registers:
      # RFU (0x00) is read-only and returns zero.
      - { name: RFU, addr: 0x00, width: 2, endian: be, access: r, reset: 0x0000 }
      # TA: 13-bit left-aligned in the low 13 bits, big-endian, sourced+noisy.
      - { name: TA, addr: 0x05, width: 2, endian: be, access: r, reset: 0x0000, source: temperature, encode: { scale: 16.0, clamp_min: 0, clamp_max: 8191 } }
      # CONFIG: shutdown / alert bits; rw storage, reset 0x0000.
      - { name: CONFIG, addr: 0x01, width: 2, endian: be, access: rw, reset: 0x0000 }
      # Alert limits: rw storage.
      - { name: T_UPPER, addr: 0x02, width: 2, endian: be, access: rw, reset: 0x0000 }
      - { name: T_LOWER, addr: 0x03, width: 2, endian: be, access: rw, reset: 0x0000 }
      - { name: T_CRIT, addr: 0x04, width: 2, endian: be, access: rw, reset: 0x0000 }
      # Resolution (0x08): stored, but conversion timing is not gated (see header).
      - { name: RESOLUTION, addr: 0x08, width: 1, endian: be, access: rw, reset: 0x03 }
      # Identification (datasheet fixed values).
      - { name: MANUF_ID, addr: 0x06, width: 2, endian: be, access: r, reset: 0x0054 }
      - { name: DEV_ID, addr: 0x07, width: 2, endian: be, access: r, reset: 0x0400 }

metadata:
  label: "Microchip MCP9808"
  summary: "±0.25 °C I²C temperature sensor with seeded noise + thermal lag."
  detail: "Microchip MCP9808 at 0x18 (A2:A0 straps to 0x1F). TA register sourced from the temperature channel with σ=0.0625 °C Gaussian noise and τ≈1 s thermal lag. Alert/limit interrupts and resolution-timed conversions are not modelled; input range is positive-only pending signed-encode verification."
  category: i2c
  inputs:
    - { key: temperature, label: "Temperature", unit: "°C", min: 0, max: 125, default: 25, noise_sigma: 0.0625, thermal_tau_s: 1.0 }
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to 0x18; A2:A0 straps select 0x18–0x1F."
