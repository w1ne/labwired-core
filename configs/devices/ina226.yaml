# Texas Instruments INA226 current / power monitor — declarative I²C
# register-pointer device.
#
# Datasheet: TI SBOS547 ("INA226 High-Side or Low-Side Measurement,
# Bi-Directional Current and Power Monitor with I²C Compatible Interface"):
#   §7.5 "Programming": the master writes a 1-byte register pointer, then reads
#     or writes a 16-bit word MSB first. No auto-increment.
#   §7.6 "Register Maps", Table 2 "Summary of Register Set":
#     0x00 Configuration   R/W  POR 0x4127
#     0x01 Shunt Voltage   R    int16, 2.5 µV / LSB
#     0x02 Bus Voltage     R    15-bit, 1.25 mV / LSB (D15 always 0)
#     0x03 Power           R    25 × Current_LSB per LSB
#     0x04 Current         R    int16, Current_LSB per LSB
#     0x05 Calibration     R/W  POR 0x0000 (D15 reserved, reads 0)
#     0x06 Mask/Enable     R/W  POR 0x0000
#     0x07 Alert Limit     R/W  POR 0x0000
#     0xFE Manufacturer ID R    0x5449 ("TI")
#     0xFF Die ID          R    0x2260
#
# ⚠️ The configuration reset is 0x4127 (Table 3: RST = 0, D14:D12 = 100,
# AVG = 000, VBUSCT = 100, VSHCT = 100, MODE = 111) — NOT 0xFFFF. The task
# brief that asked for this part said "0xFFFF config reset"; the datasheet does
# not, and the datasheet wins. 0xFF is the Die-ID POINTER, which reads 0x2260.
#
# ── Write masks ───────────────────────────────────────────────────────────
#   CONFIGURATION 0x0FFF: AVG, VBUSCT, VSHCT, MODE are firmware's. D14:D12 are
#     fixed at 100. RST (D15) "self-clears" — it is excluded from storage so it
#     always reads 0, and a write with it set runs the reset rule below.
#   CALIBRATION 0x7FFF: D15 is unused and reads 0.
#   MASK_ENABLE 0xFC03: the six function-enable bits (SOL SUL BOL BUL POL
#     CNVR) plus APOL and LEN are firmware's; AFF / CVRF / OVF (D4:D2) are
#     flags the part owns.
#
# ── Current and power follow CALIBRATION, as §7.5.1 says ───────────────────
#   Current = ShuntVoltage × CAL / 2048           (Equation 3)
#   Power   = Current × BusVoltage / 20000        (Equation 4)
# both in register counts. The two registers are therefore NOT stimulus
# channels: they are recomputed on every START from the live shunt and bus
# words and the CAL word firmware wrote (a Tier-2 rule over `reported()` and
# `reg()`). With CAL at its power-on 0 the part reports 0 A and 0 W, exactly as
# silicon does — a driver that forgets to calibrate sees that here, too.
#
# ── Stimulus ──────────────────────────────────────────────────────────────
# `bus_voltage` (V) and `current` (A) through a 0.1 Ω shunt — the R100 fitted on
# the common INA226 breakout boards. Shunt counts = I × 0.1 / 2.5 µV = I × 40000,
# saturating at the ±81.92 mV full scale (±0.8192 A at 0.1 Ω).
#
# ── Conversion-ready ──────────────────────────────────────────────────────
# CVRF (Mask/Enable bit 3) rises 2.2 ms after a write to Configuration that
# leaves an operating mode selected — the default 1.1 ms shunt + 1.1 ms bus
# conversion, AVG = 1 — and is cleared by reading Mask/Enable, per §7.6.1.7.
#
# ⚠️ NOT modelled, named rather than faked: averaging and the per-setting
# conversion times (the data is always the live stimulus; the CVRF delay is the
# default-setting one), the alert comparator and ALERT pin (AFF / OVF never
# rise), power-down and triggered modes (data keeps tracking in every mode), and
# the power-on CVRF (it rises only after firmware writes Configuration; silicon
# raises it ~2.2 ms after power-up in the default continuous mode). Power uses
# |Current|: the register is unsigned.
type: ina226

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x40
    registers:
      - { name: CONFIGURATION, addr: 0x00, width: 2, endian: be, access: rw, write_mask: 0x0FFF, reset: 0x4127 }
      # 2.5 µV/LSB across 0.1 Ω ⇒ 40000 counts per amp, two's-complement.
      - { name: SHUNT_VOLTAGE, addr: 0x01, width: 2, endian: be, access: r, signed: true, source: current, encode: { scale: 40000.0 } }
      # 1.25 mV/LSB ⇒ 800 counts per volt; 15 bits, D15 always 0.
      - { name: BUS_VOLTAGE, addr: 0x02, width: 2, endian: be, access: r, source: bus_voltage, encode: { scale: 800.0, clamp_min: 0, clamp_max: 32767 } }
      # Computed by the rule below from SHUNT_VOLTAGE, BUS_VOLTAGE and CAL.
      - { name: POWER, addr: 0x03, width: 2, endian: be, access: r, reset: 0x0000 }
      - { name: CURRENT, addr: 0x04, width: 2, endian: be, access: r, reset: 0x0000 }
      - { name: CALIBRATION, addr: 0x05, width: 2, endian: be, access: rw, write_mask: 0x7FFF, reset: 0x0000 }
      - { name: MASK_ENABLE, addr: 0x06, width: 2, endian: be, access: rw, write_mask: 0xFC03, reset: 0x0000 }
      - { name: ALERT_LIMIT, addr: 0x07, width: 2, endian: be, access: rw, reset: 0x0000 }
      - { name: MANUFACTURER_ID, addr: 0xFE, width: 2, endian: be, access: r, reset: 0x5449 }
      - { name: DIE_ID, addr: 0xFF, width: 2, endian: be, access: r, reset: 0x2260 }
    data_ready:
      - name: conversion
        start_register: CONFIGURATION
        start_mask: 0x0007
        ready_register: MASK_ENABLE
        ready_mask: 0x0008
        conversion_us: 2200
        clear_on_read: [MASK_ENABLE]
  rules:
    # Equations 3 and 4, re-evaluated at every START so a read always sees the
    # current stimulus and the current CAL. `reported()` of the `signed: true`
    # shunt register is already sign-extended; the result is stored as a
    # 16-bit two's-complement word. Division truncates toward zero.
    - on: start
      do:
        - { write: { register: CURRENT, value: "((reported(SHUNT_VOLTAGE) * reg(CALIBRATION)) / 2048) & 0xFFFF" } }
        - { write: { register: POWER, value: "(abs((reported(SHUNT_VOLTAGE) * reg(CALIBRATION)) / 2048) * reported(BUS_VOLTAGE)) / 20000" } }
    # RST (Configuration D15): every register returns to its power-on value.
    - on: { write: CONFIGURATION }
      when: "written & 0x8000"
      do:
        - { write: { register: CONFIGURATION, value: "0x4127" } }
        - { write: { register: CALIBRATION, value: "0" } }
        - { write: { register: MASK_ENABLE, value: "0" } }
        - { write: { register: ALERT_LIMIT, value: "0" } }

metadata:
  label: "INA226 Power Monitor"
  summary: "TI INA226 bidirectional current / power monitor over I²C (36 V, 16-bit)."
  detail: "Texas Instruments INA226 (default 0x40; 0x40–0x4F by A0/A1 strapping). Configuration powers up at 0x4127; Manufacturer ID (0xFE) reads 0x5449 and Die ID (0xFF) 0x2260. Shunt (2.5 µV/LSB) and bus (1.25 mV/LSB) voltages follow the host's bus_voltage and current through a 0.1 Ω shunt; Current and Power are computed from those words and the Calibration register exactly as the datasheet's equations 3 and 4 say, so they read 0 until firmware writes Calibration. CVRF rises 2.2 ms after a Configuration write. Averaging, the alert comparator and power-down are not modelled."
  category: i2c
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to 0x40 (A0 = A1 = GND); 0x40–0x4F by A0/A1 strapping."
  inputs:
    - { key: bus_voltage, label: "Bus voltage", unit: "V", min: 0.0, max: 36.0, default: 5.0 }
    - { key: current, label: "Current (0.1 Ω shunt)", unit: "A", min: -0.8, max: 0.8, default: 0.25 }
