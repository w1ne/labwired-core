# Aosong AHT20 I²C temperature + humidity sensor — declarative COMMAND device.
# Datasheet: AHT20 product manual rev 1.1 (7-bit address 0x38, fixed).
#
# A command stream with NO register pointer:
#   0xBA             soft reset
#   0xBE 0x08 0x00   init (one-shot after power-up)
#   0xAC 0x33 0x00   trigger measurement
# then a 7-byte read:
#   [status, h19:12, h11:4, h3:0|t19:16, t15:8, t7:0, crc8]
# CRC-8 poly 0x31, init 0xFF, no final XOR, over ALL SIX preceding bytes.
#
# ── The three gaps this port closes ────────────────────────────────────────
#
# PR #1186 listed the AHT20 as blocked on three separate things. Each is now a
# general key, each used here:
#
# 1. **`crc8.covers: { bytes: 6 }`** — ONE checksum after the first N ANSWER
#    bytes. `covers: response` puts a checksum after every 16-bit word, which
#    would drop three bytes into the MIDDLE of the measurement; `covers:
#    transaction` is an SMBus PEC over the address and command bytes the MASTER
#    drove. Neither is what §5.4 says.
#
# 2. **`response[].fields`** — the 40-bit measurement is packed into FIVE bytes
#    so that byte 3 carries the low nibble of the humidity AND the high nibble
#    of the temperature. That is neither a `response[]` word boundary nor a
#    `u32`, so before this key the only port was a CONSTANT payload — which
#    freezes the part at 25 °C / 50 %RH for ever, makes the checksum a literal,
#    and is exactly what the model this replaces did.
#
#    With the key, the two measurements are ORDINARY stimulus channels and the
#    checksum is computed over whatever the twin actually answered. That is a
#    real gain over the deleted model and `aht20_migration_parity.rs` sweeps it.
#
# 3. **BUSY as real elapsed time.** ⚠️ NAMED DIFFERENCE, and the reason this
#    entry stood as a THUNK. The deleted model's own header said "we don't
#    actually model elapsed time" and cleared BUSY after a fixed COUNT of two
#    status reads. This descriptor uses `delay_us: 80000` — §5.4's measurement
#    time — gated on the simulated microsecond clock the machine derives from
#    `cpu_hz`, and `not_ready_byte: 0x88` so a poll during the measurement reads
#    the status byte with BUSY (bit 7) and CAL (bit 3) set, exactly as silicon
#    does, instead of open bus.
#
#    ⚠️ This BREAKS firmware that polls without waiting — which is what the
#    thunk was hiding. `examples/nucleo-f407-i2c` polled sixteen times
#    back-to-back, about 0.2 ms of simulated time, and passed only because the
#    model counted reads. That firmware would fail on the bench. It now waits
#    the datasheet's 80 ms first, and `aht20_migration_parity.rs` asserts BOTH
#    halves: BUSY at 79 999 µs, clear at 80 000 µs, and NOT clear after any
#    number of reads that do not spend the time.
#
# ── ⚠️ Two more differences from the deleted model, named ──────────────────
#
#   * A read BEFORE any command answers 0xFF (open bus), where the model
#     answered a full measurement to a bus read that never asked for one. Every
#     driver triggers first; a part that reports a reading it was not asked for
#     is the model being permissive, not the silicon.
#   * A read taken WHILE the measurement runs answers 0x88 for all seven bytes.
#     The model answered 0x88 for byte 0 and then the READY payload for bytes
#     1..6 — a measurement that is simultaneously not finished and available.
#     No driver reads past byte 0 while BUSY is set.
#
# ⚠️ NOT MODELLED, named rather than faked: the init command's calibration
# bookkeeping (0xBE is accepted and changes nothing — the model did the same,
# and CAL reads set unconditionally), and the 0x71 status-read opcode (the
# model had no arm for it either; every driver in the corpus polls with a bare
# read after the trigger).
type: aht20

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x38
    # Single-byte opcodes. The parameter bytes (0x33 0x00 / 0x08 0x00) that
    # follow are accepted and ignored — the command dispatches on the opcode,
    # and real silicon validates the framing this twin does not.
    code_width: 1
    crc8: { poly: 0x31, init: 0xFF, covers: { bytes: 6 } }
    # The status byte with BUSY|CAL, answered while the 80 ms measurement runs.
    not_ready_byte: 0x88
    commands:
      # Soft reset (§5.5). Accepted; the twin has no state to clear.
      - { name: soft_reset, code: 0xBA }
      # Init / calibrate (§5.3). Accepted; CAL reads set unconditionally.
      - { name: init, code: 0xBE }
      - name: trigger_measurement
        code: 0xAC
        # §5.4: "wait 80 ms for the measurement to complete".
        delay_us: 80000
        response:
          # Status: CAL set, BUSY clear — the measurement IS finished by the
          # time this buffer is served, which is what `delay_us` guarantees.
          - { const: 0x08, width: 1 }
          # The 40-bit packed measurement. bits[39:20] humidity, bits[19:0]
          # temperature, sharing byte 3.
          #   raw_h = RH% × 2^20 / 100          ⇒ scale 10485.76
          #   raw_t = (T + 50) × 2^20 / 200     ⇒ scale 5242.88, offset 262144
          - width: 5
            endian: be
            fields:
              - { source: humidity,    shift: 20, width_bits: 20, encode: { scale: 10485.76 } }
              - { source: temperature, shift: 0,  width_bits: 20, encode: { scale: 5242.88, offset: 262144.0 } }

metadata:
  label: "AHT20 Temp/Humidity"
  summary: "Aosong AHT20 I²C temperature and humidity sensor."
  detail: "Command-stream protocol at 0x38: trigger with 0xAC 0x33 0x00, wait the datasheet's 80 ms, then read seven bytes — status, a 20-bit humidity and a 20-bit temperature packed across five bytes, and a CRC-8 over all six. Both measurements are drivable stimulus channels, and the checksum is computed over what the twin actually answered. A read taken before the 80 ms elapses returns 0x88 (BUSY | CAL). NOT modelled: the 0x71 status opcode and the init command's calibration bookkeeping."
  category: i2c
  config_keys:
    - { name: i2c_address, ty: int, doc: "7-bit slave address. Defaults to 0x38 (fixed on real silicon)." }
    - { name: temperature, ty: float, doc: "Starting temperature in °C. Defaults to 25." }
    - { name: humidity, ty: float, doc: "Starting relative humidity in %. Defaults to 50." }
  inputs:
    - { key: temperature, label: "Temperature", unit: "°C", min: -40, max: 85, default: 25.0 }
    - { key: humidity, label: "Humidity", unit: "%", min: 0, max: 100, default: 50.0 }
