# Texas Instruments INA219 high-side current / bus-voltage monitor —
# declarative I²C register-pointer device.
#
# Migrated from `peripherals/components/ina219.rs`, which is deleted with this
# descriptor; `tests/ina219_migration_parity.rs` drives that model and this one
# through the same I²C script and asserts the bytes, plus the behaviours that
# deliberately change.
#
# ── Wire protocol (INA219 datasheet SBOS448G, §8.5 "Register maps") ───────
#
# The master writes a 1-byte pointer, then either writes a 16-bit value (MSB
# first) into the pointed register or reads it back MSB first. The pointer does
# NOT auto-increment (§8.5.1 gives no block-read mode), so no `auto_increment:`.
# A pointer this map does not decode reads a zero word, which is what the hand
# model answered.
#
#   0x00 CONFIGURATION  rw  range / PGA / ADC / mode; POR 0x399F
#   0x01 SHUNT_VOLTAGE  r   int16, 10 µV / LSB
#   0x02 BUS_VOLTAGE    r   13-bit count at bit 3 (4 mV / LSB) + CNVR + OVF
#   0x03 POWER          r   uint16, power_LSB = 20 × current_LSB
#   0x04 CURRENT        r   int16, current_LSB
#   0x05 CALIBRATION    rw  POR 0 — seeded here to the value the model fixes
#
# ── Measurement encoding ──────────────────────────────────────────────────
#
# CURRENT follows the datasheet equation: SHUNT_VOLTAGE × CALIBRATION / 4096.
# The calibration register is live state, and input or calibration writes
# refresh CURRENT. Firmware programs 4096 to select the former current-only
# 0.1 Ω operating point; the datasheet power-on value is zero. An explicit
# shunt_voltage takes precedence, allowing a bare IC to use its actual external
# shunt (including 10 mΩ).
#
# POWER is calculated from the encoded registers: abs(CURRENT) × bus-voltage
# counts / 5000. BUS_VOLTAGE counts are 4 mV/LSB.
#
# For older hosts that supply only current, the model retains the former 0.1 Ω
# shunt assumption until a shunt_voltage stimulus is explicitly supplied.
type: ina219

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x40
    registers:
      # POR 0x399F: 32 V range, PGA ÷8, 12-bit ADCs, continuous shunt+bus.
      - { name: CONFIGURATION, addr: 0x00, width: 2, endian: be, access: rw, reset: 0x399F }
      # 10 µV/LSB, measured directly across the external shunt.
      - { name: SHUNT_VOLTAGE, addr: 0x01, width: 2, endian: be, access: r, signed: true, source: shunt_voltage, encode: { scale: 100000.0 } }
      # 13-bit voltage count at bit 3; bit 1 CNVR reads set (a conversion is
      # always available — the part powers up in continuous mode), bit 0 OVF
      # clear. The field is placed with `shift: 3` / `width_bits: 13`, so the
      # count is rounded and saturated to 13 bits BEFORE it is shifted: the
      # three low bits of this register are silicon's, never the measurement's.
      - name: BUS_VOLTAGE
        addr: 0x02
        width: 2
        endian: be
        access: r
        reset: 0x0002
        fields:
          - { source: bus_voltage, shift: 3, width_bits: 13, encode: { scale: 250.0 } }
      # Updated from CURRENT and the encoded 4 mV bus count by Tier-2 rules.
      - { name: POWER, addr: 0x03, width: 2, endian: be, access: r }
      # Stored measurement: CALIBRATION affects it through the TI formula.
      - { name: CURRENT, addr: 0x04, width: 2, endian: be, access: r, signed: true }
      # TI specifies 0x0000 at power-on. FS0 is hardwired low; firmware writes
      # cannot store it and the measurement rule therefore never uses it.
      # Current and Power remain zero until calibration is programmed.
      - { name: CALIBRATION, addr: 0x05, width: 2, endian: be, access: rw, reset: 0, write_mask: 0xFFFE }
  vars: { shunt_voltage_explicit: 0 }
  rules:
    # Preserve the current-only input shape by deriving the former 0.1 Ω
    # shunt voltage until an explicit shunt stimulus arrives.
    - on: { input: current }
      when: "var(shunt_voltage_explicit) == 0"
      do:
        - { set_input: shunt_voltage, value: "input(current)" }
        - { write: { register: CURRENT, value: "input(shunt_voltage) * reg(CALIBRATION) / 4096" } }
        - { write: { register: POWER, value: "abs(reported(CURRENT)) * input(bus_voltage) / 5000" } }
    - on: { input: current }
      when: "var(shunt_voltage_explicit) != 0"
      do:
        - { write: { register: CURRENT, value: "input(shunt_voltage) * reg(CALIBRATION) / 4096" } }
        - { write: { register: POWER, value: "abs(reported(CURRENT)) * input(bus_voltage) / 5000" } }
    - on: { input: shunt_voltage }
      do:
        - { var: shunt_voltage_explicit, value: 1 }
        - { write: { register: CURRENT, value: "input(shunt_voltage) * reg(CALIBRATION) / 4096" } }
        - { write: { register: POWER, value: "abs(reported(CURRENT)) * input(bus_voltage) / 5000" } }
    - on: { input: bus_voltage }
      do:
        - { write: { register: POWER, value: "abs(reported(CURRENT)) * input(bus_voltage) / 5000" } }
    - on: { write: CALIBRATION }
      do:
        - { write: { register: CURRENT, value: "input(shunt_voltage) * reg(CALIBRATION) / 4096" } }
        - { write: { register: POWER, value: "abs(reported(CURRENT)) * input(bus_voltage) / 5000" } }

metadata:
  label: "INA219 Power Monitor"
  summary: "High-side current and bus voltage sensor over I²C."
  detail: "Texas Instruments INA219 (default 7-bit address 0x40). Host stimulus sets bus voltage, current, or shunt voltage; firmware reads config/shunt/bus/current/power/cal registers on the simulated I²C bus."
  category: i2c
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to 0x40 (A0/A1 ground)."
  inputs:
    - { key: bus_voltage, label: "Bus voltage", unit: "V", min: 0.0, max: 32.0, default: 3.3, expr_scale: 250.0 }
    - { key: current, label: "Current", unit: "A", min: -3.2, max: 3.2, default: 0.0, expr_scale: 10000.0 }
    - { key: shunt_voltage, label: "Shunt voltage", unit: "V", min: -0.32, max: 0.32, default: 0.0 }
