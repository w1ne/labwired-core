type: dc-motor

behavior:
  primitive: dc_motor
  pins:
    pwm: pwm_pin
    direction: direction_pin
    brake: brake_pin
    enable: enable_pin
    encoder_a: encoder_a_pin
    encoder_b: encoder_b_pin
    encoder_index: encoder_index_pin
    fault: fault_pin
  params:
    resistance_ohm: { key: resistance_ohm, default: 1.2 }
    inductance_h: { key: inductance_h, default: 0.002 }
    torque_constant_nm_per_a: { key: torque_constant_nm_per_a, default: 0.08 }
    back_emf_constant_v_per_rad_s: { key: back_emf_constant_v_per_rad_s, default: 0.08 }
    rotor_inertia_kg_m2: { key: rotor_inertia_kg_m2, default: 0.00004 }
    viscous_friction_nm_per_rad_s: { key: viscous_friction_nm_per_rad_s, default: 0.00001 }
    supply_voltage_v: { key: supply_voltage_v, default: 12.0 }
    load_torque_nm: { key: load_torque_nm, default: 0.0 }
    encoder_cpr: { key: encoder_cpr, default: 1024 }
    simulation_clock_hz: { key: simulation_clock_hz, default: 80000000 }

metadata:
  label: "Brushed DC motor"
  summary: "Configurable deterministic brushed DC motor plant"
  category: robotics

emit:
  connection: gpio
  config:
    - { key: pwm_pin, from_part_pin: [PWM] }
    - { key: direction_pin, from_part_pin: [DIRECTION] }
    - { key: brake_pin, from_part_pin: [BRAKE] }
    - { key: enable_pin, from_part_pin: [ENABLE] }
    - { key: encoder_a_pin, from_part_pin: [ENC_A], required: false }
    - { key: encoder_b_pin, from_part_pin: [ENC_B], required: false }
    - { key: encoder_index_pin, from_part_pin: [INDEX], required: false }
    - { key: fault_pin, from_part_pin: [FAULT], required: false }
    - { key: simulation_clock_hz, from: sim_cpu_hz }
    - { key: resistance_ohm, from_attr: resistance_ohm, default: 1.2 }
    - { key: inductance_h, from_attr: inductance_h, default: 0.002 }
    - { key: torque_constant_nm_per_a, from_attr: torque_constant_nm_per_a, default: 0.08 }
    - { key: back_emf_constant_v_per_rad_s, from_attr: back_emf_constant_v_per_rad_s, default: 0.08 }
    - { key: rotor_inertia_kg_m2, from_attr: rotor_inertia_kg_m2, default: 0.00004 }
    - { key: viscous_friction_nm_per_rad_s, from_attr: viscous_friction_nm_per_rad_s, default: 0.00001 }
    - { key: supply_voltage_v, from_attr: supply_voltage_v, default: 12.0 }
    - { key: load_torque_nm, from_attr: load_torque_nm, default: 0.0 }
    - { key: encoder_cpr, from_attr: encoder_cpr, default: 1024 }
