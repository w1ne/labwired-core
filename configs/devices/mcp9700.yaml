# Microchip MCP9700 Linear Active Thermistor IC on an ADC channel —
# declarative `analog_source`.
#
# Source: Microchip MCP970X family data sheet DS20001942L, DC Electrical
# Characteristics and Equation 4-1, V_out = T_C * T_A + V_0°C, with
# V_0°C = 500 mV and T_C = 10.0 mV/°C typical for the MCP9700/9700A/9700B. So
# 0 °C = 500 mV, 25 °C = 750 mV, 125 °C = 1750 mV. The extended-temperature
# range is -40..+125 °C (100..1750 mV); the high-temperature grade to +150 °C
# is a different order code and is not this part.
#
# Not modeled: the 0.1 °C/V line regulation, the ±0.5 °C output nonlinearity,
# the ±2 °C typical accuracy, the 800 µs turn-on time and the 1.3 s SC70
# thermal response. V_out does not depend on the 2.3..5.5 V supply in this
# model, so there is no supply_mv key.
type: mcp9700

behavior:
  primitive: analog_source
  analog:
    formula: "min(max(500 + 10 * temperature, 0), 1750)"
    encode: trunc

metadata:
  label: MCP9700 Temperature Sensor
  summary: Analog temperature sensor, 10 mV/°C with 500 mV at 0 °C.
  detail: >-
    Microchip MCP9700 Linear Active Thermistor IC (data sheet DS20001942L).
    Drive the `temperature` channel (°C) at runtime and the ADC channel follows
    V_out = 500 mV + 10 mV/°C over the extended range -40..125 °C. Starts at
    25 °C (750 mV).
  config_keys:
    - { name: channel, ty: int, doc: "ADC channel index (0..N). Defaults to 0." }
  inputs:
    - { key: temperature, label: Temperature, unit: "°C", min: -40, max: 125, default: 25 }
