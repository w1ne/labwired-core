# Analog Devices ADXL345 3-axis ±2/4/8/16 g accelerometer — I²C.
#
# Replaces the hand-written `components/adxl345.rs`, whose wire transcript is
# pinned in `crates/core/tests/adxl345_migration_parity.rs`. The SPI variant of
# the same silicon is `adxl345_spi.yaml`; the register map below is that file's,
# because it IS the same Table 16 map — only the framing differs (a 1-byte
# command with R/W and MB bits there, a register pointer here).
#
# ── The wire ───────────────────────────────────────────────────────────────
#
# Datasheet Rev. 0, "I2C" section: the master writes a 1-byte register address
# and the address auto-increments on every byte of a multi-byte read, which is
# what lets a driver pull all six data bytes in one transaction
# (`auto_increment: true`). ALT ADDRESS high ⇒ 0x1D, low ⇒ 0x53.
#
# ── The point of this port: `encode.clamp_from` ────────────────────────────
#
# The ADXL345's output is not one scale and one range. Two firmware-owned
# fields of DATA_FORMAT (0x31) move it:
#
#   D3  FULL_RES — 0: fixed 10-bit output, the resolution HALVES per range
#                     step so full scale is always ±512 counts.
#                  1: full resolution, always 3.9 mg/LSB (256 counts/g), so
#                     the count range GROWS with the g range.
#   D1:D0 Range  — ±2 g / ±4 g / ±8 g / ±16 g.
#
# `scale_from` already expressed the counts-per-g half. The saturation half had
# no key at all: `encode.clamp_min`/`clamp_max` are constants, and a constant is
# right for exactly one of the eight settings. A model with the ±2 g window
# baked in would clip a ±16 g driver at an eighth of its range; a model with the
# ±16 g window baked in would let a ±2 g driver report counts the silicon
# cannot produce. Neither is a rounding error — it is the part failing to
# saturate, which is the behaviour a tilt or impact sketch is watching for.
#
# `clamp_from:` is the mirror of `scale_from:`: the window is read from a
# register bit-field. The selector here is `mask: 0x0B` — FULL_RES and the two
# range bits, which are not contiguous, so the mask picks all three at once and
# the map is keyed by the eight combinations that matter.
#
#   field  FULL_RES  range   counts/g   full scale (counts)
#   0x00      0      ±2 g       256          ±512
#   0x01      0      ±4 g       128          ±512
#   0x02      0      ±8 g        64          ±512
#   0x03      0      ±16 g       32          ±512
#   0x08      1      ±2 g       256          ±512
#   0x09      1      ±4 g       256         ±1024
#   0x0A      1      ±8 g       256         ±2048
#   0x0B      1      ±16 g      256         ±4096
#
# ⚠️ DELIBERATELY DIFFERENT from the model this replaces. The old one converted
# and clamped at `set_input` time, latching counts against whatever DATA_FORMAT
# held at that instant; this one converts at READ time. A driver that poses 8 g
# of acceleration, then widens the range from ±2 g to ±16 g, and then reads, now
# sees 8 g — on the old model it saw the ±2 g clip forever, because the counts
# had already been truncated. The silicon converts per sample, so read time is
# the right moment. Pinned in `a_range_change_is_visible_to_the_next_read`.
#
# ── The Tier-2 half: the INT1/INT2 pads ────────────────────────────────────
#
# DATA_READY (bit 7 of INT_ENABLE / INT_MAP / INT_SOURCE) is modelled end to
# end: a sample timer sets INT_SOURCE.DATA_READY, and if INT_ENABLE.DATA_READY
# is set the pad INT_MAP.DATA_READY selects (0 ⇒ INT1, 1 ⇒ INT2) goes high.
# Reading the data registers clears the flag and drops the pad, which is the
# datasheet's rule ("cleared by reading data registers 0x32 to 0x37").
#
# ⚠️ NOT MODELLED, each named rather than faked:
#   * **Output data rate.** The sample timer runs at the BW_RATE reset value's
#     100 Hz. The rate bits select it at runtime, and `timers:` take a constant
#     `period_us`. Needs: a field-driven timer period.
#   * **Tap, activity/inactivity, free-fall and the watermark/overrun flags.**
#     Their registers store and read back; nothing sets their INT_SOURCE bits,
#     so those interrupts never fire. Needs: threshold comparators over the
#     measurement channels.
#   * **The FIFO** (FIFO_CTL/FIFO_STATUS are storage), the OFSX/Y/Z offset trim,
#     the measure/sleep bits of POWER_CTL, the INT_INVERT and SELF_TEST bits,
#     and the DATA_FORMAT JUSTIFY bit (D2): output is always right-justified
#     with sign extension.
type: adxl345

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x53
    auto_increment: true
    registers:
      # Table 16 (datasheet Rev. 0, page 14) in full, with the reset value that
      # table states. The configuration registers are storage: a driver writes
      # them and reads back what it wrote. Their EFFECTS are not simulated
      # except where the header says otherwise.
      #
      # Declaring them all is not cosmetic. The hand-written model served six
      # addresses and returned 0x00 for every other one, so BW_RATE read 0x00
      # for a documented 0x0A, INT_SOURCE read 0x00 for 0x02, and every write to
      # the sixteen R/W configuration registers was discarded — a
      # configure-then-verify sequence could not pass.
      - { name: DEVID,          addr: 0x00, width: 1, endian: le, access: r,  reset: 0xE5 }
      - { name: THRESH_TAP,     addr: 0x1D, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: OFSX,           addr: 0x1E, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: OFSY,           addr: 0x1F, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: OFSZ,           addr: 0x20, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: DUR,            addr: 0x21, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: Latent,         addr: 0x22, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: Window,         addr: 0x23, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: THRESH_ACT,     addr: 0x24, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: THRESH_INACT,   addr: 0x25, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: TIME_INACT,     addr: 0x26, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: ACT_INACT_CTL,  addr: 0x27, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: THRESH_FF,      addr: 0x28, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: TIME_FF,        addr: 0x29, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: TAP_AXES,       addr: 0x2A, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: ACT_TAP_STATUS, addr: 0x2B, width: 1, endian: le, access: r,  reset: 0x00 }
      - { name: BW_RATE,        addr: 0x2C, width: 1, endian: le, access: rw, reset: 0x0A }
      - { name: POWER_CTL,      addr: 0x2D, width: 1, endian: le, access: rw, reset: 0x00 }
      - name: INT_ENABLE
        addr: 0x2E
        width: 1
        endian: le
        access: rw
        reset: 0x00
        bits: [{ name: DATA_READY, shift: 7 }]
      - name: INT_MAP
        addr: 0x2F
        width: 1
        endian: le
        access: rw
        reset: 0x00
        bits: [{ name: DATA_READY, shift: 7 }]
      # INT_SOURCE is read-only to the MASTER; the DEVICE sets DATA_READY in it,
      # which a rule does through `set:` (that path bypasses `access:`, as
      # silicon does). Reset 0x02 is the datasheet's power-on watermark bit.
      - name: INT_SOURCE
        addr: 0x30
        width: 1
        endian: le
        access: r
        reset: 0x02
        bits: [{ name: DATA_READY, shift: 7 }]
      - name: DATA_FORMAT
        addr: 0x31
        width: 1
        endian: le
        access: rw
        reset: 0x00
        bits:
          - { name: RANGE,    shift: 0, width_bits: 2 }
          - { name: JUSTIFY,  shift: 2 }
          - { name: FULL_RES, shift: 3 }
          - { name: INT_INVERT, shift: 5 }
          - { name: SPI,      shift: 6 }
          - { name: SELF_TEST, shift: 7 }
      # DATAX0/Y0/Z0 are width 2, so they span 0x32-0x37 and cover the DATAX1,
      # DATAY1 and DATAZ1 high bytes the datasheet names separately.
      #
      # `scale_from` gives counts-per-g and `clamp_from` gives the count window;
      # both read the SAME three DATA_FORMAT bits. See the table in the header.
      - name: DATAX0
        addr: 0x32
        width: 2
        endian: le
        access: r
        signed: true
        source: x
        scale_from: { register: DATA_FORMAT, mask: 0x0B, map: { 0x00: 256.0, 0x01: 128.0, 0x02: 64.0, 0x03: 32.0, 0x08: 256.0, 0x09: 256.0, 0x0A: 256.0, 0x0B: 256.0 } }
        encode:
          clamp_from:
            - register: DATA_FORMAT
              mask: 0x0B
              map:
                0x00: { min: -512.0,  max: 512.0 }
                0x01: { min: -512.0,  max: 512.0 }
                0x02: { min: -512.0,  max: 512.0 }
                0x03: { min: -512.0,  max: 512.0 }
                0x08: { min: -512.0,  max: 512.0 }
                0x09: { min: -1024.0, max: 1024.0 }
                0x0A: { min: -2048.0, max: 2048.0 }
                0x0B: { min: -4096.0, max: 4096.0 }
      - name: DATAY0
        addr: 0x34
        width: 2
        endian: le
        access: r
        signed: true
        source: y
        scale_from: { register: DATA_FORMAT, mask: 0x0B, map: { 0x00: 256.0, 0x01: 128.0, 0x02: 64.0, 0x03: 32.0, 0x08: 256.0, 0x09: 256.0, 0x0A: 256.0, 0x0B: 256.0 } }
        encode:
          clamp_from:
            - register: DATA_FORMAT
              mask: 0x0B
              map:
                0x00: { min: -512.0,  max: 512.0 }
                0x01: { min: -512.0,  max: 512.0 }
                0x02: { min: -512.0,  max: 512.0 }
                0x03: { min: -512.0,  max: 512.0 }
                0x08: { min: -512.0,  max: 512.0 }
                0x09: { min: -1024.0, max: 1024.0 }
                0x0A: { min: -2048.0, max: 2048.0 }
                0x0B: { min: -4096.0, max: 4096.0 }
      - name: DATAZ0
        addr: 0x36
        width: 2
        endian: le
        access: r
        signed: true
        source: z
        scale_from: { register: DATA_FORMAT, mask: 0x0B, map: { 0x00: 256.0, 0x01: 128.0, 0x02: 64.0, 0x03: 32.0, 0x08: 256.0, 0x09: 256.0, 0x0A: 256.0, 0x0B: 256.0 } }
        encode:
          clamp_from:
            - register: DATA_FORMAT
              mask: 0x0B
              map:
                0x00: { min: -512.0,  max: 512.0 }
                0x01: { min: -512.0,  max: 512.0 }
                0x02: { min: -512.0,  max: 512.0 }
                0x03: { min: -512.0,  max: 512.0 }
                0x08: { min: -512.0,  max: 512.0 }
                0x09: { min: -1024.0, max: 1024.0 }
                0x0A: { min: -2048.0, max: 2048.0 }
                0x0B: { min: -4096.0, max: 4096.0 }
      - { name: FIFO_CTL,       addr: 0x38, width: 1, endian: le, access: rw, reset: 0x00 }
      - { name: FIFO_STATUS,    addr: 0x39, width: 1, endian: le, access: r,  reset: 0x00 }

  # The two interrupt pads. Optional: a board that wires neither binds nothing.
  outputs: [INT1, INT2]
  output_pins:
    INT1: int1_pin
    INT2: int2_pin

  timers:
    # BW_RATE powers up at 0x0A = 100 Hz output data rate (datasheet Table 7).
    # Only that rate is modelled — see the header.
    - { name: sample, period_us: 10000, start: on_reset }

  rules:
    # A new sample is ready.
    - on: { timer: sample }
      do: [ { set: INT_SOURCE.DATA_READY } ]
    # …and it reaches a pad only if firmware enabled the interrupt. INT_MAP
    # bit 7 picks which pad: 0 ⇒ INT1, 1 ⇒ INT2.
    - on: { timer: sample }
      do:
        - { pin: INT1, level: "field(INT_ENABLE.DATA_READY) && !field(INT_MAP.DATA_READY)" }
        - { pin: INT2, level: "field(INT_ENABLE.DATA_READY) && field(INT_MAP.DATA_READY)" }
    # Datasheet: DATA_READY "is cleared by reading data registers 0x32 to 0x37".
    # A driver may stop after any axis, so every one of the three clears it.
    - on: { read: DATAX0 }
      do: [ { clear: INT_SOURCE.DATA_READY }, { pin: INT1, level: 0 }, { pin: INT2, level: 0 } ]
    - on: { read: DATAY0 }
      do: [ { clear: INT_SOURCE.DATA_READY }, { pin: INT1, level: 0 }, { pin: INT2, level: 0 } ]
    - on: { read: DATAZ0 }
      do: [ { clear: INT_SOURCE.DATA_READY }, { pin: INT1, level: 0 }, { pin: INT2, level: 0 } ]

metadata:
  label: "ADXL345 Tilt"
  summary: "3-axis ±2/4/8/16 g digital accelerometer over I2C."
  detail: "Analog Devices ADXL345 with the canonical 0x53 / 0x1D 7-bit address pair. The whole Table 16 register map is served at its datasheet reset values, and the three data registers follow the LIVE DATA_FORMAT: FULL_RES and the range bits set both the counts-per-g and the count at which the part saturates (±512 counts in fixed 10-bit mode at every range; ±512/1024/2048/4096 in full resolution). The DATA_READY interrupt is modelled end to end - a 100 Hz sample timer raises it, INT_ENABLE gates it, INT_MAP routes it to the INT1 or INT2 pad, and reading a data register clears it. NOT modelled: output data rates other than the 100 Hz reset value, tap/activity/free-fall detection, the FIFO, the offset trim and the JUSTIFY bit."
  category: i2c
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to 0x53; 0x1D selects the alternate-pin variant."
    - name: int1_pin
      ty: str
      doc: "Pad the INT1 output drives (e.g. \"PA0\"). Optional - an unbound pin drives nothing."
    - name: int2_pin
      ty: str
      doc: "Pad the INT2 output drives. Optional."
  labs:
    - { board_id: adxl345-sensor-lab, chip: stm32f103, example_dir: adxl345-sensor-lab, demo_elf: demo-adxl345-sensor-lab.elf }
  inputs:
    # The rest sample the hand-written model seeded: 1 g on Z, which at the
    # DATA_FORMAT reset value is 256 counts.
    - { key: x, label: "X", unit: g, min: -16, max: 16, default: 0 }
    - { key: y, label: "Y", unit: g, min: -16, max: 16, default: 0 }
    - { key: z, label: "Z", unit: g, min: -16, max: 16, default: 1 }
