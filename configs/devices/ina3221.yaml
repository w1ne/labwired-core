# Texas Instruments INA3221 three-channel shunt and bus voltage monitor —
# declarative I²C register-pointer device.
#
# Datasheet: TI SBOS576C ("INA3221 Triple-Channel, High-Side Measurement,
# Shunt and Bus Voltage Monitor with I²C- and SMBUS-Compatible Interface",
# rev. C):
#   §8.1 "Summary of Register Set", Table 8-1 — every address and power-on
#     reset value below:
#     0x00 Configuration            R/W  0x7127
#     0x01/0x03/0x05 CHn Shunt V    R    0x0000
#     0x02/0x04/0x06 CHn Bus V      R    0x0000
#     0x07/0x09/0x0B CHn Critical   R/W  0x7FF8
#     0x08/0x0A/0x0C CHn Warning    R/W  0x7FF8
#     0x0D Shunt-Voltage Sum        R    0x0000
#     0x0E Shunt-Voltage Sum Limit  R/W  0x7FFE
#     0x0F Mask/Enable              R/W  0x0002
#     0x10 Power-Valid Upper Limit  R/W  0x2710 (10.000 V)
#     0x11 Power-Valid Lower Limit  R/W  0x2328 (9.000 V)
#     0xFE Manufacturer ID          R    0x5449
#     0xFF Die ID                   R    0x3220
#   §8.2 Table 8-2 "Register Map": the bit layout of each register.
#   §7.5.1.1: four addresses, 0x40..0x43, by the A0 pin.
#
# ── The data format, exactly (§8.2.2 / §8.2.3, Tables 8-5..8-8) ──────────
#   Shunt and bus words are 13-bit two's complement LEFT-ALIGNED in 16 bits:
#   D15 is SIGN, D14:D3 the data, D2:D0 reserved and read 0. So
#     word = count << 3 = count × 8,  count ∈ −4096..+4095
#   Shunt: count LSB 40 µV, full scale 163.8 mV = 0x7FF8. The datasheet's own
#     worked example: −80 mV → 2000 counts → 0xC180.
#   Bus:   count LSB 8 mV, full scale 32.76 V = 0x7FF8 ("Do not apply more
#     than 26V").
#   ⚠️ The brief that asked for this part called D15 "don't-care"; Tables 8-6
#   and 8-8 call it SIGN, and the datasheet wins.
#   Each word is a `fields:` entry at `shift: 3`, `width_bits: 13`: the engine
#   rounds and saturates to 13 bits BEFORE the shift places them, so D2:D0
#   are zero by construction and an over-range reading saturates at the
#   converter's own end of range (0x7FF8 / 0x8000) instead of wrapping sign.
#
# ── Shunt-voltage sum (§8.2.14, 0x0D) ─────────────────────────────────────
#   The sum of the shunt counts of the channels selected by Mask/Enable
#   SCC1..SCC3, in D14:D1 (LSB 40 µV, D0 reserved) — so word = sum × 2. A
#   Tier-2 rule recomputes it at every START. SCC powers up 000, so it reads 0
#   until firmware enables summation.
#
# ── Write masks ───────────────────────────────────────────────────────────
#   CONFIGURATION 0x7FFF (Table 8-3): CH1en..CH3en, AVG, VBUSCT, VSHCT, MODE.
#     RST (D15) self-clears and runs the reset rule below.
#   Alert limits 0xFFF8, sum limit 0xFFFE, power-valid limits 0x7FF8: the
#     reserved low bits (and the power-valid SIGN, R in Table 8-35) read back 0.
#   MASK_ENABLE 0x7C00 (Table 8-33): SCC1..SCC3, WEN, CEN are firmware's.
#     CF1..3, SF, WF1..3, PVF, TCF and CVRF are flags the part owns; TCF
#     powers up SET (reset 0x0002) and stays set — the timing-control sequence
#     that would clear it is not modelled.
#
# ── Conversion-ready ──────────────────────────────────────────────────────
# §7.3.1: the part converts shunt then bus for each enabled channel in turn;
# §7.4.2.1: one channel's sequence is the shunt plus the bus conversion time.
# At the reset settings (1.1 ms + 1.1 ms, three channels enabled) that is
# 6.6 ms, after which CVRF (Mask/Enable bit 0) rises; reading Mask/Enable
# clears it (Table 8-34).
#
# ── Stimulus ──────────────────────────────────────────────────────────────
# Per channel `chN_bus_voltage` (V) and `chN_current` (A) through a 0.1 Ω shunt
# — the R100 fitted on the common INA3221 breakout boards. Shunt counts =
# I × 0.1 Ω / 40 µV = I × 2500, saturating at +4095 / −4096 counts (≈ ±1.638 A at 0.1 Ω).
#
# ⚠️ NOT modelled, named rather than faked: averaging and the per-setting
# conversion times (data is always live; the CVRF delay is the default one and
# ignores how many channels are enabled), channel disable (CHnEN clear still
# reports the live channel), power-down and single-shot modes, the critical /
# warning / power-valid / timing-control comparators and their pins (no flag
# ever rises except CVRF; TCF holds its power-on 1), and the SMBus alert
# response.
#   ⚠️ CVRF polling: the shared data-ready engine re-arms the conversion delay
#   when Mask/Enable is read while the part is in a continuous mode, so a
#   master that polls Mask/Enable faster than the conversion time never sees
#   CVRF set. Silicon keeps converting and raises CVRF on its own cadence.
#   (`ina226.yaml` behaves the same way.) Poll after the conversion time.
type: ina3221

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x40
    registers:
      - { name: CONFIGURATION, addr: 0x00, width: 2, endian: be, access: rw, write_mask: 0x7FFF, reset: 0x7127 }
      # 13-bit two's complement at shift 3: D15 SIGN, D2:D0 = 0.
      # Shunt: 0.1 Ω / 40 µV = 2500 counts per amp. Bus: 1 / 8 mV = 125 per volt.
      - name: CH1_SHUNT_VOLTAGE
        addr: 0x01
        width: 2
        endian: be
        access: r
        signed: true
        fields:
          - { source: ch1_current, shift: 3, width_bits: 13, signed: true, encode: { scale: 2500.0 } }
      - name: CH1_BUS_VOLTAGE
        addr: 0x02
        width: 2
        endian: be
        access: r
        signed: true
        fields:
          - { source: ch1_bus_voltage, shift: 3, width_bits: 13, signed: true, encode: { scale: 125.0, clamp_min: 0 } }
      - name: CH2_SHUNT_VOLTAGE
        addr: 0x03
        width: 2
        endian: be
        access: r
        signed: true
        fields:
          - { source: ch2_current, shift: 3, width_bits: 13, signed: true, encode: { scale: 2500.0 } }
      - name: CH2_BUS_VOLTAGE
        addr: 0x04
        width: 2
        endian: be
        access: r
        signed: true
        fields:
          - { source: ch2_bus_voltage, shift: 3, width_bits: 13, signed: true, encode: { scale: 125.0, clamp_min: 0 } }
      - name: CH3_SHUNT_VOLTAGE
        addr: 0x05
        width: 2
        endian: be
        access: r
        signed: true
        fields:
          - { source: ch3_current, shift: 3, width_bits: 13, signed: true, encode: { scale: 2500.0 } }
      - name: CH3_BUS_VOLTAGE
        addr: 0x06
        width: 2
        endian: be
        access: r
        signed: true
        fields:
          - { source: ch3_bus_voltage, shift: 3, width_bits: 13, signed: true, encode: { scale: 125.0, clamp_min: 0 } }
      - { name: CH1_CRITICAL_LIMIT, addr: 0x07, width: 2, endian: be, access: rw, write_mask: 0xFFF8, reset: 0x7FF8 }
      - { name: CH1_WARNING_LIMIT, addr: 0x08, width: 2, endian: be, access: rw, write_mask: 0xFFF8, reset: 0x7FF8 }
      - { name: CH2_CRITICAL_LIMIT, addr: 0x09, width: 2, endian: be, access: rw, write_mask: 0xFFF8, reset: 0x7FF8 }
      - { name: CH2_WARNING_LIMIT, addr: 0x0A, width: 2, endian: be, access: rw, write_mask: 0xFFF8, reset: 0x7FF8 }
      - { name: CH3_CRITICAL_LIMIT, addr: 0x0B, width: 2, endian: be, access: rw, write_mask: 0xFFF8, reset: 0x7FF8 }
      - { name: CH3_WARNING_LIMIT, addr: 0x0C, width: 2, endian: be, access: rw, write_mask: 0xFFF8, reset: 0x7FF8 }
      # Recomputed by the rule below from the shunt words and SCC1..SCC3.
      - { name: SHUNT_VOLTAGE_SUM, addr: 0x0D, width: 2, endian: be, access: r, reset: 0x0000 }
      - { name: SHUNT_VOLTAGE_SUM_LIMIT, addr: 0x0E, width: 2, endian: be, access: rw, write_mask: 0xFFFE, reset: 0x7FFE }
      - { name: MASK_ENABLE, addr: 0x0F, width: 2, endian: be, access: rw, write_mask: 0x7C00, reset: 0x0002 }
      - { name: POWER_VALID_UPPER_LIMIT, addr: 0x10, width: 2, endian: be, access: rw, write_mask: 0x7FF8, reset: 0x2710 }
      - { name: POWER_VALID_LOWER_LIMIT, addr: 0x11, width: 2, endian: be, access: rw, write_mask: 0x7FF8, reset: 0x2328 }
      - { name: MANUFACTURER_ID, addr: 0xFE, width: 2, endian: be, access: r, reset: 0x5449 }
      - { name: DIE_ID, addr: 0xFF, width: 2, endian: be, access: r, reset: 0x3220 }
    data_ready:
      - name: conversion
        start_register: CONFIGURATION
        start_mask: 0x0007
        ready_register: MASK_ENABLE
        ready_mask: 0x0001
        conversion_us: 6600
        clear_on_read: [MASK_ENABLE]
  rules:
    # §8.2.14: sum of the SCC-selected shunt counts, in D14:D1. `reported()`
    # of a signed register is already sign-extended; / 8 recovers the count.
    - on: start
      do:
        - write:
            register: SHUNT_VOLTAGE_SUM
            value: "((reported(CH1_SHUNT_VOLTAGE) / 8 * ((reg(MASK_ENABLE) & 0x4000) != 0) + reported(CH2_SHUNT_VOLTAGE) / 8 * ((reg(MASK_ENABLE) & 0x2000) != 0) + reported(CH3_SHUNT_VOLTAGE) / 8 * ((reg(MASK_ENABLE) & 0x1000) != 0)) * 2) & 0xFFFF"
    # RST (Configuration D15): "the same as a power-on reset (POR). This bit
    # resets all registers to default values and self-clears."
    - on: { write: CONFIGURATION }
      when: "written & 0x8000"
      do:
        - { write: { register: CONFIGURATION, value: "0x7127" } }
        - { write: { register: CH1_CRITICAL_LIMIT, value: "0x7FF8" } }
        - { write: { register: CH1_WARNING_LIMIT, value: "0x7FF8" } }
        - { write: { register: CH2_CRITICAL_LIMIT, value: "0x7FF8" } }
        - { write: { register: CH2_WARNING_LIMIT, value: "0x7FF8" } }
        - { write: { register: CH3_CRITICAL_LIMIT, value: "0x7FF8" } }
        - { write: { register: CH3_WARNING_LIMIT, value: "0x7FF8" } }
        - { write: { register: SHUNT_VOLTAGE_SUM_LIMIT, value: "0x7FFE" } }
        - { write: { register: MASK_ENABLE, value: "0x0002" } }
        - { write: { register: POWER_VALID_UPPER_LIMIT, value: "0x2710" } }
        - { write: { register: POWER_VALID_LOWER_LIMIT, value: "0x2328" } }

metadata:
  label: "INA3221 3-Channel Monitor"
  summary: "TI INA3221 three-channel shunt and bus voltage monitor over I²C (26 V)."
  detail: "Texas Instruments INA3221 (default 0x40; 0x40–0x43 by the A0 pin). Configuration powers up at 0x7127; Manufacturer ID (0xFE) reads 0x5449 and Die ID (0xFF) 0x3220. Each channel's shunt (40 µV/LSB) and bus (8 mV/LSB) words are 13-bit two's complement left-aligned in 16 bits, D2:D0 zero, following the host's per-channel current through a 0.1 Ω shunt and bus voltage. The shunt-voltage sum follows SCC1..SCC3, and CVRF rises 6.6 ms after a Configuration write. Averaging, channel disable and the alert / power-valid / timing-control comparators are not modelled."
  category: i2c
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to 0x40 (A0 = GND); 0x41 (VS), 0x42 (SDA), 0x43 (SCL)."
  inputs:
    - { key: ch1_bus_voltage, label: "CH1 bus voltage", unit: "V", min: 0.0, max: 26.0, default: 5.0 }
    - { key: ch1_current, label: "CH1 current (0.1 Ω shunt)", unit: "A", min: -2.0, max: 2.0, default: 0.2 }
    - { key: ch2_bus_voltage, label: "CH2 bus voltage", unit: "V", min: 0.0, max: 26.0, default: 3.2 }
    - { key: ch2_current, label: "CH2 current (0.1 Ω shunt)", unit: "A", min: -2.0, max: 2.0, default: 0.1 }
    - { key: ch3_bus_voltage, label: "CH3 bus voltage", unit: "V", min: 0.0, max: 26.0, default: 12.0 }
    - { key: ch3_current, label: "CH3 current (0.1 Ω shunt)", unit: "A", min: -2.0, max: 2.0, default: 0.5 }
