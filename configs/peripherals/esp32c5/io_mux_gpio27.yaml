peripheral: IO_MUX GPIO27
version: 0.1.0
registers:
  - id: GPIO27
    address_offset: 0x6C
    size: 32
    access: READ_WRITE
    # ESP32-C5 TRM reset: FUN_DRV=2, MCU_SEL=1 (Function 1, GPIO).
    reset_value: 0x1800
    fields:
      - name: FUN_IE
        bit_range: [9, 9]
      - name: FUN_DRV
        bit_range: [10, 11]
      - name: MCU_SEL
        bit_range: [12, 14]
