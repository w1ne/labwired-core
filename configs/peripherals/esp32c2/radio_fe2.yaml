# ESP32-C2 FE2 (RF front end 2) power-up control: only the register esp-hal 1.2 writes
# (src/rtc_cntl/sleep/esp32c2.rs: FE2_TX_INTERP_CTRL = DR_REG_FE2_BASE + 0x00f0, RMW of the
# FORCE_PU bits in rtc_sleep_pu). No SVD covers the radio blocks. The bits
# store and read back; nothing behind them is modelled.
peripheral: RADIO_FE2
version: 0.1.0
registers:
- id: FE2_TX_INTERP_CTRL
  address_offset: 0xf0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields: []
  side_effects: null
