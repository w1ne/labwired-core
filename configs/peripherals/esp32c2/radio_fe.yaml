# ESP32-C2 FE (RF front end) power-up control: only the register esp-hal 1.2 writes
# (src/rtc_cntl/sleep/esp32c2.rs: FE_GEN_CTRL = DR_REG_FE_BASE + 0x0090, RMW of the
# FORCE_PU bits in rtc_sleep_pu). No SVD covers the radio blocks. The bits
# store and read back; nothing behind them is modelled.
peripheral: RADIO_FE
version: 0.1.0
registers:
- id: FE_GEN_CTRL
  address_offset: 0x90
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields: []
  side_effects: null
