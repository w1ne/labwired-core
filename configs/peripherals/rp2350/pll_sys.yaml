peripheral: PLL_SYS
version: 0.1.0
registers:
- id: CS
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: LOCK
    bit_range:
    - 31
    - 31
    description: PLL is locked
  - name: LOCK_N
    bit_range:
    - 30
    - 30
    description: PLL is not locked Ideally this is cleared when PLL lock is seen and this should never normally be set
  - name: BYPASS
    bit_range:
    - 8
    - 8
    description: Passes the reference clock to the output instead of the divided VCO. The VCO continues to run so the user can switch between the reference clock and the divided VCO but the output will glitch when doing so.
  - name: REFDIV
    bit_range:
    - 5
    - 0
    description: Divides the PLL input reference clock. Behaviour is undefined for div=0. PLL output will be unpredictable during refdiv changes, wait for lock=1 before using it.
  side_effects: null
- id: PWR
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 45
  fields:
  - name: VCOPD
    bit_range:
    - 5
    - 5
    description: PLL VCO powerdown To save power set high when PLL output not required or bypass=1.
  - name: POSTDIVPD
    bit_range:
    - 3
    - 3
    description: PLL post divider powerdown To save power set high when PLL output not required or bypass=1.
  - name: DSMPD
    bit_range:
    - 2
    - 2
    description: PLL DSM powerdown Nothing is achieved by setting this low.
  - name: PD
    bit_range:
    - 0
    - 0
    description: PLL powerdown To save power set high when PLL output not required.
  side_effects: null
- id: FBDIV_INT
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: FBDIV_INT
    bit_range:
    - 11
    - 0
    description: see ctrl reg description for constraints
  side_effects: null
- id: PRIM
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 487424
  fields:
  - name: POSTDIV1
    bit_range:
    - 18
    - 16
    description: divide by 1-7
  - name: POSTDIV2
    bit_range:
    - 14
    - 12
    description: divide by 1-7
  side_effects: null
- id: INTR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LOCK_N_STICKY
    bit_range:
    - 0
