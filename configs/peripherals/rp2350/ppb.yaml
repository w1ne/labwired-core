  side_effects: null
- id: DWT_CYCCNT
  address_offset: 4100
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CYCCNT
    bit_range:
    - 31
    - 0
    description: Increments one on each processor clock cycle when DWT_CTRL.CYCCNTENA == 1 and DEMCR.TRCENA == 1. On overflow, CYCCNT wraps to zero
  side_effects: null
- id: DWT_EXCCNT
  address_offset: 4108
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EXCCNT
    bit_range:
    - 7
    - 0
    description: 'Counts one on each cycle when all of the following are true: - DWT_CTRL.EXCEVTENA == 1 and DEMCR.TRCENA == 1. - No instruction is executed, see DWT_CPICNT. - An exception-entry or exception-exit related operation is in progress. - Either SecureNoninvasiveDebugAllowed() == TRUE, or NS-Req for the operation is set to Non-secure and NoninvasiveDebugAllowed() == TRUE.'
  side_effects: null
- id: DWT_LSUCNT
  address_offset: 4116
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSUCNT
    bit_range:
    - 7
    - 0
    description: 'Counts one on each cycle when all of the following are true: - DWT_CTRL.LSUEVTENA == 1 and DEMCR.TRCENA == 1. - No instruction is executed, see DWT_CPICNT. - No exception-entry or exception-exit operation is in progress, see DWT_EXCCNT. - A load-store operation is in progress. - Either SecureNoninvasiveDebugAllowed() == TRUE, or NS-Req for the operation is set to Non-secure and NoninvasiveDebugAllowed() == TRUE.'
  side_effects: null
- id: DWT_FOLDCNT
  address_offset: 4120
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: FOLDCNT
    bit_range:
    - 7
    - 0
    description: 'Counts on each cycle when all of the following are true: - DWT_CTRL.FOLDEVTENA == 1 and DEMCR.TRCENA == 1. - At least two instructions are executed, see DWT_CPICNT. - Either SecureNoninvasiveDebugAllowed() == TRUE, or the PE is in Non-secure state and NoninvasiveDebugAllowed() == TRUE. The counter is incremented by the number of instructions executed, minus one'
