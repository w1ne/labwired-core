- id: AIRCR
  address_offset: 60684
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: VECTKEY
    bit_range:
    - 31
    - 16
    description: 'Register key: Reads as Unknown On writes, write 0x05FA to VECTKEY, otherwise the write is ignored.'
  - name: ENDIANESS
    bit_range:
    - 15
    - 15
    description: 'Data endianness implemented: 0 = Little-endian.'
  - name: PRIS
    bit_range:
    - 14
    - 14
    description: "Prioritize Secure exceptions. The value of this bit defines whether Secure exception priority boosting is enabled. 0\tPriority ranges of Secure and Non-secure exceptions are identical. 1\tNon-secure exceptions are de-prioritized."
  - name: BFHFNMINS
    bit_range:
    - 13
    - 13
    description: "BusFault, HardFault, and NMI Non-secure enable. 0\tBusFault, HardFault, and NMI are Secure. 1\tBusFault and NMI are Non-secure and exceptions can target Non-secure HardFault."
  - name: PRIGROUP
    bit_range:
    - 10
    - 8
    description: Interrupt priority grouping field. This field determines the split of group priority from subpriority. See https://developer.arm.com/documentation/100235/0004/the-cortex-m33-peripherals/system-control-block/application-interrupt-and-reset-control-register?lang=en
  - name: SYSRESETREQS
    bit_range:
    - 3
    - 3
    description: "System reset request, Secure state only. 0\tSYSRESETREQ functionality is available to both Security states. 1 SYSRESETREQ functionality is only available to Secure state."
  - name: SYSRESETREQ
    bit_range:
    - 2
    - 2
    description: This resets only the core on which SYSRESETREQ is asserted, and not the wider system.
  - name: VECTCLRACTIVE
    bit_range:
    - 1
    - 1
    description: 'Clears all active state information for fixed and configurable exceptions. This bit: is self-clearing, can only be set by the DAP when the core is halted.  When set: clears all active exception status of the processor, forces a return to Thread mode, forces an IPSR of 0. A debugger must re-initialize the stack.'
  side_effects: null
- id: SCR
  address_offset: 60688
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SEVONPEND
    bit_range:
    - 4
    - 4
    description: 'Send Event on Pending bit: 0 = Only enabled interrupts or events can wakeup the processor, disabled interrupts are excluded. 1 = Enabled events and all interrupts, including disabled interrupts, can wakeup the processor. When an event or interrupt becomes pending, the event signal wakes up the processor from WFE. If the processor is not waiting for an event, the event is registered and affects the next WFE. The processor also wakes up on execution of an SEV instruction or an external event.'
  - name: SLEEPDEEPS
    bit_range:
    - 3
    - 3
    description: 0 SLEEPDEEP is available to both security states 1 SLEEPDEEP is only available to Secure state
  - name: SLEEPDEEP
    bit_range:
    - 2
    - 2
    description: 'Controls whether the processor uses sleep or deep sleep as its low power mode: 0 = Sleep. 1 = Deep sleep.'
  - name: SLEEPONEXIT
    bit_range:
    - 1
    - 1
    description: 'Indicates sleep-on-exit when returning from Handler mode to Thread mode: 0 = Do not sleep when returning to Thread mode. 1 = Enter sleep, or deep sleep, on return from an ISR to Thread mode. Setting this bit to 1 enables an interrupt driven application to avoid returning to an empty main application.'
  side_effects: null
