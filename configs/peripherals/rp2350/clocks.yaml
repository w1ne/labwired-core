peripheral: CLOCKS
version: 0.1.0
registers:
- id: CLK_GPOUT0_CTRL
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ENABLED
    bit_range:
    - 28
    - 28
    description: clock generator is enabled
  - name: NUDGE
    bit_range:
    - 20
    - 20
    description: An edge on this signal shifts the phase of the output by 1 cycle of the input clock This can be done at any time
  - name: PHASE
    bit_range:
    - 17
    - 16
    description: This delays the enable signal by up to 3 cycles of the input clock This must be set before the clock is enabled to have any effect
  - name: DC50
    bit_range:
    - 12
    - 12
    description: Enables duty cycle correction for odd divisors, can be changed on-the-fly
  - name: ENABLE
    bit_range:
    - 11
    - 11
    description: Starts and stops the clock generator cleanly
  - name: KILL
    bit_range:
    - 10
    - 10
    description: Asynchronously kills the clock generator, enable must be set low before deasserting kill
  - name: AUXSRC
    bit_range:
    - 8
    - 5
    description: Selects the auxiliary clock source, will glitch when switching
  side_effects: null
