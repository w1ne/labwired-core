peripheral: XOSC
version: 0.1.0
registers:
- id: CTRL
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ENABLE
    bit_range:
    - 23
    - 12
    description: On power-up this field is initialised to DISABLE and the chip runs from the ROSC. If the chip has subsequently been programmed to run from the XOSC then setting this field to DISABLE may lock-up the chip. If this is a concern then run the clk_ref from the ROSC and enable the clk_sys RESUS feature. The 12-bit code is intended to give some protection against accidental writes. An invalid setting will retain the previous value. The actual value being used can be read from STATUS_ENABLED
  - name: FREQ_RANGE
    bit_range:
    - 11
    - 0
    description: The 12-bit code is intended to give some protection against accidental writes. An invalid setting will retain the previous value. The actual value being used can be read from STATUS_FREQ_RANGE
  side_effects: null
- id: STATUS
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: STABLE
    bit_range:
    - 31
    - 31
    description: Oscillator is running and stable
  - name: BADWRITE
    bit_range:
    - 24
    - 24
    description: An invalid value has been written to CTRL_ENABLE or CTRL_FREQ_RANGE or DORMANT
  - name: ENABLED
    bit_range:
    - 12
    - 12
    description: Oscillator is enabled but not necessarily running and stable, resets to 0
  - name: FREQ_RANGE
    bit_range:
    - 1
    - 0
    description: The current frequency range setting
  side_effects: null
- id: DORMANT
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DORMANT
    bit_range:
    - 31
    - 0
    description: 'This is used to save power by pausing the XOSC On power-up this field is initialised to WAKE An invalid write will also select WAKE WARNING: stop the PLLs before selecting dormant mode WARNING: setup the irq before selecting dormant mode'
  side_effects: null
- id: STARTUP
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: X4
    bit_range:
    - 20
    - 20
    description: Multiplies the startup_delay by 4, just in case. The reset value is controlled by a mask-programmable tiecell and is provided in case we are booting from XOSC and the default startup delay is insufficient
  - name: DELAY
    bit_range:
    - 13
    - 0
    description: in multiples of 256*xtal_period. The reset value of 0xc4 corresponds to approx 50 000 cycles.
  side_effects: null
- id: COUNT
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: COUNT
    bit_range:
    - 15
    - 0
  side_effects: null
interrupts: null
timing: null
