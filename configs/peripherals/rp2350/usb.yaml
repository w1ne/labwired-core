  - name: TRANSCEIVER_PD
    bit_range:
    - 18
    - 18
    description: Power down bus transceiver
  - name: RPU_OPT
    bit_range:
    - 17
    - 17
    description: 'Device: Pull-up strength (0=1K2, 1=2k3)'
  - name: PULLUP_EN
    bit_range:
    - 16
    - 16
    description: 'Device: Enable pull up resistor'
  - name: PULLDOWN_EN
    bit_range:
    - 15
    - 15
    description: 'Host: Enable pull down resistors'
  - name: RESET_BUS
    bit_range:
    - 13
    - 13
    description: 'Host: Reset bus'
  - name: RESUME
    bit_range:
    - 12
    - 12
    description: 'Device: Remote wakeup. Device can initiate its own resume after suspend.'
  - name: VBUS_EN
    bit_range:
    - 11
    - 11
    description: 'Host: Enable VBUS'
  - name: KEEP_ALIVE_EN
    bit_range:
    - 10
    - 10
    description: 'Host: Enable keep alive packet (for low speed bus)'
  - name: SOF_EN
    bit_range:
    - 9
    - 9
    description: 'Host: Enable SOF generation (for full speed bus)'
  - name: SOF_SYNC
    bit_range:
    - 8
    - 8
    description: 'Host: Delay packet(s) until after SOF'
  - name: PREAMBLE_EN
    bit_range:
    - 6
    - 6
    description: 'Host: Preable enable for LS device on FS hub'
  - name: STOP_TRANS
    bit_range:
    - 4
    - 4
    description: 'Host: Stop transaction'
  - name: RECEIVE_DATA
    bit_range:
    - 3
    - 3
    description: 'Host: Receive transaction (IN to host)'
  - name: SEND_DATA
    bit_range:
    - 2
    - 2
    description: 'Host: Send transaction (OUT from host)'
  - name: SEND_SETUP
    bit_range:
    - 1
    - 1
    description: 'Host: Send Setup packet'
  - name: START_TRANS
    bit_range:
    - 0
    - 0
    description: 'Host: Start transaction'
  side_effects: null
- id: SIE_STATUS
  address_offset: 80
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DATA_SEQ_ERROR
    bit_range:
    - 31
    - 31
    description: 'Data Sequence Error. The device can raise a sequence error in the following conditions: * A SETUP packet is received followed by a DATA1 packet (data phase should always be DATA0) * An OUT packet is received from the host but doesn''t match the data pid in the buffer control register read from DPSRAM The host can raise a data sequence error in the following conditions: * An IN packet from the device has the wrong data PID'
  - name: ACK_REC
    bit_range:
    - 30
    - 30
    description: ACK received. Raised by both host and device.
  - name: STALL_REC
    bit_range:
    - 29
    - 29
    description: 'Host: STALL received'
  - name: NAK_REC
    bit_range:
    - 28
    - 28
    description: 'Host: NAK received'
  - name: RX_TIMEOUT
    bit_range:
    - 27
    - 27
    description: RX timeout is raised by both the host and device if an ACK is not received in the maximum time specified by the USB spec.
  - name: RX_OVERFLOW
    bit_range:
    - 26
    - 26
    description: RX overflow is raised by the Serial RX engine if the incoming data is too fast.
  - name: BIT_STUFF_ERROR
    bit_range:
    - 25
    - 25
    description: Bit Stuff Error. Raised by the Serial RX engine.
  - name: CRC_ERROR
    bit_range:
    - 24
    - 24
    description: CRC Error. Raised by the Serial RX engine.
  - name: ENDPOINT_ERROR
    bit_range:
    - 23
    - 23
    description: An endpoint has encountered an error. Read the ep_rx_error and ep_tx_error registers to find out which endpoint had an error.
  - name: BUS_RESET
    bit_range:
    - 19
    - 19
    description: 'Device: bus reset received'
  - name: TRANS_COMPLETE
    bit_range:
    - 18
    - 18
    description: 'Transaction complete. Raised by device if: * An IN or OUT packet is sent with the `LAST_BUFF` bit set in the buffer control register Raised by host if: * A setup packet is sent when no data in or data out transaction follows * An IN packet is received and the `LAST_BUFF` bit is set in the buffer control register * An IN packet is received with zero length * An OUT packet is sent and the `LAST_BUFF` bit is set'
  - name: SETUP_REC
    bit_range:
    - 17
    - 17
    description: 'Device: Setup packet received'
  - name: CONNECTED
    bit_range:
    - 16
    - 16
    description: 'Device: connected'
  - name: RX_SHORT_PACKET
    bit_range:
    - 12
    - 12
    description: 'Device or Host has received a short packet. This is when the data received is less than configured in the buffer control register. Device: If using double buffered mode on device the buffer select will not be toggled after writing status back to the buffer control register. This is to prevent any further transactions on that endpoint until the user has reset the buffer control registers. Host: the current transfer will be stopped early.'
  - name: RESUME
    bit_range:
    - 11
    - 11
    description: 'Host: Device has initiated a remote resume. Device: host has initiated a resume.'
  - name: VBUS_OVER_CURR
    bit_range:
    - 10
    - 10
    description: VBUS over current detected
  - name: SPEED
    bit_range:
    - 9
    - 8
    description: 'Host: device speed. Disconnected = 00, LS = 01, FS = 10'
  - name: SUSPENDED
    bit_range:
    - 4
    - 4
    description: Bus in suspended state. Valid for device and host. Host and device will go into suspend if neither Keep Alive / SOF frames are enabled.
  - name: LINE_STATE
    bit_range:
    - 3
    - 2
    description: USB bus line state
  - name: VBUS_DETECTED
    bit_range:
    - 0
    - 0
    description: 'Device: VBUS Detected'
  side_effects: null
