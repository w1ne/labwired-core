- id: LINESTATE_TUNING
  address_offset: 136
  size: 32
  access: READ_WRITE
  reset_value: 248
  fields:
  - name: SPARE_FIX
    bit_range:
    - 11
    - 8
  - name: DEV_LS_WAKE_FIX
    bit_range:
    - 7
    - 7
    description: Device - exit suspend on any non-idle signalling, not qualified with a 1ms timer
  - name: DEV_RX_ERR_QUIESCE
    bit_range:
    - 6
    - 6
    description: Device - suppress repeated errors until the device FSM is next in the process of decoding an inbound packet.
  - name: SIE_RX_CHATTER_SE0_FIX
    bit_range:
    - 5
    - 5
    description: RX - when recovering from line chatter or bitstuff errors, treat SE0 as the end of chatter as well as 8 consecutive idle bits.
  - name: SIE_RX_BITSTUFF_FIX
    bit_range:
    - 4
    - 4
    description: RX - when a bitstuff error is signalled by rx_dasm, unconditionally terminate RX decode to avoid a hang during certain packet phases.
  - name: DEV_BUFF_CONTROL_DOUBLE_READ_FIX
    bit_range:
    - 3
    - 3
    description: Device - the controller FSM performs two reads of the buffer status memory address to avoid sampling metastable data. An enabled buffer is only used if both reads match.
  - name: MULTI_HUB_FIX
    bit_range:
    - 2
    - 2
    description: Host - increase inter-packet and turnaround timeouts to accommodate worst-case hub delays.
  - name: LINESTATE_DELAY
    bit_range:
    - 1
    - 1
    description: Device/Host - add an extra 1-bit debounce of linestate sampling.
  - name: RCV_DELAY
    bit_range:
    - 0
    - 0
    description: Device - register the received data to account for hub bit dribble before EOP. Only affects certain hubs.
  side_effects: null
