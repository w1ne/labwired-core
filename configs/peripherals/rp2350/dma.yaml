    description: If 1, the TIMER0 register is only accessible from a Secure context, and timer DREQ 0 is only visible to Secure channels.
  - name: TIMER0_P
    bit_range:
    - 2
    - 2
    description: If 1, the TIMER0 register is only accessible from a Privileged (or more Secure) context, and timer DREQ 0 is only visible to Privileged (or more Secure) channels.
  - name: SNIFF_S
    bit_range:
    - 1
    - 1
    description: If 1, the sniffer can see data transfers from Secure channels, and can itself only be accessed from a Secure context. If 0, the sniffer can be accessed from either a Secure or Non-secure context, but can not see data transfers of Secure channels.
  - name: SNIFF_P
    bit_range:
    - 0
    - 0
    description: If 1, the sniffer can see data transfers from Privileged channels, and can itself only be accessed from a privileged context, or from a Secure context when SNIFF_S is 0. If 0, the sniffer can be accessed from either a Privileged or Unprivileged context (with sufficient security level) but can not see transfers from Privileged channels.
  side_effects: null
- id: MPU_CTRL
  address_offset: 1280
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: NS_HIDE_ADDR
    bit_range:
    - 3
    - 3
    description: By default, when a region's S bit is clear, Non-secure-Privileged reads can see the region's base address and limit address. Set this bit to make the addresses appear as 0 to Non-secure reads, even when the region is Non-secure, to avoid leaking information about the processor SAU map.
  - name: S
    bit_range:
    - 2
    - 2
    description: Determine whether an address not covered by an active MPU region is Secure (1) or Non-secure (0)
  - name: P
    bit_range:
    - 1
    - 1
    description: Determine whether an address not covered by an active MPU region is Privileged (1) or Unprivileged (0)
  side_effects: null
