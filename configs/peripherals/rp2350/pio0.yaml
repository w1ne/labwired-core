- id: SM0_CLKDIV
  address_offset: 200
  size: 32
  access: READ_WRITE
  reset_value: 65536
  fields:
  - name: INT
    bit_range:
    - 31
    - 16
    description: Effective frequency is sysclk/(int + frac/256). Value of 0 is interpreted as 65536. If INT is 0, FRAC must also be 0.
  - name: FRAC
    bit_range:
    - 15
    - 8
    description: Fractional part of clock divisor
  side_effects: null
- id: SM0_EXECCTRL
  address_offset: 204
  size: 32
  access: READ_WRITE
  reset_value: 126976
  fields:
  - name: EXEC_STALLED
    bit_range:
    - 31
    - 31
    description: If 1, an instruction written to SMx_INSTR is stalled, and latched by the state machine. Will clear to 0 once this instruction completes.
  - name: SIDE_EN
    bit_range:
    - 30
    - 30
    description: If 1, the MSB of the Delay/Side-set instruction field is used as side-set enable, rather than a side-set data bit. This allows instructions to perform side-set optionally, rather than on every instruction, but the maximum possible side-set width is reduced from 5 to 4. Note that the value of PINCTRL_SIDESET_COUNT is inclusive of this enable bit.
  - name: SIDE_PINDIR
    bit_range:
    - 29
    - 29
    description: If 1, side-set data is asserted to pin directions, instead of pin values
  - name: JMP_PIN
    bit_range:
    - 28
    - 24
    description: The GPIO number to use as condition for JMP PIN. Unaffected by input mapping.
  - name: OUT_EN_SEL
    bit_range:
    - 23
    - 19
    description: Which data bit to use for inline OUT enable
  - name: INLINE_OUT_EN
    bit_range:
    - 18
    - 18
    description: If 1, use a bit of OUT data as an auxiliary write enable When used in conjunction with OUT_STICKY, writes with an enable of 0 will deassert the latest pin write. This can create useful masking/override behaviour due to the priority ordering of state machine pin writes (SM0 < SM1 < ...)
  - name: OUT_STICKY
    bit_range:
    - 17
    - 17
    description: Continuously assert the most recent OUT/SET to the pins
  - name: WRAP_TOP
    bit_range:
    - 16
    - 12
    description: After reaching this address, execution is wrapped to wrap_bottom. If the instruction is a jump, and the jump condition is true, the jump takes priority.
  - name: WRAP_BOTTOM
    bit_range:
    - 11
    - 7
    description: After reaching wrap_top, execution is wrapped to this address.
  - name: STATUS_SEL
    bit_range:
    - 6
    - 5
    description: Comparison used for the MOV x, STATUS instruction.
  - name: STATUS_N
    bit_range:
    - 4
    - 0
    description: Comparison level or IRQ index for the MOV x, STATUS instruction. If STATUS_SEL is TXLEVEL or RXLEVEL, then values of STATUS_N greater than the current FIFO depth are reserved, and have undefined behaviour.
  side_effects: null
- id: SM0_SHIFTCTRL
  address_offset: 208
  size: 32
  access: READ_WRITE
  reset_value: 786432
  fields:
  - name: FJOIN_RX
    bit_range:
    - 31
    - 31
    description: When 1, RX FIFO steals the TX FIFO's storage, and becomes twice as deep. TX FIFO is disabled as a result (always reads as both full and empty). FIFOs are flushed when this bit is changed.
  - name: FJOIN_TX
    bit_range:
    - 30
    - 30
    description: When 1, TX FIFO steals the RX FIFO's storage, and becomes twice as deep. RX FIFO is disabled as a result (always reads as both full and empty). FIFOs are flushed when this bit is changed.
  - name: PULL_THRESH
    bit_range:
    - 29
    - 25
    description: Number of bits shifted out of OSR before autopull, or conditional pull (PULL IFEMPTY), will take place. Write 0 for value of 32.
  - name: PUSH_THRESH
    bit_range:
    - 24
    - 20
    description: Number of bits shifted into ISR before autopush, or conditional push (PUSH IFFULL), will take place. Write 0 for value of 32.
  - name: OUT_SHIFTDIR
    bit_range:
    - 19
    - 19
    description: 1 = shift out of output shift register to right. 0 = to left.
  - name: IN_SHIFTDIR
    bit_range:
    - 18
    - 18
    description: 1 = shift input shift register to right (data enters from left). 0 = to left.
  - name: AUTOPULL
    bit_range:
    - 17
    - 17
    description: Pull automatically when the output shift register is emptied, i.e. on or following an OUT instruction which causes the output shift counter to reach or exceed PULL_THRESH.
  - name: AUTOPUSH
    bit_range:
    - 16
    - 16
    description: Push automatically when the input shift register is filled, i.e. on an IN instruction which causes the input shift counter to reach or exceed PUSH_THRESH.
  - name: FJOIN_RX_PUT
    bit_range:
    - 15
    - 15
    description: If 1, disable this state machine's RX FIFO, make its storage available for random write access by the state machine (using the `put` instruction) and, unless FJOIN_RX_GET is also set, random read access by the processor (through the RXFx_PUTGETy registers). If FJOIN_RX_PUT and FJOIN_RX_GET are both set, then the RX FIFO's registers can be randomly read/written by the state machine, but are completely inaccessible to the processor. Setting this bit will clear the FJOIN_TX and FJOIN_RX bits.
  - name: FJOIN_RX_GET
    bit_range:
    - 14
    - 14
    description: If 1, disable this state machine's RX FIFO, make its storage available for random read access by the state machine (using the `get` instruction) and, unless FJOIN_RX_PUT is also set, random write access by the processor (through the RXFx_PUTGETy registers). If FJOIN_RX_PUT and FJOIN_RX_GET are both set, then the RX FIFO's registers can be randomly read/written by the state machine, but are completely inaccessible to the processor. Setting this bit will clear the FJOIN_TX and FJOIN_RX bits.
  - name: IN_COUNT
    bit_range:
    - 4
    - 0
    description: Set the number of pins which are not masked to 0 when read by an IN PINS, WAIT PIN or MOV x, PINS instruction. For example, an IN_COUNT of 5 means that the 5 LSBs of the IN pin group are visible (bits 4:0), but the remaining 27 MSBs are masked to 0. A count of 32 is encoded with a field value of 0, so the default behaviour is to not perform any masking. Note this masking is applied in addition to the masking usually performed by the IN instruction. This is mainly useful for the MOV x, PINS instruction, which otherwise has no way of masking pins.
  side_effects: null
