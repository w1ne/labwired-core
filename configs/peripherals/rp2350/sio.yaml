- id: TMDS_CTRL
  address_offset: 448
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CLEAR_BALANCE
    bit_range:
    - 28
    - 28
    description: Clear the running DC balance state of the TMDS encoders. This bit should be written once at the beginning of each scanline.
  - name: PIX2_NOSHIFT
    bit_range:
    - 27
    - 27
    description: When encoding two pixels's worth of symbols in one cycle (a read of a PEEK/POP_DOUBLE register), the second encoder sees a shifted version of the colour data register. This control disables that shift, so that both encoder layers see the same pixel data. This is used for pixel doubling.
  - name: PIX_SHIFT
    bit_range:
    - 26
    - 24
    description: Shift applied to the colour data register with each read of a POP alias register. Reading from the POP_SINGLE register, or reading from the POP_DOUBLE register with PIX2_NOSHIFT set (for pixel doubling), shifts by the indicated amount. Reading from a POP_DOUBLE register when PIX2_NOSHIFT is clear will shift by double the indicated amount. (Shift by 32 means no shift.)
  - name: INTERLEAVE
    bit_range:
    - 23
    - 23
    description: Enable lane interleaving for reads of PEEK_SINGLE/POP_SINGLE. When interleaving is disabled, each of the 3 symbols appears as a contiguous 10-bit field, with lane 0 being the least-significant and starting at bit 0 of the register. When interleaving is enabled, the symbols are packed into 5 chunks of 3 lanes times 2 bits (30 bits total). Each chunk contains two bits of a TMDS symbol per lane, with lane 0 being the least significant.
  - name: L2_NBITS
    bit_range:
    - 20
    - 18
    description: Number of valid colour MSBs for lane 2 (1-8 bits, encoded as 0 through 7). Remaining LSBs are masked to 0 after the rotate.
  - name: L1_NBITS
    bit_range:
    - 17
    - 15
    description: Number of valid colour MSBs for lane 1 (1-8 bits, encoded as 0 through 7). Remaining LSBs are masked to 0 after the rotate.
  - name: L0_NBITS
    bit_range:
    - 14
    - 12
    description: Number of valid colour MSBs for lane 0 (1-8 bits, encoded as 0 through 7). Remaining LSBs are masked to 0 after the rotate.
  - name: L2_ROT
    bit_range:
    - 11
    - 8
    description: Right-rotate the 16 LSBs of the colour accumulator by 0-15 bits, in order to get the MSB of the lane 2 (red) colour data aligned with the MSB of the 8-bit encoder input. For example, for RGB565 (red most significant), red is bits 15:11, so should be right-rotated by 8 bits to align with bits 7:3 of the encoder input.
  - name: L1_ROT
    bit_range:
    - 7
    - 4
    description: Right-rotate the 16 LSBs of the colour accumulator by 0-15 bits, in order to get the MSB of the lane 1 (green) colour data aligned with the MSB of the 8-bit encoder input. For example, for RGB565, green is bits 10:5, so should be right-rotated by 3 bits to align with bits 7:2 of the encoder input.
  - name: L0_ROT
    bit_range:
    - 3
    - 0
    description: Right-rotate the 16 LSBs of the colour accumulator by 0-15 bits, in order to get the MSB of the lane 0 (blue) colour data aligned with the MSB of the 8-bit encoder input. For example, for RGB565 (red most significant), blue is bits 4:0, so should be right-rotated by 13 to align with bits 7:3 of the encoder input.
  side_effects: null
