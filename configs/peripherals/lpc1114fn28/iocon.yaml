# NXP LPC111x IOCON (I/O configuration, 0x4004_4000).
# Register offsets and reset values: NXP CMSIS-SVD LPC11xx_v6a.svd
# (cmsis-svd-data, peripheral IOCON): 0xD0 (FUNC 0, MODE pull-up,
# hysteresis off) on the GPIO pads, 0x00 on the true open-drain I2C pads
# PIO0_4/PIO0_5 and the *_LOC pin-location selects.
# Stored only: pin function, pull and open-drain settings do not reach the
# GPIO model (lpc11xx_gpio treats every pad as a GPIO with the reset pull-up).
peripheral: IOCON
version: 0.1.0
