  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "SPI1 clock divder"
- id: WDTCLKSEL
  address_offset: 0x0D0
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "WDT clock source select"
- id: WDTCLKUEN
  address_offset: 0x0D4
  size: 32
  access: READ_WRITE
