- id: STARTRSRP0CLR
  address_offset: 0x208
  size: 32
  access: WRITE_ONLY
  reset_value: 0x00000000
  description: "Start logic reset register 0"
- id: STARTSRP0
  address_offset: 0x20C
  size: 32
  access: READ_ONLY
  reset_value: 0x00000000
