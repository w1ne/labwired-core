# NXP LPC1114FN28/102 SYSCON (system configuration, 0x4004_8000).
# Register offsets, access and reset values: NXP CMSIS-SVD LPC11xx_v6a.svd
# (cmsis-svd-data, peripheral SYSCON), except:
# - DEVICE_ID 0x1A40902B: LPC1114FN28/102 / LPC1114FDH28/102 (current silicon
#   revision; lpc21isp lpcprog.c part table, which also lists 0x0A40902B for
#   the earlier revision). The v6 SVD predates the /102 parts.
# - SYSPLLSTAT.LOCK: set once firmware powers the PLL up (PDRUNCFG.SYSPLL_PD,
#   bit 7, written 0) and cleared when it powers it down. The real lock time
#   (and the MSEL/PSEL frequency) is not modelled: the core clock stays at
#   the chip's cpu_hz whatever SYSPLLCTRL/MAINCLKSEL select.
# The clock-source update registers (SYSPLLCLKUEN, MAINCLKUEN, ...) are plain
# read-write: CMSIS SystemInit writes 1, 0, 1 and polls bit 0 back.
peripheral: SYSCON
version: 0.1.0
registers:
- id: SYSMEMREMAP
  address_offset: 0x000
  size: 32
  access: READ_WRITE
  reset_value: 0x00000002
  description: "System memory remap"
- id: PRESETCTRL
  address_offset: 0x004
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "Peripheral reset control"
- id: SYSPLLCTRL
  address_offset: 0x008
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "System PLL control"
- id: SYSPLLSTAT
  address_offset: 0x00C
  size: 32
  access: READ_ONLY
  reset_value: 0x00000000
  description: "System PLL status"
- id: SYSOSCCTRL
  address_offset: 0x020
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "System oscillator control"
- id: WDTOSCCTRL
  address_offset: 0x024
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "Watchdog oscillator control"
- id: IRCCTRL
  address_offset: 0x028
  size: 32
  access: READ_WRITE
  reset_value: 0x00000080
  description: "IRC control"
- id: SYSRSTSTAT
  address_offset: 0x030
  size: 32
  access: READ_ONLY
  reset_value: 0x00000000
  description: "System reset status register"
- id: SYSPLLCLKSEL
  address_offset: 0x040
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
