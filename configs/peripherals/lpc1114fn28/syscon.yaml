- id: PDSLEEPCFG
  address_offset: 0x230
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "Power-down states in Deep-sleep mode"
- id: PDAWAKECFG
  address_offset: 0x234
  size: 32
  access: READ_WRITE
  reset_value: 0x0000EDF0
  description: "Power-down states after wake-up from Deep-sleep mode"
- id: PDRUNCFG
  address_offset: 0x238
  size: 32
  access: READ_WRITE
  reset_value: 0x0000EDF0
  description: "Power-down configuration register"
- id: DEVICE_ID
  address_offset: 0x3F4
  size: 32
  access: READ_ONLY
  reset_value: 0x1A40902B
  description: "Device ID register 0 for parts LPC1100, LPC1100C, LPC1100L."
timing:
- id: syspll_lock
  trigger: !write
    { register: PDRUNCFG, value: 0x00, mask: 0x80 }
  delay_cycles: 1
  action:
    set_bits: { register: SYSPLLSTAT, bits: 0x1 }
- id: syspll_unlock
  trigger: !write
    { register: PDRUNCFG, value: 0x80, mask: 0x80 }
  delay_cycles: 1
  action:
    clear_bits: { register: SYSPLLSTAT, bits: 0x1 }
