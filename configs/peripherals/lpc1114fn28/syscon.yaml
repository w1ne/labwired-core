- id: MAINCLKSEL
  address_offset: 0x070
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "Main clock source select"
- id: MAINCLKUEN
  address_offset: 0x074
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "Main clock source update enable"
- id: SYSAHBCLKDIV
  address_offset: 0x078
  size: 32
  access: READ_WRITE
  reset_value: 0x00000001
  description: "System AHB clock divider"
- id: SYSAHBCLKCTRL
  address_offset: 0x080
  size: 32
  access: READ_WRITE
  reset_value: 0x0000085F
  description: "System AHB clock control"
- id: SSP0CLKDIV
  address_offset: 0x094
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "SPI0 clock divider"
- id: UARTCLKDIV
  address_offset: 0x098
  size: 32
  access: READ_WRITE
  reset_value: 0x00000000
  description: "UART clock divder"
- id: SSP1CLKDIV
