# ESP32-S3 Timer Group 0 (TIMG0)
# Based on ESP32-S3 Technical Reference Manual

peripheral: "TIMG0"
version: "0.1.0"

registers:
  - id: "T0CONFIG"
    address_offset: 0x000
    size: 32
    access: "R/W"
    # TRM v1.8 Register 12.1 (p.662): INCREASE=1 (b30), AUTORELOAD=1 (b29),
    # DIVIDER=0x01 (b28:13). Everything else resets to 0.
    reset_value: 0x60002000
    fields:
      - name: "USE_XTAL"
        bit_range: [9, 9]
      - name: "ALARM_EN"
        bit_range: [10, 10]
      - name: "DIVCNT_RST"
        bit_range: [12, 12]
      - name: "DIVIDER"
        bit_range: [28, 13]
      - name: "AUTORELOAD"
        bit_range: [29, 29]
      - name: "INCREASE"
        bit_range: [30, 30]
      - name: "EN"
        bit_range: [31, 31]

  - id: "T0LO"
    address_offset: 0x004
    size: 32
    access: "RO"
    reset_value: 0x00000000

  - id: "T0HI"
    address_offset: 0x008
    size: 32
    access: "RO"
    reset_value: 0x00000000

  - id: "T0UPDATE"
    address_offset: 0x00C
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "T0ALARMLO"
    address_offset: 0x010
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "T0ALARMHI"
    address_offset: 0x014
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "T0LOADLO"
    address_offset: 0x018
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "T0LOADHI"
    address_offset: 0x01C
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "T0LOAD"
    address_offset: 0x020
    size: 32
    access: "WO"
    reset_value: 0x00000000

  - id: "T1CONFIG"
    address_offset: 0x024
    size: 32
    access: "R/W"
    # Same layout and same reset as T0CONFIG — TRM v1.8 documents both as
    # TIMG_TxCONFIG_REG (x: 0-1), Register 12.1 (p.662).
    reset_value: 0x60002000

  - id: "T1LO"
    address_offset: 0x028
    size: 32
    access: "RO"
    reset_value: 0x00000000

  - id: "T1HI"
    address_offset: 0x02C
    size: 32
    access: "RO"
    reset_value: 0x00000000

  - id: "T1UPDATE"
    address_offset: 0x030
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "WDTCONFIG0"
    address_offset: 0x048
    size: 32
    access: "R/W"
    # TRM v1.8 Register 12.10 (p.665): CPU_RESET_LENGTH=0x1 (b20:18),
    # SYS_RESET_LENGTH=0x1 (b17:15), FLASHBOOT_MOD_EN=1 (b14). Flash-boot
    # protection is ARMED out of reset — a model that says 0 here claims the
    # opposite.
    reset_value: 0x0004C000

  - id: "WDTCONFIG1"
    address_offset: 0x04C
    size: 32
    access: "R/W"
    reset_value: 0x00010000

  - id: "WDTCONFIG2"
    address_offset: 0x050
    size: 32
    access: "R/W"
    # WDT_STG0_HOLD. TRM v1.8 Register 12.12 (p.666) states 26000000.
    reset_value: 0x018CBA80

  - id: "WDTCONFIG3"
    address_offset: 0x054
    size: 32
    access: "R/W"
    # WDT_STG1_HOLD. TRM v1.8 Register 12.13 (p.666): 0x7ffffff.
    reset_value: 0x07FFFFFF

  - id: "WDTCONFIG4"
    address_offset: 0x058
    size: 32
    access: "R/W"
    # WDT_STG2_HOLD. TRM v1.8 Register 12.14 (p.666): 0x0fffff.
    reset_value: 0x000FFFFF

  - id: "WDTCONFIG5"
    address_offset: 0x05C
    size: 32
    access: "R/W"
    # WDT_STG3_HOLD. TRM v1.8 Register 12.15 (p.667): 0x0fffff.
    reset_value: 0x000FFFFF

  - id: "WDTFEED"
    address_offset: 0x060
    size: 32
    access: "WO"
    reset_value: 0x00000000

  - id: "WDTWPROTECT"
    address_offset: 0x064
    size: 32
    access: "R/W"
    reset_value: 0x50D83AA1

  - id: "INT_ENA_TIMERS"
    address_offset: 0x070
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "INT_RAW_TIMERS"
    address_offset: 0x074
    size: 32
    access: "R/W"
    reset_value: 0x00000000

  - id: "INT_ST_TIMERS"
    address_offset: 0x078
    size: 32
    access: "RO"
    reset_value: 0x00000000

  - id: "INT_CLR_TIMERS"
    address_offset: 0x07C
    size: 32
    access: "WO"
    reset_value: 0x00000000
    side_effects:
      write_action: oneToClear

  - id: "RTCCALICFG"
    address_offset: 0x068
    size: 32
    access: "R/W"
    # TRM v1.8 Register 12.18 (p.668): RTC_CALI_MAX=0x01 (b30:16),
    # RTC_CALI_CLK_SEL=0x1 (b14:13), RTC_CALI_START_CYCLING=1 (b12).
    reset_value: 0x00013000

  - id: "RTCCALICFG1"
    address_offset: 0x06C
    size: 32
    access: "RO"
    reset_value: 0x00000000

  - id: "REGCLK"
    address_offset: 0x0FC
    size: 32
    access: "R/W"
    reset_value: 0x00000000

interrupts:
  TG0_T0_LEVEL: 32
  TG0_T1_LEVEL: 33
  TG0_WDT_LEVEL: 34
