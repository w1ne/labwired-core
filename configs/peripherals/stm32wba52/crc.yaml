peripheral: CRC
version: 0.1.0
registers:
- id: CRC_DR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 4294967295
  fields:
  - name: DR
    bit_range:
    - 31
    - 0
    description: |-
      Data register bits
      This register is used to write new data to the CRC calculator.
      It holds the previous CRC calculation result when it is read.
      If the data size is less than 32 bits, the least significant bits are used to write/read the correct value.
  side_effects: null
- id: CRC_IDR
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: IDR
    bit_range:
    - 31
    - 0
    description: |-
      General-purpose 32-bit data register bits
      These bits can be used as a temporary storage location for four bytes.
      This register is not affected by CRC resets generated by the RESET bit in the CRC_CR register
  side_effects: null
- id: CRC_CR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RESET
    bit_range:
    - 0
    - 0
    description: |-
      RESET bit
      This bit is set by software to reset the CRC calculation unit and set the data register to the value stored in the CRC_INIT register. This bit can only be set, it is automatically cleared by hardware
  - name: POLYSIZE
    bit_range:
    - 4
    - 3
    description: |-
      Polynomial size
      These bits control the size of the polynomial.
  - name: REV_IN
    bit_range:
    - 6
    - 5
    description: |-
      Reverse input data
      These bits control the reversal of the bit order of the input data
  - name: REV_OUT
    bit_range:
    - 7
    - 7
    description: |-
      Reverse output data

      This bit controls the reversal of the bit order of the output data.
  side_effects: null
- id: CRC_INIT
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 4294967295
  fields:
  - name: CRC_INIT
    bit_range:
    - 31
    - 0
    description: |-
      Programmable initial CRC value

      This register is used to write the CRC initial value.
  side_effects: null
- id: CRC_POL
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 79764919
  fields:
  - name: POL
    bit_range:
    - 31
    - 0
    description: "Programmable polynomial \n\nThis register is used to write the coefficients of the polynomial to be used for CRC calculation.\n\nIf the polynomial size is less than 32 bits, the least significant bits have to be used to program the correct value."
  side_effects: null
interrupts: null
timing: null
