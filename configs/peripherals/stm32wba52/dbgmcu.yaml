- id: DBGMCU_SR
  address_offset: 252
  size: 32
  access: READ_ONLY
  reset_value: 3
  fields:
  - name: AP_PRESENT
    bit_range:
    - 15
    - 0
    description: Bit n identifies whether access port APn is present in device Bit n = 0: APn absent Bit n = 1: APn present
  - name: AP_ENABLED
    bit_range:
    - 31
    - 16
    description: Bit n identifies whether access port APn is open (can be accessed via the debug port) or locked (debug access to the APn is blocked, except for DBGMCU access) Bit n = 0: APn locked (except for access to DBGMCU) Bit n = 1: APn enabled
  side_effects: null
