# ⚠️ HAND-EDITED after `svd-ingestor`: PCLKSR.reset_value.
#
# The SVD gives PCLKSR a reset value of 0 — correct for the instant power-on,
# and a boot-blocker for every SAM D21 firmware there is. Each of these bits
# is a clock-ready flag the startup code SPINS on:
#
#     while (!SYSCTRL->PCLKSR.bit.DFLLRDY) { }      // Arduino SAMD core
#     while (!(SYSCTRL->PCLKSR.reg & SYSCTRL_PCLKSR_DFLLLCKC)) { }
#
# Nothing in this model ever sets them, so a reset value of 0 is not a
# conservative default — it is a hang before `main()`, with no error and no
# output. The oscillators in this twin are ready the moment they are asked
# for, so the honest reset value is "every ready flag set".
#
# Set (0x1_8ADF): XOSCRDY[0], XOSC32KRDY[1], OSC32KRDY[2], OSC8MRDY[3],
# DFLLRDY[4], DFLLLCKF[6], DFLLLCKC[7], BOD33RDY[9], B33SRDY[11],
# DPLLLCKR[15], DPLLLCKF[16].
#
# Deliberately NOT set — these are FAULTS, not readiness, and asserting them
# would report a failure that never happened: DFLLOOB[5] (DFLL out of bounds),
# DFLLRCS[8] (DFLL reference clock stopped), BOD33DET[10] (brown-out
# detected), DPLLLTO[17] (DPLL lock timeout).
#
# Regenerating this file from the SVD DROPS this value. Re-apply it.
