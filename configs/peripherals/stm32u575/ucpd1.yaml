peripheral: UCPD1
version: 0.1.0
registers:
- id: UCPD_CFGR1
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: HBITCLKDIV
    bit_range:
    - 5
    - 0
    description: Division ratio for producing half-bit clock The bitfield determines the division ratio (the bitfield value plus one) of a ucpd_clk divider producing half-bit clock (hbit_clk).
  - name: IFRGAP
    bit_range:
    - 10
    - 6
    description: Division ratio for producing inter-frame gap timer clock The bitfield determines the division ratio (the bitfield value minus one) of a ucpd_clk divider producing inter-frame gap timer clock (tInterFrameGap). The division ratio 15 is to apply for Tx clock at the USB PD 2.0 specification nominal value. The division ratios below 15 are to apply for Tx clock below nominal, and the division ratios above 15 for Tx clock above nominal.
  - name: TRANSWIN
    bit_range:
    - 15
    - 11
    description: Transition window duration The bitfield determines the division ratio (the bitfield value minus one) of a hbit_clk divider producing tTransitionWindow interval. Set a value that produces an interval of 12 to 20 us, taking into account the ucpd_clk frequency and the HBITCLKDIV[5:0] bitfield setting.
  - name: PSC_USBPDCLK
    bit_range:
    - 19
    - 17
    description: Pre-scaler division ratio for generating ucpd_clk The bitfield determines the division ratio of a kernel clock pre-scaler producing UCPD peripheral clock (ucpd_clk). It is recommended to use the pre-scaler so as to set the ucpd_clk frequency in the range from 6 to 9 MHz.
  - name: RXORDSETEN
    bit_range:
    - 28
    - 20
    description: 'Receiver ordered set enable The bitfield determines the types of ordered sets that the receiver must detect. When set/cleared, each bit enables/disables a specific function: 0bxxxxxxxx1: SOP detect enabled 0bxxxxxxx1x: SOP'' detect enabled 0bxxxxxx1xx: SOP'''' detect enabled 0bxxxxx1xxx: Hard Reset detect enabled 0bxxxx1xxxx: Cable Detect reset enabled 0bxxx1xxxxx: SOP''_Debug enabled 0bxx1xxxxxx: SOP''''_Debug enabled 0bx1xxxxxxx: SOP extension#1 enabled 0b1xxxxxxxx: SOP extension#2 enabled'
  - name: TXDMAEN
    bit_range:
    - 29
    - 29
    description: Transmission DMA mode enable When set, the bit enables DMA mode for transmission.
  - name: RXDMAEN
    bit_range:
    - 30
    - 30
    description: Reception DMA mode enable When set, the bit enables DMA mode for reception.
  - name: UCPDEN
    bit_range:
    - 31
    - 31
    description: UCPD peripheral enable General enable of the UCPD peripheral. Upon disabling, the peripheral instantly quits any ongoing activity and all control bits and bitfields default to their reset values. They must be set to their desired values each time the peripheral transits from disabled to enabled state.
  side_effects: null
- id: UCPD_CFGR2
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RXFILTDIS
    bit_range:
    - 0
    - 0
    description: BMC decoder Rx pre-filter enable The sampling clock is that of the receiver (that is, after pre-scaler).
  - name: RXFILT2N3
    bit_range:
    - 1
    - 1
    description: BMC decoder Rx pre-filter sampling method Number of consistent consecutive samples before confirming a new value.
  - name: FORCECLK
    bit_range:
    - 2
    - 2
    description: Force ClkReq clock request
  - name: WUPEN
    bit_range:
    - 3
    - 3
    description: Wakeup from Stop mode enable Setting the bit enables the UCPD_ASYNC_INT signal.
  side_effects: null
- id: UCPD_CFGR3
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TRIM1_NG_CCRPD
    bit_range:
    - 3
    - 0
    description: SW trim value for RPD resistors on the CC1 line
  - name: TRIM1_NG_CC3A0
    bit_range:
    - 12
    - 9
    description: SW trim value for Iref on the CC1 line
  - name: TRIM2_NG_CCRPD
    bit_range:
    - 19
    - 16
    description: SW trim value for RPD resistors on the CC2 line
  - name: TRIM2_NG_CC3A0
    bit_range:
    - 28
    - 25
    description: SW trim value for Iref on the CC2 line
  side_effects: null
- id: UCPD_CR
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXMODE
    bit_range:
    - 1
    - 0
    description: 'Type of Tx packet Writing the bitfield triggers the action as follows, depending on the value: Others: invalid From V1.1 of the USB PD specification, there is a counter defined for the duration of the BIST Carrier Mode 2. To quit this mode correctly (after the "tBISTContMode" delay), disable the peripheral (UCPDEN = 0).'
  - name: TXSEND
    bit_range:
    - 2
    - 2
    description: Command to send a Tx packet The bit is cleared by hardware as soon as the packet transmission begins or is discarded.
  - name: TXHRST
    bit_range:
    - 3
    - 3
    description: Command to send a Tx Hard Reset The bit is cleared by hardware as soon as the message transmission begins or is discarded.
  - name: RXMODE
    bit_range:
    - 4
    - 4
    description: Receiver mode Determines the mode of the receiver. When the bit is set, RXORDSET behaves normally, RXDR no longer receives bytes yet the CRC checking still proceeds as for a normal message.
  - name: PHYRXEN
    bit_range:
    - 5
    - 5
    description: USB Power Delivery receiver enable Both CC1 and CC2 receivers are disabled when the bit is cleared. Only the CC receiver selected via the PHYCCSEL bit is enabled when the bit is set.
  - name: PHYCCSEL
    bit_range:
    - 6
    - 6
    description: CC1/CC2 line selector for USB Power Delivery signaling The selection depends on the cable orientation as discovered at attach.
  - name: ANASUBMODE
    bit_range:
    - 8
    - 7
    description: Analog PHY sub-mode Refer to TYPEC_VSTATE_CCx for the effect of this bitfield.
  - name: ANAMODE
    bit_range:
    - 9
    - 9
    description: Analog PHY operating mode The use of CC1 and CC2 depends on CCENABLE. Refer to ANAMODE, ANASUBMODE and link with TYPEC_VSTATE_CCx for the effect of this bitfield in conjunction with ANASUBMODE[1:0].
  - name: CCENABLE
    bit_range:
    - 11
    - 10
    description: CC line enable This bitfield enables CC1 and CC2 line analog PHYs (pull-ups and pull-downs) according to ANAMODE and ANASUBMODE[1:0] setting. A single line PHY can be enabled when, for example, the other line is driven by VCONN via an external VCONN switch. Enabling both PHYs is the normal usage for sink/source.
  - name: CC1VCONNEN
    bit_range:
    - 13
    - 13
    description: VCONN switch enable for CC1
  - name: CC2VCONNEN
    bit_range:
    - 14
    - 14
    description: VCONN switch enable for CC2
  - name: FRSRXEN
    bit_range:
    - 16
    - 16
    description: 'FRS event detection enable Setting the bit enables FRS Rx event (FRSEVT) detection on the CC line selected through the PHYCCSEL bit. 0: Disable Clear the bit when the device is attached to an FRS-incapable source/sink.'
  - name: FRSTX
    bit_range:
    - 17
    - 17
    description: FRS Tx signaling enable. Setting the bit enables FRS Tx signaling. The bit is cleared by hardware after a delay respecting the USB Power Delivery specification Revision 3.0.
  - name: RDCH
    bit_range:
    - 18
    - 18
    description: Rdch condition drive The bit drives Rdch condition on the CC line selected through the PHYCCSEL bit (thus associated with VCONN), by remaining set during the source-only UnattachedWait.SRC state, to respect the Type-C state. Refer to "USB Type-C ECN for Source VCONN Discharge". The CCENABLE[1:0] bitfield must be set accordingly, too.
  - name: CC1TCDIS
    bit_range:
    - 20
    - 20
    description: CC1 Type-C detector disable The bit disables the Type-C detector on the CC1 line. When enabled, the Type-C detector for CC1 is configured through ANAMODE and ANASUBMODE[1:0].
  - name: CC2TCDIS
    bit_range:
    - 21
    - 21
    description: CC2 Type-C detector disable The bit disables the Type-C detector on the CC2 line. When enabled, the Type-C detector for CC2 is configured through ANAMODE and ANASUBMODE[1:0].
  side_effects: null
- id: UCPD_IMR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXISIE
    bit_range:
    - 0
    - 0
    description: TXIS interrupt enable
  - name: TXMSGDISCIE
    bit_range:
    - 1
    - 1
    description: TXMSGDISC interrupt enable
  - name: TXMSGSENTIE
    bit_range:
    - 2
    - 2
    description: TXMSGSENT interrupt enable
  - name: TXMSGABTIE
    bit_range:
    - 3
    - 3
    description: TXMSGABT interrupt enable
  - name: HRSTDISCIE
    bit_range:
    - 4
    - 4
    description: HRSTDISC interrupt enable
  - name: HRSTSENTIE
    bit_range:
    - 5
    - 5
    description: HRSTSENT interrupt enable
  - name: TXUNDIE
    bit_range:
    - 6
    - 6
    description: TXUND interrupt enable
  - name: RXNEIE
    bit_range:
    - 8
    - 8
    description: RXNE interrupt enable
  - name: RXORDDETIE
    bit_range:
    - 9
    - 9
    description: RXORDDET interrupt enable
  - name: RXHRSTDETIE
    bit_range:
    - 10
    - 10
    description: RXHRSTDET interrupt enable
  - name: RXOVRIE
    bit_range:
    - 11
    - 11
    description: RXOVR interrupt enable
  - name: RXMSGENDIE
    bit_range:
    - 12
    - 12
    description: RXMSGEND interrupt enable
  - name: TYPECEVT1IE
    bit_range:
    - 14
    - 14
    description: TYPECEVT1 interrupt enable
  - name: TYPECEVT2IE
    bit_range:
    - 15
    - 15
    description: TYPECEVT2 interrupt enable
  - name: FRSEVTIE
    bit_range:
    - 20
    - 20
    description: FRSEVT interrupt enable
  side_effects: null
- id: UCPD_SR
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXIS
    bit_range:
    - 0
    - 0
    description: Transmit interrupt status The flag indicates that the UCPD_TXDR register is empty and new data write is required (as the amount of data sent has not reached the payload size defined in the TXPAYSZ bitfield). The flag is cleared with the data write into the UCPD_TXDR register.
  - name: TXMSGDISC
    bit_range:
    - 1
    - 1
    description: Message transmission discarded The flag indicates that a message transmission was dropped. The flag is cleared by setting the TXMSGDISCCF bit. Transmission of a message can be dropped if there is a concurrent receive in progress or at excessive noise on the line. After a Tx message is discarded, the flag is only raised when the CC line becomes idle.
  - name: TXMSGSENT
    bit_range:
    - 2
    - 2
    description: Message transmission completed The flag indicates the completion of packet transmission. It is cleared by setting the TXMSGSENTCF bit. In the event of a message transmission interrupted by a Hard Reset, the flag is not raised.
  - name: TXMSGABT
    bit_range:
    - 3
    - 3
    description: Transmit message abort The flag indicates that a Tx message is aborted due to a subsequent Hard Reset message send request taking priority during transmit. It is cleared by setting the TXMSGABTCF bit.
  - name: HRSTDISC
    bit_range:
    - 4
    - 4
    description: Hard Reset discarded The flag indicates that the Hard Reset message is discarded. The flag is cleared by setting the HRSTDISCCF bit.
  - name: HRSTSENT
    bit_range:
    - 5
    - 5
    description: Hard Reset message sent The flag indicates that the Hard Reset message is sent. The flag is cleared by setting the HRSTSENTCF bit.
  - name: TXUND
    bit_range:
    - 6
    - 6
    description: Tx data underrun detection The flag indicates that the Tx data register (UCPD_TXDR) was not written in time for a transmit message to execute normally. It is cleared by setting the TXUNDCF bit.
  - name: RXNE
    bit_range:
    - 8
    - 8
    description: Receive data register not empty detection The flag indicates that the UCPD_RXDR register is not empty. It is automatically cleared upon reading UCPD_RXDR.
  - name: RXORDDET
    bit_range:
    - 9
    - 9
    description: Rx ordered set (4 K-codes) detection The flag indicates the detection of an ordered set. The relevant information is stored in the RXORDSET[2:0] bitfield of the UCPD_RX_ORDSET register. It is cleared by setting the RXORDDETCF bit.
  - name: RXHRSTDET
    bit_range:
    - 10
    - 10
    description: Rx Hard Reset receipt detection The flag indicates the receipt of valid Hard Reset message. It is cleared by setting the RXHRSTDETCF bit.
  - name: RXOVR
    bit_range:
    - 11
    - 11
    description: Rx data overflow detection The flag indicates Rx data buffer overflow. It is cleared by setting the RXOVRCF bit. The buffer overflow can occur if the received data are not read fast enough.
  - name: RXMSGEND
    bit_range:
    - 12
    - 12
    description: Rx message received The flag indicates whether a message (except Hard Reset message) has been received, regardless the CRC value. The flag is cleared by setting the RXMSGENDCF bit. The RXERR flag set when the RXMSGEND flag goes high indicates errors in the last-received message.
  - name: RXERR
    bit_range:
    - 13
    - 13
    description: Receive message error The flag indicates errors of the last Rx message declared (via RXMSGEND), such as incorrect CRC or truncated message (a line becoming static before EOP is met). It is asserted whenever the RXMSGEND flag is set.
  - name: TYPECEVT1
    bit_range:
    - 14
    - 14
    description: Type-C voltage level event on CC1 line The flag indicates a change of the TYPEC_VSTATE_CC1[1:0] bitfield value, which corresponds to a new Type-C event. It is cleared by setting the TYPECEVT2CF bit.
  - name: TYPECEVT2
    bit_range:
    - 15
    - 15
    description: Type-C voltage level event on CC2 line The flag indicates a change of the TYPEC_VSTATE_CC2[1:0] bitfield value, which corresponds to a new Type-C event. It is cleared by setting the TYPECEVT2CF bit.
  - name: TYPEC_VSTATE_CC1
    bit_range:
    - 17
    - 16
    description: The status bitfield indicates the voltage level on the CC1 line in its steady state. The voltage variation on the CC1 line during USB PD messages due to the BMC PHY modulation does not impact the bitfield value.
  - name: TYPEC_VSTATE_CC2
    bit_range:
    - 19
    - 18
    description: CC2 line voltage level The status bitfield indicates the voltage level on the CC2 line in its steady state. The voltage variation on the CC2 line during USB PD messages due to the BMC PHY modulation does not impact the bitfield value.
  - name: FRSEVT
    bit_range:
    - 20
    - 20
    description: FRS detection event The flag is cleared by setting the FRSEVTCF bit.
  side_effects: null
- id: UCPD_ICR
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXMSGDISCCF
    bit_range:
    - 1
    - 1
    description: Tx message discard flag (TXMSGDISC) clear Setting the bit clears the TXMSGDISC flag in the UCPD_SR register.
  - name: TXMSGSENTCF
    bit_range:
    - 2
    - 2
    description: Tx message send flag (TXMSGSENT) clear Setting the bit clears the TXMSGSENT flag in the UCPD_SR register.
  - name: TXMSGABTCF
    bit_range:
    - 3
    - 3
    description: Tx message abort flag (TXMSGABT) clear Setting the bit clears the TXMSGABT flag in the UCPD_SR register.
  - name: HRSTDISCCF
    bit_range:
    - 4
    - 4
    description: Hard reset discard flag (HRSTDISC) clear Setting the bit clears the HRSTDISC flag in the UCPD_SR register.
  - name: HRSTSENTCF
    bit_range:
    - 5
    - 5
    description: Hard reset send flag (HRSTSENT) clear Setting the bit clears the HRSTSENT flag in the UCPD_SR register.
  - name: TXUNDCF
    bit_range:
    - 6
    - 6
    description: Tx underflow flag (TXUND) clear Setting the bit clears the TXUND flag in the UCPD_SR register.
  - name: RXORDDETCF
    bit_range:
    - 9
    - 9
    description: Rx ordered set detect flag (RXORDDET) clear Setting the bit clears the RXORDDET flag in the UCPD_SR register.
  - name: RXHRSTDETCF
    bit_range:
    - 10
    - 10
    description: Rx Hard Reset detect flag (RXHRSTDET) clear Setting the bit clears the RXHRSTDET flag in the UCPD_SR register.
  - name: RXOVRCF
    bit_range:
    - 11
    - 11
    description: Rx overflow flag (RXOVR) clear Setting the bit clears the RXOVR flag in the UCPD_SR register.
  - name: RXMSGENDCF
    bit_range:
    - 12
    - 12
    description: Rx message received flag (RXMSGEND) clear Setting the bit clears the RXMSGEND flag in the UCPD_SR register.
  - name: TYPECEVT1CF
    bit_range:
    - 14
    - 14
    description: Type-C CC1 event flag (TYPECEVT1) clear Setting the bit clears the TYPECEVT1 flag in the UCPD_SR register
  - name: TYPECEVT2CF
    bit_range:
    - 15
    - 15
    description: Type-C CC2 line event flag (TYPECEVT2) clear Setting the bit clears the TYPECEVT2 flag in the UCPD_SR register
  - name: FRSEVTCF
    bit_range:
    - 20
    - 20
    description: FRS event flag (FRSEVT) clear Setting the bit clears the FRSEVT flag in the UCPD_SR register.
  side_effects: null
- id: UCPD_TX_ORDSETR
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXORDSET
    bit_range:
    - 19
    - 0
    description: Ordered set to transmit The bitfield determines a full 20-bit sequence to transmit, consisting of four K-codes, each of five bits, defining the packet to transmit. The bit 0 (bit 0 of K-code1) is the first, the bit 19 (bit 4 of K‑code4) the last.
  side_effects: null
- id: UCPD_TX_PAYSZR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXPAYSZ
    bit_range:
    - 9
    - 0
    description: 'Payload size yet to transmit The bitfield is modified by software and by hardware. It contains the number of bytes of a payload (including header but excluding CRC) yet to transmit: each time a data byte is written into the UCPD_TXDR register, the bitfield value decrements and the TXIS bit is set, except when the bitfield value reaches zero. The enumerated values are standard payload sizes before the start of transmission.'
  side_effects: null
- id: UCPD_TXDR
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXDATA
    bit_range:
    - 7
    - 0
    description: Data byte to transmit
  side_effects: null
- id: UCPD_RX_ORDSETR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RXORDSET
    bit_range:
    - 2
    - 0
    description: Rx ordered set code detected
  - name: RXSOP3OF4
    bit_range:
    - 3
    - 3
    description: The bit indicates the number of correct K‑codes. For debug purposes only.
  - name: RXSOPKINVALID
    bit_range:
    - 6
    - 4
    description: 'The bitfield is for debug purposes only. Others: Invalid'
  side_effects: null
- id: UCPD_RX_PAYSZR
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RXPAYSZ
    bit_range:
    - 9
    - 0
    description: 'Rx payload size received This bitfield contains the number of bytes of a payload (including header but excluding CRC) received: each time a new data byte is received in the UCPD_RXDR register, the bitfield value increments and the RXMSGEND flag is set (and an interrupt generated if enabled). The bitfield may return a spurious value when a byte reception is ongoing (the RXMSGEND flag is low).'
  side_effects: null
- id: UCPD_RXDR
  address_offset: 48
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RXDATA
    bit_range:
    - 7
    - 0
    description: Data byte received
  side_effects: null
- id: UCPD_RX_ORDEXTR1
  address_offset: 52
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RXSOPX1
    bit_range:
    - 19
    - 0
    description: Ordered set 1 received The bitfield contains a full 20-bit sequence received, consisting of four K‑codes, each of five bits. The bit 0 (bit 0 of K‑code1) is receive first, the bit 19 (bit 4 of K‑code4) last.
  side_effects: null
- id: UCPD_RX_ORDEXTR2
  address_offset: 56
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RXSOPX2
    bit_range:
    - 19
    - 0
    description: Ordered set 2 received The bitfield contains a full 20-bit sequence received, consisting of four K‑codes, each of five bits. The bit 0 (bit 0 of K‑code1) is receive first, the bit 19 (bit 4 of K‑code4) last.
  side_effects: null
interrupts:
  UCPD1: 106
timing: null
