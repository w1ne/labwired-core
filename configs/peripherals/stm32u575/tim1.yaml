- id: TIM1_SR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UIF
    bit_range:
    - 0
    - 0
    description: Update interrupt flag This bit is set by hardware on an update event. It is cleared by software. At overflow or underflow regarding the repetition counter value (update if repetition counter = 0) and if the UDIS=0 in the TIMx_CR1 register. When CNT is reinitialized by software using the UG bit in TIMx_EGR register, if URS=0 and UDIS=0 in the TIMx_CR1 register. When CNT is reinitialized by a trigger event (refer to control register (TIMx_SMCR)(x = 1, 8)), if URS=0 and UDIS=0 in the TIMx_CR1 register.
  - name: CC1IF
    bit_range:
    - 1
    - 1
    description: 'Capture/compare 1 interrupt flag This flag is set by hardware. It is cleared by software (input capture or output compare mode) or by reading the TIMx_CCR1 register (input capture mode only). If channel CC1 is configured as output: this flag is set when the content of the counter TIMx_CNT matches the content of the TIMx_CCR1 register. When the content of TIMx_CCR1 is greater than the content of TIMx_ARR, the CC1IF bit goes high on the counter overflow (in up-counting and up/down-counting modes) or underflow (in downcounting mode). There are 3 possible options for flag setting in center-aligned mode, refer to the CMS bits in the TIMx_CR1 register for the full description. If channel CC1 is configured as input: this bit is set when counter value has been captured in TIMx_CCR1 register (an edge has been detected on IC1, as per the edge sensitivity defined with the CC1P and CC1NP bits setting, in TIMx_CCER).'
  - name: CC2IF
    bit_range:
    - 2
    - 2
    description: Capture/compare 2 interrupt flag Refer to CC1IF description
  - name: CC3IF
    bit_range:
    - 3
    - 3
    description: Capture/compare 3 interrupt flag Refer to CC1IF description
  - name: CC4IF
    bit_range:
    - 4
    - 4
    description: Capture/compare 4 interrupt flag Refer to CC1IF description
  - name: COMIF
    bit_range:
    - 5
    - 5
    description: COM interrupt flag This flag is set by hardware on COM event (when capture/compare Control bits - CCxE, CCxNE, OCxM - have been updated). It is cleared by software.
  - name: TIF
    bit_range:
    - 6
    - 6
    description: Trigger interrupt flag This flag is set by hardware on the TRG trigger event (active edge detected on tim_trgi input when the slave mode controller is enabled in all modes but gated mode. It is set when the counter starts or stops when gated mode is selected. It is cleared by software.
  - name: BIF
    bit_range:
    - 7
    - 7
    description: Break interrupt flag This flag is set by hardware as soon as the break input goes active. It can be cleared by software if the break input is not active.
  - name: B2IF
    bit_range:
    - 8
    - 8
    description: Break 2 interrupt flag This flag is set by hardware as soon as the break 2 input goes active. It can be cleared by software if the break 2 input is not active.
  - name: CC1OF
    bit_range:
    - 9
    - 9
    description: "Capture/compare 1 overcapture flag This flag is set by hardware only when the corresponding channel is configured in input capture mode. It is cleared by software by writing it to '0â\x80\x99."
  - name: CC2OF
    bit_range:
    - 10
    - 10
    description: Capture/compare 2 overcapture flag Refer to CC1OF description
  - name: CC3OF
    bit_range:
    - 11
    - 11
    description: Capture/compare 3 overcapture flag Refer to CC1OF description
  - name: CC4OF
    bit_range:
    - 12
    - 12
    description: Capture/compare 4 overcapture flag Refer to CC1OF description
  - name: SBIF
    bit_range:
    - 13
    - 13
    description: System break interrupt flag This flag is set by hardware as soon as the system break input goes active. It can be cleared by software if the system break input is not active. This flag must be reset to re-start PWM operation.
  - name: CC5IF
    bit_range:
    - 16
    - 16
    description: 'Compare 5 interrupt flag Refer to CC1IF description Note: Channel 5 can only be configured as output.'
  - name: CC6IF
    bit_range:
    - 17
    - 17
    description: 'Compare 6 interrupt flag Refer to CC1IF description Note: Channel 6 can only be configured as output.'
  - name: IDXF
    bit_range:
    - 20
    - 20
    description: "Index interrupt flag This flag is set by hardware when an index event is detected. It is cleared by software by writing it to '0â\x80\x99."
  - name: DIRF
    bit_range:
    - 21
    - 21
    description: "Direction change interrupt flag This flag is set by hardware when the direction changes in encoder mode (DIR bit value in TIMx_CR is changing). It is cleared by software by writing it to '0â\x80\x99."
  - name: IERRF
    bit_range:
    - 22
    - 22
    description: "Index error interrupt flag This flag is set by hardware when an index error is detected. It is cleared by software by writing it to '0â\x80\x99."
  - name: TERRF
    bit_range:
    - 23
    - 23
    description: "Transition error interrupt flag This flag is set by hardware when a transition error is detected in encoder mode. It is cleared by software by writing it to '0â\x80\x99."
  side_effects: null
- id: TIM1_EGR
  address_offset: 20
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UG
    bit_range:
    - 0
    - 0
    description: Update generation This bit can be set by software, it is automatically cleared by hardware.
  - name: CC1G
    bit_range:
    - 1
    - 1
    description: 'Capture/compare 1 generation This bit is set by software in order to generate an event, it is automatically cleared by hardware. If channel CC1 is configured as output: CC1IF flag is set, Corresponding interrupt or DMA request is sent if enabled. If channel CC1 is configured as input: The current value of the counter is captured in TIMx_CCR1 register. The CC1IF flag is set, the corresponding interrupt or DMA request is sent if enabled. The CC1OF flag is set if the CC1IF flag was already high.'
  - name: CC2G
    bit_range:
    - 2
    - 2
    description: Capture/compare 2 generation Refer to CC1G description
  - name: CC3G
    bit_range:
    - 3
    - 3
    description: Capture/compare 3 generation Refer to CC1G description
  - name: CC4G
    bit_range:
    - 4
    - 4
    description: Capture/compare 4 generation Refer to CC1G description
  - name: COMG
    bit_range:
    - 5
    - 5
    description: 'Capture/compare control update generation This bit can be set by software, it is automatically cleared by hardware Note: This bit acts only on channels having a complementary output.'
  - name: TG
    bit_range:
    - 6
    - 6
    description: Trigger generation This bit is set by software in order to generate an event, it is automatically cleared by hardware.
  - name: BG
    bit_range:
    - 7
    - 7
    description: Break generation This bit is set by software in order to generate an event, it is automatically cleared by hardware.
  - name: B2G
    bit_range:
    - 8
    - 8
    description: Break 2 generation This bit is set by software in order to generate an event, it is automatically cleared by hardware.
  side_effects: null
