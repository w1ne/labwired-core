peripheral: TIM1
version: 0.1.0
registers:
- id: TIM1_CR1
  address_offset: 0
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CEN
    bit_range:
    - 0
    - 0
    description: 'Counter enable Note: External clock, gated mode and encoder mode can work only if the CEN bit has been previously set by software. However trigger mode can set the CEN bit automatically by hardware.'
  - name: UDIS
    bit_range:
    - 1
    - 1
    description: Update disable This bit is set and cleared by software to enable/disable UEV event generation. Counter overflow/underflow Setting the UG bit Update generation through the slave mode controller Buffered registers are then loaded with their preload values.
  - name: URS
    bit_range:
    - 2
    - 2
    description: Update request source This bit is set and cleared by software to select the UEV event sources. Counter overflow/underflow Setting the UG bit Update generation through the slave mode controller
  - name: OPM
    bit_range:
    - 3
    - 3
    description: One pulse mode
  - name: DIR
    bit_range:
    - 4
    - 4
    description: 'Direction Note: This bit is read only when the timer is configured in Center-aligned mode or Encoder mode.'
  - name: CMS
    bit_range:
    - 6
    - 5
    description: 'Center-aligned mode selection Note: It is not allowed to switch from edge-aligned mode to center-aligned mode as long as the counter is enabled (CEN=1)'
  - name: ARPE
    bit_range:
    - 7
    - 7
    description: Auto-reload preload enable
  - name: CKD
    bit_range:
    - 9
    - 8
    description: Clock division This bit-field indicates the division ratio between the timer clock (tim_ker_ck) frequency and the dead-time and sampling clock (tDTS)used by the dead-time generators and the digital filters (tim_etr_in, tim_tix),
  - name: UIFREMAP
    bit_range:
    - 11
    - 11
    description: UIF status bit remapping
  - name: DITHEN
    bit_range:
    - 12
    - 12
    description: 'Dithering enable Note: The DITHEN bit can only be modified when CEN bit is reset.'
  side_effects: null
