  - name: CC1S
    bit_range:
    - 1
    - 0
    description: "Capture/compare 1 Selection This bit-field defines the direction of the channel (input/output) as well as the used input. Note: CC1S bits are writable only when the channel is OFF (CC1E = '0â\x80\x99 in TIMx_CCER)."
  - name: IC1PSC
    bit_range:
    - 3
    - 2
    description: "Input capture 1 prescaler This bit-field defines the ratio of the prescaler acting on CC1 input (tim_ic1). The prescaler is reset as soon as CC1E=â\x80\x990â\x80\x99 (TIMx_CCER register)."
  - name: IC1F
