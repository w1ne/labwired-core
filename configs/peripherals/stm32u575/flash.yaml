- id: FLASH_NSBOOTADD0R
  address_offset: 68
  size: 32
  access: READ_WRITE
  reset_value: 15
  fields:
  - name: NSBOOTADD0
    bit_range:
    - 31
    - 7
    description: 'Non-secure boot base address 0 The non-secure boot memory address can be programmed to any address in the valid address range with a granularity of 128 bytes. These bits correspond to address [31:7]. The NSBOOTADD0 option bytes are selected following the BOOT0 pin or nSWBOOT0 state. Examples: NSBOOTADD0[24:0] = 0x0100000: Boot from non-secure Flash memory (0x0800 0000) NSBOOTADD0[24:0] = 0x017F200: Boot from system memory bootloader (0x0BF9 0000) NSBOOTADD0[24:0] = 0x0400000: Boot from non-secure SRAM1 on S-Bus (0x2000 0000)'
  side_effects: null
