peripheral: FLASH
version: 0.1.0
registers:
- id: FLASH_ACR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LATENCY
    bit_range:
    - 3
    - 0
    description: Latency These bits represent the ratio between the HCLK (AHB clock) period and the Flash memory access time. ...
  - name: PRFTEN
    bit_range:
    - 8
    - 8
    description: Prefetch enable This bit enables the prefetch buffer in the embedded Flash memory.
  - name: LPM
    bit_range:
    - 11
    - 11
    description: Low-power read mode This bit puts the Flash memory in low-power read mode.
  - name: PDREQ1
    bit_range:
    - 12
    - 12
    description: Bank 1 power-down mode request This bit is write-protected with FLASH_PDKEY1R. This bit requests bank 1 to enter power-down mode. When bank 1 enters power-down mode, this bit is cleared by hardware and the PDKEY1R is locked.
  - name: PDREQ2
    bit_range:
    - 13
    - 13
    description: Bank 2 power-down mode request This bit is write-protected with FLASH_PDKEY2R. This bit requests bank 2 to enter power-down mode. When bank 2 enters power-down mode, this bit is cleared by hardware and the PDKEY2R is locked.
  - name: SLEEP_PD
    bit_range:
    - 14
    - 14
    description: Flash memory power-down mode during Sleep mode This bit determines whether the Flash memory is in power-down mode or Idle mode when the device is in Sleep mode. The Flash must not be put in power-down while a program or an erase operation is on-going.
  side_effects: null
- id: FLASH_NSKEYR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: NSKEY
    bit_range:
    - 31
    - 0
    description: Flash memory non-secure key
  side_effects: null
- id: FLASH_SECKEYR
  address_offset: 12
  size: 32
