  - name: SYSF_ECC
    bit_range:
    - 22
    - 22
    description: System Flash memory ECC fail This bit indicates that the ECC error correction or double ECC error detection is located in the system Flash memory.
  - name: ECCIE
    bit_range:
    - 24
    - 24
    description: ECC correction interrupt enable This bit enables the interrupt generation when the ECCC bit in the FLASH_ECCR register is set.
  - name: ECCC
    bit_range:
    - 30
    - 30
    description: ECC correction This bit is set by hardware when one ECC error has been detected and corrected (only if ECCC and ECCD were previously cleared). An interrupt is generated if ECCIE is set. This bit is cleared by writing 1.
  - name: ECCD
    bit_range:
    - 31
    - 31
    description: ECC detection This bit is set by hardware when two ECC errors have been detected (only if ECCC and ECCD were previously cleared). When this bit is set, a NMI is generated. This bit is cleared by writing 1.
  side_effects: null
