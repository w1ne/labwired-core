    description: Secure bank 2 mass erase This bit triggers the bank 2 secure mass erase (all bank 2 user pages) when set.
  - name: STRT
    bit_range:
    - 16
    - 16
    description: Secure start This bit triggers a secure erase operation when set. If MER1, MER2 and PER bits are reset and the STRT bit is set, the PGSERR in the FLASH_SECSR is set (this condition is forbidden). This bit is set only by software and is cleared when the BSY bit is cleared in FLASH_SECSR.
  - name: EOPIE
    bit_range:
    - 24
    - 24
    description: Secure End of operation interrupt enable This bit enables the interrupt generation when the EOP bit in the FLASH_SECSR is set to 1.
  - name: ERRIE
    bit_range:
    - 25
    - 25
    description: Secure error interrupt enable
  - name: RDERRIE
    bit_range:
    - 26
    - 26
    description: Secure PCROP read error interrupt enable
  - name: INV
    bit_range:
    - 29
    - 29
    description: Flash memory security state invert This bit inverts the Flash memory security state.
  - name: LOCK
    bit_range:
    - 31
    - 31
    description: Secure lock This bit is set only. When set, the FLASH_SECCR register is locked. It is cleared by hardware after detecting the unlock sequence in FLASH_SECKEYR register. In case of an unsuccessful unlock operation, this bit remains set until the next system reset.
  side_effects: null
- id: FLASH_ECCR
  address_offset: 48
  size: 32
  access: READ_WRITE
