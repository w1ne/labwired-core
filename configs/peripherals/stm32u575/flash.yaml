- id: FLASH_NSSR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EOP
    bit_range:
    - 0
    - 0
    description: Non-secure end of operation
  - name: OPERR
    bit_range:
    - 1
    - 1
    description: Non-secure operation error
  - name: PROGERR
    bit_range:
    - 3
    - 3
    description: Non-secure programming error This bit is set by hardware when a non-secure quad-word address to be programmed contains a value different from all 1 before programming, except if the data to write is all 0. This bit is cleared by writing 1.
  - name: WRPERR
    bit_range:
    - 4
    - 4
    description: Non-secure write protection error This bit is set by hardware when an non-secure address to be erased/programmed belongs to a write-protected part (by WRP, HDP or RDP level 1) of the Flash memory. This bit is cleared by writing 1. Refer to  for full conditions of error flag setting.
  - name: PGAERR
    bit_range:
    - 5
    - 5
    description: Non-secure programming alignment error This bit is set by hardware when the first word to be programmed is not aligned with a quad-word address, or the second, third or forth word does not belong to the same quad-word address. This bit is cleared by writing 1.
  - name: SIZERR
    bit_range:
    - 6
    - 6
    description: Non-secure size error This bit is set by hardware when the size of the access is a byte or half-word during a non-secure program sequence. Only quad-word programming is allowed by means of successive word accesses. This bit is cleared by writing 1.
  - name: PGSERR
    bit_range:
    - 7
    - 7
    description: Non-secure programming sequence error This bit is set by hardware when programming sequence is not correct. It is cleared by writing 1. Refer to  for full conditions of error flag setting.
  - name: OPTWERR
    bit_range:
    - 13
    - 13
    description: Option write error This bit is set by hardware when the options bytes are written with an invalid configuration. It is cleared by writing 1. Refer to  for full conditions of error flag setting.
  - name: BSY
    bit_range:
    - 16
    - 16
    description: Non-secure busy This indicates that a Flash memory secure or non-secure operation is in progress. This bit is set at the beginning of a Flash operation and reset when the operation finishes or when an error occurs.
  - name: WDW
    bit_range:
    - 17
    - 17
    description: Non-secure wait data to write This bit indicates that the Flash memory write buffer has been written by a secure or non-secure operation. It is set when the first data is stored in the buffer and cleared when the write is performed in the Flash memory.
  - name: OEM1LOCK
    bit_range:
    - 18
    - 18
    description: OEM1 lock This bit indicates that the OEM1 RDP key read during the OBL is not virgin. When set, the OEM1 RDP lock mechanism is active.
  - name: OEM2LOCK
    bit_range:
    - 19
    - 19
    description: OEM2 lock This bit indicates that the OEM2 RDP key read during the OBL is not virgin. When set, the OEM2 RDP lock mechanism is active.
  - name: PD1
    bit_range:
    - 20
    - 20
    description: Bank 1 in power-down mode This bit indicates that the Flash memory bank 1 is in power-down state. It is reset when bank 1 is in normal mode or being awaken.
  - name: PD2
    bit_range:
    - 21
    - 21
    description: Bank 2 in power-down mode This bit indicates that the Flash memory bank 2 is in power-down state. It is reset when bank 2 is in normal mode or being awaken.
  side_effects: null
- id: FLASH_SECSR
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EOP
    bit_range:
    - 0
    - 0
    description: Secure end of operation This bit is set by hardware when one or more Flash memory secure operation (program/erase) has been completed successfully. This bit is set only if the secure end of operation interrupts are enabled (EOPIE = 1 in FLASH_SECCR). This bit is cleared by writing 1.
  - name: OPERR
    bit_range:
    - 1
    - 1
    description: Secure operation error This bit is set by hardware when a Flash memory secure operation (program/erase) completes unsuccessfully. This bit is set only if secure error interrupts are enabled (SECERRIE = 1). This bit is cleared by writing 1.
  - name: PROGERR
    bit_range:
    - 3
    - 3
    description: Secure programming error This bit is set by hardware when a secure quad-word address to be programmed contains a value different from all 1 before programming, except if the data to write is all 0. This bit is cleared by writing 1.
  - name: WRPERR
    bit_range:
    - 4
    - 4
    description: Secure write protection error This bit is set by hardware when an secure address to be erased/programmed belongs to a write-protected part (by WRP, PCROP, HDP or RDP level 1) of the Flash memory.This bit is cleared by writing 1. Refer to  for full conditions of error flag setting.
  - name: PGAERR
    bit_range:
    - 5
    - 5
    description: Secure programming alignment error This bit is set by hardware when the first word to be programmed is not aligned with a quad-word address, or the second, third or forth word does not belong to the same quad-word address.This bit is cleared by writing 1.
  - name: SIZERR
    bit_range:
    - 6
    - 6
    description: Secure size error This bit is set by hardware when the size of the access is a byte or half-word during a secure program sequence. Only quad-word programming is allowed by means of successive word accesses.This bit is cleared by writing 1.
  - name: PGSERR
    bit_range:
    - 7
    - 7
    description: Secure programming sequence error This bit is set by hardware when programming sequence is not correct. It is cleared by writing 1. Refer to  for full conditions of error flag setting.
  - name: BSY
    bit_range:
    - 16
    - 16
    description: Secure busy This bit indicates that a Flash memory secure or non-secure operation is in progress. This is set on the beginning of a Flash operation and reset when the operation finishes or when an error occurs.
  - name: WDW
    bit_range:
    - 17
    - 17
    description: Secure wait data to write This bit indicates that the Flash memory write buffer has been written by a secure or non-secure operation. It is set when the first data is stored in the buffer and cleared when the write is performed in the Flash memory.
  side_effects: null
- id: FLASH_NSCR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 3221225472
  fields:
  - name: PG
    bit_range:
    - 0
    - 0
    description: Non-secure programming
  - name: PER
    bit_range:
    - 1
    - 1
    description: Non-secure page erase
  - name: MER1
    bit_range:
    - 2
    - 2
    description: Non-secure bank 1 mass erase This bit triggers the bank 1 non-secure mass erase (all bank 1 user pages) when set.
  - name: PNB
    bit_range:
    - 9
    - 3
    description: Non-secure page number selection These bits select the page to erase. ...
  - name: BKER
    bit_range:
    - 11
    - 11
    description: Non-secure bank selection for page erase
  - name: BWR
    bit_range:
    - 14
    - 14
    description: Non-secure burst write programming mode When set, this bit selects the burst write programming mode.
  - name: MER2
    bit_range:
    - 15
    - 15
    description: Non-secure bank 2 mass erase This bit triggers the bank 2 non-secure mass erase (all bank 2 user pages) when set.
  - name: STRT
    bit_range:
    - 16
    - 16
    description: Non-secure start This bit triggers a non-secure erase operation when set. If MER1, MER2 and PER bits are reset and the STRT bit is set, the PGSERR bit in FLASH_NSSR is set (this condition is forbidden). This bit is set only by software and is cleared when the BSY bit is cleared in FLASH_NSSR.
  - name: OPTSTRT
    bit_range:
    - 17
    - 17
    description: Options modification start This bit triggers an options operation when set. It can not be written if OPTLOCK bit is set. This bit is set only by software, and is cleared when the BSY bit is cleared in FLASH_NSSR.
  - name: EOPIE
    bit_range:
    - 24
    - 24
    description: Non-secure end of operation interrupt enable This bit enables the interrupt generation when the EOP bit in the FLASH_NSSR is set to 1.
  - name: ERRIE
    bit_range:
    - 25
    - 25
    description: Non-secure error interrupt enable This bit enables the interrupt generation when the OPERR bit in the FLASH_NSSR is set to 1.
  - name: OBL_LAUNCH
    bit_range:
    - 27
    - 27
    description: Force the option byte loading When set to 1, this bit forces the option byte reloading. This bit is cleared only when the option byte loading is complete. It cannot be written if OPTLOCK is set.
  - name: OPTLOCK
    bit_range:
    - 30
    - 30
    description: Option lock This bit is set only. When set, all bits concerning user options in FLASH_NSCR register are locked. This bit is cleared by hardware after detecting the unlock sequence. The LOCK bit in the FLASH_NSCR must be cleared before doing the unlock sequence for OPTLOCK bit. In case of an unsuccessful unlock operation, this bit remains set until the next reset.
  - name: LOCK
    bit_range:
    - 31
    - 31
    description: Non-secure lock This bit is set only. When set, the FLASH_NSCR register is locked. It is cleared by hardware after detecting the unlock sequence in FLASH_NSKEYR register. In case of an unsuccessful unlock operation, this bit remains set until the next system reset.
  side_effects: null
- id: FLASH_SECCR
