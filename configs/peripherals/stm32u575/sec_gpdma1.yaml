    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: 'monitored FIFO level Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words). Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).'
  side_effects: null
- id: GPDMA_C5CR
  address_offset: 740
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: 'enable Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else: this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI). Else, this bit can be asserted by software. Writing 0 into this EN bit is ignored.'
  - name: RESET
    bit_range:
    - 1
    - 1
    description: 'reset This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0). The reset is effective when the channel is in steady state, meaning one of the following: - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1) - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0). After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).'
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: 'suspend Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else: Software must write 1 in order to suspend an active channel i.e. a channel with an on-going GPDMA transfer over its master ports. The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .'
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: 'Link step mode First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed. Note: This bit must be written when EN=0. This bit is read-only when EN=1.'
  - name: LAP
    bit_range:
    - 17
    - 17
    description: 'linked-list allocated port This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory. Note: This bit must be written when EN=0. This bit is read-only when EN=1.'
  - name: PRIO
    bit_range:
