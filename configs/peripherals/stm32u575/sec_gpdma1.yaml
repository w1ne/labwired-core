  address_offset: 1884
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCF
    bit_range:
    - 8
    - 8
    description: transfer complete flag clear
  - name: HTF
    bit_range:
    - 9
    - 9
    description: half transfer flag clear
  - name: DTEF
    bit_range:
