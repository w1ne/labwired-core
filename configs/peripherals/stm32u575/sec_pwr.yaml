  - name: USV
    bit_range:
    - 28
    - 28
    description: VDDUSB independent USB supply valid
  - name: IO2SV
    bit_range:
    - 29
    - 29
    description: VDDIO2 independent I/Os supply valid This bit is used to validate the VDDIO2 supply for electrical and logical isolation purpose. Setting this bit is mandatory to use PG[15:2]. If VDDIO2 is not always present in the application, the VDDIO2 voltage monitor can be used to determine whether this supply is ready or not.
  - name: ASV
    bit_range:
    - 30
    - 30
    description: VDDA independent analog supply valid
  side_effects: null
