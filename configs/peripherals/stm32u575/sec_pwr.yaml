  fields:
  - name: BOOSTRDY
    bit_range:
    - 14
    - 14
    description: EPOD booster ready This bit is set to 1 by hardware when the power booster startup time is reached. The system clock frequency can be switched higher than 50 MHz only after this bit is set.
  - name: VOSRDY
    bit_range:
    - 15
    - 15
    description: Ready bit for VCORE voltage scaling output selection
  - name: VOS
    bit_range:
    - 17
    - 16
    description: Voltage scaling range selection This field is protected against non-secure access when SYSCLKSEC = 1 in RCC_SECCFGR. It is protected against unprivileged access when SYSCLKSEC = 1 in RCC_SECCFGR and SPRIV = 1 in PWR_PRIVCFGR, or when SYSCLKSEC = 0 and NSPRIV = 1.
  - name: BOOSTEN
    bit_range:
    - 18
    - 18
    description: EPOD booster enable
  side_effects: null
- id: PWR_SVMCR
