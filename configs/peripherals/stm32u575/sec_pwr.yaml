- id: PWR_BDCR1
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BREN
    bit_range:
    - 0
    - 0
    description: 'Backup RAM retention in Standby and VBAT modes When this bit is set, the backup RAM content is kept in Standby and VBAT modes. If BREN is reset, the backup RAM can still be used in Run, Sleep and Stop modes. However, its content is lost in Standby, Shutdown and VBAT modes. This bit can be written only when the regulator is LDO, which must be configured before switching to SMPS. Note: Backup RAM cannot be preserved in Shutdown mode.'
  - name: MONEN
    bit_range:
    - 4
    - 4
    description: Backup domain voltage and temperature monitoring enable
  side_effects: null
