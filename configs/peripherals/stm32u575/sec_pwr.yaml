peripheral: SEC_PWR
version: 0.1.0
registers:
- id: PWR_CR1
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LPMS
    bit_range:
    - 2
    - 0
    description: 'Low-power mode selection These bits select the low-power mode entered when the CPU enters the Deepsleep mode. 10x: Standby mode (Standby mode also entered if LPMS = 11X in PWR_CR1 with BREN = 1 in PWR_BDCR1) 11x: Shutdown mode if BREN = 0 in PWR_BDCR1'
  - name: RRSB1
    bit_range:
    - 5
    - 5
    description: 'SRAM2 page 1 retention in Stop 3 and Standby modes This bit is used to keep the SRAM2 page 1 content in Stop 3 and Standby modes. The SRAM2 page 1 corresponds to the first 8 Kbytes of the SRAM2 (from SRAM2 base address to SRAM2 base address + 0x1FFF). Note: This bit has no effect in Shutdown mode.'
  - name: RRSB2
    bit_range:
    - 6
    - 6
    description: 'SRAM2 page 2 retention in Stop 3 and Standby modes This bit is used to keep the SRAM2 page 2 content in Stop 3 and Standby modes. The SRAM2 page 2 corresponds to the last 56 Kbytes of the SRAM2 (from SRAM2 base address + 0x2000 to SRAM2 base address + 0xFFFF). Note: This bit has no effect in Shutdown mode.'
  - name: ULPMEN
    bit_range:
    - 7
    - 7
    description: BOR ultra-low power mode This bit is used to reduce the consumption by configuring the BOR in discontinuous mode. This bit must be set to reach the lowest power consumption in the low-power modes.
  - name: SRAM1PD
    bit_range:
    - 8
    - 8
    description: SRAM1 power down This bit is used to reduce the consumption by powering off the SRAM1.
  - name: SRAM2PD
    bit_range:
    - 9
    - 9
    description: SRAM2 power down This bit is used to reduce the consumption by powering off the SRAM2.
  - name: SRAM3PD
    bit_range:
    - 10
    - 10
    description: SRAM3 power down This bit is used to reduce the consumption by powering off the SRAM3.
  - name: SRAM4PD
    bit_range:
    - 11
    - 11
    description: SRAM4 power down This bit is used to reduce the consumption by powering off the SRAM4.
  side_effects: null
- id: PWR_CR2
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SRAM1PDS1
    bit_range:
    - 0
    - 0
    description: SRAM1 page 1 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM1PDS2
    bit_range:
    - 1
    - 1
    description: SRAM1 page 2 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM1PDS3
    bit_range:
    - 2
    - 2
    description: SRAM1 page 3 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM2PDS1
    bit_range:
    - 4
    - 4
    description: 'SRAM2 page 1 (8 Kbytes) power-down in Stop modes (Stop 0, 1, 2) Note: The SRAM2 page 1 retention in Stop 3 is controlled by RRSB1 bit in PWR_CR1.'
  - name: SRAM2PDS2
    bit_range:
    - 5
    - 5
    description: 'SRAM2 page 2 (56 Kbytes) power-down in Stop modes (Stop 0, 1, 2) Note: The SRAM2 page 2 retention in Stop 3 is controlled by RRSB2 bit in PWR_CR1.'
  - name: SRAM4PDS
    bit_range:
    - 6
    - 6
    description: SRAM4 power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: ICRAMPDS
    bit_range:
    - 8
    - 8
    description: ICACHE SRAM power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: DC1RAMPDS
    bit_range:
    - 9
    - 9
    description: DCACHE1 SRAM power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: DMA2DRAMPDS
    bit_range:
    - 10
    - 10
    description: DMA2D SRAM power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: PRAMPDS
    bit_range:
    - 11
    - 11
    description: FMAC, FDCAN and USB peripherals SRAM power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: PKARAMPDS
    bit_range:
    - 12
    - 12
    description: PKA SRAM power-down
  - name: SRAM4FWU
    bit_range:
    - 13
    - 13
    description: SRAM4 fast wakeup from Stop 0, Stop 1 and Stop 2 modes This bit is used to obtain the best trade-off between low-power consumption and wakeup time. SRAM4 wakeup time increases the wakeup time when exiting Stop 0, 1 and 2 modes, and also increases the LPDMA access time to SRAM4 during Stop modes.
  - name: FLASHFWU
    bit_range:
    - 14
    - 14
    description: Flash memory fast wakeup from Stop 0 and Stop 1 modes This bit is used to obtain the best trade-off between low-power consumption and wakeup time when exiting the Stop 0 or Stop 1 modes. When this bit is set, the Flash memory remains in normal mode in Stop 0 and Stop 1 modes, which offers a faster startup time with higher consumption.
  - name: SRAM3PDS1
    bit_range:
    - 16
    - 16
    description: SRAM3 page 1 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM3PDS2
    bit_range:
    - 17
    - 17
    description: SRAM3 page 2 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM3PDS3
    bit_range:
    - 18
    - 18
    description: SRAM3 page 3 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM3PDS4
    bit_range:
    - 19
    - 19
    description: SRAM3 page 4 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM3PDS5
    bit_range:
    - 20
    - 20
    description: SRAM3 page 5 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM3PDS6
    bit_range:
    - 21
    - 21
    description: SRAM3 page 6 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM3PDS7
    bit_range:
    - 22
    - 22
    description: SRAM3 page 7 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRAM3PDS8
    bit_range:
    - 23
    - 23
    description: SRAM3 page 8 (64 Kbytes) power-down in Stop modes (Stop 0, 1, 2, 3)
  - name: SRDRUN
    bit_range:
    - 31
    - 31
    description: SmartRun domain in Run mode
  side_effects: null
