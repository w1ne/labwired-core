  - name: SYSTICKSEL
    bit_range:
    - 23
    - 22
    description: 'SysTick clock source selection These bits are used to select the SysTick clock source. Note: When LSE or LSI is selected, the AHB frequency must be at least four times higher than the LSI or LSE frequency. In addition, a jitter up to one HCLK cycle is introduced, due to the LSE or LSI sampling with HCLK in the SysTick circuitry.'
  - name: FDCAN1SEL
    bit_range:
    - 25
    - 24
    description: FDCAN1 kernel clock source selection These bits are used to select the FDCAN1 kernel clock source.
  - name: ICLKSEL
    bit_range:
    - 27
    - 26
    description: Intermediate clock source selection These bits are used to select the clock source for the OTG_FS, the USB, and the SDMMC.
  - name: TIMICSEL
    bit_range:
    - 31
    - 29
    description: 'Clock sources for TIM16,TIM17, and LPTIM2 internal input capture When TIMICSEL2 is set, the TIM16, TIM17, and LPTIM2 internal input capture can be connected either to HSI/256, MSI/4, or MSI/1024. Depending on TIMICSEL[1:0] value, MSI is either MSIK or MSIS. When TIMICSEL2 is cleared, the HSI, MSIK, and MSIS clock sources cannot be selected as�TIM16, TIM17, or LPTIM2 internal input capture. 0xx: HSI, MSIK and MSIS dividers disabled Note: The clock division must be disabled (TIMICSEL configured to 0xx) before selecting or changing a clock sources division.'
