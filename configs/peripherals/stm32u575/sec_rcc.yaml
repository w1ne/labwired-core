- id: RCC_BDCR
  address_offset: 240
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSEON
    bit_range:
    - 0
    - 0
    description: LSE oscillator enable This bit is set and cleared by software.
  - name: LSERDY
    bit_range:
    - 1
    - 1
    description: LSE oscillator ready This bit is set and cleared by hardware to indicate when the external 32�kHz oscillator is stable. After LSEON is cleared, this LSERDY bit goes low after six external low-speed oscillator clock cycles.
  - name: LSEBYP
    bit_range:
    - 2
    - 2
    description: LSE oscillator bypass This bit is set and cleared by software to bypass oscillator in debug mode. It can be written only when the external 32�kHz oscillator is disabled (LSEON = 0 and LSERDY = 0).
  - name: LSEDRV
    bit_range:
    - 4
    - 3
    description: 'LSE oscillator drive capability This bitfield is set by software to modulate the drive capability of the LSE oscillator. It can be written only when the external 32 kHz oscillator is disabled (LSEON = 0 and LSERDY = 0). Note: The oscillator is in ‘Xtal mode’ when it is not in bypass mode.'
  - name: LSECSSON
    bit_range:
    - 5
    - 5
    description: CSS on LSE enable This bit is set by software to enable the CSS on LSE. It must be enabled after the LSE oscillator is enabled (LSEON bit enabled) and ready (LSERDY flag set by hardware), and after the RTCSEL bit is selected. Once enabled, this bit cannot be disabled, except after a LSE failure detection (LSECSSD�=�1). In that case, the software must disable this LSECSSON bit.
  - name: LSECSSD
    bit_range:
    - 6
    - 6
    description: CSS on LSE failure detection This bit is set by hardware to indicate when a failure is detected by the CCS on the external 32�kHz oscillator (LSE).
  - name: LSESYSEN
    bit_range:
    - 7
    - 7
    description: LSE system clock (LSESYS) enable This bit is set by software to enable always the LSE system clock generated by RCC, which can be used by any peripheral when its source clock is the LSE, or at system level if one of LSCOSEL, MCO, or MSI PLL mode is needed.
  - name: RTCSEL
    bit_range:
    - 9
    - 8
    description: RTC and TAMP clock source selection This bit is set by software to select the clock source for the RTC and TAMP. Once the RTC and TAMP clock source has been selected, it cannot be changed anymore unless the�backup domain is reset, or unless a failure is detected on LSE (LSECSSD is set). BDRST bit can be used to reset them.
  - name: LSESYSRDY
    bit_range:
    - 11
    - 11
    description: LSE system clock (LSESYS) ready This bit is set and cleared by hardware to indicate when the LSE system clock is stable.When LSESYSEN is set, this LSESYSRDY flag is set after two LSE clock cycles. The LSE clock must be already enabled and stable (LSEON and LSERDY are set). When the LSEON bit is cleared, LSERDY goes low after six external low-speed oscillator clock cycles.
  - name: LSEGFON
    bit_range:
    - 12
    - 12
    description: LSE clock glitch filter enable This bit is set and cleared by hardware to enable the LSE glitch filter. It can be written only when the LSE is disabled (LSEON = 0 and LSERDY = 0).
  - name: RTCEN
    bit_range:
    - 15
    - 15
    description: RTC and TAMP clock enable This bit is set and cleared by software.
  - name: BDRST
    bit_range:
    - 16
    - 16
    description: Backup domain software reset This bit is set and cleared by software.
  - name: LSCOEN
    bit_range:
    - 24
    - 24
    description: Low-speed clock output (LSCO) enable This bit is set and cleared by software.
  - name: LSCOSEL
    bit_range:
    - 25
    - 25
    description: Low-speed clock output selection This bit is set and cleared by software.
  - name: LSION
    bit_range:
    - 26
    - 26
    description: LSI oscillator enable This bit is set and cleared by software. The LSI oscillator is disabled 60��s maximum after the LSION bit is cleared.
  - name: LSIRDY
    bit_range:
    - 27
    - 27
    description: LSI oscillator ready This bit is set and cleared by hardware to indicate when the LSI oscillator is stable. After�LSION is cleared, LSIRDY goes low after three internal low-speed oscillator clock cycles. This bit is set when the LSI is used by IWDG or RTC, even if LSION = 0.
  - name: LSIPREDIV
    bit_range:
    - 28
    - 28
