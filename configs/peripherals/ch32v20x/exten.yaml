# CH32V20x EXTEND block at 0x40023800 (ch32fun ch32v20xhw.h EXTEN_TypeDef;
# field list from ch32-rs/ch32-data data/registers/extend_v3.yaml). Storage
# only: EXTEN_CTR reads back what was written and changes nothing else.
# ch32fun's SystemInit sets PLL_HSI_PRE (bit 4, HSI undivided into the PLL);
# the chip's cpu_hz states the resulting 144 MHz rather than deriving it, so
# the bit has no effect here, and neither do the USBD, LOCKUP and LDO trim
# fields. The reset value is taken as 0; neither source states it.
peripheral: EXTEN
version: 0.1.0
registers:
- id: EXTEN_CTR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: USBDLS
    bit_range: [0, 0]
    description: USBD low-speed enable (not modelled)
  - name: USBDPU
    bit_range: [1, 1]
    description: USBD pull-up enable (not modelled)
  - name: PLL_HSI_PRE
    bit_range: [4, 4]
    description: "PLL HSI input: 0 = HSI/2, 1 = HSI"
  - name: LOCKUP_EN
    bit_range: [6, 6]
    description: LOCKUP enable
  - name: LOCKUP_RSTF
    bit_range: [7, 7]
    description: LOCKUP reset flag
  - name: ULLDO_TRIM
    bit_range: [9, 8]
    description: ULLDO trim
  - name: LDO_TRIM
    bit_range: [11, 10]
    description: LDO trim
  - name: HSE_KEEP_LP
    bit_range: [12, 12]
    description: HSE kept in low power
  side_effects: null
