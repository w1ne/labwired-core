- id: FUNC0-39_OUT_SEL_CFG
  address_offset: 1328
  size: 32
  access: READ_WRITE
  # 256 = SIG_GPIO_OUT_IDX, the "nothing routed / driven by the GPIO_OUT latch"
  # sentinel. The 0 here was the SVD ingestor's default, not a measurement: the
  # vendored esp32.svd carries no resetValue for this register and gpio_reg.h
  # records the field default as `x`. A schema reporting 0 would tell a debugger
  # every pad boots routed to SPICLK (signal index 0) and contradict the model.
  reset_value: 256
  fields:
  - name: OUT_SEL
    bit_range:
    - 8
    - 0
    description: select one of the 256 output to 40 GPIO
  - name: INV_SEL
    bit_range:
    - 9
    - 9
    description: invert the output value  if you want to revert the output value  setting the value to 1
  - name: OEN_SEL
    bit_range:
    - 10
    - 10
    description: weather using the logical oen signal or not using the value setting by the register
  - name: OEN_INV_SEL
    bit_range:
    - 11
    - 11
    description: invert the output enable value  if you want to revert the output enable value  setting the value to 1
  side_effects: null
