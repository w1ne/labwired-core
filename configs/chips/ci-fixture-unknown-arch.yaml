# Fixture for the world node factory's architecture dispatch: a chip that
# parses cleanly but names no architecture the engine has a machine for. Used
# to prove such a node fails at build time instead of joining the world as a
# machine that never executes anything.
name: "ci-fixture-unknown-arch"
arch: "unknown"
registers_count: 16
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# CI fixture — see ci-fixture-cortex-m3-uart1.yaml.
cpu_hz: 80_000_000

# Synthetic mixed-signal endpoint used only by direct SystemBus/co-simulation
# tests. The unknown architecture remains intentionally non-runnable in World.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7

flash:
  base: 0x80000000
  size: "128KB"
ram:
  base: 0x80020000
  size: "64KB"
peripherals:
  - id: "uart1"
    type: "uart"
    base_address: 0x4000C000
    size: "1KB"
  # Generic GPIO endpoint for analog routing tests. Not silicon data.
  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010000
    size: "1KB"
    config:
      profile: "stm32v2"
