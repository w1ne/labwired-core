#
# Renesas R5F52618BGFP (RX261, RXv3 core with single-precision FPU, 64 MHz,
# 512 KiB code flash, 128 KiB RAM, 100-pin LFQFP) on the EK-RX261 evaluation
# kit (RTK5EK2610S00001BE). SIM-DERIVED: no RX261 bench part.
#
# Sources:
#   - RX261 Group User's Manual: Hardware (R01UH1045): memory map, ICU, CMT,
#     SCI, clock generation, FLASH.
#   - Renesas RX Driver Package (hal_renesas a279c14e196c)
#     r_bsp/mcu/rx261/register_access/gnuc/iodefine.h: peripheral bases and
#     register offsets (SYSTEM 0x00080000, ICU 0x00087000, CMT 0x00088000,
#     SCI6 0x0008A0C0, PORT0 0x0008C000, MPC 0x0008C11F, RTC 0x0008C400,
#     FLASH 0x007FC090).
#   - Zephyr v4.3.0 dts/rx/renesas/{rx261-common,r5f52618bgfp}.dtsi and
#     boards/renesas/ek_rx261: console on SCI6 (RXI6/TXI6/TEI6/ERI6 =
#     vectors 227/228/229/226), CMT0 system tick (CMI0 = vector 28), CMT1
#     cycle counter (CMI1 = vector 29), CMT at PCLKB/8 = 4 MHz.
#
# Tier: L1 boot + UART + stock RTOS. Stock Zephyr v4.3.0 hello_world,
# synchronization, tests/kernel/common and tests/drivers/uart/uart_basic_api
# (interrupt-driven SCI6) for `ek_rx261` run
# (examples/ek-rx261, crates/firmware-ek-rx261-zephyr).
#
# Core: `arch: rx` builds the RX machine family (crates/core/src/cpu/rx.rs).
# The ICU (IR/DTCER/IER/SWINTR/FIR/IPR, 0x00087000-0x000876FF) is part of the
# core, so it is not listed below; a peripheral's `irq`/explicit IRQ is the
# ICU vector number. The core starts at the fixed reset vector 0xFFFFFFFC.
#
# S12AD (12-bit A/D converter, S12ADE): R01UH1045EJ0100 section 40 and
# Table 1.5 (100-pin LFQFP pin functions); iodefine.h `st_s12ad` at 0x00089000
# (offsets checked with `offsetof` and the RX GCC). The register layout and the
# ADCSR/ADCER bits match the RA ADC12, so the block runs on the existing
# `ra_adc12` model, unchanged. See the `s12ad` entry and `analog_pins` below.
#
# NOT modelled in this slice:
# - PORT/MPC register behavior (pin direction/output/input, PmnPFS): a
#   declared stub. The EK-RX261 LEDs and switch remain unreachable. SCI6 needs
#   no pad routing, and the AN pads below are analog routes only.
# - SCI6 ERI6 (receive errors) is never requested; RXI6/TXI6/TEI6 are, as
#   ICU vectors (`rxi_vector`). Every request is an edge into IRn.
# - DTC, BSC, the reset/LVD status block at 0x0008C280: declared stubs.
# - FLASH programming/erase (FACI): `rx_flash` stores the control registers
#   with the 0xAA key convention only. RTC: plain storage (`rx_rtc`), no
#   counting.
# - Clock rates: `rx_sysc` derives the oscillator stable flags and the
#   clock-switch handshakes; no rate follows SCKCR/PLL settings. `cpu_hz` is
#   the 64 MHz ICLK Zephyr's board selects; the CMT counts the 32 MHz PCLKB.
# - Data flash (0x00100000), option-setting memory and the trusted memory
#   area: not mapped. Zephyr's ELF carries a zero-filled `.ofsm` NOBITS
#   section over the vector table's reserved words, which loads as zeros.
name: "r5f52618bgfp"
arch: "rx"
core: "rxv3"
cpu_hz: 64_000_000
# RAM sits at 0x0; the RX has no Cortex-M style flash mirror there.
flash_boot_alias: false
flash:
  # Code flash at the top of the address space; the fixed vector table and
  # the reset vector are its last 128 bytes.
  base: 0xFFF80000
  size: "512KB"
ram:
  base: 0x00000000
  size: "128KB"
peripherals:
  # RTC registers, held as storage: the RDP sub-clock setup writes RCR1/RCR2
  # and waits to read START/CNTMD/RESET back. No counting.
  - id: "rtc"
    type: "rx_rtc"
    base_address: 0x0008C400
    size: "256B"
  # SCI6 (classic SCI, async): SMR +0, BRR +1, SCR +2, TDR +3, SSR +4,
  # RDR +5, SCMR +6, SEMR +7 — the RA4M1/RA6M5 `sci` layout.
  - id: "sci6"
    type: "uart"
    base_address: 0x0008A0C0
    size: "32B"
    config:
      profile: "sci"
      # RXI6/TXI6/TEI6 are ICU vectors 227/228/229 (Zephyr rx261-common.dtsi),
      # latched in the core's ICU IRn. TDRE/TEND edges are timed at 115200
      # baud in 64 MHz ICLK cycles.
      rxi_vector: 227
      clock_hz: 64000000
      baud: 115200
  # FLASH control registers (FLASH 0x007FC090; MEMWAITR at 0x007FFFC0).
  - id: "flash_regs"
    type: "rx_flash"
    base_address: 0x007FC000
    size: "16KB"
  # SYSTEM: MSTPCRx, SCKCR/SCKCR3, oscillator and PLL control, OSCOVFSR,
  # OPCCR, the USB/CANFD clock switches, PRCR (+0x3FE).
  - id: "system"
    type: "rx_sysc"
    base_address: 0x00080000
    size: "1KB"
  - id: "bsc"
    type: "stub"
    base_address: 0x00081300
    size: "256B"
  - id: "dtc"
    type: "stub"
    base_address: 0x00082400
    size: "64B"
  # CMT unit 0 (CMSTR0, CMT0, CMT1) and unit 1 (CMSTR1, CMT2, CMT3).
  - id: "cmt0"
    type: "rx_cmt"
    base_address: 0x00088000
    size: "16B"
    config:
      vectors: [28, 29]
      clock_hz: 64000000
      pclkb_hz: 32000000
  - id: "cmt1"
    type: "rx_cmt"
    base_address: 0x00088010
    size: "16B"
    config:
      vectors: [30, 31]
      clock_hz: 64000000
      pclkb_hz: 32000000
  # S12AD, the 12-bit A/D converter (S12ADE, one unit, R01UH1045EJ0100
  # section 40). On `ra_adc12`: ADCSR +0x00 (ADST bit 15, ADCS bits 14:13),
  # ADANSA0/1 +0x04/+0x06, ADADS0/1 +0x08/+0x0A, ADADC +0x0C, ADCER +0x0E
  # (ADRFMT bit 15; the ADPRC bits are reserved 0 on the RX261, which the
  # model reads as 12-bit), ADDR0-ADDR28 +0x20 (ADDRn holds ANn, channel 16 is
  # AN016). The model converts a nominal 1 us per channel at `clock_hz`; the
  # manual gives 0.7 us at ADCLK 64 MHz (Table 40.1). `elc_event` is the
  # S12ADI0 vector, 102 (Table 14.3): the RX ICU links no events, so the
  # scan-end interrupt is NOT delivered and firmware polls ADCSR.ADST.
  # VREFH0 = AVCC0 = 3.3 V is an ASSUMPTION for the EK-RX261 default supply.
  - id: "s12ad"
    type: "ra_adc12"
    base_address: 0x00089000
    size: "512B"
    config:
      elc_event: 102
      clock_hz: 64000000
      vref_mv: 3300
  # PORT0-J (0x0008C000) and MPC (0x0008C11F, PmnPFS from 0x0008C140):
  # storage-free stub, no pin behavior.
  - id: "port"
    type: "stub"
    base_address: 0x0008C000
    size: "640B"
  # Reset status (RSTSR0/2), LVD, FWEPROR (part of the SYSTEM struct).
  - id: "system_rst"
    type: "stub"
    base_address: 0x0008C280
    size: "128B"

# AN pads of the 100-pin LFQFP (R01UH1045EJ0100 Table 1.5): AN000-AN007 on
# P40-P47 (AVCC0 I/O supply), AN016-AN023 on PE0-PE7, AN024-AN026 on PD0-PD2,
# AN027-AN028 on PD3-PD4. AN029-AN031 (PD5-PD7) are left out: `ra_adc12`
# holds ADDR0-ADDR28 only. AN008 has no pin on this product (TSCAP).
analog_pins:
  P40: { peripheral: s12ad, channel: 0 }    # AN000, pin 95
  P41: { peripheral: s12ad, channel: 1 }    # AN001, pin 93
  P42: { peripheral: s12ad, channel: 2 }    # AN002, pin 92
  P43: { peripheral: s12ad, channel: 3 }    # AN003, pin 91
  P44: { peripheral: s12ad, channel: 4 }    # AN004, pin 90
  P45: { peripheral: s12ad, channel: 5 }    # AN005, pin 89
  P46: { peripheral: s12ad, channel: 6 }    # AN006, pin 88
  P47: { peripheral: s12ad, channel: 7 }    # AN007, pin 87
  PE0: { peripheral: s12ad, channel: 16 }   # AN016, pin 78
  PE1: { peripheral: s12ad, channel: 17 }   # AN017, pin 77
  PE2: { peripheral: s12ad, channel: 18 }   # AN018, pin 76
  PE3: { peripheral: s12ad, channel: 19 }   # AN019, pin 75
  PE4: { peripheral: s12ad, channel: 20 }   # AN020, pin 74
  PE5: { peripheral: s12ad, channel: 21 }   # AN021, pin 73
  PE6: { peripheral: s12ad, channel: 22 }   # AN022, pin 72
  PE7: { peripheral: s12ad, channel: 23 }   # AN023, pin 71
  PD0: { peripheral: s12ad, channel: 24 }   # AN024, pin 86
  PD1: { peripheral: s12ad, channel: 25 }   # AN025, pin 85
  PD2: { peripheral: s12ad, channel: 26 }   # AN026, pin 84
  PD3: { peripheral: s12ad, channel: 27 }   # AN027, pin 83
  PD4: { peripheral: s12ad, channel: 28 }   # AN028, pin 82
