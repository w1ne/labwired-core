# Focused micro:bit v2 profile for the UARTE0 console smoke.
# GPIO0/GPIO1 provide the pads selected by UARTE0; other SoC blocks are omitted.
name: "nrf52833-microbit-v2-uart-smoke"
arch: "arm"
core: "cortex-m4"
cpu_hz: 64_000_000

flash:
  base: 0x00000000
  size: "512KB"
ram:
  base: 0x20000000
  size: "128KB"

peripherals:
  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    size: "4KB"
    irq: 2
    config:
      debug_schema: "../peripherals/nrf52840/uart0.yaml"

  - id: "gpio0"
    type: "gpio"
    base_address: 0x50000000
    size: "2048B"
    config:
      debug_schema: "../peripherals/nrf52840/p0.yaml"
      profile: "nrf52"

  - id: "gpio1"
    type: "gpio"
    base_address: 0x50000800
    size: "768B"
    config:
      debug_schema: "../peripherals/nrf52833/p1.yaml"
      profile: "nrf52"
      num_pins: 10
      reg_offset: 0x500
