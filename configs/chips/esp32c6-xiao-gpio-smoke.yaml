# Narrow HP-core profile for the XIAO ESP32-C6 onboard USER LED smoke.
# Only the memory map and the real C6 GPIO model needed by GPIO15 are loaded.
# Radio, LP core, USB, UART, I2C, SPI, ADC, battery, and RF-switch behavior are
# intentionally outside this smoke profile.

name: "esp32c6-xiao-gpio-smoke"
arch: "riscv"
core: "rv32imac"
registers_count: 31
cpu_hz: 160_000_000

flash:
  base: 0x42000000
  size: "4096KB"
ram:
  base: 0x40800000
  size: "512KB"

pins:
  GPIO15: { gpio: "gpio", bit: 15, functions: [{ type: gpio, peripheral: gpio }] }

peripherals:
  - id: "gpio"
    type: "esp32c6_gpio"
    base_address: 0x60091000
    size: "3840"
    config:
      debug_schema: "../peripherals/esp32c6/gpio.yaml"
