# LabWired - RP2350 Chip Descriptor
# Cortex-M33 ×2 (core 1 held; bring-up is single-core). Addresses verified
# against pico-sdk rp2350 hardware_regs (addressmap.h / intctrl.h): the RP2350
# moved the whole low-APB map, so every base below is the RP2350 one, not the
# RP2040's. Reuses the RP2040 behavioural models (PL011 UART, DW I2C/SPI, PIO,
# SIO, DMA, ADC, PWM, watchdog, clock/reset with the rp2350 profile).
# Not declared (documented in docs/boards/rp2350.md): POWERMAN/TICKS/TRNG/
# SHA-256/OTP/HSTX/USB enumeration/XIP QMI programming, TrustZone, Hazard3
# RISC-V cores, second M33 core.
name: "rp2350"
arch: "arm"
core: "cortex-m33"
registers_count: 240
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# RP2350 maximum system clock, 150 MHz (datasheet §8.6.3: "the maximum
# frequencies of the chip's clock generators … for the system PLL this is
# 150 MHz").
cpu_hz: 150_000_000

flash:
  base: 0x10000000
  # 2 MiB of external QSPI NOR (the Pico 2's W25Q16), spelled in KB because
  # `parse_size` reads MB as 10^6 — "2MB" would be 2_000_000, 97_152 bytes
  # short. Gated by crates/core/src/tests/chip_memory_sizes.rs.
  size: "2048KB"
ram:
  base: 0x20000000
  # 520KB contiguous: 10 striped banks + the two 4KB scratch banks
  # (SCRATCH_X @0x20080000, SCRATCH_Y @0x20081000).
  size: "520KB"
# Bare ELFs (cortex-m-rt) place the vector table at flash base; pico-sdk
# RP2350 images carry IMAGE_DEF first. We fast-boot bare ELFs, so no
# reset_vector_offset here (unlike the RP2040 descriptor's boot2 offset).
reset_vector_offset: 0x0
# Boot ROM @ 0x00000000, 32 KB (datasheet 2.2 address map). pico-sdk and the
# arduino-pico OTA stage call bootrom APIs through the well-known pointers at
# 0x14..0x19 (datasheet 5.4.1, Table 453). In-tree clean-room image
# (crates/core/roms/rp2350/rp2350_bootrom.S — NOT a Raspberry Pi dump): the
# table lookup plus the APIs the SDK boot path calls. Set
# LABWIRED_RP2350_BOOTROM to a file to replace it, or to "" to drop the window
# (address 0 then aliases flash again).
memory_regions:
  - name: "bootrom"
    base: 0x00000000
    size: "32KB"
    image_env: "LABWIRED_RP2350_BOOTROM"
# Double-precision coprocessor on the M33 coprocessor interface, p4 (current
# security state) and p5 (Non-secure) — datasheet 3.6.2. pico-sdk enables
# it in runtime_init_per_core_enable_coprocessors and routes double
# arithmetic/conversions/compares through it (pico_double, dcp_canned).
coprocessors: [rp2350_dcp]
# Atomic SET/CLR/XOR aliases, same scheme as RP2040 (rp2350 addressmap.h
# REG_ALIAS_*_BITS).
atomic_register_aliases: true
peripherals:
  # SYSINFO (CHIP_ID 0x30004927 = revision 3, part 0x0004, manufacturer 0x927
  # — rp2350 sysinfo.h). The pico-sdk USB errata workaround asserts the
  # Raspberry Pi manufacturer id here.
  - id: "sysinfo"
    type: "declarative"
    base_address: 0x40000000
    size: "4KB"
    config:
      path: "../peripherals/rp2350/sysinfo.yaml"
  # CLOCKS / RESETS / XOSC / PLL_SYS / PLL_USB — the shared clock-reset model
  # on the RP2350 address map (rp2350 profile: CLOCKS @0x40010000, RESETS
  # @0x40020000, XOSC @0x40048000, PLLs @0x40050000/0x40058000). Window ends
  # at ACCESSCTRL (0x40060000): 0x50000 = 320KB. (288KB stopped at
  # 0x40058000 and cut PLL_USB off — pico-sdk pll_init(pll_usb) BusFaulted.)
  - id: "clk_rst"
    type: "rp2040_clkrst"
    base_address: 0x40010000
    size: "320KB"
    config:
      debug_schema: "../peripherals/rp2350/clocks.yaml"
      profile: "rp2350"
  - id: "rosc"
    type: "rp2040_clkrst"
    base_address: 0x400E8000
    size: "4KB"
    config:
      profile: "rp2350"
  # POWERMAN + TICKS window (0x40100000..0x4010C000) — register storage only;
  # no power sequencing.
  - id: "powman"
    type: "stub"
    base_address: 0x40100000
    size: "48KB"
  - id: "uart0"
    type: "uart"
    base_address: 0x40070000
    irq: 33
    config:
      debug_schema: "../peripherals/rp2350/uart0.yaml"
      profile: "pl011"
  - id: "uart1"
    type: "uart"
    base_address: 0x40078000
    irq: 34
    config:
      profile: "pl011"
  - id: "spi0"
    type: "rp2040_spi"
    base_address: 0x40080000
    size: "4KB"
    irq: 31
  - id: "spi1"
    type: "rp2040_spi"
    base_address: 0x40088000
    size: "4KB"
    irq: 32
  - id: "i2c0"
    type: "rp2040_i2c"
    base_address: 0x40090000
    size: "4KB"
    irq: 36
  - id: "i2c1"
    type: "rp2040_i2c"
    base_address: 0x40098000
    size: "4KB"
    irq: 37
  - id: "adc"
    type: "rp2040_adc"
    base_address: 0x400A0000
    size: "4KB"
    irq: 35
    config:
      debug_schema: "../peripherals/rp2350/adc.yaml"
  - id: "pwm"
    type: "rp2040_pwm"
    base_address: 0x400A8000
    size: "4KB"
    irq: 8
    config:
      debug_schema: "../peripherals/rp2350/pwm.yaml"
  - id: "timer0"
    type: "rp2040_timer"
    base_address: 0x400B0000
    size: "4KB"
  # XIP_CTRL (flash cache control) — declarative storage, as on RP2040.
  - id: "xip_ctrl"
    type: "declarative"
    base_address: 0x400C8000
    size: "4KB"
    config:
      path: "../peripherals/rp2350/xip_ctrl.yaml"
  - id: "watchdog"
    type: "rp2040_watchdog"
    base_address: 0x400D8000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/watchdog.yaml"
  - id: "dma"
    type: "rp2040_dma"
    base_address: 0x50000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/dma.yaml"
  - id: "pio0"
    type: "pio"
    base_address: 0x50200000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/pio0.yaml"
  - id: "pio1"
    type: "pio"
    base_address: 0x50300000
    size: "4KB"
  - id: "pio2"
    type: "pio"
    base_address: 0x50400000
    size: "4KB"
  # BOOT RAM endpoint (datasheet 4.3): 1 KB boot RAM, WRITE_ONCE0/1 and the
  # BOOTLOCK0..7 try-locks at +0x800. pico-sdk pre-main resets the boot locks
  # and spins claiming BOOTLOCK7 (runtime_init_bootrom_locking_enable);
  # unmapped, the first BOOTLOCK store BusFaulted at 0x400E080C.
  - id: "bootram"
    type: "rp2350_bootram"
    base_address: 0x400E0000
    size: "4KB"
  # USB device controller: the RP2040 one at the same addresses — DPRAM
  # 0x50100000 + register block 0x50110000 (datasheet 12.7, MAIN_CTRL @0x040,
  # USB_MUXING @0x074 ...) — on USBCTRL_IRQ 14 (datasheet 3.2, Table 95).
  # pico-sdk's pre-main runtime_init_usb_power_down writes it before any user
  # code; unmapped, that store BusFaulted at 0x5011004C. Same behavioural
  # model and simulated host as rp2040.yaml.
  - id: "usbctrl"
    type: "rp2040_usb"
    base_address: 0x50100000
    size: "80KB"
    irq: 14
  # TBMAN — storage stub; PLATFORM reads 0 → ASIC path, correct for the sim.
  - id: "tbman"
    type: "stub"
    base_address: 0x40160000
    size: "4KB"
  # SIO (single-cycle IO) — GPIO out/oe + readback. CPUID reads 0 (core 0;
  # core 1 is not modeled yet).
  - id: "sio"
    type: "rp2040_sio"
    base_address: 0xD0000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/sio.yaml"
  # Cortex-M33 SCS ACTLR (0xE000E008), a plain register: pico-sdk's
  # spinlock_set_extexclall() sets EXTEXCLALL during runtime init.
  - id: "actlr"
    type: "declarative"
    base_address: 0xE000E008
    size: "4B"
    config:
      path: "../peripherals/rp2350/actlr.yaml"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: "16B"
  - id: "nvic"
    type: "nvic"
    base_address: 0xE000E100
    size: "1KB"
