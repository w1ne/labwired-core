# STM32G0B1RE narrow firmware slice; not a full-chip validation claim.
# Sources: ST stm32g0b1re.pdf and RM0444; pinned ST CMSIS
# stm32g0b1xx.h f576c24e123edf3332988ecd49512c0f35f85186.
# 512KiB flash; expose the 128KiB parity-protected SRAM bank only.
# Firmware resets HSI/APB/AHB to 16MHz; no PLL or alternate clock support
# is asserted by this slice. Only peripherals used by the existing reference
# firmware and Nucleo board smoke are included. GPIO EXTI excludes SWIER and
# internal event lines.
name: stm32g0b1re
arch: arm
core: cortex-m0+
cpu_hz: 16000000
flash:
  base: 0x8000000
  size: 512KB
ram:
  base: 0x20000000
  size: 128KB
pins:
  # Pad map for the LQFP64 package (ST STM32_open_pin_data, mcu/
  # STM32G0B1R(B-C-E)Tx.xml @ 7d1f1514). Every pad on the three GPIO ports this
  # slice models (A, B, C) is present; PA11/PA12 are the pin-remap pair
  # (PA9/PA10 on pins 43/44) and PA14 is BOOT0. Ports D and F exist on the
  # package but are not modelled by this slice, so their pads are not listed.
  PA0: { gpio: gpioa, bit: 0 }
  PA1: { gpio: gpioa, bit: 1 }
  PA2: { gpio: gpioa, bit: 2 }
  PA3: { gpio: gpioa, bit: 3 }
  PA4: { gpio: gpioa, bit: 4 }
  PA5: { gpio: gpioa, bit: 5 }
  PA6: { gpio: gpioa, bit: 6 }
  PA7: { gpio: gpioa, bit: 7 }
  PA8: { gpio: gpioa, bit: 8 }
  PA9: { gpio: gpioa, bit: 9 }
  PA10: { gpio: gpioa, bit: 10 }
  PA11: { gpio: gpioa, bit: 11 }
  PA12: { gpio: gpioa, bit: 12 }
  PA13: { gpio: gpioa, bit: 13 }
  PA14: { gpio: gpioa, bit: 14 }
  PA15: { gpio: gpioa, bit: 15 }
  PB0: { gpio: gpiob, bit: 0 }
  PB1: { gpio: gpiob, bit: 1 }
  PB2: { gpio: gpiob, bit: 2 }
  PB3: { gpio: gpiob, bit: 3 }
  PB4: { gpio: gpiob, bit: 4 }
  PB5: { gpio: gpiob, bit: 5 }
  PB6: { gpio: gpiob, bit: 6 }
  PB7: { gpio: gpiob, bit: 7 }
  PB8: { gpio: gpiob, bit: 8 }
  PB9: { gpio: gpiob, bit: 9 }
  PB10: { gpio: gpiob, bit: 10 }
  PB11: { gpio: gpiob, bit: 11 }
  PB12: { gpio: gpiob, bit: 12 }
  PB13: { gpio: gpiob, bit: 13 }
  PB14: { gpio: gpiob, bit: 14 }
  PB15: { gpio: gpiob, bit: 15 }
  PC0: { gpio: gpioc, bit: 0 }
  PC1: { gpio: gpioc, bit: 1 }
  PC2: { gpio: gpioc, bit: 2 }
  PC3: { gpio: gpioc, bit: 3 }
  PC4: { gpio: gpioc, bit: 4 }
  PC5: { gpio: gpioc, bit: 5 }
  PC6: { gpio: gpioc, bit: 6 }
  PC7: { gpio: gpioc, bit: 7 }
  PC8: { gpio: gpioc, bit: 8 }
  PC9: { gpio: gpioc, bit: 9 }
  PC10: { gpio: gpioc, bit: 10 }
  PC11: { gpio: gpioc, bit: 11 }
  PC12: { gpio: gpioc, bit: 12 }
  PC13: { gpio: gpioc, bit: 13 }
  PC14: { gpio: gpioc, bit: 14 }
  PC15: { gpio: gpioc, bit: 15 }
peripherals:
- id: rcc
  type: rcc
  base_address: 0x40021000
  size: 1KB
  config:
    profile: stm32g0
- id: systick
  type: systick
  base_address: 0xe000e010
- id: gpioa
  type: gpio
  base_address: 0x50000000
  size: 1KB
  config:
    profile: stm32v2
    reset_moder: 0xebffffff
    reset_ospeedr: 0xc000000
    reset_pupdr: 0x24000000
  clock:
    reg: iopenr
    bit: 0
- id: gpiob
  type: gpio
  base_address: 0x50000400
  size: 1KB
  config:
    profile: stm32v2
    reset_moder: 0xffffffff
    reset_ospeedr: 0x0
    reset_pupdr: 0x0
  clock:
    reg: iopenr
    bit: 1
- id: gpioc
  type: gpio
  base_address: 0x50000800
  size: 1KB
  config:
    profile: stm32v2
    reset_moder: 0xffffffff
    reset_ospeedr: 0x0
    reset_pupdr: 0x0
  clock:
    reg: iopenr
    bit: 2
- id: usart1
  type: uart
  base_address: 0x40013800
  size: 1KB
  irq: 27
  config:
    profile: stm32v2
  clock:
    reg: apbenr2
    bit: 14
- id: usart2
  type: uart
  base_address: 0x40004400
  size: 1KB
  irq: 28
  config:
    profile: stm32v2
  # RCC_APBENR1.USART2EN (bit 17, RM0444 §5.4.14). NUCLEO-G0B1RE routes
  # PA2/PA3 to the on-board ST-LINK virtual COM port (UM2324 §6.9).
  clock:
    reg: apbenr1
    bit: 17
- id: tim2
  type: timer
  base_address: 0x40000000
  size: 1KB
  irq: 15
  config:
    width: 32
  clock:
    reg: apbenr1
    bit: 0
- id: exti
  type: exti
  base_address: 0x40021800
  size: 1KB
  config:
    profile: stm32g0
- id: syscfg
  type: syscfg
  base_address: 0x40010000
  size: 1KB
  clock:
    reg: apbenr2
    bit: 0
- id: nvic
  type: nvic
  base_address: 0xe000e100
  size: 1KB
