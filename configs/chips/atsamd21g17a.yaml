#
# EXACT ORDERABLE GEOMETRY for ATSAMD21G17A (device variant A).
#
#   Flash 128KB at 0x00000000 · SRAM 16KB at 0x20000000
#   48-pin package (TQFP48/QFN48) · 38 GPIO pins · 6 SERCOM
#
# SOURCE OF TRUTH for the geometry and ordering suffixes:
#   Microchip SAM D21/DA1 Family Data Sheet DS40001882H
#   - sec. 2  Configuration Summary (flash/SRAM/pins/packages/GPIO/SERCOM count)
#   - sec. 3  SAM D21 Ordering Information (variant/package/grade/carrier suffix)
#   - sec. 5  Pinout (32/48/64-pin TQFP/QFN bond-out)
#   https://ww1.microchip.com/downloads/aemDocuments/documents/MCU32/ProductDocuments/DataSheets/SAM-D21-DA1-Family-Data-Sheet-DS40001882H.pdf
#
# SOURCE OF TRUTH for every peripheral base/IRQ below:
#   ATSAMD21G18A.svd (Microchip Technology Inc., Apache-2.0), vendored at
#   tests/fixtures/real_world/atsamd21g18a.svd. The SAM D21 family shares one
#   linear peripheral map; only the instance count changes on the E.
#
# REUSE BOUNDARY, STATED PLAINLY: this is a GEOMETRY variant on the existing
# public atsamd21g18a engine. It reuses that descriptor's PM/SYSCTRL/GCLK/WDT/
# NVMCTRL/PORT/SERCOM models verbatim by path. It does NOT add, improve or
# claim any peripheral or clock fidelity beyond atsamd21g18a.yaml: USB, EIC,
# DMAC, EVSYS, RTC, TCC, TC, ADC, AC, DAC, I2S and PTC remain unmodelled; PM
# is a register bank, not a clock gate; SYNCBUSY reads zero; SERCOM supports
# USART mode only. The `pins:` map is the family-wide label→(port, bit) map,
# not a package bond-out claim (the package pin counts above are the datapoint).
#
# Ordering suffixes for the A variant in TQFP/QFN (part base + suffix):
#   -AU  TQFP, -40..85 C, tray     -AUT  TQFP, -40..85 C, tape & reel
#   -AF  TQFP, -40..125 C, tray    -AFT  TQFP, -40..125 C, tape & reel
#   -MU  QFN,  -40..85 C, tray     -MUT  QFN,  -40..85 C, tape & reel
#   -MF  QFN,  -40..125 C, tray    -MFT  QFN,  -40..125 C, tape & reel
# The B/C/D/L suffixes are different silicon/pinout variants and are NOT
# aliased to this descriptor.
# NOTE: DS40001882H also offers these two G parts in a 45-ball
# WLCSP (38 GPIO, five TC instances). That package is not the
# 48-pin TQFP/QFN geometry described by this descriptor.

name: "atsamd21g17a"
arch: "arm"
core: "cortex-m0+"
cpu_hz: 48_000_000

# Descriptive ordering data. The engine ignores these keys; the focused
# `atsamd21_variant_geometry` gate parses and checks them against DS40001882H.
package: "TQFP48/QFN48"
pin_count: 48
gpio_pin_count: 38
variant: "A"
orderable_suffixes: ["AU", "AUT", "AF", "AFT", "MU", "MUT", "MF", "MFT"]

flash:
  base: 0x00000000
  size: "128KB"
ram:
  base: 0x20000000
  size: "16KB"

# Family-wide P<group><bit> label map. Package bond-out is a board fact; this
# map only says which PORT register and bit a label names when it is bonded.
pins:
  PA0: { gpio: gpio_a, bit: 0 }
  PA1: { gpio: gpio_a, bit: 1 }
  PA2: { gpio: gpio_a, bit: 2 }
  PA3: { gpio: gpio_a, bit: 3 }
  PA4: { gpio: gpio_a, bit: 4 }
  PA5: { gpio: gpio_a, bit: 5 }
  PA6: { gpio: gpio_a, bit: 6 }
  PA7: { gpio: gpio_a, bit: 7 }
  PA8: { gpio: gpio_a, bit: 8 }
  PA9: { gpio: gpio_a, bit: 9 }
  PA10: { gpio: gpio_a, bit: 10 }
  PA11: { gpio: gpio_a, bit: 11 }
  PA12: { gpio: gpio_a, bit: 12 }
  PA13: { gpio: gpio_a, bit: 13 }
  PA14: { gpio: gpio_a, bit: 14 }
  PA15: { gpio: gpio_a, bit: 15 }
  PA16: { gpio: gpio_a, bit: 16 }
  PA17: { gpio: gpio_a, bit: 17 }
  PA18: { gpio: gpio_a, bit: 18 }
  PA19: { gpio: gpio_a, bit: 19 }
  PA20: { gpio: gpio_a, bit: 20 }
  PA21: { gpio: gpio_a, bit: 21 }
  PA22: { gpio: gpio_a, bit: 22 }
  PA23: { gpio: gpio_a, bit: 23 }
  PA24: { gpio: gpio_a, bit: 24 }
  PA25: { gpio: gpio_a, bit: 25 }
  PA26: { gpio: gpio_a, bit: 26 }
  PA27: { gpio: gpio_a, bit: 27 }
  PA28: { gpio: gpio_a, bit: 28 }
  PA29: { gpio: gpio_a, bit: 29 }
  PA30: { gpio: gpio_a, bit: 30 }
  PA31: { gpio: gpio_a, bit: 31 }
  PB0: { gpio: gpio_b, bit: 0 }
  PB1: { gpio: gpio_b, bit: 1 }
  PB2: { gpio: gpio_b, bit: 2 }
  PB3: { gpio: gpio_b, bit: 3 }
  PB4: { gpio: gpio_b, bit: 4 }
  PB5: { gpio: gpio_b, bit: 5 }
  PB6: { gpio: gpio_b, bit: 6 }
  PB7: { gpio: gpio_b, bit: 7 }
  PB8: { gpio: gpio_b, bit: 8 }
  PB9: { gpio: gpio_b, bit: 9 }
  PB10: { gpio: gpio_b, bit: 10 }
  PB11: { gpio: gpio_b, bit: 11 }
  PB12: { gpio: gpio_b, bit: 12 }
  PB13: { gpio: gpio_b, bit: 13 }
  PB14: { gpio: gpio_b, bit: 14 }
  PB15: { gpio: gpio_b, bit: 15 }
  PB16: { gpio: gpio_b, bit: 16 }
  PB17: { gpio: gpio_b, bit: 17 }
  PB18: { gpio: gpio_b, bit: 18 }
  PB19: { gpio: gpio_b, bit: 19 }
  PB20: { gpio: gpio_b, bit: 20 }
  PB21: { gpio: gpio_b, bit: 21 }
  PB22: { gpio: gpio_b, bit: 22 }
  PB23: { gpio: gpio_b, bit: 23 }
  PB24: { gpio: gpio_b, bit: 24 }
  PB25: { gpio: gpio_b, bit: 25 }
  PB26: { gpio: gpio_b, bit: 26 }
  PB27: { gpio: gpio_b, bit: 27 }
  PB28: { gpio: gpio_b, bit: 28 }
  PB29: { gpio: gpio_b, bit: 29 }
  PB30: { gpio: gpio_b, bit: 30 }
  PB31: { gpio: gpio_b, bit: 31 }

peripherals:
  # ── Family clock/reset blocks ──────────────────────────────────────────────
  # These four declarative register banks are the SAME public files the
  # atsamd21g18a engine uses. They are family-wide SAM D21 blocks, not
  # G18A-only IP.
  - id: "pm"
    type: "declarative"
    base_address: 0x40000400
    size: "128B"
    irq: 0
    config:
      path: "../peripherals/atsamd21g18a/pm.yaml"
  - id: "sysctrl"
    type: "declarative"
    base_address: 0x40000800
    size: "128B"
    irq: 1
    config:
      path: "../peripherals/atsamd21g18a/sysctrl.yaml"
  - id: "gclk"
    type: "declarative"
    base_address: 0x40000C00
    size: "16B"
    config:
      path: "../peripherals/atsamd21g18a/gclk.yaml"
  - id: "wdt"
    type: "declarative"
    base_address: 0x40001000
    size: "16B"
    irq: 2
    config:
      path: "../peripherals/atsamd21g18a/wdt.yaml"
  - id: "nvmctrl"
    type: "declarative"
    base_address: 0x41004000
    size: "128B"
    irq: 5
    config:
      path: "../peripherals/atsamd21g18a/nvmctrl.yaml"

  # ── PORT GROUPs A and B ───────────────────────────────────────────────────
  # One LabWired GPIO port is one PORT GROUP; the groups are 0x80 apart.
  - id: "gpio_a"
    type: "gpio"
    base_address: 0x41004400
    size: "128B"
    config:
      profile: "sam"
      num_pins: 32
  - id: "gpio_b"
    type: "gpio"
    base_address: 0x41004480
    size: "128B"
    config:
      profile: "sam"
      num_pins: 32

  # ── SERCOM instances ──────────────────────────────────────────────────────
  # USART mode only, exactly as on atsamd21g18a.yaml. A SERCOM switched to
  # SPI/I2C mode goes inert rather than answering from the wrong register map.
# G and J variants expose six SERCOM instances (DS40001882H sec. 2).
  - id: "sercom0"
    type: "sam_sercom_usart"
    base_address: 0x42000800
    size: "64B"
    irq: 9
  - id: "sercom1"
    type: "sam_sercom_usart"
    base_address: 0x42000C00
    size: "64B"
    irq: 10
  - id: "sercom2"
    type: "sam_sercom_usart"
    base_address: 0x42001000
    size: "64B"
    irq: 11
  - id: "sercom3"
    type: "sam_sercom_usart"
    base_address: 0x42001400
    size: "64B"
    irq: 12
  - id: "sercom4"
    type: "sam_sercom_usart"
    base_address: 0x42001800
    size: "64B"
    irq: 13
  - id: "sercom5"
    type: "sam_sercom_usart"
    base_address: 0x42001C00
    size: "64B"
    irq: 14

  # ── Cortex-M0+ core peripherals ───────────────────────────────────────────
  - id: "nvic"
    type: "nvic"
    base_address: 0xE000E100
    size: "1KB"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: "16B"

# ── Declared NOT modelled ────────────────────────────────────────────────────
# Same honest boundary as atsamd21g18a.yaml: an access to one of these windows
# is unmapped and reported, not served a plausible zero:
#   EIC 0x40001800, RTC 0x40001400, DSU 0x41002000, DMAC 0x41004800,
#   USB 0x41005000, EVSYS 0x42000400, TCC0-2 0x42002000..0x42002800,
#   TC3-5 0x42002C00..0x42003400, ADC 0x42004000, AC 0x42004400,
#   DAC 0x42004800, I2S 0x42005000, PAC0/1/2, HMATRIX, MTB, and the
#   PORT_IOBUS alias at 0x60000000.
