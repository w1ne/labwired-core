#
# STM32H533RE (LQFP64), the MCU fitted to NUCLEO-H533RE.
# Sources: ST STM32H533RE datasheet, RM0481, CMSIS stm32h533xx.h, and the
# NUCLEO-H533RE MB1814-C-02 schematic. The H5 RCC/GPIO/USART models are shared
# with the existing STM32H563 profile. This first board slice exposes only the
# blocks used by its PA5 LED and USART2 VCP smoke; all other addresses remain
# unmapped.

name: "stm32h533re"
arch: "arm"
core: "cortex-m33"
cpu_hz: 250_000_000

flash:
  base: 0x08000000
  size: "512KiB"
ram:
  base: 0x20000000
  size: "272KiB"

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x44020C00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32h563/rcc.yaml"
      profile: "h5"
  - id: "gpioa"
    type: "gpio"
    base_address: 0x42020000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32h563/gpioa.yaml"
      profile: "stm32v2"
      reset_moder: 0xABFFFFFF
      reset_seccfgr: 0x0000FFFF
      reset_ospeedr: 0x0C000000
      reset_pupdr: 0x64000000
    clock: { reg: "ahb2enr", bit: 0 }
  - id: "usart2"
    type: "uart"
    base_address: 0x40004400
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32h563/usart2.yaml"
      profile: "stm32v2"
    clock: { reg: "apb1lenr", bit: 17 }

# This is an intentionally narrow authoritative pin map: the board smoke uses
# PA2/PA3 for USART2 and PA5 for LD2. Other H533 pads are not advertised here.
pins:
  PA2: { gpio: gpioa, bit: 2 }
  PA3: { gpio: gpioa, bit: 3 }
  PA5: { gpio: gpioa, bit: 5 }
