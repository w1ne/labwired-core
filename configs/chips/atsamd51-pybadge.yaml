#
# Adafruit PyBadge application image layout. The resident UF2 bootloader
# occupies the first 16 KiB; MakeCode Arcade application vectors begin at
# 0x4000 and firmware normally sets VTOR to that table during startup.
#
# SELF-CONTAINED COPY of atsamd51.yaml (builtin chips may not `include:` a
# sibling file — the built-in registry embeds each descriptor on its own).
# PyBadge adds its dedicated SERCOM4 display SPI bus and application vector
# offset; unrelated MCU blocks should remain in step with atsamd51.yaml.
#
# SIM-DERIVED SAMD51J19A descriptor for Adafruit Metro M4 bring-up.
# Not silicon-verified. Bench silicon may be ItsyBitsy M4 (SAMD51G19A);
# Playground pinout is Metro M4. QSPI, USB, NeoPixel, and unused SERCOMs
# are intentionally stubbed / omitted — only the MCU core, PORT, MCLK/GCLK,
# SERCOM1/3 UARTs, blocking SERCOM4 SPI and SysTick are modelled here.
# The SAMD51 board models (PAC, OSCCTRL, SAMD51 GCLK generators, EIC,
# TC0..5, TCC0..4, ADC0/1, DAC) are modelled to their documented register
# slices; see docs/engineering/samd51-board-models.md.
# Pin labels follow Adafruit ArduinoCore-samd variants/metro_m4/variant.cpp.

name: "atsamd51j19a-pybadge"
arch: "arm"
core: "cortex-m4"
cpu_hz: 120_000_000
flash:
  base: 0x00000000
  size: "512KB"
ram:
  base: 0x20000000
  size: "192KB"
# Resident UF2 bootloader owns the first 16 KiB (see header).
reset_vector_offset: 0x4000
pins:
  # SAM D51 PORT labels are group + bit.  Keeping the full two-group map here
  # lets board manifests name PyBadge's internal PB30/PB31 button-mux wires as
  # well as its exposed Feather pins; package bond-out remains a board fact.
  PA0: { gpio: porta, bit: 0 }
  PA1: { gpio: porta, bit: 1 }
  PA2: { gpio: porta, bit: 2 }
  PA3: { gpio: porta, bit: 3 }
  PA4: { gpio: porta, bit: 4 }
  PA5: { gpio: porta, bit: 5 }
  PA6: { gpio: porta, bit: 6 }
  PA7: { gpio: porta, bit: 7 }
  PA8: { gpio: porta, bit: 8 }
  PA9: { gpio: porta, bit: 9 }
  PA10: { gpio: porta, bit: 10 }
  PA11: { gpio: porta, bit: 11 }
  PA12: { gpio: porta, bit: 12 }
  PA13: { gpio: porta, bit: 13 }
  PA14: { gpio: porta, bit: 14 }
  PA15: { gpio: porta, bit: 15 }
  # PyBadge Feather TX/RX — SERCOM1 PAD[0]/PAD[1].
  PA17: { gpio: porta, bit: 17, functions: [{ type: uart, peripheral: sercom1, role: rx }] }
  PA18: { gpio: porta, bit: 18 }
  PA19: { gpio: porta, bit: 19 }
  PA20: { gpio: porta, bit: 20 }
  PA21: { gpio: porta, bit: 21 }
  # D0 / RX — variant.cpp: PORTA 23 (SERCOM3/PAD[1]).
  PA23: { gpio: porta, bit: 23, functions: [{ type: uart, peripheral: sercom3, role: rx }] }
  # D1 / TX — variant.cpp: PORTA 22 (SERCOM3/PAD[0]).
  PA22: { gpio: porta, bit: 22, functions: [{ type: uart, peripheral: sercom3, role: tx }] }
  # Metro D13 LED / PyBadge Feather TX.
  PA16: { gpio: porta, bit: 16, functions: [{ type: gpio, peripheral: porta }, { type: uart, peripheral: sercom1, role: tx }] }
  PA24: { gpio: porta, bit: 24 }
  PA25: { gpio: porta, bit: 25 }
  PA26: { gpio: porta, bit: 26 }
  PA27: { gpio: porta, bit: 27 }
  PA28: { gpio: porta, bit: 28 }
  PA29: { gpio: porta, bit: 29 }
  PA30: { gpio: porta, bit: 30 }
  PA31: { gpio: porta, bit: 31 }
  PB0: { gpio: portb, bit: 0 }
  PB1: { gpio: portb, bit: 1 }
  PB2: { gpio: portb, bit: 2 }
  PB3: { gpio: portb, bit: 3 }
  PB4: { gpio: portb, bit: 4 }
  PB5: { gpio: portb, bit: 5 }
  PB6: { gpio: portb, bit: 6 }
  PB7: { gpio: portb, bit: 7 }
  PB8: { gpio: portb, bit: 8 }
  PB9: { gpio: portb, bit: 9 }
  PB10: { gpio: portb, bit: 10 }
  PB11: { gpio: portb, bit: 11 }
  PB12: { gpio: portb, bit: 12 }
  PB13: { gpio: portb, bit: 13 }
  PB14: { gpio: portb, bit: 14 }
  PB15: { gpio: portb, bit: 15 }
  PB16: { gpio: portb, bit: 16 }
  PB17: { gpio: portb, bit: 17 }
  PB18: { gpio: portb, bit: 18 }
  PB19: { gpio: portb, bit: 19 }
  PB20: { gpio: portb, bit: 20 }
  PB21: { gpio: portb, bit: 21 }
  PB22: { gpio: portb, bit: 22 }
  PB23: { gpio: portb, bit: 23 }
  PB24: { gpio: portb, bit: 24 }
  PB25: { gpio: portb, bit: 25 }
  PB26: { gpio: portb, bit: 26 }
  PB27: { gpio: portb, bit: 27 }
  PB28: { gpio: portb, bit: 28 }
  PB29: { gpio: portb, bit: 29 }
  PB30: { gpio: portb, bit: 30 }
  PB31: { gpio: portb, bit: 31 }
peripherals:
  # Display bus only: ST7735 and DMAC integration/qualification remain owed.
  # CMSIS SERCOM4: APBDMASK bit 0, GCLK core channel 34.
  - id: "sercom4"
    type: "sam_sercom_spi"
    base_address: 0x43000000
    size: "256B"
    # DS60001507F 10.2.2: DRE/TXC/RXC/ERROR use SERCOM4_0..3 (62..65).
    irq: 62
    clock: { controller: "mclk", reg: "APBDMASK", bit: 0 }
    config:
      gclk_id: 34
      port_base: 0x41008080
      sck_bit: 13
      mosi_bit: 15
      pad_mux: 2
      dopo: 2
  - id: "mclk"
    type: "sam_mclk"
    base_address: 0x40000800
    size: "256B"
  - id: "gclk"
    type: "samd51_gclk"
    base_address: 0x40001C00
    size: "1KB"
  - id: "porta"
    type: "gpio"
    base_address: 0x41008000
    size: "128B"
    config:
      profile: "sam_port"
  - id: "portb"
    type: "gpio"
    base_address: 0x41008080
    size: "128B"
    config:
      profile: "sam_port"
  # PyBadge Feather UART on PA16/PA17 (SERCOM1 PAD0/PAD1).
  # MCLK.APBAMASK bit 13; GCLK PCHCTRL[8] = SERCOM1_CORE.
  - id: "sercom1"
    type: "uart"
    base_address: 0x40003400
    size: "256B"
    irq: 50
    clock:
      controller: "mclk"
      reg: "APBAMASK"
      bit: 13
    config:
      profile: "sercom"
      gclk_id: 8
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
  # Serial1 — SERCOM3 on PA22/PA23 (variant.cpp Uart Serial1(&sercom3, ...)).
  # MCLK.APBBMASK bit 10; GCLK PCHCTRL[24] = SERCOM3_CORE (DS60001507).
  - id: "sercom3"
    type: "uart"
    base_address: 0x41014000
    size: "256B"
    irq: 58
    clock:
      controller: "mclk"
      reg: "APBBMASK"
      bit: 10
    config:
      profile: "sercom"
      gclk_id: 24
  # SAMD51 board models (DS60001507F; register slices and limits in
  # docs/engineering/samd51-board-models.md). Fixed instance addresses and
  # IRQs are enforced by the model builder.
  - id: "pac"
    type: "samd51_pac"
    base_address: 0x40000000
    size: "1KB"
  - id: "oscctrl"
    type: "samd51_oscctrl"
    base_address: 0x40001000
    size: "1KB"
  # EIC reports its own sixteen channel lines (EIC_EXTINT_0..15 = 12..27).
  - id: "eic"
    type: "samd51_eic"
    base_address: 0x40002800
    size: "1KB"
  # TC0..TC5: IRQ = TCn (107..112); WO0/WO1 on PMUX function E pads.
  - id: "tc0"
    type: "samd51_tc"
    base_address: 0x40003800
    size: "1KB"
    irq: 107
  - id: "tc1"
    type: "samd51_tc"
    base_address: 0x40003C00
    size: "1KB"
    irq: 108
  - id: "tc2"
    type: "samd51_tc"
    base_address: 0x4101A000
    size: "1KB"
    irq: 109
  - id: "tc3"
    type: "samd51_tc"
    base_address: 0x4101C000
    size: "1KB"
    irq: 110
  - id: "tc4"
    type: "samd51_tc"
    base_address: 0x42001400
    size: "1KB"
    irq: 111
  - id: "tc5"
    type: "samd51_tc"
    base_address: 0x42001800
    size: "1KB"
    irq: 112
  # TCC0..TCC4: IRQ is line 0 (OVF/TRG/CNT/ERR); MCx lines follow it.
  - id: "tcc0"
    type: "samd51_tcc"
    base_address: 0x41016000
    size: "1KB"
    irq: 85
  - id: "tcc1"
    type: "samd51_tcc"
    base_address: 0x41018000
    size: "1KB"
    irq: 92
  - id: "tcc2"
    type: "samd51_tcc"
    base_address: 0x42000C00
    size: "1KB"
    irq: 97
  - id: "tcc3"
    type: "samd51_tcc"
    base_address: 0x42001000
    size: "1KB"
    irq: 101
  - id: "tcc4"
    type: "samd51_tcc"
    base_address: 0x43001000
    size: "1KB"
    irq: 104
  # ADC0/ADC1: software-triggered single-ended conversions; inputs set by
  # the host. Interrupts are not modelled.
  - id: "adc0"
    type: "samd51_adc"
    base_address: 0x43001C00
    size: "1KB"
  - id: "adc1"
    type: "samd51_adc"
    base_address: 0x43002000
    size: "1KB"
  - id: "dac"
    type: "samd51_dac"
    base_address: 0x43002400
    size: "1KB"
  - id: "usb"
    type: "stub"
    base_address: 0x41000000
    size: "1KB"
  - id: "qspi"
    type: "stub"
    base_address: 0x42003400
    size: "1KB"
