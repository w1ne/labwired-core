# WCH CH32V203C8T6 in LQFP48 (QingKe V4B, RV32IMAC).
#
# Geometry, package and maximum clock: WCH CH32V203DS0 V3.0, Table 2-1
# (C8x6: 64 KB zero-wait flash, 20 KB SRAM, 37 GPIOs, LQFP48, 144 MHz max)
# and Table 3-1-1 (LQFP48 pin definitions: PA0..PA15, PB0..PB15, PC13..PC15,
# PD0..PD1). Memory map: DS0 Figure 2-2 (Port A..D at 0x40010800..0x40011400,
# RCC at 0x40021000, USART1 at 0x40013800, USART2 at 0x40004400).
#
# Register layouts: WCH "CH32FV2x_V3xRM" reference manual (V20x/V30x/V31x),
# Table 3-1 (RCC: CTLR, CFGR0, INTR, APB2PRSTR, APB1PRSTR, AHBPCENR,
# APB2PCENR, APB1PCENR, BDCTLR, RSTSCKR, AHBRSTR at the STM32F1 offsets) and
# the GPIO table (CFGLR, CFGHR, INDR, OUTDR, BSHR, BCR, LCKR; reset 0x44444444).
# The V20x GPIO has the CFGHR word that the CH32V003 omits, so this part
# runs the `stm32f1` GPIO profile, not `wch`. HSI is 8 MHz (RM section 3.2.1),
# the same as the STM32F1, so the default F1 RCC model serves it.
#
# KNOWN LIMITATIONS, STATED PLAINLY:
#   - The F1 RCC model decodes PLLMUL with the STM32F1 table. The V20x maps
#     PLLMUL=0b1111 to x18, not x16; firmware that selects x18 sees a 128 MHz
#     model clock instead of 144 MHz. Reset (HSI 8 MHz) is exact.
#   - Core: QingKe V4B (`core: qingke-v4b`, the ch32-rs/ch32-data name),
#     RV32IMAC plus CORECFGR (CSR 0xBC0, stored) and the core-decoded PFIC
#     at 0xE000E000 with the 16-register hardware prologue. PFIC interrupt
#     nesting and the V4 priority grouping are not modelled: a pending
#     interrupt waits for `mret`.
#   - SysTick is the 64-bit QingKe V4 STK (SysTick_IRQn 12). EXTI GPIO
#     lines reach the PFIC; the event mask (EVENR) is stored only. USART1/2
#     RXNE interrupts are wired to PFIC IRQs 53/54; only USART1 is smoke-tested.
#     DMA1 (7 channels, per-channel PFIC lines 27..33) and SPI1/SPI2 run the
#     STM32F1 models; only SPI2 TX on DMA1 channel 5 is smoke-tested. The
#     SPI high-speed bit (HSCR) has no timing effect.
#     TIM1 (advanced, split BRK/UP/TRG_COM/CC lines 40..43) and TIM2..TIM4
#     (44..46) run the STM32F1 timer model for counting and interrupts only:
#     channel outputs and capture inputs reach no GPIO pad. Only the TIM2
#     update and TIM1 CH1 compare interrupts are smoke-tested.
#     ADC1/ADC2 run the STM32F1 ADC model (12-bit, shared PFIC line 34);
#     software-started single conversions, calibration and the ADC1 EOC
#     interrupt are smoke-tested. No PGA gain, TKey or dual-ADC modes.
#     I2C1/I2C2 run the STM32F1 I2C model as masters on the default pads
#     (PB6/PB7, PB10/PB11); polled I2C1 and interrupt-driven I2C2 reads are
#     smoke-tested. No AFIO I2C1 remap (PB8/PB9), no slave-mode test.
#     No CAN or USB.
#   - The debug printf block assumes a WCH-LinkE probe is attached and
#     polling (its sentinel reads 0). Firmware that waits for a probe
#     therefore never times out here.
#
# Buyability screen (2026-11-27): LCSC C3001172 lists CH32V203C8T6 "In Stock". WCH's
# product page has no lifecycle field; this descriptor is not a lifecycle
# claim and is not included in the Proteus parity gate.
# Sources:
#   https://www.wch-ic.com/download/file?id=354  (CH32V203DS0 V3.0)
#   https://www.wch-ic.com/download/file?id=324  (CH32FV2x_V3xRM)
#   https://www.lcsc.com/search?q=CH32V203C8T6   (C3001172)

name: "ch32v203c8t6"
arch: "riscv"
core: "qingke-v4b"
cpu_hz: 144_000_000

# Code flash at 0x08000000 is aliased at address 0 for reset fetch (BOOT0=0).
flash:
  base: 0x08000000
  size: "64KB"
ram:
  base: 0x20000000
  size: "20KB"
flash_boot_alias: true

package: "LQFP48"
pin_count: 48
gpio_pin_count: 37
pins:
  PA0: { gpio: "gpioa", bit: 0 }
  PA1: { gpio: "gpioa", bit: 1 }
  PA2: { gpio: "gpioa", bit: 2 }
  PA3: { gpio: "gpioa", bit: 3 }
  PA4: { gpio: "gpioa", bit: 4 }
  PA5: { gpio: "gpioa", bit: 5 }
  PA6: { gpio: "gpioa", bit: 6 }
  PA7: { gpio: "gpioa", bit: 7 }
  PA8: { gpio: "gpioa", bit: 8 }
  PA9: { gpio: "gpioa", bit: 9 }
  PA10: { gpio: "gpioa", bit: 10 }
  PA11: { gpio: "gpioa", bit: 11 }
  PA12: { gpio: "gpioa", bit: 12 }
  PA13: { gpio: "gpioa", bit: 13 }
  PA14: { gpio: "gpioa", bit: 14 }
  PA15: { gpio: "gpioa", bit: 15 }
  PB0: { gpio: "gpiob", bit: 0 }
  PB1: { gpio: "gpiob", bit: 1 }
  PB2: { gpio: "gpiob", bit: 2 }
  PB3: { gpio: "gpiob", bit: 3 }
  PB4: { gpio: "gpiob", bit: 4 }
  PB5: { gpio: "gpiob", bit: 5 }
  PB6: { gpio: "gpiob", bit: 6, functions: [{ type: i2c, peripheral: "i2c1", role: scl }] }
  PB7: { gpio: "gpiob", bit: 7, functions: [{ type: i2c, peripheral: "i2c1", role: sda }] }
  PB8: { gpio: "gpiob", bit: 8 }
  PB9: { gpio: "gpiob", bit: 9 }
  PB10: { gpio: "gpiob", bit: 10, functions: [{ type: i2c, peripheral: "i2c2", role: scl }] }
  PB11: { gpio: "gpiob", bit: 11, functions: [{ type: i2c, peripheral: "i2c2", role: sda }] }
  PB12: { gpio: "gpiob", bit: 12 }
  PB13: { gpio: "gpiob", bit: 13 }
  PB14: { gpio: "gpiob", bit: 14 }
  PB15: { gpio: "gpiob", bit: 15 }
  PC13: { gpio: "gpioc", bit: 13 }
  PC14: { gpio: "gpioc", bit: 14 }
  PC15: { gpio: "gpioc", bit: 15 }
  PD0: { gpio: "gpiod", bit: 0 }
  PD1: { gpio: "gpiod", bit: 1 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      profile: "stm32f1"

  # EXTEND at 0x40023800 (EXTEN_CTR): storage only. ch32fun's SystemInit
  # sets PLL_HSI_PRE before it selects the x18 PLL.
  - id: "exten"
    type: "declarative"
    base_address: 0x40023800
    size: "4B"
    config:
      path: "../peripherals/ch32v20x/exten.yaml"

  # QingKe V4 system timer STK (ch32v20xhw.h SysTick_Type: CTLR, SR, 64-bit
  # CNT, 64-bit CMP). A core block, no RCC gate. With CTLR.STIE set a compare
  # match pends SysTick_IRQn (12) in the core-decoded PFIC at 0xE000E000.
  - id: "stk"
    type: "qingke_stk"
    base_address: 0xE000F000
    size: "32B"
    irq: 12
    config:
      profile: "v4"

  # WCH-LinkE debug printf channel (ch32v20xhw.h DMDATA0/DMDATA1 and the
  # attach sentinel at 0xE0000380): ch32fun's default console.
  - id: "debug_printf"
    type: "wch_debug_printf"
    base_address: 0xE0000380
    size: "12B"

  # RCC_APB2PCENR IOPAEN..IOPDEN = bits 2..5 (RM Table 3-1 bit fields).
  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010800
    size: "1KB"
    clock: { reg: "apb2enr", bit: 2 }
    config:
      profile: "stm32f1"

  - id: "gpiob"
    type: "gpio"
    base_address: 0x40010C00
    size: "1KB"
    clock: { reg: "apb2enr", bit: 3 }
    config:
      profile: "stm32f1"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 4 }
    config:
      profile: "stm32f1"

  - id: "gpiod"
    type: "gpio"
    base_address: 0x40011400
    size: "1KB"
    clock: { reg: "apb2enr", bit: 5 }
    config:
      profile: "stm32f1"

  # AFIO (ch32v20xhw.h AFIO_TypeDef: ECR, PCFR1, EXTICR[4], PCFR2) is the
  # STM32F1 AFIO layout; EXTICR1..4 at 0x08..0x14 pick each EXTI line's
  # port. AFIOEN = APB2PCENR bit 0.
  - id: "afio"
    type: "afio"
    base_address: 0x40010000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 0 }

  # EXTI_TypeDef (INTENR, EVENR, RTENR, FTENR, SWIEVR, INTFR) is the F1
  # register file. Profile `wch_v20x` routes GPIO lines 0..4 to PFIC 22..26,
  # 5..9 to 39 and 10..15 to 56 as level requests (ch32v20xhw.h IRQn).
  # Lines 16..19 (PVD, RTC alarm, USB wakeup) stay register-level.
  - id: "exti"
    type: "exti"
    base_address: 0x40010400
    size: "1KB"
    config:
      profile: "wch_v20x"

  # USART_TypeDef (STATR, DATAR, BRR, CTLR1..3, GPR) is the STM32F1 USART
  # layout, so the default UART model serves it. USART1EN = APB2PCENR bit 14;
  # USART2EN = APB1PCENR bit 17.
  - id: "usart1"
    type: "uart"
    base_address: 0x40013800
    size: "1KB"
    irq: 53 # USART1_IRQn (WCH ch32v20xhw.h; F1 vector 37 + 16 QingKe core slots)
    clock: { reg: "apb2enr", bit: 14 }

  - id: "usart2"
    type: "uart"
    base_address: 0x40004400
    size: "1KB"
    irq: 54 # USART2_IRQn (WCH ch32v20xhw.h; F1 vector 38 + 16 QingKe core slots)
    clock: { reg: "apb1enr", bit: 17 }

  # SPI_TypeDef (CTLR1, CTLR2, STATR, DATAR, CRCR, RCRCR, TCRCR, I2SCFGR,
  # I2SPR, HSCR) is the STM32F1 SPI file plus the WCH high-speed control
  # word HSCR at 0x24, which the model accepts and ignores. SPI1EN =
  # APB2PCENR bit 12; SPI2EN = APB1PCENR bit 14.
  - id: "spi1"
    type: "spi"
    base_address: 0x40013000
    size: "1KB"
    irq: 51 # SPI1_IRQn (WCH ch32v20xhw.h; F1 vector 35 + 16)
    clock: { reg: "apb2enr", bit: 12 }

  - id: "spi2"
    type: "spi"
    base_address: 0x40003800
    size: "1KB"
    irq: 52 # SPI2_IRQn (WCH ch32v20xhw.h; F1 vector 36 + 16)
    clock: { reg: "apb1enr", bit: 14 }

  # DMA1 (ch32v20xhw.h DMA_TypeDef INTFR/INTFCR + DMA_Channel_TypeDef CFGR,
  # CNTR, PADDR, MADDR) is the STM32F1 7-channel controller. DMA1EN =
  # AHBPCENR bit 0. Each channel has its own PFIC line, DMA1_Channel1..7_IRQn
  # = 27..33 (F1 vectors 11..17 + 16). Hard-wired requests follow the RM
  # DMA1 request table, which matches the F1: SPI1_RX ch2, SPI1_TX ch3,
  # SPI2_RX ch4, SPI2_TX ch5.
  - id: "dma1"
    type: "dma"
    base_address: 0x40020000
    size: "1KB"
    clock: { reg: "ahbenr", bit: 0 }
    config:
      channel_irqs: [27, 28, 29, 30, 31, 32, 33]
      requests:
        spi1_rx: 2
        spi1_tx: 3
        spi2_rx: 4
        spi2_tx: 5

  # TIM_TypeDef (CTLR1, CTLR2, SMCFGR, DMAINTENR, INTFR, SWEVGR, CHCTLR1/2,
  # CCER, CNT, PSC, ATRLR, RPTCR, CH1CVR..CH4CVR, BDTR, DMACFGR, DMAADR) is the
  # STM32F1 timer file at the F1 bases. TIM1 is the advanced-control timer
  # (TIM1EN = APB2PCENR bit 11); TIM2..TIM4 are general-purpose (APB1PCENR
  # bits 0..2). PFIC lines from ch32v20xhw.h IRQn: TIM1_BRK 40, TIM1_UP 41,
  # TIM1_TRG_COM 42, TIM1_CC 43, TIM2 44, TIM3 45, TIM4 46 (F1 vectors
  # 24..30 + 16). No pad_map: channel outputs and capture inputs are not
  # routed to GPIO pads on this part.
  - id: "tim1"
    type: "timer"
    base_address: 0x40012C00
    size: "1KB"
    irq: 41
    clock: { reg: "apb2enr", bit: 11 }
    config:
      advanced: true
      capture_compare_irq: 43
      trigger_com_irq: 42
      break_irq: 40

  - id: "tim2"
    type: "timer"
    base_address: 0x40000000
    size: "1KB"
    irq: 44
    clock: { reg: "apb1enr", bit: 0 }

  - id: "tim3"
    type: "timer"
    base_address: 0x40000400
    size: "1KB"
    irq: 45
    clock: { reg: "apb1enr", bit: 1 }

  - id: "tim4"
    type: "timer"
    base_address: 0x40000800
    size: "1KB"
    irq: 46
    clock: { reg: "apb1enr", bit: 2 }

  # ADC1/ADC2 (ch32v20xhw.h): ADC1_BASE = APB2PERIPH_BASE + 0x2400, ADC2_BASE
  # = + 0x2800, RCC_ADC1EN/ADC2EN = APB2PCENR bits 9/10. ADC_TypeDef is the
  # STM32F1 register file (STATR..RDATAR at the F1 offsets, CTLR2.SWSTART bit
  # 22, RSTCAL/CAL) with a 12-bit SAR, IN16 temperature sensor and IN17
  # VREFINT, so the `stm32f1` profile applies unchanged. Both ADCs share
  # ADC_IRQn 34. Not modelled: the V20x CTLR1 PGA/BUFEN bits (stored, no gain
  # applied), the TKey touch-key mode and dual-ADC modes.
  - id: "adc1"
    type: "adc"
    base_address: 0x40012400
    size: "1KB"
    irq: 34
    clock: { reg: "apb2enr", bit: 9 }
    config:
      profile: "stm32f1"

  - id: "adc2"
    type: "adc"
    base_address: 0x40012800
    size: "1KB"
    irq: 34
    clock: { reg: "apb2enr", bit: 10 }
    config:
      profile: "stm32f1"

  # I2C1/I2C2 (ch32v20xhw.h): I2C1_BASE = APB1PERIPH_BASE + 0x5400, I2C2_BASE
  # = + 0x5800, RCC_APB1Periph_I2C1/I2C2 = APB1PCENR bits 21/22. I2C_TypeDef
  # (CTLR1, CTLR2, OADDR1, OADDR2, DATAR, STAR1, STAR2, CKCFGR, RTR) is the
  # STM32F1 register file, so the `i2c` model's default `stm32f1` layout
  # serves it. PFIC lines: I2C1_EV 47, I2C1_ER 48, I2C2_EV 49, I2C2_ER 50
  # (F1 vectors 31..34 + 16). Default pads (DS0 Table 3-1-1): I2C1 SCL PB6,
  # SDA PB7; I2C2 SCL PB10, SDA PB11. The AFIO PCFR1 I2C1 remap to PB8/PB9
  # is not modelled.
  - id: "i2c1"
    type: "i2c"
    base_address: 0x40005400
    size: "1KB"
    irq: 47
    clock: { reg: "apb1enr", bit: 21 }
    config:
      irq_error: 48

  - id: "i2c2"
    type: "i2c"
    base_address: 0x40005800
    size: "1KB"
    irq: 49
    clock: { reg: "apb1enr", bit: 22 }
    config:
      irq_error: 50
