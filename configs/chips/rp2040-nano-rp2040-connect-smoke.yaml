# Arduino Nano RP2040 Connect (ABX00052), narrowed to exposed GP0 / header TX.
# Its NINA-W102, IMU, microphone and RGB LED are deliberately not claimed.
name: "rp2040-nano-rp2040-connect-smoke"
arch: "arm"
core: "cortex-m0+"
registers_count: 240
cpu_hz: 133_000_000
flash:
  base: 0x10000000
  size: "16MB"
ram:
  base: 0x20000000
  size: "264KB"
pins:
  # Arduino's pinout maps header TX to RP2040 GPIO0 / UART0 TX.
  GP0: { gpio: "sio", bit: 0 }
reset_vector_offset: 0x100
peripherals:
  - id: "io_bank0"
    type: "rp2040_io_bank0"
    base_address: 0x40014000
    size: "4KB"
    irq: 13
    config:
      debug_schema: "../peripherals/rp2040/io_bank0.yaml"
  - id: "sio"
    type: "rp2040_sio"
    base_address: 0xD0000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2040/sio.yaml"
