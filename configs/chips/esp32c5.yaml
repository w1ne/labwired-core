# ESP32-C5 HP-core profile for the ESP32-C5-DevKitC-1 v1.2 UART, GPIO/I2C and
# onboard RGB LED smoke. Only GPIO6, GPIO10 and GPIO27 are exposed.
name: "esp32c5"
arch: "riscv"
core: "rv32imac"
registers_count: 31
cpu_hz: 240_000_000

flash:
  # ESP-IDF C5 memory map uses the same unified IROM/DROM window base.
  base: 0x42000000
  size: "8192KB"
ram:
  # 384 KiB HP SRAM at SOC_IRAM_LOW / SOC_DRAM_LOW.
  base: 0x40800000
  size: "384KB"
memory_regions:
  - name: "rom"
    base: 0x40000000
    size: "320KB"
    image_env: "LABWIRED_ESP32C5_ROM"
  - name: "lp_sram"
    base: 0x50000000
    size: "16KB"

pins:
  GPIO6: { gpio: "gpio", bit: 6 }
  GPIO10: { gpio: "gpio", bit: 10 }
  # The onboard RGB LED data pad.
  GPIO27: { gpio: "gpio", bit: 27 }

peripherals:
  # UART0: C5 uses the modern Espressif UART register map. The board's USB-UART
  # bridge is connected to GPIO11/U0TXD and GPIO12/U0RXD; pad-level propagation
  # is not modeled in this focused profile. Firmware selects PLL_F80M and
  # enables its function clock; dynamic clock-tree behavior is not modeled.
  - id: "pcr"
    type: "esp32c5_pcr"
    base_address: 0x60096000
    size: "40"
  - id: "uart0"
    type: "esp32c5_uart"
    irq: 47
    base_address: 0x60000000
    size: "4KB"
    clock: { controller: "pcr", reg: "UART0_SCLK_CONF", bit: 22 }
    config:
      echo_stdout: true
  # The narrow C5 GPIO model covers GPIO6/10 I2C matrix routing and GPIO27's
  # direct output path to the onboard addressable RGB LED.
  - id: "gpio"
    type: "esp32c5_gpio"
    base_address: 0x60091000
    size: "2888"
    config:
      debug_schema: "../peripherals/esp32c5/gpio_i2c_rgb.yaml"
  # IO_MUX functions for the two sensor pads and the RGB LED data pad.
  - id: "io_mux"
    type: "esp32c5_io_mux"
    base_address: 0x60090000
    size: "112"
    config:
      debug_schema: "../peripherals/esp32c5/io_mux_i2c_rgb.yaml"
  # C5 I2C0 uses the same command/register layout as the C3/C6 model. The C5
  # TRM/ESP-IDF map places it at 0x60004000 and uses source 11.
  - id: "i2c0"
    type: "esp32c3_i2c"
    irq: 11
    base_address: 0x60004000
    size: "4KB"
    clock: { controller: "pcr", reg: "I2C0_CONF", bit: 0 }
    config:
      debug_schema: "../peripherals/esp32c6/i2c0.yaml"
