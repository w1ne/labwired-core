# ESP32-C5 HP-core profile for the ESP32-C5-DevKitC-1 v1.2 UART/RGB LED smoke.
# The board slice exposes on-chip memories, UART0 and GPIO27 direct output.
name: "esp32c5"
arch: "riscv"
core: "rv32imac"
registers_count: 31
cpu_hz: 240_000_000

flash:
  # ESP-IDF C5 memory map uses the same unified IROM/DROM window base.
  base: 0x42000000
  size: "8192KB"
ram:
  # 384 KiB HP SRAM at SOC_IRAM_LOW / SOC_DRAM_LOW.
  base: 0x40800000
  size: "384KB"
memory_regions:
  - name: "rom"
    base: 0x40000000
    size: "320KB"
    image_env: "LABWIRED_ESP32C5_ROM"
  - name: "lp_sram"
    base: 0x50000000
    size: "16KB"

pins:
  # This board profile exposes GPIO27, routed to the onboard RGB LED.
  GPIO27: { gpio: "gpio", bit: 27 }

peripherals:
  # UART0: C5 uses the modern Espressif UART register map. The board's USB-UART
  # bridge is connected to GPIO11/U0TXD and GPIO12/U0RXD; pad-level propagation
  # is not modeled in this focused profile. Firmware selects PLL_F80M and
  # enables its function clock; dynamic clock-tree behavior is not modeled.
  - id: "pcr"
    type: "esp32c5_pcr"
    base_address: 0x60096000
    size: "8"
  - id: "uart0"
    type: "esp32c5_uart"
    irq: 47
    base_address: 0x60000000
    size: "4KB"
    clock: { controller: "pcr", reg: "UART0_SCLK_CONF", bit: 22 }
    config:
      echo_stdout: true
  # DevKitC's addressable RGB LED uses GPIO27. The model covers the direct
  # GPIO output registers and this pad's GPIO_FUNC output selector only.
  - id: "gpio"
    type: "esp32c5_gpio"
    base_address: 0x60091000
    size: "2868"
    config:
      debug_schema: "../peripherals/esp32c5/gpio_gpio27.yaml"
  # Only GPIO27's function-select word is modelled in this board profile.
  - id: "io_mux"
    type: "esp32c5_io_mux"
    base_address: 0x60090000
    size: "112"
    config:
      debug_schema: "../peripherals/esp32c5/io_mux_gpio27.yaml"
