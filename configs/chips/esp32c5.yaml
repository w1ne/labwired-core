# ESP32-C5 HP-core slice used by ESP32-C5-DevKitC-1-N8R8 UART + GPIO + I2C0 smoke.
# Sources: ESP32-C5 Datasheet v1.5, ESP32-C5 TRM v1.0, and Espressif
# esp-idf components/soc/esp32c5 register headers. Only the RV32IMAC HP core,
# internal HP SRAM, UART0 transmit, direct GPIO0..25 behavior, and the I2C0
# command-list engine with GPIO8/9 matrix routing are exercised. UART clock
# gates and IO_MUX pad electrical behavior are not enforced.
# This is not a full ESP32-C5 or wireless model.

name: "esp32c5"
arch: "riscv"
core: "rv32imac"
registers_count: 31
cpu_hz: 240_000_000

# ESP32-C5 memory map: HP SRAM 0x40800000..0x4085FFFF; the N8R8 module has
# 8 MiB flash and 8 MiB PSRAM mapped in the external-memory window. The smoke
# image is loaded directly into HP SRAM and does not exercise XIP or PSRAM.
flash:
  base: 0x42000000
  size: "8192KB"
ram:
  base: 0x40800000
  size: "384KB"

peripherals:
  # ESP32-C5 TRM v1.0 §6.3.5 maps UART0 to 0x60000000..0x60000FFF.
  # Its register head matches the shared C6 UART model; UART0 is the
  # DevKitC-1's USB-to-UART bridge console. PCR clock gating and IOMUX
  # electrical routing are outside this focused profile.
  - id: "uart0"
    type: "esp32c5_uart"
    irq: 47 # ETS_UART0_INTR_SOURCE from ESP-IDF soc/esp32c5/interrupts.h
    base_address: 0x60000000
    size: "4KB"
    config:
      echo_stdout: true
      debug_schema: "../peripherals/esp32c6/uart0.yaml"

  # C5 GPIO register head: GPIO_OUT @+0x04, W1TS/W1TC @+0x08/+0x0C,
  # GPIO_ENABLE @+0x34, W1TS @+0x38. The C5-aware adapter supports direct GPIO
  # output on pins 0..25 and the I2C0 matrix selectors needed by GPIO8/9;
  # other matrix signals and GPIO26..28 are not claimed. Base 0x60091000 from
  # Espressif's C5 GPIO register map.
  - id: "gpio"
    type: "esp32c5_gpio"
    base_address: 0x60091000
    size: "4KB"

  # ESP32-C5 HP I2C0 controller at 0x60004000. The C5 command-list register
  # offsets match the shared C3-family engine; its 240 MHz core rate and
  # interrupt-matrix source 55 are configured by the C5 bus adapter.
  - id: "i2c0"
    type: "esp32c5_i2c"
    irq: 55
    base_address: 0x60004000
    size: "4KB"

  # C5 IOMUX pad words are declared register storage only. This lets the
  # firmware select GPIO5/8/9 function 1; pad routing is not electrically
  # enforced by this descriptor, so the smoke oracle observes the GPIO model.
  - id: "io_mux"
    type: "declarative"
    base_address: 0x60090000
    size: "4KB"
    config:
      path: "../peripherals/esp32c6/io_mux.yaml"
