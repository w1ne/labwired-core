#
# SIM-DERIVED R7FA4M1AB descriptor for the Arduino UNO R4 Minima / WiFi.
# Not silicon-verified. Pin labels follow ArduinoCore-renesas
# variants/MINIMA and variants/UNOWIFIR4.
#
# Sources: FSP R7FA4M1AB.h (peripheral bases), FSP ra4m1 bsp_elc.h (ELC
# event numbers) and bsp_feature.h (channel masks), all as shipped in
# ArduinoCore-renesas 1.6.0 (PlatformIO framework-arduinorenesas-uno).
#
# Boot: ArduinoCore-renesas links the sketch at 0x4000, behind the board's
# 16 KiB DFU bootloader (variants/*/memory_regions.ld FLASH_IMAGE_START),
# and the bootloader hands over to the table there. The ELF's first LOAD
# segment starts at 0 and carries the ELF header, so the words at 0 are not
# a vector table; `reset_vector_offset` takes reset from 0x4000 instead.
# A bare image with a valid table at 0 (the PR-gated smoke) still boots
# from 0.
#
# Clocks: the UNO R4 runs ICLK/PCLKA/PCLKD = HOCO 48 MHz and PCLKB = 24 MHz
# (variants/UNOWIFIR4 bsp_clock_cfg.h). `ra4_sysc` stores SCKDIVCR/SCKSCR
# but derives no rate from them, so the timer models take those rates from
# their `clock_hz` / `pclkb_hz` here.
#
# Interrupts: no peripheral has a fixed NVIC line. Each is an ELC event
# linked to NVIC line n by ICU IELSRn (`ra_icu`, 32 lines on the RA4M1);
# ArduinoCore-renesas IRQManager hands out IELSR slots at run time.
#
# NOT modelled: USB FS (declared stub; the Minima's `Serial` is USB CDC, so
# stock Minima sketches print nowhere; the WiFi board's `Serial` is SCI9),
# the external IRQ pins (no `irq_pins`), DTC/DMAC/ELC (stubs), CTSU,
# RTC, the watchdogs, flash programming, DAC12.

name: "r7fa4m1ab"
arch: "arm"
core: "cortex-m4"
cpu_hz: 48_000_000
flash:
  base: 0x00000000
  size: "256KB"
ram:
  base: 0x20000000
  size: "32KB"
reset_vector_offset: 0x4000
pins:
  # D0 / RX — MINIMA: P301 (SCI2 RXD).
  P301: { gpio: port3, bit: 1, functions: [{ type: uart, peripheral: sci2, role: rx }] }
  # D1 / TX — MINIMA: P302 (SCI2 TXD).
  P302: { gpio: port3, bit: 2, functions: [{ type: uart, peripheral: sci2, role: tx }] }
  # UNO R4 WiFi `Serial` (_UART1_, D22/D23): P109 TXD9 / P110 RXD9, the
  # UART to the ESP32-S3 USB bridge (variants/UNOWIFIR4 variant.cpp).
  P109: { gpio: port1, bit: 9, functions: [{ type: uart, peripheral: sci9, role: tx }] }
  P110: { gpio: port1, bit: 10, functions: [{ type: uart, peripheral: sci9, role: rx }] }
  # D13 / LED — MINIMA: P111.
  P111: { gpio: port1, bit: 11, functions: [{ type: gpio, peripheral: port1 }] }
peripherals:
  # R_SYSTEM @ 0x4001E000: the full R_SYSTEM register file (0x700 bytes,
  # VBTBKR[512] at +0x500 last; R7FA4M1AB.h) with OSCSF derived from the
  # stop bits. FSP's bsp_clock_init unlocks PRCR at +0x3FE, past the old
  # 256-byte HOCOCR/OSCSF-only `ra_sysc` window. The id keeps that name.
  - id: "ra_sysc"
    type: "ra4_sysc"
    base_address: 0x4001E000
    size: "1792B"
  # R_MSTP: MSTPCRB-D at 0x40047000-0x40047008 (R7FA4M1AB.h puts R_MSTP_BASE
  # 4 bytes lower so MSTPCRB lands there). Declared stub: no module is held
  # in stop.
  - id: "mstp"
    type: "stub"
    base_address: 0x40047000
    size: "16B"
  # ICU @ 0x40006000 (R7FA4M1AB.h R_ICU_Type): IRQCRn +0x000, NMI +0x100,
  # WUPEN +0x1A0, IELSR0-31 at +0x300 link ELC events to NVIC lines 0-31
  # (ra_icu). No `irq_pins`: the external IRQ pads are not wired.
  - id: "icu"
    type: "ra_icu"
    base_address: 0x40006000
    size: "2KB"
    config:
      ielsr_lines: 32
  # PORT n @ 0x40040000 + n*0x20 (R01UH0887 §19 / FSP IOPORT). The input
  # pull-up is PmnPFS.PCR in the PFS block, so each port names it. The
  # 16-bit aliases put the upper half first (FSP R7FA4M1AB.h: PODR +0x0,
  # PDR +0x2, EIDR +0x4, PIDR +0x6, PORR +0x8, POSR +0xA).
  - id: "port0"
    type: "gpio"
    base_address: 0x40040000
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 0, swapped_half_aliases: true }
  - id: "port1"
    type: "gpio"
    base_address: 0x40040020
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 1, swapped_half_aliases: true }
  - id: "port2"
    type: "gpio"
    base_address: 0x40040040
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 2, swapped_half_aliases: true }
  - id: "port3"
    type: "gpio"
    base_address: 0x40040060
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 3, swapped_half_aliases: true }
  - id: "port4"
    type: "gpio"
    base_address: 0x40040080
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 4, swapped_half_aliases: true }
  - id: "port5"
    type: "gpio"
    base_address: 0x400400A0
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 5, swapped_half_aliases: true }
  - id: "port6"
    type: "gpio"
    base_address: 0x400400C0
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 6, swapped_half_aliases: true }
  - id: "port7"
    type: "gpio"
    base_address: 0x400400E0
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 7, swapped_half_aliases: true }
  - id: "port8"
    type: "gpio"
    base_address: 0x40040100
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 8, swapped_half_aliases: true }
  - id: "port9"
    type: "gpio"
    base_address: 0x40040120
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 9, swapped_half_aliases: true }
  # PFS @ 0x40040800: PmnPFS at 0x40*m + 4*n, PWPR at +0x503 (R01UH0887
  # §19.2.5, §19.5). Pull-up (PCR) and write protection are modelled, and a
  # PmnPFS store sets PDR/PODR in the port's PCNTR1 (the same flip-flops).
  # Reading PmnPFS back returns the last store, not PCNTR1; PIDR reads 0;
  # the peripheral mux is stored only.
  - id: "pfs"
    type: "ra_pfs"
    base_address: 0x40040800
    size: "1536B"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
  # SCI0/1/2/9 @ 0x40070000 + 0x20*n (BSP_FEATURE_SCI_CHANNELS 0x207).
  # Interrupts are ELC events linked through ICU IELSRn: RXI, TXI +1, TEI +2,
  # ERI +3 (FSP ra4m1 bsp_elc.h: SCI0 152, SCI1 158, SCI2 163, SCI9 168).
  # SCI2 is the header D0/D1 (`Serial1`); SCI9 is the UNO R4 WiFi `Serial`.
  # `clock_hz` (the 48 MHz ICLK) and `baud` time the TDRE/TEND edges.
  - id: "sci0"
    type: "uart"
    base_address: 0x40070000
    size: "32B"
    config:
      profile: "sci"
      elc_event: 152
      clock_hz: 48000000
      baud: 115200
  - id: "sci1"
    type: "uart"
    base_address: 0x40070020
    size: "32B"
    config:
      profile: "sci"
      elc_event: 158
      clock_hz: 48000000
      baud: 115200
  - id: "sci2"
    type: "uart"
    base_address: 0x40070040
    size: "32B"
    config:
      profile: "sci"
      elc_event: 163
      clock_hz: 48000000
      baud: 115200
  - id: "sci9"
    type: "uart"
    base_address: 0x40070120
    size: "32B"
    config:
      profile: "sci"
      elc_event: 168
      clock_hz: 48000000
      baud: 115200
  # AGT0/1 @ 0x40084000 + n*0x100 (BSP_FEATURE_AGT_VALID_CHANNEL_MASK 0x03).
  # Events INT / COMPARE_A +1 / COMPARE_B +2: AGT0 30, AGT1 33 (bsp_elc.h).
  # ArduinoCore-renesas drives millis()/delay() from an AGT.
  - id: "agt0"
    type: "ra_agt"
    base_address: 0x40084000
    size: "256B"
    config:
      elc_event: 30
      clock_hz: 48000000
      pclkb_hz: 24000000
  - id: "agt1"
    type: "ra_agt"
    base_address: 0x40084100
    size: "256B"
    config:
      elc_event: 33
      clock_hz: 48000000
      pclkb_hz: 24000000
  # IIC0/1 (RIIC master, `ra_iic`; R_IIC0_BASE 0x40053000 + n*0x100; the
  # RA4M1 has two). Events RXI, TXI +1, TEI +2, ERI +3: IIC0 53, IIC1 58
  # (bsp_elc.h). UNO R4 `Wire` is IIC1 on A4/A5 = P101 SDA1 / P100 SCL1;
  # `Wire1` (Qwiic, P401/P400) is IIC0 (variants/UNOWIFIR4 pinmux.inc).
  - id: "iic0"
    type: "ra_iic"
    base_address: 0x40053000
    size: "256B"
    config:
      elc_event: 53
      clock_hz: 48000000
      pclkb_hz: 24000000
  - id: "iic1"
    type: "ra_iic"
    base_address: 0x40053100
    size: "256B"
    config:
      elc_event: 58
      clock_hz: 48000000
      pclkb_hz: 24000000
  # GPT320-321 (32-bit) and GPT162-167 (16-bit): R_GPT0_BASE 0x40078000,
  # 0x100 per channel (BSP_FEATURE_GPT_32BIT_CHANNEL_MASK 0x03,
  # VALID_CHANNEL_MASK 0xFF). Counts PCLKD = 48 MHz. Events: GPT0
  # capture/compare A 87, eight per channel (GPT1 95; bsp_elc.h), so
  # `events_per_channel: 8`. analogWrite() on D13 (P102) drives GTIOC2B
  # (pinmux.inc PIN_PWM|CHANNEL_2|PWM_CHANNEL_B).
  - id: "gpt"
    type: "ra_gpt"
    base_address: 0x40078000
    size: "4KB"
    config:
      channels: 8
      clock_hz: 48000000
      pclkd_hz: 48000000
      elc_event: 87
      events_per_channel: 8
      wide_channels: 0x03
      gtioc_pads:
        GTIOC2A: "P103"
        GTIOC2B: "P102"
  # Declared stubs (bases from R7FA4M1AB.h; reads 0, writes dropped).
  - id: "dmac_dtc"
    type: "stub"
    base_address: 0x40005000
    size: "1KB"
  - id: "elc"
    type: "stub"
    base_address: 0x40041000
    size: "256B"
  # RSPI (R_SPI0/R_SPI1, 0x40072000/0x40072100). ArduinoCore-renesas `SPI`
  # is SPI0 on D11/D12/D13 (P411/P410/P102), driven by direct register
  # writes and a polled SPDR_BY / SPSR.SPRF loop, so no IRQ is wired. No
  # pad waveform: the frame goes straight to the attached device.
  - id: "spi0"
    type: "spi"
    base_address: 0x40072000
    size: "256B"
    config:
      profile: "ra_rspi"
  - id: "spi1"
    type: "spi"
    base_address: 0x40072100
    size: "256B"
    config:
      profile: "ra_rspi"
  # CAN0 (R_CAN0_BASE 0x40050000; the RA4M1 has one channel). `ra_can`:
  # normal mailbox mode, polled, with no bus attached, so a frame completes
  # only in loopback (TCR.TSTM = 10/11); interrupts and FIFO mode are
  # refused. The CTX0/CRX0 pads (D10 = P103 / D13 = P102, variant
  # pins_arduino.h PIN_CAN0_TX/RX) are not bound.
  - id: "can0"
    type: "ra_can"
    base_address: 0x40050000
    size: "4KB"
  # USBFS stub — USB CDC (the Minima's `Serial`) is not modelled.
  - id: "usbfs"
    type: "stub"
    base_address: 0x40090000
    size: "1KB"
  # R_FCACHE (0x4001C000): FSP SystemInit disables/invalidates the flash
  # cache (FCACHEE +0x100, FCACHEIV +0x104, polled until it reads 0) and
  # sets the wait states before the clock switch. Declared stub: reads 0,
  # which completes the invalidate; no flash timing is modelled.
  - id: "fcache"
    type: "stub"
    base_address: 0x4001C000
    size: "512B"
  # R_MPU_SPMON (0x40000D00): FSP SystemInit arms the main/process stack
  # pointer monitor (MSPMPUOAD/CTL/SA/EA, PSPMPU*) over the stack section,
  # then enables its NMI in ICU NMIER. Declared stub: the bounds are
  # dropped and an out-of-range SP raises no NMI.
  - id: "mpu_spmon"
    type: "stub"
    base_address: 0x40000D00
    size: "256B"
  # ADC0, the RA4M1's 14-bit ADC14 (FSP R_ADC0_Type, the same register map
  # as ADC12; R_ADC0_BASE 0x4005C000, BSP_FEATURE_ADC_VALID_UNIT_MASK 1).
  # Scan end is ELC_EVENT_ADC0_SCAN_END 41 (bsp_elc.h). AVCC0 = 5 V on the
  # UNO R4 (analogReference DEFAULT), so `vref_mv` is 5000. `adc14`:
  # ADCER.ADPRC = 3 is 14-bit; ArduinoCore-renesas always converts at 14
  # bits and shifts down to analogReadResolution.
  - id: "adc0"
    type: "ra_adc12"
    base_address: 0x4005C000
    size: "512B"
    config:
      adc14: true
      elc_event: 41
      clock_hz: 48000000
      vref_mv: 5000
  # 0x4005C200, where FSP puts R_ADC1: the RA4M1 has no second unit, but
  # ArduinoCore-renesas main() calls analogReference(), and that runs
  # R_ADC_Open on an `adc1` container too, on every UNO R4 boot
  # (cores/arduino/analog.cpp). Stock sketches boot on silicon, so the
  # stores land in reserved space without a bus error. Declared stub.
  - id: "adc1_reserved"
    type: "stub"
    base_address: 0x4005C200
    size: "512B"
