name: "ci-fixture-cortex-m3-uart1"
arch: "cortex-m3"
core: "cortex-m3"
registers_count: 50
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# CI fixture. 80 MHz is the rate the emitter used to hand every non-C3 board
# before the clock moved here, kept so fixture timing is unchanged.
cpu_hz: 80_000_000

# Synthetic mixed-signal endpoint for the CI fixture only. These explicit
# thresholds exercise voltage-to-GPIO routing; they are not silicon data.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7

flash:
  base: 0x00000000
  size: "128KB"
ram:
  base: 0x20000000
  size: "128KB"
peripherals:
  - id: "uart1"
    type: "uart"
    base_address: 0x4000C000
    size: "1KB"
  # Generic GPIO input endpoint used by the analog co-simulation fixture.
  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010000
    size: "1KB"
    config:
      profile: "stm32v2"
