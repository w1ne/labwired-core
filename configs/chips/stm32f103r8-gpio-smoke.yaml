# Narrow STM32F103R8T6 LQFP64 profile for an externally wired PC13 LED.
#
# This exact-part smoke declares the R8's medium-density memory geometry and
# only the RCC/GPIOC blocks used by the firmware. The broader stm32f103r8
# descriptor reuses the family's full medium-density engine, including its
# explicit USB-device and backup-register stubs; this smoke does not exercise
# or claim those blocks.
#
# ST DS5319 Rev 20: https://www.st.com/resource/en/datasheet/stm32f103r8.pdf
name: "stm32f103r8t6-gpio-smoke"
arch: "arm"
core: "cortex-m3"
registers_count: 125
# Smoke stays on reset HSI, 8 MHz.
cpu_hz: 8_000_000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.35
  vih: 0.65

package: "LQFP64"
pin_count: 64
gpio_pin_count: 51
variant: "x8"
orderable_suffixes: ["T6", "T6TR", "T7", "T7TR"]

flash:
  base: 0x08000000
  size: "64KB"
ram:
  base: 0x20000000
  size: "20KB"

pins:
  PC13: { gpio: "gpioc", bit: 13 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f103/rcc.yaml"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 4 }
    config:
      debug_schema: "../peripherals/stm32f103/gpioc.yaml"
      profile: "stm32f1"
