#
# PIC24F04KA201 (DS30009937C, PIC24F04KA201 family).
# - 20-pin PDIP/SSOP/SOIC/QFN, Ports A and B only, 18 I/O pins
#   (Table 1-1: PORTA<6:0>, PORTB<15:12, 9:7, 4, 2:0>), no PORTC.
# - Program flash 4 KB (1408 instructions), data SRAM 512 B, no data EEPROM
#   (Table 1-1; §4.2's stack example ends at 0x09FF).
# - PIC24F 16-bit modified-Harvard core, 76 base instructions, 32 MHz max.
# - I/O SFRs (Tables 4-12/4-13): TRISA 0x02C0, PORTA 0x02C2, LATA 0x02C4,
#   ODCA 0x02C6, TRISB 0x02C8, PORTB 0x02CA, LATB 0x02CC, ODCB 0x02CE.
# - UART1 (Table 4-10): U1MODE 0x0220, U1STA 0x0222, U1TXREG 0x0224,
#   U1RXREG 0x0226, U1BRG 0x0228.
# - The public PIC24 core backs flash/SRAM with its dsPIC33FJ32MC204-sized
#   storage, so this real XC16 image fits; the descriptor still records the
#   part's exact 4 KB / 512 B geometry. Data EEPROM (absent on the 04KA),
#   UART2, timers, SPI, I2C and the package's alternate functions are not
#   exercised for this part.
# - ADC1 (§19, Table 4-15): ADC1BUF0-F 0x0300, AD1CON1 0x0320, AD1CON2 0x0322,
#   AD1CON3 0x0324, AD1CHS 0x0328, AD1PCFG 0x032C, AD1CSSL 0x0330. This is
#   the dsPIC33F ADC1 map without AD12B, CHPS and AD1CHS123, so the shared
#   core converts it in 10-bit mode. VREF+/VREF- external references and the
#   internal band-gap input are not modelled.
#
# The GPIO windows use the public core's mirror layout
# (PIC24_IO_MIRROR_BASE + TRISx + 16*port), exactly like the dsPIC33FJ32MC20x
# descriptors: A 0x102C0, B 0x102D0, C 0x102E0.
name: pic24f04ka201
arch: pic24
core: pic24f
cpu_hz: 32000000
flash:
  base: 0x000000
  size: "4KB"
ram:
  base: 0x000800
  size: "512B"
# ADC1 analog pads (DS30009937C Table 1-2, 20-pin package): AN0-AN5 and
# AN10-AN12; AN6-AN9 do not exist on this family.
# `board.analog.<pad>_volts` and `adc.adc1.<n>_volts` routes land on the
# `pic24_adc_pads` window, which the core's ADC1 converts against AVDD
# (VCFG = 000).
analog_pins:
  RA0: { peripheral: "adc1", channel: 0 }
  RA1: { peripheral: "adc1", channel: 1 }
  RB0: { peripheral: "adc1", channel: 2 }
  RB1: { peripheral: "adc1", channel: 3 }
  RA2: { peripheral: "adc1", channel: 4 }
  RA3: { peripheral: "adc1", channel: 5 }
  RB14: { peripheral: "adc1", channel: 10 }
  RB13: { peripheral: "adc1", channel: 11 }
  RB12: { peripheral: "adc1", channel: 12 }
peripherals:
  - id: "gpioa"
    type: "pic24_gpio"
    base_address: 0x000102C0
    size: "12"
    config: { port: "a", mask: 0x007F }
  - id: "gpiob"
    type: "pic24_gpio"
    base_address: 0x000102D0
    size: "12"
    config: { port: "b", mask: 0xF397 }
  - id: "gpioc"
    type: "pic24_gpio"
    base_address: 0x000102E0
    size: "12"
    config: { port: "c", mask: 0x0000 }
  # Not silicon: the routed AN pin levels ADC1 converts (see
  # `peripherals::pic24_adc_pads`). Past the mirrored SFR space.
  - id: "adc1"
    type: "pic24_adc_pads"
    base_address: 0x00010800
    size: "38"
    config: { channels: 0x1C3F, vref_mv: 3300 }
# Package pin map (DS30009937C Table 1-1, Table 1-2). The 20-pin package
# bonds RB0-RB2, RB4, RB7-RB9 and RB12-RB15 (RB7 is in the 20-pin pin diagram
# and the PORTB register map even though Table 1-2's digital-I/O list omits it).
pins:
  RA0: { gpio: gpioa, bit: 0 }
  RA1: { gpio: gpioa, bit: 1 }
  RA2: { gpio: gpioa, bit: 2 }
  RA3: { gpio: gpioa, bit: 3 }
  RA4: { gpio: gpioa, bit: 4 }
  RA5: { gpio: gpioa, bit: 5 }
  RA6: { gpio: gpioa, bit: 6 }
  RB0: { gpio: gpiob, bit: 0 }
  RB1: { gpio: gpiob, bit: 1 }
  RB2: { gpio: gpiob, bit: 2 }
  RB4: { gpio: gpiob, bit: 4 }
  RB7: { gpio: gpiob, bit: 7 }
  RB8: { gpio: gpiob, bit: 8 }
  RB9: { gpio: gpiob, bit: 9 }
  RB12: { gpio: gpiob, bit: 12 }
  RB13: { gpio: gpiob, bit: 13 }
  RB14: { gpio: gpiob, bit: 14 }
  RB15: { gpio: gpiob, bit: 15 }
