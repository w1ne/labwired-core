# Narrow CH32V003F4P6 profile for unmodified ch32fun (cnlohr/ch32fun)
# examples: the pfic-smoke profile (HSI/PLL handshake, FLASH_ACTLR, QingKe V2
# SysTick and PFIC, USART1 TX on PD5) with GPIOA/GPIOC added, because
# ch32fun's funGpioInitAll() clocks all three ports, and the WCH-LinkE debug
# printf channel that ch32fun uses as its default console, ADC1 (the
# STM32F1 ADC block at 10 bits) for ch32fun's adc_polled, and I2C1 on its
# default pins (PC1 SDA, PC2 SCL) for ch32fun's i2c_oled, and TIM2 with its
# channel outputs on the reset-mapped pads (PD4/PD3/PC0/PD7) for ch32fun's
# tim2_pwm, and EXTI with its AFIO_EXTICR port select for ch32fun's
# exti_pin_change_isr.
#
# Sources:
# - ch32fun ch32v003hw.h (register map, DMDATA0/DMDATA1/sentinel at
#   0xE00000F4..0xE00000FF), ch32fun.c (SystemInit: HSI x2 PLL to 48 MHz,
#   SysTick CTLR = 5 free-running at HCLK; _write/putchar debug printf)
# - minichlink DefaultPollTerminal (the probe side of the debug printf)
# - CH32V003 reference manual, RCC/GPIO/STK/PFIC/ADC chapters
#
# ADC1 models software-started single conversions of the regular channel in
# RSQR3, the RSTCAL/CAL handshakes, EOC, and 10-bit codes against a 3.3 V
# reference. Not modeled on it: sample time (SAMPTR), the injected group,
# scan/discontinuous mode, external triggers, the analog watchdog, DMA, the
# internal V_REFINT/V_CAL channels (IN8/IN9) and calibration offsets.
#
# I2C1 reuses the engine's STM32F1-shaped master event/register subset (same
# CTLR1/CTLR2/OADDR1/DATAR/STAR1/STAR2/CKCFGR offsets and SB/ADDR/TXE/BTF/
# BUSY/MSL/TRA flags as ch32fun's ch32v003hw.h). CKCFGR is stored, not
# turned into bus timing. Not modeled on it: the RCC_APB1PRSTR peripheral
# reset (writes are dropped, so a reset does not clear I2C1 state), the
# AFIO I2C1 remaps, slave mode, PEC, SMBus, the error/event interrupts and
# DMA.
#
# TIM2 reuses the engine's STM32F1 general-purpose timer (same CTLR1/
# CHCTLRx/CCER/CNT/PSC/ATRLR/CHxCVR offsets and PWM mode 1/2 as ch32fun's
# ch32v003hw.h), counting at HCLK (APB1 is undivided after SystemInit). The
# channel outputs drive their default pads while CCxE is set and the pad is
# in alternate-function output mode. Not modeled on TIM2: the AFIO PCFR1
# TIM2 remaps (PCFR1 is storage only, so a remapped pad does not move), the
# RCC_APB1PRSTR reset (dropped, as for I2C1), PD7's NRST option byte (the
# pad is treated as GPIO), encoder/slave modes, DMA and TIM2 interrupts.
#
# EXTI keeps the F1 register file (INTENR/EVENR/RTENR/FTENR/SWIEVR/INTFR)
# over its ten lines. A rising or falling edge on a pad whose port
# AFIO_EXTICR selects for lines 0..7 latches INTFR when RTENR/FTENR asks for
# it, and INTFR & INTENR drives PFIC interrupt 20 (EXTI7_0) as a level until
# the handler clears INTFR. Not modeled on EXTI: event mode (EVENR wakes
# nothing, as sleep is not modeled), the PVD (line 8) and AWU (line 9)
# sources and their interrupts 17/21, and the input filter/synchroniser
# latency (the flag is set on the same cycle as the pad edge).
#
# Not modeled: debug-printf input from the host, a detached probe, the rest
# of the RISC-V debug module, TIM1, SPI, DMA, OPA, the
# watchdogs, sleep/standby, the HSE, the option bytes, and everything listed
# as not modeled in ch32v003f4p6-pfic-smoke.yaml.
name: ch32v003f4p6-ch32fun-smoke
arch: riscv
core: qingke-v2a
registers_count: 16
# SYSCLK after ch32fun's SystemInit (HSI x2 PLL, FUNCONF_USE_PLL default).
cpu_hz: 48_000_000

flash:
  base: 0x08000000
  size: 16KB
ram:
  base: 0x20000000
  size: 2KB

pins:
  PC0: { gpio: gpioc, bit: 0, functions: [{ type: timer, peripheral: tim2, channel: 3 }] }
  PC1: { gpio: gpioc, bit: 1, functions: [{ type: i2c, peripheral: i2c1, role: sda }] }
  PC2: { gpio: gpioc, bit: 2, functions: [{ type: i2c, peripheral: i2c1, role: scl }] }
  PD0: { gpio: gpiod, bit: 0 }
  PD3: { gpio: gpiod, bit: 3, functions: [{ type: timer, peripheral: tim2, channel: 2 }] }
  PD4: { gpio: gpiod, bit: 4, functions: [{ type: timer, peripheral: tim2, channel: 1 }] }
  PD5: { gpio: gpiod, bit: 5 }
  PD6: { gpio: gpiod, bit: 6 }
  PD7: { gpio: gpiod, bit: 7, functions: [{ type: timer, peripheral: tim2, channel: 4 }] }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40021000
    size: 32B
    config:
      profile: ch32v003

  - id: flash_ctrl
    type: flash
    base_address: 0x40022000
    size: 4B
    config:
      profile: stm32f1

  # funGpioInitAll() sets AFIOEN with the port clocks; PCFR1 is storage only,
  # EXTICR (0x08) selects the port of EXTI lines 0..7.
  - id: afio
    type: afio
    base_address: 0x40010000
    size: 12B
    clock: { reg: apb2enr, bit: 0 }
    config:
      profile: ch32v003

  # EXTI has no RCC enable bit of its own on the CH32V003.
  - id: exti
    type: exti
    base_address: 0x40010400
    size: 24B
    config:
      profile: ch32v003

  # WCH-LinkE attached and polling like `minichlink -T`.
  - id: debug_printf
    type: wch_debug_printf
    base_address: 0xE00000F4
    size: 12B

  - id: pfic
    type: qingke_pfic
    base_address: 0xE000E000
    size: 4KB

  - id: stk
    type: qingke_v2_systick
    base_address: 0xE000F000
    size: 20B

  - id: gpioa
    type: gpio
    base_address: 0x40010800
    size: 1KB
    clock: { reg: apb2enr, bit: 2 }
    config:
      profile: ch32v003

  - id: gpioc
    type: gpio
    base_address: 0x40011000
    size: 1KB
    clock: { reg: apb2enr, bit: 4 }
    config:
      profile: ch32v003

  - id: gpiod
    type: gpio
    base_address: 0x40011400
    size: 1KB
    clock: { reg: apb2enr, bit: 5 }
    config:
      profile: ch32v003

  - id: usart1
    type: uart
    base_address: 0x40013800
    size: 1KB
    clock: { reg: apb2enr, bit: 14 }
    config:
      profile: stm32f1
      pad_map: ch32v003

  - id: adc1
    type: adc
    base_address: 0x40012400
    size: 1KB
    clock: { reg: apb2enr, bit: 9 }
    config:
      profile: ch32v003

  - id: i2c1
    type: i2c
    base_address: 0x40005400
    size: 1KB
    clock: { reg: apb1pcenr, bit: 21 }
    config:
      profile: stm32f1

  - id: tim2
    type: timer
    base_address: 0x40000000
    size: 1KB
    clock: { reg: apb1pcenr, bit: 0 }
