name: "stm32f405rg"
arch: "arm"
core: "cortex-m4"
registers_count: 150
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# STM32F405RG maximum core clock, 168 MHz.
cpu_hz: 168_000_000

flash:
  base: 0x08000000
  size: "1MB"
ram:
  base: 0x20000000
  size: "128KB"
peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40023800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/rcc.yaml"
      profile: "stm32f4"
  - id: "gpioa"
    type: "gpio"
    base_address: 0x40020000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/gpioa.yaml"
      profile: "stm32v2"
      # SWD/JTAG defaults (RM0368 §8.4 / STM32F401 SVD): PA13/14/15 in AF mode.
      reset_moder: 0xA8000000
      reset_pupdr: 0x64000000
  - id: "gpiob"
    type: "gpio"
    base_address: 0x40020400
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/gpiob.yaml"
      profile: "stm32v2"
      # JTAG defaults (RM0368 §8.4 / STM32F401 SVD): PB3 (JTDO/SWO), PB4 (NJTRST).
      reset_moder: 0x00000280
      reset_ospeedr: 0x000000C0
      reset_pupdr: 0x00000100
  - id: "gpioc"
    type: "gpio"
    base_address: 0x40020800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/gpioc.yaml"
      profile: "stm32v2"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
  - id: "uart2"
    type: "uart"
    base_address: 0x40004400
    size: "1KB"
    irq: 38
    config:
      debug_schema: "../peripherals/stm32f405/usart2.yaml"
  - id: "i2c1"
    type: "i2c"
    base_address: 0x40005400
    size: "1KB"
    # I2C1 has TWO NVIC lines on F4 (RM0368 §11.1.3): EV = 31 (below) and
    # ER = 32. AF/BERR/ARLO/OVR raise ER under CR2.ITERREN, and an
    # interrupt-mode HAL only learns an address was NACKed from the ER
    # handler — STM32duino 3.x drives I2C via HAL_I2C_Master_Transmit_IT, so
    # without ER every NACK surfaced as a 100 ms timeout instead of a NACK.
    irq: 31
    # I2C1 is clock-gated by RCC_APB1ENR.I2C1EN (bit 21) on this part, as
    # it is on the F407 whose descriptor has always declared it. Without
    # this the peripheral answers before it is enabled, and firmware that
    # forgets the gate works here and hangs on silicon.
    clock:
      reg: "apb1enr"
      bit: 21
    config:
      debug_schema: "../peripherals/stm32f405/i2c1.yaml"
      irq_error: 32
  - id: "flash"
    type: "flash"
    base_address: 0x40023C00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/flash.yaml"
      # F4 embedded-flash interface (RM0368 §3.8): ACR reset 0 (no F1-style
      # prefetch default), CR LOCK at bit 31, OPTCR present. The F1 profile's
      # 0x30 ACR default and bit-7 LOCK are silicon-wrong for F401.
      profile: "stm32f4"
  - id: "pwr"
    type: "pwr"
    base_address: 0x40007000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/pwr.yaml"
      # F4 PWR (RM0368 §5.4): only PWR_CR/PWR_CSR exist, both reset 0. The
      # default L4 model surfaced CR1=0x200 / CR3=0x8000 and phantom PUCRx regs.
      profile: "stm32f4"
  - id: "uart1"
    type: "uart"
    base_address: 0x40011000
    size: "1KB"
    irq: 37
    config:
      debug_schema: "../peripherals/stm32f405/usart1.yaml"
  # TIM2 — 32-bit general-purpose timer (RM0368 §13). On APB1, clock-gated by
  # RCC_APB1ENR.TIM2EN (bit 0); unclocked out of reset, so register writes are
  # dropped until firmware enables the gate.
  - id: "tim2"
    type: "timer"
    base_address: 0x40000000
    size: "1KB"
    irq: 28
    config:
      debug_schema: "../peripherals/stm32f405/tim2.yaml"
      width: 32
    clock: { reg: "apb1enr", bit: 0 }
  # SPI1 — classic STM32 SPI (RM0368 §20). On APB2, clock-gated by
  # RCC_APB2ENR.SPI1EN (bit 12). F4 silicon CR masks mirror the F407:
  # CR2 bit 4 (FRF/TI-mode) writable → 0xF7; CR1 bit 12 (CRCNEXT) not latched
  # → 0xEFFF.
  - id: "spi1"
    type: "spi"
    base_address: 0x40013000
    size: "1KB"
    irq: 35
    config:
      debug_schema: "../peripherals/stm32f405/spi1.yaml"
      cr2_mask: 0xF7
      cr1_mask: 0xEFFF
    clock: { reg: "apb2enr", bit: 12 }
  # ADC1 — 12-bit SAR ADC (RM0368 §11). On APB2, clock-gated by
  # RCC_APB2ENR.ADC1EN (bit 8); unclocked out of reset.
  - id: "adc1"
    type: "adc"
    base_address: 0x40012000
    size: "1KB"
    irq: 18
    clock: { reg: "apb2enr", bit: 8 }
    config:
      debug_schema: "../peripherals/stm32f405/adc1.yaml"
  # IWDG — independent watchdog (RM0368 §14). Clocked from the dedicated LSI
  # oscillator, NOT an APB/AHB peripheral-enable bit, so it carries no `clock:`
  # gate. The KR key (0x5555) protects PR/RLR writes instead.
  - id: "iwdg"
    type: "iwdg"
    base_address: 0x40003000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/iwdg.yaml"
  # RTC — calendar real-time clock (RM0368 §16; same IP as the L4 `rtc` model).
  # Lives in the backup domain, clock-enabled via RCC_BDCR.RTCEN — outside the
  # APB/AHB peripheral-enable gate this model expresses, so it is left ungated.
  - id: "rtc"
    type: "rtc"
    base_address: 0x40002800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/rtc.yaml"
  # EXTI — external interrupt/event controller (RM0368 §10.2). The F401
  # implements 23 lines (0..22): 16 GPIO + PVD + RTC alarm + USB OTG FS wakeup
  # + RTC tamper/timestamp + RTC wakeup. Sits on APB2 but has no RCC enable bit
  # of its own — the SYSCFG clock gates the line *muxing*, not the EXTI block.
  - id: "exti"
    type: "exti"
    base_address: 0x4001_3C00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/exti.yaml"
      lines: 23
  # NVIC is wired unconditionally for Cortex-M machines; this entry declares
  # the tier1 irq class and pins the canonical base.
  - id: "nvic"
    type: "nvic"
    base_address: 0xE000E100
    size: "1KB"
  - id: "dbgmcu"
    type: "dbgmcu"
    base_address: 0xE004_2000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f405/dbg.yaml"
      # DBGMCU_IDCODE for the F405: RM0090 §38.6.1 documents DEV_ID=0x413 for
      # STM32F405/407 (REV_ID=0x1000) — the F401's 0x411 is a different die.
      idcode: 0x10006413
  # TIM1 — advanced-control PWM timer (APB2, RM0368 §12). The `_pwm` id suffix
  # declares the pwm class alongside timer. RCC_APB2ENR.TIM1EN (bit 0),
  # verified against tests/fixtures/real_world/stm32f401.svd.
  - id: "tim1_pwm"
    type: "timer"
    base_address: 0x4001_0000
    size: "1KB"
    irq: 25
    clock: { reg: "apb2enr", bit: 0 }
    config:
      debug_schema: "../peripherals/stm32f405/tim1.yaml"
      advanced: true
  # DMA1 / DMA2 — stream-based DMA controllers (RM0368 §9; same IP as F407,
  # RM0090 §10). Eight streams each; DMA2 additionally supports
  # memory-to-memory transfers (RM0368 §9.3.3). Clocked from RCC_AHB1ENR
  # (DMA1EN bit 21, DMA2EN bit 22 — verified against the SVD).
  - id: "dma1"
    type: "stm32f4_dma"
    base_address: 0x4002_6000
    size: "1KB"
    clock: { reg: "ahb1enr", bit: 21 }
    config:
      debug_schema: "../peripherals/stm32f405/dma1.yaml"
      # DMA1_Stream0..7 NVIC positions, verified against
      # tests/fixtures/real_world/stm32f401.svd: 11..17, then 47.
      stream_irqs: [11, 12, 13, 14, 15, 16, 17, 47]
  - id: "dma2"
    type: "stm32f4_dma"
    base_address: 0x4002_6400
    size: "1KB"
    clock: { reg: "ahb1enr", bit: 22 }
    config:
      debug_schema: "../peripherals/stm32f405/dma2.yaml"
      dma2: true
      # DMA2_Stream0..7 NVIC positions, verified against
      # tests/fixtures/real_world/stm32f401.svd: 56..60, then 68..70.
      stream_irqs: [56, 57, 58, 59, 60, 68, 69, 70]
