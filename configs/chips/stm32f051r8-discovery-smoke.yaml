# Narrow STM32F051R8T6 profile for the STM32F0DISCOVERY LD3 smoke.
# Only the reset-clock RCC register bank and GPIOC needed by PC9 are declared.
# All other STM32F051 peripherals and GPIO ports remain unsupported.
# Sources: ST DS022265, RM0091, and UM1525.
name: stm32f051r8-discovery-smoke
arch: arm
core: cortex-m0
cpu_hz: 8000000

flash:
  base: 0x08000000
  size: 64KB
ram:
  base: 0x20000000
  size: 8KB

pins:
  PC9: { gpio: gpioc, bit: 9 }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40021000
    size: 1KB
    config:
      profile: stm32f0

  - id: gpioc
    type: gpio
    base_address: 0x48000800
    size: 1KB
    clock: { reg: ahbenr, bit: 19 }
    config:
      profile: stm32v2
