# Focused STM32L031K6T6 profile for NUCLEO-L031K6.
# It exposes reset-clock RCC and GPIOB/PB3, the board's active-high LD3 user LED.
# Other MCU and board peripherals are intentionally unsupported in this profile.
# Sources: ST STM32L031K6 datasheet for Cortex-M0+, memory and L0x1 family;
# RM0377 for the L0 RCC/GPIO register map; UM1956 Rev 6 for PB3/D13 LED wiring.

name: "stm32l031k6-nucleo-smoke"
arch: "arm"
core: "cortex-m0+"
registers_count: 80
# The smoke selects HSI16 before configuring the GPIO output.
cpu_hz: 16_000_000

flash:
  base: 0x08000000
  size: "32KB"
ram:
  base: 0x20000000
  size: "8KB"

pins:
  PB3: { gpio: "gpiob", bit: 3 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      profile: "stm32l0"

  - id: "gpiob"
    type: "gpio"
    base_address: 0x50000400
    size: "1KB"
    config:
      profile: "stm32v2"
    clock: { reg: "iopenr", bit: 1 }
