# Narrow ESP32 Feather V2 onboarding profile.
#
# This profile declares only the classic ESP32 memory windows and GPIO block
# required to boot the GPIO13 LED smoke. The physical Feather has 8 MiB flash
# and 2 MiB PSRAM, but this model slice exposes the engine's 4 MiB flash view
# and no PSRAM behavior. UART, Wi-Fi/Bluetooth, timers, I2C, SPI, USB bridge,
# NeoPixel, and power-management paths are outside this profile.
#
# Board pin source: Adafruit ESP32 Feather V2 pinout guide (red LED on GPIO13).

name: "esp32-feather-v2-smoke"
arch: "xtensa-lx6"
cpu_hz: 240000000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.25
  vih: 0.75

flash:
  base: 0x400D0000
  size: "4MiB"
ram:
  base: 0x3FFB0000
  size: "192KiB"

pins:
  GPIO13: { gpio: "gpio", bit: 13, functions: [{ type: gpio, peripheral: gpio }] }

peripherals:
  - id: "gpio"
    type: "esp32_gpio"
    base_address: 0x3FF44000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/gpio.yaml"
