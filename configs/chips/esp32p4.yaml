# Narrow ESP32-P4 HP-core profile for the ESP32-P4X-C5-Function-EV-Board.
#
# Fast-boot profile: the simulator loads a bare ELF at its entry point; it does
# not execute mask ROM, the second-stage bootloader, clock startup, or launch
# the second HP core. The modeled HP core uses the RV32IMAC subset exercised by
# the smoke. Only UART0 FIFO/STATUS are exposed. USB Serial/JTAG, GPIO/IO_MUX,
# the C5 radio module, display, camera, audio, Ethernet, USB, and MicroSD are
# not modeled by this profile.
#
# Sources checked 2026-11-12:
#   ESP32-P4X-C5-Function-EV-Board guide:
#     https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32p4/esp32-p4x-c5-function-ev-board/user_guide.html
#   ESP-IDF P4 memory map and UART registers:
#     https://github.com/espressif/esp-idf/tree/master/components/soc/esp32p4/register/hw_ver3/soc

name: "esp32p4"
arch: "riscv"
core: "rv32imac"
registers_count: 31
cpu_hz: 400_000_000

# The board carries 16 MB SPI flash at the P4 IROM/DROM window. The board
# profile maps the 512 KiB high HP-SRAM window used for v3.x P4 firmware; the
# rest of the nominal 768 KiB SRAM is outside this fast-boot profile.
flash:
  base: 0x40000000
  size: "16384KB"
ram:
  base: 0x4FF40000
  size: "512KB"

peripherals:
  # P4 UART0 FIFO@0x00 / STATUS@0x1C, at 0x500C_A000 (ESP-IDF hw_ver3).
  # IRQ 5, 400 MHz HP core and 90 MHz APB source clock. The 32-byte window
  # stops before the unmodeled UART configuration tail. UART0's physical
  # U0TXD/U0RXD pins are GPIO37/GPIO38, exposed on J1 pins 8/10.
  - id: "uart0"
    type: "esp32p4_uart"
    irq: 5
    base_address: 0x500CA000
    size: "32B"
    config:
      echo_stdout: true
      cpu_clock_hz: 400000000
      uart_sclk_hz: 90000000
