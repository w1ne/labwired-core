# LabWired - Vega board (RI5CY) chip configuration
#
# Sources (retrieved 2026-10-23):
# - The pinned upstream RI5CY platform and the Vega board overlay: RI5CY CPU
#   (RV32IMC, privileged 1.10), 1 MiB flash at 0x0, 192 KiB SRAM at
#   0x20000000, LPUART0 at 0x40042000 (external IRQ 17) and LPUART1 at
#   0x40043000 (routed through the INTMUX), LPTMR0/1/2 at 0x40032000 /
#   0x40033000 / 0x4102B000, INTMUX at 0x4004F000.
# - The Vega board overlay's clock blocks: the System Clock Generator CSR at
#   0x4002C010 and the two PCC clock banks at 0x4002B000 / 0x41027000.
# - NXP LPUART (Kinetis) register map: DATA @ +0x0C, STAT @ +0x04 with TDRE
#   (bit 23) / TC (bit 22); the engine's `lpuart` UART profile models it.
#
# - LPADC0: rv32m1_sdk_riscv @92fb0650 RV32M1_ri5cy.h (ADC0_BASE 0x4004A000,
#   ADC_Type ends with RESFIFO at 0x300), fsl_lpadc.c and the
#   boards/rv32m1_vega pin_mux.c signal lists (ADC0_SEn pads); reset values
#   from rv32m1-rust/rv32m1_ri5cy-pac RV32M1_RI5CY.svd.
#
# Modelled: CPU + memory + LPUART0/1 (polled console path) + LPADC0.
# Declared, not modelled (`type: stub`): the low-power timers, the INTMUX and
# the SCG/PCC clock blocks — the smoke prints the SCG/PCC readbacks so the
# boundary is visible on the wire. GPIO/PORT are not declared: the ADC0_SEn
# pads below are analog routes only, and no digital pad level is defined.
#
# Tier: L1 smoke — boot + UART byte path on the Vega SoC map.

name: "vegaboard-ri5cy"
arch: "riscv"
core: "rv32imc"
# The platform does not declare a core clock; 50 MHz is the rate this target
# models (the smoke is polled and does not depend on it).
cpu_hz: 50_000_000

flash: { base: 0x0, size: "1MiB" }
ram: { base: 0x20000000, size: "192KB" }
# 0x0 is the SoC's real flash, not an alias.
flash_boot_alias: false
peripherals:
  - id: "lpuart0"
    type: "uart"
    config: { profile: "lpuart" }
    base_address: 0x40042000
    size: "4KB"
    irq: 17
  - id: "lpuart1"
    type: "uart"
    config: { profile: "lpuart" }
    base_address: 0x40043000
    size: "4KB"
  - id: "lptmr0"
    type: "stub"
    base_address: 0x40032000
    size: "4KB"
  - id: "lptmr1"
    type: "stub"
    base_address: 0x40033000
    size: "4KB"
  - id: "lptmr2"
    type: "stub"
    base_address: 0x4102B000
    size: "4KB"
  - id: "intmux0"
    type: "stub"
    base_address: 0x4004F000
    size: "4KB"
  - id: "scg_csr"
    type: "stub"
    base_address: 0x4002C010
    size: "1KB"
  - id: "pcc0"
    type: "stub"
    base_address: 0x4002B000
    size: "1KB"
  - id: "pcc1"
    type: "stub"
    base_address: 0x41027000
    size: "1KB"
  # LPADC0 on `nxp_lpadc` with the RV32M1 `single_fifo` layout (one RESFIFO,
  # FCTRL at 0x30, four triggers at 0xC0, CMDL.ADCH/ABSEL only, CFG.CALOFS).
  # ADC0_IRQn is 21 on the RI5CY core and arrives through the INTMUX/event
  # unit, which is a stub here, so no irq is wired. The PCC clock gate is a
  # stub too: the block converts without it. VREFH 1.8 V is an ASSUMPTION: no
  # source was found for the Vega board's VREFH rail.
  - id: "adc0"
    type: "nxp_lpadc"
    base_address: 0x4004A000
    size: "4KB"
    config: { layout: "single_fifo", vref_mv: 1800 }

# ADC0_SEn pads from the pin_signal lists in the rv32m1_sdk_riscv
# boards/rv32m1_vega/*/pin_mux.c files (e.g. lpspi/interrupt: "ADC0_SE2/PTB7",
# lpspi_loopback: "ADC0_SE4/LPCMP0_IN2/PTC9"). SEn is converted as CHnA
# (CMDL.ADCH = n, ABSEL = 0), the SDK's kLPADC_SampleChannelSingleEndSideA
# default that the lpadc/polling example uses on channel 0 (J2-4). ADC0_SE3,
# SE9 and SE11 are left out: no SDK file names their pads.
analog_pins:
  PTB3:  { peripheral: adc0, channel: 0 }    # ADC0_SE0
  PTB4:  { peripheral: adc0, channel: 1 }    # ADC0_SE1
  PTB7:  { peripheral: adc0, channel: 2 }    # ADC0_SE2
  PTC9:  { peripheral: adc0, channel: 4 }    # ADC0_SE4
  PTC10: { peripheral: adc0, channel: 5 }    # ADC0_SE5
  PTC11: { peripheral: adc0, channel: 6 }    # ADC0_SE6
  PTC12: { peripheral: adc0, channel: 7 }    # ADC0_SE7
  PTD5:  { peripheral: adc0, channel: 8 }    # ADC0_SE8
  PTD7:  { peripheral: adc0, channel: 10 }   # ADC0_SE10
  PTD9:  { peripheral: adc0, channel: 12 }   # ADC0_SE12
