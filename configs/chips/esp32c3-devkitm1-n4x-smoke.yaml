# Narrow smoke profile for Espressif's ESP32-C3-DevKitM-1-N4X.
# It exposes GPIO8, IO_MUX GPIO8, RMT TX0, and the 4 MiB flash / 400 KiB SRAM
# needed by firmware that drives the board's addressable RGB LED.
name: "esp32c3-devkitm1-n4x-smoke"
arch: "riscv"
core: "rv32imc"
registers_count: 31
cpu_hz: 160_000_000

flash:
  base: 0x42000000
  size: "4096KB"
ram:
  base: 0x3FC80000
  size: "400KB"

pins:
  GPIO8: { gpio: "gpio", bit: 8 }

peripherals:
  - id: "gpio"
    type: "esp32c3_gpio"
    base_address: 0x60004000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32c3/gpio.yaml"

  - id: "io_mux"
    type: "esp32c3_io_mux"
    base_address: 0x60009000
    config:
      debug_schema: "../peripherals/esp32c3/io_mux.yaml"
      path: "../peripherals/esp32c3/io_mux.yaml"

  - id: "rmt"
    type: "esp32c3_rmt"
    base_address: 0x60016000
    size: "2KB"
    irq: 28
    config:
      cpu_clock_hz: 160_000_000
      debug_schema: "../peripherals/esp32c3/rmt.yaml"
