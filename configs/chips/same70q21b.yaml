# LabWired - ATSAME70Q21B chip configuration
#
# The ATSAME70Q21B: Cortex-M7, 2 MiB flash at 0x00400000, 384 KiB SRAM at
# 0x20400000 — the MCU on the Microchip SAM E70 Xplained board. The first
# SAM E70 part in the engine.
#
# Sources:
# - SAM E70/S70/V70/V71 datasheet (Microchip DS60001527): the memory map,
#   the peripheral identifiers, the bus matrix (CCFG_SYSIO), and the PMC,
#   PIO, USART, UART and WDT chapters.
# - Zephyr `dts/arm/atmel/samx7x.dtsi` + `samx7xx21.dtsi` for the peripheral
#   bases, the interrupt numbers and the 2 MiB/384 KiB part sizes.
# - Renode v1.17.0 `platforms/cpus/sam_e70.repl` (USART0-2, GEM, TRNG, PMC_SR)
#   as a cross-check of the bases only. It declares 256 MiB of flash and RAM,
#   which this descriptor does not copy.
#
# Profiles: the SAM E70 PIO and PMC have the SAM4S register layouts, so this
# chip reuses `sam4s_pio` (PIOA-PIOE) and `sam4s_pmc`. UART0-4 and USART0-2
# use the `sam` UART layout (status SR/CSR @0x14, THR @0x1C, BRGR @0x20).
#
# Also modelled: CHIPID (declarative, rev-B CIDR) and the Cortex-M7 L1 cache
# geometry + maintenance window (`cortex_m7_cache`, no cache contents).
#
# Declared stubs (accept writes, read zero): EEFC, the RSTC/SUPC/RTT/WDT/RTC
# system controller and the bus matrix (CCFG_SYSIO at +0x114, the PB4/TDI
# select). Not mapped (access faults): GMAC, TRNG, TC0-3, SPI0/1, QSPI,
# TWIHS0-2, MCAN0/1, AFEC0/1, DACC, PWM0/1, HSMCI, SSC, USBHS, XDMAC, AES,
# ICM, ISI, the TCM controls and the rest.
#
# Tier: L1 smoke — boot + USART1 console + PIO LED/button path on the SAM E70
# Xplained map, plus stock Zephyr v3.7.0 hello_world and synchronization.
# SIM-DERIVED (no SAM E70 bench part).

name: "same70q21b"
arch: "arm"
core: "cortex-m7"
registers_count: 120
# ATSAME70Q21B maximum core clock, 300 MHz (DS60001527).
cpu_hz: 300_000_000

flash:
  base: 0x00400000
  # 2 MiB of embedded flash (SAME70Q21B; Zephyr samx7xx21.dtsi).
  size: "2048KB"
ram:
  base: 0x20400000
  # 384 KiB of SRAM (the TCM split is not modelled; all of it is system SRAM).
  size: "384KB"
# The SAM E70 boots from flash at 0x00400000, not from an alias at 0.
flash_boot_alias: false

pins:
  # Board-relevant pads (SAM E70 Xplained: LED0 on PC8, SW0 on PA11, the EDBG
  # virtual COM port on USART1 RXD1 PA21 / TXD1 PB4).
  PA11: { gpio: "pioA", bit: 11 }
  PA21: { gpio: "pioA", bit: 21 }
  PB4: { gpio: "pioB", bit: 4 }
  PC8: { gpio: "pioC", bit: 8 }

peripherals:
  # --- System controller (0x400E0600 upwards) -----------------------------
  - id: "pmc"
    type: "sam4s_pmc"
    base_address: 0x400E0600
    size: 512
    irq: 5

  - id: "uart0"
    type: "uart"
    base_address: 0x400E0800
    size: 256
    irq: 7
    config:
      profile: "sam"
  - id: "uart1"
    type: "uart"
    base_address: 0x400E0A00
    size: 256
    irq: 8
    config:
      profile: "sam"

  # CHIPID (CIDR/EXID): the ATSAME70Q21B revision B identification words.
  # Zephyr's SoC init compares CIDR with its HAL value.
  - id: "chipid"
    type: "declarative"
    base_address: 0x400E0940
    size: "8B"
    config:
      path: "../peripherals/same70q21b/chipid.yaml"

  - id: "eefc"
    type: "stub"
    base_address: 0x400E0C00
    size: 512

  - id: "pioA"
    type: "sam4s_pio"
    base_address: 0x400E0E00
    size: 512
    irq: 10
  - id: "pioB"
    type: "sam4s_pio"
    base_address: 0x400E1000
    size: 512
    irq: 11
  - id: "pioC"
    type: "sam4s_pio"
    base_address: 0x400E1200
    size: 512
    irq: 12
  - id: "pioD"
    type: "sam4s_pio"
    base_address: 0x400E1400
    size: 512
    irq: 16
  - id: "pioE"
    type: "sam4s_pio"
    base_address: 0x400E1600
    size: 512
    irq: 17

  - id: "rstc"
    type: "stub"
    base_address: 0x400E1800
    size: 16
  - id: "supc"
    type: "stub"
    base_address: 0x400E1810
    size: 32
  - id: "rtt"
    type: "stub"
    base_address: 0x400E1830
    size: 16
  # The WDT runs from reset; firmware disables it with WDT_MR.WDDIS (+0x04).
  # The stub accepts that write and never fires, so the gap is one-sided: a
  # firmware that forgets to disable the watchdog will not reset here.
  - id: "wdt"
    type: "stub"
    base_address: 0x400E1850
    size: 16
  - id: "rtc"
    type: "stub"
    base_address: 0x400E1860
    size: 48

  - id: "uart2"
    type: "uart"
    base_address: 0x400E1A00
    size: 256
    irq: 44
    config:
      profile: "sam"
  - id: "uart3"
    type: "uart"
    base_address: 0x400E1C00
    size: 256
    irq: 45
    config:
      profile: "sam"
  - id: "uart4"
    type: "uart"
    base_address: 0x400E1E00
    size: 256
    irq: 46
    config:
      profile: "sam"

  # --- USARTs -------------------------------------------------------------
  - id: "usart0"
    type: "uart"
    base_address: 0x40024000
    size: 256
    irq: 13
    config:
      profile: "sam"
  - id: "usart1"
    type: "uart"
    base_address: 0x40028000
    size: 256
    irq: 14
    config:
      profile: "sam"
  - id: "usart2"
    type: "uart"
    base_address: 0x4002C000
    size: 256
    irq: 15
    config:
      profile: "sam"

  # --- Bus matrix -----------------------------------------------------------
  # CCFG_SYSIO (+0x114) selects PB4/PB5/PB6/PB7/PB12 as PIO instead of the
  # JTAG/erase pins. The stub stores nothing: the PIO model does not gate a
  # pad on SYSIO, so the select has no effect here.
  - id: "matrix"
    type: "stub"
    base_address: 0x40088000
    size: 512

  # Cortex-M7 L1 caches: 16 KiB I-cache + 16 KiB D-cache on the SAM E70
  # (DS60001527, the Cortex-M7 configuration table). The SCB reports this
  # geometry (CLIDR/CTR/CCSIDR); the maintenance operations at 0xE000EF50 are
  # accepted as no-ops because simulated memory is always coherent.
  - id: "l1_cache"
    type: "cortex_m7_cache"
    base_address: 0xE000EF50
    size: 48
    config:
      icache_kb: 16
      dcache_kb: 16

  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: 16
