peripherals:
  # SYSINFO (CHIP_ID 0x30004927 = revision 3, part 0x0004, manufacturer 0x927
  # — rp2350 sysinfo.h). The pico-sdk USB errata workaround asserts the
  # Raspberry Pi manufacturer id here.
  - id: "sysinfo"
    type: "declarative"
    base_address: 0x40000000
    size: "4KB"
    config:
      path: "../peripherals/rp2350/sysinfo-qfn80.yaml"
  # Native RP2350 addressmap.h blocks are separate 4KB register windows.
  # Reuse the existing clock/reset register model at each block's actual base;
  # its ready-bit behavior remains local to CLOCKS/RESETS/XOSC/PLLs. PSM and
  # pad/QSPI windows retain register storage only, as in the shared model.
  # No aggregate window covers IO_BANK0 or relies on overlap routing.
  - id: "clk_rst"
    type: "rp2040_clkrst"
    base_address: 0x40010000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/clocks.yaml"
      profile: "rp2350"
  - id: "psm"
    type: "rp2040_clkrst"
    base_address: 0x40018000
    size: "4KB"
    config:
      profile: "rp2350"
  - id: "resets"
    type: "rp2040_clkrst"
    base_address: 0x40020000
    size: "4KB"
    config:
      profile: "rp2350"
  # IO_BANK0 owns the 48 physical pad muxes and six IRQ words. IO_IRQ_BANK0
  # is NVIC21; the RP2350 interrupt block starts at offset0x230.
  - id: "io_bank0"
    type: "rp2040_io_bank0"
    base_address: 0x40028000
    size: "4KB"
    irq: 21
    config:
      profile: "rp2350b"
  - id: "io_qspi"
    type: "rp2040_clkrst"
    base_address: 0x40030000
    size: "4KB"
    config:
      profile: "rp2350"
  - id: "pads_bank0"
    type: "rp2040_clkrst"
    base_address: 0x40038000
    size: "4KB"
    config:
      profile: "rp2350"
  - id: "pads_qspi"
    type: "rp2040_clkrst"
    base_address: 0x40040000
    size: "4KB"
    config:
      profile: "rp2350"
  - id: "xosc"
    type: "rp2040_clkrst"
    base_address: 0x40048000
    size: "4KB"
    config:
      profile: "rp2350"
  - id: "pll_sys"
    type: "rp2040_clkrst"
    base_address: 0x40050000
    size: "4KB"
    config:
      profile: "rp2350"
  - id: "pll_usb"
    type: "rp2040_clkrst"
    base_address: 0x40058000
    size: "4KB"
    config:
      profile: "rp2350"
  - id: "rosc"
    type: "rp2040_clkrst"
    base_address: 0x400E8000
    size: "4KB"
    config:
      profile: "rp2350"
  # POWERMAN + TICKS window (0x40100000..0x4010C000) — register storage only;
  # no power sequencing.
  - id: "powman"
    type: "stub"
    base_address: 0x40100000
    size: "48KB"
  - id: "uart0"
    type: "uart"
    base_address: 0x40070000
    irq: 33
    config:
      debug_schema: "../peripherals/rp2350/uart0.yaml"
      profile: "pl011"
  - id: "uart1"
    type: "uart"
    base_address: 0x40078000
    irq: 34
    config:
      profile: "pl011"
  - id: "spi0"
    type: "rp2040_spi"
    base_address: 0x40080000
    size: "4KB"
    irq: 31
  - id: "spi1"
    type: "rp2040_spi"
    base_address: 0x40088000
    size: "4KB"
    irq: 32
  - id: "i2c0"
    type: "rp2040_i2c"
    base_address: 0x40090000
    size: "4KB"
    irq: 36
  - id: "i2c1"
    type: "rp2040_i2c"
    base_address: 0x40098000
    size: "4KB"
    irq: 37
  - id: "adc"
    type: "rp2040_adc"
    base_address: 0x400A0000
    size: "4KB"
    irq: 35
    config:
      profile: "rp2350b"
      debug_schema: "../peripherals/rp2350/adc.yaml"
  # PWM: 12 slices, so EN/INTR/IRQ0_*/IRQ1_* start at 0xF0 (pico-sdk rp2350
  # pwm.h); PWM_IRQ_WRAP_0/_1 = NVIC 8/9. The debug schema below is still the
  # RP2040-shaped one (EN at 0xA0): names only, the model uses the profile.
  - id: "pwm"
    type: "rp2040_pwm"
    base_address: 0x400A8000
    size: "4KB"
    irq: 8
    config:
      debug_schema: "../peripherals/rp2350/pwm.yaml"
      profile: "rp2350"
  # TIMER0. The RP2040 timer model with the RP2350 map: LOCKED/SOURCE at
  # 0x34/0x38 push INTR/INTE/INTF/INTS to 0x3c..0x48 (pico-sdk rp2350
  # hardware_regs/timer.h). TIMER0_IRQ_0..3 are NVIC 0..3, as on the RP2040.
  - id: "timer0"
    type: "rp2040_timer"
    base_address: 0x400B0000
    size: "4KB"
    config:
      profile: "rp2350"
  # XIP_CTRL (flash cache control) — declarative storage, as on RP2040.
  # Coherent/cacheless XIP: real clean/invalidate addresses, explicit errors
  # for cache pinning and unsupported direct QMI operations.
  - id: "xip_maintenance"
    type: "rp2350_xip_maintenance"
    base_address: 0x18000000
    # parse_size uses decimal MB; this architectural window is 64 MiB.
    size: "65536KB"
  - id: "qmi"
    type: "rp2350_qmi"
    base_address: 0x400D0000
    size: "4KB"
  - id: "xip_ctrl"
    type: "declarative"
    base_address: 0x400C8000
    size: "4KB"
    config:
      path: "../peripherals/rp2350/xip_ctrl.yaml"
  - id: "watchdog"
    type: "rp2040_watchdog"
    base_address: 0x400D8000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/watchdog.yaml"
  - id: "dma"
    type: "rp2040_dma"
    base_address: 0x50000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/dma.yaml"
  - id: "pio0"
    type: "pio"
    base_address: 0x50200000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/pio0.yaml"
  - id: "pio1"
    type: "pio"
    base_address: 0x50300000
    size: "4KB"
  - id: "pio2"
    type: "pio"
    base_address: 0x50400000
    size: "4KB"
  # BOOT RAM endpoint (datasheet 4.3): 1 KB boot RAM, WRITE_ONCE0/1 and the
  # BOOTLOCK0..7 try-locks at +0x800. pico-sdk pre-main resets the boot locks
  # and spins claiming BOOTLOCK7 (runtime_init_bootrom_locking_enable);
  # unmapped, the first BOOTLOCK store BusFaulted at 0x400E080C.
  - id: "bootram"
    type: "rp2350_bootram"
    base_address: 0x400E0000
    size: "4KB"
  # USB device controller: the RP2040 one at the same addresses — DPRAM
  # 0x50100000 + register block 0x50110000 (datasheet 12.7, MAIN_CTRL @0x040,
  # USB_MUXING @0x074 ...) — on USBCTRL_IRQ 14 (datasheet 3.2, Table 95).
  # pico-sdk's pre-main runtime_init_usb_power_down writes it before any user
  # code; unmapped, that store BusFaulted at 0x5011004C. Same behavioural
  # model and simulated host as rp2040.yaml.
  - id: "usbctrl"
    type: "rp2040_usb"
    base_address: 0x50100000
    size: "80KB"
    irq: 14
  # TBMAN — storage stub; PLATFORM reads 0 → ASIC path, correct for the sim.
  - id: "tbman"
    type: "stub"
    base_address: 0x40160000
    size: "4KB"
  # SIO (single-cycle IO) — GPIO out/oe + readback. CPUID reads 0 (core 0;
  # core 1 is not modeled yet).
  # SIO with the RP2350 GPIO map (each register has a HI twin at +4, so
  # OUT_SET is 0x18 and OE is 0x30, not the RP2040's 0x14 / 0x20).
  - id: "sio"
    type: "rp2040_sio"
    base_address: 0xD0000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/sio.yaml"
      profile: "rp2350b"
  # Cortex-M33 SCS ACTLR (0xE000E008), a plain register: pico-sdk's
  # spinlock_set_extexclall() sets EXTEXCLALL during runtime init.
  - id: "actlr"
    type: "declarative"
    base_address: 0xE000E008
    size: "4B"
    config:
      path: "../peripherals/rp2350/actlr.yaml"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: "16B"
  - id: "nvic"
    type: "nvic"
    base_address: 0xE000E100
    size: "1KB"
