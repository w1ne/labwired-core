# WCH CH32L103C8T6 in LQFP48 (QingKe V4C, RV32IMAC, low-power family).
#
# Geometry, package and maximum clock: WCH CH32L103 Datasheet V2.1, the
# product table on page 1 (C8T6: 64 KB flash, 20 KB SRAM, 37 GPIOs, LQFP48,
# 96 MHz max), Table 2-1-1 (LQFP48 pin definitions: PA0..PA15, PB0..PB15,
# PC13..PC15, PD0..PD1) and Figure 1-2 (memory address map).
#
# Register layouts: WCH CH32L103 Reference Manual V2.2, Table 3-1 (RCC
# registers at 0x40021000, STM32F1 offsets), Table 10-23 (GPIO A..D at
# 0x40010800..0x40011400 with CFGLR, CFGHR, INDR, OUTDR, BSHR, BCR, LCKR;
# reset 0x44444444) and Table 17-2 (USART1 at 0x40013800; USART2 at
# 0x40004400). The GPIO has the CFGHR word, so this part runs the `stm32f1`
# GPIO profile, not `wch`. HSI is 8 MHz (DS page 1), the same as the STM32F1,
# so the default F1 RCC model serves it. Default USART1 TX is PA9 (DS Table
# 2-1-1), the STM32F1 pad, so no UART `pad_map` is needed.
#
# KNOWN LIMITATIONS, STATED PLAINLY:
#   - The F1 RCC model decodes PLLMUL with the STM32F1 table. The L103 maps
#     PLLMUL=0b1111 to x18, not x16 (RM Table 3-1, CFGR0 bits 21:18).
#     Reset (HSI 8 MHz) is exact.
#   - No PFIC, SysTick (64-bit), timers, LPTIM, ADC, OPA, CMP, I2C, SPI,
#     CAN FD, USB or USB PD. USART TX is polled only; no `irq` is wired
#     because no interrupt controller exists.
#   - Low-power modes and the 2 KB / 18 KB SRAM retention split (RM PWR
#     chapter) are not modelled; SRAM is one 20 KB block.
#
# Buyability screen (2026-11-15): LCSC lists CH32L103C8T6 "In Stock"
# (1+ USD 0.7819). WCH's product page has no lifecycle field; this
# descriptor is not a lifecycle claim and is not included in the Proteus
# parity gate.
# Sources:
#   https://www.wch-ic.com/download/file?id=386  (CH32L103 Datasheet V2.1)
#   https://www.wch-ic.com/download/file?id=387  (CH32L103 Reference Manual V2.2)
#   https://www.lcsc.com/search?q=CH32L103C8T6

name: "ch32l103c8t6"
arch: "riscv"
core: "rv32imac"
cpu_hz: 96_000_000

# Code flash at 0x08000000 is aliased at address 0 for reset fetch (BOOT0=0).
flash:
  base: 0x08000000
  size: "64KB"
ram:
  base: 0x20000000
  size: "20KB"
flash_boot_alias: true

package: "LQFP48"
pin_count: 48
gpio_pin_count: 37
pins:
  PA0: { gpio: "gpioa", bit: 0 }
  PA1: { gpio: "gpioa", bit: 1 }
  PA2: { gpio: "gpioa", bit: 2 }
  PA3: { gpio: "gpioa", bit: 3 }
  PA4: { gpio: "gpioa", bit: 4 }
  PA5: { gpio: "gpioa", bit: 5 }
  PA6: { gpio: "gpioa", bit: 6 }
  PA7: { gpio: "gpioa", bit: 7 }
  PA8: { gpio: "gpioa", bit: 8 }
  PA9: { gpio: "gpioa", bit: 9 }
  PA10: { gpio: "gpioa", bit: 10 }
  PA11: { gpio: "gpioa", bit: 11 }
  PA12: { gpio: "gpioa", bit: 12 }
  PA13: { gpio: "gpioa", bit: 13 }
  PA14: { gpio: "gpioa", bit: 14 }
  PA15: { gpio: "gpioa", bit: 15 }
  PB0: { gpio: "gpiob", bit: 0 }
  PB1: { gpio: "gpiob", bit: 1 }
  PB2: { gpio: "gpiob", bit: 2 }
  PB3: { gpio: "gpiob", bit: 3 }
  PB4: { gpio: "gpiob", bit: 4 }
  PB5: { gpio: "gpiob", bit: 5 }
  PB6: { gpio: "gpiob", bit: 6 }
  PB7: { gpio: "gpiob", bit: 7 }
  PB8: { gpio: "gpiob", bit: 8 }
  PB9: { gpio: "gpiob", bit: 9 }
  PB10: { gpio: "gpiob", bit: 10 }
  PB11: { gpio: "gpiob", bit: 11 }
  PB12: { gpio: "gpiob", bit: 12 }
  PB13: { gpio: "gpiob", bit: 13 }
  PB14: { gpio: "gpiob", bit: 14 }
  PB15: { gpio: "gpiob", bit: 15 }
  PC13: { gpio: "gpioc", bit: 13 }
  PC14: { gpio: "gpioc", bit: 14 }
  PC15: { gpio: "gpioc", bit: 15 }
  PD0: { gpio: "gpiod", bit: 0 }
  PD1: { gpio: "gpiod", bit: 1 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      profile: "stm32f1"

  # RCC_APB2PCENR IOPAEN..IOPDEN = bits 2..5 (RM 3.4.7, RCC_PB2PCENR).
  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010800
    size: "1KB"
    clock: { reg: "apb2enr", bit: 2 }
    config:
      profile: "stm32f1"

  - id: "gpiob"
    type: "gpio"
    base_address: 0x40010C00
    size: "1KB"
    clock: { reg: "apb2enr", bit: 3 }
    config:
      profile: "stm32f1"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 4 }
    config:
      profile: "stm32f1"

  - id: "gpiod"
    type: "gpio"
    base_address: 0x40011400
    size: "1KB"
    clock: { reg: "apb2enr", bit: 5 }
    config:
      profile: "stm32f1"

  # USART_TypeDef (STATR, DATAR, BRR, CTLR1..3, GPR) is the STM32F1 USART
  # layout, so the default UART model serves it. USART1EN = APB2PCENR bit 14;
  # USART2EN = APB1PCENR bit 17.
  - id: "usart1"
    type: "uart"
    base_address: 0x40013800
    size: "1KB"
    clock: { reg: "apb2enr", bit: 14 }

  - id: "usart2"
    type: "uart"
    base_address: 0x40004400
    size: "1KB"
    clock: { reg: "apb1enr", bit: 17 }
