# Narrow CH32V003F4P6 profile for the WCH-CH32V003EVT PD0 GPIO smoke.
# The GPIO model reuses the STM32F1 GPIO logic because WCH's CFGLR/BSHR
# register offsets and set/reset semantics match that subset. RCC config uses
# the explicit ch32v003 alias only to resolve APB2PCENR at offset 0x18. Neither
# alias models the WCH clock tree or claims other CH32 peripherals.
name: ch32v003f4p6-gpio-smoke
arch: riscv
core: rv32ec
registers_count: 16
# The smoke stays on reset HSI (24 MHz); it does not configure the PLL.
cpu_hz: 24_000_000

flash:
  base: 0x08000000
  size: 16KB
ram:
  base: 0x20000000
  size: 2KB

pins:
  PD0: { gpio: gpiod, bit: 0 }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40021000
    # Ends after APB2PCENR@0x18; APB1PCENR and later registers are not exposed.
    size: 28B
    config:
      profile: ch32v003

  - id: gpiod
    type: gpio
    base_address: 0x40011400
    size: 1KB
    clock: { reg: apb2enr, bit: 5 }
    config:
      profile: ch32v003
