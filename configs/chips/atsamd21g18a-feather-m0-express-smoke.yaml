# Focused ATSAMD21G18A profile for the Adafruit Feather M0 Express D13 LED.
# This smoke exposes only PM.APBBMASK and PORT group A. USB, SERCOM, external
# SPI flash, NeoPixel, analog blocks, timers, and the charger are out of scope.
# Sources: Microchip DS40001882 and Adafruit's Feather M0 Express pinout.

name: "atsamd21g18a-feather-m0-express-smoke"
arch: "arm"
core: "cortex-m0+"
# Reset GCLK_MAIN is OSC8M divided by eight; this firmware leaves clocks alone.
cpu_hz: 1_000_000

flash:
  base: 0x00000000
  size: "256KB"
ram:
  base: 0x20000000
  size: "32KB"

pins:
  # Feather Arduino D13 / red LED is PA17 per Adafruit's board pinout.
  PA17: { gpio: "gpio_a", bit: 17, functions: [{ type: gpio, peripheral: "gpio_a" }] }

peripherals:
  - id: "pm"
    type: "sam_pm"
    base_address: 0x40000400
    size: "128B"

  - id: "gpio_a"
    type: "gpio"
    base_address: 0x41004400
    size: "128B"
    config:
      profile: "sam"
      num_pins: 32
    # PM.APBBMASK.PORT_ (DS40001882 §16.8.4, bit 3).
    clock: { controller: "pm", reg: "APBBMASK", bit: 3 }
