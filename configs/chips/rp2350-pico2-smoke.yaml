# Narrow RP2350 profile for the Raspberry Pi Pico 2 smoke.
# This deliberately declares only the blocks used by the working smoke; the
# full chip profile is configs/chips/rp2350.yaml and still contains explicit
# POWMAN/TBMAN stubs and broader unverified peripheral coverage.
name: "rp2350-pico2-smoke"
arch: "arm"
core: "cortex-m33"
cpu_hz: 150_000_000
reset_vector_offset: 0x0

# Pico 2 brings the RP2350A's external ADC pads to the headers. GP29 is tied
# into the board's VSYS monitor, so only the three general-purpose inputs are
# exposed as user analog pins here.
analog_pins:
  GP26: { peripheral: "adc", channel: 0 }
  GP27: { peripheral: "adc", channel: 1 }
  GP28: { peripheral: "adc", channel: 2 }

flash:
  base: 0x10000000
  size: "2048KB"
ram:
  base: 0x20000000
  size: "520KB"

peripherals:
  - id: "uart0"
    type: "uart"
    base_address: 0x40070000
    size: "1KB"
    config:
      profile: "pl011"

  - id: "io_bank0"
    type: "rp2040_io_bank0"
    base_address: 0x40028000
    size: "4KB"

  # PIO0 supports the basic instruction set used by the Pico 2 board smoke:
  # set GP25 direction/value, then jump to repeat the LED waveform.
  - id: "pio0"
    type: "pio"
    base_address: 0x50200000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/pio0.yaml"

  - id: "sio"
    type: "rp2040_sio"
    base_address: 0xD0000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/sio.yaml"

  # RP2350 ADC is on its own address map; the shared model has the same
  # 12-bit conversion interface and maps external inputs 0..3 to GP26..29.
  - id: "adc"
    type: "rp2040_adc"
    base_address: 0x400A0000
    size: "4KB"
    irq: 35
    config:
      debug_schema: "../peripherals/rp2350/adc.yaml"
