# Narrow RP2350 profile for the Seeed Studio XIAO RP2350.
# Only IO_BANK0 pad mux and SIO GPIO are declared for the built-in USER LED.
# USB, UART, PIO/RGB LED, battery sensing, and other board features are out of
# scope for this smoke and are not claimed by this system profile.
name: "rp2350-xiao-smoke"
arch: "arm"
core: "cortex-m33"
registers_count: 240
cpu_hz: 150_000_000

flash:
  base: 0x10000000
  size: "2048KB"
ram:
  base: 0x20000000
  size: "520KB"

reset_vector_offset: 0x0
pins:
  GP25: { gpio: "sio", bit: 25 }

peripherals:
  - id: "io_bank0"
    type: "rp2040_io_bank0"
    base_address: 0x40028000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/io_bank0.yaml"
  - id: "sio"
    type: "rp2040_sio"
    base_address: 0xD0000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/sio.yaml"
