# Narrow NUCLEO-F103RB onboarding profile.
#
# This keeps the exact STM32F103RBT6 geometry but declares only the paths used
# by the board smoke: RCC, GPIOA/LD2, GPIOC/B1, and USART2/VCP. The full
# stm32f103rb.yaml profile retains the wider family map; its USB and backup
# register windows are zero-answering stubs and are intentionally absent here.
#
# Sources:
# - ST DS5319: https://www.st.com/resource/en/datasheet/stm32f103rb.pdf
# - ST UM1724: https://www.st.com/resource/en/user_manual/um1724-stm32-nucleo64-boards-mb1136-stmicroelectronics.pdf

name: "stm32f103rb-nucleo-smoke"
arch: "arm"
core: "cortex-m3"
registers_count: 125
# The smoke leaves the MCU on its reset HSI clock (8 MHz).
cpu_hz: 8_000_000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.35
  vih: 0.65

package: "LQFP64"
pin_count: 64
gpio_pin_count: 51
variant: "xB"
orderable_suffixes: ["T6", "T6TR", "T7", "T7TR"]

flash:
  base: 0x08000000
  size: "128KB"
ram:
  base: 0x20000000
  size: "20KB"

# Only board connections exercised or mapped by this profile.
pins:
  PA2: { gpio: "gpioa", bit: 2 }
  PA3: { gpio: "gpioa", bit: 3 }
  PA5: { gpio: "gpioa", bit: 5 }
  PC13: { gpio: "gpioc", bit: 13 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f103/rcc.yaml"

  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010800
    size: "1KB"
    clock: { reg: "apb2enr", bit: 2 }
    config:
      debug_schema: "../peripherals/stm32f103/gpioa.yaml"
      profile: "stm32f1"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 4 }
    config:
      debug_schema: "../peripherals/stm32f103/gpioc.yaml"
      profile: "stm32f1"

  - id: "uart2"
    type: "uart"
    base_address: 0x40004400
    size: "1KB"
    irq: 38
    clock: { reg: "apb1enr", bit: 17 }
    config:
      debug_schema: "../peripherals/stm32f103/usart2.yaml"
