#
# dsPIC33FJ32MC202 (DS70283H). M0: boot + UART1 TX. M1: 28-pin GPIO package.
# M2: shared T1/PWM1/QEI1 validated on the 202 package pins (RB14/RB15 PWM,
# RB0-RB2 QEI); AN0-AN5 and ADC/SPI/I2C remain for the next milestone.
# The 202 is the 28-pin
# sibling of the onboarded dsPIC33FJ32MC204 and shares its PIC24/dsPIC33F
# core, 32 KB flash, 2 KB SRAM, UART1/SPI1/I2C1/ADC1/Timers/PWM/QEI register
# map and instruction set. Differences that matter later: the package exposes
# AN0-AN5 only (no AN6-AN8), and the PWM/QEI/port pin set is smaller; those
# package-level differences are not modelled in M0.
# - flash 32 KB, data SRAM 2 KB at 0x0800 (X 0x0800-0x0BFF, Y 0x0C00-0x0FFF)
# - UART1 SFRs: U1MODE 0x0220, U1STA 0x0222, U1TXREG 0x0224
# - CPU clock: part rated to 40 MIPS; boards override via the system manifest.
#
# UART/timers/GPIO/PWM/QEI/ADC/SPI/I2C are CPU-internal; M1 declares the
# three bus-side GPIO pad models with the 28-pin masks (RA0-RA4, RB0-RB15,
# no PORTC).
name: dspic33fj32mc202
arch: pic24
core: dspic33f
cpu_hz: 40000000
flash:
  base: 0x000000
  size: "32KB"
ram:
  base: 0x000800
  size: "2KB"
# M1: 28-pin package pads (DS70283H 28-pin pin diagrams): RA0-RA4,
# RB0-RB15, no PORTC. The masks are the package truth; the CPU derives its
# TRIS/LAT/ODC masks from these entries (44-pin defaults when absent).
peripherals:
  - id: "gpioa"
    type: "pic24_gpio"
    base_address: 0x000102C0
    size: "12"
    config: { port: "a", mask: 0x001F }
  - id: "gpiob"
    type: "pic24_gpio"
    base_address: 0x000102D0
    size: "12"
    config: { port: "b", mask: 0xFFFF }
  - id: "gpioc"
    type: "pic24_gpio"
    base_address: 0x000102E0
    size: "12"
    config: { port: "c", mask: 0x0000 }
