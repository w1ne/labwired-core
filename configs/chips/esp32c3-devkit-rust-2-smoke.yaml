# Narrow ESP32-C3 profile for Espressif's DevKit-RUST-2 RGB LED smoke.
# Focused ESP32-C3-DevKit-RUST-2 slice: GPIO2 WS2812B plus the onboard SHTC3
# temperature/humidity sensor on I2C0 (SDA GPIO10, SCL GPIO8).
name: "esp32c3-devkit-rust-2-smoke"
arch: "riscv"
core: "rv32imc"
registers_count: 31
cpu_hz: 160_000_000

flash:
  base: 0x42000000
  size: "4096KB"
ram:
  base: 0x3FC80000
  size: "400KB"

pins:
  GPIO2: { gpio: "gpio", bit: 2 }
  GPIO8: { gpio: "gpio", bit: 8, functions: [{ type: i2c, peripheral: "i2c0", role: scl }] }
  GPIO10: { gpio: "gpio", bit: 10, functions: [{ type: i2c, peripheral: "i2c0", role: sda }] }

peripherals:
  - id: "uart0"
    type: "esp32c3_uart"
    irq: 21
    base_address: 0x60000000
    size: "512B"
    config:
      echo_stdout: true
      debug_schema: "../peripherals/esp32c3/uart0.yaml"

  - id: "gpio"
    type: "esp32c3_gpio"
    base_address: 0x60004000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32c3/gpio.yaml"

  - id: "io_mux"
    type: "esp32c3_io_mux"
    base_address: 0x60009000
    config:
      debug_schema: "../peripherals/esp32c3/io_mux.yaml"
      path: "../peripherals/esp32c3/io_mux.yaml"

  - id: "i2c0"
    type: "esp32c3_i2c"
    base_address: 0x60013000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32c3/i2c0.yaml"
