# Minimal chip metadata for the ESP32-S3-DevKitC-1-N16R8 UART0 smoke.
# The Xtensa S3 builder installs peripherals in code; this descriptor exposes
# the UART0 and GPIO blocks needed to document the board's J3 TX/RX pin map.
# No zero-answering placeholder windows are included.
name: "esp32s3-devkitc-1-n16r8-smoke"
arch: "xtensa-lx7"
cpu_hz: 240_000_000

flash:
  base: 0x42000000
  size: "16384KB"
ram:
  base: 0x3FC88000
  size: "512KB"

pins:
  GPIO43: { gpio: "gpio", bit: 43, functions: [{ type: uart, peripheral: uart0, role: tx }] }
  GPIO44: { gpio: "gpio", bit: 44, functions: [{ type: uart, peripheral: uart0, role: rx }] }

peripherals:
  - id: "gpio"
    type: "esp32s3_gpio"
    base_address: 0x60004000
    size: "2KB"

  - id: "uart0"
    type: "uart"
    base_address: 0x60000000
    size: "512B"
    config:
      debug_schema: "../peripherals/esp32s3/uart0.yaml"
