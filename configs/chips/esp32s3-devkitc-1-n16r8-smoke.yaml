# Minimal chip metadata for the ESP32-S3-DevKitC-1-N16R8 v1.1 board smoke.
# The Xtensa S3 builder installs peripherals in code; this descriptor exposes
# UART0, GPIO, I2C0/I2C1, and RMT for the board's UART pins, I2C sensor smokes,
# and GPIO38-addressable LED.
# The descriptor adds no placeholders; the Xtensa runtime also has fallback
# MMIO windows for unrelated S3 blocks that this smoke does not exercise.
name: "esp32s3-devkitc-1-n16r8-smoke"
arch: "xtensa-lx7"
cpu_hz: 240_000_000

flash:
  base: 0x42000000
  size: "16384KB"
ram:
  base: 0x3FC88000
  size: "512KB"

pins:
  # J1 pin 4: GPIO4 / ADC1_CH3 on the v1.1 DevKitC-1.
  GPIO4: { gpio: "gpio", bit: 4, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO8: { gpio: "gpio", bit: 8, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO9: { gpio: "gpio", bit: 9, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO41: { gpio: "gpio", bit: 41, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO42: { gpio: "gpio", bit: 42, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO38: { gpio: "gpio", bit: 38, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO43: { gpio: "gpio", bit: 43, functions: [{ type: uart, peripheral: uart0, role: tx }] }
  GPIO44: { gpio: "gpio", bit: 44, functions: [{ type: uart, peripheral: uart0, role: rx }] }

peripherals:
  - id: "gpio"
    type: "esp32s3_gpio"
    base_address: 0x60004000
    size: "2KB"

  - id: "uart0"
    type: "uart"
    base_address: 0x60000000
    size: "512B"
    config:
      debug_schema: "../peripherals/esp32s3/uart0.yaml"

  - id: "i2c0"
    type: "i2c"
    base_address: 0x60013000
    size: "4KB"
    irq: 42
    config:
      debug_schema: "../peripherals/esp32s3/i2c0.yaml"

  # The S3's second external I2C controller. The S3 runtime installs the
  # register-level model at this address; board smokes route it through GPIO
  # matrix signals 91/92 (I2CEXT1 SCL/SDA).
  - id: "i2c1"
    type: "i2c"
    base_address: 0x60027000
    size: "4KB"
    irq: 43

  - id: "rmt"
    type: "esp32s3_rmt"
    base_address: 0x60016000
    size: "4KB"
    irq: 40
    config:
      cpu_clock_hz: 240000000
      debug_schema: "../peripherals/esp32s3/rmt.yaml"
