# SIM-DERIVED SAMD21G18A descriptor for Arduino Nano 33 IoT bring-up.
# Not silicon-verified. NINA (WiFi), ATECC608A, and IMU (LSM6DS3) are
# intentionally omitted / stubbed — the MCU core, PORT, PM/GCLK, SERCOM5 UART
# (Serial1), SysTick, the external-input ADC slice, and a USB stub window are
# modelled here.
# Pin labels follow ArduinoCore-samd variants/nano_33_iot/variant.cpp.

name: "atsamd21"
arch: "arm"
core: "cortex-m0+"
# 48 MHz — DFLL48M, same as the Arduino Zero `atsamd21g18a.yaml` descriptor.
cpu_hz: 48_000_000
flash:
  base: 0x00000000
  size: "256KB"
ram:
  base: 0x20000000
  size: "32KB"
pins:
  # D0 / RX — variant.cpp: PORTB 23 (SERCOM5/PAD[3]).
  PB23: { gpio: portb, bit: 23, functions: [{ type: uart, peripheral: sercom5, role: rx }] }
  # D1 / TX — variant.cpp: PORTB 22 (SERCOM5/PAD[2]).
  PB22: { gpio: portb, bit: 22, functions: [{ type: uart, peripheral: sercom5, role: tx }] }
  # D13 / LED — variant.cpp: PORTA 17.
  PA17: { gpio: porta, bit: 17, functions: [{ type: gpio, peripheral: porta }] }
peripherals:
  - id: "pm"
    type: "sam_pm"
    base_address: 0x40000400
    size: "256B"
  - id: "gclk"
    type: "sam_gclk"
    base_address: 0x40000C00
    size: "256B"
  - id: "porta"
    type: "gpio"
    base_address: 0x41004400
    size: "128B"
    config:
      profile: "sam_port"
  - id: "portb"
    type: "gpio"
    base_address: 0x41004480
    size: "128B"
    config:
      profile: "sam_port"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
  # Serial1 — SERCOM5 on PB22/PB23 (variant.cpp Uart Serial1(&sercom5, ...)).
  - id: "sercom5"
    type: "uart"
    base_address: 0x42001C00
    size: "256B"
    irq: 14
    clock:
      controller: "pm"
      reg: "APBCMASK"
      bit: 7
    config:
      profile: "sercom"
      gclk_id: 25
  - id: "usb"
    type: "stub"
    base_address: 0x41005000
    size: "1KB"
  # External AIN0..AIN19, software-triggered single-ended conversions.
  - id: "adc"
    type: "samd21_adc"
    base_address: 0x42004000
    size: "128B"
    irq: 23

# Physical SAM D21 function-B pad routes. These names identify MCU pads; the
# board-level analog co-simulation endpoints intentionally use the same pads.
analog_pins:
  PA02: { peripheral: "adc", channel: 0 }
  PA03: { peripheral: "adc", channel: 1 }
  PB08: { peripheral: "adc", channel: 2 }
  PB09: { peripheral: "adc", channel: 3 }
  PA04: { peripheral: "adc", channel: 4 }
  PA05: { peripheral: "adc", channel: 5 }
  PA06: { peripheral: "adc", channel: 6 }
  PA07: { peripheral: "adc", channel: 7 }
  PB00: { peripheral: "adc", channel: 8 }
  PB01: { peripheral: "adc", channel: 9 }
  PB02: { peripheral: "adc", channel: 10 }
  PB03: { peripheral: "adc", channel: 11 }
  PB04: { peripheral: "adc", channel: 12 }
  PB05: { peripheral: "adc", channel: 13 }
  PB06: { peripheral: "adc", channel: 14 }
  PB07: { peripheral: "adc", channel: 15 }
  PA08: { peripheral: "adc", channel: 16 }
  PA09: { peripheral: "adc", channel: 17 }
  PA10: { peripheral: "adc", channel: 18 }
  PA11: { peripheral: "adc", channel: 19 }
