# Narrow NUCLEO-F103RB + BME280 profile.
#
# Covers only the board paths exercised by this smoke: USART2 through the
# ST-LINK VCP, LD2 on PA5, and I2C1 remapped to the Arduino D15/D14 pins
# PB8/PB9. The wider STM32F103RB descriptor remains available separately.
#
# Sources: ST DS5319 (STM32F103RB geometry), RM0008 (register map and I2C1
# remap), and UM1724 Table 14 (NUCLEO-F103RB Arduino pin mapping).

name: "stm32f103rb-nucleo-bme280-smoke"
arch: "arm"
core: "cortex-m3"
registers_count: 125
# Smoke firmware runs from the reset HSI clock (8 MHz).
cpu_hz: 8_000_000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.35
  vih: 0.65

package: "LQFP64"
pin_count: 64
gpio_pin_count: 51
variant: "xB"
orderable_suffixes: ["T6", "T6TR", "T7", "T7TR"]

flash:
  base: 0x08000000
  size: "128KB"
ram:
  base: 0x20000000
  size: "20KB"

pins:
  PA2: { gpio: "gpioa", bit: 2 }
  PA3: { gpio: "gpioa", bit: 3 }
  PA5: { gpio: "gpioa", bit: 5 }
  PB8: { gpio: "gpiob", bit: 8, functions: [{ type: i2c, peripheral: i2c1, role: scl }] }
  PB9: { gpio: "gpiob", bit: 9, functions: [{ type: i2c, peripheral: i2c1, role: sda }] }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f103/rcc.yaml"

  - id: "afio"
    type: "afio"
    base_address: 0x40010000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 0 }
    config:
      debug_schema: "../peripherals/stm32f103/afio.yaml"

  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010800
    size: "1KB"
    clock: { reg: "apb2enr", bit: 2 }
    config:
      debug_schema: "../peripherals/stm32f103/gpioa.yaml"
      profile: "stm32f1"

  - id: "gpiob"
    type: "gpio"
    base_address: 0x40010C00
    size: "1KB"
    clock: { reg: "apb2enr", bit: 3 }
    config:
      debug_schema: "../peripherals/stm32f103/gpiob.yaml"
      profile: "stm32f1"

  - id: "uart2"
    type: "uart"
    base_address: 0x40004400
    size: "1KB"
    irq: 38
    clock: { reg: "apb1enr", bit: 17 }
    config:
      debug_schema: "../peripherals/stm32f103/usart2.yaml"

  - id: "i2c1"
    type: "i2c"
    base_address: 0x40005400
    size: "1KB"
    irq: 31
    irq_error: 32
    clock: { reg: "apb1enr", bit: 21 }
    config:
      debug_schema: "../peripherals/stm32f103/i2c1.yaml"
