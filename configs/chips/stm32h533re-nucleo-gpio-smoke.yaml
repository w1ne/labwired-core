# Focused STM32H533RET6 profile for NUCLEO-H533RE LD2 and I2C1 sensor smokes.
# Only the memory and peripherals needed by these tests are exposed. SRAM1 is
# modeled; SRAM2, SRAM3, backup SRAM, TrustZone attribution, and other H533
# peripherals are outside this profile.
#
# Sources:
# - ST DS14539, STM32H533xx: Cortex-M33, 512 KiB Flash, 272 KiB SRAM, 250 MHz max.
# - ST RM0481 Rev 2: H533 RCC/GPIO address aliases and register layout.
# - ST UM3121 Rev 6: NUCLEO-H533RE shares the MB1814 H5 Nucleo-64 wiring; LD2 is
#   active-high on PA5.
name: "stm32h533ret6-nucleo-gpio-smoke"
arch: "arm"
core: "cortex-m33"
registers_count: 220
# The smoke leaves the reset HSI64 clock in place.
cpu_hz: 64_000_000

flash:
  base: 0x08000000
  size: "512KiB"
ram:
  # SRAM1 only. The physical H533RET6 also has SRAM2/SRAM3 and backup SRAM;
  # those banks are not represented by this focused GPIO profile.
  base: 0x20000000
  size: "128KiB"

pins:
  PA5: { gpio: "gpioa", bit: 5, functions: [{ type: gpio, peripheral: gpioa }] }
  PB6: { gpio: "gpiob", bit: 6, functions: [{ type: i2c, peripheral: i2c1, role: scl }] }
  PB7: { gpio: "gpiob", bit: 7, functions: [{ type: i2c, peripheral: i2c1, role: sda }] }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x44020C00
    size: "1KB"
    config:
      profile: "h5"

  - id: "gpioa"
    type: "gpio"
    base_address: 0x42020000
    size: "1KB"
    config:
      profile: "stm32v2"
    clock: { reg: "ahb2enr", bit: 0 }

  - id: "gpiob"
    type: "gpio"
    base_address: 0x42020400
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32h563/gpiob.yaml"
      profile: "stm32v2"
    clock: { reg: "ahb2enr", bit: 1 }

  - id: "i2c1"
    type: "i2c"
    base_address: 0x40005400
    size: "1KB"
    irq: 51
    config:
      debug_schema: "../peripherals/stm32h563/i2c1.yaml"
      profile: "h5"
    clock: { reg: "apb1lenr", bit: 21 }

  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: "16B"
