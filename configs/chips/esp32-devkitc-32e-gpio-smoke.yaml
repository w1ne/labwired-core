# Narrow ESP32-DevKitC-32E onboarding profile.
#
# The profiles exercise classic ESP32 GPIO23, UART0 console output, remapped
# UART1 TX on GPIO16, I2C0 with an external BME280, ADC1 channel 0 on GPIO36,
# DAC1/2 on GPIO25/26, LEDC PWM on GPIO23, and VSPI (SPI3) to an external OLED.
# UART RX, the USB-to-UART bridge, Wi-Fi/Bluetooth, general timers, and the 5 V
# power LED are outside this profile.
name: "esp32-devkitc-32e-gpio-smoke"
arch: "xtensa-lx6"
cpu_hz: 240000000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.25
  vih: 0.75

flash:
  base: 0x400D0000
  size: "4MiB"
ram:
  base: 0x3FFB0000
  size: "192KiB"

pins:
  # J3 pin 2 / GPIO23. LEDC HS0 and VSPI MOSI reach this pad through the
  # ESP32 output matrix when firmware selects those functions.
  GPIO23: { gpio: "gpio", bit: 23, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO21: { gpio: "gpio", bit: 21 }
  # Stock VSPI wiring on DevKitC V4: CLK=GPIO18, MISO=GPIO19, MOSI=GPIO23,
  # CS=GPIO5. The SPI OLED smoke uses DC=GPIO17.
  GPIO5: { gpio: "gpio", bit: 5 }
  GPIO17: { gpio: "gpio", bit: 17 }
  GPIO18: { gpio: "gpio", bit: 18 }
  GPIO19: { gpio: "gpio", bit: 19 }
  # J3 pin 12. GPIO16 is available on this WROOM board and does not collide
  # with the I2C BME280 smoke on GPIO21/GPIO22.
  GPIO16:
    gpio: "gpio"
    bit: 16
    functions: [{ type: uart, peripheral: "uart1", role: tx }]
  # J2 pin 3 / VP, SENSOR_VP, ADC1_CH0.
  GPIO36: { gpio: "gpio", bit: 36 }
  # J2 pins 9/10: GPIO25/DAC1 and GPIO26/DAC2. The analog outputs live in
  # PAD_DAC1/2 of RTC_IO, not on the digital GPIO matrix.
  GPIO25:
    gpio: "gpio"
    bit: 25
    functions:
      - { type: gpio, peripheral: gpio }
      - { type: dac, peripheral: rtcio, role: dac1 }
  GPIO26:
    gpio: "gpio"
    bit: 26
    functions:
      - { type: gpio, peripheral: gpio }
      - { type: dac, peripheral: rtcio, role: dac2 }

peripherals:
  - id: "uart0"
    type: "uart"
    base_address: 0x3FF40000
    size: "256B"
    config:
      debug_schema: "../peripherals/esp32/uart0.yaml"

  - id: "uart1"
    type: "esp32_uart"
    base_address: 0x3FF50000
    size: "256B"
    irq: 35
    config:
      echo_stdout: false
      debug_schema: "../peripherals/esp32/uart1.yaml"

  - id: "spi3"
    type: "esp32_spi"
    base_address: 0x3FF65000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/spi3.yaml"

  - id: "gpio"
    type: "esp32_gpio"
    base_address: 0x3FF44000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/gpio.yaml"

  - id: "i2c0"
    type: "esp32_i2c"
    base_address: 0x3FF53000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/i2c0.yaml"

  - id: "sens_sar_adc"
    type: "esp32_sar_adc"
    base_address: 0x3FF48800
    size: "256B"
    config:
      debug_schema: "../peripherals/esp32/sens.yaml"

  - id: "rtcio"
    type: "esp32_rtc_io"
    base_address: 0x3FF48400
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/rtc_io.yaml"

  - id: "ledc"
    type: "esp32_ledc"
    base_address: 0x3FF59000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/ledc.yaml"
