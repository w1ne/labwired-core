# Narrow ESP32-DevKitC-32E onboarding profile.
#
# The smoke exercises classic ESP32 GPIO23 and UART0 console output. The
# USB-to-UART bridge and pin-level UART TX/RX signals, Wi-Fi/Bluetooth, timers,
# I2C, SPI, and the 5 V power LED are outside this profile.
name: "esp32-devkitc-32e-gpio-smoke"
arch: "xtensa-lx6"
cpu_hz: 240000000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.25
  vih: 0.75

flash:
  base: 0x400D0000
  size: "4MiB"
ram:
  base: 0x3FFB0000
  size: "192KiB"

pins:
  GPIO23: { gpio: "gpio", bit: 23, functions: [{ type: gpio, peripheral: gpio }] }

peripherals:
  - id: "uart0"
    type: "uart"
    base_address: 0x3FF40000
    size: "256B"
    config:
      debug_schema: "../peripherals/esp32/uart0.yaml"

  - id: "gpio"
    type: "esp32_gpio"
    base_address: 0x3FF44000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/gpio.yaml"
