# Narrow ESP32-DevKitC-32E onboarding profile.
#
# The smoke exercises only the classic ESP32 GPIO controller on GPIO23, which
# Espressif maps to J3 pin 2. UART/USB bridge, Wi-Fi/Bluetooth, timers, I2C,
# SPI, and the board's 5 V power LED are outside this profile.
name: "esp32-devkitc-32e-gpio-smoke"
arch: "xtensa-lx6"
cpu_hz: 240000000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.25
  vih: 0.75

flash:
  base: 0x400D0000
  size: "4MiB"
ram:
  base: 0x3FFB0000
  size: "192KiB"

pins:
  GPIO23: { gpio: "gpio", bit: 23, functions: [{ type: gpio, peripheral: gpio }] }

peripherals:
  - id: "gpio"
    type: "esp32_gpio"
    base_address: 0x3FF44000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/gpio.yaml"
