# Narrow ESP32-DevKitC-32E onboarding profile.
#
# The profiles exercise classic ESP32 GPIO23, UART0 console output, I2C0 with
# an external BME280, ADC1 channel 0 on GPIO36, and LEDC PWM on GPIO23. The
# USB-to-UART bridge and pin-level UART TX/RX signals, Wi-Fi/Bluetooth, general
# timers, SPI, and the 5 V power LED are outside this profile.
name: "esp32-devkitc-32e-gpio-smoke"
arch: "xtensa-lx6"
cpu_hz: 240000000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.25
  vih: 0.75

flash:
  base: 0x400D0000
  size: "4MiB"
ram:
  base: 0x3FFB0000
  size: "192KiB"

pins:
  # J3 pin 2 / GPIO23. LEDC HS0 reaches this pad through the ESP32 output
  # matrix when firmware calls ledcAttachPin/ledcAttach.
  GPIO23: { gpio: "gpio", bit: 23, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO21: { gpio: "gpio", bit: 21 }
  GPIO22: { gpio: "gpio", bit: 22 }
  # J2 pin 3 / VP, SENSOR_VP, ADC1_CH0.
  GPIO36: { gpio: "gpio", bit: 36 }

peripherals:
  - id: "uart0"
    type: "uart"
    base_address: 0x3FF40000
    size: "256B"
    config:
      debug_schema: "../peripherals/esp32/uart0.yaml"

  - id: "gpio"
    type: "esp32_gpio"
    base_address: 0x3FF44000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/gpio.yaml"

  - id: "i2c0"
    type: "esp32_i2c"
    base_address: 0x3FF53000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/i2c0.yaml"

  - id: "sens_sar_adc"
    type: "esp32_sar_adc"
    base_address: 0x3FF48800
    size: "256B"
    config:
      debug_schema: "../peripherals/esp32/sens.yaml"

  - id: "ledc"
    type: "esp32_ledc"
    base_address: 0x3FF59000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/ledc.yaml"
