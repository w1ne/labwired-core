# Bounded imported Vybrid Cortex-M4 profile. Renode maps the M4's 512 KiB
# OCRAM at 0x3F000000; the Cortex-A5, aliases, boot ROM, DDR and peripherals
# are omitted. Firmware is loaded directly into OCRAM.
name: vybrid
arch: arm
core: cortex-m4
flash: { base: 0, size: 0 }
ram: { base: 0x3F000000, size: 512KiB }
flash_boot_alias: false
peripherals: []
