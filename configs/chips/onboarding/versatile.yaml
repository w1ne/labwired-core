# Imported Renode target `versatile` (Arm Versatile/PB, ARM926EJ-S), narrowed
# to what the engine executes and the UART smoke exercises: one ARM926EJ-S on
# the native ARM926 model, a 64 KiB aperture at the SDRAM base 0x00000000, and
# UART0 (PL011, polled TX) at 0x101F1000. The aperture is a simulator limit,
# not the SDRAM size. The VIC/SIC, SP804 timers, system controller, UART1,
# CLCD, SMC91x Ethernet, KMI, PCI/USB and flash are not modeled here and are
# intentionally omitted. ARM926 Thumb execution is refused by the adapter.
name: versatile
arch: arm
core: arm926ej-s
flash: { base: 0, size: 0 }
ram:
  base: 0x00000000
  size: 64KB
flash_boot_alias: false
peripherals:
- id: uart0
  type: pl011
  bus: sysbus
  base_address: 0x101F1000
  size: 4096
