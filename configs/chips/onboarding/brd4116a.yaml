# Narrow smoke profile for the imported BRD4116A / EFR32xG26 system. The
# current Renode board description uses the xG26 Cortex-M33, 3,192 KiB flash,
# 512 KiB SRAM, Series-2 CMU, and USART0. Radio and sequencer cores, GPIO board
# wiring, and other peripherals are omitted from this profile.
name: brd4116a
arch: arm
core: cortex-m33
cpu_hz: 39000000
flash:
  base: 0x08000000
  size: 0x31E000
ram:
  base: 0x20000000
  size: 0x80000
peripherals:
  - id: cmu
    type: efr32s2_cmu
    bus: sysbus
    base_address: 0x40008000
    size: 16KB
  - id: usart0
    type: efr32s2_usart
    bus: sysbus
    base_address: 0x400A0000
    size: 16KB
    clock: { reg: clken0, bit: 9 }
    irq: 15
