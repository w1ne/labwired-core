name: litex_vexriscv_tftp
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 16777216
  size: 32768B
# Simulation-only co-simulation endpoint. This imported LiteX TFTP profile
# does not expose a modeled GPIO fabric or ADC; these channels are not physical
# pads or firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: ctrl
  type: litex_soc_controller
  bus: sysbus
  base_address: 2181038080
- id: uart
  type: litex_uart
  bus: sysbus
  base_address: 2181046272
- id: timer0
  type: litex_timer
  bus: sysbus
  base_address: 2181048320
- id: ethphy
  type: ethernetphysicallayer
  bus: ethmac
  base_address: 0
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
