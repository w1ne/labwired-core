# Bounded OpenTitan Earl Grey CW310 profile for a direct RV32IMC smoke. The
# upstream CW310 REPL includes Earl Grey's Ibex core, 1 MiB flash alias at
# 0x20000000, 128 KiB main SRAM at 0x10000000, and UART0. This profile omits
# ROM boot, the flash/SRAM controllers, and all unexercised peripherals; it does
# not claim the Ibex A/B extensions or OpenTitan security functions.
name: opentitan-earlgrey-cw310
arch: riscv
core: rv32imc_zicsr_zifencei
flash:
  base: 0x20000000
  size: 1MiB
ram:
  base: 0x10000000
  size: 128KiB
flash_boot_alias: false
peripherals:
  - id: uart0
    type: opentitan_uart
    base_address: 0x40000000
    size: 4KiB
