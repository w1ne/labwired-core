# Renode's EFM32PG1/PG12 platform keeps its EFMGPIOPort in an included
# .repl the import dropped. Series-1 GPIO_BASE is 0x4000_A000 on both parts
# (efm32pg1b/efm32pg12b CMSIS headers), the base efm32jg1 already declares.
- id: gpioPort
  type: efmgpioport
  bus: sysbus
  base_address: 1073782784
- id: bitband
  type: bitbanding
  bus: sysbus
  base_address: 1107296256
- id: cmuStatusOscillator
  type: pythonperipheral
  bus: sysbus
  base_address: 1074561068
- id: vcmpStatus
  type: pythonperipheral
  bus: sysbus
  base_address: 1073741832
