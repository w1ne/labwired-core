peripherals:
- id: usart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073807360
- id: usart1
  type: efm32_uart
  bus: sysbus
  base_address: 1073808384
- id: usart2
  type: efm32_uart
  bus: sysbus
  base_address: 1073809408
- id: usart3
  type: efm32_uart
  bus: sysbus
  base_address: 1073810432
- id: leUart0
  type: leuart
  bus: sysbus
