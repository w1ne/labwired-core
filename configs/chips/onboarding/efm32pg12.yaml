name: efm32pg12
arch: arm
# Renode efm32xg1x/efm32pg12.repl: cpuType "cortex-m4f".
core: cortex-m4f
# Mapped: the memory map, USART0, the GPIO ports and TIMER0/TIMER1, all
# exercised by the exact-system smoke.
# Flash at 0x0 as in Renode's efm32xg1x/efm32pg12.repl
# (`flash: Memory.MappedMemory @ sysbus 0x00000000`) and the EFM32 Series 1
# memory map.
flash:
  base: 0
  size: 1048576B
ram:
  base: 536870912
  size: 262144B
peripherals:
- id: usart0
  type: efm32_uart
  bus: sysbus
  # USART0 at 0x40010000 (Renode efm32pg12.repl, EFM32PG12 RM); 0x4000C000
  # is I2C0.
  base_address: 0x40010000
# Series-1 GPIO ports A..F. Renode only tags 0x4000A000-0x4000AFFF "GPIO";
# silicon has the ports, so they are modelled here. GPIO_P_TypeDef at a
# 0x30 stride (Gecko SDK efm32pg1b_gpio_p.h: P[6]); DOUTSET/DOUTCLR do not exist on
# Series 1. The block head from 0x4000A400 (EXTI, ROUTE, INSENSE, EM4 wake)
# is NOT mapped: no model behind it.
- id: gpioa
  type: efm32s1_gpioport
  base_address: 0x4000A000
  size: 48B
- id: gpiob
  type: efm32s1_gpioport
  base_address: 0x4000A030
  size: 48B
- id: gpioc
  type: efm32s1_gpioport
  base_address: 0x4000A060
  size: 48B
- id: gpiod
  type: efm32s1_gpioport
  base_address: 0x4000A090
  size: 48B
- id: gpioe
  type: efm32s1_gpioport
  base_address: 0x4000A0C0
  size: 48B
- id: gpiof
  type: efm32s1_gpioport
  base_address: 0x4000A0F0
  size: 48B
# Series-1 TIMER0/TIMER1 (0x40018000/0x40018400).
# Renode efm32xg1x/efm32pg12.repl only tags TIMER0/TIMER1; silicon has them
# (Gecko SDK v4.4.0 EFM32PG12B IRQn_Type: TIMER0 11, TIMER1 19).
# Series-1 layout (efm32pg1b_timer.h): IF/IFS/IFC/IEN at 0x0C..0x18,
# CC0..CC3 at 0x60.
# Counts CPU cycles / 2^PRESC; the CMU HFPERCLKEN0 gate is not modelled.
- id: timer0
  type: efm32s1_timer
  base_address: 0x40018000
  size: 1KB
  irq: 11
- id: timer1
  type: efm32s1_timer
  base_address: 0x40018400
  size: 1KB
  irq: 19
# Series-1 WTIMER0/WTIMER1 (0x4001A000/0x4001A400): the TIMER layout above
# with 32-bit TOP/CNT/CCV (_WTIMER_CNT_MASK 0xFFFFFFFF; TOP resets to 0xFFFF).
# Renode efm32xg1x/efm32pg12.repl only tags WTIMER0/WTIMER1; Gecko SDK v4.4.0
# EFM32PG12B IRQn_Type: WTIMER0 36, WTIMER1 37.
- id: wtimer0
  type: efm32s1_wtimer
  base_address: 0x4001A000
  size: 1KB
  irq: 36
- id: wtimer1
  type: efm32s1_wtimer
  base_address: 0x4001A400
  size: 1KB
  irq: 37
