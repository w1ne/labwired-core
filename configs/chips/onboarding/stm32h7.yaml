# The imported H7 profile claimed external flash and SDRAM as executable
# memory and included many unrelated peripheral models. Renode's stm32h7.repl
# uses a Cortex-M7, 1 MiB code flash, and 128 KiB DTCM. Keep only the model
# backed H7 RCC, GPIOA/B/D, USART3, TIM2, and ADC1 surfaces exercised by this
# smoke. ADC1 tests only the regular single-conversion path on PA0 / INP16;
# ADC2/3, the ADC12 common block, DMA, injected conversions and oversampling
# remain outside this profile.
name: stm32h7
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x58024400
    size: 1KB
    config:
      profile: h7
  - id: gpioPortA
    type: gpio
    base_address: 0x58020000
    size: 1KB
    clock: { reg: ahb4enr, bit: 0 }
    config:
      profile: stm32v2
  - id: gpioPortB
    type: gpio
    base_address: 0x58020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: gpio
    base_address: 0x58020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: usart3
    type: uart
    base_address: 0x40004800
    size: 1KB
    config:
      profile: stm32v2
  # RM0433 (STM32H742/743/753/750): TIM2 is the 32-bit general-purpose timer
  # at 0x40000000 with NVIC position 28, clocked by RCC_APB1LENR.TIM2EN
  # (bit 0, offset 0x0E8). Second source: Renode stm32h7.repl timer2
  # (sysbus 0x40000000, initialLimit 0xffffffff, nvic@28).
  # The smoke covers the gate, 32-bit CNT/ARR, UG, UIF, the update interrupt
  # in up-counting mode, and one-pulse mode (CR1.OPM). Not modelled: CR1.DIR
  # and CMS are stored without effect, and a software UG does not end a
  # one-pulse run. Channels, pads, and the count rate are not exercised.
  - id: tim2
    type: timer
    base_address: 0x40000000
    size: 1KB
    irq: 28
    clock: { reg: apb1lenr, bit: 0 }
    config:
      width: 32
  # RM0433: ADC1/2 share the 0x40022000 page; ADC2 begins at +0x100, so
  # keep the ADC1 window at 256 bytes. RCC_AHB1ENR.ADC12EN (bit 5) gates it.
  - id: adc1
    type: adc
    base_address: 0x40022000
    size: 256B
    irq: 18
    clock: { reg: ahb1enr, bit: 5 }
    config:
      profile: h7
analog_pins:
  # DS12110 maps PA0 to ADC1_INP16 on STM32H742/743/750/753.
  PA0: { peripheral: adc1, channel: 16 }
