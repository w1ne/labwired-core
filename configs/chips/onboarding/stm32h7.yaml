# The imported H7 profile claimed external flash and SDRAM as executable
# memory and included many unrelated peripheral models. Renode's stm32h7.repl
# uses a Cortex-M7, 1 MiB code flash, and 128 KiB DTCM. Keep only the model
# backed H7 RCC, GPIOB/GPIOD, and USART3 surfaces exercised by this smoke.
name: stm32h7
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x58024400
    size: 1KB
    config:
      profile: h7
  - id: gpioPortB
    type: gpio
    base_address: 0x58020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: gpio
    base_address: 0x58020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: usart3
    type: uart
    base_address: 0x40004800
    size: 1KB
    config:
      profile: stm32v2
