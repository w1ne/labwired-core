# LabWired - narrowed Vega RI5CY profile for the imported Renode system.
#
# The generated import labelled this RISC-V target as ARM and listed several
# clock/timer windows that are not modeled. The measured profile keeps only
# the RV32IMC execution surface, boot flash, SRAM, and modeled LPUART0.

name: "vegaboard_ri5cy"
arch: "riscv"
core: "rv32imc"
flash: { base: 0x00000000, size: "1MiB" }
ram: { base: 0x20000000, size: "192KiB" }
peripherals:
  - id: "lpuart0"
    type: "nxp_lpuart"
    base_address: 0x40042000
