ram:
  base: 536870912
  size: 196608B
peripherals:
- id: SCG_CSR
  type: pythonperipheral
  bus: sysbus
  base_address: 1073922064
- id: pcc0
  type: pythonperipheral
  bus: sysbus
  base_address: 1073917952
- id: pcc1
  type: pythonperipheral
  bus: sysbus
  base_address: 1090678784
- id: lpuart0
  type: nxp_lpuart
  bus: sysbus
  base_address: 1074012160
- id: lpuart1
  type: nxp_lpuart
  bus: sysbus
  base_address: 1074016256
- id: lptmr0
  type: lowpower_timer
  bus: sysbus
  base_address: 1073946624
- id: lptmr1
