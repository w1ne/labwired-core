# Bounded Cortex-M3 profile for the imported STM32F103 platform. The memory
# windows match the common F103C8 density; this profile makes no claim about
# the wider STM32F1 family. The declared RCC, GPIOA/GPIOB, USART2, SPI1, I2C1,
# ADC1, DMA1 and core SysTick models are exercised by the exact-import smoke,
# including DMA-drained regular ADC scans, RCC reset/enables/reserved-bit
# masking and the ADC1/GPIOB APB2 gates.
name: stm32f103
arch: arm
core: cortex-m3
flash:
  base: 0x08000000
  size: 65536B
ram:
  base: 0x20000000
  size: 20480B
peripherals:
- id: rcc
  type: rcc
  bus: sysbus
  base_address: 0x40021000
  size: 1KB
  config:
    profile: stm32f1
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x40010800
  size: 1KB
  clock: { reg: apb2enr, bit: 2 }
  config:
    profile: stm32f1
- id: gpioPortB
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x40010C00
  size: 1KB
  clock: { reg: apb2enr, bit: 3 }
  config:
    profile: stm32f1
- id: usart2
  type: uart
  bus: sysbus
  base_address: 0x40004400
  size: 1KB
  # STM32F103 USART2_IRQn, per ST's cmsis-device-f1 header.
  irq: 38
  clock: { reg: apb1enr, bit: 17 }
  config:
    profile: stm32f1
- id: spi1
  type: spi
  bus: sysbus
  base_address: 0x40013000
  size: 1KB
  # STM32F103 SPI1_IRQn, per ST's cmsis-device-f1 header.
  irq: 35
  clock: { reg: apb2enr, bit: 12 }
  config:
    profile: stm32f1
- id: adc1
  type: adc
  bus: sysbus
  base_address: 0x40012400
  size: 1KB
  # STM32F103 ADC1_IRQn, per the STM32F1 CMSIS device header.
  irq: 18
  clock: { reg: apb2enr, bit: 9 }
  config:
    profile: stm32f1
- id: dma1
  type: dma
  bus: sysbus
  base_address: 0x40020000
  size: 1KB
  # RM0008 hard-wires ADC1 to DMA1 channel 1, USART2_RX to channel 6, and
  # USART2_TX to channel 7.
  irq: 11
  config:
    # RM0008 IRQn values for DMA1_Channel1..7. Channel 1 retains IRQ 11;
    # USART2_RX on channel 6 reaches IRQ 16; USART2_TX on channel 7 IRQ 17.
    channel_irqs: [11, 12, 13, 14, 15, 16, 17]
    requests:
      adc1_rx: 1
      usart2_rx: 6
      usart2_tx: 7
- id: i2c1
  type: i2c
  bus: sysbus
  base_address: 0x40005400
  size: 1KB
  clock: { reg: apb1enr, bit: 21 }
  config:
    profile: stm32f1
- id: systick
  type: systick
  base_address: 0xE000E010
  size: 16B
  config:
    # RM0008 §10.1.1: TENMS=9000; the external SysTick source is HCLK/8.
    calib: 0x00002328
    external_clock_divider: 8
analog_pins:
  # STM32F103 medium-density LQFP48: PA0/PA1 are ADC12_IN0/IN1 (DS5319).
  PA0: { peripheral: adc1, channel: 0 }
  PA1: { peripheral: adc1, channel: 1 }
