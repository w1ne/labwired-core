# Bounded Cortex-M3 profile for the imported STM32F103 platform. The memory
# windows match the common F103C8 density; this profile makes no claim about
# the wider STM32F1 family. The declared RCC, GPIOA/GPIOB, USART2, SPI1, I2C1
# and core SysTick models are exercised by the exact-import smoke.
name: stm32f103
arch: arm
core: cortex-m3
flash:
  base: 0x08000000
  size: 65536B
ram:
  base: 0x20000000
  size: 20480B
peripherals:
- id: rcc
  type: rcc
  bus: sysbus
  base_address: 0x40021000
  size: 1KB
  config:
    profile: stm32f1
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x40010800
  size: 1KB
  clock: { reg: apb2enr, bit: 2 }
  config:
    profile: stm32f1
- id: gpioPortB
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x40010C00
  size: 1KB
  clock: { reg: apb2enr, bit: 3 }
  config:
    profile: stm32f1
- id: usart2
  type: uart
  bus: sysbus
  base_address: 0x40004400
  size: 1KB
  # STM32F103 USART2_IRQn, per ST's cmsis-device-f1 header.
  irq: 38
  clock: { reg: apb1enr, bit: 17 }
  config:
    profile: stm32f1
- id: spi1
  type: spi
  bus: sysbus
  base_address: 0x40013000
  size: 1KB
  # STM32F103 SPI1_IRQn, per ST's cmsis-device-f1 header.
  irq: 35
  clock: { reg: apb2enr, bit: 12 }
  config:
    profile: stm32f1
- id: i2c1
  type: i2c
  bus: sysbus
  base_address: 0x40005400
  size: 1KB
  clock: { reg: apb1enr, bit: 21 }
  config:
    profile: stm32f1
- id: systick
  type: systick
  base_address: 0xE000E010
  size: 16B
  config:
    # RM0008 §10.1.1: TENMS=9000; the external SysTick source is HCLK/8.
    calib: 0x00002328
    external_clock_divider: 8
