# Bounded Cortex-M3 profile for the imported STM32F103 platform. The memory
# windows match the common F103C8 density; this profile makes no claim about
# the wider STM32F1 family. Only the RCC, GPIOA and USART2 surfaces exercised
# by the exact-import smoke are declared.
name: stm32f103
arch: arm
core: cortex-m3
flash:
  base: 0x08000000
  size: 65536B
ram:
  base: 0x20000000
  size: 20480B
peripherals:
- id: rcc
  type: rcc
  bus: sysbus
  base_address: 0x40021000
  config:
    profile: stm32f1
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x40010800
  clock: { reg: apb2enr, bit: 2 }
  config:
    profile: stm32f1
- id: usart2
  type: uart
  bus: sysbus
  base_address: 0x40004400
  clock: { reg: apb1enr, bit: 17 }
  config:
    profile: stm32f1
