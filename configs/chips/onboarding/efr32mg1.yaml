name: efr32mg1
arch: arm
# Narrowed from Renode's efr32mg1.repl to its Cortex-M4F, flash/SRAM map,
# and model-backed USART0 path exercised by the Series-1 smoke.
core: cortex-m4f
flash:
  base: 0
  size: 262144B
ram:
  base: 536870912
  size: 32768B
peripherals:
- id: usart0
  type: efr32_usart
  bus: sysbus
  base_address: 1073807360
