# Imported Renode execution profile narrowed to the model-backed K64F CPU,
# memory, UART0, and GPIOB/E surface used by the onboarding smoke. Ethernet,
# USB, RNG, and clock behavior are outside this profile. SIM, WDOG, and
# PORTB/E are declarative register files generated from the NXP MK64F12 SVD:
# they read back what was written and reset to silicon values, but no clock is
# gated, no watchdog runs and no pad is muxed.
name: nxp-k6xf
arch: arm
core: cortex-m4
flash:
  base: 0x00000000
  size: 1048576B
ram:
  base: 0x20000000
  size: 196608B
peripherals:
- id: uart0
  type: uart
  bus: sysbus
  base_address: 0x4006A000
  size: 1024B
  irq: 31
  config:
    profile: k6xf
- id: gpiob
  type: gpio
  bus: sysbus
  base_address: 0x400FF040
  size: 64B
  config:
    profile: kinetis
- id: gpioe
  type: gpio
  bus: sysbus
  base_address: 0x400FF100
  size: 64B
  config:
    profile: kinetis
- id: sim
  type: declarative
  bus: sysbus
  base_address: 0x40047000
  size: 8192B
  config:
    path: ../../peripherals/mk64f12/sim.yaml
- id: wdog
  type: declarative
  bus: sysbus
  base_address: 0x40052000
  size: 32B
  config:
    path: ../../peripherals/mk64f12/wdog.yaml
- id: portb
  type: declarative
  bus: sysbus
  base_address: 0x4004A000
  size: 1024B
  config:
    path: ../../peripherals/mk64f12/port.yaml
- id: porte
  type: declarative
  bus: sysbus
  base_address: 0x4004D000
  size: 1024B
  config:
    path: ../../peripherals/mk64f12/port.yaml
