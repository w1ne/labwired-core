# Bounded profile based on Renode's miv.repl plus miv-board-additional-uarts.repl.
# The smoke exercises the RV32 Mi-V CPU, memory, and three model-backed
# CoreUART instances. GPIO, timers, PLIC, and CLINT are outside this profile.
# Renode maps: https://github.com/renode/renode/blob/master/platforms/cpus/miv.repl
# Additional UARTs: https://github.com/renode/renode/blob/master/platforms/boards/miv-board-additional-uarts.repl
name: miv-board-additional-uarts
arch: riscv
core: rv32imaf_zicsr_zifencei
cpu_hz: 66000000

flash: { base: 0x60000000, size: 256KiB }
ram: { base: 0x80000000, size: 64MiB }
flash_boot_alias: false
peripherals:
  - id: uart
    type: miv_coreuart
    base_address: 0x70001000
    size: 24B
  - id: uart_net_1
    type: miv_coreuart
    base_address: 0x70008000
    size: 24B
  - id: uart_net_2
    type: miv_coreuart
    base_address: 0x70009000
    size: 24B
