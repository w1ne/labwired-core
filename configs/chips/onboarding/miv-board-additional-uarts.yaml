# Bounded profile based on Renode's miv.repl plus miv-board-additional-uarts.repl.
# The smoke exercises the RV32 Mi-V CPU, memory, three model-backed CoreUART
# instances, CLINT, PLIC and CoreTimers.
# The core decodes the miv.repl CLINT (0x44000000, mtime at the 66 MHz CPU
# clock) and PLIC (0x40000000, sources 1..31, no priority levels) by chip
# name; CoreTimer0/1 drive PLIC sources 30/31. GPIO is omitted.
# Renode maps: https://github.com/renode/renode/blob/master/platforms/cpus/miv.repl
# Additional UARTs: https://github.com/renode/renode/blob/master/platforms/boards/miv-board-additional-uarts.repl
name: miv-board-additional-uarts
arch: riscv
core: rv32imaf_zicsr_zifencei
cpu_hz: 66000000

flash: { base: 0x60000000, size: 256KiB }
ram: { base: 0x80000000, size: 64MiB }
flash_boot_alias: false
peripherals:
  - id: uart
    type: miv_coreuart
    base_address: 0x70001000
    size: 24B
  - id: uart_net_1
    type: miv_coreuart
    base_address: 0x70008000
    size: 24B
  - id: uart_net_2
    type: miv_coreuart
    base_address: 0x70009000
    size: 24B
  - id: timer0
    type: miv_coretimer
    base_address: 0x70003000
    size: 28B
    irq: 30
  - id: timer1
    type: miv_coretimer
    base_address: 0x70004000
    size: 28B
    irq: 31
