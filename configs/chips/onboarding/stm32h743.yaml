# Imported STM32H743 smoke profile. The imported Renode catalogue listed a
# wider set of peripherals, including blocks that are stubs in this engine.
# Keep only the H7 RCC, GPIOB/GPIOD, USART3, flash, and DTCM used by the smoke.
# RM0433 documents the H743 memory map; 1 MiB flash is a conservative window for
# this generic descriptor because it does not distinguish xG from xI density.
name: stm32h743
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x58024400
    size: 1KB
    config:
      profile: h7
  - id: gpioPortB
    type: gpio
    base_address: 0x58020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: gpio
    base_address: 0x58020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: usart3
    type: uart
    base_address: 0x40004800
    size: 1KB
    config:
      profile: stm32v2
