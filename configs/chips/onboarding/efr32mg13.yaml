name: efr32mg13
arch: arm
# Narrowed from Renode's efr32mg13.repl: flash, sequence SRAM, and inherited
# USART0 used by the smoke. The main SRAM and other peripherals are omitted
# until their behavior is included in this engine's measured surface.
flash:
  base: 0
  size: 1048576B
ram:
  base: 553648128
  size: 8192B
peripherals:
- id: usart0
  type: efr32_usart
  bus: sysbus
  base_address: 1073807360
