# Bounded one-core profile of the Alif Ensemble E8. This maps the M55-HP's
# local ITCM and DTCM only; A32/M55-HE cores, peripherals, and Helium are not
# represented by this profile.
name: alif_ae822fa0e5597bs0
arch: arm
core: cortex-m55
# The descriptor's `flash` slot is the executable ITCM load window here; this
# does not model the device's MRAM or boot copy process.
flash:
  base: 0
  size: 262144B
ram:
  base: 536870912
  size: 1048576B
peripherals: []
