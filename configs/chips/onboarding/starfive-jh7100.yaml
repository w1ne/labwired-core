# Bounded import based on Renode's starfive-jh7100.repl. The engine profile
# exercises one U74 as RV64IMAC, the 8 KiB DTIM image window, the 128 KiB SoC
# SRAM window, and UART0 polling TX. The upstream platform advertises two
# RV64GC harts; this profile does not claim the second hart, F/D extensions,
# supervisor mode, CLINT/PLIC interrupts, or other SoC peripherals.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/starfive-jh7100.repl
name: starfive-jh7100
arch: riscv
core: rv64imac
flash: { base: 0x00100000, size: "8KiB" }
ram: { base: 0x18000000, size: "128KiB" }
flash_boot_alias: false
peripherals:
  - id: uart0
    type: uart
    bus: sysbus
    base_address: 0x11870000
    size: "4KiB"
    config:
      # Renode's wideRegisters=true gives 32-bit, 4-byte-spaced 16550
      # registers; the engine's DesignWare 16550 profile uses those offsets.
      profile: dw_apb_uart
