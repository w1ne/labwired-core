name: litex_common
arch: arm
flash:
  base: 536870912
  size: 33554432B
ram:
  base: 268435456
  size: 262144B
# Simulation-only co-simulation endpoint. This generic LiteX import has no
# modeled GPIO fabric or ADC, so these channels are not LiteX pads or
# firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: phy
  type: ethernetphysicallayer
  bus: eth
  base_address: 0
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
