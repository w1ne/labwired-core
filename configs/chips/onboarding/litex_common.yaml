name: litex_common
# Renode models this as a shared LiteX include with no CPU of its own. The engine has no core for it,
# so the chip is refused rather than run as a Cortex-M.
arch: unknown
flash:
  base: 536870912
  size: 33554432B
ram:
  base: 268435456
  size: 262144B
peripherals:
- id: phy
  type: ethernetphysicallayer
  bus: eth
  base_address: 0
