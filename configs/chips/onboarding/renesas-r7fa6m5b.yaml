# Imported Renode execution profile. The generated import used the data-flash
# base for code flash and listed unrelated peripherals. This profile retains
# only the model-backed CPU and memory required by the instruction smoke.
name: renesas-r7fa6m5b
arch: arm
core: cortex-m33
flash:
  base: 0x00000000
  size: "2048KB"
ram:
  base: 0x20000000
  size: "512KB"
peripherals: []
