name: renesas-r7fa2l1a
arch: arm
# Narrow imported Renode profile. The RA2L1 REPL inherits the Cortex-M23 CPU
# and code-flash base from renesas-r7fa2e1a9.repl, overrides code flash to
# 256 KiB, and maps 32 KiB SRAM at 0x20000000. No peripheral behavior is
# claimed by this onboarding profile.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/renesas-r7fa2l1a.repl
core: cortex-m23
flash:
  base: 0x00000000
  size: 256KB
ram:
  base: 0x20000000
  size: 32KB
peripherals: []
