# Bounded profile for the imported Ambiq Apollo4 target.
#
# The machine-imported chip was a Renode boot-ROM-logger scaffold, with a
# 4 KiB flash window at 0x08000000 and generated zero-answering peripherals.
# This profile instead uses the sourced Apollo4 Plus memory layout and only
# the Cortex-M4, memory, UART0, GPIO, and power-control models exercised by
# examples/renode-onboarding/ambiq-apollo4-smoke.yaml.
#
# Sources and fuller model notes: configs/chips/amap42kp.yaml and
# examples/apollo4p-evb/REQUIRED_DOCS.md. The imported target's profile is
# intentionally limited to the Apollo4 Plus EVB's CPU, memories, UART0,
# GPIO, and power-control paths; the secure bootloader and other peripherals
# are not modelled here.

name: ambiq-apollo4
arch: arm
core: cortex-m4
cpu_hz: 96000000

flash:
  base: 0x00000000
  size: 2048KB
ram:
  base: 0x10000000
  size: 2816KB
reset_vector_offset: 0x18000

memory_regions:
  - name: bootrom
    base: 0x08000000
    size: 4KB
    image_env: LABWIRED_APOLLO4_BOOTROM

peripherals:
  - id: systick
    type: systick
    base_address: 0xE000E010
    size: 16B
  - id: uart0
    type: uart
    base_address: 0x4001C000
    size: 4KB
    irq: 15
    config:
      profile: pl011
  - id: gpio
    type: apollo4_gpio
    base_address: 0x40010000
    size: 2KB
  - id: pwrctrl
    type: apollo4_pwrctrl
    base_address: 0x40021000
    size: 4KB
  - id: cpu
    type: apollo4_cpu
    base_address: 0x48000000
    size: 4KB
  # The HAL's bus write-flush is a dummy read of SYNC_READ. Writes are not
  # queued in this profile, so this one 32-bit read window returns zero.
  - id: sync_read
    type: stub
    base_address: 0x47FF0000
    size: 4B
