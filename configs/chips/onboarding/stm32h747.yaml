# Bounded execution profile for the imported generic STM32H747 descriptor.
# Exercise only the Cortex-M7, a bounded flash/DTCM window, H7 RCC, GPIOB/D,
# and USART3 paths asserted by the exact-import firmware smoke. Other imported
# peripheral claims and the H747's second core are intentionally omitted.
name: stm32h747
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 2MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x58024400
    size: 1KB
    config:
      profile: h7
  - id: gpioPortB
    type: gpio
    base_address: 0x58020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: gpio
    base_address: 0x58020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: usart3
    type: uart
    base_address: 0x40004800
    size: 1KB
    config:
      profile: stm32v2
