# Bounded Cortex-M33 CPU-only profile for the imported RZ/G2L descriptor.
# The upstream Renode platform maps the M33's non-secure code SRAM at 0x10000
# and data SRAM at 0x20010000, each 64 KiB. This profile omits the Cortex-A55
# cluster, aliases, and every peripheral; it makes no flash or board-boot claim.

name: "renesas_rz_g2l"
arch: "arm"
core: "cortex-m33"
flash: { base: 0, size: 0 }
ram: { base: 0x20010000, size: "64KiB" }
flash_boot_alias: false
memory_regions:
  - name: "m33_nonsecure_code_sram"
    base: 0x10000
    size: "64KiB"
peripherals: []
