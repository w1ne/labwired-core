name: riscv_verilated_uartlite
arch: arm
flash:
  base: 1610612736
  size: 104857600B
ram:
  base: 1610612736
  size: 104857600B
# Simulation-only co-simulation endpoint. The imported Verilated UARTLite
# profile has no modeled GPIO fabric or ADC; these channels are not physical
# pads or firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: uart
  type: cosimulateduart
  bus: sysbus
  base_address: 1879048192
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
