name: stm32f777
arch: arm
flash:
  base: 134217728
  size: 2097152B
ram:
  base: 536870912
  # Only the 128 KiB DTCM region at 0x20000000 is modeled in this smoke profile.
  # The imported 256 MiB span was not a real SRAM map; SRAM1, ITCM, and backup
  # SRAM are outside this profile.
  size: 131072B
# This profile is limited to existing models exercised by the exact-import
# Cortex-M7 smoke. Other imported peripherals include zero-answering stubs and
# are not claimed here.
peripherals:
- id: usart1
  type: stm32f7_usart
  bus: sysbus
  base_address: 1073811456
- id: gpioPortI
  type: stm32_gpioport
  bus: sysbus
  base_address: 1073881088
  config:
    profile: stm32v2
- id: rcc
  type: stm32f4_rcc
  bus: sysbus
  base_address: 1073887232
