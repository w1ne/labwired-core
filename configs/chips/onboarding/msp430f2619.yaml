name: msp430f2619
# The simulator has no MSP430 CPU adapter. Keep this architecture explicit as
# unsupported rather than routing this 16-bit MCU through the Cortex-M engine.
arch: unknown
flash:
  base: 3072
  size: 1024B
ram:
  base: 512
  size: 2048B
peripherals:
- id: boot
  type: arraymemory
  bus: sysbus
  base_address: 3072
- id: ram_extended
  type: arraymemory
  bus: sysbus
  base_address: 6400
- id: code
  type: arraymemory
  bus: sysbus
  base_address: 8448
- id: info_mem
  type: arraymemory
  bus: sysbus
  base_address: 4096
