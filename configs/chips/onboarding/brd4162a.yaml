# Narrow smoke profile for the imported BRD4162A / EFR32MG12 system, aligned
# with Renode's board and MCU descriptions:
# https://github.com/renode/renode/blob/master/platforms/boards/silabs/brd4162a.repl
# https://github.com/renode/renode/blob/master/platforms/cpus/silabs/efr32/efr32mg12.repl
# The smoke uses the Cortex-M4F, code flash, sequence SRAM, and model-backed
# USART0. Main SRAM and the board's LEDs/buttons are omitted until exercised.
name: brd4162a
arch: arm
core: cortex-m4f
flash:
  base: 0
  size: 1048576B
ram:
  base: 553648128
  size: 8192B
peripherals:
- id: usart0
  type: efr32_usart
  bus: sysbus
  base_address: 1073807360
