# Bounded imported CV32E40P profile. The generated import mislabeled this
# RISC-V system as ARM and listed PULP peripheral windows outside this
# CPU-and-memory smoke. The profile claims RV32IMC execution and the imported
# memory windows; no peripheral behavior is claimed here.
name: A2_CV32E40P
arch: riscv
core: rv32imc
flash:
  base: 0x1A000000
  size: 8KiB
ram:
  base: 0x1C000000
  size: 512KiB
flash_boot_alias: false
peripherals: []
