name: nuvoton_npcx9
arch: arm
core: cortex-m4f
flash:
  # LabWired's firmware loader uses the NPCX9 ROM mapped at zero as its
  # execution backing. Internal-flash boot-ROM handoff is not modeled here.
  base: 0
  size: 65536B
ram:
  # NPCX9 data RAM; other SRAM aliases and internal flash are omitted.
  base: 0x200C0000
  size: 96256B
peripherals:
- id: cr_uart1
  type: npcx_uart
  bus: sysbus
  base_address: 0x400E0000
