name: simavr-atmega88
arch: avr
core: avr8
flash:
  base: 0
  size: 8KB
ram:
  base: 256
  size: 1KB
# Register map checked against avr-libc 2.0.0 avr/iom88.h: PINx/DDRx/PORTx
# at the same data addresses as LabWired's ATmega328P core, and ADCL/ADCH
# 0x78/0x79, ADCSRA 0x7A, ADCSRB 0x7B, ADMUX 0x7C. That core owns those
# registers; each port is mirrored at 0x1_0000 + PINx (PIN/DDR/PORT) and the
# ADC input side is millivolts per channel, two bytes each, the same layout
# as configs/chips/atmega328p.yaml. VIL 0.3 VCC / VIH 0.6 VCC are the datasheet
# DC input limits.
gpio_input_thresholds:
  vil: 0.3
  vih: 0.6
peripherals:
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010026
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010029
    size: "3"
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010030
    size: "16"
    config:
      channels: 8
analog_pins:
  PC0: { peripheral: adc, channel: 0 }
  PC1: { peripheral: adc, channel: 1 }
  PC2: { peripheral: adc, channel: 2 }
  PC3: { peripheral: adc, channel: 3 }
  PC4: { peripheral: adc, channel: 4 }
  PC5: { peripheral: adc, channel: 5 }
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_mega88.c
  kind: core-model
  license: GPL-3.0
  retrieved: '2026-10-18'
