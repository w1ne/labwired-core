# STM32F746G-DISCO (platforms/boards/stm32f7_discovery-bb.repl). Renode builds
# the board as `using "platforms/cpus/stm32f746.repl"` plus two Ethernet PHYs
# and an FT5336 touch controller on I2C3; the board's part is the
# STM32F746NGH6. The silicon is the imported stm32f746 profile, included whole
# rather than copied so the two rows cannot drift: 1 MiB / 320 KiB, RCC,
# USART1/2/3/6 + UART4/5/7/8, GPIOA..K, SYSCFG + EXTI, TIM1..TIM14, SPI1/2/3,
# I2C1..4, DMA1/DMA2, CRC and RNG.
# See stm32f746.yaml for the per-block sources and what it does not claim.
#
# The board-level parts (LD1 on PI1, B1 on PI11) live in the system file.
# The Ethernet PHYs (the engine has no Ethernet MAC on this part) and the
# FT5336 touch controller (no engine model) are not declared.
include: stm32f746.yaml
name: stm32f7_discovery-bb
