# Exact-import profile for the STM32F746G Discovery smoke. Keep only the
# Cortex-M7, bounded on-chip memory window, F7 RCC, GPIOI, and USART1 paths that
# the smoke exercises. Other imported peripherals are not claimed here.
#
# Part Knowledge returned a NOT_EXTRACTED quote from the STM32F746xx datasheet
# (DS10916 Rev 5, p.109): the shown memory map places flash at 0x08000000-
# 0x080FFFFF and lists 64 KiB DTCM, 240 KiB SRAM1, and 16 KiB SRAM2 in the
# contiguous 0x20000000-0x2004FFFF range. These are source quotes, not a
# cross-checked LabWired part fact.
name: stm32f7_discovery-bb
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 320KiB
peripherals:
  - id: usart1
    type: stm32f7_usart
    bus: sysbus
    base_address: 0x40011000
  - id: gpioPortI
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40022000
    config:
      profile: stm32v2
  - id: rcc
    type: stm32f4_rcc
    bus: sysbus
    base_address: 0x40023800
