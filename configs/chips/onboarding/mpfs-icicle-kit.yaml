# Bounded imported profile for one PolarFire SoC U54 hart.
#
# The MPFS MSS map follows configs/chips/mpfs095t.yaml, which is sourced from
# Microchip's PolarFire SoC MSS manual and Zephyr's mpfs_icicle U54 devicetree.
# This imported profile retains only the RV64IMAC M-mode core, memory windows,
# its in-core CLINT, model-backed MMUART0/1, and zero-answering PLIC/GPIO/I2C/SPI
# stubs reached by Zephyr startup. These stubs do not model those peripherals.
# The E51 and other U54 harts, DMA, storage, and other MSS peripherals are
# outside this profile.
name: "mpfs-icicle-kit"
arch: "riscv"
core: "rv64imac"
cpu_hz: 600_000_000
flash: { base: 0x20220000, size: "128KiB" }
ram: { base: 0x80000000, size: "8MiB" }
flash_boot_alias: false
memory_regions:
  - { name: "l2lim", base: 0x08000000, size: "512KiB" }
peripherals:
  - id: "plic"
    type: "stub"
    base_address: 0x0C000000
    size: "65536KB"
  - id: "mss_gpio0"
    type: "stub"
    base_address: 0x20120000
    size: "4KB"
  - id: "mss_gpio1"
    type: "stub"
    base_address: 0x20121000
    size: "4KB"
  - id: "mss_gpio2"
    type: "stub"
    base_address: 0x20122000
    size: "4KB"
  - id: "i2c0"
    type: "stub"
    base_address: 0x2010A000
    size: "4KB"
  - id: "i2c1"
    type: "stub"
    base_address: 0x2010B000
    size: "4KB"
  - id: "spi1"
    type: "stub"
    base_address: 0x20109000
    size: "4KB"
  - id: "mmuart0"
    type: "uart"
    base_address: 0x20000000
    size: "4KB"
    irq: 90
    config:
      profile: "dw_apb_uart"
  - id: "mmuart1"
    type: "uart"
    base_address: 0x20100000
    size: "4KB"
    irq: 91
    config:
      profile: "dw_apb_uart"
