# Narrowed LiteX Minerva profile for the imported Renode system.
# Minerva implements RV32I; keep the profile to its memory, LiteX UART, and
# LiteX timer, which are exercised by the exact-system smoke below.
# CPU ISA source: https://github.com/enjoy-digital/litex/wiki/CPUs

name: "litex_minerva"
arch: "riscv"
core: "rv32i"

flash: { base: 0x20080000, size: "32KB" }
ram: { base: 0x10000000, size: "256KB" }
peripherals:
  - id: "uart"
    type: "litex_uart"
    base_address: 0xE0001800
    size: "2KB"
  - id: "timer0"
    type: "litex_timer"
    base_address: 0xE0002800
    size: "2KB"
