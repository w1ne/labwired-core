name: stm32f429
arch: arm
# Conservative windows needed by the exact-import F4 bare-register smoke.
# These are execution mappings, not a claim about the full density-specific
# memory map.
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
# Keep only models exercised by the exact-import smoke. The broader imported
# peripheral list included untested peripherals and zero-answering stubs.
peripherals:
  # The STM32F429's Cortex-M4F single-precision extension is exercised by the
  # exact-import smoke (CPACR, MVFR0-2 and a VFPv4 add).
  - id: fpu
    type: cortex_m_fpu
    bus: sysbus
    base_address: 0xE000EF30
    size: 28B
    config:
      mvfr0: 0x10110021
      mvfr1: 0x11000011
      mvfr2: 0x00000000
  # The Cortex-M core's architected timer is modeled by the engine and is
  # directly exercised by the PSP SysTick-to-PendSV smoke.
  - id: systick
    type: systick
    bus: sysbus
    base_address: 0xE000E010
    size: 16B
  - id: usart2
    type: stm32_uart
    bus: sysbus
    base_address: 0x40004400
    size: 1KB
  - id: gpioPortA
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020000
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortB
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: rcc
    type: stm32f4_rcc
    bus: sysbus
    base_address: 0x40023800
    size: 1KB
    config:
      profile: stm32f4
  # RM0090: TIM2 is a 32-bit APB1 timer at 0x40000000, enabled by
  # RCC_APB1ENR.TIM2EN (bit 0), and uses external interrupt 28. The exact
  # import smoke checks its gate, counter, update flag, and NVIC delivery.
  - id: tim2
    type: timer
    bus: sysbus
    base_address: 0x40000000
    size: 1KB
    irq: 28
    clock: { reg: apb1enr, bit: 0 }
    config:
      width: 32
  # ST RM0090: I2C1 is the legacy F4 controller at 0x40005400, clocked by
  # APB1ENR.I2C1EN and routed to PB6/PB7 with AF4 per the STM32F429 datasheet.
  # It has separate event and error vectors; the smoke reads an attached BME280.
  # Sources: https://www.st.com/resource/en/reference_manual/dm00031020-stm32f405-415-stm32f407-417-stm32f427-437-and-stm32f429-439-advanced-arm-based-32-bit-mcus-stmicroelectronics.pdf
  #          https://www.st.com/resource/en/datasheet/stm32f429zi.pdf
  - id: i2c1
    type: i2c
    bus: sysbus
    base_address: 0x40005400
    size: 1KB
    irq: 31
    clock: { reg: apb1enr, bit: 21 }
    config:
      profile: stm32f1
      irq_error: 32
  # RM0090: SPI1 is the classic F4 block at 0x40013000, clocked by
  # RCC_APB2ENR.SPI1EN (bit 12), with PA4 chip select and AF5 on PA5..PA7.
  - id: spi1
    type: spi
    bus: sysbus
    base_address: 0x40013000
    size: 1KB
    irq: 35
    clock: { reg: apb2enr, bit: 12 }
    config:
      profile: stm32f4
      pad_map: stm32f4
  # ADC1 on PA1/IN1 is checked by the exact-import smoke.
  - id: adc1
    type: adc
    bus: sysbus
    base_address: 0x40012000
    size: 1KB
    irq: 18
    clock: { reg: apb2enr, bit: 8 }
    config:
      profile: stm32f4
analog_pins:
  PA1: { peripheral: adc1, channel: 1 }
