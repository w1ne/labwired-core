name: stm32f429
arch: arm
# Conservative windows needed by the exact-import F4 bare-register smoke.
# These are execution mappings, not a claim about the full density-specific
# memory map.
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
# Keep only models exercised by the exact-import smoke. The broader imported
# peripheral list included untested peripherals and zero-answering stubs.
peripherals:
  # The STM32F429's Cortex-M4F single-precision extension is exercised by the
  # exact-import smoke (CPACR, MVFR0-2 and a VFPv4 add).
  - id: fpu
    type: cortex_m_fpu
    bus: sysbus
    base_address: 0xE000EF30
    size: 28B
    config:
      mvfr0: 0x10110021
      mvfr1: 0x11000011
      mvfr2: 0x00000000
  # The Cortex-M core's architected timer is modeled by the engine and is
  # directly exercised by the PSP SysTick-to-PendSV smoke.
  - id: systick
    type: systick
    bus: sysbus
    base_address: 0xE000E010
    size: 16B
  - id: usart2
    type: stm32_uart
    bus: sysbus
    base_address: 0x40004400
    size: 1KB
  - id: gpioPortA
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020000
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: rcc
    type: stm32f4_rcc
    bus: sysbus
    base_address: 0x40023800
    size: 1KB
