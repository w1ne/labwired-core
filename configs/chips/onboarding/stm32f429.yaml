name: stm32f429
arch: arm
# Conservative windows needed by the exact-import F4 bare-register smoke.
# These are execution mappings, not a claim about the full density-specific
# memory map.
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
# Keep only models exercised by the exact-import smoke. The broader imported
# peripheral list included untested peripherals and zero-answering stubs.
peripherals:
  - id: usart2
    type: stm32_uart
    bus: sysbus
    base_address: 0x40004400
  - id: gpioPortA
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020000
    config:
      profile: stm32v2
  - id: gpioPortD
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020C00
    config:
      profile: stm32v2
  - id: rcc
    type: stm32f4_rcc
    bus: sysbus
    base_address: 0x40023800
