name: efm32jg12
arch: arm
# Flash at 0x0 as in Renode's efm32xg1x/efm32jg12.repl
# (`flash: Memory.MappedMemory @ sysbus 0x00000000`) and the EFM32 Series 1
# memory map.
flash:
  base: 0
  size: 1048576B
ram:
  base: 536870912
  size: 262144B
peripherals:
# This imported profile is bounded to the existing USART0 model exercised by
# the Renode onboarding smoke below. Other generated windows remain unclaimed.
- id: usart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073807360
