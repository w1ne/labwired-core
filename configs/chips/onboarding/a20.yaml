# Low-resolution ADC (sunxi_lradc) at 0x01C2_2800 (sun7i-a20.dtsi
# lradc@1c22800, allwinner,sun4i-a10-lradc-keys, 0x100 bytes, GIC SPI 31).
# Two 6-bit channels; full scale is 2/3 of the 3.0 V vref-supply (Linux
# lradc_variant_a10). No GIC is declared here, so no irq is wired.
- id: lradc
  type: sunxi_lradc
  bus: sysbus
  base_address: 0x01C22800
  size: 256B
  config:
    supply_mv: 3000
    vref_num: 2
    vref_den: 3
# LRADC0/LRADC1 are dedicated analog pads (no PIO mux). The pad names are
# the A20 ball names; the datasheet was not checked here.
analog_pins:
  LRADC0: { peripheral: lradc, channel: 0 }
  LRADC1: { peripheral: lradc, channel: 1 }
