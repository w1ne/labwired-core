# Bounded imported Renode A20 profile for a direct Cortex-A7/UART0 smoke.
#
# Renode's platforms/cpus/a20.repl maps a 64 KiB BROM at 0xFFFF0000, 256 KiB
# SRAM at 0x0, 2 GiB DDR at 0x40000000, and UART0 with wide 16550 registers at
# 0x01C28000. This engine runs one Cortex-A7 PE and the smoke uses a 64 KiB
# slice at the DDR base plus UART0 polled TX. It does not load the BROM, so the
# flash window is absent; the rest of DDR, internal SRAM, the second PE, GIC,
# generic timer, MMC, USB, and the other UARTs are outside this measured profile.
#
# `dw_apb_uart` selects this engine's existing 32-bit, 4-byte-stride 16550
# register map to match Renode's `wideRegisters: true`; it does not claim that
# the A20 silicon contains a Synopsys DesignWare UART.
name: a20
arch: arm
core: cortex-a7
flash: { base: 0, size: 0 }
ram:
  base: 0x40000000
  size: 64KB
flash_boot_alias: false
peripherals:
  - id: uart0
    type: ns16550
    base_address: 0x01C28000
    size: 1KB
    config:
      profile: dw_apb_uart
