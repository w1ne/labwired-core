# PIO ports A..I: one 0x24-byte bank per port from 0x01C2_0800 (sun7i-a20.dtsi
# pinctrl@1c20800, Linux pinctrl-sunxi.h BANK_MEM_SIZE), Pn_DAT @+0x10, on
# configs/peripherals/sunxi/pio.yaml.
peripherals:
- id: pioA
  type: declarative
  bus: sysbus
  base_address: 29493248
  size: 36B
  config:
    path: ../../peripherals/sunxi/pio.yaml
