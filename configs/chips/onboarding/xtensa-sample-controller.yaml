name: xtensa-sample-controller
arch: arm
flash:
  base: 1342177280
  size: 67108864B
ram:
  base: 1073741824
  size: 131072B
# Simulation-only co-simulation endpoint. This imported profile has no modeled
# GPIO fabric or ADC; these channels are not physical pads or firmware-visible
# registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
