# Narrow imported profile for Cortex-M33 CPU0, memory, and polled UART smoke.
# Renode's mimxrt798s.repl maps XIP1 at 0x08000000 (128 MiB) and CPU0
# non-secure SRAM at 0x20000000 (0x580000 bytes). CPU1, DSPs, Flexcomm1-13,
# other peripherals, and the external XSPI2 window are intentionally omitted.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/mimxrt798s.repl
name: mimxrt798s
arch: arm
core: cortex-m33
cpu_hz: 237500000
flash:
  base: 134217728
  size: 134217728B
ram:
  base: 536870912
  size: 5767168B
peripherals:
  # Renode mimxrt798s.repl flexcomm0 has aliased mappings at 0x40110000 and
  # 0x50110000 (IRQ nvic0@7). The imported CPU0 non-secure profile uses the
  # former. This bounded model implements LP_FLEXCOMM selection/status and its
  # LPUART function; LPI2C and LPSPI transactions are not modelled.
  - id: flexcomm0
    type: imxrt_lpuart
    base_address: 0x40110000
    size: 4KB
    config:
      clock_hz: 80000000
      lp_flexcomm: true
      lp_flexcomm_present: 112
  # OS event timer, CPU0 non-secure view. MIMXRT798S_cm33_core0_COMMON.h:
  # OSTIMER_CPU0_BASE_NS 0x40207000, OS_EVENT_IRQn 34; PERI_OSTIMER.h gives
  # the RT500 register layout (EVTIMERL/H, CAPTURE_L/H, MATCH_L/H,
  # OSEVENT_CTRL @ 0x1C with INTRFLAG/INTENA/MATCH_WR_RDY), Gray-coded count
  # and match. Renode mimxrt798s.repl maps NXP_OsTimer at the same base,
  # frequency 1000000, IRQ nvic0@34. The model is the RT500 OSTIMER: a 42-bit
  # count, DEBUG_EN (bit 3) not stored, CAPTURE reads 0, no CPU1 view.
  - id: ostimer
    type: rt5xx_ostimer
    base_address: 0x40207000
    size: 4KB
    irq: 34
    config:
      clock_hz: 237500000
      tick_hz: 1000000
