name: eos-s3-quickfeather
arch: arm
# QuickLogic QuickFeather. Renode platforms/boards/eos-s3-quickfeather.repl is
# cpus/eos-s3.repl plus three LEDs, a user button and an MC3635 accelerometer,
# so the chip surface is the eos-s3 onboarding profile, included whole.
# Board LEDs and the button are not declared: Renode wires the LEDs to
# GPIO 4/5/6, while qorc-sdk BSP/quickfeather/src/leds.c drives IO_OUTPUT
# bits 1/4/6; the two sources disagree. MC3635 sits behind the FFE I2C
# master, which has no model.
include: eos-s3.yaml
