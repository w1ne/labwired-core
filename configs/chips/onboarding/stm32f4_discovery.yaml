name: stm32f4_discovery
arch: arm
flash:
  base: 134217728
  size: 1048576B
ram:
  base: 536870912
  size: 131072B
# The F407 also has 64 KiB of CCM at 0x10000000; this memory map currently
# exposes only the 128 KiB main SRAM used by the firmware.
# This onboarding profile intentionally claims only the STM32F407 surface used
# by the exact-import smoke: F4 RCC, USART2, and GPIO A/D. The remaining
# imported peripheral map is untested here and includes zero-answering stubs.
peripherals:
- id: usart2
  type: stm32_uart
  bus: sysbus
  base_address: 1073759232
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 1073872896
  config:
    profile: stm32v2
- id: gpioPortD
  type: stm32_gpioport
  bus: sysbus
  base_address: 1073875968
  config:
    profile: stm32v2
- id: rcc
  type: stm32f4_rcc
  bus: sysbus
  base_address: 1073887232
