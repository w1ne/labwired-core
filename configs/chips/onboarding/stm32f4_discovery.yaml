name: stm32f4_discovery
arch: arm
flash:
  base: 134217728
  size: 1048576B
ram:
  base: 536870912
  size: 131072B
# The F407 also has 64 KiB of CCM at 0x10000000; this memory map currently
# exposes only the 128 KiB main SRAM used by the firmware.
# This onboarding profile intentionally claims only the STM32F407 surface used
# by the exact-import smoke: Cortex-M SysTick, F4 RCC, USART2, SPI1, and GPIO
# A/D. The remaining imported peripheral map is untested here and includes
# zero-answering stubs.
peripherals:
- id: systick
  type: systick
  bus: sysbus
  base_address: 0xE000E010
  size: 16B
- id: usart2
  type: stm32_uart
  bus: sysbus
  base_address: 1073759232
  size: 1KB
- id: spi1
  type: spi
  bus: sysbus
  base_address: 0x40013000
  size: 1KB
  irq: 35
  clock: { reg: apb2enr, bit: 12 }
  config:
    profile: stm32f4
    pad_map: stm32f4
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 1073872896
  size: 1KB
  config:
    profile: stm32v2
- id: gpioPortD
  type: stm32_gpioport
  bus: sysbus
  base_address: 1073875968
  size: 1KB
  config:
    profile: stm32v2
- id: rcc
  type: stm32f4_rcc
  bus: sysbus
  base_address: 1073887232
  size: 1KB
  config:
    profile: stm32f4
