# Imported Renode target `zedboard` (Digilent ZedBoard, Zynq-7020), narrowed to what the engine executes and
# the UART smoke exercises: one Cortex-A9 PE on the native Cortex-A9 model, a
# 64 KiB aperture at the DDR base 0x00100000 (UG585 address map), and PS UART1
# (Cadence, polled TX) at 0xE0001000. The aperture is a simulator limit, not
# the board's DDR size. OCM and the BootROM, the second A9, SCU, GIC, L2C-310,
# global/private timers, TTCs, UART0, GEMs, USB, SD, QSPI, SPI, I2C, GPIO,
# DMA, XADC and SLCR are not modeled here and are intentionally omitted; the
# import answered most of them with zero-reading stubs.
name: zedboard
arch: arm
core: cortex-a9
flash: { base: 0, size: 0 }
ram:
  base: 0x00100000
  size: 64KB
flash_boot_alias: false
peripherals:
- id: uart1
  type: cadence_uart
  bus: sysbus
  base_address: 0xE0001000
  size: 4096
