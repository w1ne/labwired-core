# LabWired - narrowed LiteX VexRiscv profile for the imported Renode system.
#
# The generated import called this an ARM platform and omitted the LiteX UART
# and timer while advertising MMCM and Ethernet blocks that LabWired does not
# model. Keep only the supported RV32IM, memory, UART, timer, and explicit SPI
# stub used by the smoke. The full model rationale and sources are in
# configs/chips/litex-vexriscv.yaml.

name: "litex_vexriscv"
arch: "riscv"
core: "rv32im"
cpu_hz: 100_000_000

flash: { base: 0x20000000, size: "32MiB" }
ram: { base: 0x10000000, size: "256KB" }
flash_boot_alias: false
memory_regions:
  - { name: "rom", base: 0x0, size: "256KB" }
peripherals:
  - id: "uart"
    type: "litex_uart"
    base_address: 0x60001800
    size: "2KB"
    irq: 2
  - id: "timer"
    type: "litex_timer"
    base_address: 0x60002800
    size: "2KB"
    irq: 1
  # Declared gap, not a modeled flash controller. Reads answer zeros.
  - id: "spi_flash_ctrl"
    type: "stub"
    base_address: 0x60005000
    size: "2KB"
