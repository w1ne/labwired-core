name: nucleo_h753zi
arch: arm
core: cortex-m7
# Bounded execution windows for the shared H7 register smoke. These are not a
# full memory-density claim; Part Knowledge has no public verified H753 record.
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
- id: GreenLED
  type: led
  bus: gpioPortB
  base_address: 0
- id: rcc
  type: rcc
  bus: sysbus
  base_address: 0x58024400
  size: 1KB
  config:
    profile: h7
- id: gpioPortB
  type: gpio
  bus: sysbus
  base_address: 0x58020400
  size: 1KB
  config:
    profile: stm32v2
- id: gpioPortD
  type: gpio
  bus: sysbus
  base_address: 0x58020C00
  size: 1KB
  config:
    profile: stm32v2
- id: usart3
  type: uart
  bus: sysbus
  base_address: 0x40004800
  size: 1KB
  config:
    profile: stm32v2
