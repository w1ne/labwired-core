name: nucleo_h753zi
arch: arm
core: cortex-m7
# Bounded execution windows for the shared H7 register smoke. These are not a
# full memory-density claim; Part Knowledge has no public verified H753 record.
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
# Renode's GreenLED is a GPIO pin connection (gpioPortB pin 0), not a bus
# peripheral; imported here it became a 4 KiB zero window at sysbus 0x0.
# Board LEDs are modelled through board_io, so it is not declared.
- id: rcc
  type: rcc
  bus: sysbus
  base_address: 0x58024400
  size: 1KB
  config:
    profile: h7
- id: gpioPortB
  type: gpio
  bus: sysbus
  base_address: 0x58020400
  size: 1KB
  config:
    profile: stm32v2
- id: gpioPortD
  type: gpio
  bus: sysbus
  base_address: 0x58020C00
  size: 1KB
  config:
    profile: stm32v2
- id: usart3
  type: uart
  bus: sysbus
  base_address: 0x40004800
  size: 1KB
  # USART3_IRQn = 39 on STM32H753ZIT6; this line is exercised by the RX smoke.
  irq: 39
  config:
    profile: stm32v2
- id: fpu
  type: cortex_m_fpu
  bus: sysbus
  base_address: 0xE000EF30
  size: 28B
  # STM32H753 has a Cortex-M7 double-precision FPU (ST DS12117); these are
  # the Cortex-M7 FPv5-DP MVFR values from Arm DDI 0489, Table 8-2.
  config:
    mvfr0: 0x10110221
    mvfr1: 0x12000011
