name: renesas_rz_t2m
arch: arm
# This is a Cortex-R52 system. The engine has no Cortex-R52 adapter, so keep
# the sourced memory map but do not advertise the imported SCI/timer windows.
core: cortex-r52
flash:
  base: 0x88000000
  size: 64MB
ram:
  base: 0x10000000
  size: 1536KB
peripherals: []
