# ADC0, the 14-bit ADC140 A/D converter (R_ADC0_Type). The UNO R4 Minima is an
# R7FA4M1AB3CFM, the same die as renesas-r7fa4m1a: R_ADC0_BASE = 0x4005C000 in
# FSP v5.6.0 R7FA4M1AB.h; scan end is ELC_EVENT_ADC0_SCAN_END 0x029 (ra4m1
# bsp_elc.h), and BSP_FEATURE_ADC_MAX_RESOLUTION_BITS selects ra_adc14. Channel
# n is ANn (AN000 = 0); AN005..AN007 are in BSP_FEATURE_ADC_UNIT_0_CHANNELS.
# clock_hz is the maximum ICLK and only sets the nominal 1 us per channel.
- id: adc0
  type: ra_adc14
  base_address: 0x4005C000
  size: 512B
  config:
    elc_event: 41
    clock_hz: 48000000
    vref_mv: 3300
