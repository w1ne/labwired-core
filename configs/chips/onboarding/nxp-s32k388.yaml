#
# The imported Renode descriptor advertised peripheral windows that are not
# implemented by this engine and understated SRAM. Keep this onboarding
# execution profile to the sourced S32K388 CM7_0 core and memory map. The
# CPU-only smoke loads its vector table directly from flash; it does not model
# the S32K3 boot ROM or exercise peripherals.
# Memory sizes and TCM windows follow configs/chips/s32k388.yaml.

name: nxp-s32k388
arch: arm
core: cortex-m7
cpu_hz: 48000000
flash:
  base: 0x00400000
  size: "8192KB"
ram:
  base: 0x20400000
  size: "768KB"
memory_regions:
  - name: itcm
    base: 0x00000000
    size: "32KB"
  - name: dtcm
    base: 0x20000000
    size: "64KB"
flash_boot_alias: false
peripherals: []
