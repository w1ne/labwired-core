  PTC25: { peripheral: adc0, channel: 44 }  # ADC0_S20
  PTC26: { peripheral: adc0, channel: 45 }  # ADC0_S21
  PTC31: { peripheral: adc2, channel: 45 }  # ADC2_S21
  PTD0: { peripheral: adc0, channel: 1 }  # ADC0_P1
  PTD1: { peripheral: adc0, channel: 0 }  # ADC0_P0
  PTD2: { peripheral: adc0, channel: 40 }  # ADC0_S16
  PTD3: { peripheral: adc0, channel: 34 }  # ADC0_S10
  PTD4: { peripheral: adc0, channel: 43 }  # ADC0_S19
