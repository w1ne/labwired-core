# SIUL2 runs on the `s32k3_siul2` model the promoted configs/chips/s32k388.yaml
# uses: MSCR[n] @0x240 + 4n (IBE bit 19), GPDI bytes @0x1500, PGPDI halfwords
# @0x1740 (S32K388_SIUL2.h, RTD BaseNXP). Renode's type had no LabWired model.
# MC_ME/MC_CGM are not modelled here, so GPDI reads the pad whatever the
# SIUL2 clock; IMCR input muxing and the pad filters are stored only.
- id: siul2
  type: s32k3_siul2
  renode_type: s32k3xx_systemintegrationunitlite2
  bus: sysbus
  base_address: 1076428800
  size: 16KB
