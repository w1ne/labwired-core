# SUPERSEDED: staged onboarding descriptor (a generic UART fixture on the
# Renode-derived map with 256 KiB of RAM). The
# promoted S32K388 part is configs/chips/s32k388.yaml (board:
# configs/systems/s32k388-evb.yaml).
name: nxp-s32k388evb
arch: arm
# S32K388 DS: Cortex-M7 (no bit-band), as configs/chips/s32k388.yaml.
core: cortex-m7
flash:
  base: 4194304
  size: 8388608B
ram:
  base: 541065216
  size: 262144B
peripherals:
