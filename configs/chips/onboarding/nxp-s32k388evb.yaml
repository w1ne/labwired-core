#
# Bounded profile for the imported S32K388EVB-Q172 descriptor.
#
# This execution profile claims the implemented Cortex-M7 core and memory
# windows only. The imported peripheral list contained zero-answering stubs;
# peripheral behavior is outside this smoke. Memory map and CM7_0 reset
# handoff follow the S32K388 profile and RTD linker map.
name: "nxp-s32k388evb"
arch: "arm"
core: "cortex-m7"
cpu_hz: 48_000_000

flash:
  base: 0x00400000
  size: "8192KB"
ram:
  base: 0x20400000
  size: "768KB"
memory_regions:
  - name: "itcm"
    base: 0x00000000
    size: "32KB"
  - name: "dtcm"
    base: 0x20000000
    size: "64KB"
flash_boot_alias: false
reset_vector_offset: 0x1000
peripherals: []
