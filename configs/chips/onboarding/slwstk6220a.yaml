name: slwstk6220a
arch: arm
# SLWSTK6220A (EZR32 Wonder Gecko 868 MHz kit). Renode
# platforms/boards/silabs/slwstk6220a.repl is ezr32wg330.repl plus LEDs and
# buttons on the GPIO port and an SI7021 on i2c0, so the chip surface is the
# ezr32wg330 onboarding profile, included whole. The SI7021 is not declared
# (I2C0 has no model here).
include: ezr32wg330.yaml
