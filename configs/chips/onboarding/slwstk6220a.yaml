# Bounded profile for the imported SLWSTK6220A board. The imported board
# description identifies a Cortex-M4F core. Preserve the imported code and RAM
# windows, and expose only UART0, the peripheral exercised by this smoke.
# Other generated board peripherals remain unclaimed until they are tested.
name: slwstk6220a
arch: arm
core: cortex-m4f
flash:
  base: 134217728
  size: 262144B
ram:
  base: 536870912
  size: 32768B
peripherals:
- id: uart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073799168
