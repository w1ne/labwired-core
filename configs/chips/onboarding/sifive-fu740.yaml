# Narrowed FU740 profile for the imported Renode system.
# Renode's sifive-fu740.repl configures the S7 hart as rv64imac, maps its 8 KiB
# DTIM at 0x01000000, DDR at 0x80000000, and SiFive UART0 at 0x10010000. The
# engine profile runs that one hart with a bounded DDR window. The four U74
# harts, interrupt controllers, GPIO, Ethernet, I2C, and QSPI behavior are
# outside this smoke profile.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/sifive-fu740.repl

name: "sifive-fu740"
arch: "riscv"
core: "rv64imac"

# The loader's code-image aperture overlays plain Renode DTIM memory; no flash
# controller behavior is modeled.
flash: { base: 0x01000000, size: "8KiB" }
ram: { base: 0x80000000, size: "128KiB" }
flash_boot_alias: false

peripherals:
  - id: "uart0"
    type: "sifive_uart"
    base_address: 0x10010000
    size: "4KB"
