# Bounded imported Colibri VF61 Cortex-M4 profile. Renode's Vybrid platform
# maps on-chip OCRAM at 0x3F000000; the Cortex-A5, boot ROM, aliases, DDR, and
# peripherals are omitted. Firmware is loaded directly into OCRAM.
name: colibri-vf61
arch: arm
core: cortex-m4
flash: { base: 0, size: 0 }
ram: { base: 0x3F000000, size: 512KiB }
flash_boot_alias: false
peripherals: []
