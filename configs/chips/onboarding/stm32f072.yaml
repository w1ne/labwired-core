# STM32F072 (Cortex-M0) profile for the imported Renode platform
# (platforms/cpus/stm32f072.repl, which pulls in stm32f0.repl).
#
# Memory: Renode maps 128 KiB flash at 0x08000000 and 16 KiB SRAM at
# 0x20000000 — the STM32F072xB. Bases, IRQ numbers and register layouts
# follow RM0091 and ST's CMSIS `stm32f072xb.h` (cmsis-device-f0). Where the
# Renode .repl and the header disagree, the header wins:
# - Renode's DMA has 5 channels (the F03x/F04x count); the F072 has 7
#   (DMA1_Channel7 in stm32f072xb.h), wired 1 -> 9, 2..3 -> 10, 4..7 -> 11.
# - Renode leaves I2C1/I2C2 without an NVIC line; they are 23 and 24 (one
#   combined event + error line each on the F0).
# - Renode gives GPIOF the PA reset values; RM0091 §8.4.1 resets only port A
#   to 0x28000000 / 0x24000000.
#
# Claimed and exercised by examples/renode-onboarding/stm32f072-smoke.yaml and
# stm32f072b_discovery-smoke.yaml:
# RCC (the F0 map, clock gates enforced), USART1..4 ("v2" ISR/RDR/TDR
# layout), GPIOA..F, SYSCFG EXTICR + EXTI lines 0..15 on the grouped
# vectors, TIM1/2/3/6/7/14/15/16/17 (update line; TIM2 is 32-bit), SPI1/SPI2
# (the FIFO SPI with CR2.DS / FRXTH, master), I2C1 (the "v2" TIMINGR/ISR I2C,
# master), DMA1 (7 channels, SPI1 requests on 2/3) and CRC. Also the ADC
# (the CHSELR block, `profile: stm32f0`: calibration, single sequence in
# both scan directions, 12/8-bit, EOC/EOS/OVR/AWD on ADC1_COMP_IRQn = 12,
# DMA1 channel 1, the internal TS on IN16 and V_REFINT on IN17).
# SysTick is a Cortex-M core peripheral at 0xE000E010 and raises system
# exception 15 directly; it is not an external NVIC line.
#
# Not claimed: ADC hardware triggers (EXTSEL), auto-off/wait modes, CAN, RTC, I2C2 data path, SPI I2S mode, DAC, USB, TSC, CEC, COMP,
# CRS, IWDG/WWDG, FLASH interface, PWR and the EXTI lines 16..31.
name: stm32f072
arch: arm
core: cortex-m0
# STM32F072 maximum core clock, 48 MHz (DS9826). Without PLL setup the
# part runs on HSI (8 MHz); the engine times everything at cpu_hz.
cpu_hz: 48_000_000
flash:
  base: 0x08000000
  size: 128KB
ram:
  base: 0x20000000
  size: 16KB
peripherals:
- id: systick
  type: systick
  base_address: 0xE000E010
  size: 16B
# --- RCC (RM0091 §6.4: CR/CFGR/CIR/APB2RSTR/APB1RSTR/AHBENR/APB2ENR/APB1ENR..)
- id: rcc
  type: rcc
  base_address: 0x40021000
  size: 1KB
  config:
    profile: stm32f0
# --- USART ("v2": CR1/CR2/CR3/BRR/.../ISR 0x1C/ICR/RDR 0x24/TDR 0x28) ------
# USART3 and USART4 share USART3_4_IRQn = 29 on the F072.
- id: usart1
  type: uart
  base_address: 0x40013800
  size: 1KB
  irq: 27
  clock: { reg: apb2enr, bit: 14 }
  config:
    profile: stm32v2
- id: usart2
  type: uart
  base_address: 0x40004400
  size: 1KB
  irq: 28
  clock: { reg: apb1enr, bit: 17 }
  config:
    profile: stm32v2
- id: usart3
  type: uart
  base_address: 0x40004800
  size: 1KB
  irq: 29
  clock: { reg: apb1enr, bit: 18 }
  config:
    profile: stm32v2
- id: usart4
  type: uart
  base_address: 0x40004C00
  size: 1KB
  irq: 29
  clock: { reg: apb1enr, bit: 19 }
  config:
    profile: stm32v2
# --- GPIO (AHB2 at 0x48000000; clocks AHBENR.IOPAEN..IOPFEN = bits 17..22) --
# Ids are the port letters so EXTI can address the pads; Renode calls them
# gpioPortA..F. PA13/PA14 come up as SWD (AF) with pull-up/pull-down.
- id: gpioa
  type: gpio
  base_address: 0x48000000
  size: 1KB
  clock: { reg: ahbenr, bit: 17 }
  config:
    profile: stm32v2
    reset_moder: 0x28000000
    reset_pupdr: 0x24000000
- id: gpiob
  type: gpio
  base_address: 0x48000400
  size: 1KB
  clock: { reg: ahbenr, bit: 18 }
  config:
    profile: stm32v2
- id: gpioc
  type: gpio
  base_address: 0x48000800
  size: 1KB
  clock: { reg: ahbenr, bit: 19 }
  config:
    profile: stm32v2
- id: gpiod
  type: gpio
  base_address: 0x48000C00
  size: 1KB
  clock: { reg: ahbenr, bit: 20 }
  config:
    profile: stm32v2
- id: gpioe
  type: gpio
  base_address: 0x48001000
  size: 1KB
  clock: { reg: ahbenr, bit: 21 }
  config:
    profile: stm32v2
- id: gpiof
  type: gpio
  base_address: 0x48001400
  size: 1KB
  clock: { reg: ahbenr, bit: 22 }
  config:
    profile: stm32v2
# --- SYSCFG / EXTI ----------------------------------------------------------
# CFGR1 / EXTICR1..4 / CFGR2 (peripherals/syscfg.rs Stm32F0Syscfg). The F0
# EXTICRx port codes are by letter, A..F = 0..5 (stm32f072xb.h
# SYSCFG_EXTICR1_EXTI0_PF = 5). The CFGR1 DMA remap bits are register state
# only: DMA1 keeps the reset request table below.
- id: syscfg
  type: syscfg
  base_address: 0x40010000
  size: 1KB
  clock: { reg: apb2enr, bit: 0 }
  config:
    profile: stm32f0
# IMR/EMR/RTSR/FTSR/SWIER/PR at 0x00..0x14. The Cortex-M0 grouped vectors
# EXTI0_1 = 5, EXTI2_3 = 6, EXTI4_15 = 7 are the `stm32l0` routing.
- id: exti
  type: exti
  base_address: 0x40010400
  size: 1KB
  config:
    profile: stm32l0
    lines: 32
# --- Timers -----------------------------------------------------------------
# RM0091 §13..§17. `irq` is the line the update interrupt raises: TIM1 on
# TIM1_BRK_UP_TRG_COM_IRQn = 13, TIM6 on TIM6_DAC_IRQn = 17. TIM2 is the
# only 32-bit counter.
- id: tim1
  type: timer
  base_address: 0x40012C00
  size: 1KB
  irq: 13
  clock: { reg: apb2enr, bit: 11 }
  config:
    advanced: true
- id: tim2
  type: timer
  base_address: 0x40000000
  size: 1KB
  irq: 15
  clock: { reg: apb1enr, bit: 0 }
  config:
    width: 32
- id: tim3
  type: timer
  base_address: 0x40000400
  size: 1KB
  irq: 16
  clock: { reg: apb1enr, bit: 1 }
- id: tim6
  type: timer
  base_address: 0x40001000
  size: 1KB
  irq: 17
  clock: { reg: apb1enr, bit: 4 }
  config:
    basic: true
- id: tim7
  type: timer
  base_address: 0x40001400
  size: 1KB
  irq: 18
  clock: { reg: apb1enr, bit: 5 }
  config:
    basic: true
- id: tim14
  type: timer
  base_address: 0x40002000
  size: 1KB
  irq: 19
  clock: { reg: apb1enr, bit: 8 }
- id: tim15
  type: timer
  base_address: 0x40014000
  size: 1KB
  irq: 20
  clock: { reg: apb2enr, bit: 16 }
- id: tim16
  type: timer
  base_address: 0x40014400
  size: 1KB
  irq: 21
  clock: { reg: apb2enr, bit: 17 }
- id: tim17
  type: timer
  base_address: 0x40014800
  size: 1KB
  irq: 22
  clock: { reg: apb2enr, bit: 18 }
# --- SPI (RM0091 §28: the FIFO SPI, CR2.DS[11:8] + FRXTH) -------------------
# DR is 16 bits wide and packs two frames when DS <= 8 bits, so 8-bit
# firmware must use byte accesses.
- id: spi1
  type: spi
  base_address: 0x40013000
  size: 1KB
  irq: 25
  clock: { reg: apb2enr, bit: 12 }
  config:
    profile: stm32_fifo
- id: spi2
  type: spi
  base_address: 0x40003800
  size: 1KB
  irq: 26
  clock: { reg: apb1enr, bit: 14 }
  config:
    profile: stm32_fifo
# --- I2C ("v2" TIMINGR/ISR/ICR/RXDR/TXDR IP, RM0091 §26) --------------------
# One combined event + error line per controller.
- id: i2c1
  type: i2c
  base_address: 0x40005400
  size: 1KB
  irq: 23
  clock: { reg: apb1enr, bit: 21 }
  config:
    profile: stm32l4
# --- DMA1 (7-channel ISR/IFCR/CCRx layout, RM0091 §10) ----------------------
# Lines DMA1_Channel1 = 9, DMA1_Channel2_3 = 10, DMA1_Channel4_5_6_7 = 11.
# Default (CFGR1 remap bits clear) requests from RM0091 Table 30: SPI1_RX
# ch2, SPI1_TX ch3, SPI2_RX ch4, SPI2_TX ch5.
- id: dma1
  type: dma
  base_address: 0x40020000
  size: 1KB
  clock: { reg: ahbenr, bit: 0 }
  config:
    channel_irqs: [9, 10, 10, 11, 11, 11, 11]
    requests:
      adc_rx: 1
      spi1_rx: 2
      spi1_tx: 3
      spi2_rx: 4
      spi2_tx: 5
# --- CRC (DR/IDR/CR/INIT; the F07x adds POL, Renode `configurablePoly`) ------
- id: crc
  type: crc
  base_address: 0x40023000
  size: 1KB
  clock: { reg: ahbenr, bit: 6 }
# --- ADC (RM0091 §13: ISR/IER/CR/CFGR1/CFGR2/SMPR/TR/CHSELR/DR, CCR at
# +0x308). ADC1_COMP_IRQn = 12; DMA1 channel 1 without the SYSCFG
# ADC_DMA_RMP remap.
- id: adc
  type: adc
  base_address: 0x40012400
  size: 1KB
  irq: 12
  clock: { reg: apb2enr, bit: 9 }
  config:
    profile: stm32f0
