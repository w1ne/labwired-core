# Narrowed imported STM32F072 execution profile for the RCC/GPIOA/USART1 smoke.
# The memory ranges are bounded fixture windows, not density claims.
name: stm32f072
arch: arm
flash:
  base: 134217728
  size: 32768B
ram:
  base: 536870912
  size: 6144B
peripherals:
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 1207959552
  config:
    profile: stm32v2
- id: rcc
  type: rcc
  bus: sysbus
  base_address: 1073876992
  config:
    profile: stm32f0
- id: usart1
  type: uart
  bus: sysbus
  base_address: 1073821696
  config:
    profile: stm32v2
