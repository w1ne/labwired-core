name: litex_microwatt
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 16777216
  size: 4096B
# Simulation-only co-simulation endpoint. The imported LiteX/Microwatt profile
# has no modeled GPIO fabric or ADC, so these are not physical pads or MMIO.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: uart
  type: litex_uart64
  bus: sysbus
  base_address: 3221231616
- id: timer0
  type: litex_timer64
  bus: sysbus
  base_address: 3221233664
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
