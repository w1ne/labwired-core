name: litex_microwatt
# Renode models this as a 64-bit OpenPOWER (Microwatt) platform. The engine has no core for it,
# so the chip is refused rather than run as a Cortex-M.
arch: unknown
flash:
  base: 536870912
  size: 1048576
ram:
  base: 16777216
  size: 4096B
peripherals:
- id: uart
  type: litex_uart64
  bus: sysbus
  base_address: 3221231616
- id: timer0
  type: litex_timer64
  bus: sysbus
  base_address: 3221233664
