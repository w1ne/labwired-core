# Conservative SAM4S family profile for the imported Renode CPU description.
# The memory windows use the smallest SAM4S2 variant (128 KiB flash / 64 KiB
# SRAM); the smoke exercises only the common Cortex-M4, PMC and UART0 path.
# Other family variants have larger memories and remain outside this profile.
# Sources: Atmel-11100 SAM4S datasheet, configuration tables and memory map;
# Renode platforms/cpus/sam4s.repl.
name: sam4s
arch: arm
core: cortex-m4
flash:
  base: 4194304
  size: 131072B
ram:
  base: 536870912
  size: 65536B
peripherals:
- id: pmc
  type: sam4s_pmc
  bus: sysbus
  base_address: 1074660352
  size: 512
- id: uart0
  type: sam_usart
  bus: sysbus
  base_address: 1074660864
