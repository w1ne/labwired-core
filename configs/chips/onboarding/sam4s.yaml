# SAM4S family row for Renode's generic sam4s.repl, at the smallest
# 100-pin part's geometry (ATSAM4S2C: 128 KiB flash, 64 KiB SRAM). Larger
# family members are their own rows (sam4s16c, sam4s8b).
#
# Declared: the blocks this engine models out of Renode's
# platforms/cpus/sam4s.repl — PMC, UART0/1 and USART0/1 (`sam_usart`),
# PIOA-C (input change interrupt on NVIC 11-13), both SAM_TC blocks
# (`sam4s_tc`), and the system controller's
# WDT, RSTC and EEFC (`sam4s_wdt`/`sam4s_rstc`/`sam4s_eefc`, see
# crates/core/src/peripherals/sam/sysc4s.rs for what each refuses).
# Renode's ADC, DACC, CRCCU, SPI and TWI0/1 have no model here and are not
# declared. USART0 uses NVIC IRQ 14. cpu_hz is the 4 MHz fast-RC clock the
# part resets on.
# Sources: Atmel-11100 SAM4S datasheet (memory map, peripheral identifiers,
# configuration summary); Renode platforms/cpus/sam4s.repl.
name: sam4s
arch: arm
core: cortex-m4
cpu_hz: 4000000
flash:
  base: 0x00400000
  size: 128KB
ram:
  base: 0x20000000
  size: 64KB
peripherals:
- id: tc0_1_2
  type: sam4s_tc
  base_address: 0x40010000
  size: 256
  irq: 23
- id: tc3_4_5
  type: sam4s_tc
  base_address: 0x40014000
  size: 256
  irq: 26
- id: usart0
  type: sam_usart
  base_address: 0x40024000
  irq: 14
- id: usart1
  type: sam_usart
  base_address: 0x40028000
  irq: 15
- id: pmc
  type: sam4s_pmc
  base_address: 0x400E0400
  size: 512
- id: uart0
  type: sam_usart
  base_address: 0x400E0600
  size: 512B
- id: uart1
  type: sam_usart
  base_address: 0x400E0800
  size: 512B
- id: eefc
  type: sam4s_eefc
  base_address: 0x400E0A00
  size: 512
  config:
    flash_bytes: 131072
- id: pioA
  type: sam4s_pio
  base_address: 0x400E0E00
  size: 512B
  irq: 11
- id: pioB
  type: sam4s_pio
  base_address: 0x400E1000
  size: 512B
  irq: 12
- id: pioC
  type: sam4s_pio
  base_address: 0x400E1200
  size: 512B
  irq: 13
- id: rstc
  type: sam4s_rstc
  base_address: 0x400E1400
  size: 16
- id: wdt
  type: sam4s_wdt
  base_address: 0x400E1450
  size: 16
  irq: 4
