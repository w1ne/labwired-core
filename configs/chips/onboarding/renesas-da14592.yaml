  renode_type: renesasda14_gpadc
  bus: sysbus
  base_address: 1342441728
  irq: 25  # GPADC_IRQn (SDK10 DA1459x adc_sample DWARF, Renode nvic_m33@25)
- id: gpio
  type: renesasda14_gpio
