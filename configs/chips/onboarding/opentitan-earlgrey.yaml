# Bounded OpenTitan Earl Grey profile for the imported Renode system. The
# generated import was mislabeled ARM and advertised controller/crypto/I/O
# blocks outside this engine's modeled surface. This profile keeps only the
# RV32IMC execution subset, main flash/SRAM, and the implemented UART0 used by
# the exact-system smoke. It does not claim OpenTitan ROM boot or full Ibex
# RV32IMACB behavior.
name: "opentitan-earlgrey"
arch: "riscv"
core: "rv32imc_zicsr_zifencei"

flash: { base: 0x20000000, size: "1MiB" }
ram: { base: 0x10000000, size: "128KiB" }
flash_boot_alias: false
peripherals:
  - id: "uart0"
    type: "opentitan_uart"
    base_address: 0x40000000
    size: "4KiB"
