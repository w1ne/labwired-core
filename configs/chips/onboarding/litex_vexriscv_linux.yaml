name: litex_vexriscv_linux
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 268435456
  size: 32768B
# Simulation-only co-simulation endpoint. This imported LiteX Linux profile
# does not expose a modeled GPIO fabric or ADC; these channels are not physical
# pads or firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: timer0
  type: litex_timer
  bus: sysbus
  base_address: 4026537984
- id: uart
  type: litex_uart
  bus: sysbus
  base_address: 4026535936
- id: cpu_timer
  type: litex_cputimer
  bus: sysbus
  base_address: 4026533888
- id: spi
  type: stub
  renode_type: litex_spi
  bus: sysbus
  base_address: 4026564608
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
