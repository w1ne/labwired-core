# Bounded direct-ELF RV32IM profile of Renode's Linux-capable LiteX/VexRiscv
# platform. It models the 32 KiB ROM, 32 KiB SRAM, LiteX UART and timer used by
# this bare-metal smoke; Linux boot, DRAM, emulator RAM, CPU timer, and SPI are
# outside this profile. Upstream platform:
# https://github.com/renode/renode/blob/master/platforms/cpus/litex_vexriscv_linux.repl.
name: litex_vexriscv_linux
arch: riscv
core: rv32im
flash:
  # The Renode profile's 32 KiB boot ROM at address zero.
  base: 0
  size: 32768B
flash_boot_alias: false
ram:
  # The Renode profile's 32 KiB SRAM. The Linux DRAM and emulator RAM are
  # intentionally outside this bounded bare-metal smoke profile.
  base: 268435456
  size: 32768B
peripherals:
- id: uart
  type: litex_uart
  bus: sysbus
  base_address: 4026535936
- id: timer0
  type: litex_timer
  bus: sysbus
  base_address: 4026537984
