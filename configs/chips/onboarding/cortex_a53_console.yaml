# Imported Renode Cortex-A53 console target, narrowed to one AArch64 PE and
# its 128 MiB DDR window. The timer, PL011, and virtio console are not modeled
# by this profile and are intentionally omitted.
name: cortex_a53_console
arch: aarch64
core: cortex-a53
flash: { base: 0, size: 0 }
ram: { base: 0x40000000, size: 128MiB }
flash_boot_alias: false
peripherals: []
