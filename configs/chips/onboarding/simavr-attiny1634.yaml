name: simavr-attiny1634
arch: avr
core: avr8
flash:
  base: 0
  size: 16KB
ram:
  base: 256
  size: 1KB
peripherals:
  # This bounded smoke claims only GPIOA/GPIOB. Port C, the PUEx pull-up
  # registers, USART0/1, TWI, SPI, timers, ADC, analog comparator,
  # touch controller and interrupts remain outside this profile.
  - id: portb
    type: avr_gpio
    base_address: 0x0001002B
    size: 3
  - id: porta
    type: avr_gpio
    base_address: 0x0001002F
    size: 3
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_tiny1634.c
  kind: core-model
  license: GPL-3.0
  retrieved: '2026-10-18'
