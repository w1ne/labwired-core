# Exact-import profile for the STM32F4 platform smoke. It claims only the
# Cortex-M4 memory, RCC, USART2, and GPIOA/GPIOD paths exercised by the shared
# F4 register fixture; other imported peripherals are outside this smoke.
name: stm32f4
arch: arm
core: cortex-m4
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: usart2
    type: stm32_uart
    bus: sysbus
    base_address: 0x40004400
    size: 1KB
  - id: gpioPortA
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020000
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: rcc
    type: stm32f4_rcc
    bus: sysbus
    base_address: 0x40023800
    size: 1KB
