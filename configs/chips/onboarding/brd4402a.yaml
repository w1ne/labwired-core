# Narrow profile for the imported BRD4402A system, following Renode's
# brd4402a.repl and efr32xg22.repl memory and USART0 map:
# https://github.com/renode/renode/blob/master/platforms/boards/silabs/brd4402a.repl
# https://github.com/renode/renode/blob/master/platforms/cpus/silabs/efr32s2/efr32xg22.repl
# This exposes the primary Cortex-M33, application flash, SRAM, Series-2 CMU,
# and model-backed USART0 exercised by the smoke. The board GPIO, secondary
# radio sequencer, radio, and other generated peripheral claims are omitted.
# DCDC_IF is a zero-answering Python placeholder and is not advertised here.
name: brd4402a
arch: arm
core: cortex-m33
cpu_hz: 38400000
atomic_register_aliases: efr32s2
flash:
  base: 0x00000000
  size: 0x7E000
ram:
  base: 0x20000000
  size: 0x8000
peripherals:
  - id: cmu
    type: efr32s2_cmu
    bus: sysbus
    base_address: 0x40008000
    size: 16KB
  - id: usart0
    type: efr32s2_usart
    bus: sysbus
    base_address: 0x4005C000
    size: 16KB
    clock: { reg: clken0, bit: 9 }
