name: stm32f412
arch: arm
# Bounded execution windows for the shared F4 smoke, not a full density map.
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
# Retain only the existing model-backed paths exercised by the smoke.
peripherals:
  - id: usart2
    type: stm32_uart
    bus: sysbus
    base_address: 0x40004400
  - id: gpioPortA
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020000
    config:
      profile: stm32v2
  - id: gpioPortD
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020C00
    config:
      profile: stm32v2
  - id: rcc
    type: stm32f4_rcc
    bus: sysbus
    base_address: 0x40023800
