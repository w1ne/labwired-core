name: stm32f412
arch: arm
# Bounded execution windows for the shared F4 smoke, not a full density map.
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
# Retain only the existing model-backed paths exercised by the smoke.
peripherals:
  # The Cortex-M core's architected timer is modeled by the engine and is
  # directly exercised by the PSP SysTick-to-PendSV smoke.
  - id: systick
    type: systick
    bus: sysbus
    base_address: 0xE000E010
    size: 16B
  - id: usart2
    type: stm32_uart
    bus: sysbus
    base_address: 0x40004400
    size: 1KB
  - id: gpioPortA
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020000
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: stm32_gpioport
    bus: sysbus
    base_address: 0x40020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: rcc
    type: stm32f4_rcc
    bus: sysbus
    base_address: 0x40023800
    size: 1KB
    config:
      profile: stm32f4
  # ADC1 IN1 on PA1 is exercised by the exact-import smoke.
  - id: adc1
    type: adc
    bus: sysbus
    base_address: 0x40012000
    size: 1KB
    irq: 18
    clock: { reg: apb2enr, bit: 8 }
    config:
      profile: stm32f4
analog_pins:
  PA1: { peripheral: adc1, channel: 1 }
  PA2: { peripheral: adc1, channel: 2 }
