# Imported STM32L071 family execution profile.
#
# This execution profile maps a 64 KiB flash window and 20 KiB SRAM window;
# the exact density variant is not resolved here. Only peripherals exercised
# by the matching smoke are declared; the original Renode import also listed
# blocks this engine does not model or that the smoke does not exercise.
name: stm32l071
arch: arm
flash:
  base: 134217728
  size: 65536B
ram:
  base: 536870912
  size: 20480B
peripherals:
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 1342177280
  config:
    profile: stm32v2
- id: rcc
  type: stm32l0_rcc
  bus: sysbus
  base_address: 1073876992
- id: usart2
  type: stm32f7_usart
  bus: sysbus
  base_address: 1073759232
