# Imported Renode target `tegra3` (NVIDIA Tegra 3 / Tegra 30), narrowed to what the engine
# executes and the UART smoke exercises: one Cortex-A9 PE on the native
# Cortex-A9 model, a 64 KiB aperture at the SDRAM base 0x00000000, and UARTA
# (16550, polled TX) at 0x70006000. The aperture is a simulator limit, not the
# SDRAM size. The boot ROM, AVP (ARM7), the other A9s, SCU, GIC, timers,
# clock-and-reset, pinmux, the other UARTs, DMA/host1x, USB, SDMMC and the
# display/video blocks are not modeled here and are intentionally omitted.
#
# `dw_apb_uart` selects this engine's existing 32-bit, 4-byte-stride 16550
# register map to match Tegra's reg-shift of 2; it does not claim that the
# Tegra UART is a Synopsys DesignWare device.
name: tegra3
arch: arm
core: cortex-a9
flash: { base: 0, size: 0 }
ram:
  base: 0x00000000
  size: 64KB
flash_boot_alias: false
peripherals:
- id: uarta
  type: ns16550
  base_address: 0x70006000
  size: 256
  config:
    profile: dw_apb_uart
