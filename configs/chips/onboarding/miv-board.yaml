# Bounded imported Mi-V board profile based on Renode's platforms/cpus/miv.repl.
# The smoke exercises the RV32IMAF CPU, documented flash/DDR windows, and
# model-backed CoreUART. GPIOs, timers, CLINT, and PLIC are omitted because
# this run does not exercise them.
# Renode map reference: https://github.com/renode/renode-docs/blob/master/source/basic/machines.md#loading-platforms

name: "miv-board"
arch: "riscv"
core: "rv32imaf_zicsr_zifencei"
cpu_hz: 66_000_000

flash: { base: 0x60000000, size: "256KiB" }
ram: { base: 0x80000000, size: "64MiB" }
flash_boot_alias: false
peripherals:
  - id: "uart"
    type: "miv_coreuart"
    base_address: 0x70001000
    size: "24B"
