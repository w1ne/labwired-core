# Bounded imported Mi-V board profile based on Renode's platforms/cpus/miv.repl.
# The smoke exercises the RV32IMAF CPU, documented flash/DDR windows,
# model-backed CoreUART, CLINT, PLIC and CoreTimers.
# The core decodes the miv.repl CLINT (0x44000000, mtime at the 66 MHz CPU
# clock) and PLIC (0x40000000, sources 1..31, no priority levels) by chip
# name; CoreTimer0/1 drive PLIC sources 30/31. GPIO is omitted.
# Renode map reference: https://github.com/renode/renode-docs/blob/master/source/basic/machines.md#loading-platforms

name: "miv-board"
arch: "riscv"
core: "rv32imaf_zicsr_zifencei"
cpu_hz: 66_000_000

flash: { base: 0x60000000, size: "256KiB" }
ram: { base: 0x80000000, size: "64MiB" }
flash_boot_alias: false
peripherals:
  - id: "uart"
    type: "miv_coreuart"
    base_address: 0x70001000
    size: "24B"
  - id: "timer0"
    type: "miv_coretimer"
    base_address: 0x70003000
    size: "28B"
    irq: 30
  - id: "timer1"
    type: "miv_coretimer"
    base_address: 0x70004000
    size: "28B"
    irq: 31
