# SUPERSEDED: staged onboarding descriptor (its flash at 0x08000000 / 128 KiB
# and 256 KiB RAM do not match SWRU319C Table 4-1). The promoted CC2538 part is
# configs/chips/cc2538sf53.yaml (board: configs/systems/cc2538dk.yaml).
name: cc2538
arch: arm
flash:
  base: 134217728
  size: 131072B
ram:
  base: 536870912
  size: 262144B
peripherals:
- id: uDma
  type: udma
  bus: sysbus
  base_address: 1074786304
- id: uart0
  type: pl011
  bus: sysbus
  base_address: 1073790976
# SMWDTHROSC (SWRU319C §13/§14): Renode splits it into CC2538Watchdog
# @0x400D5000 and CC2538SleepTimer @0x400D5040 -> nvic@145. Our model covers
# the whole block (WDCTL @0x00, ST0-ST3 @0x40), so it sits at the block base.
# The imported `cc2538sleeptimer` spelling was not a model type and fell
# through the fuzzy `contains("timer")` rule onto the STM32 TIMx map.
- id: sleepTimer
  type: cc2538_sleep_timer
  renode_type: cc2538sleeptimer
  bus: sysbus
  base_address: 1074614272
  size: 4KB
  irq: 145
  config:
    clock_hz: 16000000
- id: uart1
  type: pl011
  bus: sysbus
  base_address: 1073795072
- id: gpioA
  type: cc2538_gpio
  bus: sysbus
  base_address: 1074630656
- id: gpioB
  type: cc2538_gpio
  bus: sysbus
  base_address: 1074634752
- id: gpioC
  type: cc2538_gpio
  bus: sysbus
  base_address: 1074638848
- id: gpioD
  type: cc2538_gpio
  bus: sysbus
  base_address: 1074642944
- id: radio
  type: cc2538rf
  bus: sysbus
  base_address: 1074298880
- id: bitband
  type: bitbanding
  bus: sysbus
  base_address: 570425344
- id: crypto
  type: cc2538_cryptoprocessor
  bus: sysbus
  base_address: 1074311168
- id: flashCtrl
  type: cc2538flashcontroller
  bus: sysbus
  base_address: 1074606080
- id: ssi0
  type: cc2538_ssi
  bus: sysbus
  base_address: 1073774592
- id: ssi1
  type: cc2538_ssi
  bus: sysbus
  base_address: 1073778688
