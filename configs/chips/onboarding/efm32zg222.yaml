name: efm32zg222
arch: arm
# Measured onboarding profile: Cortex-M0+, imported flash/RAM, and the modeled
# USART1 console, Series-0 GPIO ports and TIMER0..TIMER1 exercised by the smoke.
# Other blocks Renode's efm32zg222.repl maps (I2C0, LEUART0, USART0) are not
# claimed here because the engine has no model-backed coverage for them.
core: cortex-m0+
flash:
  # EFM32ZG main flash is mapped at 0x00000000 (Renode efm32zg222.repl;
  # EFM32ZG reference manual memory map).
  base: 0
  size: 32768B
ram:
  base: 536870912
  size: 4096B
peripherals:
- id: usart1
  type: efm32_uart
  bus: sysbus
  base_address: 1073792000
  size: 1KB
# Series-0 GPIO ports A..F (Renode: one `GPIOPort.EFMGPIOPort` at
# 0x40006000). GPIO_P_TypeDef at a 0x24 stride (Gecko SDK efm32zg_gpio_p.h).
# Register sets exist for all six ports; which pins are bonded out on this
# package is not modelled. The block head from 0x40006100 (EXTI, ROUTE,
# INSENSE, EM4 wake) is NOT mapped: no model behind it.
- id: gpioa
  type: efm32s0_gpioport
  base_address: 0x40006000
  size: 36B
- id: gpiob
  type: efm32s0_gpioport
  base_address: 0x40006024
  size: 36B
- id: gpioc
  type: efm32s0_gpioport
  base_address: 0x40006048
  size: 36B
- id: gpiod
  type: efm32s0_gpioport
  base_address: 0x4000606c
  size: 36B
- id: gpioe
  type: efm32s0_gpioport
  base_address: 0x40006090
  size: 36B
- id: gpiof
  type: efm32s0_gpioport
  base_address: 0x400060b4
  size: 36B
# TIMER0..TIMER1 (Renode: `Timers.Efm32Timer`), IRQs from efm32zg222.repl
# (and EFM32ZG IRQn_Type: TIMER0 2, TIMER1 7).
# Counts CPU cycles / 2^PRESC; the CMU HFPERCLKEN0 gate is not modelled.
- id: timer0
  type: efm32s0_timer
  base_address: 0x40010000
  size: 1KB
  irq: 2
- id: timer1
  type: efm32s0_timer
  base_address: 0x40010400
  size: 1KB
  irq: 7
