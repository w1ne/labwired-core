# Narrow execution profile for the imported Renode R7FA8M1A system.
# These CPU and memory windows match the model-backed RA8M1 profile in
# configs/chips/r7fa8m1ah.yaml. Peripherals are omitted until exercised here.
name: renesas-r7fa8m1a
arch: arm
core: cortex-m85
cpu_hz: 8000000
flash:
  base: 0x02000000
  size: 2048KB
ram:
  base: 0x22000000
  size: 896KB
memory_regions:
  - name: itcm
    base: 0x00000000
    size: 64KB
  - name: dtcm
    base: 0x20000000
    size: 64KB
  - name: data_flash
    base: 0x27000000
    size: 12KB
    erased: true
peripherals: []
