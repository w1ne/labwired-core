name: simavr-atmega128rfa1
arch: avr
core: avr8
flash:
  base: 0
  size: 128KB
ram:
  base: 512
  size: 16KB
peripherals:
  # This bounded smoke claims only GPIOA/GPIOB. PINA..PORTB sit at 0x20..0x25
  # as on the ATmega1281; the CPU owns ports A-G (0x20..0x34) and mirrors them
  # to these windows. Ports C-G are kept by the CPU but not mapped or claimed.
  # The 2.4 GHz transceiver, USARTs, SPI, TWI, timers, ADC, analog comparator,
  # pull-ups, interrupts, EEPROM and the watchdog remain outside this profile.
  - id: portb
    type: avr_gpio
    base_address: 0x00010023
    size: 3
  - id: porta
    type: avr_gpio
    base_address: 0x00010020
    size: 3
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_mega128rfa1.c
  kind: core-model
  license: GPL-3.0
  retrieved: '2026-10-18'
