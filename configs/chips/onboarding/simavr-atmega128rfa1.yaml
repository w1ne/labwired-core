name: simavr-atmega128rfa1
arch: avr
core: avr8
flash:
  base: 0
  size: 128KB
ram:
  base: 512
  size: 16KB
# Register map checked against avr-libc 2.0.0 avr/iom128rfa1.h: PINA..PORTG at
# the ATmega1281's data addresses (0x100..0x10B is empty: no ports H..L), and
# ADCSRB 0x7B, ADCL/ADCH 0x78/0x79, ADCSRA 0x7A, ADMUX 0x7C. LabWired's
# ATmega128RF core owns those registers; each port is mirrored at
# 0x1_0000 + PINx and the ADC input side is millivolts per channel, two bytes
# each, as on configs/chips/atmega1281.yaml. ADC0..7 are PF0..PF7, converted
# against the internal 1.8 V AVDD, 1.5 V or 1.6 V reference (ATmega128RFA1
# datasheet 8266F / ATmega256RFR2 family 8393C, chapter 27). VIL 0.3 / VIH 0.7
# EVDD are the datasheet DC input limits.
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
  - id: "porta"
    type: "avr_gpio"
    base_address: 0x00010020
    size: "3"
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010026
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010029
    size: "3"
  - id: "porte"
    type: "avr_gpio"
    base_address: 0x0001002C
    size: "3"
  - id: "portf"
    type: "avr_gpio"
    base_address: 0x0001002F
    size: "3"
  - id: "portg"
    type: "avr_gpio"
    base_address: 0x00010032
    size: "3"
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010200
    size: "16"
    config:
      channels: 8
analog_pins:
  PF0: { peripheral: adc, channel: 0 }
  PF1: { peripheral: adc, channel: 1 }
  PF2: { peripheral: adc, channel: 2 }
  PF3: { peripheral: adc, channel: 3 }
  PF4: { peripheral: adc, channel: 4 }
  PF5: { peripheral: adc, channel: 5 }
  PF6: { peripheral: adc, channel: 6 }
  PF7: { peripheral: adc, channel: 7 }
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_mega128rfa1.c
  kind: core-model
