# Narrow imported STM32H753 profile used by the Renode onboarding smoke.
# The imported catalogue listed many peripherals that are zero-answering stubs
# in this engine. Only retain the H7 RCC, GPIOB/GPIOD and USART3 surfaces used
# by the shared H7 fixture. The 1 MiB flash window is conservative for this
# generic profile; ST lists 2 MiB for H753xI devices. The RAM window is DTCM.
name: stm32h753
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x58024400
    size: 1KB
    config:
      profile: h7
  - id: gpioPortB
    type: gpio
    base_address: 0x58020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: gpio
    base_address: 0x58020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: usart3
    type: uart
    base_address: 0x40004800
    size: 1KB
    config:
      profile: stm32v2
