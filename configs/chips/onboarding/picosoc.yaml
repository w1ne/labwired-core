name: picosoc
arch: arm
flash:
  base: 16777216
  size: 16777216B
ram:
  base: 1073741824
  size: 262144
# Simulation-only co-simulation endpoint. The imported PicoSoC profile has no
# modeled GPIO fabric or ADC; these channels are not physical pads or
# firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: uart
  type: picosoc_simpleuart
  bus: sysbus
  base_address: 33554436
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
