# Narrow imported simavr ATmega328 profile for the Arduino Uno smoke.
# The imported core descriptor omitted peripherals. Keep only the modeled
# ATmega328P flash/SRAM, GPIOB (D8-D13), and USART0 surfaces exercised here;
# Timer0 used by the Arduino delay implementation is part of the AVR core.
# SPI, TWI, ADC, and other board peripherals are outside this profile.
#
