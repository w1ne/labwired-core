name: ezr32lg330
arch: arm
# Keep only the imported Cortex-M3 memory map and modeled UART0 used by the
# onboarding smoke. Other generated peripheral windows are not claimed.
core: cortex-m3
flash:
  base: 134217728
  size: 262144B
ram:
  base: 536870912
  size: 32768B
peripherals:
- id: uart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073799168
