name: stm32f746
arch: arm
flash:
  base: 134217728
  size: 2097152B
ram:
  base: 536870912
  size: 393216B
# This onboarding profile is intentionally limited to the registers exercised
# by the exact-import Cortex-M7 smoke. Other imported peripherals include
# zero-answering stubs and are not claimed here.
peripherals:
- id: usart1
  type: stm32f7_usart
  bus: sysbus
  base_address: 1073811456
- id: gpioPortI
  type: stm32_gpioport
  bus: sysbus
  base_address: 1073881088
  config:
    profile: stm32v2
- id: rcc
  type: stm32f4_rcc
  bus: sysbus
  base_address: 1073887232
