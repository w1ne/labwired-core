# Bounded direct-ELF profile of Renode's Linux-capable LiteX/VexRiscv SD-card
# platform. It includes the RV32IMA CPU, the sourced 256 MiB DDR window and the
# modeled LiteX UART only. Linux, SD-card, Ethernet, GPIO, SPI, I2C, and other
# imported peripheral claims are outside this smoke profile.
# Upstream: https://github.com/renode/renode/blob/master/platforms/cpus/litex_linux_vexriscv_sdcard.repl
name: litex_linux_vexriscv_sdcard
arch: riscv
core: rv32ima
flash: { base: 0, size: 0 }
flash_boot_alias: false
ram:
  base: 0x40000000
  size: 256MiB
peripherals:
- id: uart
  type: litex_uart
  bus: sysbus
  base_address: 0xF0001000
