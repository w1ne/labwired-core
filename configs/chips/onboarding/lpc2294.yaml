# Imported LPC2294 inventory, narrowed to the engine's generic UART model.
# ARM7TDMI-S, CAN controllers and the LPC timer have no engine model.
name: lpc2294
arch: arm
core: arm7tdmi-s
flash:
  base: 134217728
  size: 65536B
ram:
  base: 536870912
  size: 65536B
peripherals:
- id: uart0
  type: ns16550
  bus: sysbus
  base_address: 3758145536
- id: uart1
  type: ns16550
  bus: sysbus
  base_address: 3758161920
