#
# Bounded ARM7TDMI CPU smoke profile for the imported LPC2294 descriptor.
# It currently claims only bare-metal integer execution; LPC2294 UART, CAN,
# timer and ADC behavior are omitted until they have exact models and smokes.
name: lpc2294
arch: arm
core: arm7tdmi-s
flash:
  base: 134217728
  size: 65536B
ram:
  base: 536870912
  size: 65536B
peripherals: []
