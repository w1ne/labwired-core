# SUPERSEDED: staged onboarding descriptor (its 256 MiB flash at 0x08000000
# and 256 MiB RAM at 0x20000000 are not the SAM E70 map: 2 MiB flash at
# 0x00400000, 384 KiB SRAM at 0x20400000 per Zephyr samx7xx21.dtsi). The
# promoted SAM E70 part is configs/chips/same70q21b.yaml (board:
# configs/systems/sam-e70-xplained.yaml).
name: sam_e70
arch: arm
flash:
  base: 134217728
  size: 268435456B
ram:
  base: 536870912
  size: 268435456B
peripherals:
- id: usart0
  type: sam_usart
  bus: sysbus
  base_address: 1073889280
- id: usart1
  type: sam_usart
  bus: sysbus
  base_address: 1073905664
- id: usart2
  type: sam_usart
  bus: sysbus
  base_address: 1073922048
- id: gem
  type: cadencegem
  bus: sysbus
  base_address: 1074069504
- id: phy
  type: ethernetphysicallayer
  bus: gem
  base_address: 0
- id: trng
  type: sam_trng
  bus: sysbus
  base_address: 1074200576
- id: PMC_SR
  type: pythonperipheral
  bus: sysbus
  base_address: 1074660968
# PIO controllers A-E. Renode's sam_e70 platform leaves PIO out, so the import
# carried none. PIOA..PIOE sit at 0x400E0E00 + 0x200 * n (DS60001527 ch. 32,
# Zephyr samx7x.dtsi), with the SAM4S PIO register layout (PIO_PDSR @0x3C), so
# they run on `sam4s_pio` as in the promoted configs/chips/same70q21b.yaml.
# PMC_PCER0 clock gating of the PIO input path is not modelled: PDSR reads the
# pin with the peripheral clock off, where silicon holds the last sampled value.
- id: pioA
  type: sam4s_pio
  bus: sysbus
  base_address: 0x400E0E00
  size: 512B
- id: pioB
  type: sam4s_pio
  bus: sysbus
  base_address: 0x400E1000
  size: 512B
- id: pioC
  type: sam4s_pio
  bus: sysbus
  base_address: 0x400E1200
  size: 512B
- id: pioD
  type: sam4s_pio
  bus: sysbus
  base_address: 0x400E1400
  size: 512B
- id: pioE
  type: sam4s_pio
  bus: sysbus
  base_address: 0x400E1600
  size: 512B
# AFEC0/AFEC1. Renode's sam_e70 platform leaves them out. Bases and IRQs from
# hal_atmel @8f95c79f asf/sam/include/same70b/same70q21b.h (AFEC0 0x4003C000
# IRQ 29, AFEC1 0x40064000 IRQ 40); the register map is component/afec.h, as
# in the promoted configs/chips/same70q21b.yaml. VREFP taken as 3.3 V.
- id: afec0
  type: sam_afec
  base_address: 0x4003C000
  size: 256B
  irq: 29
  config:
    vref_mv: 3300
- id: afec1
  type: sam_afec
  base_address: 0x40064000
  size: 256B
  irq: 40
  config:
    vref_mv: 3300
