# Bounded imported NUCLEO-F767ZI profile for the Cortex-M7 USART1/GPIO smoke.
# Memory follows the Renode STM32F746 CPU map; the wider F767 TCM/backup map
# and unexercised peripherals are not represented by this onboarding profile.
name: nucleo_f767zi
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 2097152B
ram:
  base: 0x20000000
  size: 393216B
peripherals:
- id: usart1
  type: stm32f7_usart
  bus: sysbus
  base_address: 0x40011000
- id: gpioPortI
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x40022000
  config:
    profile: stm32v2
- id: rcc
  type: stm32f4_rcc
  bus: sysbus
  base_address: 0x40023800
provenance:
  generated_by: scripts/onboard_hw_targets.py
