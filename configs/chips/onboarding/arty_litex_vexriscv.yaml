# Narrowed imported Renode profile for the Arty A7 LiteX VexRiscv system.
# The generated descriptor called this ARM and listed MMCM/Ethernet windows
# that this engine does not model. Keep only the RV32IM, memory, UART, timer,
# and Control-and-Status surfaces covered by the exact-import smoke. The
# LiteX SPI-flash controller is included only for the smoke's ID/status probe;
# it does not model flash array reads, program, erase, or BIOS boot.
name: "arty_litex_vexriscv"
arch: "riscv"
core: "rv32im"
cpu_hz: 100_000_000

flash: { base: 0x20000000, size: "32MiB" }
ram: { base: 0x10000000, size: "256KB" }
flash_boot_alias: false
memory_regions:
  - { name: "rom", base: 0x0, size: "256KB" }
peripherals:
  - id: "uart"
    type: "litex_uart"
    base_address: 0x60001800
    size: "2KB"
    irq: 2
  - id: "timer"
    type: "litex_timer"
    base_address: 0x60002800
    size: "2KB"
    irq: 1
  - id: "cas"
    type: "litex_controlandstatus"
    base_address: 0x60006800
    size: "2KB"
    config:
      buttons_active_low: true
  # LiteX SPI-flash bitbang CSRs with the MT25Q ID/status command subset.
  - id: "spi_flash_ctrl"
    type: "litex_spi_flash"
    base_address: 0x60005000
    size: "2KB"
