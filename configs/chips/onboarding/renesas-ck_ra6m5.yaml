# Deliberately narrow Renode onboarding profile. Renode's CK-RA6M5 board
# includes platforms/cpus/renesas-r7fa6m5b.repl (Cortex-M33, 2 MiB code flash
# at 0x0, 512 KiB SRAM at 0x20000000) and wires LEDs to P601/P609/P610 and
# the button to P804. This profile claims only the model-backed SCI0 (classic
# SCI; Renode sets enableFIFO: false, and its RA6M5 tests use sci0 as the
# console), PORT6, PORT8, PFS, FPU context, and the R_MSTP register file
# exercised by the smoke. R_MSTP provides SVD-derived register readback only;
# it does not gate modules. ICU, GPT, AGT, IIC (and the board's I2C sensors), SCI1-9, the
# other ports, data flash and the SYSTEM OSCSF script are not mapped. The
# promoted RA6M5 part with ICU/AGT/GPT and FIFO SCI is configs/chips/r7fa6m5bh.yaml.
# Source: https://github.com/renode/renode/blob/master/platforms/boards/renesas-ck_ra6m5.repl
name: renesas-ck_ra6m5
arch: arm
core: cortex-m33
flash:
  base: 0x00000000
  size: 2MiB
ram:
  base: 0x20000000
  size: 512KiB
peripherals:
  - id: mstp
    type: declarative
    base_address: 0x40084000
    size: 64B
    config:
      path: ../../peripherals/r7fa6m5bh/mstp.yaml
  - id: port6
    type: gpio
    base_address: 0x400800C0
    size: 32B
    config: { profile: ra_port, pad_control: pfs, pad_control_port: 6, swapped_half_aliases: true }
  - id: port8
    type: gpio
    base_address: 0x40080100
    size: 32B
    config: { profile: ra_port, pad_control: pfs, pad_control_port: 8, swapped_half_aliases: true }
  - id: pfs
    type: ra_pfs
    base_address: 0x40080800
    size: 1536B
  - id: sci0
    type: uart
    base_address: 0x40118000
    size: 256B
    config:
      profile: sci
  # FP context registers and CPACR gate used by the scalar FPU smoke; MVFR
  # feature-ID registers remain unmapped.
  - id: fpu
    type: cortex_m_fpu
    base_address: 0xE000EF30
    size: 16B
