# See the LICENSE file in the project root for full license information.

name: mimxrt700_evk
arch: arm
core: cortex-m33
cpu_hz: 237500000
flash:
  # Renode's XIP0 memory mapping; this is not a model of the XSPI controller.
  base: 939524096
  size: 134217728B
ram:
  # CPU0 non-secure SRAM view from Renode's mimxrt798s.repl.
  base: 536870912
  size: 5767168B
peripherals:
  # Renode mimxrt798s.repl flexcomm0 has aliased mappings at 0x40110000 and
  # 0x50110000. The imported CPU0 non-secure profile uses the former. This
  # bounded model implements LP_FLEXCOMM selection/status and its LPUART
  # function; LPI2C and LPSPI transactions are not modelled.
  - id: flexcomm0
    type: imxrt_lpuart
    base_address: 0x40110000
    size: 4KB
    config:
      clock_hz: 80000000
      lp_flexcomm: true
      lp_flexcomm_present: 112
