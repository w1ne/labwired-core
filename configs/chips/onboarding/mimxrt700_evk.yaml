# See the LICENSE file in the project root for full license information.

name: mimxrt700_evk
arch: arm
core: cortex-m33
flash:
  # Renode's XIP0 memory mapping; this is not a model of the XSPI controller.
  base: 939524096
  size: 134217728B
ram:
  # CPU0 non-secure SRAM view from Renode's mimxrt798s.repl.
  base: 536870912
  size: 5767168B
peripherals: []
