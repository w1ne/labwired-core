# Narrow MIMXRT700-EVK profile for Cortex-M33 CPU0 instruction and memory
# execution. Renode's board file maps XIP0 at 0x38000000 (128 MiB); its SoC
# file maps CPU0 non-secure SRAM at 0x20000000 (0x580000 bytes). CPU1, DSPs,
# controllers, and generated peripheral entries are intentionally omitted.
# Sources: https://github.com/renode/renode/blob/master/platforms/boards/mimxrt700_evk.repl
#          https://github.com/renode/renode/blob/master/platforms/cpus/mimxrt798s.repl
# LabWired - Firmware Simulation Platform
# Copyright (C) 2026 Andrii Shylenko
#
