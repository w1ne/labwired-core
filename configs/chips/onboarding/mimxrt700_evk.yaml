name: mimxrt700_evk
arch: arm
# i.MX RT700 CPU0 is a Cortex-M33 (no bit-band), as for imxrt500.
core: cortex-m33
flash:
  base: 939524096
  size: 134217728B
ram:
  base: 939524096
  size: 134217728B
peripherals:
- id: micfil
  type: imxrt700_micfil
  bus: sysbus
  base_address: 1075896320
- id: rstctl1_i3c0
  type: pythonperipheral
  bus: sysbus
  base_address: 1074003984
- id: i3c0_rst_cpu1
  type: pythonperipheral
  bus: sysbus
  base_address: 1073741852
- id: rstctl1_i3c3
  type: pythonperipheral
  bus: sysbus
  base_address: 1074098176
- id: syscon3_nsvtor
  type: pythonperipheral
  bus: sysbus
  base_address: 1074143388
# GPIO0..GPIO7, the compute-domain RGPIO ports at 0x4010_0000 + 0x2000 * n
# (non-secure alias; MIMXRT798S_cm33_core0_COMMON.h GPIOn_BASE_NS, Zephyr
# nxp_rt7xx_cm33_cpu0.dtsi gpio@100000..10e000). Renode's RT700 map declares
# no GPIO. The RGPIO block puts VERID/PARAM/LOCK/PCNS/ICNS/PCNP/ICNP at
# 0x00..0x1C and the Kinetis data registers 0x40 higher: PDOR @0x40,
# PSOR/PCOR/PTOR @0x44..0x4C, PDIR @0x50, PDDR @0x54 (RT700 PERI_GPIO.h
# GPIO_Type; Zephyr drives it with gpio_mcux.c as `nxp,kinetis-gpio`). Each
# window therefore starts at port base + 0x40 on `profile: kinetis`. Not
# modelled: the 0x00..0x3C header (unmapped), PIDR @0x58 (input disable),
# the PDR pin-data bytes @0x60, ICR/GICLR/GICHR/ISFR from 0x80, IOPCTL pad
# config (IBENA, pulls) and the CLKCTL0 GPIO clock gates, so PDIR reads the
# pad regardless. GPIO8..10 belong to the CPU1 sense domain and are not
# declared.
- id: gpio0
  type: gpio
  bus: sysbus
  base_address: 0x40100040
  size: 64B
  config:
    profile: kinetis
- id: gpio1
  type: gpio
  bus: sysbus
  base_address: 0x40102040
  size: 64B
  config:
    profile: kinetis
- id: gpio2
  type: gpio
  bus: sysbus
  base_address: 0x40104040
  size: 64B
  config:
    profile: kinetis
- id: gpio3
  type: gpio
  bus: sysbus
  base_address: 0x40106040
  size: 64B
  config:
    profile: kinetis
- id: gpio4
  type: gpio
  bus: sysbus
  base_address: 0x40108040
  size: 64B
  config:
    profile: kinetis
- id: gpio5
  type: gpio
  bus: sysbus
  base_address: 0x4010A040
  size: 64B
  config:
    profile: kinetis
- id: gpio6
  type: gpio
  bus: sysbus
  base_address: 0x4010C040
  size: 64B
  config:
    profile: kinetis
- id: gpio7
  type: gpio
  bus: sysbus
  base_address: 0x4010E040
  size: 64B
  config:
    profile: kinetis
# LPADC0 on `nxp_lpadc` with the RT700 `ctype_mode` layout (CMDL.CTYPE/MODE,
# two triggers, CAL_REQ/CALOFS). mcux-devices-rt MIMXRT798S_cm33_core0_COMMON.h
# ADC0_BASE_NS 0x4020C000 (secure 0x5020C000), ADC_IRQn 15; resets from
# mcux-soc-svd MIMXRT798S_cm33_core0.xml. VREFH 1.8 V is an assumption carried
# over from the RT500 EVK: no RT700 board file states vref-mv.
- id: adc0
  type: nxp_lpadc
  base_address: 0x4020C000
  size: 4KB
  irq: 15
  config:
    layout: ctype_mode
    vref_mv: 1800
# A-side LPADC0 pads, hal_nxp @cc9b44ae MIMXRT798SGFOB-pinctrl.h (ADC0_CHn on
# PIO10_x); the EVK routes CH0A/CH1A (Zephyr mimxrt700_evk pinmux_lpadc0 and
# the adc_api overlay). ADC0_CH18..22 and the second ADC0_CH0 on PIO10_15 are
# left out: the header does not say which side they sit on.
analog_pins:
  PIO10_0:  { peripheral: adc0, channel: 0 }   # ADC0_CH0 = CH0A
  PIO10_2:  { peripheral: adc0, channel: 1 }   # ADC0_CH1 = CH1A
  PIO10_4:  { peripheral: adc0, channel: 2 }   # ADC0_CH2 = CH2A
  PIO10_12: { peripheral: adc0, channel: 4 }   # ADC0_CH4 = CH4A
  PIO10_14: { peripheral: adc0, channel: 5 }   # ADC0_CH5 = CH5A
