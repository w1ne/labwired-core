name: imxrt1064
arch: arm
core: cortex-m7
cpu_hz: 600000000
# The smoke image runs from DTCM. Split the executable window from the stack
# window to match the existing i.MX RT bare-metal fixture; this does not claim
# FlexSPI XIP or the RT1064's integrated flash behavior.
flash:
  base: 536870912
  size: 65536B
ram:
  base: 536936448
  size: 65536B
flash_boot_alias: false
peripherals:
- id: ccm
  type: imx_ccm
  bus: sysbus
  base_address: 1074774016
- id: gpio2
  type: gpio
  bus: sysbus
  base_address: 1075560448
  size: 256
  config:
    profile: imxrt
- id: lpuart6
  type: nxp_lpuart
  bus: sysbus
  base_address: 1075412992
  size: 4096
