name: arduino_nano_33_ble
arch: arm
flash:
  base: 0
  size: 1048576B
ram:
  base: 536870912
  size: 262144B
# The imported LSM9DS1 and bus-attached LED entries are zero-answering stubs.
# Keep this profile to the real memory map and model-backed smoke surface.
peripherals:
- id: uart0
  type: nrf52840_uart
  bus: sysbus
  base_address: 1073750016
- id: gpio0
  type: nrf52840_gpio
  bus: sysbus
  base_address: 1342177280
