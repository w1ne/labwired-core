name: eos-s3
arch: arm
flash:
  base: 134217728
  size: 524288B
ram:
  base: 1073803264
  size: 4096B
peripherals:
# EOS S3 GPIO 0..7 input: EOSS3_IntrCtrl's "misc" region at 0x4000_5100
# (Renode platforms/cpus/eos-s3.repl), IO_INPUT @+0x0. The import dropped
# that multi-region registration, so no GPIO reached this profile.
- id: io_in
  type: declarative
  bus: sysbus
  base_address: 1073762560
  size: 4B
  config:
    path: ../../peripherals/eoss3/io_in.yaml
- id: uart
  type: pl011
  bus: sysbus
  base_address: 1073807360
- id: dwt
  type: dwt
  bus: sysbus
  base_address: 3758100480
- id: spt
  type: eoss3_simpleperiodictimer
  bus: sysbus
  base_address: 1073765376
# EOS S3 ADC ("JTM", AON_PERIPH_BASE + 0x5A00, qorc-sdk eoss3_dev.h):
# OUT/STATUS/CONTROL, two channels, 12 bits against 1.4 V.
- id: adc
  type: eoss3_adc
  renode_type: eoss3_adc
  bus: sysbus
  base_address: 1073764864
- id: spi
  type: stub
  renode_type: designware_spi
  bus: sysbus
  base_address: 1073770496
- id: dmaSpi
  type: stub
  renode_type: eoss3_spi_dma
  bus: sysbus
  base_address: 1073771520
- id: packetFifo
  type: stub
  renode_type: eoss3_packetfifo
  bus: sysbus
  base_address: 1073750016
- id: systemDma
  type: udma
  bus: sysbus
  base_address: 1073790976
- id: systemDmaBridge
  type: eoss3_systemdmabridge
  bus: sysbus
  base_address: 1073795072
- id: ffe
  type: stub
  renode_type: eoss3_flexiblefusionengine
  bus: sysbus
  base_address: 1074044928
- id: i2cMaster0
  type: opencoresi2c
  bus: ffe
  base_address: 0
- id: i2cMaster1
  type: opencoresi2c
  bus: ffe
  base_address: 1
- id: voice
  type: stub
  renode_type: eoss3_voice
  bus: sysbus
  base_address: 1073827840
- id: powerMgmt
  type: pythonperipheral
  bus: sysbus
  base_address: 1073759232
