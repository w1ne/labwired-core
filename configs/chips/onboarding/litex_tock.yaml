name: litex_tock
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 16777216
  size: 8192B
peripherals:
# Renode's LiteX_ControlAndStatus, which the Renode CPU litex_tock.repl binds
# at sysbus 0x6000_6800 (0xE000_6800 shadow, not modelled): LEDs on pads
# 0..31, switches 32..63 (Switches CSR @0x04), buttons 64..95 (@0x08). The
# led/switch/button entries below hang off this block as `bus: cas`. The
# Arty's push-buttons pull the line low, as in configs/chips/arty-litex-vexriscv.yaml.
- id: cas
  type: litex_controlandstatus
  bus: sysbus
  base_address: 1610639360
  size: 2KB
  config:
    buttons_active_low: true
- id: uart
  type: litex_uart
  bus: sysbus
  base_address: 2181046272
- id: phy
  type: ethernetphysicallayer
  bus: eth
  base_address: 0
- id: timer0
  type: litex_timer_csr32
  bus: sysbus
  base_address: 2181048320
- id: led0
  type: led
  bus: cas
  base_address: 0
- id: led1
  type: led
  bus: cas
  base_address: 1
- id: led2
  type: led
  bus: cas
  base_address: 2
- id: led3
  type: led
  bus: cas
  base_address: 3
- id: switch0
  type: button
  bus: cas
  base_address: 32
- id: switch1
  type: button
  bus: cas
  base_address: 33
- id: switch2
  type: button
  bus: cas
  base_address: 34
- id: switch3
  type: button
  bus: cas
  base_address: 35
- id: button0
  type: button
  bus: cas
  base_address: 64
- id: button1
  type: button
  bus: cas
  base_address: 65
- id: button2
  type: button
  bus: cas
  base_address: 66
- id: button3
  type: button
  bus: cas
  base_address: 67
