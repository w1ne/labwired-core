# Narrowed from Renode's platforms/cpus/litex_tock.repl.
# This profile covers the RV32IMAC CPU, flash/RAM windows, and LiteX UART used
# by the direct-ELF smoke. It omits the unexercised Ethernet, timer, SPI flash,
# GPIO, and button surfaces.
name: litex_tock
arch: riscv
core: rv32imac
cpu_hz: 100_000_000
flash:
  base: 0x20000000
  size: "32MB"
ram:
  base: 0x01000000
  size: "8KB"
memory_regions:
  - name: rom
    base: 0x00000000
    size: "44KB"
flash_boot_alias: false
peripherals:
  - id: uart
    type: litex_uart
    base_address: 0x82002000
    size: "2KB"
