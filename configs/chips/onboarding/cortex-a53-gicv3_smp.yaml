#
# Imported Renode target `cortex-a53-gicv3_smp`, narrowed to one of the four
# Cortex-A53 PEs, the imported DDR window at 0x40000000 and the PL011 UART0 at
# 0x09000000 (generic UART engine, PL011 layout: polled TX via UARTFR/UARTDR).
# The other three PEs, the four generic timers, GICv3 and PL031 RTC from the
# import are not modeled and are intentionally omitted.
name: cortex-a53-gicv3_smp
arch: aarch64
core: cortex-a53
flash: { base: 0, size: 0 }
ram: { base: 0x40000000, size: 2GiB }
flash_boot_alias: false
peripherals:
- id: uart0
  type: uart
  base_address: 0x09000000
  size: 4096
  config:
    profile: "pl011"
