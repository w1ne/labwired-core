#
# Bounded Renode import: one AArch64 Cortex-A53 processing element and DDR.
# SMP, GICv3, generic timers, PL011, and PL031 remain outside this profile.

name: cortex-a53-gicv3_smp
arch: aarch64
core: cortex-a53
flash: { base: 0, size: 0 }
ram: { base: 0x40000000, size: 2GiB }
flash_boot_alias: false
peripherals: []
