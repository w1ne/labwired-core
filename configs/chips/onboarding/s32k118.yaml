name: s32k118
arch: arm
core: cortex-m0+
flash:
  base: 0x00000000
  size: 256KB
ram:
  base: 0x20000000
  size: 0x5800
# The generated import mapped the flash to 0x08000000 and exposed zero-answer
# stubs. Keep this execution profile to the Renode S32K118 CPU and upper SRAM
# region used by the smoke (https://github.com/renode/renode/blob/master/platforms/cpus/s32k118.repl);
# peripheral behavior is not claimed here.
peripherals: []
