  renode_type: imxrt_lpspi
  bus: sysbus
  base_address: 1073922048
- id: lpspi1
  type: stub
  renode_type: imxrt_lpspi
  bus: sysbus
  base_address: 1073926144
- id: lpuart0
  type: nxp_lpuart
  bus: sysbus
  base_address: 1074176000
- id: lpuart1
  type: nxp_lpuart
  bus: sysbus
  base_address: 1074180096
- id: can0_mcr
  type: pythonperipheral
  bus: sysbus
  base_address: 1073889280
- id: lpit
