name: ice40up5k-mdp-evn
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 268435456
  size: 131072B
# Simulation-only co-simulation endpoint. This imported FPGA profile has no
# modeled FPGA GPIO fabric or ADC, so these two input channels are not iCE40
# pads or firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: bmp180
  type: bmp180
  bus: i2c
  base_address: 119
- id: lsm330_a
  type: lsm330_accelerometer
  bus: i2c
  base_address: 24
- id: lsm330_g
  type: lsm330_gyroscope
  bus: i2c
  base_address: 107
- id: lis2ds12
  type: lis2ds12
  bus: i2c
  base_address: 29
- id: lsm303dlhc_a
  type: lsm303dlhc_accelerometer
  bus: i2c
  base_address: 25
- id: lsm303dlhc_g
  type: lsm303dlhc_gyroscope
  bus: i2c
  base_address: 30
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
