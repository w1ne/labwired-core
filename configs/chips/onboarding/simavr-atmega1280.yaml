name: simavr-atmega1280
arch: avr
core: avr8
flash:
  base: 0
  size: 128KB
ram:
  base: 512
  size: 8KB
# Register map checked against avr-libc 2.0.0 avr/iom1280.h: PINx/DDRx/PORTx
# at the same data addresses as LabWired's ATmega1281 core, and ADCL/ADCH
# 0x78/0x79, ADCSRA 0x7A, ADCSRB 0x7B, ADMUX 0x7C. That core owns those
# registers; each port is mirrored at 0x1_0000 + PINx (PIN/DDR/PORT) and the
# ADC input side is millivolts per channel, two bytes each, the same layout
# as configs/chips/atmega2560.yaml. VIL 0.3 VCC / VIH 0.6 VCC are the datasheet
# DC input limits.
gpio_input_thresholds:
  vil: 0.3
  vih: 0.6
peripherals:
  - id: "porta"
    type: "avr_gpio"
    base_address: 0x00010020
    size: "3"
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010026
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010029
    size: "3"
  - id: "porte"
    type: "avr_gpio"
    base_address: 0x0001002C
    size: "3"
  - id: "portf"
    type: "avr_gpio"
    base_address: 0x0001002F
    size: "3"
  - id: "portg"
    type: "avr_gpio"
    base_address: 0x00010032
    size: "3"
  - id: "porth"
    type: "avr_gpio"
    base_address: 0x00010100
    size: "3"
  - id: "portj"
    type: "avr_gpio"
    base_address: 0x00010103
    size: "3"
  - id: "portk"
    type: "avr_gpio"
    base_address: 0x00010106
    size: "3"
  - id: "portl"
    type: "avr_gpio"
    base_address: 0x00010109
    size: "3"
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010200
    size: "32"
    config:
      channels: 16
analog_pins:
  PF0: { peripheral: adc, channel: 0 }
  PF1: { peripheral: adc, channel: 1 }
  PF2: { peripheral: adc, channel: 2 }
  PF3: { peripheral: adc, channel: 3 }
  PF4: { peripheral: adc, channel: 4 }
  PF5: { peripheral: adc, channel: 5 }
  PF6: { peripheral: adc, channel: 6 }
  PF7: { peripheral: adc, channel: 7 }
  PK0: { peripheral: adc, channel: 8 }
  PK1: { peripheral: adc, channel: 9 }
  PK2: { peripheral: adc, channel: 10 }
  PK3: { peripheral: adc, channel: 11 }
  PK4: { peripheral: adc, channel: 12 }
  PK5: { peripheral: adc, channel: 13 }
  PK6: { peripheral: adc, channel: 14 }
  PK7: { peripheral: adc, channel: 15 }
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
