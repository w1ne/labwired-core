# Bounded BeagleV-Fire profile for one PolarFire SoC U54 hart.
#
# Renode's PolarFire SoC description is shared by BeagleV-Fire and Icicle Kit.
# The physical U54 is RV64GC; this measured firmware profile exercises only the
# engine's RV64IMAC subset, one hart, an 8 MiB DDR aperture, L2 LIM, the two
# model-backed MMUARTs used by the direct smoke, and the model-backed
# MSS GPIO_0..2 banks, whose lines reach the in-core PLIC, and the
# master-mode MSS I2C0/1 controllers (PLIC 58/61; `mpfs_i2c`, no slave mode).
# SPI1 startup accesses use an explicit zero-answering stub; it does not
# model that peripheral. The E51, other
# U54 harts, FPGA fabric, and remaining MSS peripherals are outside this profile.
name: "beaglev-fire"
arch: "riscv"
core: "rv64imac"
cpu_hz: 600_000_000
flash: { base: 0x20220000, size: "128KiB" }
ram: { base: 0x80000000, size: "8MiB" }
flash_boot_alias: false
memory_regions:
  - { name: "l2lim", base: 0x08000000, size: "512KiB" }
peripherals:
  # The PLIC at 0x0C000000 is in the RV64 core, like the CLINT
  # (crates/core/src/cpu/riscv64_plic.rs): 186 sources, 9 contexts, this hart
  # on M-mode context 1. A peripheral's `irq` is its PLIC source ID.
  # MSS GPIO_0..2: CoreGPIO semantics on the mss_gpio.h register map
  # (crates/core/src/peripherals/miv.rs). `ports` is the bank width
  # (NB_OF_GPIO_GPIO0/1/2 = 14/24/32 in Microchip's mss_gpio.c). `irq` is
  # each bank's OR'd non-direct line, PLIC sources 51/52/53
  # (PLIC_GPIO*_NON_DIRECT_INT_OFFSET in mss_plic.h; Renode polarfire-soc.repl
  # `IRQ -> plic@51..53`). The per-pin direct sources 13-50 are not wired.
  - id: "mss_gpio0"
    type: "mpfs_gpio"
    base_address: 0x20120000
    size: "4KB"
    irq: 51
    config:
      ports: 14
  - id: "mss_gpio1"
    type: "mpfs_gpio"
    base_address: 0x20121000
    size: "4KB"
    irq: 52
    config:
      ports: 24
  - id: "mss_gpio2"
    type: "mpfs_gpio"
    base_address: 0x20122000
    size: "4KB"
    irq: 53
    config:
      ports: 32
  - id: "i2c0"
    type: "mpfs_i2c"
    base_address: 0x2010A000
    size: "4KB"
    irq: 58
  - id: "i2c1"
    type: "mpfs_i2c"
    base_address: 0x2010B000
    size: "4KB"
    irq: 61
  - id: "spi1"
    type: "stub"
    base_address: 0x20109000
    size: "4KB"
  - id: "mmuart0"
    type: "uart"
    base_address: 0x20000000
    size: "4KB"
    irq: 90
    config:
      profile: "dw_apb_uart"
  - id: "mmuart1"
    type: "uart"
    base_address: 0x20100000
    size: "4KB"
    irq: 91
    config:
      profile: "dw_apb_uart"
