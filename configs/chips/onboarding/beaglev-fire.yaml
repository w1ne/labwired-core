# Bounded BeagleV-Fire profile for one PolarFire SoC U54 hart.
#
# Renode's PolarFire SoC description is shared by BeagleV-Fire and Icicle Kit.
# The physical U54 is RV64GC; this measured firmware profile exercises only the
# engine's RV64IMAC subset, one hart, an 8 MiB DDR aperture, L2 LIM, and the two
# model-backed MMUARTs used by the direct Zephyr smoke. PLIC, GPIO, I2C, and
# SPI startup accesses use explicit zero-answering stubs; they do not model
# those peripherals. The E51, other U54 harts, FPGA fabric, and remaining MSS
# peripherals are outside this profile.
name: "beaglev-fire"
arch: "riscv"
core: "rv64imac"
cpu_hz: 600_000_000
flash: { base: 0x20220000, size: "128KiB" }
ram: { base: 0x80000000, size: "8MiB" }
flash_boot_alias: false
memory_regions:
  - { name: "l2lim", base: 0x08000000, size: "512KiB" }
peripherals:
  - id: "plic"
    type: "stub"
    base_address: 0x0C000000
    size: "65536KB"
  - id: "mss_gpio0"
    type: "stub"
    base_address: 0x20120000
    size: "4KB"
  - id: "mss_gpio1"
    type: "stub"
    base_address: 0x20121000
    size: "4KB"
  - id: "mss_gpio2"
    type: "stub"
    base_address: 0x20122000
    size: "4KB"
  - id: "i2c0"
    type: "stub"
    base_address: 0x2010A000
    size: "4KB"
  - id: "i2c1"
    type: "stub"
    base_address: 0x2010B000
    size: "4KB"
  - id: "spi1"
    type: "stub"
    base_address: 0x20109000
    size: "4KB"
  - id: "mmuart0"
    type: "uart"
    base_address: 0x20000000
    size: "4KB"
    irq: 90
    config:
      profile: "dw_apb_uart"
  - id: "mmuart1"
    type: "uart"
    base_address: 0x20100000
    size: "4KB"
    irq: 91
    config:
      profile: "dw_apb_uart"
