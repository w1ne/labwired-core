# Bounded imported MIMXRT1064-EVK execution profile for the existing M7 smoke.
# The memory windows are DTCM-backed firmware and stack windows, not a complete
# RT1064 flash/SDRAM map. Only the CCM, GPIO2, and LPUART6 paths exercised by
# the smoke are modeled here.
name: mimxrt1064_evk
arch: arm
core: cortex-m7
cpu_hz: 600000000
flash:
  base: 536870912
  size: 65536B
ram:
  base: 536936448
  size: 65536B
flash_boot_alias: false
peripherals:
- id: ccm
  type: imx_ccm
  bus: sysbus
  base_address: 1074774016
- id: gpio2
  type: gpio
  bus: sysbus
  base_address: 1075560448
  size: 256
  config:
    profile: imxrt
- id: lpuart6
  type: nxp_lpuart
  bus: sysbus
  base_address: 1075412992
  size: 4096
