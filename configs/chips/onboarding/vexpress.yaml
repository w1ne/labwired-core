name: vexpress
arch: arm
flash:
  base: 2147483648
  size: 536870912B
ram:
  base: 2147483648
  size: 536870912B
# 0x0 is the V2M legacy map's 64 MiB NOR CS0 alias, not this DRAM. Mirroring
# the 512 MiB image there ran it to 0x2000_0000 and shadowed every
# motherboard peripheral from 0x1000_0000 up with erased-flash 0xFF.
flash_boot_alias: false
peripherals:
- id: uart0
  type: pl011
  bus: sysbus
  base_address: 268472320
- id: uart1
  type: pl011
  bus: sysbus
  base_address: 268476416
- id: uart2
  type: pl011
  bus: sysbus
  base_address: 268480512
- id: uart3
  type: pl011
  bus: sysbus
  base_address: 268484608
- id: timer1
  type: arm_sp804_timer
  bus: sysbus
  base_address: 268505088
- id: timer2
  type: arm_sp804_timer
  bus: sysbus
  base_address: 268509184
# V2M motherboard sysreg at 0x1000_0000 (Linux vexpress-v2m.dtsi sysreg@0,
# legacy map). Renode's ArmSysCtl ran as a zero-reading stub; SYS_MCI @0x048
# is the two-line MMC card-detect / write-protect input port.
- id: sysCtl
  type: declarative
  bus: sysbus
  base_address: 268435456
  size: 4096B
  config:
    path: ../../peripherals/vexpress/sysreg_mci.yaml
- id: pl310
  type: pl310
  bus: sysbus
  base_address: 503357440
- id: pl031
  type: pl031
  bus: sysbus
  base_address: 268529664
- id: usbEhci
  type: isp1761
  bus: sysbus
  base_address: 1325400064
- id: kmi0
  type: pl050
  bus: sysbus
  base_address: 268460032
- id: kmi1
  type: pl050
  bus: sysbus
  base_address: 268464128
- id: usbHub
  type: usbhub
  bus: usbEhci
  base_address: 1
- id: usbMouse
  type: usbmouse
  bus: usbHub
  base_address: 2
- id: usbKeyboard
  type: usbkeyboard
  bus: usbHub
  base_address: 1
- id: controller
  type: emulatorcontroller
  bus: sysbus
  base_address: 536870912
- id: lcd
  type: pl110
  bus: sysbus
  base_address: 268566528
