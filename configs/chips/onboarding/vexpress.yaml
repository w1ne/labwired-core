# Imported Renode target `vexpress` (Arm Versatile Express, CoreTile CA9x4),
# narrowed to what the engine executes and the UART smoke exercises: one
# Cortex-A9 PE on the native Cortex-A9 model, a 64 KiB aperture at the
# imported DRAM base 0x80000000, and motherboard UART0 (PL011, polled TX) at
# 0x10009000. The aperture is a simulator limit, not the DRAM size. The other
# three A9s, SCU, GIC, private/global timers, SP804 timers, SP810, UART1-3,
# LAN9118, MMCI, KMI, CLCD and NOR flash are not modeled here and are
# intentionally omitted.
name: vexpress
arch: arm
core: cortex-a9
flash: { base: 0, size: 0 }
ram:
  base: 0x80000000
  size: 64KB
flash_boot_alias: false
peripherals:
- id: uart0
  type: pl011
  bus: sysbus
  base_address: 0x10009000
  size: 4096
