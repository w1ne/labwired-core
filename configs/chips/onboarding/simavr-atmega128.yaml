name: simavr-atmega128
arch: avr
core: avr8
flash:
  base: 0
  size: 128KB
ram:
  base: 256
  size: 4KB
# Register map checked against avr-libc 2.0.0 avr/iom128.h: the I/O-space map
# LabWired's Atmega128 core runs (AvrModel::Atmega128). ADCL/ADCH 0x24/0x25,
# ADCSRA 0x26, ADMUX 0x27 (no ADCSRB); PINx/DDRx/PORTx ascending at 0x39 (A),
# 0x36 (B), 0x33 (C), 0x30 (D), 0x21 (E), 0x63 (G); port F is split, PINF 0x20
# and DDRF/PORTF 0x61/0x62. SRAM 0x100..0x10FF.
# The CPU owns those registers; each port is mirrored at 0x1_0000 + PINx,
# except port F, which is gathered at 0x1_0100 (PINF, DDRF, PORTF). The ADC
# input side (millivolts per channel, two bytes each) sits at 0x1_0200, clear
# of the port G mirror. ADC0..7 are PF0..PF7.
# VIL 0.2 VCC / VIH 0.6 VCC are the datasheet DC input limits (2467X §28.1).
gpio_input_thresholds:
  vil: 0.2
  vih: 0.6
peripherals:
  - id: "porta"
    type: "avr_gpio"
    base_address: 0x00010039
    size: "3"
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010036
    size: "3"
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010033
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010030
    size: "3"
  - id: "porte"
    type: "avr_gpio"
    base_address: 0x00010021
    size: "3"
  - id: "portf"
    type: "avr_gpio"
    base_address: 0x00010100
    size: "3"
  - id: "portg"
    type: "avr_gpio"
    base_address: 0x00010063
    size: "3"
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010200
    size: "16"
    config:
      channels: 8
analog_pins:
  PF0: { peripheral: adc, channel: 0 }
  PF1: { peripheral: adc, channel: 1 }
  PF2: { peripheral: adc, channel: 2 }
  PF3: { peripheral: adc, channel: 3 }
  PF4: { peripheral: adc, channel: 4 }
  PF5: { peripheral: adc, channel: 5 }
  PF6: { peripheral: adc, channel: 6 }
  PF7: { peripheral: adc, channel: 7 }
provenance:
