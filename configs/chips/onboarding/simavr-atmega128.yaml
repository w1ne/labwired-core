name: simavr-atmega128
arch: avr
core: avr8
flash:
  base: 0
  size: 128KB
ram:
  base: 256
  size: 4KB
peripherals:
  # This bounded smoke claims only GPIOA and polled USART0 TX. Ports B-G,
  # timers, ADC, SPI, TWI, USART1 and interrupts remain outside this profile.
  - id: porta
    type: avr_gpio
    base_address: 0x00010039
    size: 3
  # Host window of the CPU's USART0. ATmega128 UBRR0L/UCSR0B/UCSR0A/UDR0 sit
  # at 0x29..0x2C; the AVR core translates them onto this 328P-layout window.
  - id: usart0
    type: uart
    base_address: 0x000100C0
    size: 8
    config:
      profile: avr
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_mega128.c
  kind: core-model
  license: GPL-3.0
  retrieved: '2026-10-18'
