# Imported Renode target `renesas-rz_t2m_rsk` (RZ/T2M, platforms/cpus/renesas_rz_t2m.repl),
# narrowed to what the engine executes and the SCI smoke exercises: CPU0, one
# Cortex-R52 PE on the native AArch32 Cortex-R52 model (pinned tlib arm64
# target), the 1.5 MiB System RAM at 0x10000000, and SCI0 at 0x80001000 with
# polled TX. Renode's `Renesas_SCI` there is the 32-bit RDR/TDR/CCR0-4/CSR
# register map, which this engine models as `sci_b` (the RA8 SCI_B layout);
# the imported `renesas_sci` type would have selected the classic 8-bit SCI.
# The second R52, ATCM/BTCM, boot ROM, xSPI/flash0, GICv3, generic timer,
# GPIO, SCI1-5 and the clock/module-stop controllers are not modeled here and
# are intentionally omitted; the model does not gate SCI on MSTPCR.
name: renesas-rz_t2m_rsk
arch: arm
core: cortex-r52
flash: { base: 0, size: 0 }
ram:
  base: 0x10000000
  size: 1536KB
flash_boot_alias: false
peripherals:
- id: sci0
  type: uart
  bus: sysbus
  base_address: 0x80001000
  size: 1KB
  config:
    profile: sci_b
