name: efm32pg1
arch: arm
# The imported profile is limited to its Cortex-M4F memory map and modeled
# USART0. Other generated peripheral windows are omitted because this profile
# does not exercise them.
# Flash at 0x0 as in Renode's efm32xg1x/efm32pg1.repl
# (`flash: Memory.MappedMemory @ sysbus 0x00000000`) and the EFM32 Series 1
# memory map.
flash:
  base: 0
  size: 262144B
ram:
  base: 536870912
  size: 32768B
peripherals:
- id: usart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073807360
