name: litex_vexriscv_smp
arch: arm
flash:
  base: 1073741824
  size: 134217728B
ram:
  base: 1073741824
  size: 134217728B
# Simulation-only co-simulation endpoint. This imported LiteX SMP profile
# does not expose a modeled GPIO fabric or ADC; these channels are not physical
# pads or firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: uart
  type: litex_uart
  bus: sysbus
  base_address: 4026537984
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
