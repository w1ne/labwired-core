# Bounded profile of the imported Cortex-A78 target. The engine exercises its
# shared AArch64 integer subset against DDR; no Cortex-A78-specific features,
# boot firmware, or imported peripherals are claimed here.
name: cortex-a78
arch: aarch64
core: cortex-a78
flash: { base: 0, size: 0 }
ram:
  base: 0x40000000
  size: 2GiB
flash_boot_alias: false
peripherals: []
