# Bounded CrossLink-NX EVN execution profile.
# Renode's board REPL declares a VexRiscv (`rv32im_zicsr_zifencei`), a 32 KiB
# ROM at 0, and 8 MiB SRAM at 0x40000000. This profile claims only the engine's
# RV32IM integer subset and those memory windows. The ROM is represented by the
# generic flash range for direct-ELF loading; no reset flow or peripherals are
# claimed here.
# Source: https://github.com/renode/renode/blob/master/platforms/boards/crosslink-nx-evn.repl
name: crosslink-nx-evn
arch: riscv
core: rv32im
cpu_hz: 75000000
flash: { base: 0x00000000, size: "32KiB" }
ram: { base: 0x40000000, size: "8MiB" }
flash_boot_alias: false
peripherals: []
