name: stk3600
arch: arm
# Cortex-M3 execution profile narrowed to the imported memory windows and the
# model-backed UART0 path exercised by the onboarding smoke. Other imported
# peripherals are omitted until they have model-backed checks.
core: cortex-m3
flash:
  base: 134217728
  size: 1048576B
ram:
  base: 536870912
  size: 131072B
peripherals:
- id: uart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073799168
