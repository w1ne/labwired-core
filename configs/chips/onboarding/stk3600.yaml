name: stk3600
arch: arm
# EFM32LG-STK3600 (Leopard Gecko starter kit, EFM32LG990F256). Renode
# platforms/boards/silabs/stk3600.repl is
# cpus/silabs/efm32xg/efm32lg995.repl plus two LEDs, two buttons and a
# deviceInformation override, so the chip surface is the efm32lg995
# onboarding profile, included whole. The deviceInformation block
# (0x0FE081B0) is not declared: no model behind it.
include: efm32lg995.yaml
