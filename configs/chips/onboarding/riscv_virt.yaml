name: riscv_virt
arch: arm
flash:
  base: 2147483648
  size: 2147483648B
ram:
  base: 2147483648
  size: 2147483648B
# Simulation-only co-simulation endpoint. This imported profile has no modeled
# GPIO fabric or ADC; these channels are not physical pads or firmware-visible
# registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: uart0
  type: ns16550
  bus: sysbus
  base_address: 268435456
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0x70000000
  size: 4KB
  config:
    pin_count: 2
