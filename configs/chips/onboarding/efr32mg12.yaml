name: efr32mg12
arch: arm
# Narrowed from Renode's efr32mg12.repl: flash plus its sequence SRAM window
# and the inherited USART0 model used by this smoke. Other platform devices
# are omitted until their behavior is modeled by this engine.
flash:
  base: 0
  size: 1048576B
ram:
  base: 553648128
  size: 8192B
peripherals:
- id: usart0
  type: efr32_usart
  bus: sysbus
  base_address: 1073807360
