# Bounded profile of one RAMN ECU for the imported inventory smoke.
# Renode identifies RAMN as STM32L552; this profile exercises its Cortex-M33
# and code/SRAM map only. CAN, ADC, UART, board wiring, and multi-node behavior
# are outside this smoke. SRAM range: ToyotaInfoTech/RAMN memory layout.
# https://github.com/ToyotaInfoTech/RAMN/blob/main/docs/firmware/memory_layout.rst
name: ramn
arch: arm
core: cortex-m33
flash:
  base: 134217728
  size: 524288B
ram:
  base: 536870912
  size: 262144B
peripherals: []
