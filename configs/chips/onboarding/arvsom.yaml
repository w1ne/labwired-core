name: arvsom
arch: arm
flash:
  base: 1048576
  size: 8192B
ram:
  base: 2147483648
  size: 8589934592B
peripherals:
# JH7100 GPIO 0..31 input: GPIODIN in the pinctrl "gpio" region at
# 0x1191_0000 (Linux jh7100.dtsi pinctrl@11910000). The import dropped the
# GPIO, which Renode's jh7100.repl binds as SiFive_GPIO at 0x0119_1000.
- id: gpio
  type: declarative
  bus: sysbus
  base_address: 294715392
  size: 65536B
  config:
    path: ../../peripherals/jh7100/gpio_din.yaml
- id: rstgen
  type: pythonperipheral
  bus: sysbus
  base_address: 293863424
- id: audiorstgen
  type: pythonperipheral
  bus: sysbus
  base_address: 273219584
- id: voutsysrstgen
  type: pythonperipheral
  bus: sysbus
  base_address: 304414720
