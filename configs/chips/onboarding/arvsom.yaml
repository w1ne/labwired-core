# Bounded CPU-only profile for the imported ARV-SOM descriptor.
# The imported board record identifies a PolarFire SoC with RV64GC. This
# engine profile claims only its implemented RV64IMAC execution subset and a
# small window inside the imported DDR range. It does not claim Linux boot,
# floating point, supervisor mode, FPGA fabric, or board peripherals.

name: "arvsom"
arch: "riscv"
core: "rv64imac"
flash: { base: 0, size: 0 }

# The generated import supplied an 8 GiB RAM window at 0x80000000. Expose only
# the first 8 MiB for this direct-ELF smoke; this does not assert installed DDR
# capacity on the physical module.
ram: { base: 0x80000000, size: "8MiB" }
flash_boot_alias: false
peripherals: []
