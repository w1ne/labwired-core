#
# nRF52840 DK / PCA10056 (platforms/boards/nrf52840dk_nrf52840.repl). Renode
# builds the board as `using "platforms/cpus/nrf52840.repl"` plus four LEDs
# (P0.13-16) and four buttons (P0.11/12/24/25) wired to gpio0. The silicon is
# the imported nrf52840 profile, included whole rather than copied so the two
# rows cannot drift; see nrf52840.yaml for its peripherals.
#
# The LEDs and buttons are GPIO pin connections in Renode, not bus
# peripherals, so they live in the system file as board_io. The previous
# narrowed profile declared only UARTE0 and P0.
include: nrf52840.yaml
name: nrf52840dk_nrf52840
