# Narrow imported nRF52840 DK smoke profile. The initial imported descriptor
# listed peripherals outside this smoke path; keep UARTE0, P0 and its LED0
# attachment, which are exercised by the shared nRF52840 fixture.
#
# UARTE0 and P0 bases come from the vendor SVD recorded in the Renode coverage
# state. The memory windows are the bounded execution window used by the
# existing nRF52840 smoke, not a density or complete-device claim.
name: nrf52840dk_nrf52840
arch: arm
flash:
  base: 0x00000000
  size: 1MiB
ram:
  base: 0x20000000
  size: 256KiB
peripherals:
  - id: uart0
    type: nrf52840_uart
    base_address: 0x40002000
    irq: 2
  - id: gpio0
    type: nrf52840_gpio
    base_address: 0x50000000
  # Renode's led0 is a GPIO pin connection (gpio0 pin 13), not a bus
  # peripheral; imported here it became a 4 KiB zero window at sysbus 0xD.
  # Board LEDs are modelled through board_io, so it is not declared.
