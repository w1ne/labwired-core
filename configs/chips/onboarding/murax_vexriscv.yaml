name: murax_vexriscv
# Narrowed to the Renode VexRiscv RV32IM core, its two 256 KiB memory windows,
# and the modeled Murax UART. GPIO and timer are omitted until LabWired has
# dedicated models for them.
arch: riscv
core: "rv32im_zicsr_zifencei"
flash:
  base: 2147483648
  size: 262144B
ram:
  base: 4096
  size: 262144B
peripherals:
- id: uart
  type: murax_uart
  bus: sysbus
  base_address: 4026597376
