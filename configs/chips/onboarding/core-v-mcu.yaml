# Bounded imported CORE-V MCU profile. The CV32E40P execution surface matches
# the validated A2 profile; this smoke claims only RV32IMC execution and the
# imported flash/SRAM windows. PULP peripherals are omitted until individually
# exercised against this system.
name: core-v-mcu
arch: riscv
core: rv32imc
flash:
  base: 0x1A000000
  size: 8KiB
ram:
  base: 0x1C000000
  size: 512KiB
flash_boot_alias: false
peripherals: []
