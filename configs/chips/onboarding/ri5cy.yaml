# Bounded imported RI5CY profile, matching Renode's platforms/boards/ri5cy
# memory map. This smoke covers RV32IMC execution and the modeled LPUART0 only.
# Upstream platform source: https://github.com/renode/renode/blob/master/platforms/boards/vegaboard_ri5cy.repl

name: "ri5cy"
arch: "riscv"
core: "rv32imc"

flash: { base: 0x00000000, size: "1MiB" }
ram: { base: 0x20000000, size: "192KiB" }
peripherals:
  - id: "lpuart0"
    type: "nxp_lpuart"
    base_address: 0x40042000
