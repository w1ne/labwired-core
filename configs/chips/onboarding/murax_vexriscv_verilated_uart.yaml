name: murax_vexriscv_verilated_uart
# Narrowed from the Renode co-simulation profile to LabWired's local RV32IM
# execution path and modeled Murax UART. The external Verilated CPU, UART
# co-simulation, GPIO, and timer are not represented by this profile.
arch: riscv
core: "rv32im_zicsr_zifencei"
flash:
  base: 2147483648
  size: 262144B
ram:
  base: 4096
  size: 262144B
peripherals:
- id: uart
  type: murax_uart
  bus: sysbus
  base_address: 4026597376
