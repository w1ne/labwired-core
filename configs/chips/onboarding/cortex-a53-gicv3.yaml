# Imported Renode target `cortex-a53-gicv3`, narrowed to one Cortex-A53 PE,
# the imported DDR window at 0x40000000 and the PL011 UART0 at 0x09000000
# (generic UART engine, PL011 layout: polled TX via UARTFR/UARTDR). The
# generic timer, GICv3 and PL031 RTC from the import are not modeled and are
# intentionally omitted.
name: cortex-a53-gicv3
arch: aarch64
core: cortex-a53
flash: { base: 0, size: 0 }
ram: { base: 0x40000000, size: 2GiB }
flash_boot_alias: false
peripherals:
- id: uart0
  type: uart
  base_address: 0x09000000
  size: 4096
  config:
    profile: "pl011"
