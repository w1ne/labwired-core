name: renesas-r7fa2e1a9
arch: arm
# Renode's R7FA2E1A9 platform maps a Cortex-M23, 128 KiB code flash at 0x0,
# and 16 KiB SRAM at 0x20004000. Keep this imported profile to those regions;
# generated RA peripherals are omitted until they have validated models.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/renesas-r7fa2e1a9.repl
core: cortex-m23
flash:
  base: 0x00000000
  size: 128KB
ram:
  base: 0x20004000
  size: 16KB
peripherals: []
