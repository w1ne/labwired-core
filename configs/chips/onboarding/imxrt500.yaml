# SUPERSEDED: staged onboarding descriptor (a generic UART fixture on a
# Renode-derived map with the flash window at 0x03000000 (the boot ROM) and no
# RT500 peripherals). The promoted i.MX RT595S part is
# configs/chips/mimxrt595s.yaml (board: configs/systems/mimxrt595-evk.yaml).
name: imxrt500
arch: arm
flash:
  base: 50331648
  size: 131072B
ram:
  base: 536870912
  size: 5242880B
peripherals: []
