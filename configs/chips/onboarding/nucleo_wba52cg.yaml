# Narrow NUCLEO-WBA52CG execution profile for the imported-system smoke.
# Only the modeled Cortex-M33, RCC, GPIOA/GPIOB, USART1 and memory windows used
# by firmware-nucleo-wba52cg-demo are represented here. This is not a full MCU
# peripheral inventory or a density-specific memory claim.
name: nucleo_wba52cg
arch: arm
core: cortex-m33
flash:
  base: 0x08000000
  size: 1048576B
ram:
  base: 0x20000000
  size: 131072B
peripherals:
  - id: rcc
    type: rcc
    bus: sysbus
    base_address: 0x46020C00
    size: 1KB
    config:
      profile: stm32wba
  - id: gpioPortA
    type: gpio
    bus: sysbus
    base_address: 0x42020000
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortB
    type: gpio
    bus: sysbus
    base_address: 0x42020400
    size: 1KB
    config:
      profile: stm32v2
  - id: usart1
    type: uart
    bus: sysbus
    base_address: 0x40013800
    size: 1KB
    config:
      profile: stm32v2
