name: fsl_lx2160ardb
# The imported descriptor named no core, so the old policy selected Cortex-M.
# This platform has a Cortex-A72 and uses the AArch64 backend.
arch: aarch64
core: cortex-a72
flash:
  base: 2147483648
  size: 2147483648B
ram:
  base: 2147483648
  size: 2147483648B
peripherals:
- id: timer
  type: arm_generictimer
  bus: cpu0
  base_address: 15
- id: uart0
  type: pl011
  bus: sysbus
  base_address: 35389440
- id: uart1
  type: pl011
  bus: sysbus
  base_address: 35454976
- id: i2c0
  type: vybridi2c
  bus: sysbus
  base_address: 33554432
