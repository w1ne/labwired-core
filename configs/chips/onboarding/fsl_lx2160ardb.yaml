# Imported Renode target `fsl_lx2160ardb` (NXP Layerscape LX2160A RDB),
# narrowed to what the engine executes and the UART smoke exercises: one
# Cortex-A72 PE on the AArch64 backend, the imported 2 GiB DDR window at
# 0x80000000, and the PL011 console UART at 0x021C0000 (polled TX). The
# other A72s, the generic timer, the second PL011 and the Vybrid-style I2C
# controller are not modeled here and are intentionally omitted.
name: fsl_lx2160ardb
arch: aarch64
core: cortex-a72
flash: { base: 0, size: 0 }
ram:
  base: 2147483648
  size: 2147483648B
flash_boot_alias: false
peripherals:
- id: uart0
  type: pl011
  bus: sysbus
  base_address: 35389440
  size: 4096
