name: stk3700
arch: arm
# EFM32GG-STK3700 (Giant Gecko starter kit, EFM32GG990F1024). Renode
# platforms/boards/silabs/stk3700.repl is
# cpus/silabs/efm32xg/efm32gg995.repl plus two LEDs, two buttons and a
# deviceInformation override, so the chip surface is the efm32gg995
# onboarding profile, included whole. The deviceInformation block
# (0x0FE081B0) is not declared: no model behind it.
include: efm32gg995.yaml
