name: stk3800
arch: arm
# Renode's STK3800 platform inherits the EFM32WG995 Cortex-M4F map. Keep only
# its execution memory and the modeled UART0 exercised by this smoke.
core: cortex-m4f
flash:
  base: 0
  size: 262144B
ram:
  base: 536870912
  size: 32768B
peripherals:
- id: uart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073799168
