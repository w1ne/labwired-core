name: stk3800
arch: arm
# EFM32WG-STK3800 (Wonder Gecko starter kit, EFM32WG990F256). Renode
# platforms/boards/silabs/stk3800.repl is
# cpus/silabs/efm32xg/efm32wg995.repl plus two LEDs, two buttons and a
# deviceInformation override, so the chip surface is the efm32wg995
# onboarding profile, included whole. The deviceInformation block
# (0x0FE081B0) is not declared: no model behind it.
include: efm32wg995.yaml
