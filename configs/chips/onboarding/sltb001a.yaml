# Bounded EFR32MG1 profile for the imported SLTB001A USART0 smoke.
# Renode's sltb001a.repl inherits efr32mg1.repl. This profile keeps the
# Cortex-M4F, memory map, and model-backed USART0 used by the fixture; it does
# not claim the board LEDs, buttons, I2C sensor, or untested peripherals.
name: sltb001a
arch: arm
core: cortex-m4f
flash:
  base: 0
  size: 262144B
ram:
  base: 536870912
  size: 32768B
peripherals:
- id: usart0
  type: efr32_usart
  bus: sysbus
  base_address: 1073807360
