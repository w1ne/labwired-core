# ADC0, the Series-1 SAR ADC behind the APORT. ADC0_BASE = 0x40002000,
# ADC0_IRQn = 14 (efr32bg1p232f256gm48.h, gecko_sdk gsdk_4.4); ADC_TypeDef and the POSSEL
# enumeration in efr32bg1p_adc.h are identical to efr32mg1p_adc.h, so this is the
# xG1 die the efr32s1_adc model covers. SINGLECTRL.POSSEL picks the pad
# through the APORT matrix (EFR32MG12 data sheet Table 6.12), and channel =
# port * 16 + pin (PA3 = 3). The CMU here is a stub, so there is no clock gate.
- id: adc0
  type: efr32s1_adc
  base_address: 0x40002000
  size: 1KB
  irq: 14
