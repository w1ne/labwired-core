name: simavr-atmega169p
arch: avr
core: avr8
flash:
  base: 0
  size: 16KB
ram:
  base: 256
  size: 1KB
# Register map checked against avr-libc 2.0.0 avr/iom169p.h: PINA..PORTG at
# 0x20..0x34 (the ATmega1281's addresses; port G is PG0..PG5), ADCL/ADCH
# 0x78/0x79, ADCSRA 0x7A, ADCSRB 0x7B, ADMUX 0x7C. LabWired's ATmega169P core
# owns those registers; each port is mirrored at 0x1_0000 + PINx and the ADC
# input side is millivolts per channel, two bytes each, as on
# configs/chips/atmega1281.yaml. ADC0..7 are PF0..PF7 (datasheet 8018P
# §2.2.8, Table 22-4). VIL 0.3 / VIH 0.6 VCC are the DC input limits for
# VCC 2.4..5.5 V, except XTAL1 and RESET (§28.2).
gpio_input_thresholds:
  vil: 0.3
  vih: 0.6
peripherals:
  - id: "porta"
    type: "avr_gpio"
    base_address: 0x00010020
    size: "3"
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010026
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010029
    size: "3"
  - id: "porte"
    type: "avr_gpio"
    base_address: 0x0001002C
    size: "3"
  - id: "portf"
    type: "avr_gpio"
    base_address: 0x0001002F
    size: "3"
  - id: "portg"
    type: "avr_gpio"
    base_address: 0x00010032
    size: "3"
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010200
    size: "16"
    config:
      channels: 8
analog_pins:
  PF0: { peripheral: adc, channel: 0 }
  PF1: { peripheral: adc, channel: 1 }
  PF2: { peripheral: adc, channel: 2 }
  PF3: { peripheral: adc, channel: 3 }
  PF4: { peripheral: adc, channel: 4 }
  PF5: { peripheral: adc, channel: 5 }
  PF6: { peripheral: adc, channel: 6 }
  PF7: { peripheral: adc, channel: 7 }
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_mega169.c
