name: acrn_x86_64
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 16777216
  size: 536870912B
peripherals:
- id: uart
  type: ns16550
  bus: sysbus
  base_address: 3758097400
- id: hpet
  type: hpet
  bus: sysbus
  base_address: 4275044352
- id: analog_io
  type: gpio
  bus: sysbus
  base_address: 0xF0000000
  size: 1KB
  config:
    # Simulation-only GPIO endpoint for board-level analog threshold co-simulation.
    # This is not an ACRN or x86 silicon GPIO controller.
    profile: stm32v2
    simulation_only: true
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
