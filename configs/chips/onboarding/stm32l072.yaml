# Narrow STM32L0x2 execution profile measured by the matching onboarding smoke.
# The flash region is a bounded execution window for this fixture, not a full
# density claim. Only the RCC, GPIOA, and USART2 register surfaces it exercises
# are declared; the broad Renode import contains blocks not modeled here.
name: stm32l072
arch: arm
flash:
  base: 134217728
  size: 65536B
ram:
  base: 536870912
  size: 20480B
peripherals:
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 1342177280
  config:
    profile: stm32v2
- id: rcc
  type: stm32l0_rcc
  bus: sysbus
  base_address: 1073876992
- id: usart2
  type: stm32f7_usart
  bus: sysbus
  base_address: 1073759232
