# SAM4S Xplained (platforms/boards/sam4s_xplained.repl). Renode builds the
# board as `using "platforms/cpus/sam4s.repl"` plus an LED on pioC pin 10 and
# a button on pioA pin 5; the board's part is the ATSAM4S16C (Atmel SAM4S
# Xplained user guide). The silicon is the imported sam4s16c profile,
# included whole rather than copied so the two rows cannot drift: 1 MiB /
# 128 KiB, PMC, UART0/1, USART0/1, PIOA-C with their input change
# interrupts, both SAM_TC blocks, and the WDT, RSTC and EEFC. See
# sam4s16c.yaml for the per-block sources and what it does not claim.
#
# The LED and the button are board I/O in the system file, not bus
# peripherals.
include: sam4s16c.yaml
name: sam4s_xplained
