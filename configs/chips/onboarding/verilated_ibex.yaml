# Bounded local execution profile for the imported Renode Verilated Ibex SoC.
# The generated descriptor was mislabeled ARM and represented Renode's external
# cosimulated CPU as a stub. This profile uses LabWired's RV32IMC interpreter
# for the direct-ELF smoke; it does not claim the Verilated CPU implementation,
# the SoC controller, or the extra generated memory windows.

name: "verilated_ibex"
arch: "riscv"
core: "rv32imc_zicsr_zifencei"

flash: { base: 0x20000000, size: "1MiB" }
ram: { base: 0x01000000, size: "8KiB" }
flash_boot_alias: false
peripherals:
  - id: "uart"
    type: "litex_uart"
    base_address: 0x82002000
    size: "2KB"
    irq: 2
  - id: "timer0"
    type: "litex_timer_csr32"
    base_address: 0x82002800
    size: "2KB"
    irq: 1
