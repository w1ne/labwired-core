#
# Bounded imported RA4M1 profile: keep only the model-backed core, memory,
# SYSTEM, PORT1/PFS, SysTick, and SCI2 surfaces exercised by the smoke.

name: renesas-r7fa4m1a
arch: arm
core: cortex-m4
cpu_hz: 48000000
flash:
  base: 0
  size: 262144B
ram:
  base: 536870912
  size: 32768B
peripherals:
- id: ra_sysc
  type: ra_sysc
  bus: sysbus
  base_address: 0x4001E000
  size: 256B
- id: port1
  type: gpio
  bus: sysbus
  base_address: 0x40040020
  size: 32B
  config:
    profile: ra_port
    pad_control: pfs
    pad_control_port: 1
    swapped_half_aliases: true
- id: pfs
  type: ra_pfs
  bus: sysbus
  base_address: 0x40040800
  size: 1536B
- id: systick
  type: systick
  bus: sysbus
  base_address: 0xE000E010
- id: sci2
  type: uart
  bus: sysbus
  base_address: 0x40070040
  size: 32B
  irq: 4
  config:
    profile: sci
