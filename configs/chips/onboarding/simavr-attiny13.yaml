name: simavr-attiny13
arch: avr
core: avr8
flash:
  base: 0
  size: 1KB
ram:
  base: 96
  size: 64B
# Register map checked against avr-libc 2.0.0 avr/iotn13.h: the I/O-space map
# LabWired's ATtiny13 core runs (AvrModel::Attiny13). ADCSRB 0x23, ADCL/ADCH
# 0x24/0x25, ADCSRA 0x26, ADMUX 0x27 (REFS0, ADLAR, MUX1:0 only);
# PINB/DDRB/PORTB 0x36..0x38, the part's only port; SRAM 0x60..0x9F. The CPU
# owns those registers; port B is mirrored at 0x1_0036 and the ADC input side
# (millivolts per channel, two bytes each) sits at 0x1_0060, past the I/O
# space. ADC0..3 are PB5, PB2, PB4, PB3 (ATtiny13A datasheet 8126F §14.12.1).
# VIL 0.3 VCC / VIH 0.6 VCC are the datasheet DC input limits for VCC
# 2.4..5.5 V (§18.2).
gpio_input_thresholds:
  vil: 0.3
  vih: 0.6
peripherals:
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010036
    size: "3"
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010060
    size: "8"
    config:
      channels: 4
analog_pins:
  PB5: { peripheral: adc, channel: 0 }
  PB2: { peripheral: adc, channel: 1 }
  PB4: { peripheral: adc, channel: 2 }
  PB3: { peripheral: adc, channel: 3 }
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
