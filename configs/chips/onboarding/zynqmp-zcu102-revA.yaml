# Imported Renode target `zynqmp-zcu102-revA` (Zynq UltraScale+ MPSoC), narrowed to what the
# engine executes and the UART smoke exercises: one Cortex-A53 PE on the
# AArch64 backend, the imported low-DDR window, and PS UART0 (Cadence, polled
# TX). The other three A53s, the Cortex-R5F RPU, GIC-400, generic timers,
# UART1, TTCs, GEMs, GPIO, I2C, IPI, RTC, PMU, QSPI and the board-level I2C
# devices are not modeled here and are intentionally omitted; the import
# answered most of them with zero-reading stubs.
name: zynqmp-zcu102-revA
arch: aarch64
core: cortex-a53
flash: { base: 0, size: 0 }
ram:
  base: 196608
  size: 2147287040B
flash_boot_alias: false
peripherals:
- id: uart0
  type: cadence_uart
  bus: sysbus
  base_address: 4278190080
  size: 4096
