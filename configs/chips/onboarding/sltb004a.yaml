# Bounded SLTB004A profile for the imported EFR32MG12 USART0 smoke.
# Renode's efr32mg12.repl provides a 1 MiB flash, 8 KiB sequence SRAM window,
# and the model-backed USART0. The board's main SRAM and untested peripherals
# are omitted from this measured profile.
name: sltb004a
arch: arm
core: cortex-m4f
flash:
  base: 0
  size: 1048576B
ram:
  base: 553648128
  size: 8192B
peripherals:
- id: usart0
  type: efr32_usart
  bus: sysbus
  base_address: 1073807360
