# Bounded profile for Renode's Egis ET171 fragment. The execution smoke uses
# the generic RV32IM subset and on-chip SRAM only; the upstream Andes D25F's
# rv32gc_xandes extensions, reset flow, and all peripherals remain unclaimed.
# Memory windows follow Renode's platforms/cpus/egis_et171.repl.
name: egis_et171
arch: riscv
core: rv32im
flash_boot_alias: false
flash:
  base: 0x80000000
  size: 1MiB
ram:
  base: 0x00000000
  size: 384KB
peripherals: []
