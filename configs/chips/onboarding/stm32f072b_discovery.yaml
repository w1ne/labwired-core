# Bounded imported STM32F072B-DISCO profile for the Cortex-M0 GPIO/USART smoke.
# The memory windows match the STM32F072RBT6 on the board. Only the F0 RCC,
# GPIOA, GPIOC, and USART1 register surfaces used by this fixture are declared.
name: stm32f072b_discovery
arch: arm
core: cortex-m0
flash:
  base: 0x08000000
  size: 131072B
ram:
  base: 0x20000000
  size: 16384B
peripherals:
- id: rcc
  type: rcc
  bus: sysbus
  base_address: 0x40021000
  config:
    profile: stm32f0
- id: gpioPortA
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x48000000
  clock: { reg: ahbenr, bit: 17 }
  config:
    profile: stm32v2
- id: gpioPortC
  type: stm32_gpioport
  bus: sysbus
  base_address: 0x48000800
  clock: { reg: ahbenr, bit: 19 }
  config:
    profile: stm32v2
- id: usart1
  type: uart
  bus: sysbus
  base_address: 0x40013800
  clock: { reg: apb2enr, bit: 14 }
  config:
    profile: stm32v2
