name: stk3200
arch: arm
# EFM32ZG-STK3200 (Zero Gecko starter kit, EFM32ZG222F32). Renode
# platforms/boards/silabs/stk3200.repl is
# cpus/silabs/efm32xg/efm32zg222.repl plus two LEDs and two buttons, so the
# chip surface is the efm32zg222 onboarding profile, included whole. The
# deviceInformation block (0x0FE081B0) is not declared: no model behind it.
include: efm32zg222.yaml
