name: stk3200
arch: arm
# Renode's STK3200 platform inherits the EFM32ZG222 map. Keep only its M0+
# core, physical execution memory, and the modeled USART1 exercised by smoke.
core: cortex-m0+
flash:
  base: 0
  size: 32768B
ram:
  base: 536870912
  size: 4096B
peripherals:
- id: usart1
  type: efm32_uart
  bus: sysbus
  base_address: 1073792000
