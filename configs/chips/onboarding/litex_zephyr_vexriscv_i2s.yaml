# Bounded profile from Renode's platforms/cpus/litex_zephyr_vexriscv_i2s.repl.
# The smoke covers only RV32IMAC execution, the imported RAM, and LiteX UART.
# It does not exercise the timer, I2S, Ethernet, or Zephyr boot path.
name: litex_zephyr_vexriscv_i2s
arch: riscv
core: rv32imac
flash:
  base: 0
  size: 0
ram:
  base: 0x40000000
  size: 268435456B
peripherals:
  - id: uart
    type: litex_uart
    base_address: 0x82001800
    size: "2KB"
