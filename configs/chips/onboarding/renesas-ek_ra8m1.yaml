# Narrow imported Renesas EK-RA8M1 profile for the Cortex-M85 SCI9/GPIO smoke.
# Memory and register addresses follow the R7FA8M1AH CMSIS header and the
# Renesas RA8M1 model profile in configs/chips/r7fa8m1ah.yaml. The engine's
# Cortex-M85 scalar Armv8-M subset and listed peripheral paths are exercised;
# this profile does not claim Helium/MVE, TrustZone, or the unmapped RA8 blocks.
name: renesas-ek_ra8m1
arch: arm
core: cortex-m85
cpu_hz: 8000000
flash:
  base: 0x02000000
  size: 2048KB
ram:
  base: 0x22000000
  size: 896KB
memory_regions:
  - name: itcm
    base: 0x00000000
    size: 64KB
  - name: dtcm
    base: 0x20000000
    size: 64KB
  - name: data_flash
    base: 0x27000000
    size: 12KB
    erased: true
peripherals:
  # R_SYSTEM supplies the SCICKCR switch handshake used by the firmware.
  - id: ra_sysc
    type: ra8_sysc
    base_address: 0x4001E000
    size: 4KB
  # R_MSTP: MSTPCRA-E register file from the R7FA8M1AH SVD (SVD reset
  # values, readback). No module is gated by it: SCI_B runs whatever
  # MSTPCRB.MSTPB22 holds.
  - id: mstp
    type: declarative
    base_address: 0x40203000
    size: 64B
    config:
      path: ../../peripherals/r7fa8m1ah/mstp.yaml
  # GPIO port latches and PFS pull-up setup used by the three LED and two
  # switch readbacks in the existing fixture.
  - id: port0
    type: gpio
    base_address: 0x40400000
    size: 32B
    config: { profile: ra_port, pad_control: pfs, pad_control_port: 0 }
  - id: port1
    type: gpio
    base_address: 0x40400020
    size: 32B
    config: { profile: ra_port, pad_control: pfs, pad_control_port: 1 }
  - id: port4
    type: gpio
    base_address: 0x40400080
    size: 32B
    config: { profile: ra_port, pad_control: pfs, pad_control_port: 4 }
  - id: port6
    type: gpio
    base_address: 0x404000C0
    size: 32B
    config: { profile: ra_port, pad_control: pfs, pad_control_port: 6 }
  - id: pfs
    type: ra8_pfs
    base_address: 0x40400800
    size: 1536B
  - id: sci9
    type: uart
    base_address: 0x40358900
    size: 256B
    config:
      profile: sci_b
      clock_hz: 8000000
      baud: 9600
