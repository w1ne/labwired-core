name: simavr-atmega1281
arch: avr
core: avr8
flash:
  base: 0
  size: 128KB
ram:
  base: 512
  size: 8KB
# Register map checked against avr-libc 2.0.0 avr/iom1281.h: PINx/DDRx/PORTx
# at the same data addresses as LabWired's ATmega1281 core, and ADCL/ADCH
# 0x78/0x79, ADCSRA 0x7A, ADCSRB 0x7B, ADMUX 0x7C. That core owns those
# registers; each port is mirrored at 0x1_0000 + PINx (PIN/DDR/PORT) and the
# ADC input side is millivolts per channel, two bytes each, the same layout
# as configs/chips/atmega1281.yaml. VIL 0.3 VCC / VIH 0.6 VCC are the datasheet
# DC input limits.
gpio_input_thresholds:
  vil: 0.3
  vih: 0.6
peripherals:
  - id: "porta"
    type: "avr_gpio"
    base_address: 0x00010020
    size: "3"
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010026
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010029
    size: "3"
  - id: "porte"
    type: "avr_gpio"
    base_address: 0x0001002C
    size: "3"
  - id: "portf"
    type: "avr_gpio"
    base_address: 0x0001002F
    size: "3"
  - id: "portg"
    type: "avr_gpio"
    base_address: 0x00010032
    size: "3"
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010200
    size: "16"
    config:
      channels: 8
analog_pins:
  PF0: { peripheral: adc, channel: 0 }
  PF1: { peripheral: adc, channel: 1 }
  PF2: { peripheral: adc, channel: 2 }
  PF3: { peripheral: adc, channel: 3 }
  PF4: { peripheral: adc, channel: 4 }
  PF5: { peripheral: adc, channel: 5 }
  PF6: { peripheral: adc, channel: 6 }
  PF7: { peripheral: adc, channel: 7 }
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_mega1281.c
  kind: core-model
  license: GPL-3.0
  retrieved: '2026-10-18'
