# Narrowed SiFive FU540 profile for the imported Renode system.
#
# FU540-C000 uses RV64 application harts and exposes its QSPI XIP window at
# 0x20000000, DDR at 0x80000000, and UART0 at 0x10010000 (FU540-C000 Manual
# v1p4, memory map and UART chapter:
# https://starfivetech.com/uploads/fu540-c000-manual-v1p4.pdf. The engine runs
# one RV64IMAC U54 application hart here, with UART0 and the core-integrated
# CLINT used by the smoke. The CLINT `mtime` is clocked at 1 MHz; this profile
# uses the FU540's recommended 1 GHz core clock. The core models the PLIC for
# U54 hart 1; this profile wires UART0 source 4 to it for the transmit-watermark
# smoke. GPIO, Ethernet, I2C, QSPI controller behavior, and other harts remain
# unclaimed. The 128 KiB DDR window keeps stack setup in the address range
# supported by the current generic RISC-V runner.

name: "sifive-fu540"
arch: "riscv"
core: "rv64imac"
cpu_hz: 1_000_000_000

flash: { base: 0x20000000, size: "32MiB" }
ram: { base: 0x80000000, size: "128KiB" }
flash_boot_alias: false

peripherals:
  - id: "uart0"
    type: "sifive_uart"
    base_address: 0x10010000
    size: "4KB"
    irq: 4
