# ADC1 (stm32l1_adc) at 0x40012400, IRQ 18 (STM32L151.svd v1.4). The common
# ADC_CSR/ADC_CCR sit at 0x40012700/0x40012704, inside the same 1KB window.
# Renode's stm32l151.repl has no ADC.
- id: adc1
  type: stm32l1_adc
  bus: sysbus
  base_address: 0x40012400
  size: 1KB
  irq: 18
# Pads per STM32duino variants/STM32L1xx/L151ZCT_L152ZCT_L162ZCT
# PeripheralPins.c PinMap_ADC (this profile has ports A..H, the 144-pin
# package). Channel = ADC_INn for bank A and the shared channels; 32 + n is
# ADC_INnb, converted when ADC_CR2.CFG selects bank B.
analog_pins:
  PA0: { peripheral: adc1, channel: 0 }
  PA1: { peripheral: adc1, channel: 1 }
