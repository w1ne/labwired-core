# Bounded STM32L151 Cortex-M3 profile for the imported USART1 smoke.
# These memory windows are sized for this fixture; they are not a full
# density claim for the STM32L151 family. Unexercised imported peripherals,
# including zero-answering Python windows, are omitted.
name: stm32l151
arch: arm
core: cortex-m3
flash:
  base: 134217728
  size: 65536B
ram:
  base: 536870912
  size: 8192B
peripherals:
- id: usart1
  type: stm32_uart
  bus: sysbus
  base_address: 1073821696
