name: mpc5567
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 536870912
  size: 536870912B
peripherals:
- id: uart
  type: mpc5567_uart
  bus: sysbus
  base_address: 4294639616
- id: uart2
  type: mpc5567_uart
  bus: sysbus
  base_address: 4294656000
- id: fec
  type: fastethernetcontroller
  bus: sysbus
  base_address: 4294230016
- id: emios
  type: emios
  bus: sysbus
  base_address: 3287941120
- id: fmpllSynsr
  type: pythonperipheral
  bus: sysbus
  base_address: 3287810052
# MPC5567 SIU pad registers (MPC5567 RM ch. 6; the MPC55xx header's SIU_tag at
# 0xC3F9_0000, the 16 KB slot between FMPLL 0xC3F8_0000 and eMIOS
# 0xC3FA_0000). Renode's mpc5567.repl does not declare the SIU. GPDIn
# @+0x800 + n is pad n's input byte; GPIO[0..3] are declared.
- id: siu
  type: declarative
  bus: sysbus
  base_address: 3287875584
  size: 16384B
  config:
    path: ../../peripherals/mpc5500/siu_gpio.yaml
# Enhanced queued ADC (eQADC) at 0xFFF8_0000 (the MPC5567 header's
# `EQADC` = `(struct EQADC_tag *) 0xFFF80000`; registers end below 0x480).
# Renode's mpc5567.repl does not declare it. CFIFO0..5 feed ADC0/ADC1,
# results return through RFIFO0..5. VRH - VRL is the nominal 5 V reference.
# The FISR interrupts go to the INTC, which this profile does not declare,
# so no irq is wired.
- id: eqadc
  type: mpc55xx_eqadc
  bus: sysbus
  base_address: 0xFFF80000
  size: 2KB
  config:
    vref_mv: 5000
# AN0..AN39 are the dedicated analog input pads, conversion command channels
# 0..39 (ChibiOS SPC5xx EQADC_v1 adc_lld.h `ADC_CHN_AN0..39`; channels 40..44
# are the internal VRH/VRL/50 %/75 %/25 % references).
analog_pins:
  AN0: { peripheral: eqadc, channel: 0 }
  AN1: { peripheral: eqadc, channel: 1 }
  AN2: { peripheral: eqadc, channel: 2 }
  AN3: { peripheral: eqadc, channel: 3 }
  AN4: { peripheral: eqadc, channel: 4 }
  AN5: { peripheral: eqadc, channel: 5 }
  AN6: { peripheral: eqadc, channel: 6 }
