  AN14: { peripheral: eqadc, channel: 14 }
  AN15: { peripheral: eqadc, channel: 15 }
  AN16: { peripheral: eqadc, channel: 16 }
  AN17: { peripheral: eqadc, channel: 17 }
  AN18: { peripheral: eqadc, channel: 18 }
