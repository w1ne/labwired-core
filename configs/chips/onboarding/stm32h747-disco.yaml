# Bounded STM32H747I-DISCO profile for the imported Cortex-M7 register smoke.
# The MCU has Cortex-M7 and Cortex-M4 cores, 2 MiB flash, and 1 MiB total RAM
# (ST UM2411 / DS12930). This profile runs only M7 and maps only the 128 KiB
# DTCM window and H7 RCC, GPIOA/B/D, USART3, TIM2 and ADC1 surfaces exercised
# by the smoke. Other cores and peripherals from the Renode import are omitted.
name: stm32h747-disco
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 2MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x58024400
    size: 1KB
    config:
      profile: h7
  - id: gpioPortA
    type: gpio
    base_address: 0x58020000
    size: 1KB
    clock: { reg: ahb4enr, bit: 0 }
    config:
      profile: stm32v2
  - id: gpioPortB
    type: gpio
    base_address: 0x58020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: gpio
    base_address: 0x58020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: usart3
    type: uart
    base_address: 0x40004800
    size: 1KB
    config:
      profile: stm32v2
  # RM0399 (STM32H745/755/747/757): TIM2 is the 32-bit general-purpose timer
  # at 0x40000000 with NVIC position 28 on both cores, clocked by
  # RCC_APB1LENR.TIM2EN (bit 0, offset 0x0E8; the Cortex-M7 view of
  # RCC_C1_APB1LENR at 0x148). Second source: embassy stm32-data STM32H747XI.
  # The smoke covers the gate, 32-bit CNT/ARR, UG, UIF, the update interrupt
  # in up-counting mode, and one-pulse mode (CR1.OPM). Not modelled: CR1.DIR
  # and CMS are stored without effect, and a software UG does not end a
  # one-pulse run. Channels, pads, the count rate, and the Cortex-M4 side
  # are not exercised.
  - id: tim2
    type: timer
    base_address: 0x40000000
    size: 1KB
    irq: 28
    clock: { reg: apb1lenr, bit: 0 }
    config:
      width: 32
  # RM0399 maps ADC1/2 at 0x40022000 and gates them with
  # RCC_AHB1ENR.ADC12EN (bit 5). Only ADC1's window is retained. The smoke
  # exercises regular one-shot ADC1_INP16; common control, ADC2, DMA and
  # injected conversions are not claimed.
  - id: adc1
    type: adc
    base_address: 0x40022000
    size: 256B
    irq: 18
    clock: { reg: ahb1enr, bit: 5 }
    config:
      profile: h7
analog_pins:
  # DS12930 lists PA0 as ADC1_INP16 on STM32H747xI/G.
  PA0: { peripheral: adc1, channel: 16 }
