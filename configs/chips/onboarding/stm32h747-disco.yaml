# Bounded STM32H747I-DISCO profile for the imported Cortex-M7 register smoke.
# The MCU has Cortex-M7 and Cortex-M4 cores, 2 MiB flash, and 1 MiB total RAM
# (ST UM2411 / DS12930). This profile runs only M7 and maps only the 128 KiB
# DTCM window and H7 RCC, GPIOB/GPIOD, and USART3 exercised by the smoke.
# Other cores and peripherals from the Renode import are intentionally omitted.
name: stm32h747-disco
arch: arm
core: cortex-m7
flash:
  base: 0x08000000
  size: 2MiB
ram:
  base: 0x20000000
  size: 128KiB
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x58024400
    size: 1KB
    config:
      profile: h7
  - id: gpioPortB
    type: gpio
    base_address: 0x58020400
    size: 1KB
    config:
      profile: stm32v2
  - id: gpioPortD
    type: gpio
    base_address: 0x58020C00
    size: 1KB
    config:
      profile: stm32v2
  - id: usart3
    type: uart
    base_address: 0x40004800
    size: 1KB
    config:
      profile: stm32v2
