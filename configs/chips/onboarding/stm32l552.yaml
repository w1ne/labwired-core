# Narrow NUCLEO-L552ZE-Q profile for the exact-import onboarding smoke. This
# profile claims only the memory, clock/power, GPIO and LPUART blocks exercised
# by firmware-l552ze-smoke; the other imported STM32L552 peripherals are not
# represented here.
name: stm32l552
arch: arm
core: cortex-m33
flash:
  base: 0x08000000
  size: 512KB
ram:
  base: 0x20000000
  size: 192KB
memory_regions:
  - name: sram2
    base: 0x20030000
    size: 64KB
pins:
  PA9: { gpio: gpioa, bit: 9 }
  PB7: { gpio: gpiob, bit: 7 }
  PC7: { gpio: gpioc, bit: 7 }
  PC13: { gpio: gpioc, bit: 13 }
  PG7: { gpio: gpiog, bit: 7 }
  PG8: { gpio: gpiog, bit: 8 }
peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40021000
    size: 1KB
    config:
      profile: stm32l5
  - id: pwr
    type: pwr
    base_address: 0x40007000
    size: 1KB
    clock: { reg: apb1enr1, bit: 28 }
  - id: gpioa
    type: gpio
    base_address: 0x42020000
    size: 1KB
    clock: { reg: ahb2enr, bit: 0 }
    config:
      profile: stm32v2
  - id: gpiob
    type: gpio
    base_address: 0x42020400
    size: 1KB
    clock: { reg: ahb2enr, bit: 1 }
    config:
      profile: stm32v2
  - id: gpioc
    type: gpio
    base_address: 0x42020800
    size: 1KB
    clock: { reg: ahb2enr, bit: 2 }
    config:
      profile: stm32v2
  - id: gpiog
    type: gpio
    base_address: 0x42021800
    size: 1KB
    clock: { reg: ahb2enr, bit: 6 }
    config:
      profile: stm32v2
  - id: lpuart1
    type: uart
    base_address: 0x40008000
    size: 1KB
    clock: { reg: apb1enr2, bit: 0 }
    config:
      profile: stm32v2
