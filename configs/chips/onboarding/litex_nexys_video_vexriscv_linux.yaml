name: litex_nexys_video_vexriscv_linux
arch: arm
flash:
  base: 536870912
  size: 1048576
ram:
  base: 268435456
  size: 8192B
# Simulation-only co-simulation endpoint. This imported LiteX Linux profile
# does not expose the board switches as a GPIO CSR or declare an ADC, so these
# channels are not physical Nexys Video pads or firmware-visible registers.
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.3
  vih: 0.7
peripherals:
- id: cosim_inputs
  type: input_pin_bank
  bus: sysbus
  base_address: 0xF0000000
  size: 4KB
  config:
    pin_count: 2
