name: zolertia-firefly
arch: arm
# Zolertia Firefly: a Zoul module (CC2538SF53 + CC1200 sub-GHz radio) on a
# breakout board. Renode platforms/boards/zolertia-firefly.repl is
# cpus/cc2538.repl plus a CC1200 on ssi0, so the chip surface is the
# modelled cc2538sf53 profile, included whole (UART0/1, GPIO A-D, SYS_CTRL,
# IOC, flash controller, sleep timer, ADC, SSI0/1, I2C, GPTimer0-3, RF core,
# AES, uDMA, the clean-room ROM at 0x0).
#
# NOT declared: the CC1200 radio. LabWired has no CC1200 model, so the SSI0
# bus carries no slave; firmware that talks to the radio reads 0xFF/idle MISO.
include: ../cc2538sf53.yaml
