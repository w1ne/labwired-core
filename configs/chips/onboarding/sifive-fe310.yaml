# LabWired - narrowed SiFive FE310 profile for the imported Renode system.
#
# Renode's platforms/cpus/sifive-fe310.repl identifies the RV32IMAC CPU,
# QSPI XIP at 0x20000000, DTIM at 0x80000000, and uart0 at 0x10013000.
# The imported YAML had an ARM label and mistook mask ROM/OTP for flash/RAM.
# Keep the runnable HiFive1 Rev B memory ranges and the UART used by the smoke;
# unexercised uart1, GPIO, PLIC, CLINT, mask ROM and OTP are not claimed here.

name: "sifive-fe310"
arch: "riscv"
core: "rv32imac_zicsr_zifencei"
cpu_hz: 62000000

flash: { base: 0x20000000, size: "4MiB" }
ram: { base: 0x80000000, size: "16KiB" }
peripherals:
  - id: "uart0"
    type: "sifive_uart"
    base_address: 0x10013000
    size: "4KB"
    irq: 3
