name: efm32lg995
arch: arm
# The imported platform listed several peripheral windows that are stubs in
# this engine. This execution profile measures memory, the USART0 console,
# the Series-0 GPIO ports and TIMER0..3; it does not claim the remaining
# Leopard Gecko peripherals (I2C, LEUART, CMU, EBI, LCD).
flash:
  base: 134217728
  size: 1048576B
ram:
  base: 536870912
  size: 131072B
peripherals:
- id: usart0
  type: efm32_uart
  bus: sysbus
  base_address: 1073790976
# Series-0 GPIO ports A..F (Renode: one `GPIOPort.EFMGPIOPort` at
# 0x40006000). GPIO_P_TypeDef at a 0x24 stride (Gecko SDK efm32gg_gpio_p.h).
# The block head from 0x40006100 (EXTI, ROUTE, INSENSE, EM4 wake) is NOT
# mapped: no model behind it.
- id: gpioa
  type: efm32s0_gpioport
  base_address: 0x40006000
  size: 36B
- id: gpiob
  type: efm32s0_gpioport
  base_address: 0x40006024
  size: 36B
- id: gpioc
  type: efm32s0_gpioport
  base_address: 0x40006048
  size: 36B
- id: gpiod
  type: efm32s0_gpioport
  base_address: 0x4000606c
  size: 36B
- id: gpioe
  type: efm32s0_gpioport
  base_address: 0x40006090
  size: 36B
- id: gpiof
  type: efm32s0_gpioport
  base_address: 0x400060b4
  size: 36B
# TIMER0..TIMER3 (Renode: `Timers.Efm32Timer`), IRQs from efm32gg942.repl (which
# efm32lg995.repl pulls in with `using`)
# (and EFM32GG IRQn_Type: TIMER0 2, TIMER1 12, TIMER2 13, TIMER3 14).
# Counts CPU cycles / 2^PRESC; the CMU HFPERCLKEN0 gate is not modelled.
- id: timer0
  type: efm32s0_timer
  base_address: 0x40010000
  size: 1KB
  irq: 2
- id: timer1
  type: efm32s0_timer
  base_address: 0x40010400
  size: 1KB
  irq: 12
- id: timer2
  type: efm32s0_timer
  base_address: 0x40010800
  size: 1KB
  irq: 13
- id: timer3
  type: efm32s0_timer
  base_address: 0x40010c00
  size: 1KB
  irq: 14
