# Bounded profile for the imported Mi-V fragment platform. Renode's
# platforms/cpus/miv.repl supplies an RV32IMAF CPU, 256 KiB flash, and 64 MiB
# DDR. This smoke claims only those memory windows and the existing CoreUART;
# GPIO and timer peripherals from the generated import are omitted.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/miv.repl

name: "miv"
arch: "riscv"
core: "rv32imaf_zicsr_zifencei"
cpu_hz: 66_000_000

flash: { base: 0x60000000, size: "256KiB" }
ram: { base: 0x80000000, size: "64MiB" }
flash_boot_alias: false
peripherals:
  - id: "uart"
    type: "miv_coreuart"
    base_address: 0x70001000
    size: "24B"
