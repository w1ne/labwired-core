# Bounded profile for the imported Mi-V fragment platform. Renode's
# platforms/cpus/miv.repl supplies an RV32IMAF CPU, 256 KiB flash, and 64 MiB
# DDR. The smoke claims those memory windows, CoreUART, CLINT, PLIC, the
# two CoreTimers and the two CoreGPIO blocks.
# The core decodes the miv.repl CLINT (0x44000000, mtime at the 66 MHz CPU
# clock) and PLIC (0x40000000, sources 1..31, no priority levels) by chip
# name; CoreTimer0/1 drive PLIC sources 30/31, gpioInputs drives source 29;
# gpioOutputs has no interrupt source (miv.repl).
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/miv.repl

name: "miv"
arch: "riscv"
core: "rv32imaf_zicsr_zifencei"
cpu_hz: 66_000_000

flash: { base: 0x60000000, size: "256KiB" }
ram: { base: 0x80000000, size: "64MiB" }
flash_boot_alias: false
peripherals:
  - id: "uart"
    type: "miv_coreuart"
    base_address: 0x70001000
    size: "24B"
  - id: "gpio_in"
    type: "miv_coregpio"
    base_address: 0x70002000
    size: "164B"
    irq: 29
  - id: "gpio_out"
    type: "miv_coregpio"
    base_address: 0x70005000
    size: "164B"
  - id: "timer0"
    type: "miv_coretimer"
    base_address: 0x70003000
    size: "28B"
    irq: 30
  - id: "timer1"
    type: "miv_coretimer"
    base_address: 0x70004000
    size: "28B"
    irq: 31
