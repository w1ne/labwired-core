# Bounded BeagleV Starlight profile based on Renode's StarFive JH7100 CPU REPL.
# It exercises one U74 as RV64IMAC, the 8 KiB DTIM image window, the 128 KiB
# SoC SRAM window, and UART0 polling TX. The second hart, F/D extensions,
# supervisor mode, interrupts, and other SoC peripherals are outside scope.
# Source: https://github.com/renode/renode/blob/master/platforms/cpus/starfive-jh7100.repl
name: beaglev_starlight
arch: riscv
core: rv64imac
flash: { base: 0x00100000, size: "8KiB" }
ram: { base: 0x18000000, size: "128KiB" }
flash_boot_alias: false
peripherals:
  - id: uart0
    type: uart
    bus: sysbus
    base_address: 0x11870000
    size: "4KiB"
    config:
      profile: dw_apb_uart
