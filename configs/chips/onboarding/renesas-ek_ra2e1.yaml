name: renesas-ek_ra2e1
arch: arm
# Renode's EK-RA2E1 board includes platforms/cpus/renesas-r7fa2e1a9.repl
# (Cortex-M23, 128 KiB code flash at 0x0, 16 KiB SRAM at 0x20004000) and wires
# LEDs to P913/P914/P915 and the S1/S2 buttons to P004/P015. This profile
# claims only the model-backed SCI9 (classic SCI, non-FIFO channel), PORT0,
# PORT9 and PFS surfaces exercised by the smoke. ICU, GPT, AGT, IIC,
# SCI0/1/2, the other ports, data flash and the SYSTEM OSCSF script are not
# mapped.
# Source: https://github.com/renode/renode/blob/master/platforms/boards/renesas-ek_ra2e1.repl
core: cortex-m23
flash:
  base: 0x00000000
  size: 128KB
ram:
  base: 0x20004000
  size: 16KB
peripherals:
- id: port0
  type: gpio
  bus: sysbus
  base_address: 0x40040000
  size: 32B
  config:
    profile: ra_port
    pad_control: pfs
    pad_control_port: 0
    swapped_half_aliases: true
- id: port9
  type: gpio
  bus: sysbus
  base_address: 0x40040120
  size: 32B
  config:
    profile: ra_port
    pad_control: pfs
    pad_control_port: 9
    swapped_half_aliases: true
- id: pfs
  type: ra_pfs
  bus: sysbus
  base_address: 0x40040800
  size: 1536B
- id: sci9
  type: uart
  bus: sysbus
  base_address: 0x40070120
  size: 32B
  config:
    profile: sci
