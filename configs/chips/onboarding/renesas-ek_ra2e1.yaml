name: renesas-ek_ra2e1
arch: arm
# Renode declares this MCU as a Cortex-M23. Keep the imported profile to its
# code flash and SRAM; the generated RA peripheral entries are not modeled for
# this target. Memory bounds follow platforms/cpus/renesas-r7fa2e1a9.repl.
core: cortex-m23
flash:
  base: 0x00000000
  size: 128KB
ram:
  base: 0x20004000
  size: 16KB
peripherals: []
