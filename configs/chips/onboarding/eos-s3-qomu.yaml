# Bounded Cortex-M4F + memory + PL011 execution profile based on Renode's
# platforms/boards/eos-s3-qomu.repl and platforms/cpus/eos-s3.repl. The board
# LEDs and USB serial endpoint are omitted because this smoke does not exercise them.
name: eos-s3-qomu
arch: arm
flash:
  base: 0
  size: 524288B
ram:
  base: 536870912
  size: 524288B
peripherals:
- id: uart
  type: pl011
  bus: sysbus
  base_address: 1073807360
