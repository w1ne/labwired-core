name: eos-s3-qomu
arch: arm
# QuickLogic Qomu. Renode platforms/boards/eos-s3-qomu.repl is cpus/eos-s3.repl
# plus three LEDs and a USB serial port in the FPGA fabric (0x40020000), and it
# detaches the PL011 (`uart: @ none`) because the board routes no UART pins.
# The silicon PL011 is still present, so the eos-s3 chip surface is included
# whole; a Qomu user cannot see that UART on the board. Not declared: the
# fabric USB serial port (no model) and the LEDs (GPIO 0/1/3 per Renode only;
# no second source).
include: eos-s3.yaml
