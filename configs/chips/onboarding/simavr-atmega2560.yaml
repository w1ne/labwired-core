# Imported simavr ATmega2560 profile narrowed to the Arduino Mega I/O smoke.
# It exercises the 256 KiB flash, 8 KiB SRAM, GPIO ports B/E/F/G/H, USART0,
# and ADC channels 0, 8, and 9. The smoke observes only GPIOB pin 7; timers
# remain part of the AVR CPU model.
# SPI, TWI, other USARTs, and other peripherals are outside this profile.
#
