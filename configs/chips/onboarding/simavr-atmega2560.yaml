name: simavr-atmega2560
arch: avr
core: avr8
cpu_hz: 16000000
flash:
  base: 0
  size: 256KB
ram:
  base: 512
  size: 8KB
peripherals:
  - id: portb
    type: avr_gpio
    base_address: 0x00010023
    size: 3
  - id: porte
    type: avr_gpio
    base_address: 0x0001002C
    size: 3
  - id: portf
    type: avr_gpio
    base_address: 0x0001002F
    size: 3
  - id: portg
    type: avr_gpio
    base_address: 0x00010032
    size: 3
  - id: porth
    type: avr_gpio
    base_address: 0x00010100
    size: 3
  - id: usart0
    type: uart
    base_address: 0x000100C0
    size: 8
    config:
      profile: avr
  - id: adc
    type: avr_adc
    base_address: 0x00010200
    size: 32
    config:
      channels: 16
provenance:
  source: simavr
  repo: https://github.com/buserror/simavr
  commit: 5b08da60497f7564f50941f74a549fe2851db030
  path: simavr/cores/sim_mega2560.c
  kind: core-model
  license: GPL-3.0
  retrieved: '2026-10-18'
