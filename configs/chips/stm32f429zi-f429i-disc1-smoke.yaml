# Narrow STM32F429ZIT6 profile for STM32F429I-DISC1 user LED LD3 on PG13.
# Only reset-clock RCC and GPIOG are declared; the display, SDRAM, gyroscope,
# USB and ST-LINK are outside this smoke profile. Sources: DS9405, RM0090,
# PM0214, UM1670 Rev 6 and MB1075-F429I-E01 schematic.
name: stm32f429zi-f429i-disc1-smoke
arch: arm
core: cortex-m4
# This firmware keeps the reset HSI clock (16 MHz); it does not configure PLL.
cpu_hz: 16000000

flash:
  base: 0x08000000
  size: 2048KB
ram:
  base: 0x20000000
  size: 256KB

pins:
  PG13: { gpio: gpiog, bit: 13, functions: [{ type: gpio, peripheral: gpiog }] }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40023800
    size: 1KB
    config:
      profile: stm32f4

  - id: systick
    type: systick
    base_address: 0xE000E010

  - id: gpiog
    type: gpio
    base_address: 0x40021800
    size: 1KB
    config:
      profile: stm32v2
    clock: { reg: ahb1enr, bit: 6 }
