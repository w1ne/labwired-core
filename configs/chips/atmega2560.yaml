name: "atmega2560"
arch: "avr"
core: "avr8"
registers_count: 32
# ATmega2560 (Arduino Mega 2560): the ATmega328P core model (cpu/avr.rs) with
# AvrModel::Atmega2560: 256 KB flash and a 3-byte PC (EIND/EIJMP/EICALL,
# RAMPZ/ELPM), 8 KB SRAM at 0x0200, ports A..L, a 16-channel ADC (ADCSRB.MUX5
# selects ADC8..15 = A8..A15) and the 2560 vector table. Timer0 (millis/delay)
# and Timer1/Timer2 are the 328P models at the same addresses.
# analogWrite reaches the Timer0/1/2 pads (OC0A PB7, OC0B PG5, OC1A/B PB5/PB6,
# OC2A PB4, OC2B PH6; cpu/avr/oc_pins.rs).
# USART0..3 (Serial..Serial3, cpu/avr/usart.rs): UCSRnA/B/C, UBRRn with U2X,
# the UDRn transmit buffer and shift register timed at the programmed baud,
# the two-character receive FIFO with FE/DOR/UPE/RXB8, and the RX complete,
# UDRE and TX complete interrupts (Table 14-1 slots 26..28, 37..39, 52..54,
# 55..57). Host input and TX capture go through the usart0..usart3 windows
# below; USART0 also feeds the CPU console. Synchronous/MSPIM modes and MPCM
# address filtering are not modelled.
# EEPROM (cpu/avr/eeprom.rs): 4 KB, EEARH/L, EEDR, EECR (EERE, EEPE, EEMPE,
# EEPM erase+write / erase only / write only, EERIE -> EE_READY slot 31) with
# the 3.4 / 1.8 ms programming times; the array survives reset and can be
# carried into the next run (Avr::eeprom / Avr::load_eeprom).
# INT0..7 (PD0..3, PE4..7; EICRA/EICRB, EIMSK, EIFR) and PCINT0..23 (PB0..7,
# PE0, PJ0..6, PK0..7; PCICR/PCIFR/PCMSK0..2) on vectors 2..12
# (cpu/avr/mega_ext_int.rs). The ADC converts in ADPS-timed 13/25 ADC clocks,
# single, free running or auto-triggered (ADATE/ADTS), with ADIF/ADIE on
# vector 30, REFS AVCC/1.1 V/2.56 V and ADLAR (cpu/avr/mega_adc.rs). SPI
# (SS/SCK/MOSI/MISO = PB0/PB1/PB2/PB3) times SPIF by SPR/SPI2X, honours DORD,
# WCOL and the SS mode fault, interrupts on vector 25 and clocks the attached
# SPI device models (cpu/avr/mega_spi.rs).
# Not modelled here: OC1C, Timer3/4/5 (and their PWM pads), the analog
# comparator, SPI slave transfers from an external master.
# Microchip DS2549 (ATmega640/1280/1281/2560/2561), 16 MHz on the Arduino Mega.
cpu_hz: 16_000_000
io_voltage_v: 5.0
gpio_input_thresholds:
  vil: 0.3
  vih: 0.6

flash:
  base: 0x00000000
  size: "256KB"
ram:
  base: 0x00000200
  size: "8KB"
peripherals:
  # Parking SPI / I2C controllers for kit attach (SPDR/TWCR live on the CPU).
  - id: "spi"
    type: "spi"
    base_address: 0x00010000
    size: "16"
  - id: "i2c"
    type: "i2c"
    base_address: 0x00010010
    size: "16"
  # Port mirrors: PINx/DDRx/PORTx at data-space base, mirrored at 0x1_0000 + base.
  # A..G sit at 0x20..0x34, H..L in extended I/O at 0x100..0x10B (below).
  # Windows are listed in address order.
  - id: "porta"
    type: "avr_gpio"
    base_address: 0x00010020
    size: "3"
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010026
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010029
    size: "3"
  - id: "porte"
    type: "avr_gpio"
    base_address: 0x0001002C
    size: "3"
  - id: "portf"
    type: "avr_gpio"
    base_address: 0x0001002F
    size: "3"
  - id: "portg"
    type: "avr_gpio"
    base_address: 0x00010032
    size: "3"
  # USART0 host for peers (Serial); same registers as the 328P (UCSR0A 0xC0..UDR0 0xC6).
  - id: "usart0"
    type: "uart"
    base_address: 0x000100C0
    size: "8"
    config:
      profile: "avr"
  # USART1/USART2 hosts (Serial1/Serial2): UCSR1A 0xC8..UDR1 0xCE and
  # UCSR2A 0xD0..UDR2 0xD6. cpu_console: false -- the CPU does not copy these
  # to its console, so the window carries the host TX capture.
  - id: "usart1"
    type: "uart"
    base_address: 0x000100C8
    size: "8"
    config:
      profile: "avr"
      cpu_console: false
  - id: "usart2"
    type: "uart"
    base_address: 0x000100D0
    size: "8"
    config:
      profile: "avr"
      cpu_console: false
  - id: "porth"
    type: "avr_gpio"
    base_address: 0x00010100
    size: "3"
  - id: "portj"
    type: "avr_gpio"
    base_address: 0x00010103
    size: "3"
  - id: "portk"
    type: "avr_gpio"
    base_address: 0x00010106
    size: "3"
  - id: "portl"
    type: "avr_gpio"
    base_address: 0x00010109
    size: "3"
  # USART3 host (Serial3): UCSR3A 0x130..UDR3 0x136 in extended I/O.
  - id: "usart3"
    type: "uart"
    base_address: 0x00010130
    size: "8"
    config:
      profile: "avr"
      cpu_console: false
  # ADC input side: millivolts on ADC0..ADC15, two bytes per channel. Moved past
  # the port mirrors (the 328P window at 0x1_0030 would overlap PINF..PING).
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010200
    size: "32"
    config:
      channels: 16
