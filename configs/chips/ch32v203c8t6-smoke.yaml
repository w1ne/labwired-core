# Narrow CH32V203C8T6 profile for the WeAct BluePill-Plus-CH32 LED + USART1
# TX smoke. QingKe V4B (RV32IMAC), 64 KB flash, 20 KB SRAM, LQFP48.
#
# The CH32V20x RCC_APB2PCENR, GPIO CFGLR/CFGHR/OUTDR/BSHR and USART
# STATR/DATAR/BRR/CTLR1 offsets used here match the STM32F1 layouts the engine
# already models, and USART1's default TX pad is PA9 as on the F1. This profile
# declares only that exercised subset. PFIC/interrupts, the PLL and HSE clock
# tree, USB, CAN, timers, ADC, RTC and the other ports are not modeled here.
#
# Sources:
# - WCH CH32FV2x_V3xRM reference manual (RCC, GPIO, USART chapters)
# - WeAct BluePill-Plus-CH32 README: Blue LED PB2 active high, KEY PA0
#   https://github.com/WeActStudio/WeActStudio.BluePill-Plus-CH32
name: ch32v203c8t6-smoke
arch: riscv
core: rv32imac
registers_count: 32
# Firmware stays on the reset HSI at 8 MHz.
cpu_hz: 8_000_000

package: LQFP48
pin_count: 48

flash:
  base: 0x08000000
  size: 64KB
ram:
  base: 0x20000000
  size: 20KB

pins:
  PA9: { gpio: gpioa, bit: 9 }
  PB2: { gpio: gpiob, bit: 2 }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40021000
    size: 1KB
    config:
      profile: stm32f1

  - id: gpioa
    type: gpio
    base_address: 0x40010800
    size: 1KB
    clock: { reg: apb2enr, bit: 2 }
    config:
      profile: stm32f1

  - id: gpiob
    type: gpio
    base_address: 0x40010C00
    size: 1KB
    clock: { reg: apb2enr, bit: 3 }
    config:
      profile: stm32f1

  - id: usart1
    type: uart
    base_address: 0x40013800
    size: 1KB
    clock: { reg: apb2enr, bit: 14 }
    config:
      profile: stm32f1
