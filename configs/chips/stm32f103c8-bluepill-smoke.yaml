# Narrow STM32F103C8T6 Blue Pill profile for the onboard LED smoke.
#
# The full `stm32f103.yaml` family map contains peripheral windows that are
# zero-answering stubs. This board profile declares only the clock and GPIOC
# path exercised here, so it makes no claim about USB, UART, timers, or buses.
# The part keeps the C8's exact memory geometry and package.
#
# Sources:
# - ST DS5319: https://www.st.com/resource/en/datasheet/stm32f103c8.pdf
# - Blue Pill schematic: https://stm32-base.org/assets/pdf/boards/original-schematic-STM32F103C8T6-Blue_Pill.pdf

name: "stm32f103c8-bluepill-smoke"
arch: "arm"
core: "cortex-m3"
registers_count: 125
# Smoke stays on reset HSI, 8 MHz.
cpu_hz: 8_000_000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.35
  vih: 0.65

package: "LQFP48"
pin_count: 48
gpio_pin_count: 37
variant: "x8"
orderable_suffixes: ["T6", "T6TR", "T7", "T7TR"]

flash:
  base: 0x08000000
  size: "64KB"
ram:
  base: 0x20000000
  size: "20KB"

pins:
  PC13: { gpio: "gpioc", bit: 13 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f103/rcc.yaml"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 4 }
    config:
      debug_schema: "../peripherals/stm32f103/gpioc.yaml"
      profile: "stm32f1"
