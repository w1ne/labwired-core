name: "nrf52840"
arch: "arm"
core: "cortex-m4"
cpu_hz: 64_000_000

flash:
  base: 0x00000000
  size: "1024KB"
ram:
  base: 0x20000000
  size: "256KB"

# This board slice exposes only the MCU resources used by the UART smoke.
# GPIO port 1 is deliberately omitted: the shared nRF52840 descriptor currently
# uses an engine-only alias for P1, so this profile makes no P1/LED claims.
peripherals:
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: "16B"

  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    size: "4KB"
    irq: 2
    config:
      debug_schema: "../peripherals/nrf52840/uart0.yaml"

  - id: "gpio0"
    type: "gpio"
    base_address: 0x50000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/nrf52840/p0.yaml"
      profile: "nrf52"
