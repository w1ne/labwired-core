# Adafruit ItsyBitsy RP2040 board-bound GPIO smoke profile.
#
# The board uses an RP2040 with 8 MiB external QSPI flash and 264 KiB SRAM.
# This focused profile routes only GP11 (D13 / the red user LED) through
# IO_BANK0 to SIO. It does not claim the NeoPixel, USB, UART, or other board IO.
name: "rp2040-itsybitsy-smoke"
arch: "arm"
core: "cortex-m0+"
registers_count: 240
cpu_hz: 125_000_000
flash:
  base: 0x10000000
  size: "8192KB"
ram:
  base: 0x20000000
  size: "264KB"
pins:
  GP11: { gpio: "sio", bit: 11 }
# RP2040's 256-byte second-stage bootloader precedes the application vector table.
reset_vector_offset: 0x100
peripherals:
  - id: "io_bank0"
    type: "rp2040_io_bank0"
    base_address: 0x40014000
    size: "4KB"
    irq: 13
    config:
      debug_schema: "../peripherals/rp2040/io_bank0.yaml"
  - id: "sio"
    type: "rp2040_sio"
    base_address: 0xD0000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2040/sio.yaml"
