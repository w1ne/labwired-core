#
# STM32U545RET6Q (Cortex-M33, 512 KiB flash, LQFP64).
#
# SELF-CONTAINED DERIVATIVE of stm32u575.yaml (built-in chips are embedded one
# file at a time and cannot `include:`). Same IP family: every peripheral kept
# here is byte-identical to the U575 entry, enforced by
# crates/core/tests/u545_u575_drift_guard.rs. Reuses the U575 debug schemas
# (configs/peripherals/stm32u575/*). Differences, all from ST sources:
# - Flash 512 KiB, 2 banks of 256 KiB (the U5 erase path derives the bank
#   size from the mapped flash, crates/core/src/lib.rs).
# - SRAM1+SRAM2 = 256 KiB at 0x20000000, SRAM4 16 KiB at 0x28000000, no SRAM3.
# - No USART2, GPIOF, GPIOI (absent from the ST U545 SVD / stm32u545xx.h).
# - DBGMCU IDCODE 0x10026455 (U545 SVD).
#
# Sources (st.com was unreachable when this was written; all are ST-published
# repositories):
# - ST SVD: STM32U545.svd v1.7 (STM32_SVD pack from STM32CubeCLT), sha256
#   080f9c21fa0e636ece8883e1d5707fc538f259b56e6c5ca46cfe02cce4245330 —
#   tests/fixtures/real_world/stm32u545.svd
# - CMSIS device header stm32u545xx.h (STM32CubeU5 12d19a5).
# - ST open pin data mcu/STM32U545RETxQ.xml (Flash 512, RAM 274, LQFP64).
# - Max CPU clock 160 MHz: Zephyr boards/st/nucleo_u545re_q (rcc clock-frequency).
#
# Not modeled (same as U575): TrustZone/GTZC/SAU enforcement, USB FS, ADC4,
# OCTOSPI, DAC, AES/PKA/SAES/HASH, SDMMC.

name: "stm32u545re"
arch: "arm"
core: "cortex-m33"
# STM32U545 maximum CPU frequency, 160 MHz (Zephyr nucleo_u545re_q rcc clock-frequency).
cpu_hz: 160_000_000

flash:
  base: 0x08000000
  # 512 KiB in two 256 KiB banks (ST open pin data STM32U545RETxQ.xml Flash=512;
  # stm32u545xx.h FLASH_SIZE_DEFAULT 0x80000). Binary units; SI "512KB" would
  # not be the 2-bank power-of-two geometry the flash model assumes.
  size: "512KiB"
ram:
  base: 0x20000000
  # SRAM1 192 KiB @0x20000000 + SRAM2 64 KiB @0x20030000 = 256 KiB contiguous
  # (stm32u545xx.h SRAM1_SIZE 0x30000, SRAM2_SIZE 0x10000; no SRAM3 on U545).
  size: "256KiB"
memory_regions:
  # SRAM4, 16 KiB (stm32u545xx.h SRAM4_BASE_NS/SRAM4_SIZE).
  - name: "sram4"
    base: 0x28000000
    size: "16KiB"
  # Backup SRAM (RM0456 memory map 0x4003_6400-0x4003_6BFF).
  - name: "bkpsram"
    base: 0x40036400
    size: "2KiB"

peripherals:
  # RM0456 / pinned stm32u575xx.h: GPIO EXTI owns EXTICR at 0x60,
  # separate RPR1/FPR1 pending and independent IRQs 11..26. Always-on
  # interrupt controller: no RCC enable gate. GPIO lines only; security,
  # privilege/lock enforcement, software and internal triggers not modeled.
  - id: "exti"
    type: "exti"
    base_address: 0x46022000
    size: "1KB"
    config:
      profile: "stm32u5"
  - id: "rcc"
    type: "rcc"
    base_address: 0x46020C00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/rcc.yaml"
      profile: "stm32v2"
  - id: "pwr"
    type: "pwr"
    base_address: 0x46020800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/pwr.yaml"
      profile: "wba"
    # PWR is on AHB3 on U5: RCC_AHB3ENR.PWREN (bit 2), NOT APB1. The HAL's
    # __HAL_RCC_PWR_CLK_ENABLE() sets exactly this bit (RM0456 §11.8.15).
    clock: { reg: "ahb3enr", bit: 2 }
  # FLASH (RM0456 §7): the `stm32u5` profile keeps the ACR/LATENCY read-back
  # the HAL polls (LATENCY[3:0]+PRFTEN[8]) and adds the non-secure
  # program/erase controller — NSKEYR@0x08/OPTKEYR@0x10 unlock, NSCR@0x28
  # PG/PER/PNB/BKER/STRT (reset LOCK|OPTLOCK), NSSR@0x20 EOP/WRPERR/... W1C —
  # with 2 x 1 MiB banks / 8 KiB pages and 128-bit quad-word programming.
  # `error_flags: true` arms the U5 program gate so a flash-region store is
  # validated against PG/LOCK and buffered into 4 successive 32-bit words;
  # page erase is recorded as a pending op drained per instruction.
  - id: "flash"
    type: "flash"
    base_address: 0x40022000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/flash.yaml"
      profile: "stm32u5"
      error_flags: true
    # FLASHEN (AHB1ENR bit 8) is set in the SVD reset value 0xD020_0100, so
    # the HAL latency writes in HAL_RCC_ClockConfig land without a preamble.
    clock: { reg: "ahb1enr", bit: 8 }
  # STM32U5 system memory: OTP 0x0BFA_0000, package/UID 0x0BFA_0500 and the
  # factory flash-size word at 0x0BFA_07A0 (RM0456 §76). Firmware reads the
  # flash size as a const array; the bare-metal core-smoke writes/reads OTP.
  - id: "sysmem"
    type: "stm32u5_sysmem"
    base_address: 0x0BFA0000
    size: "2KB"
    config:
      flash_size_kb: 512
  - id: "gpioa"
    type: "gpio"
    base_address: 0x42020000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/gpioa.yaml"
      profile: "stm32v2"
      reset_moder: 0xABFFFFFF
      reset_ospeedr: 0x0C000000
      reset_pupdr: 0x64000000
    # GPIOA-I are clocked from RCC_AHB2ENR1 bits 0-8 (RM0456 §11.8.13).
    # Unclocked out of reset — MODER/AFR read 0 / drop writes until on.
    clock: { reg: "ahb2enr", bit: 0 }
  - id: "gpiob"
    type: "gpio"
    base_address: 0x42020400
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/gpiob.yaml"
      profile: "stm32v2"
      reset_moder: 0xFFFFFEBF
      reset_ospeedr: 0x000000C0
      reset_pupdr: 0x00000100
    clock: { reg: "ahb2enr", bit: 1 }
  - id: "gpioc"
    type: "gpio"
    base_address: 0x42020800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/gpioc.yaml"
      profile: "stm32v2"
      reset_moder: 0xFFFFFFFF
      reset_ospeedr: 0
      reset_pupdr: 0
    clock: { reg: "ahb2enr", bit: 2 }
  - id: "gpiod"
    type: "gpio"
    base_address: 0x42020C00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/gpiod.yaml"
      profile: "stm32v2"
      reset_moder: 0xFFFFFFFF
      reset_ospeedr: 0
      reset_pupdr: 0
    clock: { reg: "ahb2enr", bit: 3 }
  - id: "gpioe"
    type: "gpio"
    base_address: 0x42021000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/gpioe.yaml"
      profile: "stm32v2"
      reset_moder: 0xFFFFFFFF
      reset_ospeedr: 0
      reset_pupdr: 0
    clock: { reg: "ahb2enr", bit: 4 }
  - id: "gpiog"
    type: "gpio"
    base_address: 0x42021800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/gpiog.yaml"
      profile: "stm32v2"
      reset_moder: 0xFFFFFFFF
      reset_ospeedr: 0
      reset_pupdr: 0
    clock: { reg: "ahb2enr", bit: 6 }
  - id: "gpioh"
    type: "gpio"
    base_address: 0x42021C00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/gpioh.yaml"
      profile: "stm32v2"
      reset_moder: 0xFFFFFFFF
      reset_ospeedr: 0
      reset_pupdr: 0
    clock: { reg: "ahb2enr", bit: 7 }
  # USART1 is the NUCLEO-U545RE-Q VCP console (PA9/PA10). IRQ 61 per SVD.
  - id: "usart1"
    type: "uart"
    base_address: 0x40013800
    size: "1KB"
    irq: 61
    config:
      debug_schema: "../peripherals/stm32u575/usart1.yaml"
      profile: "stm32v2"
      full_featured: true
    # USART1 is clocked from RCC_APB2ENR.USART1EN (bit 14). Unclocked out of
    # reset (RM0456 §11.8.17) — TDR writes are dropped until on.
    clock: { reg: "apb2enr", bit: 14 }
  - id: "usart3"
    type: "uart"
    base_address: 0x40004800
    size: "1KB"
    irq: 63
    config:
      debug_schema: "../peripherals/stm32u575/usart3.yaml"
      profile: "stm32v2"
      full_featured: true
    clock: { reg: "apb1enr1", bit: 18 }
  - id: "uart4"
    type: "uart"
    base_address: 0x40004C00
    size: "1KB"
    irq: 64
    config:
      debug_schema: "../peripherals/stm32u575/uart4.yaml"
      profile: "stm32v2"
    clock: { reg: "apb1enr1", bit: 19 }
  - id: "lpuart1"
    type: "uart"
    base_address: 0x46002400
    size: "1KB"
    irq: 66
    config:
      debug_schema: "../peripherals/stm32u575/lpuart1.yaml"
      profile: "stm32v2"
      stm32_lpuart: true
    # LPUART1 sits on APB3: RCC_APB3ENR.LPUART1EN (bit 6).
    clock: { reg: "apb3enr", bit: 6 }
  # I2C1 is the default Arduino Wire bus. Modern L4-class I2C IP (same profile
  # WBA52 wires). Event IRQ 55; error IRQ 56 not declared (single-line model).
  - id: "i2c1"
    type: "i2c"
    base_address: 0x40005400
    size: "1KB"
    irq: 55
    config:
      debug_schema: "../peripherals/stm32u575/i2c1.yaml"
      profile: "stm32l4"
    # I2C1/2 are clocked from RCC_APB1ENR1 bits 21/22; I2C3 from
    # RCC_APB3ENR.I2C3EN (bit 7) (RM0456 §11.8.17/18).
    clock: { reg: "apb1enr1", bit: 21 }
  - id: "i2c2"
    type: "i2c"
    base_address: 0x40005800
    size: "1KB"
    irq: 57
    config:
      debug_schema: "../peripherals/stm32u575/i2c2.yaml"
      profile: "stm32l4"
    clock: { reg: "apb1enr1", bit: 22 }
  - id: "i2c3"
    type: "i2c"
    base_address: 0x46002800
    size: "1KB"
    irq: 88
    config:
      debug_schema: "../peripherals/stm32u575/i2c3.yaml"
      profile: "stm32l4"
    clock: { reg: "apb3enr", bit: 7 }
  # SPI1 is the default Arduino SPI bus (PA5 SCK / PA6 MISO / PA7 MOSI / PA4 NSS).
  # `pad_map: "stm32u5"` selects the U575 AF table in `bus/attach.rs`
  # (DS13737 Table 27) so the SPI v3 narrator's waveform reaches these pads.
  # PA4/NSS is on the same AF5 but is not routable: `SpiSignal` carries only
  # SCK/MOSI/MISO. SPI2/SPI3 rows are transcribed from the same table; SPI3
  # MOSI also rides PD6/AF5, the one non-AF6 SPI3 data row.
  - id: "spi1"
    type: "spi"
    base_address: 0x40013000
    size: "1KB"
    irq: 59
    config:
      debug_schema: "../peripherals/stm32u575/spi1.yaml"
      profile: "stm32h5"
      pad_map: "stm32u5"
    # SPI1 is clocked from RCC_APB2ENR.SPI1EN (bit 12); SPI2 from
    # RCC_APB1ENR1.SPI2EN (bit 14); SPI3 from RCC_APB3ENR.SPI3EN (bit 5).
    clock: { reg: "apb2enr", bit: 12 }
  - id: "spi2"
    type: "spi"
    base_address: 0x40003800
    size: "1KB"
    irq: 60
    config:
      debug_schema: "../peripherals/stm32u575/spi2.yaml"
      profile: "stm32h5"
      pad_map: "stm32u5"
    clock: { reg: "apb1enr1", bit: 14 }
  - id: "spi3"
    type: "spi"
    base_address: 0x46002000
    size: "1KB"
    irq: 99
    config:
      debug_schema: "../peripherals/stm32u575/spi3.yaml"
      profile: "stm32h5"
      pad_map: "stm32u5"
      limited_features: true
    clock: { reg: "apb3enr", bit: 5 }
  # TIM2/TIM5 are the 32-bit general-purpose timers on U5.
  - id: "tim2"
    type: "timer"
    base_address: 0x40000000
    size: "1KB"
    irq: 45
    config:
      debug_schema: "../peripherals/stm32u575/tim2.yaml"
      width: 32
    # TIM2/3/6/7 are clocked from RCC_APB1ENR1 bits 0/1/4/5; TIM1 from
    # RCC_APB2ENR.TIM1EN (bit 11) (RM0456 §11.8.17/18). Unclocked out of
    # reset — ARR reads 0 until the clock is on.
    clock: { reg: "apb1enr1", bit: 0 }
  - id: "tim3"
    type: "timer"
    base_address: 0x40000400
    size: "1KB"
    irq: 46
    config:
      debug_schema: "../peripherals/stm32u575/tim3.yaml"
    clock: { reg: "apb1enr1", bit: 1 }
  - id: "tim6"
    type: "timer"
    base_address: 0x40001000
    size: "1KB"
    irq: 49
    config:
      debug_schema: "../peripherals/stm32u575/tim6.yaml"
      basic: true
    clock: { reg: "apb1enr1", bit: 4 }
  - id: "tim7"
    type: "timer"
    base_address: 0x40001400
    size: "1KB"
    irq: 50
    config:
      debug_schema: "../peripherals/stm32u575/tim7.yaml"
      basic: true
    clock: { reg: "apb1enr1", bit: 5 }
  - id: "tim1_pwm"
    type: "timer"
    base_address: 0x40012C00
    size: "1KB"
    irq: 42
    config:
      debug_schema: "../peripherals/stm32u575/tim1.yaml"
      advanced: true
    clock: { reg: "apb2enr", bit: 11 }
  # FDCAN1 — Bosch M_CAN, the same IP/profile H563 declares (SVD FDCAN1 block
  # is register- and reset-identical between stm32u575 and stm32h563: 37
  # registers, CREL 0x3214_1218, ENDN 0x8765_4321). The 4 KiB window covers
  # the shared message RAM (FDCAN1_RAM @ 0x4000_AC00, window offset 0x800);
  # SRAMCAN element addresses are hardwired as the HAL's SRAMCAN_* constants.
  # The U575 has exactly ONE FDCAN instance (DS13737: "1 CAN FD controller";
  # the vendored SVD and stm32u575xx.h both declare only FDCAN1), so there is
  # no fdcan2 at 0x4000_A800. FDCAN1 pins on the NUCLEO-U575ZI-Q are
  # PB8/PB9 (AF9) — also PA11/PA12, PD0/PD1, PF7/PF8, all AF9 per DS13737
  # Table 27 / the PlatformIO variant — but the L8 matrix sketch drives it in
  # internal loopback (TEST.LBCK) over MMIO, so no pad routing is involved.
  - id: "fdcan1"
    type: "fdcan"
    base_address: 0x4000A400
    size: "4KB"
    irq: 39  # FDCAN1_IT0; line 1 (FDCAN1_IT1 = 40) via ILS not modeled
    config:
      debug_schema: "../peripherals/stm32u575/fdcan1.yaml"
    # FDCAN1 is clocked from RCC_APB1ENR2.FDCAN1EN (bit 9), SVD RCC_APB1ENR2 @
    # offset 0xA0 — NOT APB1ENR1. Same 0xA0 offset the H5 uses for
    # APB1HENR.FDCAN1EN, which is why this is SVD-pinned rather than copied
    # from the H563 yaml.
    clock: { reg: "apb1enr2", bit: 9 }
  - id: "gpdma1"
    type: "gpdma"
    base_address: 0x40020000
    # U5 GPDMA1 has 16 channels at 0x80 stride from 0x50: the block runs to
    # 0x84C, so the window must cover 0x50 + 16*0x80 = 0x850 — 4KB. (2KB cut
    # off the top half of C14/C15.) Next peripheral is CORDIC @ 0x40021000.
    size: "4KB"
    irq: 29
    config:
      debug_schema: "../peripherals/stm32u575/gpdma1.yaml"
      # CH0..CH7 are NVIC 29..36; the SVD splits CH8..CH15 onto 80..87.
      irq_base: 29
      irq_high_base: 80
      # GPDMA1 request-select numbers (RM0456 Table 136 / stm32u5xx_hal_dma.h
      # GPDMA1_REQUEST_*). The bus names a request `<peripheral id>_tx|_rx`.
      requests:
        spi1_rx: 6
        spi1_tx: 7
        spi2_rx: 8
        spi2_tx: 9
        spi3_rx: 10
        spi3_tx: 11
        i2c1_rx: 12
        i2c1_tx: 13
        i2c1_evc: 14
        i2c2_rx: 15
        i2c2_tx: 16
        i2c2_evc: 17
        i2c3_rx: 18
        i2c3_tx: 19
        i2c3_evc: 20
        usart1_rx: 24
        usart1_tx: 25
        usart2_rx: 26
        usart2_tx: 27
        usart3_rx: 28
        usart3_tx: 29
        uart4_rx: 30
        uart4_tx: 31
        lpuart1_rx: 34
        lpuart1_tx: 35
        tim6_up: 4
        tim7_up: 5
    # GPDMA1 is clocked from RCC_AHB1ENR.GPDMA1EN (bit 0). Unclocked out of
    # reset (RM0456 §11.8.12) — channel registers drop writes until on.
    clock: { reg: "ahb1enr", bit: 0 }
  # ADC1 is the analogRead path on the Arduino core, clocked from AHB2ENR.ADCEN.
  - id: "adc1"
    type: "adc"
    base_address: 0x42028000
    size: "1KB"
    irq: 37
    config:
      debug_schema: "../peripherals/stm32u575/adc1.yaml"
      # U5 ADC1 register map, SVD-verified (tests/fixtures/real_world/
      # stm32u575.svd ADC1): CFGR1.RES 2 bits [3:2] with the 14-bit
      # encoding (14/12/10/8), PCSEL@0x1C, LTR1-3/HTR1-3@0xA8..0xBC
      # (HTRx reset 0x01FF_FFFF), GCOMP@0x70, CALFACT2@0xC8, DR@0x40.
      # ADC4 (0x46021000) is NOT declared: its SVD map is a different
      # 12-bit class (SMPR/AWDxTR/CHSELRMOD0/1, no PCSEL/LTR/HTR/CALFACT2)
      # and is not a register-compatible sibling of ADC1.
      profile: "stm32u5"
    # ADC1 is on AHB2: RCC_AHB2ENR1.ADC12EN (bit 10) (RM0456 §11.8.13).
    clock: { reg: "ahb2enr", bit: 10 }
  - id: "rtc"
    type: "rtc_v3"
    base_address: 0x46007800
    size: "1KB"
    irq: 2
    config:
      debug_schema: "../peripherals/stm32u575/rtc.yaml"
    # The RTC register interface needs the APB3 bus clock
    # (RCC_APB3ENR.RTCAPBEN bit 21) AND its kernel clock
    # (RCC_BDCR.RTCEN bit 15) — the RTC calendar cannot run without both
    # (RM0456 §11.8.18/40).
    clock:
      - { reg: "apb3enr", bit: 21 }
      - { reg: "bdcr", bit: 15 }
  - id: "iwdg"
    type: "iwdg"
    base_address: 0x40003000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/iwdg.yaml"
    # IWDG has no RCC enable bit on U5: it is an always-on-domain peripheral
    # clocked straight from the LSI, and RM0456 §11.8.41 states LSIRDY is set
    # when the IWDG uses the LSI even with LSION=0 — so BDCR.LSION is NOT a
    # valid gate. Left ungated deliberately.
  - id: "crc"
    type: "crc"
    base_address: 0x40023000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/crc.yaml"
      idr_width: 32
    # CRC is on AHB1: RCC_AHB1ENR.CRCEN (bit 12) (RM0456 §11.8.12).
    clock: { reg: "ahb1enr", bit: 12 }
  # CRS calibrates HSI48. The Arduino U5 core's SystemClock_Config ends in
  # HAL_RCCEx_CRSConfig: force-reset through RCC APB1RSTR1, write CFGR/TRIM,
  # enable AUTOTRIMEN|CEN. Undeclared, the first CRS_CFGR write bus-faults
  # into Default_Handler before setup() ever runs — the second sequential
  # Arduino-matrix L0 boot blocker, after the RCC HSI48 fix (rcc.rs).
  - id: "crs"
    type: "crs"
    base_address: 0x40006000
    size: "1KB"
    irq: 74
    config:
      debug_schema: "../peripherals/stm32u575/crs.yaml"
    # CRS is on APB1: RCC_APB1ENR1.CRSEN (bit 24). The Arduino U5 variant's
    # SystemClock_Config calls __HAL_RCC_CRS_CLK_ENABLE() before touching
    # CRS_CFGR, so this gate matches real firmware ordering (RM0456 §11.8.17).
    clock: { reg: "apb1enr1", bit: 24 }
  - id: "rng"
    type: "rng"
    base_address: 0x420C0800
    size: "1KB"
    irq: 94
    config:
      debug_schema: "../peripherals/stm32u575/rng.yaml"
    # RNG is on AHB2: RCC_AHB2ENR1.RNGEN (bit 18) (RM0456 §11.8.13).
    clock: { reg: "ahb2enr", bit: 18 }
  - id: "icache"
    type: "icache"
    base_address: 0x40030400
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/icache.yaml"
      # U5 register contract (RM0456 §8): CACHEINV self-clear, BSYEND IRQ,
      # WAYSEL locked while enabled. Other icache users keep the read-zero stub.
      profile: "stm32u5"
    # ICACHE has no bus-enable bit in any U5 ENR — only the sleep-mode
    # RCC_AHB1SMENR.ICACHESMEN (bit 29). Left ungated deliberately.
  # U5 DBGMCU base is 0xE0044000 (not the M4 0xE0042000). IDCODE reset
  # 0x10026455 per the U545 SVD (DEV_ID 0x455, REV_ID 0x1002).
  - id: "dbgmcu"
    type: "dbgmcu"
    base_address: 0xE0044000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32u575/dbgmcu.yaml"
      idcode: 0x10026455
    # DBGMCU has no RCC enable bit on U5 (debug domain, no DBGMCUEN field in
    # any ENR). Left ungated deliberately.
  # SysTick is required by every HAL/Arduino delay path; declare it so the
  # scheduler-backed counter is mapped at 0xE000E010. CALIB is left at the
  # model default (NoRef) — no bench silicon capture for a U5 TENMS value yet.
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
