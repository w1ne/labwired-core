# Narrow STM32F413ZHT6 profile for the NUCLEO-F413ZH board smoke.
#
# This profile maps the reset-clock RCC slice, GPIOB/PB7, and SysTick only.
# It intentionally omits all other F413 peripherals and the separate SRAM2
# window; accesses outside this exercised slice remain unsupported.
# Sources: ST DS11581, RM0430, PM0214, and UM1974 / MB1137.
name: stm32f413zh-nucleo-smoke
arch: arm
core: cortex-m4
cpu_hz: 16000000

flash:
  base: 0x08000000
  size: 1536KB
ram:
  base: 0x20000000
  size: 256KB

# The board's blue LD2 user LED is connected to PB7.
pins:
  PB7: { gpio: gpiob, bit: 7 }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40023800
    # Include RCC registers only through AHB1ENR at offset 0x30.
    size: "52"
    config:
      profile: stm32f4

  - id: systick
    type: systick
    base_address: 0xE000E010

  - id: gpiob
    type: gpio
    base_address: 0x40020400
    # Include GPIOB registers only through BSRR at offset 0x18.
    size: "32"
    clock: { reg: ahb1enr, bit: 1 }
    config:
      profile: stm32v2
