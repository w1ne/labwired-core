schema_version: "1.0"
name: "STM32G474RE"
arch: "arm"
core: "cortex-m4"
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# STM32G474RE maximum core clock, 170 MHz.
cpu_hz: 170_000_000

flash:
  base: 0x08000000
  size: "512KB"
ram:
  base: 0x20000000
  size: "128KB"

# No `pins:` map. A non-empty map is the complete pad list in
# `SystemBus::resolve_pin_odr`, so a PA8-only map refused every other pad
# as a GPIO output. Without a map the STM32 label parse resolves all
# PA..PD pads. TIM1_CH1 reaches PA8 (AF6, Arduino D7 on CN9, ST UM2505)
# through `STM32G4_TIMER_PADS` in `bus/attach.rs`, not through this map.

# SRAMCAN (stm32g474xx.h SRAMCAN_BASE) sits at 0x4000A400, 0x4000 above
# FDCAN1's registers, while the shared `fdcan` model serves its message RAM at
# window offset +0x800. A window that wide would claim PWR, I2C3, LPUART1 and
# the other APB1 blocks in between, so this same-backing mirror routes SRAMCAN
# onto the model's RAM instead (the stm32g0b1re pattern). The mirror is 1 KiB
# (0x4000A400-0x4000A800 onto 0x40006C00-0x40007000): the FDCAN1 section
# (0x350, HAL SRAMCAN_SIZE) plus the head of the FDCAN2 section. FDCAN2 and
# FDCAN3 are not modelled.
memory_regions:
  - name: "sramcan"
    base: 0x4000A400
    size: "1KB"
    alias_of: 0x40006C00

# ADC1 regular inputs of the LQFP64 package, from ST STM32_open_pin_data
# `STM32G474R(B-C-E)Tx.xml`: PA0-PA3 = IN1-IN4, PB14 = IN5, PC0-PC3 = IN6-IN9,
# PB12 = IN11, PB1 = IN12, PB11 = IN14, PB0 = IN15. PA0 is IN1 here, not IN0
# (F1/F4) and not IN5 (L4). PF0 (ADC1_IN10) is left out: this descriptor
# declares no GPIOF. PA4-PA7, PC4, PC5 and PB2 reach ADC2 only, PB15 ADC2 and
# ADC4, PB13 ADC3 only, PA8 and PA9 ADC5 only. This descriptor instantiates none of
# those converters, so these pads are refused instead of being put on an
# ADC1 channel. Consumed by co-simulation `board.analog.<pad>_volts`.
analog_pins:
  PA0: { peripheral: "adc1", channel: 1 }
  PA1: { peripheral: "adc1", channel: 2 }
  PA2: { peripheral: "adc1", channel: 3 }
  PA3: { peripheral: "adc1", channel: 4 }
  PB14: { peripheral: "adc1", channel: 5 }
  PC0: { peripheral: "adc1", channel: 6 }
  PC1: { peripheral: "adc1", channel: 7 }
  PC2: { peripheral: "adc1", channel: 8 }
  PC3: { peripheral: "adc1", channel: 9 }
  PB12: { peripheral: "adc1", channel: 11 }
  PB1: { peripheral: "adc1", channel: 12 }
  PB11: { peripheral: "adc1", channel: 14 }
  PB0: { peripheral: "adc1", channel: 15 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    config:
      debug_schema: "../peripherals/stm32g474re/rcc.yaml"
      profile: "stm32g4"
  - id: "gpioa"
    type: "gpio"
    base_address: 0x48000000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpioa.yaml"
      profile: "stm32v2"
  - id: "gpiob"
    type: "gpio"
    base_address: 0x48000400
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpiob.yaml"
      profile: "stm32v2"
  - id: "gpioc"
    type: "gpio"
    base_address: 0x48000800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpioc.yaml"
      profile: "stm32v2"
  - id: "gpiod"
    type: "gpio"
    base_address: 0x48000c00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpiod.yaml"
      profile: "stm32v2"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    config:
      debug_schema: "../peripherals/stm32g474re/stk.yaml"
  - id: "usart1"
    type: "uart"
    base_address: 0x40013800
    irq: 37
    config:
      debug_schema: "../peripherals/stm32g474re/usart1.yaml"
      profile: "stm32v2"
  - id: "usart2"
    type: "uart"
    base_address: 0x40004400
    irq: 38
    config:
      debug_schema: "../peripherals/stm32g474re/usart2.yaml"
      profile: "stm32v2"
  - id: "lpuart1"
    type: "uart"
    base_address: 0x40008000
    irq: 91
    config:
      debug_schema: "../peripherals/stm32g474re/lpuart1.yaml"
      profile: "stm32v2"
  - id: "flash"
    type: "flash"
    base_address: 0x40022000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/flash.yaml"
      # L4 register file with a 4-bit ACR.LATENCY (RM0440 §3.7.1).
      profile: "stm32g4"
  - id: "pwr"
    type: "pwr"
    base_address: 0x40007000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/pwr.yaml"
  # CRC (RM0440) @ 0x40023000 — the AHB1 base ST's own stm32g474.svd gives, the
  # same address stm32l476/stm32h563 already map. This is the v2 programmable
  # block (CRC_INIT@0x10, CRC_POL@0x14), and STM32Cube's HAL_CRC_Init writes the
  # CRC-32 polynomial 0x04C11DB7 to CRC_POL during Arduino core startup; with no
  # CRC mapped that store landed on unmapped MMIO. IDR is 32-bit here (F0/F1/L0
  # are the 8-bit parts). Left ungated: RCC_AHB1ENR.CRCEN is not surfaced by the
  # stm32g4 RCC model's enable-register set, matching the dma1 entry below.
  - id: "crc"
    type: "crc"
    base_address: 0x40023000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/crc.yaml"
      idr_width: 32
  # ── Tier-1 peripherals (RM0440). The RCC model is profile stm32g4, so the
  # clock-gate `reg:` names resolve to the RM0440 enable-register offsets
  # (ahb2enr@0x4C, apb1enr1@0x58, apb2enr@0x60 — the same offsets ST's CMSIS
  # stm32g474xx.h gives); the `bit:` values are the RM0440 §7.4 enable bits for
  # each block's real bus. ─────────────────────────────────────────────────
  # TIM2 — 32-bit GP timer (APB1). RCC_APB1ENR1.TIM2EN (bit 0).
  - id: "tim2"
    type: "timer"
    base_address: 0x40000000
    size: "1KB"
    irq: 28
    config:
      debug_schema: "../peripherals/stm32g474re/tim2.yaml"
      width: 32
      # Channel outputs reach the pads through the G4 AF table (TIM2 AF1;
      # bus/attach.rs STM32G4_TIMER_PADS).
      pad_map: "stm32g4"
    clock: { reg: "apb1enr", bit: 0 }
  # TIM1 — advanced-control PWM timer (APB2). The `_pwm` id suffix declares the
  # pwm class alongside timer. RCC_APB2ENR.TIM1EN (bit 11).
  - id: "tim1_pwm"
    type: "timer"
    base_address: 0x40012C00
    size: "1KB"
    # TIM1_UP_TIM16_IRQn = 25, TIM1_CC_IRQn = 27 (stm32g4xx CMSIS).
    # BRK (24) and TRG/COM (26) route BIF and TIF/COMIF.
    irq: 25
    config:
      capture_compare_irq: 27
      trigger_com_irq: 26
      break_irq: 24
      debug_schema: "../peripherals/stm32g474re/tim1.yaml"
      advanced: true
      pad_map: "stm32g4"
    clock: { reg: "apb2enr", bit: 11 }
  # FDCAN1 (FDCAN1_BASE 0x40006400). The same Bosch M_CAN register map as the
  # H5 (stm32g474xx.h FDCAN_GlobalTypeDef, FDCAN_CONFIG_BASE = FDCAN1 + 0x100)
  # and the same fixed SRAMCAN layout (stm32g4xx_hal_fdcan.c SRAMCAN_RF0SA 0xB0,
  # SRAMCAN_TFQSA 0x278, SRAMCAN_SIZE 0x350), so it uses the shared `fdcan`
  # model. Message RAM: see `sramcan` in memory_regions. Divergences: FDCAN2
  # (0x40006800) reads 0, and the model keeps SRAMCAN where the G474 has
  # FDCAN3's registers (0x40006C00), so FDCAN3 is not usable. No G474 silicon
  # capture backs this block; the register behaviour is the H5 capture13 pin.
  - id: "fdcan1"
    type: "fdcan"
    base_address: 0x40006400
    # 3 KiB: registers + message RAM at +0x800, ending where PWR (0x40007000)
    # begins. A 4 KiB window collides with PWR.
    size: "3KB"
    irq: 21  # FDCAN1_IT0; IT1 = 22 via ILS not modeled
    # RCC_APB1ENR1.FDCANEN (bit 25, RCC_APB1ENR1_FDCANEN_Pos) gates all three
    # instances.
    clock: { reg: "apb1enr", bit: 25 }
    config:
      debug_schema: "../peripherals/stm32h563/fdcan1.yaml"
  # I2C1 (APB1) — modern v2 controller. RCC_APB1ENR1.I2C1EN (bit 21).
  - id: "i2c1"
    type: "i2c"
    base_address: 0x40005400
    size: "1KB"
    irq: 31
    config:
      debug_schema: "../peripherals/stm32g474re/i2c1.yaml"
      profile: "stm32l4"
    clock: { reg: "apb1enr", bit: 21 }
  # SPI1 (APB2). RCC_APB2ENR.SPI1EN (bit 12).
  - id: "spi1"
    type: "spi"
    base_address: 0x40013000
    size: "1KB"
    irq: 35
    config:
      debug_schema: "../peripherals/stm32g474re/spi1.yaml"
      profile: "stm32_fifo"
      # G4 AF pinout (SPI1 AF5, NSS on PA4/PA15), not the L4 one.
      pad_map: "stm32g4"
    clock: { reg: "apb2enr", bit: 12 }
  # ADC1 (AHB2). RCC_AHB2ENR.ADC12EN (bit 13). L4 register layout: the
  # DEEPPWD→ADVREGEN→ADEN→ADRDY power-up path and software-started regular
  # conversions of the `analog_pins:` inputs are modelled
  # (tests/analog/cosim_stm32wb_g4_l0_analog.rs).
  - id: "adc1"
    type: "adc"
    base_address: 0x50000000
    size: "1KB"
    irq: 18
    config:
      debug_schema: "../peripherals/stm32g474re/adc1.yaml"
      profile: "stm32l4"
    clock: { reg: "ahb2enr", bit: 13 }
  # DMA1 (AHB1, 7-channel + DMAMUX). RM0440 puts DMA1EN on AHB1ENR (bit 0). The
  # stm32g4 RCC model stores AHB1ENR@0x48 but no `clock:` gate is declared for
  # the channel (left ungated); the mem-to-mem round-trip is the truthful proof
  # of the model.
  - id: "dma1"
    type: "dma"
    base_address: 0x40020000
    size: "1KB"
    irq: 11
    config:
      debug_schema: "../peripherals/stm32g474re/dma1.yaml"
  # IWDG — clocked by the LSI, no RCC enable gate on silicon (ungated).
  - id: "iwdg"
    type: "iwdg"
    base_address: 0x40003000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/iwdg.yaml"
  # RTC (APB1) — register interface gated by RCC_APB1ENR1.RTCAPBEN (bit 10).
  - id: "rtc"
    type: "rtc"
    base_address: 0x40002800
    size: "1KB"
    irq: 2
    clock: { reg: "apb1enr", bit: 10 }
    config:
      debug_schema: "../peripherals/stm32g474re/rtc.yaml"
  # NVIC is wired unconditionally for Cortex-M machines; this entry declares
  # the tier1 irq class and pins the canonical base.
  - id: "nvic"
    type: "nvic"
    base_address: 0xE000E100
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/nvic.yaml"
  # DBGMCU (RM0440 §46.6) @ 0xE0042000 — the Cortex-M3/M4 private-peripheral
  # location, confirmed against ST's own stm32g474.svd. Zephyr's SoC init calls
  # LL_DBGMCU_EnableDBGSleepMode(), a read-modify-write of DBGMCU_CR at
  # 0xE0042004; with no DBGMCU mapped that access had nowhere to land.
  # DBG_SLEEP/STOP/STANDBY are plain R/W bits on silicon with no effect unless
  # a debug probe is attached, which is exactly what the latching model gives.
  #
  # idcode: DEV_ID 0x469 is the RM0440 §46.6.1 value for the category-3 parts
  # (STM32G473/G474/G483/G484). REV_ID is deliberately left 0: unlike
  # stm32h563 and stm32f407, whose REV_IDs were read off real dies, no
  # NUCLEO-G474RE capture exists. A zero revision is visibly a placeholder
  # rather than a plausible-looking wrong answer; fill it in from a bench
  # probe when one is available.
  - id: "dbgmcu"
    type: "dbgmcu"
    base_address: 0xE0042000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/dbgmcu.yaml"
      idcode: 0x00000469
