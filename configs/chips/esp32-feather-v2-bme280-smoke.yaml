# Adafruit Feather ESP32 V2 profile for the STEMMA QT BME280 path.
#
# This slice exposes the board's GPIO2 sensor-rail switch, UART0 console, and
# GPIO-matrix I2C0 route on SDA=GPIO22 / SCL=GPIO20. PSRAM data behavior,
# wireless radios, USB bridge, NeoPixel signaling, timers, and SPI are omitted.
name: "esp32-feather-v2-bme280-smoke"
arch: "xtensa-lx6"
cpu_hz: 240000000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.25
  vih: 0.75

flash:
  base: 0x400D0000
  size: "4MiB"
ram:
  base: 0x3FFB0000
  size: "192KiB"

pins:
  GPIO2: { gpio: "gpio", bit: 2, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO13: { gpio: "gpio", bit: 13, functions: [{ type: gpio, peripheral: gpio }] }
  GPIO20: { gpio: "gpio", bit: 20 }
  GPIO22: { gpio: "gpio", bit: 22 }

peripherals:
  - id: "uart0"
    type: "uart"
    base_address: 0x3FF40000
    size: "256B"
    config:
      debug_schema: "../peripherals/esp32/uart0.yaml"

  - id: "gpio"
    type: "esp32_gpio"
    base_address: 0x3FF44000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/gpio.yaml"

  - id: "i2c0"
    type: "esp32_i2c"
    base_address: 0x3FF53000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/i2c0.yaml"
