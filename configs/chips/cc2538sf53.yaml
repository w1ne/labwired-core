# LabWired - CC2538SF53 chip configuration
#
# The TI CC2538SF53: Cortex-M3, 512 KiB flash, 32 KiB SRAM, 2.4-GHz
# IEEE 802.15.4 radio — the MCU on the TI CC2538DK (CC2538EM on a SmartRF06
# evaluation board).
#
# Sources:
# - SWRU319C "CC2538 User's Guide" (April 2012, rev. May 2013):
#   Table 4-1 "Memory Map" (every base address below), Table 5-2 interrupt
#   assignments (regular map), Table 7-3 "SYS_CTRL Register Summary",
#   §8.6 flash/CCA, §9 GPIO + IOC, §13 sleep timer, Table 18-4 "UART0
#   Register Summary", §23 radio (Tables 23-9/23-10).
# - SWRU333A "CC2538 ROM User's Guide": §2.2 start-up sequence, §3.2 utility
#   API (the in-tree clean-room ROM).
# - SWRS096 "CC2538 datasheet": device table (CC2538SF53 = 512 KB flash,
#   32 KB RAM), §5.18 "DC Characteristics" (input thresholds).
#
# Profiles:
# - uart  `pl011`               — UART0/1 are PL011-compatible (DR @0x000,
#   FR @0x018, IBRD @0x024, FBRD @0x028, LCRH @0x02C, CTL @0x030). The
#   CC2538 extras (UART_CC @0xFC8, LCTL/LSS/LTIM, 9-bit address) are accepted
#   and ignored; UART_CC = 0 (SYS_DIV baud clock) is the reset state.
# - gpio  `cc2538_pl061_gpio`   — GPIO_DATA address-masked over 0x000-0x3FC,
#   GPIO_DIR @0x400, GPIO_AFSEL @0x420 (crates/core/src/peripherals/cc2538.rs).
# - clock `cc2538_sys_ctrl`     — CLOCK_CTRL/CLOCK_STA and the RCGC/SCGC/DCGC
#   gate banks at their Table 7-3 reset values; CLOCK_STA.SYNC_32K from the
#   cycle clock.
# - `cc2538_rfcore`             — the 802.15.4 radio; alone, in an empty
#   channel; on a world's shared 802.15.4 air (crates/core/src/peripherals/
#   ieee802154_air.rs), TX/RX with the RX FIFO, frame filtering, AUTOACK and
#   the RF TX/RX IRQ 141 (crates/core/src/peripherals/cc2538/rfcore.rs).
# - `cc2538_sleep_timer`        — SMWDTHROSC 32-kHz count + compare IRQ
#   (crates/core/src/peripherals/cc2538/sleep_timer.rs).
# - `cc2538_flash_ctrl`         — FLASH_CTRL page erase / word write, CCA
#   lock bits, DIECFG0-2 (crates/core/src/peripherals/cc2538/flash_ctrl.rs).
# - `cc2538_aes`                — AES/SHA-256 cryptoprocessor (SWRU319C §22.2,
#   Table 22-103): two-channel DMA, key store, AES ECB/CBC/CTR/CBC-MAC/CCM/
#   GCM at 128/192/256 bits, SHA-256, IRQ 143
#   (crates/core/src/peripherals/cc2538/aes.rs).
# - `cc2538_udma`               — µDMA (PL230, SWRU319C §10): software-
#   requested basic/auto transfers, CHIS + IRQ 46
#   (crates/core/src/peripherals/cc2538/udma.rs).
# - `cc2538_pl022_ssi`          — SSI0/1 master-mode SPI (IRQ 7/34)
#   (crates/core/src/peripherals/cc2538/ssi.rs).
# - `cc2538_i2cm`               — I2C master (§21.3): single-byte start,
#   repeated-start and stop commands with attached I2cDevice slaves (IRQ 8).
# - `cc2538_gptimer`            — GPTimer0-3 (§11): 32-bit and split 16-bit
#   one-shot/periodic, up/down, prescaler, time-out + match interrupts
#   (crates/core/src/peripherals/cc2538/gptimer.rs).
#
# Tier: L1 UART+LED smoke — boot, UART0 console, the SmartRF06 LEDs with
# GPIO_DATA readback and the five keys' reset pull-up levels — plus stock
# Contiki-NG v4.9 hello-world booting through the ROM, RF core and sleep timer
# (examples/cc2538dk/contiki-hello.yaml). SIM-DERIVED (no CC2538 bench part).
#
# NOT modelled in this slice:
# - TI's ROM itself: 0x0 holds LabWired's clean-room ROM (memory_regions
#   below) — no serial boot loader, backdoor pin or RAM BIST. Its
#   PageErase/ProgramFlash drive the flash-controller model. An image with
#   valid vectors at the flash base is still entered there directly by the
#   loader.
# - SYS_CTRL clock gating: the gates are stored and read back, but no
#   peripheral is gated by them. No oscillator start-up timing, no PM1-3, no
#   software reset.
# - IOC routing: the Table 9-7 registers (IOC_Pxx_SEL / IOC_Pxx_OVER /
#   input selects) are stored and read back at their reset values and field
#   widths, but no SEL/INPUT_SEL value connects a peripheral to a pad and no
#   OVER value changes a pad's pull or output enable.
# - GPIO interrupts (RIS/MIS never set) and the AFSEL commit lock.
# - RF: path loss, range and collisions on the air (lossless, every node
#   hears every other), the CSP, the MAC timer count, source matching and the
#   RF error IRQ. Without an air nothing is ever received. The watchdog and
#   sleep-timer capture.
# - µDMA peripheral requests, CHASGN/CHMAP routing, ping-pong/scatter-gather
#   and the error IRQ (a channel moves only on a software request).
# - flash controller: no CPU stall while executing from flash during an
#   operation, no flash DMA trigger, no flash interrupt.
# - GPTimer RTC, capture and PWM modes, the ADC trigger and timer sync.
# - SOC_ADC: conversion timing, STSEL 01/10 sequence starts, the IOC check
#   that skips inactive sequence channels, ADC DMA triggers, a varying
#   temperature, the CSP-clocked RNG and the comparator's PA5 edge/IRQ.
# - CCTEST and ANA_REGS: register storage only; no pad, observation-output,
#   temperature-gate, USB PHY or bias effect.
# - PKA engine (0x4400_4000) and USB controller (0x4008_9000): not mapped.
#   Neither has a model, so the profile does not declare their windows; a
#   load or store there is an unmapped-access error instead of a silent zero.
#   The PKA SRAM window is plain RAM. I2CM is a synchronous byte-command
#   master; its I2CS slave is reachable only over LPBK. Neither side has
#   clock stretching on writes, bus timing or arbitration.
#
# Supersedes the staged onboarding/cc2538 chip descriptor, whose memory map
# (flash at 0x08000000/128 KiB, 256 KiB RAM) did not match Table 4-1 and whose
# radio, crypto, flash-controller and SSI windows answered zeros. It is deleted;
# configs/systems/onboarding/cc2538.yaml loads this profile.

name: "cc2538sf53"
arch: "arm"
core: "cortex-m3"
# CC2538 maximum system clock, 32 MHz (32-MHz crystal, SYS_DIV = 000).
cpu_hz: 32_000_000
# SWRS096 §5.18 DC Characteristics, at VDD = 3 V: logic-0 input max 0.5 V,
# logic-1 input min 2.5 V → 0.5/3 and 2.5/3 of the rail.
io_voltage_v: 3.0
gpio_input_thresholds:
  vil: 0.1667
  vih: 0.8333

flash:
  # Table 4-1 "On-chip flash" 0x0020_0000; Table 8-2: the 512 KB option
  # spans 0x00200000-0x0027FFFF. The last 2-KiB page holds the CCA (§8.6).
  base: 0x00200000
  size: "512KB"
ram:
  # Table 4-1: 0x2000_0000-0x2000_3FFF bit-banded SRAM (no retention in
  # PM2/3) + 0x2000_4000-0x2000_7FFF low-leakage SRAM (the 16 KB retained in
  # all power modes, §8.9 "SRAM" / SWRS096). Contiguous 32 KiB on the SF53.
  base: 0x20000000
  size: "32KB"
# Address 0x0 is the ROM, not a flash alias (Table 4-1 "Reserved for ROM").
flash_boot_alias: false
memory_regions:
  # Table 4-1 "Reserved for ROM" 0x0000_0000-0x0001_FFFF. Filled with the
  # in-tree clean-room ROM (crates/core/roms/cc2538/cc2538_rom.S — NOT a TI
  # dump): the SWRU333A §2.2 start-up sequence and the §3.2 utility API table
  # at 0x48. Set LABWIRED_CC2538_ROM to a file to replace it, or to "" to
  # leave the window zero-filled.
  - name: "rom"
    base: 0x00000000
    size: "128KB"
    image_env: "LABWIRED_CC2538_ROM"
  # Flash information page (§8.2.1, 2 KiB at 0x0028_0000, factory-written,
  # read-only on silicon). TI does not publish its layout; only the primary
  # IEEE address at +0x28 that Contiki-NG / TI driverlib read is filled in
  # (a fixed 00:12:4B:00:00:00:00:01, NOT a real device's), the rest reads
  # erased. The model does not block writes to it.
  - name: "info_page"
    base: 0x00280000
    size: "2KB"
    erased: true
    image_env: "LABWIRED_CC2538_INFO_PAGE"
  # PKA engine RAM (Table 4-1: 0x4400_6000-0x4400_67FF, 2 KiB). Plain
  # word-addressable SRAM from the CPU side: operands and results the PKA
  # sequencer reads and writes. Mapped as RAM so stores read back; the PKA
  # engine itself (0x4400_4000) is not mapped, so nothing here is ever
  # computed. The RCGCSEC.PKA clock gate is not enforced (as for every gate).
  - name: "pka_sram"
    base: 0x44006000
    size: "2KB"

pins:
  # CC2538DK / SmartRF06 EB wiring (Contiki-NG `cc2538dk` dev/board.h, RIOT
  # `cc2538dk` board.h / periph_conf.h).
  PA0: { gpio: "gpioa", bit: 0 }  # UART0 RX (SmartRF06 EB USB VCP)
  PA1: { gpio: "gpioa", bit: 1 }  # UART0 TX (SmartRF06 EB USB VCP)
  PA3: { gpio: "gpioa", bit: 3 }  # key SELECT, active low (CCA backdoor pin)
  PC0: { gpio: "gpioc", bit: 0 }  # LED1 red, active high; shared with USB D+ pull-up
  PC1: { gpio: "gpioc", bit: 1 }  # LED2 yellow, active high
  PC2: { gpio: "gpioc", bit: 2 }  # LED3 green, active high
  PC3: { gpio: "gpioc", bit: 3 }  # LED4 orange, active high
  PC4: { gpio: "gpioc", bit: 4 }  # key LEFT, active low
  PC5: { gpio: "gpioc", bit: 5 }  # key RIGHT, active low
  PC6: { gpio: "gpioc", bit: 6 }  # key UP, active low
  PC7: { gpio: "gpioc", bit: 7 }  # key DOWN, active low

peripherals:
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: "16B"

  # --- UART (PL011-compatible; Table 4-1, Table 18-4) -------------------
  # UART0 is the CC2538DK console (PA0 RX / PA1 TX via the IOC). IRQs are the
  # regular-map interrupt numbers of Table 5-2 (SYS_CTRL_I_MAP resets to 0).
  - id: "uart0"
    type: "uart"
    base_address: 0x4000C000
    size: "4KB"
    irq: 5
    config:
      profile: "pl011"
  - id: "uart1"
    type: "uart"
    base_address: 0x4000D000
    size: "4KB"
    irq: 6
    config:
      profile: "pl011"

  # --- GPIO A-D (PL061-style; Table 4-1, Table 9-2) ---------------------
  # pull_up_mask: the reset IOC_Pxx_OVER pull-up (§9.2.3 CAUTION). PC0-PC3
  # are high-drive cells with no on-die pulls (§9.2.2.5 NOTE).
  - id: "gpioa"
    type: "cc2538_pl061_gpio"
    base_address: 0x400D9000
    size: "4KB"
    config:
      pull_up_mask: 0xFF
  - id: "gpiob"
    type: "cc2538_pl061_gpio"
    base_address: 0x400DA000
    size: "4KB"
    config:
      pull_up_mask: 0xFF
  - id: "gpioc"
    type: "cc2538_pl061_gpio"
    base_address: 0x400DB000
    size: "4KB"
    config:
      pull_up_mask: 0xF0
  - id: "gpiod"
    type: "cc2538_pl061_gpio"
    base_address: 0x400DC000
    size: "4KB"
    config:
      pull_up_mask: 0xFF

  # --- System control (Table 4-1 0x400D_2000, Table 7-3) ----------------
  # Reset clock: 16-MHz HF-RC, SYS_DIV = IO_DIV = 001 (16 MHz). The smoke
  # runs here; the 32-MHz crystal switch is modelled as instant.
  - id: "sys_ctrl"
    type: "cc2538_sys_ctrl"
    base_address: 0x400D2000
    size: "4KB"

  # I/O control (§9.3.2, Table 9-7): Pxx_SEL / Pxx_OVER / input-select
  # register file at its reset values (OVER = 0x4, pull-up). Storage only:
  # the routing it describes is not applied to pads or peripherals.
  - id: "ioc"
    type: "cc2538_ioc"
    base_address: 0x400D4000
    size: "4KB"
  # Flash controller (§8.10, Table 8-10): page erase and the FCTL/FADDR/
  # FWDATA write sequence with the §8.1 timings, CCA lock bits, DIECFG0-2
  # (crates/core/src/peripherals/cc2538/flash_ctrl.rs).
  - id: "flash_ctrl"
    type: "cc2538_flash_ctrl"
    base_address: 0x400D3000
    size: "4KB"
    config:
      flash_base: 2097152  # 0x0020_0000
      flash_size: 524288   # 512 KiB
      clock_hz: 16000000
  # WDT + sleep timer (SMWDTHROSC, §13/§14): the 32-kHz count and the compare
  # interrupt (SM Timer, IRQ 145 in the regular map, Table 5-2). `clock_hz` is
  # the CPU clock the cycle count runs at (reset SYS clock, 16 MHz).
  - id: "smwdthrosc"
    type: "cc2538_sleep_timer"
    base_address: 0x400D5000
    size: "4KB"
    irq: 145
    config:
      clock_hz: 16000000
  # ANA_REGS (§23.16.5, Table 23-12): IVCTRL storage at its 0x13 reset
  # (crates/core/src/peripherals/cc2538/ana_regs.rs). The bias fields have no
  # effect on the RF core or DAC models.
  - id: "ana_regs"
    type: "cc2538_ana_regs"
    base_address: 0x400D6000
    size: "4KB"
  # SOC_ADC (§15-17): ADC single (ADCCON3) and ST-started sequence
  # conversions, the RNG LFSR / CRC16 and the analog comparator
  # (crates/core/src/peripherals/cc2538/soc_adc.rs). Conversions finish inside
  # the register write; AIN0-7 are driven as ADC channels 0-7; AVDD5 is the
  # routed reference rail (3.0 V by default). ADC interrupt, IRQ 14 (Table
  # 5-2). Not modelled: conversion time, STSEL 01/10 starts, IOC channel
  # skipping, DMA triggers, temperature changes, the comparator's PA5 edge.
  - id: "soc_adc"
    type: "cc2538_soc_adc"
    base_address: 0x400D7000
    size: "4KB"
    irq: 14
  # SSI0/SSI1 (SWRU319C §19; Renode SPI.CC2538_SSI): master
  # mode, LBM loopback, 4..16-bit frames, 8-deep TX/RX FIFOs, RORRIS and the
  # TX/RX FIFO-level interrupts (crates/core/src/peripherals/cc2538/ssi.rs).
  # Not modelled: slave mode, RX timeout, TI/MICROWIRE formats, bit timing,
  # µDMA requests. IRQ 7 / 34 in the regular map (Table 5-2).
  - id: "ssi0"
    type: "cc2538_pl022_ssi"
    base_address: 0x40008000
    size: "4KB"
    irq: 7
  - id: "ssi1"
    type: "cc2538_pl022_ssi"
    base_address: 0x40009000
    size: "4KB"
    irq: 34
  # I2CM master at 0x4002_0000 and I2CS slave at 0x4002_0800 (Table 4-1),
  # one model because they share IRQ 8 (§20.3.3) and LPBK ties them together
  # (§20.3.4) (crates/core/src/peripherals/cc2538/i2cm.rs). The 0x900-byte
  # window spans both register files; the reserved gap 0x100..0x7FF reads 0.
  # Master commands are immediate; transfer timing is not modelled. The slave
  # is only reachable through loopback, not from the external bus.
  - id: "i2cm"
    type: "cc2538_i2cm"
    base_address: 0x40020000
    size: "2304B"
    irq: 8
  # GPTimer0-3 (§11): 32-bit or split 16-bit one-shot/periodic timers with
  # time-out and match interrupts. Timer A pends `irq:`, timer B `irq_b`
  # (Table 5-2 regular map: 0A/0B 19/20, 1A/1B 21/22, 2A/2B 23/24, 3A/3B
  # 35/36). One count per CPU cycle (IO_DIV = SYS_DIV).
  - id: "gptimer0"
    type: "cc2538_gptimer"
    base_address: 0x40030000
    size: "4KB"
    irq: 19
    config:
      irq_b: 20
  - id: "gptimer1"
    type: "cc2538_gptimer"
    base_address: 0x40031000
    size: "4KB"
    irq: 21
    config:
      irq_b: 22
  - id: "gptimer2"
    type: "cc2538_gptimer"
    base_address: 0x40032000
    size: "4KB"
    irq: 23
    config:
      irq_b: 24
  - id: "gptimer3"
    type: "cc2538_gptimer"
    base_address: 0x40033000
    size: "4KB"
    irq: 35
    config:
      irq_b: 36
  # 2.4-GHz IEEE 802.15.4 RF core (§23): registers, strobes, the timed main
  # FSM, RSSI/CCA and RFRND. Alone, a radio in an empty channel (nothing is
  # received, a sent frame goes nowhere). On a world's shared 802.15.4 air
  # it sends and receives: RX FIFO, frame filtering, AUTOACK, FIFOP/SFD.
  # RF TX/RX interrupt, IRQ 141 in the regular map (Table 5-2); the RF error
  # interrupt (142) is not raised.
  - id: "rfcore"
    type: "cc2538_rfcore"
    base_address: 0x40088000
    size: "4KB"
    irq: 141
    config:
      clock_hz: 16000000
  # AES/SHA-256 cryptoprocessor (Table 4-1: 0x4008_B000-0x4008_BFFF).
  # AES interrupt, IRQ 143 in the regular map (Table 5-2).
  - id: "aes"
    type: "cc2538_aes"
    base_address: 0x4008B000
    size: "4KB"
    irq: 143
  # µDMA (§10, a PL230): software-requested basic/auto transfers through the
  # control table. Software transfer done, IRQ 46 (Table 10-6).
  - id: "udma"
    type: "cc2538_udma"
    base_address: 0x400FF000
    size: "4KB"
    irq: 46
  # CCTEST / CC_TESTCTRL (§23.16.4, Table 23-11): IO, OBSSEL0-7, TR0 and
  # USBCTRL storage (crates/core/src/peripherals/cc2538/cctest.rs). Table 4-1
  # gives 0x4401_0000-0x4401_0030, but Table 23-11 places TR0 at 0x34 and
  # USBCTRL at 0x50, so the window covers both. Not modelled: pad strength,
  # RF observation output on PC0-7, the ADCTM temperature-sensor gate and the
  # USB PHY stand-by override.
  - id: "cctest"
    type: "cc2538_cctest"
    base_address: 0x44010000
    size: "256B"
