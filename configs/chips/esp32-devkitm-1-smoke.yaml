# Narrow ESP32-DevKitM-1 profile for the board's UART0 USB-to-serial path.
# The ESP32-MINI-1 module has 4 MB flash and no PSRAM. Wi-Fi/Bluetooth, the
# physical USB-to-UART bridge, reset/download buttons, and power LED are outside
# this model slice.
name: "esp32-devkitm-1-smoke"
arch: "xtensa-lx6"
cpu_hz: 240_000_000
io_voltage_v: 3.3

flash:
  base: 0x400D0000
  size: "4MiB"
ram:
  base: 0x3FFB0000
  size: "192KiB"

# Espressif's DevKitM-1 user guide maps the onboard USB-UART bridge to U0TXD
# (GPIO1) and U0RXD (GPIO3); both pads are also present on the board headers.
# GPIO23 is also broken out on the header for the external indicator LED smoke.
pins:
  GPIO1:
    gpio: "gpio"
    bit: 1
    functions: [{ type: uart, peripheral: "uart0", role: tx }]
  GPIO3:
    gpio: "gpio"
    bit: 3
    functions: [{ type: uart, peripheral: "uart0", role: rx }]
  GPIO23: { gpio: "gpio", bit: 23, functions: [{ type: gpio, peripheral: gpio }] }

peripherals:
  - id: "uart0"
    type: "uart"
    base_address: 0x3FF40000
    size: "256B"
    config:
      debug_schema: "../peripherals/esp32/uart0.yaml"

  - id: "gpio"
    type: "esp32_gpio"
    base_address: 0x3FF44000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32/gpio.yaml"
