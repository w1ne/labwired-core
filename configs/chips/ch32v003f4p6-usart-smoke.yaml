# Narrow CH32V003F4P6 profile for the WCH-CH32V003EVT GPIO + USART1 TX smoke.
# The USART register block reuses the STM32F1-shaped subset; its distinct
# default TX pad is selected explicitly as PD5.
name: ch32v003f4p6-usart-smoke
arch: riscv
core: rv32ec
registers_count: 16
# Firmware stays on the reset HSI at 24 MHz.
cpu_hz: 24_000_000

flash:
  base: 0x08000000
  size: 16KB
ram:
  base: 0x20000000
  size: 2KB

pins:
  PD0: { gpio: gpiod, bit: 0 }
  PD5: { gpio: gpiod, bit: 5 }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40021000
    # APB2PCENR ends at offset 0x18; later clock-tree registers are excluded.
    size: 28B
    config:
      profile: ch32v003

  - id: gpiod
    type: gpio
    base_address: 0x40011400
    size: 1KB
    clock: { reg: apb2enr, bit: 5 }
    config:
      profile: ch32v003

  - id: usart1
    type: uart
    base_address: 0x40013800
    size: 1KB
    clock: { reg: apb2enr, bit: 14 }
    config:
      profile: stm32f1
      pad_map: ch32v003
