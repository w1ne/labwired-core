# Narrow ESP32-C61 HP-core profile for the ESP32-C61-DevKitC-1-N8R2.
#
# This fast-boot profile exposes UART0's FIFO/status register head and the
# official GPIO data/enable/input head through IN1. It loads a bare ELF
# directly; it does not execute the C61 mask ROM or the Espressif bootloader.
# PCR clock control, IO_MUX routing, USB, Wi-Fi, Bluetooth LE, PSRAM and the
# addressable RGB LED protocol are not claimed here.
#
# Sources checked 2026-11-13:
#   ESP32-C61 Series Datasheet v1.1:
#     https://documentation.espressif.com/esp32-c61_datasheet_en.html
#   ESP32-C61-DevKitC-1 v2.0 guide:
#     https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32c61/esp32-c61-devkitc-1/user_guide.html
#   ESP-IDF C61 register map and interrupt table:
#     https://github.com/espressif/esp-idf/tree/master/components/soc/esp32c61

name: "esp32c61"
arch: "riscv"
core: "rv32imac"
registers_count: 31
cpu_hz: 160_000_000

# ESP32-C61-WROOM-1 N8R2: 8 MiB SPI flash and 2 MiB PSRAM. Only the flash
# window and 320 KiB on-chip HP SRAM are mapped for this UART smoke.
flash:
  base: 0x42000000
  size: "8192KB"
ram:
  base: 0x40800000
  size: "320KB"

# J3 TX/RX map to GPIO11/GPIO10 in Espressif's C61-DevKitC-1 v2.0 guide.
# The USB-UART bridge and IO_MUX routing stay outside this profile.
pins:
  GPIO10:
    gpio: "gpio"
    bit: 10
    functions: [{ type: uart, peripheral: "uart0", role: rx }]
  GPIO11:
    gpio: "gpio"
    bit: 11
    functions: [{ type: uart, peripheral: "uart0", role: tx }]

peripherals:
  # UART0 uses the C61 register head at 0x60000000. The descriptor exposes
  # FIFO@0 and STATUS@0x1C only; later family-specific registers are omitted.
  - id: "uart0"
    type: "esp32c61_uart"
    irq: 40 # ETS_UART0_INTR_SOURCE from C61 interrupts.h
    base_address: 0x60000000
    size: "32B"
    config:
      echo_stdout: true
  # GPIO data/enable/input head at DR_REG_GPIO_BASE 0x6009_1000 (esp-idf C61
  # reg_base.h). Same ENABLE @0x34 / IN @0x64 head as the C5. The 108-byte
  # window ends at IN1; matrix, PIN_x and IO_MUX are omitted.
  - id: "gpio"
    type: "esp32c61_gpio"
    base_address: 0x60091000
    size: "108B"
