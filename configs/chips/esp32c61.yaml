# ESP32-C61 HP RISC-V profile for the ESP32-C61-DevKitC-1 v2.0 UART0, GPIO4/5
# I2C0 and GPIO8 addressable RGB LED smoke. Other pads and peripherals remain
# outside this focused board profile.
name: "esp32c61"
arch: "riscv"
core: "rv32imac"
registers_count: 31
cpu_hz: 160_000_000

flash:
  # ESP-IDF SOC_IROM_LOW; the N8R2 module has 8 MB SPI flash.
  base: 0x42000000
  size: "8192KB"
ram:
  # ESP-IDF SOC_IRAM_LOW..SOC_IRAM_HIGH: 320 KiB HP SRAM.
  base: 0x40800000
  size: "320KB"
memory_regions:
  # 256 KiB mask ROM address window. This fast-boot profile does not execute
  # the Espressif ROM or model its helpers.
  - name: "rom"
    base: 0x40000000
    size: "256KB"
    image_env: "LABWIRED_ESP32C61_ROM"
pins:
  GPIO4: { gpio: "gpio", bit: 4 }
  GPIO5: { gpio: "gpio", bit: 5 }
  GPIO8: { gpio: "gpio", bit: 8 }
peripherals:
  # C61 moves I2C_CONF/I2C_SCLK_CONF to +0x2C/+0x30 (RMT_CONF on C6), so use a
  # chip-specific narrow register model for the UART0/I2C0 smoke clock gates.
  - id: "pcr"
    type: "esp32c61_pcr"
    base_address: 0x60096000
    size: "4KB"
  # C61 UART0's FIFO/register head matches the C6 map through UART_ID at +0x9C.
  # IRQ 40 is ETS_UART0_INTR_SOURCE in ESP-IDF's C61 interrupts.h.
  - id: "uart0"
    type: "esp32c6_uart"
    irq: 40
    base_address: 0x60000000
    size: "4KB"
    clock: { controller: "pcr", reg: "UART0_CONF", bit: 0 }
    config:
      debug_schema: "../peripherals/esp32c6/uart0.yaml"
  # C61 GPIO differs from the C6 register head. The profile covers GPIO4/5
  # I2C0 matrix routes and direct GPIO8 RGB output.
  - id: "gpio"
    type: "esp32c61_gpio"
    base_address: 0x60091000
    # GPIO_EXT begins at +0xE00 on C61; keep this profile's range before it.
    size: "3584"
    config:
      debug_schema: "../peripherals/esp32c61/gpio_gpio8.yaml"
  # IO_MUX GPIO4/5 route the I2C sensor; GPIO8 is the onboard RGB data pad.
  - id: "io_mux"
    type: "esp32c61_io_mux"
    base_address: 0x60090000
    size: "4KB"
    config:
      debug_schema: "../peripherals/esp32c61/io_mux_gpio8.yaml"
  # C61 I2C0 uses the same command register layout as the existing C3/C5/C6
  # model, with its own C61 clock gate and GPIO matrix signal numbering.
  - id: "i2c0"
    type: "esp32c3_i2c"
    irq: 45
    base_address: 0x60004000
    size: "4KB"
    clock: { controller: "pcr", reg: "I2C_CONF", bit: 0 }
    config:
      debug_schema: "../peripherals/esp32c6/i2c0.yaml"
