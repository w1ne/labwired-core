# NUCLEO-L496ZG-P profile limited to RCC and GPIOB for the LD3 smoke.
# The L496's 320 KiB SRAM is exposed through its contiguous 0x20000000 window;
# the separate 0x10000000 SRAM2 alias and all other peripherals are omitted.
# Sources: ST DS11585, RM0351, and UM2179 Rev 10 (board MB1312).
name: "stm32l496zgt6p-nucleo-gpio-smoke"
arch: "arm"
core: "cortex-m4"
cpu_hz: 4_000_000
io_voltage_v: 3.3

flash:
  base: 0x08000000
  size: "1024KB"
ram:
  base: 0x20000000
  size: "320KB"

# UM2179: red user LED LD3 is active-high on PB14 (SB132 closed).
pins:
  PB14: { gpio: "gpiob", bit: 14, functions: [{ type: gpio, peripheral: gpiob }] }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      profile: "stm32l4"

  - id: "gpiob"
    type: "gpio"
    base_address: 0x48000400
    size: "1KB"
    config:
      profile: "stm32v2"
    # RM0351 RCC_AHB2ENR.GPIOBEN (bit 1).
    clock: { reg: "ahb2enr", bit: 1 }
