# Narrow STM32F334C8T6 profile for STM32F3348-DISCO's red user LED LD3.
# Only RCC AHBENR and GPIOB/PB6 are declared; other board and MCU features
# remain outside this model. Sources: ST DS9873, RM0364, PM0214, UM1735 Rev 3.
name: stm32f334c8-f3348-disco-smoke
arch: arm
core: cortex-m4
cpu_hz: 8000000

flash:
  base: 0x08000000
  size: 64KB
ram:
  base: 0x20000000
  size: 12KB

# UM1735 maps user LED LD3 to PB6.
pins:
  PB6: { gpio: gpiob, bit: 6, functions: [{ type: gpio, peripheral: gpiob }] }

peripherals:
  - id: rcc
    type: rcc
    base_address: 0x40021000
    # The smoke uses the AHBENR GPIOB clock gate only. This profile does not
    # claim the rest of the STM32F3 RCC register semantics.
    size: 32
    config:
      profile: stm32f0

  - id: systick
    type: systick
    base_address: 0xE000E010

  - id: gpiob
    type: gpio
    base_address: 0x48000400
    size: 1KB
    clock: { reg: ahbenr, bit: 18 }
    config:
      profile: stm32v2
