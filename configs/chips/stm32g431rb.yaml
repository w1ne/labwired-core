# LabWired - STM32G431RB chip configuration
#
# Demand rank: measured-demand "other STM32" 13% (JetBrains State of Embedded
# 2025), and the survey's industrial-control / motor-control pick (G4 = Cortex-M4F
# + fast advanced-control timers + fast ADC). Sibling of the already-modelled
# stm32g474re; same RM0440 silicon family and the same peripheral map.
#
# SOURCE OF TRUTH for geometry and ordering data:
#   ST DS12589 Rev 6 / DocID, "STM32G431x6 x8 xB" datasheet (production data):
#     - Features: "up to 128 KB Flash, 32 KB SRAM" -> 128 KB Flash,
#       22 KB SRAM (main) + 10 KB CCM SRAM.
#     - Table 2 (device features and peripheral counts) / ordering scheme.
#   ST eStore STM32G431RBT6: status **Active** (https://estore.st.com/.../stm32g431rbt6-cpn.html).
#   DigiKey STM32G431RBT6: **4,821 in stock, Active** (live, 2026-11-05).
#   NUCLEO-G431KB / NUCLEO-G431RB are the buyable boards.
#
# SOURCE OF TRUTH for peripheral bases/IRQs:
#   RM0440 (STM32G4 series reference manual) + ST CMSIS stm32g431xx.h. The G431
#   and G474 share the RM0440 peripheral map, so this descriptor reuses the
#   stm32g474re peripheral debug-schemas rather than duplicating them.
#
# Tier: L1 smoke. Boot + GPIO test path exercise the reused Cortex-M4 core, the
#   `stm32g4` RCC profile and the shared G4 peripheral map. No bench capture
#   exists for a G431 die, so REV_ID is a visible placeholder (0), not a
#   plausible-looking wrong answer.
#
# REUSE BOUNDARY, STATED PLAINLY: G431x6 (32 KB) and G431x8 (64 KB) parts share
#   this G431xB (128 KB) map; they are not modelled as separate descriptors here.
#   The CCM SRAM (10 KB @ 0x10000000) is NOT declared, exactly as the F407IE
#   descriptor does not declare its CCM — only the contiguous main SRAM is
#   declared, so the sim faults identically to silicon past the main bank.
name: "stm32g431rb"
arch: "arm"
core: "cortex-m4"
# STM32G431 maximum core clock, 170 MHz (DS12589 section 5.3).
cpu_hz: 170_000_000
# DS12589 section 5.3.11 "I/O static characteristics", all I/Os except BOOT0:
# VIL max 0.35*VDD, VIH min 0.65*VDD (same electrical family as DS5319/DS5792).
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.35
  vih: 0.65

flash:
  base: 0x08000000
  # STM32G431xB: 128 KB main flash (DS12589 Features, "up to 128 KB Flash").
  # Spelled in KB because `parse_size` reads MB as 10^6.
  size: "128KB"
ram:
  base: 0x20000000
  # STM32G431xB main SRAM: 22 KB (DS12589 Features: "22 Kbytes of SRAM").
  # The separate 10 KB CCM SRAM @ 0x10000000 is not declared (reuse boundary
  # above). Firmware running past 0x2000_5800 faults as it does on silicon.
  size: "22KB"

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    config:
      debug_schema: "../peripherals/stm32g474re/rcc.yaml"
      profile: "stm32g4"
  - id: "gpioa"
    type: "gpio"
    base_address: 0x48000000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpioa.yaml"
      profile: "stm32v2"
  - id: "gpiob"
    type: "gpio"
    base_address: 0x48000400
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpiob.yaml"
      profile: "stm32v2"
  - id: "gpioc"
    type: "gpio"
    base_address: 0x48000800
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpioc.yaml"
      profile: "stm32v2"
  - id: "gpiod"
    type: "gpio"
    base_address: 0x48000c00
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/gpiod.yaml"
      profile: "stm32v2"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    config:
      debug_schema: "../peripherals/stm32g474re/stk.yaml"
  - id: "usart1"
    type: "uart"
    base_address: 0x40013800
    irq: 37
    config:
      debug_schema: "../peripherals/stm32g474re/usart1.yaml"
      profile: "stm32v2"
  - id: "usart2"
    type: "uart"
    base_address: 0x40004400
    irq: 38
    config:
      debug_schema: "../peripherals/stm32g474re/usart2.yaml"
      profile: "stm32v2"
  - id: "lpuart1"
    type: "uart"
    base_address: 0x40008000
    irq: 91
    config:
      debug_schema: "../peripherals/stm32g474re/lpuart1.yaml"
      profile: "stm32v2"
  - id: "flash"
    type: "flash"
    base_address: 0x40022000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/flash.yaml"
      profile: "l4"
  - id: "pwr"
    type: "pwr"
    base_address: 0x40007000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/pwr.yaml"
  # CRC (RM0440) @ 0x40023000 — the AHB1 base ST's own stm32g474.svd gives, the
  # same address stm32l476/stm32h563 already map. This is the v2 programmable
  # block (CRC_INIT@0x10, CRC_POL@0x14), and STM32Cube's HAL_CRC_Init writes the
  # CRC-32 polynomial 0x04C11DB7 to CRC_POL during Arduino core startup; with no
  # CRC mapped that store landed on unmapped MMIO. IDR is 32-bit here (F0/F1/L0
  # are the 8-bit parts). Left ungated: RCC_AHB1ENR.CRCEN is not surfaced by the
  # stm32g4 RCC model's enable-register set, matching the dma1 entry below.
  - id: "crc"
    type: "crc"
    base_address: 0x40023000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/crc.yaml"
      idr_width: 32
  # ── Tier-1 peripherals (RM0440). The RCC model is profile stm32g4, so the
  # clock-gate `reg:` names resolve to the RM0440 enable-register offsets
  # (ahb2enr@0x4C, apb1enr1@0x58, apb2enr@0x60 — the same offsets ST's CMSIS
  # stm32g474xx.h gives); the `bit:` values are the RM0440 §7.4 enable bits for
  # each block's real bus. ─────────────────────────────────────────────────
  # TIM2 — 32-bit GP timer (APB1). RCC_APB1ENR1.TIM2EN (bit 0).
  - id: "tim2"
    type: "timer"
    base_address: 0x40000000
    size: "1KB"
    irq: 28
    config:
      debug_schema: "../peripherals/stm32g474re/tim2.yaml"
      width: 32
    clock: { reg: "apb1enr", bit: 0 }
  # TIM1 — advanced-control PWM timer (APB2). The `_pwm` id suffix declares the
  # pwm class alongside timer. RCC_APB2ENR.TIM1EN (bit 11).
  - id: "tim1_pwm"
    type: "timer"
    base_address: 0x40012C00
    size: "1KB"
    irq: 24
    config:
      debug_schema: "../peripherals/stm32g474re/tim1.yaml"
      advanced: true
    clock: { reg: "apb2enr", bit: 11 }
  # I2C1 (APB1) — modern v2 controller. RCC_APB1ENR1.I2C1EN (bit 21).
  - id: "i2c1"
    type: "i2c"
    base_address: 0x40005400
    size: "1KB"
    irq: 31
    config:
      debug_schema: "../peripherals/stm32g474re/i2c1.yaml"
      profile: "stm32l4"
    clock: { reg: "apb1enr", bit: 21 }
  # SPI1 (APB2). RCC_APB2ENR.SPI1EN (bit 12).
  - id: "spi1"
    type: "spi"
    base_address: 0x40013000
    size: "1KB"
    irq: 35
    config:
      debug_schema: "../peripherals/stm32g474re/spi1.yaml"
      profile: "stm32_fifo"
      # G4 AF pinout (SPI1 AF5, NSS on PA4/PA15), not the L4 one.
      pad_map: "stm32g4"
    clock: { reg: "apb2enr", bit: 12 }
  # ADC1 (AHB2). RCC_AHB2ENR.ADC12EN (bit 13). Model has no conversion engine
  # (L4 layout) — the genuinely-modelled DEEPPWD→ADVREGEN→ADEN→ADRDY power-up
  # path is exercised.
  - id: "adc1"
    type: "adc"
    base_address: 0x50000000
    size: "1KB"
    irq: 18
    config:
      debug_schema: "../peripherals/stm32g474re/adc1.yaml"
      profile: "stm32l4"
    clock: { reg: "ahb2enr", bit: 13 }
  # DMA1 (AHB1, 7-channel + DMAMUX). RM0440 puts DMA1EN on AHB1ENR (bit 0). The
  # stm32g4 RCC model stores AHB1ENR@0x48 but no `clock:` gate is declared for
  # the channel (left ungated); the mem-to-mem round-trip is the truthful proof
  # of the model.
  - id: "dma1"
    type: "dma"
    base_address: 0x40020000
    size: "1KB"
    irq: 11
    config:
      debug_schema: "../peripherals/stm32g474re/dma1.yaml"
  # IWDG — clocked by the LSI, no RCC enable gate on silicon (ungated).
  - id: "iwdg"
    type: "iwdg"
    base_address: 0x40003000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/iwdg.yaml"
  # RTC (APB1) — register interface gated by RCC_APB1ENR1.RTCAPBEN (bit 10).
  - id: "rtc"
    type: "rtc"
    base_address: 0x40002800
    size: "1KB"
    irq: 2
    clock: { reg: "apb1enr", bit: 10 }
    config:
      debug_schema: "../peripherals/stm32g474re/rtc.yaml"
  # NVIC is wired unconditionally for Cortex-M machines; this entry declares
  # the tier1 irq class and pins the canonical base.
  - id: "nvic"
    type: "nvic"
    base_address: 0xE000E100
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/nvic.yaml"
  # DBGMCU (RM0440 §46.6) @ 0xE0042000 — the Cortex-M3/M4 private-peripheral
  # location, confirmed against ST's own stm32g474.svd. Zephyr's SoC init calls
  # LL_DBGMCU_EnableDBGSleepMode(), a read-modify-write of DBGMCU_CR at
  # 0xE0042004; with no DBGMCU mapped that access had nowhere to land.
  # DBG_SLEEP/STOP/STANDBY are plain R/W bits on silicon with no effect unless
  # a debug probe is attached, which is exactly what the latching model gives.
  #
  # idcode: DEV_ID 0x468 is the RM0440 section 46.6.1 value for the category-2
  # parts (STM32G431/G441); the G474 descriptor carries 0x469 for the
  # category-3 parts (G473/G474/G483/G484). REV_ID is deliberately left 0:
  # no G431 bench capture exists, so a zero revision is visibly a placeholder
  # rather than a plausible-looking wrong answer.
  - id: "dbgmcu"
    type: "dbgmcu"
    base_address: 0xE0042000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32g474re/dbgmcu.yaml"
      idcode: 0x00000468

# Package pins used by NUCLEO-G431RB (64-pin STM32G431RBT6). Board-level
# solder-bridge connections are recorded in configs/systems/nucleo-g431rb.yaml.
pins:
  PA2: { gpio: "gpioa", bit: 2, functions: [{ type: uart, peripheral: "lpuart1", role: tx }] }
  PA3: { gpio: "gpioa", bit: 3, functions: [{ type: uart, peripheral: "lpuart1", role: rx }] }
  PA5: { gpio: "gpioa", bit: 5, functions: [{ type: gpio, peripheral: "gpioa" }] }
  PC13: { gpio: "gpioc", bit: 13, functions: [{ type: gpio, peripheral: "gpioc" }] }
