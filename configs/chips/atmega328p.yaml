name: "atmega328p"
arch: "avr"
core: "avr8"
registers_count: 32
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# 16 MHz crystal on the Arduino Nano/Uno boards this part is modelled for
# (the ATmega328P itself is rated to 20 MHz at 5 V; no in-tree board uses it).
cpu_hz: 16_000_000
# GPIO supply and digital input thresholds (ratios of io_voltage_v), used when
# co-simulation turns a circuit node voltage into the level digitalRead sees.
# 5.0 V is the Arduino Nano/Uno rail. Microchip DS40002061B
# (ATmega48A/PA/88A/PA/168A/PA/328/P), section 30.2, Table 30-1 "Common DC
# characteristics", VCC = 2.4 V to 5.5 V, except XTAL1 and RESET:
# VIL max 0.3·VCC, VIH min 0.6·VCC.
io_voltage_v: 5.0
gpio_input_thresholds:
  vil: 0.3
  vih: 0.6
# GPIO pad output resistance: a driven pad is VCC (or 0 V) behind this many
# ohms. DS40002061B section 31 typical curves "I/O Pin Output Voltage vs.
# Source Current (VCC = 5V)" and "... vs. Sink Current (VCC = 5V)": about
# 0.5 V of droop at 20 mA at 25 C, i.e. 25 ohm. Table 30-1 bounds it: VOH min
# 4.2 V at IOH = -20 mA and VOL max 0.9 V at IOL = 20 mA (VCC = 5 V), at most
# 40-45 ohm over temperature.
# Read by the diagram compiler, which places it as the pad driver's
# on-resistance in the analog netlist.
gpio_output_ohms: 25
# Absolute maximum DC current per I/O pin, mA. DS40002061B section 30.1
# "Absolute Maximum Ratings": DC current per I/O pin 40.0 mA. A run reports a
# pad whose simulated current went past it (an LED or a motor straight off a
# pin); the simulation does not stop or clamp it.
gpio_abs_max_ma: 40

# Regular ADC inputs by chip pad, from DS40002061B "Pin Configurations" and
# Table 24-4 (ADMUX MUX[3:0] channel selection): ADC0..ADC5 are PC0..PC5, and
# ADC6/ADC7 are dedicated inputs on the TQFP/QFN packages (the DIP-28 Uno has
# no pin for them; the converter still has the mux positions). The Arduino
# Nano headers expose A0..A7 in this order; the Uno exposes A0..A5 only.
# `avr_adc` is the bus-side input window; the converter registers stay on the
# AVR CPU.
# Consumed by co-simulation `board.analog.<pad>_volts`; pads not listed are
# refused. The pad label is the chip name, not the Arduino header name, so a
# deck that names `pc0` reads A0 on every ATmega328P board.
analog_pins:
  PC0: { peripheral: "adc", channel: 0 }
  PC1: { peripheral: "adc", channel: 1 }
  PC2: { peripheral: "adc", channel: 2 }
  PC3: { peripheral: "adc", channel: 3 }
  PC4: { peripheral: "adc", channel: 4 }
  PC5: { peripheral: "adc", channel: 5 }
  ADC6: { peripheral: "adc", channel: 6 }
  ADC7: { peripheral: "adc", channel: 7 }

# Microchip DS40002061B, "System and Reset Characteristics":
# typical POR rising/falling 1.4/1.3 V; BOD centers 1.8, 2.7, 4.3 V with
# 50 mV hysteresis (VBOT +/- VHYST/2). Fuse-selected BOD is disabled unless
# bor_level is explicitly set. The supervisor models voltage thresholds,
# not oscillator/fuse start-up delays or short-pulse rejection.
# https://www.microchip.com/bin/mchp/product-ds.ATmega328P.pdf
supply_monitor:
  por_rising_v: 1.4
  pdr_falling_v: 1.3
  bor_levels:
    bod1v8: { falling_v: 1.775, rising_v: 1.825 }
    bod2v7: { falling_v: 2.675, rising_v: 2.725 }
    bod4v3: { falling_v: 4.275, rising_v: 4.325 }

flash:
  base: 0x00000000
  size: "32KB"
ram:
  base: 0x00000100
  size: "2KB"
peripherals:
  # Timer0 (millis/delay), Timer1 (16-bit: Servo library, compare-match and
  # overflow) and Timer2 (tone/noTone, normal + CTC compare-match and overflow)
  # are registers on the AVR CPU, not bus windows: TCCR2A/B, TCNT2, OCR2A/B,
  # TIMSK2, TIFR2, ASSR. In the PWM modes the COM bits drive OC0A/OC0B
  # (PD6/PD5), OC1A/OC1B (PB1/PB2) and OC2A/OC2B (PB3/PD3): analogWrite.
  # Parking SPI controller for kit attach only. Hardware SPI (SPCR/SPSR/SPDR)
  # is modelled on the AVR CPU; build_avr_node / CLI drain attached slaves onto
  # the interpreter after from_config. Base is outside the 16-bit data space so
  # MMIO never collides with CPU-handled registers.
  - id: "spi"
    type: "spi"
    base_address: 0x00010000
    size: "16"
  # Parking I2C controller for kit attach; TWI lives on the CPU (TWCR/TWDR).
  - id: "i2c"
    type: "i2c"
    base_address: 0x00010010
    size: "16"
  # Port mirrors (base + 0/1/2 = PIN/DDR/PORT). The real PINx/DDRx/PORTx live
  # at 0x23..0x2B in the CPU IO map; bus flash@0 would swallow low MMIO writes,
  # so the Avr interpreter mirrors every port write to its high window, and
  # reads each PINx input half back from here. Without portc/portd a canvas LED
  # on D0-D7 never lit and a button on A0-A5 was never read.
  # PORTB = D8-D13 (LED_BUILTIN = PB5).
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
  # PORTC (PINC/DDRC/PORTC 0x26..0x28) and PORTD (PIND/DDRD/PORTD 0x29..0x2B),
  # mirrored the same way: Arduino A0..A5 are PC0..PC5, D0..D7 are PD0..PD7.
  - id: "portc"
    type: "avr_gpio"
    base_address: 0x00010026
    size: "3"
  - id: "portd"
    type: "avr_gpio"
    base_address: 0x00010029
    size: "3"
  # USART0 host for peers. The CPU keeps UCSR0x/UBRR0 for firmware reads and
  # forwards every register write and each UDR0 byte here, so an RS-485
  # transceiver and its slaves attach to `usart0`, and a byte a peer sends (or
  # the host types) is what UDR0 returns. Console output stays on the CPU.
  - id: "usart0"
    type: "uart"
    base_address: 0x000100C0
    size: "8"
    config:
      profile: "avr"
  # ADC input side: millivolts on ADC0..ADC7, two bytes per channel. The
  # converter registers (ADMUX/ADCSRA/ADCL/ADCH) stay on the CPU; this is where
  # a potentiometer or NTC on A0-A5 drives its level.
  - id: "adc"
    type: "avr_adc"
    base_address: 0x00010030
    size: "16"
