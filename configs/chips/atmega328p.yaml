name: "atmega328p"
arch: "avr"
core: "avr8"
registers_count: 32
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# 16 MHz crystal on the Arduino Nano/Uno boards this part is modelled for
# (the ATmega328P itself is rated to 20 MHz at 5 V; no in-tree board uses it).
cpu_hz: 16_000_000

flash:
  base: 0x00000000
  size: "32KB"
ram:
  base: 0x00000100
  size: "2KB"
peripherals:
  # Parking SPI controller for kit attach only. Hardware SPI (SPCR/SPSR/SPDR)
  # is modelled on the AVR CPU; build_avr_node / CLI drain attached slaves onto
  # the interpreter after from_config. Base is outside the 16-bit data space so
  # MMIO never collides with CPU-handled registers.
  - id: "spi"
    type: "spi"
    base_address: 0x00010000
    size: "16"
  # Parking I2C controller for kit attach; TWI lives on the CPU (TWCR/TWDR).
  - id: "i2c"
    type: "i2c"
    base_address: 0x00010010
    size: "16"
  # PORTB mirror for --watch-gpio portb:5 (LED_BUILTIN = PB5).
  # Real PINB/DDRB/PORTB live at 0x23..0x25 in the CPU IO map; bus flash@0
  # would swallow low MMIO writes, so the Avr interpreter mirrors PORTB
  # updates to this high window (base + 0/1/2 = PIN/DDR/PORT).
  - id: "portb"
    type: "avr_gpio"
    base_address: 0x00010023
    size: "3"
