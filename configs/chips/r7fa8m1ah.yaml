#
# Renesas R7FA8M1AHECBD (RA8M1, Arm Cortex-M85, 2 MiB code flash, 896 KiB
# user SRAM + 64 KiB ITCM + 64 KiB DTCM) for the EK-RA8M1 evaluation kit.
# SIM-DERIVED: no RA8M1 bench part.
#
# Sources:
#   - Renesas FSP CMSIS header R7FA8M1AH.h (peripheral bases and register
#     layouts: R_SYSTEM 0x4001E000, R_MSTP 0x40203000, R_PORT0 0x40400000,
#     R_PFS 0x40400800, R_PMISC 0x40400D00, R_SCI_B0 0x40358000, R_ICU
#     0x40006000) and FSP ra8m1 bsp_feature.h (code flash at 0x02000000,
#     SCKDIVCR resets to 0 = all /1, non-secure alias offset 0x10000000).
#   - Zephyr dts/arm/renesas/ra/ra8/{ra8x1,r7fa8m1xh}.dtsi (code flash at
#     0x02000000, 2016 KiB exposed to Zephyr; data flash 12 KiB at 0x27000000;
#     SRAM 896 KiB at 0x22000000; sci0-9 are `renesas,ra8-uart-sci-b`).
#   - Renode v1.17.0 platforms/cpus/renesas-r7fa8m1a.repl (memory map
#     cross-check: ITCM 64 KiB @ 0x0, code flash 2 MiB @ 0x02000000, DTCM
#     64 KiB @ 0x20000000, SRAM 0xE0000 @ 0x22000000, data flash 0x3000 @
#     0x27000000). Not a Renode parity claim. Renode puts the ICU at
#     0x4000C000; R7FA8M1AH.h says R_ICU_BASE is 0x40006000, with the
#     WUPEN/IELSR block at +0x6000..+0x6480 (0x4000C000). Both windows are
#     mapped here; CPSCU and DMAC sit in the reserved gap between them.
#
# The RA8 blocks differ from RA4M1/RA6M5 in three places this descriptor
# depends on:
#   - SCI is SCI_B, a 32-bit register rework (RDR +0x00, TDR +0x04, CCR0-4
#     +0x08..+0x18, CESR +0x1C, FCR +0x24, CSR +0x48, CFCLR +0x68):
#     `profile: "sci_b"`, not the classic SMR/BRR/SCR/TDR/SSR byte block.
#   - PMISC moved: PWPR at 0x40400D0C and the secure twin PWPRS at
#     0x40400D14 (`ra8_pfs`). PmnPFS keeps the RA layout, for ports 0-B.
#   - The SCI kernel clock is its own SCICLK (SYSTEM SCICKDIVCR +0x54 /
#     SCICKCR +0x55, with a CKSREQ/CKSRDY switch handshake: `ra8_sysc`).
# PORTn keeps the RA PCNTR1-4 layout at 0x40400000 + 0x20*n, with the 16-bit
# aliases in natural half order (FSP R7FA8M1AH.h: PDR +0x0, PODR +0x2), unlike
# RA4M1/RA6M5.
#
# Tier: L1 UART+LED smoke. Boot from code flash, the SCI9 console (PA14
# TXD9 / PA15 RXD9, the J-Link OB virtual COM port) and the three user LEDs
# with PODR readback. Stock Zephyr v3.7.0 hello_world and synchronization
# for `ek_ra8m1` also boot (crates/firmware-ek-ra8m1-zephyr): FSP's
# bsp_clock_init (MOSC, PLL1/PLL2, SCKSCR to PLL1P, SCICKCR), the SysTick
# system timer and the SCI9 console. Stock Zephyr v4.0.0
# samples/drivers/counter/alarm runs its four AGT0 compare-match alarms
# (2/4/8/16 s) through the ICU event link (`ra_icu`, `ra_agt`).
#
# NOT modelled in this slice:
# - Cortex-M85 features beyond Armv8-M Mainline other than the scalar
#   Armv8.1-M DLS/WLS/LE loops and the CSEL family (decoded, see
#   docs/isa_coverage.md): Helium/MVE, the tail-predicated loops, PACBTI,
#   the branch-future BF* instructions and the M85 caches. An MVE opcode is
#   not decoded and stops the run with a decode error. Zephyr builds for
#   `-mcpu=cortex-m85+nomve`, which is what the Zephyr fixtures run.
# - Option-setting memory (OFS0/OFS1, 0x0300A100+): Zephyr's ELF carries
#   OFS/SECMPU segments there; the loader warns and drops them.
# - TrustZone: the simulator has no security state, peripherals are mapped
#   at their secure addresses only (the +0x10000000 non-secure aliases are
#   NOT mapped), no IDAU/SAU attribution, no CPSCU/PSCU.
# - Clock generation: `ra8_sysc` stores every R_SYSTEM register (0xD80
#   bytes) and derives OSCSF (HOCOSF/MOSCSF/PLLSF/PLL2SF from the stop bits)
#   and CKSRDY on every xxxCKCR switch; oscillators settle at once. No rate
#   is derived from SCKSCR/SCKDIVCR/PLLCCR or the xxxCKCR sources, and
#   `cpu_hz` stays the reset MOCO 8 MHz even after Zephyr switches ICLK to
#   the 480 MHz PLL1P (the SysTick-based Zephyr timebase counts cycles, so
#   it is unaffected).
# - Module stop (MSTP): declared stub. The smoke clears MSTPCRB.MSTPB22
#   (SCI9) as silicon requires, but SCI9 works whether or not it is.
# - ICU: the IELSR window (0x4000C000) is `ra_icu`: an ELC event sets
#   IELSRn.IR of every line linked to it and drives NVIC line n as a level
#   (dropped when firmware clears IR). AGT0/AGT1, SCI3/SCI9
#   (RXI/TXI/TEI) and the external IRQ pins emit events. The IRQ pins
#   (IRQCRn at 0x40006000, a second `ra_icu`) take the IRQCRn edge from a
#   pad whose PmnPFS.ISEL is set; the digital filter is not modelled (an
#   edge is taken at once) and low-level mode raises on the falling edge
#   only. NMI is storage, DTCE does not start the DTC, and a handler that
#   returns with IR still set is not re-entered until the next event.
# - AGT: timer mode only (`ra_agt`, see the model header); pulse output,
#   event counter and measurement modes are not modelled.
# - PmnPFS PSEL/PMR (peripheral mux) is stored only; SCI9 TX/RX need no pad
#   routing in the model. A PmnPFS store sets the port's PCNTR1 PDR/PODR
#   (the same flip-flops), but reading PmnPFS back returns the last store,
#   not PCNTR1, and PIDR there reads 0.
# - SCI_B: async TX/RX with the RXI/TXI/TEI interrupt events (CCR0
#   RIE/TIE/TEIE). TXI/TEI follow the TDRE/TEND edges of a timed shift
#   register; CSR still reads TDRE = TEND = 1 and a byte reaches the console
#   at the write. FIFO mode, ERI and the error flags, simple-SPI/I2C/LIN/
#   Manchester modes and the baud generator (CCR2 is not decoded; the frame
#   time comes from `baud`) are not modelled; the control registers are
#   stored and read back.
# - Option-setting memory (OFS0/OFS1 at 0x0300A100+), factory flash, flash
#   programming (FACI), standby SRAM, OSPI/xSPI, SDRAM, Ethernet, USB, CAN
#   FD, timers, ADC, DAC, crypto (RSIP-E51A), CEU and every block not listed
#   below are not mapped or are declared stubs.

name: "r7fa8m1ah"
arch: "arm"
core: "cortex-m85"
# Reset clock: MOCO 8 MHz, ICLK /1 (FSP bsp_feature.h
# BSP_FEATURE_CGC_ICLK_DIV_RESET = DIV_1). The EK-RA8M1 smoke never starts
# HOCO or the PLLs.
cpu_hz: 8_000_000
flash:
  base: 0x02000000
  size: "2048KB"
ram:
  base: 0x22000000
  size: "896KB"
memory_regions:
  # Cortex-M85 tightly coupled memories (Renode repl; secure aliases only).
  - name: "itcm"
    base: 0x00000000
    size: "64KB"
  - name: "dtcm"
    base: 0x20000000
    size: "64KB"
  # Data flash (Zephyr data_flash node), erased reads 0xFF.
  - name: "data_flash"
    base: 0x27000000
    size: "12KB"
    erased: true
pins:
  # SCI9 console (Zephyr ek_ra8m1-pinctrl.dtsi sci9_default: tx PA14, rx PA15).
  PA14: { gpio: porta, bit: 14, functions: [{ type: uart, peripheral: sci9, role: tx }] }
  PA15: { gpio: porta, bit: 15, functions: [{ type: uart, peripheral: sci9, role: rx }] }
  # User LEDs LED1-LED3 (Zephyr ek_ra8m1.dts).
  P600: { gpio: port6, bit: 0, functions: [{ type: gpio, peripheral: port6 }] }
  P414: { gpio: port4, bit: 14, functions: [{ type: gpio, peripheral: port4 }] }
  P107: { gpio: port1, bit: 7, functions: [{ type: gpio, peripheral: port1 }] }
  # User switches S1/S2 (Zephyr ek_ra8m1.dts).
  P009: { gpio: port0, bit: 9, functions: [{ type: gpio, peripheral: port0 }] }
  P008: { gpio: port0, bit: 8, functions: [{ type: gpio, peripheral: port0 }] }
peripherals:
  # R_SYSTEM @ 0x4001E000 (R_SYSTEM_Type, 0xD80 bytes; PRCR at +0x3FA).
  # Register file with derived OSCSF and xxxCKCR CKSRDY; see the header.
  - id: "ra_sysc"
    type: "ra8_sysc"
    base_address: 0x4001E000
    size: "4KB"
  # R_MSTP @ 0x40203000: MSTPCRA +0x00 .. MSTPCRE +0x10 (R7FA8M1AH.h).
  - id: "mstp"
    type: "stub"
    base_address: 0x40203000
    size: "64B"
  # PORT0-B @ 0x40400000 + n*0x20, pull-ups linked to PmnPFS.PCR.
  - id: "port0"
    type: "gpio"
    base_address: 0x40400000
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 0 }
  - id: "port1"
    type: "gpio"
    base_address: 0x40400020
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 1 }
  - id: "port2"
    type: "gpio"
    base_address: 0x40400040
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 2 }
  - id: "port3"
    type: "gpio"
    base_address: 0x40400060
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 3 }
  - id: "port4"
    type: "gpio"
    base_address: 0x40400080
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 4 }
  - id: "port5"
    type: "gpio"
    base_address: 0x404000A0
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 5 }
  - id: "port6"
    type: "gpio"
    base_address: 0x404000C0
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 6 }
  - id: "port7"
    type: "gpio"
    base_address: 0x404000E0
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 7 }
  - id: "port8"
    type: "gpio"
    base_address: 0x40400100
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 8 }
  - id: "port9"
    type: "gpio"
    base_address: 0x40400120
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 9 }
  - id: "porta"
    type: "gpio"
    base_address: 0x40400140
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 10 }
  - id: "portb"
    type: "gpio"
    base_address: 0x40400160
    size: "32B"
    config: { profile: "ra_port", pad_control: "pfs", pad_control_port: 11 }
  # PFS @ 0x40400800 (PmnPFS for ports 0-B) with PMISC at +0x500:
  # PWPR +0x50C, PWPRS +0x514.
  - id: "pfs"
    type: "ra8_pfs"
    base_address: 0x40400800
    size: "1536B"
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
  # SCI9 @ 0x40358900: the EK-RA8M1 console (Zephyr `zephyr,console =
  # &uart9` on sci9). SCI3 @ 0x40358300: the mikroBUS UART (Zephyr v4.0
  # `&uart3`, P310 TXD3 / P309 RXD3), which the v4.0 board opens at boot.
  # Interrupts are ELC events linked through the ICU IELSRn, not NVIC lines:
  # `elc_event` is the channel's RXI, and TXI/TEI/ERI follow it (FSP ra8m1
  # bsp_elc.h: SCI3_RXI 0x139, SCI9_RXI 0x163). The TDRE/TEND edges are
  # timed at `baud` (the Zephyr board default, 115200 8N1) in `clock_hz`
  # cycles, the rate the guest believes its cycles run at (as for AGT below).
  # SCI0 (PMOD1) and SCI2 (PMOD2) are enabled by the v4.1.0 `ek_ra8m1`
  # board and opened at boot (RXI events from FSP ra8m1 bsp_elc.h).
  - id: "sci0"
    type: "uart"
    base_address: 0x40358000
    size: "256B"
    config:
      profile: "sci_b"
      elc_event: 0x124
      clock_hz: 480000000
      baud: 115200
  - id: "sci2"
    type: "uart"
    base_address: 0x40358200
    size: "256B"
    config:
      profile: "sci_b"
      elc_event: 0x132
      clock_hz: 480000000
      baud: 115200
  - id: "sci3"
    type: "uart"
    base_address: 0x40358300
    size: "256B"
    config:
      profile: "sci_b"
      elc_event: 0x139
      clock_hz: 480000000
      baud: 115200
  - id: "sci9"
    type: "uart"
    base_address: 0x40358900
    size: "256B"
    config:
      profile: "sci_b"
      elc_event: 0x163
      clock_hz: 480000000
      baud: 115200
  # ICU (R_ICU_Type is 0x6480 bytes from R_ICU_BASE, mostly reserved):
  # IRQCRn/NMI at +0x000, and WUPEN0/1 + IELSR0-95 at +0x6000 (IELSR at
  # +0x6300). Zephyr's SCI_B driver clears IELSRn.IR at init.
  # IRQ-pin half (ra_icu, no IELSR lines here): IRQCRn picks the edge, a
  # pad with PmnPFS.ISEL raises ELC event ICU_IRQn (n + 1), linked by
  # icu_ielsr below. irq_pins = [port, pin, IRQn], from Zephyr v4.1.0
  # r7fa8m1xh.dtsi port-irqN-pins (S1 P009 = IRQ13, S2 P008 = IRQ12).
  - id: "icu"
    type: "ra_icu"
    base_address: 0x40006000
    size: "2KB"
    config:
      ielsr_lines: 0
      pfs_base: 0x40400800
      irq_pins: [
        [0, 0, 6], [0, 1, 7], [0, 2, 8], [0, 4, 9], [0, 5, 10], [0, 6, 11],
        [0, 8, 12], [0, 9, 13], [0, 10, 14], [0, 15, 13], [1, 0, 2], [1, 1, 1],
        [1, 4, 1], [1, 5, 0], [2, 2, 3], [2, 3, 2], [2, 5, 1], [2, 6, 0],
        [2, 8, 3], [2, 12, 3], [2, 13, 2], [3, 0, 4], [3, 1, 6], [3, 2, 5],
        [3, 4, 9], [3, 5, 8], [4, 0, 0], [4, 1, 5], [4, 2, 4], [4, 3, 14],
        [4, 4, 15], [4, 8, 7], [4, 9, 6], [4, 10, 5], [4, 11, 4], [4, 14, 9],
        [4, 15, 8], [5, 8, 1], [5, 9, 2], [5, 10, 3], [5, 11, 15], [5, 12, 14],
        [6, 15, 7], [7, 6, 7], [7, 7, 8], [7, 8, 11], [7, 9, 10], [8, 0, 11],
        [8, 1, 12], [8, 4, 14], [8, 6, 0], [8, 8, 15], [9, 5, 8], [9, 6, 9],
        [9, 7, 10], [9, 8, 11], [10, 8, 6], [10, 9, 5], [10, 10, 4],
      ]
  # ICU event-link half (R_ICU_BASE + 0x6000): IELSR0-95 at +0x300 link
  # ELC events to NVIC lines 0-95; IELSRn.IR drives line n (ra_icu).
  - id: "icu_ielsr"
    type: "ra_icu"
    base_address: 0x4000C000
    size: "2KB"
  # DMAC0-7 + DMA + DTC (0x4000A000-0x4000AFFF).
  - id: "dmac_dtc"
    type: "stub"
    base_address: 0x4000A000
    size: "4KB"
  # FCACHE (flash cache / wait states).
  - id: "fcache"
    type: "stub"
    base_address: 0x4001C100
    size: "256B"
  # FACI_HP flash programming interface.
  - id: "faci"
    type: "stub"
    base_address: 0x4011E000
    size: "4KB"
  # ELC event link controller.
  - id: "elc"
    type: "stub"
    base_address: 0x40201000
    size: "256B"
  # RTC.
  - id: "rtc"
    type: "stub"
    base_address: 0x40202000
    size: "512B"
  # IWDT.
  - id: "iwdt"
    type: "stub"
    base_address: 0x40202200
    size: "512B"
  # WDT.
  - id: "wdt"
    type: "stub"
    base_address: 0x40202600
    size: "512B"
  # AGT0/AGT1, the RA8M1's two 16-bit AGT channels (FSP bsp_feature.h:
  # BSP_FEATURE_AGT_VALID_CHANNEL_MASK 0x3, no AGTW). Interrupts are ELC
  # events linked through the ICU IELSRn: AGT0 INT 0x046 (= 70) / COMPARE_A
  # 0x047 / COMPARE_B 0x048, AGT1 INT 0x049 (= 73) (FSP ra8m1 bsp_elc.h).
  # `clock_hz` is the rate the guest believes its cycles run at (Zephyr's
  # 480 MHz ICLK, the SysTick timebase), so AGT time and k_uptime agree;
  # PCLKB is PLL1P / 8 = 60 MHz on Zephyr's EK-RA8M1 clock tree.
  - id: "agt0"
    type: "ra_agt"
    base_address: 0x40221000
    size: "256B"
    config:
      elc_event: 70
      clock_hz: 480000000
      pclkb_hz: 60000000
  - id: "agt1"
    type: "ra_agt"
    base_address: 0x40221100
    size: "256B"
    config:
      elc_event: 73
      clock_hz: 480000000
      pclkb_hz: 60000000
  # AGTX2-9 window (no channels on the RA8M1).
  - id: "agt_rsvd"
    type: "stub"
    base_address: 0x40221200
    size: "3584B"
  # USBFS0.
  - id: "usbfs"
    type: "stub"
    base_address: 0x40250000
    size: "8KB"
  # IIC0-2.
  - id: "iic"
    type: "stub"
    base_address: 0x4025E000
    size: "1KB"
  # GPT0-13 + GPT_OPS.
  - id: "gpt"
    type: "stub"
    base_address: 0x40322000
    size: "8KB"
  # ADC0/ADC1 (12-bit, R_ADC0_Type; FSP R_ADC0_BASE/R_ADC1_BASE). Scan end
  # is ELC_EVENT_ADC0_SCAN_END 0x1AE / ADC1_SCAN_END 0x1B4 (bsp_elc.h),
  # linked to NVIC through IELSRn (ra_icu).
  - id: "adc0"
    type: "ra_adc12"
    base_address: 0x40332000
    size: "512B"
    config:
      elc_event: 430
      clock_hz: 480000000
      vref_mv: 3300
  - id: "adc1"
    type: "ra_adc12"
    base_address: 0x40332200
    size: "512B"
    config:
      elc_event: 436
      clock_hz: 480000000
      vref_mv: 3300
  # USBHS0.
  - id: "usbhs"
    type: "stub"
    base_address: 0x40351000
    size: "8KB"
  # ETHERC_EDMAC + ETHERC0.
  - id: "ether"
    type: "stub"
    base_address: 0x40354000
    size: "1KB"
  # SPI0/SPI1 (SPI_B).
  - id: "spi"
    type: "stub"
    base_address: 0x4035C000
    size: "512B"
  # CANFD0/CANFD1.
  - id: "canfd"
    type: "stub"
    base_address: 0x40380000
    size: "16KB"
