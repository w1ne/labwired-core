name: "nrf52840"
arch: "arm"
core: "cortex-m4"
# Simulated core clock, Hz — see ChipDescriptor::cpu_hz. Self-timed devices
# scale their datasheet microseconds by it; a slower board overrides it.
# nRF52840 runs its Cortex-M4F at a fixed 64 MHz.
cpu_hz: 64_000_000

flash:
  base: 0x00000000
  size: "1024KB"
ram:
  base: 0x20000000
  size: "256KB"
# Nordic nRF5 SDK / ArduinoCore-nRF5 errata probes read a reserved silicon
# fingerprint window at 0xF0000FE0 (nrf52_errata_16 etc.). On real die this
# returns a package/rev code; unmapped, the sim records unmapped_mmio and the
# hosted verify classifier refuses proven:true even when UART acceptance
# already passed. Map a tiny zero-filled window so "not this rev" is honest —
# same pattern as configs/chips/nrf52832.yaml.
memory_regions:
  - name: "nrf_errata_probe"
    base: 0xF0000000
    size: "4KB"
peripherals:
  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    size: "4KB"
    irq: 2
    config:
      debug_schema: "../peripherals/nrf52840/uart0.yaml"
  # SPIM0/TWIM0 share 0x40003000; active peripheral selected by ENABLE (6=TWIM, 7=SPIM).
  - id: "i2c0"
    type: "nrf52840_serial"
    base_address: 0x40003000
    size: "4KB"
    irq: 3
    config:
      debug_schema: "../peripherals/nrf52840/twim0.yaml"
  - id: "gpio0"
    type: "gpio"
    base_address: 0x50000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/nrf52840/p0.yaml"
      profile: "nrf52"
  - id: "gpio1"
    type: "gpio"
    base_address: 0x50001000
    size: "4KB"
    config:
      debug_schema: "../peripherals/nrf52840/p1.yaml"
      profile: "nrf52"
      num_pins: 16
  # nRF52840 peripherals — reset values verified against nRF52840 silicon
  # (Seeed XIAO nRF52840 Sense, ST-LINK V2, 2026-06-09). Verified via the
  # nrf52_onboarding_diff register sweep (21 MODELLED + WDT). Addresses are
  # the sim memory map (P1/gpio1 remapped to 0x50001000 to avoid GPIO0's 4KB window).
  - id: "uart1"
    type: "nrf52840_uart"
    base_address: 0x40028000
    size: "4KB"
    irq: 40
    config:
      debug_schema: "../peripherals/nrf52840/uarte1.yaml"
  - id: "rtc0"
    type: "nrf52840_rtc"
    base_address: 0x4000b000
    size: "4KB"
    irq: 11
    config:
      debug_schema: "../peripherals/nrf52840/rtc0.yaml"
  - id: "rtc1"
    type: "nrf52840_rtc"
    base_address: 0x40011000
    size: "4KB"
    irq: 17
    config:
      debug_schema: "../peripherals/nrf52840/rtc1.yaml"
      num_cc: 4
  - id: "rtc2"
    type: "nrf52840_rtc"
    base_address: 0x40024000
    size: "4KB"
    irq: 36
    config:
      debug_schema: "../peripherals/nrf52840/rtc2.yaml"
      num_cc: 4
  - id: "wdt"
    type: "nrf52840_watchdog"
    base_address: 0x40010000
    size: "4KB"
    irq: 16
    config:
      debug_schema: "../peripherals/nrf52840/wdt.yaml"
  - id: "ppi"
    type: "nrf52840_ppi"
    base_address: 0x4001f000
    size: "4KB"
    config:
      debug_schema: "../peripherals/nrf52840/ppi.yaml"
  - id: "clock"
    type: "nrf_clock"
    base_address: 0x40000000
    size: "4KB"
    irq: 0
    config:
      debug_schema: "../peripherals/nrf52840/clock.yaml"
  - id: "spi2"
    type: "nrf52840_spi"
    base_address: 0x40023000
    size: "4KB"
    irq: 35
    config:
      # Nordic SPIM, stated explicitly. `SpiRegisterLayout` derives Default =
      # Stm32, so leaving this out did not mean "pick the right one" -- it meant
      # this nRF52840 peripheral was answering reads with the STM32 SPI register
      # map. Silently: nothing errored, and firmware ran against silicon that
      # does not exist on this part. Found by reject_cross_family_coercion.
      profile: "nrf52_spim"
      debug_schema: "../peripherals/nrf52840/spi2.yaml"
  - id: "gpiote"
    type: "nrf52840_gpiotasksevents"
    base_address: 0x40006000
    size: "4KB"
    irq: 6
    config:
      debug_schema: "../peripherals/nrf52840/gpiote.yaml"
  - id: "twi1"
    type: "nrf52840_i2c"
    base_address: 0x40004000
    size: "4KB"
    irq: 4
    config:
      debug_schema: "../peripherals/nrf52840/twi1.yaml"
  - id: "timer0"
