# Narrow exact STM32F103C6T6A smoke profile for an externally wired PC13 LED.
#
# This uses only the C6's exact low-density memory geometry and the RCC/GPIOC
# blocks exercised by the smoke. The broader stm32f103c6 catalog descriptor
# reuses the medium-density peripheral map and intentionally is not used here.
#
# ST DS15060 Rev 7: https://www.st.com/resource/en/datasheet/stm32f103c6.pdf
name: "stm32f103c6t6a-gpio-smoke"
arch: "arm"
core: "cortex-m3"
registers_count: 125
# Smoke stays on reset HSI, 8 MHz.
cpu_hz: 8_000_000
io_voltage_v: 3.3
gpio_input_thresholds:
  vil: 0.35
  vih: 0.65

package: "LQFP48"
pin_count: 48
gpio_pin_count: 37
variant: "x6"
orderable_suffixes: ["T6A", "T6ATR"]

flash:
  base: 0x08000000
  size: "32KB"
ram:
  base: 0x20000000
  size: "10KB"

pins:
  PC13: { gpio: "gpioc", bit: 13 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      debug_schema: "../peripherals/stm32f103/rcc.yaml"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2enr", bit: 4 }
    config:
      debug_schema: "../peripherals/stm32f103/gpioc.yaml"
      profile: "stm32f1"
