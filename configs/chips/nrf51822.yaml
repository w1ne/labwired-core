# LabWired - Nordic nRF51822 Chip Descriptor, APPLICATION REGION ONLY
#
# For images built for the S110 v8 SoftDevice (BBC micro:bit V1, Calliope
# mini 1): only the application region is flash. The MBR + SoftDevice range
# (0x0-0x17FFF) is NOT loaded: `nordic_hole` there is an empty (zero) region
# the application may read (it probes a few words) but that never holds a
# Nordic byte. The SoftDevice API is emulated by crates/nrf-softdevice-hle
# (Machine::attach_sd_hle). The bootloader range (0x3C000-0x3FFFF) is inside
# the flash window but never loaded (appimage.py drops those records unread):
# it reads as erased flash, which the application probes (DAL flash storage
# and bond pages sit at the top of flash) and may program through
# sd_flash_write.
#
# Sources:
#   * nRF51 Series Reference Manual v3.0 (public): memory map, peripheral
#     instantiation (IDs = IRQ numbers), NVMC page size 1 KB.
#   * nRF51822 Product Specification v3.x: 256 KB flash, 16 KB RAM (QFAA).
#   * S110 v8 application layout: app at 0x18000 (the official micro:bit V1
#     and Calliope mini hex images, observed; nrf51-sdk BSD-3 linker scripts).
#
# The register blocks reuse the nRF52 models where the nRF51 block is the
# same IP at the same address: UART (legacy personality, ENABLE=4), GPIO
# (P0 at 0x50000000, OUT @+0x504), TIMER, RTC, RNG, TEMP, ECB, CLOCK/POWER,
# RADIO, GPIOTE, PPI, WDT. Not modelled: ADC (0x40007000, nRF51-specific),
# LPCOMP, QDEC, SPI/TWI slaves.
name: "nrf51822"
arch: "arm"
core: "cortex-m0"
cpu_hz: 16_000_000

flash:
  base: 0x00018000
  size: "160KB"
ram:
  base: 0x20000000
  size: "16KB"
memory_regions:
  - name: "nordic_hole"
    base: 0x00000000
    size: "96KB"
  # nrf51-sdk system_nrf51.c reads the part/revision identification words at
  # 0xF0000FE0..0xF0000FEC (PAN workarounds). Zero = "not an affected revision".
  - name: "nrf_part_id_probe"
    base: 0xF0000000
    size: "4KB"
peripherals:
  # SysTick: an ARMv6-M/ARMv7-M/ARMv8-M core peripheral every Cortex-M on
  # this family has. The Nordic SVD starts above the PPB, so it is declared
  # by hand; without it, any firmware using SysTick (the Arduino and Zephyr
  # cores both do) faults on its first SYST_CSR write.
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
    size: "16B"

  - id: "clock"
    type: "nrf_clock"
    base_address: 0x40000000
    size: "4KB"
    irq: 0
  - id: "radio"
    type: "nrf52840_radio"
    base_address: 0x40001000
    size: "4KB"
    irq: 1
  - id: "uart0"
    type: "nrf52840_uart"
    base_address: 0x40002000
    size: "4KB"
    irq: 2
  - id: "i2c0"
    type: "nrf52840_serial"
    base_address: 0x40003000
    size: "4KB"
    irq: 3
  - id: "twi1"
    type: "nrf52840_i2c"
    base_address: 0x40004000
    size: "4KB"
    irq: 4
  - id: "gpiote"
    type: "nrf52840_gpiotasksevents"
    base_address: 0x40006000
    size: "4KB"
    irq: 6
  - id: "timer0"
    type: "nrf52840_timer"
    base_address: 0x40008000
    size: "4KB"
    irq: 8
  - id: "timer1"
    type: "nrf52840_timer"
    base_address: 0x40009000
    size: "4KB"
    irq: 9
  - id: "timer2"
    type: "nrf52840_timer"
    base_address: 0x4000a000
    size: "4KB"
    irq: 10
  - id: "rtc0"
    type: "nrf52840_rtc"
    base_address: 0x4000b000
    size: "4KB"
    irq: 11
  - id: "temp"
    type: "nrf52840_temp"
    base_address: 0x4000c000
    size: "4KB"
    irq: 12
  - id: "rng"
    type: "nrf52840_rng"
    base_address: 0x4000d000
    size: "4KB"
    irq: 13
  - id: "ecb"
    type: "nrf52840_ecb"
    base_address: 0x4000e000
    size: "4KB"
    irq: 14
  - id: "wdt"
    type: "nrf52840_watchdog"
    base_address: 0x40010000
    size: "4KB"
    irq: 16
  - id: "rtc1"
    type: "nrf52840_rtc"
    base_address: 0x40011000
    size: "4KB"
    irq: 17
  - id: "nvmc"
    type: "nrf52840_nvmc"
    base_address: 0x4001e000
    size: "4KB"
    # nRF51 flash pages are 1 KB (RM v3.0 NVMC; FICR.CODEPAGESIZE = 1024),
    # not the nRF52's 4 KB. A 4 KB erase of the DAL's scratch page 0x3B400
    # would also blank its key-value store page 0x3BC00.
    config:
      page_size: 1024
  - id: "ppi"
    type: "nrf52840_ppi"
    base_address: 0x4001f000
    size: "4KB"
  - id: "gpio0"
    type: "gpio"
    base_address: 0x50000000
    size: "4KB"
    config:
      profile: "nrf52"
  - id: "ficr"
    type: "nrf51_ficr"
    base_address: 0x10000000
    size: "4KB"
  - id: "uicr"
    type: "nrf52840_uicr"
    base_address: 0x10001000
    size: "4KB"
  - id: "nvic"
    type: "nvic"
    base_address: 0xE000E100
    size: "1KB"

# GPIO labels -> port bit. nRF51822 Product Specification v3.x, pin
# assignments: one port, P0.00-P0.30 (31 GPIO on the QFN48 QFAA/QFAB and the
# WLCSP CEAA). The label IS the port and bit, as on the nRF52; declared rather
# than parsed so crates/config/tests/chip_pins_ratchet.rs has a source.
pins:
  "P0.00": { gpio: gpio0, bit: 0 }
  "P0.01": { gpio: gpio0, bit: 1 }
  "P0.02": { gpio: gpio0, bit: 2 }
  "P0.03": { gpio: gpio0, bit: 3 }
  "P0.04": { gpio: gpio0, bit: 4 }
  "P0.05": { gpio: gpio0, bit: 5 }
  "P0.06": { gpio: gpio0, bit: 6 }
  "P0.07": { gpio: gpio0, bit: 7 }
  "P0.08": { gpio: gpio0, bit: 8 }
  "P0.09": { gpio: gpio0, bit: 9 }
  "P0.10": { gpio: gpio0, bit: 10 }
  "P0.11": { gpio: gpio0, bit: 11 }
  "P0.12": { gpio: gpio0, bit: 12 }
  "P0.13": { gpio: gpio0, bit: 13 }
  "P0.14": { gpio: gpio0, bit: 14 }
  "P0.15": { gpio: gpio0, bit: 15 }
  "P0.16": { gpio: gpio0, bit: 16 }
  "P0.17": { gpio: gpio0, bit: 17 }
  "P0.18": { gpio: gpio0, bit: 18 }
  "P0.19": { gpio: gpio0, bit: 19 }
  "P0.20": { gpio: gpio0, bit: 20 }
  "P0.21": { gpio: gpio0, bit: 21 }
  "P0.22": { gpio: gpio0, bit: 22 }
  "P0.23": { gpio: gpio0, bit: 23 }
  "P0.24": { gpio: gpio0, bit: 24 }
  "P0.25": { gpio: gpio0, bit: 25 }
  "P0.26": { gpio: gpio0, bit: 26 }
  "P0.27": { gpio: gpio0, bit: 27 }
  "P0.28": { gpio: gpio0, bit: 28 }
  "P0.29": { gpio: gpio0, bit: 29 }
  "P0.30": { gpio: gpio0, bit: 30 }
