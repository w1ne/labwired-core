# WCH CH32V003F4P6 in TSSOP-20.
#
# Geometry and maximum clock: WCH CH32V003DS0 datasheet and official
# CH32V003 EVT headers. Peripheral bases/register layouts: WCH's
# openwch/ch32v003/EVT/EXAM/SRC/Peripheral/inc/ch32v00x.h and
# ch32v00x_rcc.h (GPIOA/C/D and RCC_TypeDef). The official GPIO_TypeDef has
# CFGLR, one reserved word, INDR, OUTDR, BSHR, BCR, LCKR; profile `wch`
# preserves that reserved word instead of inventing a CFGHR.
#
# Buyability screen (2026-11-05): LCSC C5187096 listed this exact order code
# in stock. WCH's product page has no explicit lifecycle field; this descriptor
# is not a lifecycle claim and is not included in the Proteus parity gate.
# Sources:
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Peripheral/inc/ch32v00x.h
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Peripheral/inc/ch32v00x_rcc.h
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Peripheral/src/ch32v00x_usart.c
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Core/core_riscv.h
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Debug/debug.c
#   https://www.wch-ic.com/downloads/CH32V003DS0_PDF.html
#   https://www.lcsc.com/product-detail/microcontrollers-mcu-mpu-soc_wch-jiangsu-qin-heng-ch32v003f4p6_C5187096.html

name: "ch32v003f4p6"
arch: "riscv"
core: "rv32ec"
cpu_hz: 48_000_000

# WCH's flash view at 0x08000000 is also aliased at address 0 for reset fetch.
flash:
  base: 0x08000000
  size: "16KB"
ram:
  base: 0x20000000
  size: "2KB"
flash_boot_alias: true

# CH32V003F4P6 bonds PA1/PA2, PC0..PC7 and PD0..PD7 (18 GPIOs).
# PinLoc labels are the package pads' GPIO names, independent of TSSOP pin number.
package: "TSSOP20"
pin_count: 20
pins:
  PA1: { gpio: "gpioa", bit: 1 }
  PA2: { gpio: "gpioa", bit: 2 }
  PC0: { gpio: "gpioc", bit: 0 }
  PC1: { gpio: "gpioc", bit: 1 }
  PC2: { gpio: "gpioc", bit: 2 }
  PC3: { gpio: "gpioc", bit: 3 }
  PC4: { gpio: "gpioc", bit: 4 }
  PC5: { gpio: "gpioc", bit: 5 }
  PC6: { gpio: "gpioc", bit: 6 }
  PC7: { gpio: "gpioc", bit: 7 }
  PD0: { gpio: "gpiod", bit: 0 }
  PD1: { gpio: "gpiod", bit: 1 }
  PD2: { gpio: "gpiod", bit: 2 }
  PD3: { gpio: "gpiod", bit: 3 }
  PD4: { gpio: "gpiod", bit: 4 }
  PD5: { gpio: "gpiod", bit: 5 }
  PD6: { gpio: "gpiod", bit: 6 }
  PD7: { gpio: "gpiod", bit: 7 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      profile: "wch"

  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010800
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 2 }
    config:
      profile: "wch"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 4 }
    config:
      profile: "wch"

  - id: "gpiod"
    type: "gpio"
    base_address: 0x40011400
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 5 }
    config:
      profile: "wch"

  # USART1 (ch32v00x.h): USART1_BASE = APB2PERIPH_BASE + 0x3800, RCC_USART1EN =
  # APB2PCENR bit 14. USART_TypeDef is STATR, DATAR, BRR, CTLR1, CTLR2, CTLR3,
  # GPR at 4-byte strides, the same layout as the STM32F1 USART, so the default
  # `stm32f1` UART layout serves it. No `irq` yet: USART1_IRQn (32) is not
  # wired to the PFIC in this slice, so TX is polled only.
  - id: "usart1"
    type: "uart"
    base_address: 0x40013800
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 14 }

  # FLASH interface (ch32v00x.h): FLASH_R_BASE = AHBPERIPH_BASE + 0x2000.
  # FLASH_TypeDef is ACTLR, KEYR, OBKEYR, STATR, CTLR, ADDR, -, OBR, WPR at
  # 4-byte strides, the STM32F1 FLASH layout (ACR, KEYR, OPTKEYR, SR, CR, AR,
  # -, OBR, WRPR), so the `stm32f1` profile serves it. WCH `SystemInit` sets
  # ACTLR.LATENCY here before switching SYSCLK; the latency is stored, not timed.
  - id: "flash_ctrl"
    type: "flash"
    base_address: 0x40022000
    size: "1KB"
    config:
      profile: "stm32f1"

  # QingKe V2 PFIC, WCH core_riscv.h `PFIC` at 0xE000E000 (`PFIC_Type`:
  # ISR, IPR, ITHRESDR, CFGR, GISR, VTF*, then IENR/IRER/IPSR/IPRR/IACTR at
  # +0x100 steps, IPRIOR at 0x400, SCTLR at 0xD10). A bit position is the
  # interrupt number (ch32v00x.h IRQn_Type), so a peripheral's `irq:` below is
  # that number. Priority threshold, VTF fast vectoring and nesting are not
  # applied; see crates/core/src/peripherals/wch_pfic.rs.
  - id: "pfic"
    type: "wch_pfic"
    base_address: 0xE000E000
    size: "4KB"

  # QingKe V2 STK, WCH core_riscv.h `SysTick` at 0xE000F000. It sits on the
  # core, outside RCC, so it has no clock gate. CNTIF with CTLR.STIE raises
  # `SysTicK_IRQn = 12` (ch32v00x.h) through the PFIC.
  - id: "stk"
    type: "wch_stk"
    base_address: 0xE000F000
    size: "256B"
    irq: 12
