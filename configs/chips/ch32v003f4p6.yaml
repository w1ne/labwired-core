# WCH CH32V003F4P6 in TSSOP-20.
#
# Geometry and maximum clock: WCH CH32V003DS0 datasheet and official
# CH32V003 EVT headers. Peripheral bases/register layouts: WCH's
# openwch/ch32v003/EVT/EXAM/SRC/Peripheral/inc/ch32v00x.h and
# ch32v00x_rcc.h (GPIOA/C/D and RCC_TypeDef). The official GPIO_TypeDef has
# CFGLR, one reserved word, INDR, OUTDR, BSHR, BCR, LCKR; profile `wch`
# preserves that reserved word instead of inventing a CFGHR.
#
# Buyability screen (2026-11-05): LCSC C5187096 listed this exact order code
# in stock. WCH's product page has no explicit lifecycle field; this descriptor
# is not a lifecycle claim and is not included in the Proteus parity gate.
# Sources:
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Peripheral/inc/ch32v00x.h
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Peripheral/inc/ch32v00x_rcc.h
#   https://github.com/openwch/ch32v003/blob/main/EVT/EXAM/SRC/Peripheral/src/ch32v00x_usart.c
#   https://www.wch-ic.com/downloads/CH32V003DS0_PDF.html
#   https://www.lcsc.com/product-detail/microcontrollers-mcu-mpu-soc_wch-jiangsu-qin-heng-ch32v003f4p6_C5187096.html

name: "ch32v003f4p6"
arch: "riscv"
core: "rv32ec"
cpu_hz: 48_000_000

# GPIO supply and digital input thresholds, so a co-simulation circuit voltage
# becomes the level the firmware reads. WCH CH32V003 datasheet
# (CH32V003DS0 V1.8), Table 3-16 "General I/O static characteristics", VDD
# 2.7-5.5 V, standard and FT pads alike:
#   VIL(max) = 0.19*(VDD - 2.7) + 0.65 V = 0.19*VDD + 0.137 V
#   VIH(min) = 0.22*(VDD - 2.7) + 1.55 V = 0.22*VDD + 0.956 V
# These are the guaranteed limits, not the 150 mV typical Schmitt hysteresis.
# The nominal rail is 3.3 V (0.764 V / 1.682 V); a routed VDD replaces it at
# each model boundary (5.0 V gives 1.087 V / 2.056 V).
io_voltage_v: 3.3
gpio_input_thresholds: { vil: 0.19, vih: 0.22, vil_offset_v: 0.137, vih_offset_v: 0.956 }

# WCH's flash view at 0x08000000 is also aliased at address 0 for reset fetch.
flash:
  base: 0x08000000
  size: "16KB"
ram:
  base: 0x20000000
  size: "2KB"
flash_boot_alias: true

# CH32V003F4P6 bonds PA1/PA2, PC0..PC7 and PD0..PD7 (18 GPIOs).
# PinLoc labels are the package pads' GPIO names, independent of TSSOP pin number.
package: "TSSOP20"
pin_count: 20
pins:
  PA1: { gpio: "gpioa", bit: 1 }
  PA2: { gpio: "gpioa", bit: 2 }
  PC0: { gpio: "gpioc", bit: 0 }
  PC1: { gpio: "gpioc", bit: 1 }
  PC2: { gpio: "gpioc", bit: 2 }
  PC3: { gpio: "gpioc", bit: 3 }
  PC4: { gpio: "gpioc", bit: 4 }
  PC5: { gpio: "gpioc", bit: 5 }
  PC6: { gpio: "gpioc", bit: 6 }
  PC7: { gpio: "gpioc", bit: 7 }
  PD0: { gpio: "gpiod", bit: 0 }
  PD1: { gpio: "gpiod", bit: 1 }
  PD2: { gpio: "gpiod", bit: 2 }
  PD3: { gpio: "gpiod", bit: 3 }
  PD4: { gpio: "gpiod", bit: 4 }
  PD5: { gpio: "gpiod", bit: 5 }
  PD6: { gpio: "gpiod", bit: 6 }
  PD7: { gpio: "gpiod", bit: 7 }

# ADC pads (ch32v00x.h ADC_Channel): the variant's analog-capable pins.
# `set_analog_pad_mv` and cosim `analog_pins:` routes drive these channels.
analog_pins:
  PA2: { peripheral: "adc1", channel: 0 }
  PA1: { peripheral: "adc1", channel: 1 }
  PC4: { peripheral: "adc1", channel: 2 }
  PD2: { peripheral: "adc1", channel: 3 }
  PD3: { peripheral: "adc1", channel: 4 }
  PD5: { peripheral: "adc1", channel: 5 }
  PD6: { peripheral: "adc1", channel: 6 }
  PD4: { peripheral: "adc1", channel: 7 }

peripherals:
  - id: "rcc"
    type: "rcc"
    base_address: 0x40021000
    size: "1KB"
    config:
      profile: "wch"

  - id: "gpioa"
    type: "gpio"
    base_address: 0x40010800
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 2 }
    config:
      profile: "wch"

  - id: "gpioc"
    type: "gpio"
    base_address: 0x40011000
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 4 }
    config:
      profile: "wch"

  - id: "gpiod"
    type: "gpio"
    base_address: 0x40011400
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 5 }
    config:
      profile: "wch"

  # USART1 (ch32v00x.h): USART1_BASE = APB2PERIPH_BASE + 0x3800, RCC_USART1EN =
  # APB2PCENR bit 14. USART_TypeDef is STATR, DATAR, BRR, CTLR1, CTLR2, CTLR3,
  # GPR at 4-byte strides, the same layout as the STM32F1 USART, so the default
  # `stm32f1` UART layout serves it. With CTLR1.RXNEIE/TXEIE set the UART
  # pends USART1_IRQn (32, ch32v00x.h) in the PFIC.
  - id: "usart1"
    type: "uart"
    base_address: 0x40013800
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 14 }
    irq: 32

  # AFIO (ch32v00x.h): AFIO_BASE = APB2PERIPH_BASE + 0x0000, RCC_AFIOEN =
  # APB2PCENR bit 0. AFIO_TypeDef is RESERVED0, PCFR1, EXTICR; EXTICR holds a
  # 2-bit port select per EXTI line 0..7 (GPIO_EXTILineConfig), profile
  # `wch_v00x`.
  - id: "afio"
    type: "afio"
    base_address: 0x40010000
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 0 }
    config:
      profile: "wch_v00x"

  # EXTI (ch32v00x.h): EXTI_BASE = APB2PERIPH_BASE + 0x0400. EXTI_TypeDef is
  # INTENR, EVENR, RTENR, FTENR, SWIEVR, INTFR, the STM32F1 EXTI register
  # file. Lines 0..7 are GPIO, 8 is PVD, 9 is AWU (ch32v00x_exti.h). A pending
  # unmasked GPIO line pends EXTI7_0_IRQn (20) in the PFIC; PVD and AWU
  # vectors are not wired.
  - id: "exti"
    type: "exti"
    base_address: 0x40010400
    size: "1KB"
    config:
      profile: "wch_v00x"
      lines: 10

  # ADC1 (ch32v00x.h): ADC1_BASE = APB2PERIPH_BASE + 0x2400, RCC_ADC1EN =
  # APB2PCENR bit 9. ADC_TypeDef is STATR, CTLR1, CTLR2, SAMPTR1/2, IOFR1-4,
  # WDHTR, WDLTR, RSQR1-3, ISQR, IDATAR1-4, RDATAR at the STM32F1 offsets
  # (CTLR2.ADON bit 0, SWSTART bit 22, STATR.EOC bit 1), plus DLYR at 0x50,
  # which is not modelled. The SAR is 10 bits (variant ADC_RESOLUTION 10),
  # profile `wch_v00x`. Pads: PA2 IN0, PA1 IN1, PC4 IN2, PD2 IN3, PD3 IN4,
  # PD5 IN5, PD6 IN6, PD4 IN7. IN8 (V_REFINT) and IN9 (V_cal) are internal
  # and not modelled, and IN10..IN18 do not exist on this part. ADC_IRQn = 29.
  - id: "adc1"
    type: "adc"
    base_address: 0x40012400
    size: "1KB"
    clock: { reg: "apb2pcenr", bit: 9 }
    irq: 29
    config:
      profile: "wch_v00x"

  # TIM1 (advanced-control timer, ch32v00x.h): TIM1_BASE = APB2PERIPH_BASE +
  # 0x2C00, RCC_TIM1EN = APB2PCENR bit 11. TIM_TypeDef is the STM32F1 register
  # file at the same offsets (CTLR1/CTLR2/SMCFGR/DMAINTENR/INTFR/SWEVGR/
  # CHCTLR1/CHCTLR2/CCER/CNT/PSC/ATRLR/RPTCR/CH1CVR..CH4CVR/BDTR), so the
  # `timer` model's F1 layout serves it. Vectors: TIM1_BRK 34, TIM1_UP 35,
  # TIM1_CC 37. `pad_map: wch_v00x` routes CH1..CH4 to PD2/PA1/PC3/PC4 (the
  # default map, no AFIO remap). The complementary CH1N..CH3N outputs
  # (PD0/PA2/PD1) are not modelled.
  - id: "tim1"
    type: "timer"
    base_address: 0x40012C00
    size: "1KB"
    irq: 35
    clock: { reg: "apb2pcenr", bit: 11 }
    config:
      advanced: true
      capture_compare_irq: 37
      break_irq: 34
      pad_map: "wch_v00x"

  # TIM2 (general-purpose timer, ch32v00x.h): TIM2_BASE = APB1PERIPH_BASE +
  # 0x0000, RCC_TIM2EN = APB1PCENR bit 0. Same F1-layout register file, 16-bit
  # counter, four channels; TIM2_IRQn = 38. `pad_map: wch_v00x` routes CH1..CH4
  # to PD4/PD3/PC0/PD7.
  - id: "tim2"
    type: "timer"
    base_address: 0x40000000
    size: "1KB"
    irq: 38
    clock: { reg: "apb1pcenr", bit: 0 }
    config:
      pad_map: "wch_v00x"

  # QingKe V2 system timer STK (core_riscv.h): SysTick_Type at 0xE000F000 is
  # CTLR, SR, CNT, reserved, CMP. The vendor noneos-sdk `Delay_Us`/`Delay_Ms`
  # poll SR.CNTIF. The STK is a core block (no RCC gate). With CTLR.STIE set a
  # compare match pends SysTick_IRQn (12, ch32v00x.h) in the core-decoded PFIC
  # at 0xE000E000.
  - id: "stk"
    type: "qingke_stk"
    base_address: 0xE000F000
    size: "32B"
    irq: 12

  # FLASH interface (ch32v00x.h): FLASH_R_BASE = AHBPERIPH_BASE + 0x2000.
  # FLASH_TypeDef starts ACTLR, KEYR, OBKEYR, STATR, CTLR, ADDR, as the STM32F1
  # FLASH block; `SystemInit` sets the ACTLR wait state. Programming beyond
  # that layout (MODEKEYR fast mode) is not modelled.
  - id: "flash_ctrl"
    type: "flash"
    base_address: 0x40022000
    size: "1KB"
    config:
      profile: "stm32f1"

  # VENDOR_CFG0 (ch32v00x.h, 0x1FFFF7D4): `SystemInit` reads its low byte as
  # an HSI trim and applies it unless it reads 0xFF. A `stub` reads zero, so
  # SystemInit writes HSITRIM = 0; the model does not derive the HSI rate
  # from HSITRIM, so that write has no effect on timing.
  - id: "vendor_cfg0"
    type: "stub"
    base_address: 0x1FFFF7D4
    size: "4B"
