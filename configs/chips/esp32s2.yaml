# Espressif ESP32-S2-SOLO-2 module used on ESP32-S2-DevKitC-1-N8R2.
#
# This is a deliberately narrow fast-boot profile: one LX7 CPU, the S2's
# internal DRAM/IRAM alias, an ESP32-S2 UART0 TX FIFO, and the official GPIO
# data/enable/input head through IN1. The mask ROM, flash cache/MMU, GPIO
# matrix, IO_MUX, Wi-Fi, USB OTG, PSRAM and the remaining S2 peripherals are
# not modelled by this descriptor.
#
# Address map and UART/GPIO register bases follow Espressif's ESP-IDF S2 SoC
# headers: components/soc/esp32s2/include/soc/soc.h and
# components/soc/esp32s2/register/soc/{reg_base.h,gpio_reg.h}.
name: "esp32s2"
arch: "xtensa-lx7"
cpu_hz: 240_000_000

# 8 MiB flash on the selected N8R2 module. This maps its instruction-cache
# window for direct ELF fast boot; SPI flash commands and cache/MMU are not
# included in this profile.
flash:
  base: 0x40080000
  size: "8192KB"
ram:
  base: 0x3FFB0000
  size: "320KB"

# S2 IRAM and DRAM are executable/data aliases of the same 320 KiB SRAM.
memory_regions:
  - name: "iram"
    base: 0x40020000
    size: "320KB"
    alias_of: 0x3FFB0000

# Official ESP32-S2-DevKitC-1 user guide (checked 2026-11-17):
#   https://docs.espressif.com/projects/esp-dev-kits/en/latest/esp32s2/esp32-s2-devkitc-1/user_guide.html
# J3 TX is U0TXD/GPIO43; J3 RX is U0RXD/GPIO44; GPIO18 drives the addressable
# RGB LED. The WS2812 protocol and USB-UART bridge are outside this profile.
pins:
  GPIO18: { gpio: "gpio", bit: 18 }
  GPIO43:
    gpio: "gpio"
    bit: 43
    functions: [{ type: uart, peripheral: "uart0", role: tx }]
  GPIO44:
    gpio: "gpio"
    bit: 44
    functions: [{ type: uart, peripheral: "uart0", role: rx }]

peripherals:
  # ESP32-S2 UART0 TX FIFO is UART_FIFO (offset 0) at DR_REG_UART_BASE.
  # The narrow smoke writes the FIFO directly; it does not claim baud-rate,
  # RX, interrupt, IO_MUX or GPIO-matrix behavior.
  - id: "uart0"
    type: "uart"
    base_address: 0x3F400000
    size: "256B"
    config:
      profile: "custom"
      tx_offset: 0
  # GPIO data/enable/input head at DR_REG_GPIO_BASE (esp-idf S2 reg_base.h
  # 0x3F40_4000). OUT @0x04, ENABLE @0x20, IN @0x3C, IN1 @0x40. The 68-byte
  # window ends at IN1; matrix routing, PIN_x, IO_MUX and IRQs are omitted.
  - id: "gpio"
    type: "esp32s2_gpio"
    base_address: 0x3F404000
    size: "68B"
