# Narrow ESP32-S3FN8 profile for M5Stack Cardputer-Adv (SKU K132-ADV).
# The smoke uses GPIO35/36 + GP-SPI3 for the built-in ST7789V2, GPIO33 for
# panel reset, GPIO34 for D/C, GPIO37 for chip select, GPIO38 for backlight,
# and UART0 for the serial marker.
name: "esp32s3-cardputer-adv-smoke"
arch: "xtensa-lx7"
cpu_hz: 240_000_000

flash:
  base: 0x42000000
  size: "8192KB"
ram:
  base: 0x3FC88000
  size: "512KB"

pins:
  GPIO33: { gpio: "gpio", bit: 33 }
  GPIO34: { gpio: "gpio", bit: 34 }
  GPIO35: { gpio: "gpio", bit: 35, functions: [{ type: spi, peripheral: spi3, role: mosi }] }
  GPIO36: { gpio: "gpio", bit: 36, functions: [{ type: spi, peripheral: spi3, role: sck }] }
  GPIO37: { gpio: "gpio", bit: 37, functions: [{ type: spi, peripheral: spi3, role: nss }] }
  GPIO38: { gpio: "gpio", bit: 38 }

peripherals:
  - id: "gpio"
    type: "esp32s3_gpio"
    base_address: 0x60004000
    size: "2KB"

  - id: "uart0"
    type: "uart"
    base_address: 0x60000000
    size: "512B"
    config:
      debug_schema: "../peripherals/esp32s3/uart0.yaml"

  - id: "spi3"
    type: "esp32s3_spi"
    base_address: 0x60025000
    size: "4KB"
    irq: 22
