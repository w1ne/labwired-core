# Narrow RP2350A profile for the Waveshare RP2350-Zero onboard WS2812 smoke.
# The board has 4 MiB flash. Only UART0, IO_BANK0 and SIO are exposed because
# the smoke sends a pixel frame on GP16 and reports the result over UART0.
name: "rp2350-zero-smoke"
arch: "arm"
core: "cortex-m33"
registers_count: 240
cpu_hz: 150_000_000

flash:
  base: 0x10000000
  size: "4MiB"
ram:
  base: 0x20000000
  size: "520KiB"

reset_vector_offset: 0x0
pins:
  GP0: { gpio: "sio", bit: 0 }
  GP1: { gpio: "sio", bit: 1 }
  GP16: { gpio: "sio", bit: 16 }

peripherals:
  - id: "uart0"
    type: "uart"
    base_address: 0x40070000
    size: "1KB"
    config:
      profile: "pl011"
      debug_schema: "../peripherals/rp2350/uart0.yaml"

  - id: "io_bank0"
    type: "rp2040_io_bank0"
    base_address: 0x40028000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/io_bank0.yaml"

  - id: "sio"
    type: "rp2040_sio"
    base_address: 0xD0000000
    size: "4KB"
    config:
      debug_schema: "../peripherals/rp2350/sio.yaml"
