name: stm32f072b_discovery
description: >-
  Imported STM32F072B-DISCO profile: the stm32f072 silicon profile (Cortex-M0,
  128 KiB flash, 16 KiB SRAM, RCC, USART1-4, GPIOA-F, SYSCFG/EXTI, nine
