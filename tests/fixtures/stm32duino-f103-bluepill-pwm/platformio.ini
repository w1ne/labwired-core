; Stock STM32duino sketch for the STM32F103C8T6 Blue Pill: hardware PWM on
; TIM3_CH1 (PA6) and TIM3_CH2 (PA7), as `analogWrite()` configures it.
;
; The .elf committed next to this directory is the `bluepill` build:
;   pio run -e bluepill
;   arm-none-eabi-strip -o ../stm32duino-f103-bluepill-pwm.elf \
;       .pio/build/bluepill/firmware.elf
[env]
platform = ststm32
framework = arduino
build_flags = -Os

[env:bluepill]
board = bluepill_f103c8
