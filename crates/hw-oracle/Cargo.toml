[package]
name = "labwired-hw-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HW oracle harness: JTAG-driven cross-validation against physical boards."

[dependencies]
labwired-hw-oracle-macros = { path = "../hw-oracle-macros" }
labwired-core = { path = "../core" }
labwired-config = { path = "../config" }
labwired-loader = { path = "../loader" }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
goblin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
# serialport pulls libudev-sys on Linux which needs libudev-dev system
# package — not present on CI's hosted runners. The crate is only used by
# the HW flash/detect path (gated by the `hw-oracle` feature), so make the
# dep itself optional and activate it through the feature.
serialport = { workspace = true, optional = true }

# Chip-model HW-vs-sim diff tool (issue #105). Loads a baseline capture
# produced by `scripts/hw-oracle/esp32_capture.sh`, replays the firmware
# in the simulator for the same number of cycles, and emits a JSON diff.
# Always available — does not require the `hw-oracle` feature because the
# replay side runs purely in sim and only reads files written by the HW
# capture step.
[[bin]]
name = "esp32_replay_in_sim"
path = "src/bin/esp32_replay_in_sim.rs"

[features]
default = []
# Gates Xtensa/ESP32-S3 _hw and _diff runners; CI enables on self-hosted runner.
hw-oracle = ["dep:serialport"]
# Gates RISC-V/ESP32-C3 _hw and _diff runners.  Sim-side is always built.
hw-oracle-c3 = []
# Gates ARM Thumb/STM32 _hw and _diff runners.  Sim-side is always built.
hw-oracle-stm32 = []
# Gates nRF52 (Cortex-M4) MMIO diff harness over ST-Link SWD.
# Sim-side is always built; this gate only wires the hardware tests.
hw-oracle-nrf52 = []

[dev-dependencies]
labwired-fuzz = { path = "../labwired-fuzz" }

# ── ZERO-TEST TARGETS CANNOT REPORT GREEN ────────────────────────────────────
# Every target below is an integration test whose ENTIRE body sits behind an
# inner `#![cfg(feature = "...")]`. Built without the feature the file compiles
# to an EMPTY libtest binary, which prints `test result: ok. 0 passed` and exits
# 0 — indistinguishable, to CI and to a human, from a suite that ran and passed.
# `required-features` makes cargo SKIP the target instead of reporting it green,
# and makes an explicit `--test <name>` without the feature a hard error.
# Adding a new `#![cfg(feature = ...)]` test file without a block here fails
# `crates/core/src/tests/no_vacuous_test_targets.rs`.

# #![cfg(feature = "hw-oracle-stm32")]
[[test]]
name = "f103_fuzz_hil_confirm"
required-features = ["hw-oracle-stm32"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_ccm_conformance"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_full_register_conformance"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_gpio_conformance"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_mmio_diff"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_onboarding_diff"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_power_conformance"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_spim_easydma_conformance"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_spis_twis_conformance"
required-features = ["hw-oracle-nrf52"]

# #![cfg(feature = "hw-oracle-nrf52")]
[[test]]
name = "nrf52_timer_rtc_conformance"
required-features = ["hw-oracle-nrf52"]
