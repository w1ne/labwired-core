# Source-grounded functional slice of HeyPCB's ESP32-S3 SCD41 board.
# Portable firmware reaches U4 through a Flex I2C bus; the ESP32 CPU and its
# I2C controller are not emulated.
schema_version: 1
name: heypcb-esp32-s3-scd41
assumptions:
  - Firmware is a newly authored portable WebAssembly behavior program, not firmware from the pinned board source.
  - U4 is the catalog `scd41` device model at address 0x62, the fixed address the source README states.
  - The bus runs at 100 kHz. The pinned source contains no firmware and states no bus speed.
  - A transfer takes one SCL period for each bit, START and STOP. Firmware instructions take no virtual time.
  - The data-ready status always reads ready (0x8006), and a measurement read gives the stimulus values at the time of the command. The part updates its result once every 5 s.
  - The IO48 user LED is represented by digital logic state only.
  - The console stands for the ESP32-S3 native USB serial port on J1, as the source README states for flashing. A write arrives whole at the time of the call and takes no virtual time.
unsupported_checks:
  - Original ESP32-S3 firmware execution and target instruction or I2C controller fidelity; the pinned source contains no board firmware.
  - The 5 s periodic measurement interval and the not-ready status before the first result; the catalog model reports data ready at all times.
  - Command execution times (500 ms after stop_periodic_measurement, 1 ms after the read commands); the model answers at once.
  - Automatic self-calibration, temperature offset, altitude and ambient-pressure compensation, single-shot and low-power modes, and their timing.
  - The SCL and SDA waveforms on IO9 and IO8, the R6 and R7 pull-ups, bus capacitance, and clock stretching.
  - USB enumeration, CDC transfer timing and host polling of the console; text the host sends to the firmware.
  - Full-board power, the 175 mA measurement current peaks, USB, boot/reset, RF, MCU integration, and assembled hardware behavior.
  - Sensor accuracy, noise, response time, and production spread of a physical SCD41.
ports:
  - { name: co2_ppm, signal: environment.co2, access: write, kind: number, unit: ppm, initial: 450 }
  - { name: ambient_c, signal: environment.temperature, access: write, kind: number, unit: "°C", initial: 25 }
  - { name: humidity_rh, signal: environment.humidity, access: write, kind: number, unit: "%RH", initial: 50 }
  - { name: user_led_drive, signal: source.U3.GPIO48, access: write, kind: bool, initial: 0 }
  - { name: user_led_state, signal: source.D1.logic_state, access: read, kind: bool }
cosim_models:
  - id: source-d1-user-led
    adapter: behavior
    step_ns: 1000
    inputs: { drive: source.U3.GPIO48 }
    outputs: { led: source.D1.logic_state }
    config:
      behavior:
        primitive: gpio_device
        states: [off, on]
        outputs: [led]
        pin_defaults: { led: false }
        rules:
          - on: { input: drive }
            when: 'input(drive) != 0'
            do: [{ goto: on }, { pin: led, level: 1 }]
          - on: { input: drive }
            when: 'input(drive) == 0'
            do: [{ goto: off }, { pin: led, level: 0 }]
i2c_buses:
  # Source nets I2C_SCL (U3 pad 17, IO9; U4 pad 8) and I2C_SDA (U3 pad 12, IO8; U4 pad 10).
  - name: sensor_i2c
    frequency_hz: 100000
    devices:
      - id: source-u4-scd41
        type: scd41
        config: { i2c_address: 0x62 }
        inputs:
          co2: environment.co2
          temperature: environment.temperature
          humidity: environment.humidity
console:
  # The source README: "USB-C, native USB on the ESP32-S3 (no bridge chip)".
  name: usb_serial
