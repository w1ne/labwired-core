# `labwired test --script test-hot.yaml`. 50 °C: the divider output crosses the firmware's 2000 mV alarm threshold.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: temperature_c }
    - { port: temperature_mv }
    - { port: hot_alarm_drive }
    - { number: 50 }
limits:
  max_steps: 100000
  max_time_ns: 10000
assertions:
  - entry_result: { equals: 2428 }
  - port_value: { port: temperature_mv, equals: 2428 }
  - port_value: { port: hot_alarm_state, equals: 1 }
  - digital_edges: { port: hot_alarm_drive, count: 1 }
  - digital_edges: { port: hot_alarm_state, count: 1 }
