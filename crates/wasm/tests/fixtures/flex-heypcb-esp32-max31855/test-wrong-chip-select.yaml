# `labwired test --script test-wrong-chip-select.yaml`. Negative control. The
# firmware selects CS 11. The pinned board wires U4 CS to IO10 only, so no
# device is selected: the transfer returns status 1, `setup` returns 1,
# `loop` has no reading, and the indicator stays off.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - call: { export: setup, args: [{ bus: sensor_spi }, { port: user_led_drive }, { number: 11 }] }
  - set: { port: thermocouple_c, value: 310 }
  - call: { export: loop, repeat: 2 }
limits:
  max_steps: 1000000
  max_time_ns: 1000000000
assertions:
  - entry_result: { equals: 0 }
  - entry_result: { equals: 1, step: 0 }
  - spi_transfers: { bus: sensor_spi, cs: 11, selected: false, equals: 1 }
  - spi_transfers: { bus: sensor_spi, selected: true, equals: 0 }
  - digital_edges: { port: user_led_drive, count: 0 }
  - digital_edges: { port: user_led_state, count: 0 }
  # One 4-byte frame at 1 MHz; the bus time passes with no device.
  - final_time_ns: { equals: 32000 }
  - console_contains: "no MAX31855 on CS 11\n"
