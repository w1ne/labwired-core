# CPU-free functional contract. Portable firmware drives an existing digital
# rule block; its output drives the existing analog RC solver. This is a
# synthetic device contract, not a fidelity claim for any physical chip.
schema_version: 1
name: flex-portable-rc
ports:
  - { name: command, signal: control.enable, access: write, kind: bool, initial: 0 }
  - { name: voltage, signal: circuit.voltage, access: read, kind: number, unit: V }
cosim_models:
  - id: control
    adapter: behavior
    step_ns: 1000
    inputs: { enable: control.enable }
    outputs: { ready: device.ready }
    config:
      behavior:
        primitive: gpio_device
        states: [idle, ready]
        outputs: [ready]
        pin_defaults: { ready: false }
        rules:
          - on: { input: enable }
            when: 'input(enable) != 0'
            do: [{ goto: ready }, { pin: ready, level: 1 }]
          - on: { input: enable }
            when: 'input(enable) == 0'
            do: [{ goto: idle }, { pin: ready, level: 0 }]
  - id: rc
    adapter: analog
    step_ns: 25000
    inputs: { drive: device.ready }
    outputs: { v_out: circuit.voltage }
    config:
      # Integrate the completed interval before latching this boundary's drive.
      input_sampling: previous_boundary
      netlist_text: |
        Vdrive in 0 dc 0
        R1 in out 10k
        C1 out 0 100n
      vdd: 3.3
      probes: { v_out: "v(out)" }
      sources: { drive: Vdrive }
