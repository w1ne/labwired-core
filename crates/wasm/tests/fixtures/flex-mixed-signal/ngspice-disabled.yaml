# Flex test script on system-ngspice.yaml. Negative control: firmware mode 1
# leaves the enable low, the ngspice RC stays at 0 V and the firmware times
# out after 4 ms with no response. See ngspice-enable.yaml for the naming.
schema_version: "1.0"
inputs:
  flex: system-ngspice.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: command }
    - { port: voltage }
    - { number: 1 }
limits:
  max_steps: 100000
  max_time_ns: 4000000
assertions:
  - entry_result: { equals: 0 }
  - port_value: { port: voltage, equals: 0 }
  - digital_edges: { port: command, count: 0 }
  - digital_edges: { signal: device.ready, count: 0 }
  - analog_sample: { channel: rc.v_out, at_ns: 4000000, equals: 0 }
  - final_time_ns: { equals: 4000000 }
