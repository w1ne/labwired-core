# `labwired test --script test-enable.yaml`. The firmware enables the RC network and returns the time, in µs, at which the voltage reaches 63.2 % of 3.3 V.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: command }
    - { port: voltage }
    - { number: 0 }
limits:
  max_steps: 100000
  max_time_ns: 4000000
assertions:
  - entry_result: { equals: 1050 }
  - port_value: { port: voltage, min: 2.0856, max: 3.3 }
  - digital_edges: { port: command, count: 1 }
  # `device.ready` is a traced model signal with no firmware port.
  - digital_edges: { signal: device.ready, times_ns: [1000] }
  - analog_sample: { port: voltage, at_ns: 1025000, max: 2.0856 }
  - analog_sample: { port: voltage, at_ns: 1050000, min: 2.0856 }
  - final_time_ns: { equals: 1050000 }
