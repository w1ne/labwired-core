# `labwired test --script test-cold-and-humid.yaml`. The test bench sets a
# cold, humid ambient before `setup`. One sample gives a negative temperature
# and turns the indicator on.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - set: { port: ambient_c, value: -10 }
  - set: { port: humidity_rh, value: 90 }
  - call: { export: setup, args: [{ bus: sensor_i2c }, { port: user_led_drive }, { number: 0x44 }, { number: 10000 }] }
  - call: { export: loop }
  - call: { export: temperature_centi_c }
limits:
  max_steps: 1000000
  max_time_ns: 100000000
assertions:
  - entry_result: { equals: 9000 }
  - entry_result: { equals: 0, step: 2 }
  - entry_result: { equals: 19000, step: 3 }
  - i2c_transfers: { bus: sensor_i2c, address: 0x44, ack: true, equals: 5 }
  - digital_edges: { port: user_led_drive, times_ns: [13900000] }
  - digital_edges: { port: user_led_state, times_ns: [13901000] }
  - port_value: { port: user_led_state, equals: 1 }
  - final_time_ns: { equals: 14900000 }
  - console_contains: "T=-10.00 C RH=90.00 %\n"
