# `labwired test --script ngspice-range-ends.yaml`: the same sequence as
# test-range-ends.yaml solved by ngspice instead of the in-core engine. The two
# ends of the declared 10..60 °C range, the 25 °C reference and one value
# between. SNS_AN1 settles at 2.131089, 0.769167, 1.650000 and 1.398660 V; the
# firmware reads 2131, 769, 1649 and 1398 mV and recovers 10.0, 60.0, 25.0 and
# 33.3 °C. The indicator is on only at 60 °C.
#
# 1.650000 V is exactly on a millivolt boundary. ngspice reports it 4e-16 V
# above the in-core value, which is still below the f64-to-millivolt
# truncation boundary, so both engines print 1649 mV. Every asserted value here
# is identical to the in-core run.
schema_version: "1.0"
inputs:
  flex: system-ngspice.yaml
  firmware: firmware.wasm
sequence:
  - call: { export: setup, args: [{ port: sensor_v }, { port: user_led_drive }] }
  - set: { port: ambient_c, value: 10 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 60 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 25 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 33.3 }
  - call: { export: loop }
limits:
  max_steps: 1000000
  max_time_ns: 1000000000
assertions:
  - entry_result: { equals: 101000, step: 2 }
  - entry_result: { equals: 106001, step: 4 }
  - entry_result: { equals: 102500, step: 6 }
  - entry_result: { equals: 103330, step: 8 }
  - analog_sample: { port: sensor_v, at_ns: 10000000, min: 2.13108, max: 2.13110 }
  - analog_sample: { port: sensor_v, at_ns: 110000000, min: 0.76916, max: 0.76918 }
  - analog_sample: { port: sensor_v, at_ns: 310000000, min: 1.39865, max: 1.39867 }
  - digital_edges: { port: user_led_drive, times_ns: [110000000, 210000000] }
  - final_time_ns: { equals: 400000000 }
  - console_contains: "T=10.0 C mV=2131\nT=60.0 C mV=769 ALARM\nT=25.0 C mV=1649\nT=33.3 C mV=1398\n"
