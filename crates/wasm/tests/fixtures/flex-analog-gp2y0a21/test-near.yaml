# `labwired test --script test-near.yaml`. Target at 100 mm: the sensor output crosses the firmware's 1500 mV threshold.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: distance_mm }
    - { port: distance_mv }
    - { port: near_drive }
    - { number: 100 }
limits:
  max_steps: 100000
  max_time_ns: 10000
assertions:
  - entry_result: { equals: 2300 }
  - port_value: { port: distance_mv, equals: 2300 }
  - port_value: { port: near_led, equals: 1 }
  - digital_edges: { port: near_drive, count: 1 }
  - digital_edges: { port: near_led, count: 1 }
