# `labwired test --script test-uno-pulse.yaml`. The same firmware bytes on the one-LED board contract. 4294967295 tells the firmware there is no second LED port.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: arduino-uno.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: drive }
    - { port: led_state }
    - { number: 4294967295 }
    - { number: 0 }
limits:
  max_steps: 100000
  max_time_ns: 10000
assertions:
  - entry_result: { equals: 1 }
  - digital_edges: { port: drive, count: 4 }
  - digital_edges: { port: led_state, count: 4 }
