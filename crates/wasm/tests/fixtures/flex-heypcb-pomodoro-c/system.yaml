  - { name: min1, signal: source.U1.PD2, access: write, kind: bool, initial: 0 }
  - { name: min2, signal: source.U1.PC7, access: write, kind: bool, initial: 0 }
  - { name: min3, signal: source.U1.PC6, access: write, kind: bool, initial: 0 }
  - { name: min4, signal: source.U1.PC5, access: write, kind: bool, initial: 0 }
  - { name: min5, signal: source.U1.PC4, access: write, kind: bool, initial: 0 }
  - { name: min6, signal: source.U1.PC3, access: write, kind: bool, initial: 0 }
  - { name: min7, signal: source.U1.PC2, access: write, kind: bool, initial: 0 }
