# Pomodoro Pal: the whole indicator face, the piezo drive and the touch pad,
# for the pinned firmware/pomodoro.c compiled unchanged as Flex firmware.
# Nets, pads and references are those of the pinned PCB; see source-map.json.
schema_version: 1
name: flex-heypcb-pomodoro-c
assumptions:
  - Each LED model reports the logic level of its MCU pin one 5,000 ns model step later. LED current, the 1 kΩ series resistors and light output are not modeled.
  - The piezo model reports the logic level of the BUZZ pin. R4 (100 Ω) and sound are not modeled.
  - The touch pad is one Boolean that the test bench sets. ReadTouchPin returns 100 counts for each iteration with the pad open and 200 counts with a contact. The ADC charge-time measurement is not simulated.
  - Firmware code takes no virtual time, with two exceptions. Delay_Us and Delay_Ms take the time they name. Each use of SysTick outside the SysTick handler takes 5,000 ns.
  - SysTick counts 48 MHz. A compare match calls the firmware's SysTick_Handler at the end of a time step of at most 1 ms.
unsupported_checks:
  - The original CH32V003 binary, its instructions, GPIO, ADC and touch peripherals are not executed. The firmware source is compiled for WebAssembly against a stand-in for the ch32fun API.
  - Execution time of firmware code, interrupt latency, pin modes, pull resistors and clock gates are not modeled.
  - Supply current, USB-C power, LED brightness and piezo sound pressure are not modeled.
ports:
