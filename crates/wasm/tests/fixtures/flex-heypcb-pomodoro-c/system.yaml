cosim_models:
  - id: d3
    adapter: behavior
    step_ns: 5000
    inputs: { drive: source.U1.PD3 }
    outputs: { state: source.D3.logic_state }
    config: &follower
      behavior:
        primitive: gpio_device
        states: [off, on]
        outputs: [state]
        pin_defaults: { state: false }
        rules:
          - on: { input: drive }
            when: 'input(drive) != 0'
            do: [{ goto: on }, { pin: state, level: 1 }]
          - on: { input: drive }
            when: 'input(drive) == 0'
            do: [{ goto: off }, { pin: state, level: 0 }]
  - id: d4
    adapter: behavior
    step_ns: 5000
    inputs: { drive: source.U1.PD2 }
    outputs: { state: source.D4.logic_state }
    config: *follower
