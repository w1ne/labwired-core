# Held-out setup/loop workload on the existing registered NTC analog source.
schema_version: 1
name: Reusable NTC fan thermostat with hysteresis
assumptions:
  - The registered 10 kΩ B3950 NTC model and its 10 kΩ pull-down divider provide the sensor millivolts.
  - Portable firmware turns the fan on at 2000 mV and off at 1800 mV; it compares millivolts and does not run a target ADC driver.
  - One `loop` call is one 1 µs control period. The period is a test value, not a thermal time constant.
unsupported_checks:
  - Original target-MCU firmware, ADC peripheral behavior, thermistor tolerance, divider tolerance, and physical measurement are not modeled.
  - Thermal mass, airflow, and the effect of the fan on the temperature are not modeled; the test bench sets the temperature.
ports:
  - { name: temperature_c, signal: environment.temperature_c, access: write, kind: number, unit: "°C", initial: 25 }
  - { name: temperature_mv, signal: sensor.output_mv, access: read, kind: number, unit: mV }
  - { name: fan_drive, signal: fan.drive, access: write, kind: bool, initial: 0 }
  - { name: fan_state, signal: fan.state, access: read, kind: bool }
cosim_models:
  - id: ntc-sensor
    adapter: behavior
    step_ns: 1000
    inputs: { temperature: environment.temperature_c }
    outputs: { voltage_mv: sensor.output_mv }
    config:
      device_type: ntc-thermistor
  - id: fan-switch
    adapter: behavior
    step_ns: 1000
    inputs: { drive: fan.drive }
    outputs: { state: fan.state }
    config:
      behavior:
        primitive: gpio_device
        states: [off, on]
        outputs: [state]
        pin_defaults: { state: false }
        rules:
          - on: { input: drive }
            when: 'input(drive) != 0'
            do: [{ goto: on }, { pin: state, level: 1 }]
          - on: { input: drive }
            when: 'input(drive) == 0'
            do: [{ goto: off }, { pin: state, level: 0 }]
