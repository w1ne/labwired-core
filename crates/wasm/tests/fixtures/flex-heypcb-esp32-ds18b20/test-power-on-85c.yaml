# `labwired test --script test-power-on-85c.yaml`. The firmware reads the
# scratchpad before it starts a conversion. The DS18B20 power-on temperature
# register holds +85 °C (0x0550), not the 25 °C at the probe, which is why
# firmware must convert first. `loop` then reads 25 °C.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - call: { export: setup, args: [{ port: dq_drive }, { port: dq }, { port: user_led_drive }, { number: 0x28 }, { number: 12 }] }
  - call: { export: peek }
  - call: { export: loop }
limits:
  max_steps: 10000000
  max_time_ns: 1000000000
assertions:
  - entry_result: { equals: 400 }
  - entry_result: { equals: 0, step: 0 }
  - entry_result: { equals: 1360, step: 1 }
  # 16.88 ms `setup`, 7.12 ms scratchpad read, 759.34 ms `loop`.
  - final_time_ns: { equals: 783340000 }
  - console_contains: "scratchpad T=85.0000 C\nT=25.0000 C after 701 polls\n"
