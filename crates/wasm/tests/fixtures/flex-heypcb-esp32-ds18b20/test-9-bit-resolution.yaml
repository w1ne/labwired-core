# `labwired test --script test-9-bit-resolution.yaml`. The firmware writes
# 9-bit resolution (CONFIG 0x1F). A 9-bit conversion takes 93.75 ms and leaves
# the three lowest temperature bits clear, so 25.0625 °C reads 25.0 °C and
# 25.5625 °C reads 25.5 °C. A model that kept the 12-bit time would end
# each `loop` 656 ms later.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - set: { port: probe_c, value: 25.0625 }
  - call: { export: setup, args: [{ port: dq_drive }, { port: dq }, { port: user_led_drive }, { number: 0x28 }, { number: 9 }] }
  - call: { export: loop }
  - set: { port: probe_c, value: 25.5625 }
  - call: { export: loop }
limits:
  max_steps: 10000000
  max_time_ns: 1000000000
assertions:
  - entry_result: { equals: 408 }
  - entry_result: { equals: 0, step: 1 }
  - entry_result: { equals: 400, step: 2 }
  # The conversion ends 93.75 ms after the last CONVERT T bit (2.01 ms into
  # the loop); poll 88 opens at 96.24 ms. Each `loop` takes 103.43 ms.
  - final_time_ns: { equals: 223740000 }
  - digital_edges: { port: user_led_drive, count: 0 }
  - console_contains: "DS18B20 9-bit, TH 30 C, TL 28 C\nT=25.0000 C after 88 polls\nT=25.5000 C after 88 polls\n"
