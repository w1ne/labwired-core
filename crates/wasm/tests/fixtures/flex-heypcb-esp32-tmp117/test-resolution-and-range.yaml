# `labwired test --script test-resolution-and-range.yaml`. One LSB of
# TEMP_RESULT is 7.8125 m°C. -40.0078125 °C is exactly -5121 LSB
# (-40.008 °C after rounding to m°C); 0.004 °C rounds to 1 LSB (0.008 °C);
# 150 °C, the top of the specified range, is 19200 LSB. The indicator goes on
# at 150 °C only.
# All expected values were calculated from the TMP117 model encoding and the
# firmware arithmetic before the first run.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - set: { port: ambient_c, value: -40.0078125 }
  - call: { export: setup, args: [{ bus: sensor_i2c }, { port: user_led_drive }, { number: 0x48 }] }
  - call: { export: loop }
  - set: { port: ambient_c, value: 0.004 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 150 }
  - call: { export: loop }
limits:
  max_steps: 1000000
  max_time_ns: 4000000000
assertions:
  - entry_result: { equals: 250000 }
  - entry_result: { equals: 59992, step: 2 }
  - entry_result: { equals: 100008, step: 4 }
  - i2c_transfers: { bus: sensor_i2c, address: 0x48, ack: true, equals: 10 }
  - digital_edges: { port: user_led_drive, times_ns: [2004600000] }
  - port_value: { port: user_led_state, equals: 1 }
  - final_time_ns: { equals: 3004600000 }
  - console_contains: "T=-40.008 C\nT=0.008 C\nT=150.000 C\n"
