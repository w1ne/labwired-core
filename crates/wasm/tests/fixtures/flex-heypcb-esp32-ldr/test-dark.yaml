# `labwired test --script test-dark.yaml`. Negative control. 0 lx: the kit output is 0 mV and the LED stays off.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: lux }
    - { port: sensor_mv }
    - { port: user_led_drive }
    - { port: user_led_state }
    - { number: 0 }
limits:
  max_steps: 100000
  max_time_ns: 10000
assertions:
  - entry_result: { equals: 0 }
  - port_value: { port: sensor_mv, equals: 0 }
  - port_value: { port: user_led_state, equals: 0 }
  - digital_edges: { port: user_led_drive, count: 0 }
  - digital_edges: { port: user_led_state, count: 0 }
