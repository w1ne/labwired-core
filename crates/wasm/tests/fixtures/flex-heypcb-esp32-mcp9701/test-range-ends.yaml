# `labwired test --script test-range-ends.yaml`. The MCP9701A specified range
# ends, -10 °C and +125 °C, plus 0 °C and an odd ambient. Calculated before
# the first run: -10 °C -> 205 mV -> -10.0; 0 °C -> 400 mV -> 0.0;
# 125 °C -> 2837.5 mV, truncated to 2837 mV -> 124.9 (the lost half
# millivolt and the integer division lose 0.1 °C); 25.37 °C -> 894.715 mV ->
# 894 mV -> 25.3. The indicator is on only at 125 °C.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - call: { export: setup, args: [{ port: sensor_mv }, { port: user_led_drive }] }
  - set: { port: ambient_c, value: -10 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 0 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 125 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 25.37 }
  - call: { export: loop }
limits:
  max_steps: 1000000
  max_time_ns: 10000000000
assertions:
  - entry_result: { equals: 102530 }
  - entry_result: { equals: 99000, step: 2 }
  - entry_result: { equals: 100000, step: 4 }
  - entry_result: { equals: 112491, step: 6 }
  - analog_window: { port: sensor_mv, min: 205, max: 2837 }
  - analog_sample: { port: sensor_mv, at_ns: 1000000, min: 205, max: 205 }
  - analog_sample: { port: sensor_mv, at_ns: 2001000000, min: 2837, max: 2837 }
  - analog_sample: { port: sensor_mv, at_ns: 3001000000, min: 894, max: 894 }
  - digital_edges: { port: user_led_drive, times_ns: [2001000000, 3001000000] }
  - port_value: { port: user_led_state, equals: 0 }
  - final_time_ns: { equals: 4000000000 }
  - console_contains: "T=-10.0 C\nT=0.0 C\nT=124.9 C ALARM\nT=25.3 C\n"
