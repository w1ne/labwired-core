# `labwired test --script test-below-threshold.yaml`. Negative control: the
# ambient stays below the 40.0 °C alarm level, so the indicator never turns
# on. 39.95 °C gives 1179.025 mV, truncated to 1179 mV, one millivolt under
# the 1180 mV alarm level -> 39.9 °C. Calculated before the first run.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - call: { export: setup, args: [{ port: sensor_mv }, { port: user_led_drive }] }
  - set: { port: ambient_c, value: 26 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 36 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 39.95 }
  - call: { export: loop }
limits:
  max_steps: 1000000
  max_time_ns: 10000000000
assertions:
  - entry_result: { equals: 103990 }
  - entry_result: { equals: 102600, step: 2 }
  - entry_result: { equals: 103600, step: 4 }
  - analog_window: { port: sensor_mv, min: 887, max: 1179 }
  - analog_crossings: { port: sensor_mv, level: 1180, direction: rising, count: 0 }
  - digital_edges: { port: user_led_drive, count: 0 }
  - digital_edges: { port: user_led_state, count: 0 }
  - final_time_ns: { equals: 3000000000 }
  - console_contains: "T=26.0 C\nT=36.0 C\nT=39.9 C\n"
