# Two independent instances of the registered Sharp distance-sensor model.
schema_version: 1
name: Dual Sharp GP2Y0A21 range indicators
assumptions:
  - "Source: Sharp GP2Y0A21YK0F datasheet, Fig. 2, typical white-paper output at 5 V and 90% reflectance: https://global.sharp/products/device/lineup/data/pdf/datasheet/gp2y0a21yk_e.pdf. Both sensor instances reuse the catalog's rounded graph read-offs."
  - Portable firmware samples both catalog outputs at 1 us model boundaries and uses a 1500 mV threshold.
unsupported_checks:
  - Reflector color, angle, optical geometry, ambient light, unit-to-unit tolerance, noise, ADC calibration, and sensor cross-talk are not modeled.
  - The approximately 38 ms measurement interval and up-to-5 ms output delay are not modeled; each output is available at its declared model boundary.
  - Below-range and beyond-range clamping are model assumptions, not claims about physical behavior outside the 10-80 cm measuring range.
  - Original target firmware, MCU instruction execution, ADC peripheral fidelity, and physical measurement are not modeled.
ports:
  - { name: left_distance_mm, signal: environment.left_distance_mm, access: write, kind: number, unit: mm, initial: 100 }
  - { name: left_distance_mv, signal: sensor.left.output_mv, access: read, kind: number, unit: mV }
  - { name: left_near_drive, signal: indicator.left_drive, access: write, kind: bool, initial: 0 }
  - { name: left_near_led, signal: indicator.left_state, access: read, kind: bool }
  - { name: right_distance_mm, signal: environment.right_distance_mm, access: write, kind: number, unit: mm, initial: 800 }
  - { name: right_distance_mv, signal: sensor.right.output_mv, access: read, kind: number, unit: mV }
  - { name: right_near_drive, signal: indicator.right_drive, access: write, kind: bool, initial: 0 }
  - { name: right_near_led, signal: indicator.right_state, access: read, kind: bool }
cosim_models:
  - id: left-sensor
    adapter: behavior
    step_ns: 1000
    inputs: { distance: environment.left_distance_mm }
    outputs: { voltage_mv: sensor.left.output_mv }
    config: { device_type: gp2y0a21 }
  - id: right-sensor
    adapter: behavior
    step_ns: 1000
    inputs: { distance: environment.right_distance_mm }
    outputs: { voltage_mv: sensor.right.output_mv }
    config: { device_type: gp2y0a21 }
  - id: left-indicator
    adapter: behavior
    step_ns: 1000
    inputs: { drive: indicator.left_drive }
    outputs: { state: indicator.left_state }
    config:
      behavior:
        primitive: gpio_device
        states: [off, on]
        outputs: [state]
        pin_defaults: { state: false }
        rules:
          - on: { input: drive }
            when: 'input(drive) != 0'
            do: [{ goto: on }, { pin: state, level: 1 }]
          - on: { input: drive }
            when: 'input(drive) == 0'
            do: [{ goto: off }, { pin: state, level: 0 }]
  - id: right-indicator
    adapter: behavior
    step_ns: 1000
    inputs: { drive: indicator.right_drive }
    outputs: { state: indicator.right_state }
    config:
      behavior:
        primitive: gpio_device
        states: [off, on]
        outputs: [state]
        pin_defaults: { state: false }
        rules:
          - on: { input: drive }
            when: 'input(drive) != 0'
            do: [{ goto: on }, { pin: state, level: 1 }]
          - on: { input: drive }
            when: 'input(drive) == 0'
            do: [{ goto: off }, { pin: state, level: 0 }]
