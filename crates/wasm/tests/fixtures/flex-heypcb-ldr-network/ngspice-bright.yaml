# `labwired test --script ngspice-bright.yaml`: the same sequence as
# test-bright.yaml solved by ngspice instead of the in-core engine. The 100 lx
# step is latched at the first 50 µs boundary; U4 is 3.77 kΩ, so C7 charges
# through R6 ∥ U4 with τ = 274 µs and SNS_AN1 settles at 2.3969 V. The firmware
# reads ADC count 2974 and lights the IO48 user LED.
schema_version: "1.0"
inputs:
  flex: system-ngspice.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: lux }
    - { port: sensor_v }
    - { port: user_led_drive }
    - { port: user_led_state }
    - { number: 100 }
limits:
  max_steps: 100000
  max_time_ns: 10000000
assertions:
  - entry_result: { equals: 2974 }
  - port_value: { port: sensor_v, min: 2.396, max: 2.398 }
  # The firmware makes, reads and clears the drive, so both signals end low.
  - port_value: { port: user_led_state, equals: 0 }
  - digital_edges: { port: user_led_drive, count: 2, times_ns: [4000000, 4001000] }
  - digital_edges: { port: user_led_state, count: 2, times_ns: [4001000, 4002000] }
  # Oscilloscope: SNS_AN1 starts at 1.32 V and settles at 2.3969 V through C7.
  # ngspice follows the analytic curve: 1.9648 V at 300 µs and 2.0370 V at
  # 350 µs. 63.2 % of the step is 2.001 V, crossed at the 350 µs sample.
  - analog_sample: { port: sensor_v, at_ns: 300000, min: 1.9640, max: 1.9660 }
  - analog_sample: { port: sensor_v, at_ns: 350000, min: 2.0360, max: 2.0380 }
  - analog_crossings: { port: sensor_v, level: 2.001, direction: rising, times_ns: [350000] }
  # After 2 ms (7 time constants of 274 µs) the node stays inside 3 mV.
  - analog_window: { port: sensor_v, from_ns: 2000000, min: 2.395, max: 2.398 }
  # The node never leaves the range between its two operating points.
  - analog_window: { port: sensor_v, min: 1.319, max: 2.398 }
  - final_time_ns: { equals: 4002000 }
