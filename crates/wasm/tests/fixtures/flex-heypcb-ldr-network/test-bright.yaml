# `labwired test --script test-bright.yaml`: run the portable firmware against
# the Flex model at 100 lx. `inputs.flex` selects portable execution; no ESP32
# CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: lux }
    - { port: sensor_v }
    - { port: user_led_drive }
    - { port: user_led_state }
    - { number: 100 }
limits:
  max_steps: 100000
  max_time_ns: 10000000
assertions:
  - entry_result: { equals: 2974 }
  - port_value: { port: sensor_v, min: 2.396, max: 2.398 }
  - port_value: { port: user_led_state, equals: 0 }
  - digital_edges: { port: user_led_drive, count: 2 }
  - digital_edges: { port: user_led_state, count: 2 }
