# `labwired test --script test-overtemp-alarm.yaml`. Once a second the
# firmware reads U4 in millivolts on IO1, converts with the MCP9700 transfer
# function and drives the IO48 LED. The test bench steps the ambient
# 25 -> 41 -> 39 -> 37 °C. The indicator goes on at 41 °C, stays on at 39 °C
# (hysteresis: on at 40.0 °C, off below 38.0 °C) and goes off at 37 °C.
# `loop` returns (10,000 + T in tenths of °C) x 10 + LED.
# All expected values were calculated before the first run from
# V_out = 500 mV + 10 mV/°C (truncated to whole mV) and the firmware timing:
# a step set at k s reaches the output at the next 1 ms boundary, where the
# firmware samples it.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
sequence:
  - call: { export: setup, args: [{ port: sensor_mv }, { port: user_led_drive }] }
  - call: { export: loop }
  - set: { port: ambient_c, value: 41 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 39 }
  - call: { export: loop }
  - set: { port: ambient_c, value: 37 }
  - call: { export: loop }
limits:
  max_steps: 1000000
  max_time_ns: 10000000000
assertions:
  - entry_result: { equals: 103700 }
  - entry_result: { equals: 0, step: 0 }
  - entry_result: { equals: 102500, step: 1 }
  - entry_result: { equals: 104101, step: 3 }
  - entry_result: { equals: 103901, step: 5 }
  # Oscilloscope: 750, 910, 890, 870 mV.
  - analog_sample: { port: sensor_mv, at_ns: 1000000, min: 750, max: 750 }
  - analog_sample: { port: sensor_mv, at_ns: 2001000000, min: 890, max: 890 }
  - analog_window: { port: sensor_mv, min: 750, max: 910 }
  - analog_crossings: { port: sensor_mv, level: 900, direction: rising, times_ns: [1001000000] }
  - analog_crossings: { port: sensor_mv, level: 880, direction: falling, times_ns: [3001000000] }
  - digital_edges: { port: user_led_drive, times_ns: [1001000000, 3001000000] }
  - digital_edges: { port: user_led_state, times_ns: [1001001000, 3001001000] }
  - port_value: { port: user_led_state, equals: 0 }
  - final_time_ns: { equals: 4000000000 }
  - console_contains: "T=25.0 C\nT=41.0 C ALARM\nT=39.0 C ALARM\nT=37.0 C\n"
