# `labwired test --script test-pulse.yaml`. The firmware pulses U1.PD6 once and checks both green LED logic states.
# `inputs.flex` selects portable execution; no target CPU or peripheral is emulated.
schema_version: "1.0"
inputs:
  flex: system.yaml
  firmware: firmware.wasm
entry:
  export: run
  args:
    - { port: u1_pd6 }
    - { port: d1_state }
    - { port: d2_state }
    - { number: 0 }
limits:
  max_steps: 100000
  max_time_ns: 10000
assertions:
  - entry_result: { equals: 1 }
  - port_value: { port: d1_state, equals: 0 }
  - port_value: { port: d2_state, equals: 0 }
  - digital_edges: { port: u1_pd6, count: 2 }
  - digital_edges: { port: d1_state, count: 2 }
  - digital_edges: { port: d2_state, count: 2 }
