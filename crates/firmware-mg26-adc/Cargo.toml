[package]
name = "firmware-mg26-adc"
version.workspace = true
edition = "2021"

[dependencies]
panic-halt = "0.2"

[[bin]]
name = "firmware-mg26-adc"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Link at 0x08008000 so the image can be XMODEM'd into the UART bootloader.
app-slot = []
