schema_version: "1.0"
# Starved classic-ESP32 MWDT: must latch, then clear through INT_CLR_TIMERS.
# Run from the repository root:
#   labwired test --script crates/core/tests/fixtures/esp32-classic-wdt/wdt_starve.test.yaml
inputs:
  firmware: wdt_starve.elf
  system: ../../../../../configs/systems/esp32-devkitm-1.yaml
limits:
  max_steps: 20000000
  wall_time_ms: 120000
  max_uart_bytes: 4096
  stop_when_assertions_pass: true
  stop_when_assertions_pass_settle_steps: 1000
assertions:
  - uart_contains: "WDT_FIRED"
  - uart_contains: "WDT_CLEARED"
