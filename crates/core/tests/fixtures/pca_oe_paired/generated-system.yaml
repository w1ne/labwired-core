    type: "pca9685"
    connection: "i2c0"
    route:
      sda: "GPIO8"
      scl: "GPIO9"
    config:
      i2c_address: 0x41
  - id: "servo0"
    type: "servo"
    connection: "i2c0"
    config:
      source_address: 64
      source_channel: 0
      source_oe_pin: "GPIO3"
      model: "sg90"
