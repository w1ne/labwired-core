name: "playground-board"
chip: "inline"
cpu_hz: 160_000_000
debug_uart: "usb_serial_jtag"
external_devices:
  - id: "pca_a"
    type: "pca9685"
    connection: "i2c0"
    route:
      sda: "GPIO8"
      scl: "GPIO9"
    config:
      i2c_address: 0x40
