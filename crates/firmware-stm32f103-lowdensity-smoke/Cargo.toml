# Register-level STM32F103x4/x6 smoke for the low-density IDCODE, USART2,
# and PA5 output. See examples/stm32f103c6-smoke/README.md for the test.
[package]
name = "firmware-stm32f103-lowdensity-smoke"
version = "0.1.0"
edition = "2021"
authors = ["LabWired Team"]
license = "MIT"

[dependencies]
cortex-m-rt = "0.7"
panic-halt = "0.2"

[[bin]]
name = "firmware-stm32f103-lowdensity-smoke"
path = "src/main.rs"
test = false
bench = false
