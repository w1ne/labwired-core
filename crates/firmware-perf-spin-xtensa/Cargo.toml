#
# Standalone crate, excluded from the workspace: it needs the `esp` toolchain
# (espup) and a build-std .cargo/config.toml that only applies when cargo runs
# inside this directory. Built by scripts/perf/board_perf.py, one target per
# Xtensa part.

[package]
name = "perf-spin-xtensa"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Xtensa throughput fixture for the per-board perf gate: a bare ALU spin loop."

[features]
esp32 = ["esp-hal/esp32", "esp-backtrace/esp32"]
esp32s3 = ["esp-hal/esp32s3", "esp-backtrace/esp32s3"]

[dependencies]
esp-hal = { version = "1.1", features = ["unstable"] }
esp-backtrace = { version = "0.19", features = ["panic-handler"] }

[[bin]]
name = "perf-spin-xtensa"
path = "src/main.rs"
test = false
bench = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = true # keep DWARF so the simulator can resolve symbols
